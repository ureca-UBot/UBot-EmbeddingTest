의 문자를 받아야 합니다. 매장에서 가족 결합을 신청할 때는 발급 3개월 이내의 가족관계증명서가 필요합니다."], "154": ["신규 가입하면서 가족 결합을 같이 신청할 수 있나요?", "신규 가입과 동시에 가족 결합을 신청할 수 있습니다. 신규 가입과 함께 신청한 가족 결합 할인은 신청 다음 달 청구분부터 적용됩니다."], "811": ["우리 가족 결합에 회선을 몇 개 더 넣을 수 있어요?", "회원의 가족 결합 정보를 조회해 현재 묶인 회선 수와 추가 가능한 회선 수를 안내해 드립니다. 가족 결합에는 휴대폰 회선을 최대 5개까지 넣을 수 있습니다."], "307": ["어디까지 가족으로 인정되나요?", "가족관계증명서로 가족임을 확인할 수 있으면 가족 결합을 신청할 수 있습니다. 가족 결합은 휴대폰 회선을 최대 5개까지 묶을 수 있습니다."], "1857": ["가족 결합 뜻은 무엇인가요?", "가족의 통신 회선을 정해진 조건에 따라 묶어 할인 혜택을 받는 상품이나 방식입니다."], "1370": ["가족 결합에서 가족의 범위는 어디까지인가요?", "Ubot 가족 결합에서는 본인과 배우자, 본인·배우자의 부모·자녀·형제자매, 손자녀까지 가족으로 인정합니다. 가족관계증명서로 관계가 확인되면 따로 살아도 가족 결합에 가입할 수 있습니다."], "388": ["명의 변경하고 가족 결합까지 한 번에 할 수 있는 매장이 근처에 있나요?", "현재 위치 주변에서 명의 변경과 가족 결합을 모두 취급하는 매장을 찾아 드립니다. 명의 변경과 가족 결합을 함께 신청하려면 명의 변경 동의서와 발급 3개월 이내의 가족관계증명서를 준비해 주세요."], "1010": ["가족 결합 상품의 대표자를 다른 가족으로 바꾸려면 어떻게 하나요?", "가족 결합 상품의 대표자를 바꾸려면 먼저 이용 중인 결합 상품에서 대표자 변경이 가능한지와 필요한 명의자 동의·서류를 확인해 주세요. 가족 결합 대표자 변경이 가능하다면 해당 상품이 지원하는 앱·고객센터·매장 등의 채널에서 신청할 수 있습니다."], "967": ["제 번호가 가족 결합에 들어가 있나요?", "회원의 결합 정보를 조회해 가족 결합 가입 여부와 묶인 회선 수를 안내해 드립니다."], "172": ["데이터 쉐어링은 어디에서 신청하나요?", "데이터 쉐어링은 앱의 부가서비스 메뉴나 고객센터, 매장에서 신청할 수 있습니다. 데이터 쉐어링은 5G 스탠다드 이상 요금제에서 본인 명의 서브 회선을 최대 2개까지 연결할 수 있습니다."], "699": ["지금 제가 쓰는 요금제가 쉐어링 되는 요금제인지 확인해 주세요.", "회원이 사용 중인 요금제를 조회해 데이터 쉐어링 이용 가능 여부를 안내해 드립니다. 데이터 쉐어링은 5G 스탠다드 이상 요금제에서 이용할 수 있습니다."], "96": ["데이터 공유 전용 회선을 사용할 수 있나요?", "지원 요금제에서는 데이터 공유용 추가 회선을 이용할 수 있습니다."], "173": ["쉐어링으로 태블릿이 쓴 데이터는 어디에서 보나요?", "태블릿이 쉐어링으로 사용한 데이터는 앱의 사용량 화면에 테더링 데이터와 합산되어 표시됩니다. 태블릿 쉐어링과 테더링은 합쳐서 요금제별 제공량 안에서 사용합니다."], "877": ["쉐어링으로 연결한 태블릿이 쓸 수 있는 데이터가 얼마나 남았어요?", "회원의 데이터 쉐어링 정보를 조회해 연결된 태블릿 서브 회선에서 더 쓸 수 있는 데이터를 안내해 드립니다."], "174": ["쉐어링 데이터를 다 쓰면 태블릿은 어떻게 되나요?", "태블릿 쉐어링의 합산 데이터 제공량을 모두 사용하면 쉐어링 연결이 제한됩니다. 태블릿에서 계속 데이터를 쓰려면 데이터를 추가 충전하거나 태블릿을 데이터 전용 요금제로 개통할 수 있습니다."], "698": ["제 회선에 쉐어링으로 연결된 기기가 몇 개예요?", "회원의 데이터 쉐어링 정보를 조회해 현재 연결된 서브 회선 수와 기기를 안내해 드립니다. 데이터 쉐어링 서브 회선은 최대 2개까지 연결할 수 있습니다."], "1393": ["자급제폰도 서비스센터에서 수리받을 수 있나요?", "자급제 휴대폰도 통신사와 관계없이 제조사 서비스센터에서 같은 보증 조건으로 수리받을 수 있습니다."], "1139": ["자급제나 다른 통신사에서 산 태블릿도 태블릿 요금제에 가입할 수 있나요?", "LTE나 5G를 지원하는 태블릿이라면 자급제 제품이나 다른 통신사에서 산 기기도 Ubot 태블릿 요금제에 가입할 수 있습니다. Ubot 태블릿 요금제는 휴대폰에서 이용할 수 없습니다."], "862": ["제 폰이 자급제로 등록돼 있는지 알려 주세요.", "회원의 단말 정보를 조회해 자급제 단말 여부를 안내해 드립니다."], "1777": ["자급제폰 뜻이 무엇인가요?", "통신사 가입과 별개로 구매해 호환되는 회선의 SIM이나 eSIM을 넣어 사용하는 휴대폰입니다."], "1254": ["자급제폰으로 긴급 전화(112, 119)를 걸 수 있나요?", "자급제 휴대폰도 개통 여부와 통신사에 관계없이 112, 119 같은 긴급 전화를 걸 수 있습니다."], "427": ["자급제 폰을 샀는데 개통 도와줄 매장이 근처에 있나요?", "현재 위치 주변에서 자급제 휴대폰의 유심이나 eSIM 개통을 도와드리는 매장을 찾아 드립니다. 자급제 휴대폰을 개통하려고 매장에 방문할 때는 신분증을 지참해 주세요."], "1605": ["자급제 휴대폰에서 기존 회선을 사용하려면 무엇을 확인해야 하나요?", "자급제 휴대폰에서 기존 회선을 사용하려면 새 휴대폰의 통신망과 유심 또는 eSIM 지원 여부를 확인해 주세요. 기존 회선을 자급제 휴대폰으로 옮긴 뒤 연결되지 않으면 유심 장착, 회선 상태, 단말 등록 필요 여부를 고객센터나 개통 채널에서 점검받아 주세요."], "1064": ["자급제폰이나 중고폰도 온라인으로 가입할 수 있나요?", "국내 전파 인증을 받은 자급제폰과 분실·도난 신고가 없는 중고폰은 유심이나 eSIM으로 온라인 가입할 수 있습니다."], "326": ["초기화한 휴대폰을 다시 쓰려면 어떻게 하나요?", "초기화한 휴대폰은 유심을 끼우거나 eSIM을 다시 발급받으면 이용할 수 있습니다. 초기화한 휴대폰의 eSIM은 앱에서 본인 확인 후 발급받을 수 있습니다."], "317": ["휴대폰을 반납하기 전에 무엇을 해야 하나요?", "휴대폰을 반납하기 전에는 개인정보 보호를 위해 기기를 초기화하고 계정에서 로그아웃한 뒤 유심이나 eSIM을 제거해 주세요."], "1102": ["알뜰폰으로 옮기려면 어디에 신청하나요?", "알뜰폰으로 옮기려면 옮겨 갈 알뜰폰 사업자에 번호이동을 신청하면 됩니다. 알뜰폰 번호이동이 개통되면 Ubot 회선은 자동 해지되므로 Ubot에 따로 해지를 신청하지 않아도 됩니다."], "137": ["이 통신사에서 알뜰폰으로 옮기려면 어디에 신청하나요?", "알뜰폰으로 옮기려면 옮겨 갈 알뜰폰 사업자에 번호이동을 신청하면 됩니다. 알뜰폰 번호이동으로 새 회선이 개통되면 기존 회선은 자동 해지됩니다."], "226": ["미납으로 정지된 회선을 다시 쓰려면 어떻게 하나요?", "미납으로 정지된 회선은 미납 요금을 납부하면 다시 이용할 수 있습니다. 정지된 회선의 미납 요금은 앱, 가상계좌 또는 매장에서 납부할 수 있습니다."], "1": ["휴대폰 신규 가입은 어떻게 하나요?", "휴대폰 신규 가입은 본인 인증 후 온라인 또는 매장에서 할 수 있습니다."], "1862": ["재가입 뜻은 무엇인가요?", "종료한 서비스나 회선을 다시 가입하는 것입니다. 기존 번호의 재사용 가능 여부는 별도 확인이 필요합니다."], "1154": ["선불 요금제는 어떻게 충전하나요?", "Ubot 선불 요금제는 앱·홈페이지, 고객센터, 매장에서 5,000원, 10,000원, 30,000원, 50,000원 단위로 충전할 수 있습니다. 선불 충전 금액은 충전일부터 1년 안에 사용해야 하며 남은 금액은 소멸됩니다."], "1657": ["선불 요금제의 충전 잔액은 어디서 확인하나요?", "선불 요금제 충전 잔액은 서비스 제공 사업자의 앱·홈페이지·ARS 등 지원되는 방법으로 조회하세요. 선불 충전 잔액과 데이터 잔여량은 서로 다른 항목일 수 있으므로 확인하려는 항목을 구분해 조회하세요."], "1153": ["선불 요금제가 있나요?", "Ubot은 외국인등록증이 없는 외국인과 단기 이용자를 위한 선불 요금제를 제공합니다. Ubot 선불 요금제는 매장이나 고객센터에서 가입하며 충전한 금액만큼 사용하는 방식입니다."], "1655": ["선불 휴대폰은 충전하지 않으면 번호가 없어지나요?", "선불 회선은 충전 금액·상품에 정해진 사용기간이 있고 기간이 지나면 이용 제한이나 해지로 이어질 수 있습니다. 선불 번호를 유지하려면 충전 잔액뿐 아니라 해당 상품의 만료일과 번호 유지 조건을 확인하세요."], "1220": ["선불 요금제에서도 데이터를 쓸 수 있나요?", "선불 요금제도 충전 잔액이 있는 동안 데이터를 사용할 수 있으며 잔액을 모두 쓰면 데이터가 차단됩니다. 선불 요금제에서도 Wi-Fi는 충전 잔액과 관계없이 이용할 수 있습니다."], "1101": ["선불폰에서 후불 요금제로 번호이동하면 충전 잔액은 어떻게 되나요?", "선불 충전 잔액은 후불 요금제나 다른 통신사로 이어지지 않고 번호이동할 때 소멸됩니다. 선불폰의 번호이동을 14일 안에 철회하면 충전 잔액이 복구됩니다. 선불폰에서 후불 요금제로 옮길 계획이라면 가능하면 충전 잔액을 다 쓴 뒤 번호이동하는 것이 좋습니다."], "1151": ["데이터가 모자라면 추가로 살 수 있나요?", "데이터가 모자라면 Ubot 앱에서 데이터 플러스 1GB(월 3,300원), 5GB(월 9,900원), 10GB(월 14,900원) 중 하나에 가입할 수 있습니다. 데이터 플러스는 매월 자동 갱신되므로 더 필요하지 않을 때는 해지해 주세요."], "1155": ["선불 요금제 잔액이 없으면 어떻게 되나요?", "선불 요금제 잔액을 모두 사용하면 전화 발신과 데이터가 차단되고 통화 중 잔액이 떨어지면 안내음 후 통화가 끊어집니다. 선불 요금제는 잔액이 없어도 충전 유효기간 동안 전화를 받을 수 있습니다."], "109": ["데이터 추가 충전은 어디에서 신청하나요?", "데이터 추가 충전은 앱의 데이터 충전 메뉴에서 바로 구매하거나 고객센터를 통해 신청할 수 있습니다."], "1185": ["남은 단말 할부금을 한 번에 낼 수 있나요?", "남은 단말 할부금의 전체 또는 일부는 고객센터(114)나 매장에서 한 번에 낼 수 있습니다. 앱에서는 남은 단말 할부금을 조회만 할 수 있습니다."], "938": ["폰 할부 몇 번 더 내야 해요?", "회원의 단말 할부 정보를 조회해 남은 납부 회차를 안내해 드립니다."], "772": ["지금 할부를 한 번에 갚으면 얼마를 내야 해요?", "회원의 단말 할부 정보를 조회해 오늘 한 번에 갚을 때 필요한 중도 완납 금액을 안내해 드립니다. 단말 할부를 중도 완납할 때는 남은 원금만 납부하면 됩니다."], "214": ["할부를 다 갚으면 약정도 같이 끝나나요?", "단말 할부와 선택약정은 별개라 할부를 완납해도 약정은 만료일까지 유지됩니다."], "1421": ["해지하면 남은 단말 할부금은 어떻게 되나요?", "휴대폰 회선을 해지해도 남은 단말 할부금은 원래 일정대로 매월 청구됩니다. 해지하면서 단말 할부금을 한 번에 정리하려면 매장이나 고객센터에서 남은 할부금을 일시 납부할 수 있습니다."], "1396": ["휴대폰 할부는 몇 개월까지 가능한가요?", "휴대폰 할부는 12개월, 24개월, 36개월 중에서 고를 수 있으며 연 5.9%의 할부 수수료가 남은 원금 기준으로 매월 붙습니다. 휴대폰을 일시불로 구매하면 할부 수수료가 없습니다."], "1548": ["제 휴대폰 할부는 언제 끝나나요?", "로그인하면 회원님 회선의 할부 시작일과 종료 예정일, 할부 상태(진행 중·완납)를 조회해 안내해 드립니다."], "121": ["휴대폰 요금 납부일은 언제인가요?", "휴대폰 요금의 기본 납부일은 매월 21일입니다. 휴대폰 요금을 자동이체로 납부한다면 납부일을 10일, 15일, 21일, 25일 중에서 선택할 수 있습니다."], "900": ["이번 달 할부금 얼마 나가요?", "회원의 이번 달 청구 내역을 조회해 단말 할부금을 안내해 드립니다."], "216": ["할부 개월 수를 중간에 바꿀 수 있나요?", "단말기 할부 개월 수와 같은 할부 조건은 구매 시점에 정해집니다. 남은 할부 부담을 줄이려면 앱이나 매장에서 중도 완납할 수 있습니다."], "1660": ["집 와이파이의 이름을 바꾸려면 어떻게 하나요?", "집 와이파이 이름은 공유기 관리 화면이나 제조사 앱의 무선 네트워크 설정에서 SSID를 변경하면 됩니다. 와이파이 이름을 저장하면 기존 이름으로 연결된 기기는 새 이름을 선택해 다시 연결해야 할 수 있습니다."], "1659": ["와이파이 비밀번호는 어디에서 바꾸나요?", "와이파이 비밀번호는 연결된 공유기의 관리 화면이나 제조사 앱에서 변경할 수 있습니다. 와이파이 비밀번호를 저장하면 기존 기기의 연결이 끊길 수 있으므로 새 비밀번호로 다시 연결하세요."], "267": ["급한 일이 생기면 어디로 연락해야 하나요?", "휴대폰 분실·도난은 고객센터 자동응답, 앱 또는 홈페이지에서 24시간 365일 신고할 수 있습니다. 해외에서 휴대폰 분실·도난을 신고하려면 +82-2-1500-0000으로 연락해 주세요."], "1490": ["통신 장애가 생겼는지 어디에서 확인하나요?", "현재 통신 장애 지역과 복구 예정 시간은 Ubot 앱 첫 화면과 홈페이지의 장애 안내에서 확인할 수 있습니다. 통신 장애로 서비스를 쓰지 못한 시간에 대해서는 약관에 따라 요금을 감면해 드립니다."], "1615": ["실내에서 통화가 잘 안 되면 통신 품질 개선을 요청할 수 있나요?", "실내 통화가 잘 안 되면 문제가 나는 장소와 시간, 통화 끊김 또는 수신 불량 증상을 기록해 고객센터의 통신 품질 상담 채널에 점검을 요청해 주세요. 실내 통화 품질 점검에서는 단말 설정과 해당 지역의 망 상태를 함께 확인받을 수 있습니다. 실내 통화 품질 개선 방법은 점검 결과에 따라 안내됩니다."], "18": ["데이터 속도가 갑자기 느려졌어요.", "모바일 데이터 속도가 갑자기 느려졌다면 데이터 제공량을 소진했거나 네트워크가 혼잡할 수 있습니다."], "83": ["통신 서비스 장애가 발생했는지 확인하고 싶어요.", "통신 서비스 장애 여부는 통신사 홈페이지나 고객센터의 장애·점검 안내에서 확인할 수 있습니다."], "265": ["요금이 이상한데 어디에 물어보나요?", "휴대폰 요금이 이상하다면 앱의 청구 내역에서 항목별 금액을 먼저 확인하고 궁금한 점은 고객센터로 문의해 주세요. 요금 문의를 위한 고객센터 상담원 운영시간은 평일 09:00~18:00입니다."], "318": ["알뜰폰을 쓰는데 요금 문의는 어디에 하나요?", "알뜰폰 요금은 해당 알뜰폰 사업자의 고객센터에 문의해 주세요. 알뜰폰이 통신사 망을 사용하더라도 요금과 가입 업무는 알뜰폰 사업자가 담당합니다."], "1314": ["해외에서 휴대폰을 잃어버리면 어디로 연락하나요?", "해외에서 휴대폰을 잃어버리면 Ubot 앱·홈페이지에서 분실 신고를 하거나 다른 전화로 Ubot 로밍 고객센터(24시간, 번호는 홈페이지 로밍 메뉴에 안내)에 연락해 회선을 정지해 주세요. 휴대폰 분실로 회선을 정지한 동안에는 로밍 요금이 발생하지 않습니다."], "1004": ["로밍 상품을 신청했는데 해외 현지에서 모바일 데이터가 안 되면 어떻게 하나요?", "로밍 상품에 가입했는데 해외에서 모바일 데이터가 연결되지 않으면 방문 국가가 상품 지원 지역인지, 사용 시작 시점이 지났는지, 휴대폰의 데이터 로밍 설정과 현지 망 접속 상태를 확인해 주세요. 해외에서 휴대폰을 재시작한 뒤에도 모바일 데이터가 연결되지 않으면 공식 로밍 상담 채널에 국가와 증상을 알려 점검을 요청해 주세요."], "309": ["IPTV만 따로 가입할 수 있나요?", "IPTV만 단독으로 가입할 수 있습니다. IPTV 베이직은 월 16,500원이고 프리미엄은 월 22,000원이며 두 상품 모두 셋톱박스 임대가 포함됩니다. IPTV 결합 할인은 인터넷과 함께 이용할 때 적용됩니다."], "1815": ["IPTV 뜻이 무엇인가요?", "인터넷 프로토콜 기반 망을 이용해 실시간 채널이나 주문형 영상을 제공하는 TV 서비스입니다."], "1679": ["IPTV에서 넷플릭스 같은 OTT 앱을 사용할 수 있나요?", "IPTV 셋톱박스가 해당 OTT를 지원하면 제공 앱이나 앱스토어에서 실행할 수 있습니다. IPTV에서 OTT를 이용하려면 별도 계정·구독이 필요할 수 있습니다. OTT 요금이 IPTV 이용료에 포함되는지는 가입 상품을 확인해야 합니다."], "1677": ["IPTV에서 유료 콘텐츠 구매 비밀번호를 설정하려면 어떻게 하나요?", "IPTV에서 유료 콘텐츠 구매 비밀번호를 설정하려면 IPTV 설정의 구매 인증·구매 비밀번호 메뉴에서 결제 전 인증을 설정할 수 있는지 확인하세요. IPTV의 간편 구매가 켜져 있다면 해당 옵션도 점검해 주세요. 구매 비밀번호 설정 경로는 사용하는 IPTV 서비스의 안내를 따르세요."], "1673": ["IPTV에서 신호 없음 화면이 나오면 어떻게 하나요?", "IPTV에서 신호 없음 화면이 나오면 TV 외부 입력이 셋톱박스가 연결된 HDMI로 선택됐는지 확인하세요. IPTV 신호가 없으면 셋톱박스 전원과 HDMI 케이블 연결도 점검해 주세요. 신호 없음 문제가 계속되면 다른 케이블이나 단자로 비교한 뒤 고객센터에 문의하세요."], "302": ["IPTV는 월 얼마인가요?", "IPTV 베이직 요금은 월 16,500원, 프리미엄 요금은 월 22,000원이며 두 상품 모두 셋톱박스 임대가 포함되어 있습니다."], "972": ["제 IPTV가 결합 할인에 묶여 있는지 확인해 주세요.", "회원의 결합 정보를 조회해 IPTV 결합 여부와 할인 금액을 안내해 드립니다."], "970": ["IPTV 요금이 이번 달 얼마 나왔어요?", "회원의 IPTV 청구 내역을 조회해 이번 달 요금과 결합 할인을 안내해 드립니다."], "311": ["IPTV만 빼고 인터넷은 유지할 수 있나요?", "인터넷을 유지하면서 IPTV만 해지할 수 있습니다. IPTV만 해지하면 IPTV 결합 할인은 종료되지만 휴대폰과 인터넷의 홈 결합 할인은 가입 조건을 유지하는 한 계속 적용됩니다."], "1297": ["로밍 상품 요금은 얼마인가요?", "로밍 상품 요금은 국가와 관계없이 데이터 사용 24시간 구간마다 베이직 1GB 11,000원, 플러스 2GB 13,000원, 맥스 5GB 15,000원입니다. 로밍 상품은 데이터를 쓴 24시간 구간에만 요금이 부과되며 음성통화와 문자 요금은 포함되지 않습니다."], "1315": ["로밍 요금은 언제 청구되나요?", "해외 로밍 요금은 현지 통신사와 정산하는 과정 때문에 사용한 다음 달이나 그다음 달에 청구될 수 있습니다. 로밍 상품 요금은 보통 사용한 다음 달에 바로 청구됩니다."], "28": ["해외 데이터 로밍 요금은 어떻게 되나요?", "해외 데이터 로밍 요금은 방문 국가와 가입한 로밍 상품에 따라 달라집니다."], "828": ["해외에서 받은 전화도 요금이 나갔는지 보고 싶어요.", "회원의 로밍 이용 내역을 조회해 해외에서 받은 전화의 기록과 요금을 안내해 드립니다."], "1305": ["로밍 중 음성통화도 국내 요금제의 기본 제공량에서 차감되나요?", "국내 요금제의 기본 제공 음성·문자·데이터는 해외에서 쓸 수 없으므로 로밍 통화와 문자는 별도 로밍 요금으로 청구됩니다."], "975": ["지난번 여행 때 로밍 요금이 얼마 나왔었나요?", "회원의 로밍 이용 내역을 조회해 지난 여행의 로밍 요금을 안내해 드립니다."], "34": ["해외에서 전화를 받으면 요금이 발생하나요?", "해외에서 전화를 받을 때는 국가와 로밍 조건에 따라 수신 통화 요금이 발생할 수 있습니다."], "1302": ["해외에서 전화나 문자를 받으면 요금이 나오나요?", "해외에서 문자를 받는 것은 일반적으로 무료지만 국가별 로밍 조건을 확인해 주세요. 해외에서 음성통화를 받으면 국가별 분당 로밍 요금이 부과되지만 벨만 울리고 받지 않으면 요금이 없습니다."], "35": ["해외에서 문자 수신에도 요금이 발생하나요?", "해외에서 받는 문자는 일반적으로 무료지만 국가별 로밍 조건이 다를 수 있습니다."], "1316": ["로밍 요금 영수증을 받을 수 있나요?", "로밍 요금 영수증으로 Ubot 앱·홈페이지에서 로밍 이용 내역과 요금이 표시된 청구서를 내려받을 수 있습니다. 출장비 정산용 로밍 증빙이 필요하면 고객센터에 로밍 이용 확인서를 요청해 주세요."], "1031": ["착신전환은 어떻게 신청하고 요금은 얼마인가요?", "착신전환 부가서비스를 신청하면 음성 전화를 지정한 국내 번호로 돌릴 수 있으며 월 요금은 부가세를 포함해 1,100원입니다. 착신전환은 국제전화나 유료 특수번호로 설정할 수 없습니다."], "1630": ["듀얼심에서 전화를 걸 때 쓸 기본 회선을 바꾸려면 어떻게 하나요?", "듀얼심에서 전화를 걸 때 쓸 기본 회선은 휴대폰의 SIM 관리자 또는 셀룰러 설정에서 선택하세요. 일부 듀얼심 기기는 연락처별로 마지막 사용 회선이나 별도 지정 회선을 기억하므로 실제 발신 화면의 회선 표시도 확인하세요."], "1237": ["걸려 온 전화를 다른 번호로 돌릴 수 있나요?", "Ubot 착신전환(월 1,100원)에 가입하면 걸려 온 음성 전화를 원하는 국내 번호로 돌릴 수 있습니다. 착신전환은 국제번호나 유료 특수번호로 설정할 수 없습니다. 착신전환으로 연결된 통화에는 신청한 회선 기준의 통화료가 부과됩니다."], "1330": ["컬러링은 어떻게 쓰나요?", "Ubot 컬러링(월 990원)에 가입하면 전화를 건 사람에게 들리는 연결음을 기본 제공 음원 중에서 고를 수 있습니다. Ubot 컬러링의 유료 음원은 따로 구매하지 않습니다."], "41": ["휴대폰 요금 결제 카드를 변경하고 싶어요.", "휴대폰 요금 결제 카드는 요금 납부 관리 메뉴에서 변경할 수 있습니다."], "1464": ["명의도용을 미리 막을 수 있는 방법이 있나요?", "엠세이퍼(M-Safer)에서 가입 제한 서비스를 신청하면 다른 사람이 내 명의로 새 휴대폰을 개통하는 것을 막을 수 있습니다. 명의도용을 막으려면 신분증 사본을 함부로 보내지 말고 신분증을 잃어버렸다면 바로 분실 신고해 주세요."], "1519": ["명의도용 신고를 접수하는 매장이 어디인가요?", "명의도용 신고 접수를 지원하는 Ubot 매장을 찾아 드립니다. 명의도용 신고 접수를 위해 매장에 방문할 때는 신분증과 경찰 신고 접수증을 챙겨 주세요."], "1463": ["명의도용을 당한 것 같아요. 어떻게 해야 하나요?", "명의도용이 의심되면 바로 고객센터(114)에 신고하고 한국정보통신진흥협회의 명의도용 방지 서비스(엠세이퍼)에서 내 명의로 가입된 회선을 모두 조회해 주세요. 명의도용으로 확인된 회선은 경찰 신고 접수증과 함께 매장에서 해지할 수 있습니다."], "691": ["제가 번호도용 방지 서비스 신청해 뒀었나요?", "회원의 부가서비스 정보를 조회해 번호도용 방지 서비스 가입 여부를 안내해 드립니다. 번호도용 방지 서비스에 가입하지 않았다면 무료로 신청할 수 있습니다."], "951": ["번호도용 방지 서비스는 언제 신청했었나요?", "회원의 부가서비스 이력을 조회해 번호도용 방지 서비스 신청일을 안내해 드립니다."], "1032": ["피싱이 의심되는 링크나 전화를 알려 주는 서비스가 있나요?", "피싱 차단 부가서비스를 신청하면 위험 링크와 의심 전화를 알림으로 받을 수 있으며 월 요금은 부가세를 포함해 2,200원입니다. 피싱 차단 부가서비스는 금융 피해에 대한 보험이나 배상을 제공하지 않습니다."], "195": ["내 번호로 남이 가입하는 걸 막을 수 있나요?", "번호도용 방지 서비스를 신청하면 본인 모르게 내 번호로 신규 가입이나 번호이동이 이루어지는 것을 막을 수 있습니다. 번호도용 방지 서비스는 무료입니다."], "1465": ["가입 제한 서비스(엠세이퍼)를 해제하라는 안내를 받았어요.", "엠세이퍼 가입 제한이 걸려 있으면 본인도 새 휴대폰을 개통할 수 없습니다. 새로 개통하려면 엠세이퍼 홈페이지에서 본인인증 후 가입 제한을 잠시 해제하고 다시 진행해 주세요."], "1467": ["보이스피싱 피해를 막으려면 어떻게 해야 하나요?", "보이스피싱을 막으려면 통신사·은행·수사기관은 전화로 계좌 이체나 앱 설치를 요구하지 않는다는 점을 기억해 주세요. 보이스피싱이 의심되는 전화는 끊고 해당 기관의 공식 번호로 다시 확인해 주세요. Ubot 피싱가드(월 2,200원)에 가입하면 위험 링크와 의심 전화를 미리 알려 드립니다."], "1272": ["유심 보호 서비스는 무엇인가요?", "유심 보호 서비스는 유심을 다른 휴대폰에 꽂으면 통신을 차단해 유심 복제나 도용을 막는 무료 서비스입니다. 유심 보호 서비스는 앱이나 고객센터에서 가입할 수 있고 휴대폰을 바꿀 때는 잠시 해제해야 합니다."], "1081": ["번호이동 인증은 하루에 몇 번까지 할 수 있나요?", "번호이동을 위한 이전 통신사 인증은 하루 최대 7회까지 시도할 수 있습니다. 번호이동 인증을 하루에 7회 넘게 시도했다면 다음 날 다시 진행해 주세요."], "1012": ["휴대폰 본인 인증 문자가 오지 않으면 무엇을 확인하나요?", "휴대폰 본인 인증 문자가 오지 않으면 휴대폰의 신호·문자 수신 상태와 스팸 차단함, 인증 요청 횟수 제한 여부를 확인해 주세요. 일반 문자도 받지 못한다면 회선이나 기기 문제를 점검받아 주세요. 특정 서비스의 인증 문자만 오지 않는다면 해당 서비스의 문자 발송 상태를 문의해 주세요."], "1264": ["유심만 바꿔 끼우면 기기 변경이 자동으로 되나요?", "Ubot 유심을 다른 휴대폰에 끼우면 기기 정보가 자동으로 등록되어 별도 기기 변경 신청 없이 사용할 수 있습니다. 유심을 옮긴 뒤 기기 인증 실패가 나오면 휴대폰을 다시 켜고 계속되면 고객센터에서 기기 정보를 등록해 주세요."], "1474": ["안면인증이 계속 실패해요.", "안면인증이 실패하면 밝은 곳에서 안경·모자를 벗고 정면을 바라본 채 다시 시도해 주세요. 신분증 사진과 얼굴이 많이 달라 안면인증이 계속 실패하면 매장에서 신분증으로 본인 확인 후 가입할 수 있습니다."], "1877": ["본인인증 뜻은 무엇인가요?", "신청하거나 로그인하는 사람이 실제 본인인지 확인하는 절차입니다."], "229": ["분실 신고할 때 본인 확인은 어떻게 하나요?", "휴대폰 분실 신고를 할 때는 휴대폰 인증, 공동·금융 인증서, 신분증 촬영 중 하나로 본인 확인을 진행합니다. 분실 신고 중 휴대폰 인증이 어렵다면 다른 본인 확인 방법을 선택해 주세요."], "1059": ["개통은 됐는데 휴대폰이 안 돼요.", "휴대폰 개통은 됐는데 통신이 되지 않으면 휴대폰을 껐다 켜고 유심이 제대로 끼워졌는지 확인해 주세요. 개통 완료 문자를 받은 뒤 1시간이 지나도 휴대폰이 작동하지 않으면 고객센터(114)로 문의해 주세요."], "150": ["온라인으로 가입할 때 본인인증은 어떻게 하나요?", "온라인으로 휴대폰에 가입할 때는 휴대폰 인증, 공동·금융 인증서, 신분증 촬영 중 하나를 선택해 본인인증을 진행할 수 있습니다."], "128": ["제 회선 요금을 부모님 계좌로 내도록 할 수 있나요?", "가족 명의 계좌나 카드로 내 회선의 요금을 납부하도록 회선별 납부자를 지정할 수 있습니다."], "1164": ["다른 사람 명의의 계좌나 카드로 요금을 낼 수 있나요?", "가족처럼 다른 사람 명의의 계좌나 카드로도 휴대폰 요금을 낼 수 있습니다. 앱에서는 회선 명의자 본인 계좌만 등록할 수 있으므로 다른 사람 명의의 납부 수단은 고객센터에서 예금주·카드 명의자 동의를 받아 등록해 주세요."], "260": ["가족 회선 요금을 따로 내고 싶어요.", "가족 회선의 요금을 따로 내려면 회선별로 납부자를 지정할 수 있습니다. 가족 회선의 요금을 함께 내려면 하나로 묶어 통합 청구할 수도 있습니다."], "131": ["돌아가신 가족 명의 휴대폰 요금은 어떻게 정리하나요?", "돌아가신 가족 명의의 휴대폰 회선을 정리하려면 가족관계증명서와 사망 사실 확인 서류를 가지고 매장을 방문해 주세요. 매장에서 해당 회선의 해지 또는 명의 변경과 남은 요금 정리를 도와드립니다."], "930": ["등록된 아버지 회선이 시니어 요금제인지 확인해 주세요.", "명의자 동의로 등록된 아버지 회선을 조회해 현재 시니어 요금제에 가입돼 있는지 안내해 드립니다."], "122": ["매장에서 휴대폰 요금을 직접 낼 수 있나요?", "매장에서도 휴대폰 요금을 직접 납부할 수 있습니다. 휴대폰 요금을 매장에서 납부하려면 방문할 때 명의자 신분증을 지참해 주세요."], "1194": ["미성년 자녀의 청구서를 부모도 받을 수 있나요?", "앱이나 고객센터에서 법정대리인 동시 안내를 신청하면 미성년 자녀와 부모인 법정대리인에게 모바일 청구서를 함께 보내 드립니다."], "1130": ["데이터를 적게 쓰는데 저렴한 요금제가 있나요?", "데이터를 거의 쓰지 않는다면 실속 LTE 500MB/60분(월 3,300원)이나 통화와 문자만 쓰는 Ubot 통화 전용(월 4,900원)을 이용할 수 있습니다. 저렴한 5G 요금제로는 실속 5G 2GB/통화기본(월 6,000원)이 있으며 실속 요금제는 데이터를 다 쓰면 차단되고 약정이 없습니다."], "1443": ["대신 해지해 줄 사람을 미리 지정할 수 있나요?", "장기 입원이나 고령 등으로 직접 해지하기 어려울 때를 대비해 매장에서 해지 대리인을 미리 지정할 수 있습니다. 미리 지정된 해지 대리인은 본인 신분증만으로 해지를 신청할 수 있습니다."], "1050": ["법인이나 개인사업자 명의로 가입할 수 있나요?", "법인 명의 가입은 사업자등록증, 법인인감증명서, 재직증명서와 담당자 신분증을 가지고 매장에서 할 수 있습니다. 개인사업자 명의 가입은 사업자등록증과 대표자 신분증을 가지고 매장에서 할 수 있습니다."], "97": ["법인 명의로 가입할 수 있나요?", "법인 명의 휴대폰 회선은 법인 가입에 필요한 사업자 및 담당자 서류를 제출하면 가입할 수 있습니다."], "1098": ["개인 명의 휴대폰을 사업자 명의로 바꿀 수 있나요?", "개인과 같은 사람이 대표인 개인사업자 사이라면 개인 명의 휴대폰을 사업자 명의로 변경할 수 있습니다. 개인사업자 명의 변경을 하려면 사업자등록증과 대표자 신분증을 가지고 매장에 방문해 주세요."], "98": ["가입할 때 필요한 서류는 무엇인가요?", "휴대폰 가입에는 일반적으로 본인 신분증이 필요합니다. 가입 유형에 따라 추가 서류가 요구될 수 있습니다."], "133": ["법인 회선 요금의 세금계산서를 받을 수 있나요?", "법인 명의 회선은 고객센터에 사업자 정보를 등록하면 매월 세금계산서를 발급받을 수 있습니다."], "1883": ["데이터 이월 뜻은 무엇인가요?", "이번 사용 기간에 남은 데이터를 정해진 조건에 따라 다음 기간으로 넘기는 것입니다."], "72": ["남은 데이터를 다음 달로 넘길 수 있나요?", "남은 데이터는 데이터 이월을 지원하는 요금제에서 다음 달로 넘길 수 있습니다."], "880": ["제 데이터가 이번 달 며칠에 다 떨어졌었는지 알 수 있어요?", "회원의 일별 사용 내역을 조회해 이번 달 기본 데이터를 다 쓴 날짜를 안내해 드립니다."], "1205": ["데이터를 얼마나 썼는지 알림을 받을 수 있나요?", "기본 제공 데이터의 50%, 80%, 100%를 사용하면 데이터 사용량 알림 문자를 자동으로 보내 드립니다. 그달에 회선을 정지하거나 해제한 이력이 있다면 데이터 사용량 알림이 가지 않을 수 있습니다."], "1120": ["라이프 요금제 포인트는 언제까지 쓸 수 있나요?", "라이프 커피·교통·쇼핑 요금제의 월 5,000포인트는 발급된 달 말일에 만료되며 현금으로 환급받을 수 없습니다. 라이프 커피·교통·쇼핑 요금제의 새 포인트는 다음 달 1일에 다시 지급됩니다."], "74": ["청소년 전용 요금제가 있나요?", "청소년을 위한 전용 혜택이 포함된 요금제가 제공될 수 있습니다."], "1134": ["청소년이나 어린이용 요금제가 있나요?", "만 12세 이하 어린이는 Ubot 키즈 안심 요금제(월 6,900원~19,000원)에 가입할 수 있으며 자녀 위치 공유와 유해 사이트 차단을 제공하는 Ubot 키즈가드가 포함됩니다. 만 13세부터 18세까지의 청소년은 법정대리인 동의를 받아 일반 요금제에 가입할 수 있습니다."], "929": ["아이 회선 요금제가 청소년 요금제로 돼 있나요?", "명의자 동의로 등록된 자녀 회선을 조회해 현재 청소년 요금제에 가입돼 있는지 안내해 드립니다."], "390": ["아이 학교 근처에 청소년 요금제 가입되는 매장이 있나요?", "학교 주소를 알려 주시면 주변에서 청소년 요금제 가입을 위한 미성년자 가입 업무를 취급하는 매장을 찾아 드립니다. 미성년자 가입을 위해서는 법정대리인이 함께 방문해야 합니다."], "115": ["청소년 5G 요금제도 선택약정 할인이 되나요?", "청소년 5G도 선택약정 할인이 적용되어 월 45,000원에서 25% 할인된 33,750원으로 이용할 수 있습니다."], "1133": ["청년 요금제는 누가 가입할 수 있나요?", "Ubot 청년 요금제는 만 19세부터 34세까지 가입할 수 있으며 청년 5GB(월 19,000원)부터 청년 무제한(월 65,000원)까지 있습니다. 청년 요금제는 만 35세가 되는 달 말일까지 이용할 수 있고 이후에는 일반 요금제로 변경해야 합니다."], "1029": ["청년 요금제는 몇 살까지 가입할 수 있나요?", "청년 요금제는 만 19~34세가 가입 대상이며 만 35세가 되는 달 말일까지 이용할 수 있습니다. 청년 요금제 이용 기간이 끝나면 일반 요금제로 변경하는 상담을 받아야 합니다."], "757": ["제 청소년 요금제가 언제 일반 요금제로 바뀌나요?", "회원의 생년월일과 청소년 요금제를 조회해 일반 요금제로 자동 변경되는 달을 안내해 드립니다. 청소년 요금제는 만 20세가 되는 달의 다음 달에 5G 라이트로 변경됩니다."], "101": ["청소년 5G 요금제는 데이터를 다 쓰면 추가 요금이 나오나요?", "청소년 5G 요금제는 데이터 15GB를 모두 사용한 뒤에도 1Mbps로 계속 사용할 수 있어 데이터 추가 요금이 발생하지 않습니다."], "1114": ["청년 요금제 종류와 가격이 궁금해요.", "청년 요금제는 만 19~34세 전용으로 5GB(월 19,000원), 10GB(25,000원), 30GB(33,000원), 100GB(45,000원), 200GB(55,000원), 무제한(65,000원)이 있습니다. 청년 요금제는 모두 음성·문자를 기본 제공하며 100GB·200GB는 데이터를 다 쓴 뒤 5Mbps로 계속 이용할 수 있습니다."], "758": ["제 나이로 시니어 요금제에 가입할 수 있나요?", "회원의 나이와 가입 정보를 조회해 시니어 LTE 요금제 가입 조건을 충족하는지 안내해 드립니다. 시니어 LTE 요금제는 만 65세 이상이면 직접 신청할 수 있습니다."], "1137": ["시니어 요금제는 몇 살부터 가입할 수 있나요?", "만 65세 이상이면 Ubot 시니어 안심 요금제(월 3,900원~19,900원)에 가입할 수 있습니다. 만 65세가 되어도 시니어 요금제로 자동 변경되지 않으므로 앱이나 고객센터에서 직접 신청해 주세요."], "1115": ["시니어 안심 요금제 종류와 가격이 궁금해요.", "시니어 안심은 만 65세 이상 전용 LTE 요금제로 1GB(월 3,900원), 2GB(6,900원), 4GB(8,900원), 8GB(13,900원), 15GB(19,900원)가 있습니다. 시니어 안심 1GB는 음성 100분·문자 100건을 제공하며 나머지 시니어 안심 요금제는 음성·문자를 기본 제공합니다."], "102": ["만 65세가 되면 시니어 요금제로 자동으로 바뀌나요?", "만 65세가 되어도 시니어 LTE 요금제로 자동 변경되지 않습니다. 시니어 LTE 요금제로 바꾸려면 앱이나 고객센터에서 직접 신청해야 합니다."], "1379": ["부모님이나 자녀와 함께 쓰는 결합이 있나요?", "시니어 요금제 부모님과 함께 쓰는 Ubot 부모님 함께는 월 5,000원을 할인합니다. 키즈 요금제 자녀와 법정대리인이 함께 쓰는 Ubot 우리아이 함께는 월 4,000원을 할인합니다."], "1152": ["혜택이 포함된 요금제가 있나요?", "Ubot 라이프 요금제에는 음악, 영상, 커피, 교통, 쇼핑, 보안 중 한 가지 혜택이 포함됩니다. 라이프 커피 10GB(월 21,900원)는 매월 Ubot 카페 5,000포인트를 제공하며 이 포인트는 발급한 달 말일에 만료됩니다."], "155": ["제가 지금 몇 회선을 쓰고 있는지 알 수 있나요?", "현재 이용 중인 휴대폰 회선 수는 앱의 가입 정보에서 확인할 수 있습니다. 휴대폰 회선은 1인당 최대 5개까지 가입할 수 있습니다."], "1617": ["본인 명의 휴대폰의 통화 내역을 열람하려면 어떻게 신청하나요?", "본인 명의 휴대폰의 통화 내역 열람은 본인 확인과 개인정보 보호 절차가 필요한 업무입니다. 통화 내역의 열람 가능한 항목, 기간, 신청 채널과 필요 서류는 가입 통신사의 공식 고객센터나 앱에서 확인해 주세요. 타인의 통화 내역은 본인 명의 여부와 별도 권한 확인 없이 안내할 수 없습니다."], "333": ["소액결제로 무엇이 결제됐는지 보고 싶어요.", "소액결제로 결제된 항목은 앱의 소액결제 이용내역에서 건별로 확인할 수 있습니다. 소액결제 내역에 모르는 결제가 있다면 고객센터로 연락해 주세요."], "894": ["이번 달 청구될 금액 좀 알려 주세요.", "회원의 이번 달 청구 예정 금액과 주요 항목을 조회해 안내해 드립니다."], "324": ["제 휴대폰이 어떤 기기로 등록돼 있는지 보고 싶어요.", "앱의 가입 정보에서 사용 중인 단말 정보를 확인할 수 있습니다."], "702": ["어제 하루 동안 데이터를 많이 썼는데 얼마나 썼는지 보여 주세요.", "회원의 일별 데이터 사용 내역을 조회해 어제 하루 동안 쓴 데이터 용량을 안내해 드립니다."], "897": ["지난달 소액결제로 쓴 금액이 얼마예요?", "회원의 소액결제 이용내역을 조회해 지난달 이용 금액을 안내해 드립니다."], "170": ["테더링으로 쓴 데이터는 어디에서 확인하나요?", "테더링으로 사용한 데이터는 앱의 사용량 화면에서 쉐어링 데이터와 합산된 사용량으로 볼 수 있습니다. 테더링과 쉐어링에 제공되는 데이터는 5G 프리미엄 요금제에서 월 50GB, 5G 스탠다드 요금제에서 월 30GB입니다."], "62": ["문자 메시지를 받지 못하고 있어요.", "문자 메시지를 받지 못한다면 수신 차단 설정과 저장 공간, 네트워크 상태를 확인해 주세요."], "183": ["문자가 오가지 않을 때는 무엇을 확인하나요?", "문자가 오가지 않을 때는 저장 공간과 스팸 차단 설정을 확인하고 메시지 앱 설정을 점검한 뒤 휴대폰을 재부팅해 주세요."], "460": ["문자가 안 와서 매장에서 확인받고 싶은데 가까운 곳이 어디예요?", "문자가 오지 않는 문제를 상담할 수 있는 현재 위치 주변 매장을 찾아 드립니다. 문자가 오지 않는다면 매장 방문 전에 휴대폰 저장 공간과 차단 설정을 확인해 보세요."], "1687": ["긴급재난문자가 오지 않으면 무엇을 확인해야 하나요?", "긴급재난문자가 오지 않으면 휴대폰의 재난문자 수신 설정이 켜져 있는지 확인해 주세요. 안드로이드의 재난문자 수신 설정은 기종에 따라 설정 또는 메시지 앱의 ‘재난문자·긴급 알림’ 메뉴에서 확인할 수 있습니다. 아이폰의 재난문자 수신 설정은 ‘설정 → 알림’ 화면 하단에서 확인할 수 있습니다. 재난문자 수신 설정이 정상이어도 문자 발송 당시의 기지국·휴대폰 네트워크 상태에 따라 수신하지 못할 수 있습니다. 긴급재난문자 미수신 문제가 반복되면 기기 제조사나 통신사 고객센터에 문의해 주세요."], "61": ["문자 메시지가 전송되지 않아요.", "문자 메시지가 전송되지 않으면 통신 상태와 메시지 설정을 확인해 주세요."], "1229": ["문자가 보내지지 않아요.", "문자가 보내지지 않으면 휴대폰의 메시지 앱 설정과 저장 공간, 받는 번호를 확인해 주세요. 사진 문자만 보내지지 않는다면 모바일 데이터가 꺼져 있거나 APN 설정이 잘못됐을 수 있습니다."], "184": ["저장 공간이 부족하면 문자가 안 오나요?", "휴대폰 저장 공간이 부족하면 새 문자 메시지가 저장되지 않아 수신되지 않을 수 있습니다. 저장 공간 부족으로 문자가 오지 않는다면 오래된 대화를 정리한 뒤 다시 확인해 주세요."], "1231": ["재난 문자가 오지 않아요.", "재난 문자가 오지 않는다면 휴대폰 설정 > 안전 및 긴급(또는 알림) > 긴급 재난 문자가 켜져 있는지 확인해 주세요. 재난 문자는 기지국 단위로 발송되므로 같은 지역에서도 연결된 기지국에 따라 받지 못할 수 있습니다."], "1015": ["통화할 때 소리가 끊기거나 잡음이 들려요.", "통화할 때 소리가 끊기거나 잡음이 들리는 것은 특정 장소의 전파 상태나 단말기 설정 때문일 수 있습니다. 통화 품질이 나쁘다면 위치를 옮기고 휴대폰을 재부팅해 보세요. 위치를 옮기고 재부팅해도 통화 품질 문제가 계속되면 고객센터에 발생 장소와 시간을 알려 주세요."], "1223": ["건물 안이나 집에서만 통화가 잘 안 돼요.", "건물 구조나 지하처럼 전파가 약한 곳에서는 휴대폰 통화 품질이 떨어질 수 있습니다. 집 안에서 통화가 잘되지 않으면 휴대폰 설정에서 Wi-Fi 통화를 켜서 집 Wi-Fi로 통화할 수 있습니다. 집에서 Wi-Fi 통화를 이용해도 계속 불편하면 고객센터(114)에 통화 품질 점검을 신청해 주세요."], "1224": ["통화 중에 소리가 끊기거나 잡음이 생겨요.", "통화 중 소리가 끊기거나 잡음이 생기면 휴대폰을 재부팅하고 이어폰이나 케이스가 마이크를 가리지 않는지 확인해 주세요. 통화 중 잡음이나 끊김이 특정 장소에서만 반복되면 고객센터에 위치와 시간을 알려 주시면 품질을 점검해 드립니다."], "1234": ["스팸이나 불법 광고는 어디에 신고하나요?", "스팸이나 불법 광고는 휴대폰 메시지 앱의 스팸 신고 기능 또는 한국인터넷진흥원 불법스팸대응센터(국번 없이 118)에 신고할 수 있습니다. 스팸이나 불법 광고로 금전 피해를 입었다면 경찰청(112)에도 신고해 주세요."], "1243": ["통화 내역을 확인하고 싶어요.", "최근 6개월의 발신 통화 내역은 Ubot 앱의 이용 내역에서 상대 번호 일부가 가려진 상태로 볼 수 있습니다. 상대 번호 전체가 표시된 통화 내역은 명의자가 신분증을 가지고 매장에서 신청할 수 있습니다."], "1502": ["Ubot에 칭찬이나 불만을 접수하고 싶어요.", "Ubot에 대한 칭찬이나 불만은 Ubot 앱·홈페이지의 고객의 소리 메뉴에서 접수할 수 있습니다. 고객의 소리에 접수한 내용의 처리 결과는 문자와 이메일로 알려 드립니다. 급한 불편은 고객센터(114)로 연락해 주세요."], "228": ["상담원 운영시간이 아닌데 분실 신고를 하고 싶어요.", "상담원 운영시간이 아니어도 고객센터 자동응답으로 24시간 분실 신고를 할 수 있습니다. 분실 신고를 위해 휴대폰에서는 114, 일반전화에서는 1500-0000으로 연락해 주세요."], "712": ["최근에 제가 건 국제전화 내역을 보여 주세요.", "회원의 통화 내역을 조회해 최근에 건 국제전화 기록을 안내해 드립니다. 국제전화를 포함한 통화 내역은 최근 6개월까지 조회할 수 있습니다."], "1349": ["멤버십 등급은 어떻게 정해지나요?", "Ubot 멤버십 등급은 매년 1월 1일에 직전 6개월의 평균 월정액을 기준으로 정합니다. 멤버십 평균 월정액이 70,000원 이상이면 VIP, 40,000원 이상이면 골드, 그 외는 실버이며 신규 가입자는 가입 다음 달에 등급이 정해집니다."], "284": ["멤버십 등급은 어떻게 나뉘나요?", "멤버십 등급은 VIP, GOLD, SILVER 세 등급으로 나뉩니다. 멤버십 등급은 직전 6개월의 평균 월 요금을 기준으로 산정됩니다."], "1350": ["멤버십 등급은 어디에서 확인하나요?", "Ubot 앱의 멤버십 메뉴에서 현재 등급과 등급별 혜택, 남은 혜택 횟수를 확인할 수 있습니다."], "803": ["제 가입일 기준으로 멤버십 등급이 정해지는 날짜를 알려 주세요.", "회원의 휴대폰 가입일을 조회해 멤버십 등급이 정해지는 예정일을 안내해 드립니다. 신규 가입자의 멤버십 등급은 가입 다음 달 1일에 정해집니다."], "686": ["저 멤버십 등급이 뭐예요?", "회원의 멤버십 정보를 조회해 현재 등급과 올해 남은 제휴 할인 횟수를 안내해 드립니다."], "286": ["제 멤버십 등급을 어디에서 보나요?", "앱의 멤버십 메뉴에서 현재 등급과 남은 혜택 횟수를 확인할 수 있습니다."], "296": ["제 등급이 예상과 다른데 확인할 수 있나요?", "예상한 멤버십 등급과 실제 등급이 다르다면 앱의 멤버십 메뉴에서 현재 등급과 산정 기준을 확인할 수 있습니다. 멤버십 등급에 관해 궁금한 점은 고객센터로 문의해 주세요."], "960": ["제 멤버십 등급 좀 확인해 주세요.", "회원의 멤버십 정보를 조회해 현재 등급을 안내해 드립니다."], "1359": ["회선이 여러 개면 멤버십 카드도 여러 개인가요?", "Ubot 멤버십 카드는 회선 수와 관계없이 한 사람당 하나이며 가장 높은 등급의 회선을 기준으로 혜택이 적용됩니다. 멤버십 포인트는 회선별로 쌓이지만 본인 명의 회선끼리는 합칠 수 있습니다."], "966": ["내년에도 지금 등급이 유지될까요?", "회원의 최근 청구 내역을 조회해 내년 멤버십 등급 산정 기준과 비교해 안내해 드립니다. 멤버십 등급은 매년 1월 1일에 산정됩니다."], "1353": ["Ubot 포인트는 어떻게 쌓이나요?", "Ubot 포인트는 매월 납부한 요금제 월정액의 1%가 적립되며 적립일부터 2년 동안 사용할 수 있습니다. Ubot 포인트 적립 내역은 앱의 포인트 메뉴에서 확인할 수 있습니다."], "1355": ["포인트로 요금을 내면 언제 반영되나요?", "앱에서 포인트로 요금 납부를 신청하면 다음 청구서에서 신청한 포인트만큼 차감됩니다. 매월 3~5일인 청구서 확정일 이후에 포인트 납부를 신청하면 그다음 청구서에 반영됩니다."], "793": ["이번 달에 포인트로 요금을 더 낼 수 있는 한도가 남았나요?", "회원의 이번 달 포인트 사용 내역을 조회해 요금 납부에 더 쓸 수 있는 포인트 한도를 안내해 드립니다."], "1306": ["해외에서 카카오톡이나 인스타그램을 쓰면 요금이 나오나요?", "해외에서 카카오톡이나 인스타그램 같은 메신저·SNS를 Wi-Fi가 아닌 모바일 데이터로 쓰면 데이터 로밍 요금이 발생합니다. 해외에서 로밍 상품에 가입했다면 메신저·SNS를 상품 데이터 제공량 안에서 추가 요금 없이 이용할 수 있습니다."], "1303": ["해외에서 문자를 보내면 요금이 얼마인가요?", "해외에서 문자를 보내면 받는 국가와 관계없이 건당 150원이 부과됩니다. 해외에서 사진·동영상 문자(MMS)를 보내면 데이터를 사용하므로 데이터 로밍 요금도 함께 발생할 수 있습니다."], "1323": ["로밍 중 걸려 온 전화를 국내 번호로 착신 전환하면 요금이 나오나요?", "로밍 중인 휴대폰으로 연결되지 않고 국내 번호로 바로 착신 전환된다면 로밍 요금은 없고 국내 착신 전환 요금만 부과됩니다. 국내 번호에서 로밍 중인 번호로 착신 전환하면 로밍 수신 요금이 발생합니다."], "1195": ["114에 전화하면 요금이 나오나요?", "Ubot 휴대폰에서 국번 없이 114로 거는 고객센터 전화는 무료입니다. 다른 통신사 휴대폰이나 일반 전화에서 고객센터 114로 걸면 통화료가 발생합니다."], "91": ["국제전화를 사용할 수 있나요?", "국제전화 서비스를 이용하면 해외 전화번호로 전화를 걸 수 있습니다."], "1327": ["가입된 부가서비스는 어디에서 확인하나요?", "Ubot 앱의 부가서비스 메뉴에서 가입된 무료·유료 부가서비스와 월 요금, 가입일을 확인할 수 있습니다."], "682": ["제가 가입한 부가서비스 목록 좀 보여 주세요.", "로그인한 회원의 회선 정보를 조회해 현재 가입 중인 부가서비스 목록과 월 요금을 안내해 드립니다."], "1326": ["부가서비스는 어디에서 가입하나요?", "부가서비스는 Ubot 앱·홈페이지의 부가서비스 메뉴에서 바로 가입하거나 고객센터(114)·매장에서 신청할 수 있습니다. 월정액 부가서비스 요금은 가입한 날부터 일할 계산되어 청구됩니다."], "952": ["아이 회선에 가입된 부가서비스를 보여 주세요.", "명의자 동의로 등록된 자녀 회선의 부가서비스 목록을 조회해 안내해 드립니다."], "1544": ["제가 가입한 부가서비스를 알려 주세요.", "로그인하면 회원님 회선에 가입된 부가서비스와 각 서비스의 월 요금, 가입일을 조회해 안내해 드립니다."], "954": ["제 태블릿 회선에 가입된 부가서비스 목록을 알려 주세요.", "회원의 태블릿 회선을 조회해 가입된 부가서비스를 안내해 드립니다."], "945": ["제가 쓰고 있는 부가서비스 뭐뭐 있어요?", "회원의 회선 정보를 조회해 가입 중인 부가서비스 목록을 안내해 드립니다."], "1386": ["내 결합 가입 정보는 어디에서 확인하나요?", "Ubot 앱의 가입 정보 > 결합 상품에서 결합 이름, 결합된 회선, 대표 회선, 할인 금액을 확인할 수 있습니다."], "1013": ["공시지원금과 선택약정 할인은 뭐가 다른가요?", "공시지원금은 단말기 구매 비용을 지원받는 방식이고 선택약정은 매달 휴대폰 요금을 할인받는 방식입니다. 공시지원금과 선택약정 할인은 한 회선에 동시에 적용할 수 없으며 단말기와 요금제에 따라 어느 쪽이 유리한지 달라집니다."], "107": ["요금제를 낮추면 단말기 할부금도 줄어드나요?", "단말기 할부금은 요금제와 별개이므로 요금제를 낮춰도 그대로 청구됩니다. 요금제를 낮추면 요금제의 월 요금이 줄어듭니다."], "1066": ["공시지원금은 요금제에 따라 달라지나요?", "공시지원금은 휴대폰 모델과 가입 요금제에 따라 다르며 같은 모델도 높은 요금제일수록 지원금이 큽니다. 주문 화면에서 휴대폰 모델의 요금제별 공시지원금을 비교할 수 있습니다."], "1532": ["제 사용량에 맞는 요금제를 추천해 주세요.", "로그인하면 회원님 회선의 최근 데이터·통화 사용량과 현재 요금제를 조회해, 사용량에 맞는 Ubot 요금제를 비교해 안내해 드립니다."], "933": ["약정 할인 받고 나면 제 요금제가 실제로 얼마예요?", "회원이 사용하는 요금제와 선택약정 정보를 조회해 약정 할인 후 실제 월 요금을 안내해 드립니다."], "1017": ["장애인이나 기초수급자도 요금 감면을 받을 수 있나요?", "장애인이나 기초생활수급자 등 감면 대상에 해당하고 조건을 충족하면 통신요금 감면을 신청할 수 있습니다. 통신요금 감면 대상 확인에는 증빙 서류가 필요할 수 있으니 고객센터나 매장에 문의해 주세요."], "1147": ["요금제를 바꾸면 무료로 쓰던 부가서비스가 유료로 바뀌나요?", "요금제에 포함돼 무료로 이용하던 부가서비스 혜택은 요금제를 바꾸면 종료되며 계속 쓰려면 별도로 가입해야 합니다. 요금제 변경 화면에는 종료되는 무료 혜택이 미리 표시되므로 확인한 뒤 변경해 주세요."], "1604": ["요금제를 바꿨는데 새 데이터 제공량은 언제 반영되나요?", "요금제를 바꿨다면 가입 내역에서 변경 처리 상태와 적용일을 확인해 주세요. 요금제 적용일이 지났는데도 새 데이터 제공량이 반영되지 않았다면 고객센터에 회선 상태 점검을 요청해 주세요. 새 데이터 제공량의 정확한 반영 시점은 요금제 변경 조건에 따라 확인이 필요합니다."], "1688": ["약정 중에도 휴대폰 요금제를 변경할 수 있나요?", "약정 중 요금제 변경에 별도 제한이 적용되는지는 현재 제공된 안내 자료만으로 확인할 수 없습니다. 약정 중 요금제를 바꾸는 정확한 조건은 가입한 상품의 약정 내용을 확인하거나 고객센터에 문의해 주세요."], "777": ["약정 중인데 요금제를 바꾸면 제 할인 금액이 어떻게 바뀌어요?", "회원의 약정과 요금제를 조회해 약정 중 요금제를 바꾼 뒤 적용될 할인 금액을 안내해 드립니다. 약정 중 요금제를 바꿔도 약정은 유지되고 새 요금제 기준으로 25% 할인이 적용됩니다."], "106": ["선택약정 기간 중에도 요금제를 변경할 수 있나요?", "선택약정 기간 중에도 요금제를 변경할 수 있습니다. 선택약정 기간 중 요금제를 변경해도 약정은 유지되며 변경한 요금제의 월 요금을 기준으로 25% 할인이 적용됩니다."], "213": ["약정 중에 더 비싼 요금제로 올려도 되나요?", "약정 중에도 더 비싼 요금제로 변경할 수 있으며 기존 약정은 유지됩니다. 약정 중 요금제를 올리면 변경한 요금제 금액의 25%가 할인되어 할인 금액도 함께 늘어납니다."], "1124": ["월 중간에 요금제를 바꾸면 요금은 어떻게 계산되나요?", "월 중간에 요금제를 바꾸면 새 요금제는 신청 즉시 적용되고 변경 전후의 요금은 각각 사용한 날짜만큼 나눠 다음 달에 합산 청구됩니다. 월 중간에 요금제를 변경하면 데이터·통화 기본 제공량도 남은 날짜만큼 나눠 제공됩니다."], "381": ["명의 변경 업무를 하는 가까운 매장을 알려 주세요.", "현재 위치 주변에서 명의 변경을 취급하는 가까운 매장을 찾아 드립니다. 명의 변경을 위해 매장에 방문할 때는 양도인과 양수인 신분증, 명의 변경 동의서가 필요합니다."], "1408": ["듀얼번호를 쓰는데 휴대폰을 바꾸면 어떻게 하나요?", "듀얼번호 주 회선의 휴대폰을 바꾸면 새 휴대폰에서 듀얼번호 eSIM을 다시 발급받아야 합니다. 휴대폰 변경 후 앱의 듀얼번호 메뉴에서 기기 변경을 신청하면 새 QR 코드가 발급됩니다."], "79": ["고객센터 운영시간은 언제인가요?", "Ubot 고객센터 상담원은 평일 오전 9시부터 오후 6시까지 연결할 수 있습니다. 분실 신고와 요금 조회·납부는 114 자동응답이나 Ubot 앱에서 24시간 이용할 수 있습니다."], "1484": ["고객센터 운영 시간은 언제인가요?", "고객센터 상담원 연결은 평일 오전 9시부터 오후 6시까지 가능합니다. 요금 조회·납부와 분실 신고는 114 ARS와 Ubot 앱에서 24시간 할 수 있습니다."], "1515": ["매장 영업시간을 알고 싶어요.", "매장 이름이나 지역을 알려 주시면 해당 Ubot 매장의 영업시간을 안내해 드립니다. Ubot 매장 영업시간은 매장마다 다릅니다."], "76": ["매장 영업시간은 어떻게 확인하나요?", "매장 영업시간은 매장 검색 결과에서 각 매장의 운영시간을 확인할 수 있습니다."], "502": ["지금 선택한 매장의 토요일 영업시간을 알려 주세요.", "선택하신 매장의 토요일 운영 여부와 시간을 매장 정보에서 확인해 드립니다."], "865": ["제가 예약한 매장 방문 날짜랑 시간을 알려 주세요.", "회원의 매장 방문 예약 내역을 조회해 예약한 매장과 방문 날짜, 시간을 안내해 드립니다."], "363": ["이번 주말에 근처 매장들 토요일·일요일 영업시간을 비교해 주세요.", "현재 위치 주변 매장의 이번 주말 토요일·일요일 운영 여부를 함께 확인해 드립니다. 일요일에는 휴무인 매장이 많습니다."], "344": ["가려는 매장이 몇 시에 닫는지 알고 싶어요.", "방문하려는 매장의 마감 시간은 앱 매장 찾기의 매장 정보에서 확인할 수 있습니다. 매장 마감 시간은 기본적으로 평일 20:00, 토요일 17:00입니다."], "338": ["이 근처에 매장이 있는지 알고 싶어요.", "현재 위치를 기준으로 이 근처의 가까운 매장을 찾아 드릴 수 있습니다. 가까운 매장은 앱의 매장 찾기에서 주소나 지역으로도 검색할 수 있습니다."], "482": ["지도에서 핀 찍은 위치 주변 매장을 알려 주세요.", "선택하신 지도 위치를 기준으로 주변 매장을 찾아 드립니다."], "335": ["현재 위치에서 가장 가까운 매장을 찾고 싶어요.", "현재 위치에서 가까운 매장은 위치 정보 이용에 동의하면 확인할 수 있습니다."], "342": ["집 주소 근처 매장을 알려 주세요.", "집 주소를 알려 주시면 그 주변 매장을 찾아 드릴 수 있습니다. 집 주변 매장은 앱의 매장 찾기에서 주소로 직접 검색할 수도 있습니다."], "347": ["이사한 동네 매장을 알고 싶어요.", "이사한 동네의 새 주소를 알려 주시면 주변 매장을 안내해 드릴 수 있습니다. 이사한 동네 매장은 앱 매장 찾기에서 주소로도 검색할 수 있습니다."], "336": ["현재 영업 중인 가까운 매장을 찾고 싶어요.", "현재 위치와 영업시간을 기준으로 운영 중인 가까운 매장을 확인할 수 있습니다."], "484": ["친구랑 약속 장소 근처에 매장이 있으면 같이 들르려고요.", "약속 장소 주소나 지역을 알려 주시면 주변 매장을 찾아 드립니다."], "1526": ["회사 근처에 있는 매장을 찾고 싶어요.", "회사 주소나 가까운 역·건물 이름을 알려 주시면 그 주변 Ubot 매장을 찾아 드립니다."], "346": ["가족에게 매장 위치를 알려 주고 싶어요.", "가족에게 매장 위치를 알려 주려면 앱 매장 찾기에서 매장 주소를 확인해 전달할 수 있습니다. 가족에게 매장을 안내할 때 운영시간과 주차 가능 여부도 앱에서 함께 확인할 수 있습니다."], "75": ["가까운 매장은 어떻게 찾나요?", "가까운 매장은 홈페이지 또는 앱의 매장 찾기 기능에서 위치나 주소로 검색할 수 있습니다."], "15": ["eSIM을 다른 휴대폰으로 옮길 수 있나요?", "eSIM을 다른 휴대폰으로 옮길 때는 새 단말기에 eSIM을 다시 발급해야 할 수 있습니다."], "1280": ["eSIM을 새 휴대폰으로 옮기려면 어떻게 하나요?", "eSIM을 새 휴대폰으로 옮기려면 새 기기에서 eSIM을 다시 발급받아야 합니다. Ubot 앱에서 eSIM 기기 변경을 신청하면 새 QR 코드가 발급되고 2,750원의 비용이 청구되며 기존 휴대폰의 eSIM은 자동으로 비활성화됩니다."], "1262": ["쓰던 유심을 새 휴대폰에 그대로 써도 되나요?", "새 휴대폰이 같은 크기의 유심을 쓰고 Ubot 통신망을 지원하면 기존 유심을 옮겨 끼워 사용할 수 있습니다. 기존 유심을 새 휴대폰으로 옮겨도 요금제와 부가서비스는 그대로 유지됩니다."], "1281": ["유심을 eSIM으로, eSIM을 유심으로 바꿀 수 있나요?", "같은 휴대폰에서도 유심과 eSIM 사이를 전환할 수 있습니다. 유심에서 eSIM으로 바꾸려면 앱에서 신청할 수 있고 비용은 2,750원입니다. eSIM에서 유심으로 바꾸려면 새 유심(7,700원)을 구매해 교체 등록해야 합니다."], "16": ["eSIM과 일반 유심을 동시에 사용할 수 있나요?", "듀얼 SIM을 지원하는 단말기에서는 eSIM과 일반 유심을 동시에 사용할 수 있습니다."], "444": ["이사 갈 동네에서 인터넷 이전 상담받을 매장이 있을까요?", "이사 갈 새 주소를 알려 주시면 주변에서 인터넷 이전 상담이 가능한 매장을 찾아 드립니다. 이사로 인한 인터넷 이전 설치비는 22,000원입니다."], "304": ["이사 갈 때 인터넷을 옮기면 비용이 드나요?", "이사할 때 인터넷을 옮기는 이전 설치비는 22,000원입니다. 인터넷 이전 설치는 신청 후 평균 2~3일 이내에 방문해 진행합니다."], "816": ["제가 신청한 인터넷 이전 설치 예약일이 며칠이에요?", "회원의 인터넷 이전 설치 신청 내역을 조회해 기사 방문 예정일을 안내해 드립니다."], "1180": ["청구서 받는 주소를 바꾸려면 어떻게 하나요?", "청구서 받는 주소는 앱·홈페이지의 청구서 설정이나 고객센터에서 변경할 수 있습니다. 우편 청구서를 받는다면 주소는 필수 항목이므로 삭제할 수 없고 변경만 가능합니다."], "145": ["온라인 샵에서 기기변경을 주문하면 배송은 얼마나 걸리나요?", "온라인 샵에서 기기변경으로 주문한 휴대폰은 택배로 1~2일 안에 도착하며 배송비는 무료입니다."], "971": ["집 인터넷은 언제 설치했었나요?", "회원의 인터넷 가입 정보를 조회해 설치일과 약정 시작일을 안내해 드립니다."], "820": ["신규 인터넷 설치 기사님이 언제 오시는지 알려 주세요.", "회원의 신규 인터넷 설치 신청 내역을 조회해 기사 방문 예정일을 안내해 드립니다. 신규 인터넷 설치 기사는 신청 후 평균 2~3일 이내에 방문합니다."], "1368": ["결합 상품이 무엇인가요?", "Ubot 결합 상품은 가족·친구의 휴대폰이나 휴대폰과 인터넷을 묶어 요금을 할인받는 상품입니다. 결합 할인은 대표 휴대폰 회선 한 개의 요금에서 결합 전체 금액을 한 번에 차감합니다."], "1856": ["결합 할인 뜻은 무엇인가요?", "휴대폰·인터넷 같은 여러 서비스를 함께 가입하거나 묶어 받을 수 있는 할인입니다. 조건은 상품마다 다릅니다."], "1546": ["제가 가입한 결합 상품과 할인 금액을 알려 주세요.", "로그인하면 회원님 회선이 가입된 결합 상품과 결합 시작일, 적용되는 할인 금액을 조회해 안내해 드립니다."], "821": ["우리 집 결합 할인 합계가 이번 달 청구서에 얼마로 찍혔어요?", "회원의 가족 결합 정보를 조회해 이번 달 청구서에 적용된 가족 전체의 결합 할인 합계를 안내해 드립니다."], "298": ["가족 결합을 하면 얼마나 할인되나요?", "Ubot 가족 결합은 휴대폰 2회선이면 대표 회선에서 월 6,000원, 3회선이면 월 15,000원, 4회선이면 월 20,000원, 5회선이면 월 24,000원을 할인합니다. 가족 결합 할인은 회선마다 따로 적용되지 않고 대표 회선에서 한 번에 차감됩니다."], "1033": ["디바이스 케어는 어떤 서비스인가요?", "디바이스 케어는 단말기 상태를 점검하고 원격으로 이용 상담을 받는 서비스로 월 요금은 부가세를 포함해 4,400원입니다. 디바이스 케어에는 수리비 보상, 분실 보험, 기기 교환이 포함되지 않습니다."], "138": ["번호이동이 끝났는지 어떻게 확인하나요?", "번호이동 개통이 완료되면 문자로 안내됩니다. 번호이동 진행 상태는 앱의 주문 조회에서도 확인할 수 있습니다."], "1030": ["휴대폰이 꺼져 있을 때 온 전화를 알려 주는 서비스가 있나요?", "부재중 알림 서비스를 신청하면 휴대폰 전원이 꺼져 있거나 통화가 불가능한 동안 걸려온 전화의 수신 기록을 알려 줍니다. 부재중 알림 서비스의 월 요금은 부가세를 포함해 550원입니다."], "1058": ["주문한 휴대폰을 받은 뒤 개통은 어떻게 하나요?", "주문한 휴대폰을 받은 뒤에는 상자에 들어 있는 유심을 끼우고 앱의 주문 조회에서 개통 요청을 누르면 됩니다. 주문한 휴대폰의 개통이 끝나면 문자로 안내되며 휴대폰을 다시 켜면 사용할 수 있습니다."], "1414": ["온라인 샵에서 주문한 휴대폰은 언제 개통되나요?", "온라인 샵에서 주문한 휴대폰은 받은 뒤 직접 개통을 요청하면 바로 개통됩니다. 온라인 주문 휴대폰을 배송 후 7일 안에 개통하지 않으면 자동으로 개통 처리됩니다."], "1616": ["모바일 데이터가 켜지지 않을 때 회선 상태는 어떻게 확인하나요?", "모바일 데이터가 켜지지 않으면 휴대폰의 모바일 데이터 설정과 신호 표시, 비행기 모드, 사용 중인 데이터 회선을 확인해 주세요. 모바일 데이터가 연결되지 않을 때는 앱의 가입·이용 상태에서 회선 정지나 데이터 차단 설정을 확인하고, 원인을 찾지 못하면 고객센터에 회선 상태 점검을 요청해 주세요."], "672": ["제가 밀린 요금이 있나요?", "회원 회선의 미납 요금 유무와 금액을 조회해 안내해 드립니다. 휴대폰 요금을 2개월 동안 미납하면 발신이 정지되니 확인 후 납부해 주세요."], "903": ["제 요금 밀린 거 있어요?", "회원의 납부 내역을 조회해 미납 요금이 있는지와 금액을 안내해 드립니다."], "1351": ["요금이 미납되면 멤버십에 영향이 있나요?", "요금 미납으로 회선이 정지된 기간에는 멤버십 혜택을 쓸 수 없으며 미납 기간의 요금은 등급 산정 평균에서 제외됩니다. 미납 요금을 정리하면 멤버십 혜택을 다시 사용할 수 있습니다."], "1845": ["요금 연체 뜻은 무엇인가요?", "통신요금을 정해진 납부 기한까지 내지 않은 상태입니다."], "1112": ["통화만 하는 요금제가 있나요?", "Ubot 통화 전용은 월 4,900원에 데이터 없이 국내 음성과 문자를 기본 제공하는 LTE 요금제입니다. 통화 중심이지만 데이터를 조금이라도 써야 한다면 실속 LTE 1.5GB/통화기본(월 5,900원)을 이용할 수 있습니다."], "902": ["지난달에 연체 가산금이 붙었었나요?", "회원의 지난달 청구 내역을 조회해 연체 가산금 발생 여부와 금액을 안내해 드립니다."], "434": ["밀린 요금을 현금으로 내려는데 가까운 매장이 어디예요?", "현재 위치 주변에서 밀린 휴대폰 요금을 현금으로 수납할 수 있는 매장을 찾아 드립니다. 미납 요금을 납부하면 정지된 발신도 다시 이용할 수 있습니다."], "1249": ["통화와 문자 기본 제공이 무엇인가요?", "요금제에 '기본 제공'으로 표시된 국내 음성통화와 문자는 추가 요금 없이 쓸 수 있습니다. 국제전화, 영상통화, 유료 특수번호(060·1588 일부 등)는 통화 기본 제공에서 제외되어 별도 요금이 부과됩니다."], "153": ["가입할 때 부가서비스에 꼭 가입해야 하나요?", "부가서비스 가입은 선택 사항이며 가입 후에도 앱에서 언제든지 해지할 수 있습니다."], "295": ["멤버십은 따로 가입해야 하나요?", "Ubot 멤버십은 Ubot 휴대폰 회선이 있다면 앱에서 가입비 없이 가입할 수 있습니다. 신규 가입자의 멤버십 등급은 가입 다음 달 1일에 정해집니다. 멤버십 혜택을 이용할 때는 앱의 모바일 카드 바코드를 제시해 주세요."], "1044": ["가입비가 있나요?", "Ubot 휴대폰 가입비는 없습니다. 가입할 때 유심이 필요하다면 유심 비용 7,700원 또는 eSIM 비용 2,750원만 첫 달 요금과 함께 청구됩니다."], "1653": ["카드 재발급 후 휴대폰 자동납부 정보를 다시 등록해야 하나요?", "재발급으로 카드 번호나 유효기간이 바뀌면 휴대폰 요금 자동납부 정보를 다시 등록해야 할 수 있습니다. 카드 재발급 후 카드사의 자동 승계 여부와 통신사에 등록된 결제 정보를 확인하세요."], "136": ["번호이동을 하면 기존 통신사는 따로 해지해야 하나요?", "번호이동한 회선은 새 통신사에서 개통되는 즉시 기존 통신사 회선이 자동 해지되므로 별도로 해지를 신청하지 않아도 됩니다."], "1250": ["영상통화를 쓰지 않았는데 초과됐다는 문자가 왔어요.", "1588·1544 같은 전국 대표번호나 060 등 유료 부가통화는 영상통화와 함께 기본 제공에서 제외되는 부가통화로 집계됩니다. 영상통화를 쓰지 않았는데 초과 안내를 받았다면 앱의 이용 내역에서 부가통화 상세를 확인해 주세요."], "134": ["청구서의 부가세는 따로 더해지는 건가요?", "요금제와 부가서비스 금액은 부가세 포함 금액이며, 청구서에는 그중 부가세가 얼마인지 구분해 표시됩니다."], "251": ["인터넷과 IPTV도 매장에서 신청하나요?", "인터넷과 IPTV는 매장, 앱 또는 고객센터에서 신청할 수 있습니다. 인터넷과 IPTV 설치는 신청 후 평균 2~3일 이내에 방문해 진행합니다."], "1540": ["지난달 데이터 사용량을 알려 주세요.", "로그인하면 회원님 회선의 지난달 데이터·통화·문자 사용량을 조회해 안내해 드립니다. 지난달 사용량을 요금제를 고를 때 참고해 보세요."], "1551": ["제게 온 알림을 확인하고 싶어요.", "로그인하면 회원님께 온 예약·납부 관련 알림과 읽지 않은 알림 개수를 조회해 안내해 드립니다."], "692": ["이번 달에 제가 데이터를 지금까지 얼마나 썼어요?", "회원의 이번 달 데이터 사용량을 조회해 지금까지 사용한 데이터 용량을 안내해 드립니다."], "1203": ["데이터 사용량이 기본 제공량보다 많게 나와요.", "데이터 사용량에 테더링으로 쓴 데이터와 데이터 플러스로 추가한 데이터가 함께 합산되어 기본 제공량보다 많게 보일 수 있습니다. 데이터 사용량의 기본 제공량, 추가 데이터, 테더링 구분은 앱의 사용량 상세에서 확인할 수 있습니다."], "992": ["광고 문자 받는 걸로 동의돼 있나요?", "회원의 수신 동의 설정을 조회해 마케팅 수신 동의 여부를 안내해 드립니다."], "878": ["이번 주에 데이터를 얼마나 썼는지 알려 주세요.", "회원의 일별 사용 내역을 조회해 이번 주 데이터 사용량을 안내해 드립니다."], "706": ["제 요금제 기본 데이터가 몇 GB짜리예요?", "회원이 사용 중인 요금제를 조회해 기본 제공 데이터 용량과 데이터를 다 쓴 뒤 적용되는 속도를 안내해 드립니다."], "199": ["자녀 휴대폰만 로밍을 막아 둘 수 있나요?", "로밍 차단은 회선별로 신청할 수 있어 자녀 휴대폰 회선만 차단할 수 있습니다. 미성년 자녀 회선의 로밍 차단은 법정대리인이 신청합니다."], "395": ["아이 폰 유해 사이트 차단 설정을 도와줄 가까운 매장을 찾아요.", "자녀 휴대폰의 유해 사이트 차단 설정을 도와줄 수 있는 현재 위치 주변 매장을 찾아 드립니다. 자녀 보호 서비스는 무료이며 앱에서도 신청할 수 있습니다."], "953": ["아이 폰 자녀 보호는 언제 신청됐어요?", "자녀 회선의 부가서비스 이력을 조회해 자녀 보호 가입일을 안내해 드립니다."], "1492": ["복지 할인 대상은 누구인가요?", "복지 할인 대상은 장애인, 국가유공자, 기초생활수급자, 차상위계층, 기초연금 수급자입니다. 복지 할인 금액은 대상별로 다릅니다. 복지 할인은 매장이나 고객센터에서 신청하면 정부 자격 확인 후 적용됩니다."], "1156": ["복지 할인은 어떻게 받나요?", "기초생활수급자, 장애인, 국가유공자 등 복지 할인 대상자는 매장이나 고객센터에서 신청하면 요금제와 관계없이 월 요금을 감면받을 수 있습니다. 복지 할인 대상 자격은 1년마다 다시 확인하며 자격이 없어지면 할인이 종료됩니다."], "1538": ["제 요금에 적용된 할인을 알려 주세요.", "로그인하면 회원님 회선의 청구 내역에서 약정 할인, 결합 할인 등 적용된 할인 금액을 조회해 안내해 드립니다."], "1143": ["요금제 가격에 부가세가 포함되어 있나요?", "Ubot에서 안내하는 요금제와 부가서비스 가격은 모두 부가세가 포함된 금액입니다."], "1491": ["통신 장애로 서비스를 못 썼는데 보상을 받을 수 있나요?", "Ubot의 책임으로 연속 3시간 이상 서비스를 쓰지 못했다면 약관에 따라 해당 시간 요금의 일정 배수를 감면해 드립니다. 대규모 통신 장애에 대한 요금 감면은 자동으로 처리됩니다. 개별 통신 장애에 대한 요금 감면은 고객센터에 신청해 주세요."], "1388": ["결합 할인과 복지 할인을 함께 받을 수 있나요?", "복지 할인은 휴대폰 회선별 감면이므로 결합 할인과 함께 받을 수 있습니다. 복지 할인과 결합 할인을 함께 받으면 복지 할인이 먼저 적용된 뒤 결합 할인이 차감됩니다."], "1493": ["복지 할인은 몇 회선까지 받을 수 있나요?", "복지 할인은 대상자 1명당 휴대폰 1회선에 적용됩니다. 기초생활수급자는 같은 가구 구성원 회선을 포함해 최대 4회선까지 복지 할인을 받을 수 있습니다."], "1494": ["월 중간에 복지 할인을 신청하면 언제부터 적용되나요?", "신청이 승인된 날부터 일할 계산되어 그달 요금부터 할인됩니다."], "1018": ["군 입대 중에는 휴대폰 회선을 어떻게 하나요?", "군 입대 기간에는 휴대폰 회선을 일시 정지하거나 요금제를 낮춰 유지할 수 있습니다. 입대 중 회선 일시정지나 요금제 변경의 가능 조건은 가입 상태에 따라 달라 앱이나 고객센터에서 확인해 주세요."], "1496": ["군인을 위한 혜택이 있나요?", "현역 복무 중인 장병은 군 입대 정지로 복무 기간 동안 요금 없이 회선을 유지할 수 있습니다. 군 복무 중 휴대폰을 쓴다면 일반 요금제에 가입하면 되며 별도 군인 전용 요금제는 없습니다."], "1434": ["군 입대로 휴대폰을 정지할 수 있나요?", "군 입대 정지를 신청하면 복무 기간 동안 요금 없이 휴대폰 번호를 유지할 수 있습니다. 군 입대 정지는 입영통지서나 병적증명서를 가지고 매장에 방문하거나 앱에서 서류를 올려 신청해 주세요."], "1398": ["공시지원금이 무엇인가요?", "공시지원금은 새 휴대폰을 살 때 통신사가 기기값을 할인해 주는 금액으로 모델과 요금제별로 공시됩니다. 공시지원금을 받으면 일정 기간 요금제를 유지해야 하며 선택약정 할인과 함께 받을 수 없습니다."], "1320": ["장기간 해외에 머무는데 번호를 유지하려면 어떻게 하나요?", "해외에 장기간 머무를 때 일시정지를 신청하면 월 3,850원으로 번호를 유지할 수 있으며 연 2회, 한 번에 최대 90일까지 가능합니다. 군 복무나 유학 등으로 더 오래 회선을 정지해야 한다면 출국 사실을 증명하는 서류로 장기 일시정지를 신청해 주세요."], "861": ["제 폰이 5G 되는 기종으로 등록돼 있나요?", "회원의 단말 정보를 조회해 5G 지원 기종인지 안내해 드립니다."], "95": ["휴대폰을 중고 기기로 변경해도 되나요?", "중고 휴대폰이 정상 사용 가능한 단말기라면 기존 유심을 장착하거나 기기 변경 절차를 거쳐 이용할 수 있습니다."], "1390": ["중고폰으로 기기 변경을 할 수 있나요?", "분실·도난 신고가 없는 중고폰이라면 Ubot 유심을 옮겨 끼워 기기 변경할 수 있습니다. 중고폰으로 기기 변경하면 공시지원금은 받을 수 없지만 선택약정 할인은 받을 수 있습니다."], "1287": ["중고폰이나 자급제폰으로 eSIM을 개통할 수 있나요?", "eSIM을 지원하는 중고폰이나 자급제폰이라면 eSIM으로 개통할 수 있습니다. 중고폰·자급제폰의 eSIM을 신청할 때는 설정 > 휴대폰 정보에서 확인할 수 있는 IMEI와 EID 번호가 필요합니다."], "325": ["쓰던 폰을 반납하면서 새 폰을 살 수 있나요?", "매장에서 쓰던 휴대폰 반납과 새 휴대폰 구매를 함께 진행할 수 있습니다. 쓰던 휴대폰의 반납은 할부 24개월 이후에 가능합니다."], "456": ["폰을 잃어버려서 새 폰으로 이어 쓰려면 어느 매장으로 가면 돼요?", "현재 위치 주변에서 분실한 휴대폰의 회선을 새 휴대폰으로 이어 쓰는 업무를 처리할 매장을 찾아 드립니다. 새 휴대폰으로 회선을 옮기기 전 분실 신고는 앱이나 고객센터에서 24시간 접수할 수 있습니다."], "218": ["가족 중 한 명이 해지하면 결합 할인은 어떻게 되나요?", "가족 결합 회선 중 하나를 해지하면 남은 회선 수에 맞는 할인 금액으로 다음 달부터 바뀝니다. 예를 들어 가족 결합이 4회선에서 3회선이 되면 대표 회선의 월 할인 금액이 20,000원에서 15,000원으로 바뀝니다. 가족 결합 회선이 2개 미만으로 줄면 결합이 종료됩니다."], "217": ["가족이 대신 해지해 줄 수 있나요?", "휴대폰 회선 해지는 가족 등 대리인도 신청할 수 있습니다. 대리인이 회선을 해지하려면 명의자 신분증과 위임장, 발급 3개월 이내의 명의자 인감증명서를 준비해 매장을 방문해 주세요."], "1682": ["가족 결합 회선 수별로 가족 전체 할인 금액은 얼마인가요?", "Ubot 가족 결합 할인은 가족 전체에 대해 대표 회선에서 한 번에 차감됩니다. 가족 결합 2회선은 월 6,000원, 3회선은 월 15,000원, 4회선은 월 20,000원, 5회선은 월 24,000원이 할인됩니다."], "1384": ["요금제를 바꾸면 결합 할인이 달라지나요?", "가족 결합은 요금제와 관계없이 회선 수를 기준으로 할인하므로 요금제를 바꿔도 할인액이 달라지지 않습니다. 친구 결합·프리미엄 듀오·청년 듀오처럼 요금제 조건이 있는 결합은 요금제를 바꿔 조건에서 벗어나면 할인이 종료됩니다."], "78": ["매장에서 요금제를 변경할 수 있나요?", "신분증을 지참하면 매장에서 요금제 변경을 신청할 수 있습니다."], "1149": ["해외에 있을 때도 요금제를 바꿀 수 있나요?", "해외에서도 Ubot 앱이나 홈페이지에 로그인해 요금제를 변경할 수 있습니다. 해외 로밍 중 앱을 사용하면 데이터 로밍 요금이 발생할 수 있으므로 Wi-Fi에서 이용해 주세요."], "1884": ["데이터 무제한 뜻은 무엇인가요?", "정해진 조건 안에서 데이터를 계속 사용할 수 있는 요금제 표현입니다. 일정량 이후 속도가 제한될 수 있습니다."], "1128": ["데이터를 많이 쓰는데 무제한 요금제가 있나요?", "속도 제한 없이 고속 데이터를 무제한으로 쓰는 요금제는 다이렉트 61(월 61,000원, 온라인 전용)·69, 베이직 80·100, 데이터 MAX, 프리미엄 89~Max, 플러스 95~130 등이 있습니다. 만 19~34세라면 청년 무제한(월 65,000원)도 이용할 수 있으며 무제한 요금제의 테더링 한도는 상품별로 월 40GB~140GB입니다."], "69": ["데이터 무제한 요금제가 있나요?", "데이터 무제한 또는 일정 사용 후 속도 제한형 요금제가 있습니다."], "1104": ["Ubot 프리미엄 요금제는 어떤 요금제인가요?", "Ubot 프리미엄은 고속 데이터를 무제한으로 쓰는 요금제로 89(월 89,000원), 99(99,000원), 109(109,000원), Pro(119,000원), Max(129,000원)가 있습니다. Ubot 프리미엄 요금제는 음성·문자를 기본 제공하며 테더링은 89·99·109·Pro·Max 순서로 각각 월 60GB, 80GB, 100GB, 120GB, 140GB까지 이용할 수 있습니다."], "763": ["제 요금제가 통화 무제한인지 확인해 주세요.", "회원의 현재 요금제를 조회해 국내 음성통화가 기본 제공되는지 안내해 드립니다. 국제전화·유료 특수번호처럼 기본 제공 통화에서 제외되는 항목도 함께 확인해 주세요."], "26": ["핫스팟에도 데이터 제한이 있나요?", "핫스팟에 적용되는 테더링 데이터 제공량이나 속도 제한은 요금제에 따라 다를 수 있습니다."], "1221": ["데이터 요금이 과도하게 나오지 않게 막는 장치가 있나요?", "Ubot 국내 데이터 요금제는 기본 데이터를 다 쓰면 속도 제한이나 차단으로 전환되어 추가 데이터 요금이 발생하지 않습니다. 로밍 상품 없이 해외에서 데이터를 사용해 하루 요금이 11,000원을 넘으면 그날은 추가 과금 없이 속도가 제한됩니다."], "1109": ["Ubot 플러스 요금제는 어떤 요금제인가요?", "Ubot 플러스는 데이터 무제한 요금제로 95(월 95,000원), 105(105,000원), 115(115,000원), 130(130,000원)이 있습니다. 플러스 요금제의 테더링 한도는 95가 월 80GB, 105·115가 월 100GB, 130이 월 120GB입니다."], "1833": ["유심 재발급 뜻은 무엇인가요?", "잃어버렸거나 사용할 수 없는 유심을 새 유심으로 바꾸어 기존 회선에서 쓰도록 하는 절차입니다."], "1257": ["유심은 얼마인가요?", "Ubot 유심은 7,700원이고 eSIM 발급은 2,750원입니다. 유심·eSIM을 분실하거나 파손해 재발급받을 때도 같은 금액이 부과됩니다. 개통 30일 안에 정상 사용 중 유심 불량이 발생했다면 무료로 교체해 드립니다."], "1525": ["유심 교체하러 갈 수 있는 가까운 매장을 찾아 주세요.", "유심 교체를 할 수 있는 가까운 Ubot 매장을 찾아 드립니다. 유심 교체는 모든 Ubot 매장에서 처리할 수 있습니다. 유심 교체를 위해 대기 없이 방문하려면 방문 목적을 유심 교체로 예약해 주세요."], "1265": ["유심을 바꾸면 전화번호도 바뀌나요?", "유심이나 eSIM을 바꿔도 전화번호, 요금제, 부가서비스는 그대로 유지됩니다."], "1267": ["유심을 바꾸면 공동인증서나 은행 앱을 다시 등록해야 하나요?", "공동인증서는 휴대폰에 저장되므로 유심을 바꿔도 그대로 사용할 수 있습니다. 일부 은행·간편결제 앱은 유심 교체 후 보안을 위해 기기 재인증을 요구할 수 있습니다."], "989": ["eSIM 발급된 거 맞는지 확인해 주세요.", "회원의 eSIM 발급 내역을 조회해 발급 상태를 안내해 드립니다."], "1290": ["주문한 유심을 취소하고 싶어요.", "주문한 유심이 출고되기 전이라면 앱의 주문 조회에서 바로 취소할 수 있습니다. 주문한 유심을 이미 받았다면 포장을 뜯지 않은 상태로 받은 날부터 7일 안에 고객센터에 반품을 신청해 주세요."], "1325": ["로밍 상품은 출국 전에 미리 가입해도 되나요?", "로밍 상품에 출국 전에 미리 가입해도 요금은 현지에서 데이터를 처음 쓴 시각부터 24시간 단위로 부과됩니다. 귀국 후 로밍 데이터를 사용하지 않으면 추가 요금은 나오지 않습니다."], "1543": ["제가 신청한 로밍 상품을 확인하고 싶어요.", "로그인하면 회원님 회선에 가입된 로밍 상품과 이용 기간, 상태(예정·이용 중·종료), 하루 요금과 제공 데이터를 조회해 안내해 드립니다."], "688": ["제가 로밍 패스 가입돼 있는지 확인해 주세요.", "회원 회선의 로밍 가입 정보를 조회해 로밍 패스 가입 여부와 사용 시작 여부를 안내해 드립니다."], "977": ["출국 전인데 제 회선에 로밍 패스가 걸려 있는지 조회해 주세요.", "회원의 휴대폰 회선 정보를 조회해 출국 전에 로밍 패스에 가입돼 있는지 안내해 드립니다."], "1193": ["해외 로밍 요금이 한참 뒤에 청구됐어요.", "해외 로밍 요금은 해외 통신사와 정산하는 데 시간이 걸려 사용 후 1~2개월 뒤에 청구될 수 있습니다. 늦게 청구된 로밍 요금의 사용 날짜는 앱의 로밍 이용 내역에서 확인할 수 있습니다."], "210": ["공항 로밍센터에서는 어떤 일을 볼 수 있나요?", "공항 로밍센터에서는 로밍 패스 가입 상담과 로밍 설정 안내를 받을 수 있습니다. 인천공항 제1·제2여객터미널의 로밍센터는 매일 06:00~22:00 운영합니다."], "1852": ["위약금 뜻은 무엇인가요?", "약정 조건을 어겼을 때 계약에 따라 부담할 수 있는 금액입니다. 실제 발생 여부와 금액은 계약 조건에 따릅니다."], "1097": ["명의를 바꾸면 선택약정은 어떻게 되나요?", "가족 간 명의 변경에서는 새 명의자가 남은 선택약정을 이어받을 수 있습니다. 가족 간 명의 변경에서 선택약정을 이어받지 않으면 할인반환금이 정산됩니다. 가족이 아닌 사람에게 명의를 변경할 때는 선택약정을 이어받을 수 없습니다."], "1429": ["할부금을 다 내면 약정도 없어지나요?", "단말 할부와 요금 약정은 별개이므로 할부금을 다 내도 약정이 자동으로 끝나지 않습니다. 단말 할부금을 한 번에 갚아도 선택약정이나 공시지원금 약정은 그대로 남습니다."], "297": ["멤버십에 대해 더 알고 싶어요.", "멤버십 등급, 혜택, 제휴처는 앱의 멤버십 메뉴에서 확인할 수 있습니다. 멤버십에 관해 궁금한 점은 고객센터나 AI 챗봇으로 문의해 주세요."], "1348": ["Ubot 멤버십은 어떻게 가입하나요?", "Ubot 휴대폰 회선이 있다면 Ubot 앱에서 가입비 없이 멤버십에 바로 가입할 수 있습니다. Ubot 멤버십에 가입하면 앱에서 모바일 멤버십 카드를 바로 사용할 수 있습니다."], "1364": ["멤버십 혜택 알림을 받을 수 있나요?", "Ubot 앱 설정에서 멤버십 혜택 알림을 켜면 새 제휴 혜택과 이번 달 남은 혜택을 앱 알림으로 알려 드립니다."], "1352": ["일시정지 중에도 멤버십을 쓸 수 있나요?", "회선 일시정지 기간에는 멤버십 혜택을 쓸 수 없고 정지를 해제하면 다시 사용할 수 있습니다. 일시정지 기간은 멤버십 등급 산정 평균에서 제외됩니다."], "808": ["제 등급으로 받을 수 있는 혜택을 정리해 주세요.", "회원의 멤버십 등급을 조회해 해당 등급에서 받을 수 있는 제휴 할인과 영화 혜택 횟수를 안내해 드립니다."], "206": ["해외에서도 멤버십 할인을 쓸 수 있나요?", "멤버십 제휴 할인은 국내 제휴처에서 앱 바코드를 제시해 이용할 수 있습니다. 해외 가맹점에서는 멤버십 제휴 할인이 적용되지 않습니다."], "961": ["지난달에 멤버십 할인 받은 내역을 보여 주세요.", "회원의 멤버십 사용 내역을 조회해 지난달 사용처와 할인 내역을 안내해 드립니다."], "1366": ["선불 요금제도 멤버십에 가입할 수 있나요?", "Ubot 멤버십은 후불 요금제 회선만 가입할 수 있으므로 선불 요금제는 가입할 수 없습니다."], "1836": ["명의 변경 뜻은 무엇인가요?", "통신 서비스 계약의 명의자를 다른 사람이나 법인으로 바꾸는 절차입니다."], "1093": ["명의 변경은 아무에게나 할 수 있나요?", "정부의 번호 매매 방지 정책에 따라 휴대폰 회선 명의 변경은 가족 간 등 일부 경우에만 허용됩니다. 가족 간 명의 변경은 가족관계증명서로 관계를 확인한 뒤 진행합니다."], "1036": ["매장 방문 예약은 어떤 업무로 할 수 있나요?", "구매 상담, 요금제 변경, 기기변경, 개통, 명의변경, 유심 교체, 분실·파손 접수 중 하나를 방문 목적으로 선택해 예약할 수 있습니다."], "1859": ["일시정지 뜻은 무엇인가요?", "회선을 해지하지 않고 일정 기간 통화나 데이터 이용을 잠시 멈추는 것입니다."], "1549": ["제 회선이 지금 정지 상태인가요?", "로그인하면 회원님 회선의 이용 상태가 정상, 정지, 해지 중 무엇인지 조회해 안내해 드립니다."], "987": ["제 번호가 정지된 이유가 뭐예요?", "회원의 회선 상태를 조회해 정지 사유와 해제 방법을 안내해 드립니다."], "1583": ["점검이나 서비스 변경 소식은 어떻게 알 수 있나요?", "시스템 점검, 서비스 변경, 약관 개정 같은 소식은 Ubot 앱·홈페이지의 공지사항과 상단 배너로 안내합니다."], "1433": ["일시정지 기간이 끝나면 자동으로 풀리나요?", "신청한 일시정지 기간이 끝나면 정지가 자동으로 해제되어 원래 요금제로 다시 쓸 수 있습니다. 일시정지는 1회 최대 90일을 넘겨 자동 연장되지 않으므로, 더 쉬려면 다시 신청해 주세요."], "1253": ["수신자 부담 전화(콜렉트콜)를 받지 않으려면 어떻게 하나요?", "고객센터(114)에서 콜렉트콜 수신 거부를 무료로 신청하면 수신자 부담 전화가 연결되지 않습니다."], "1213": ["특정 앱만 데이터를 못 쓰게 할 수 있나요?", "특정 앱의 모바일 데이터는 휴대폰 설정의 앱별 데이터 사용에서 해당 앱만 끌 수 있습니다. 통신사는 특정 앱만 모바일 데이터를 차단하는 기능을 제공하지 않습니다."], "1255": ["다른 통신사로 가입됐다는 문자를 받았어요.", "다른 통신사로 가입됐다는 문자를 받았는데 본인이 신청하지 않았다면 명의도용일 수 있으니 즉시 고객센터(114)에 연락해 주세요. 명의도용 방지 서비스(엠세이퍼)에 가입하면 본인 명의의 새 회선 개통을 막을 수 있습니다."], "1078": ["번호이동을 할 수 없는 경우도 있나요?", "이전 통신사에 미납 요금이 있거나 신규 가입·번호이동·명의 변경 후 3개월이 지나지 않았다면 번호이동이 제한됩니다. 명의도용 방지 서비스에 가입되어 번호이동이 제한된다면 서비스를 해제한 뒤 신청해 주세요."], "986": ["번호이동 끝났는지 확인해 주세요.", "회원의 번호이동 내역을 조회해 처리 완료 여부를 안내해 드립니다."], "1065": ["제조사 매장에서 산 휴대폰도 선택약정 할인을 받을 수 있나요?", "제조사 매장이나 온라인몰에서 산 자급제 휴대폰은 공시지원금을 받지 않았으므로 선택약정으로 요금 25% 할인을 받을 수 있습니다."], "1424": ["선택약정 기간을 12개월에서 24개월로 바꿀 수 있나요?", "선택약정 기간 중에는 약정 기간을 12개월에서 24개월로 바꿀 수 없습니다. 기존 선택약정을 해지하고 새 약정에 가입할 수는 있지만 할인반환금이 발생할 수 있습니다."], "1550": ["제 약정은 언제 끝나나요?", "로그인하면 회원님 회선의 약정 종류(선택약정·공시지원금), 시작일과 만료일, 약정 할인 금액을 조회해 안내해 드립니다."], "1068": ["공시지원금을 받으면 선택약정 할인도 받을 수 있나요?", "공시지원금과 선택약정 할인은 둘 중 하나만 받을 수 있으며 동시에 적용할 수 없습니다. 휴대폰 개통 후에는 지원금 유형을 바꿀 수 없으니 주문할 때 두 혜택을 비교해 골라 주세요."], "767": ["제가 선택약정 12개월로 했었는지 24개월로 했었는지 기억이 안 나요.", "회원의 선택약정 정보를 조회해 가입한 약정 기간이 12개월인지 24개월인지 안내해 드립니다."], "1374": ["부부나 예비 부부도 결합할 수 있나요?", "부부는 Ubot 가족 결합으로 할인받을 수 있습니다. 혼인 신고 전인 예비 부부는 친구 결합으로 가입하고 혼인 신고 후 가족 결합으로 바꿀 수 있습니다."], "1383": ["결합 대표자를 바꿀 수 있나요?", "결합 대표자는 포함된 다른 회선으로 변경할 수 있으며 기존 대표자와 새 대표자의 동의가 필요합니다. 결합 대표자를 변경하면 할인은 다음 달부터 새 대표 회선에서 차감됩니다."], "1369": ["가족 결합은 얼마나 할인되나요?", "Ubot 가족 결합은 휴대폰 2회선이면 월 6,000원, 3회선이면 15,000원, 4회선이면 20,000원, 5회선이면 24,000원을 대표 회선에서 할인합니다. 가족 결합 할인은 회선마다 따로 적용되지 않고 결합 전체 금액으로 적용됩니다."], "1380": ["오래 쓴 가족에게 주는 결합 혜택이 있나요?", "Ubot 가족 오래함께는 대표 회선을 36개월 이상 연속 이용하고 휴대폰 2회선 이상을 결합하면 월 10,000원을 할인합니다."], "1381": ["한 회선을 여러 결합에 넣을 수 있나요?", "휴대폰 한 회선은 하나의 결합에만 가입할 수 있어 여러 결합에 동시에 넣을 수 없습니다. 다른 결합으로 옮기려면 현재 결합에서 회선을 뺀 뒤 새 결합에 가입해 주세요."], "442": ["인터넷이랑 휴대폰 결합 상담받을 매장을 찾고 있어요.", "현재 위치 주변에서 휴대폰과 인터넷 결합 상담을 받을 수 있는 매장을 찾아 드립니다. 휴대폰과 인터넷을 결합하면 인터넷 요금이 월 5,500원 할인됩니다."], "313": ["결합으로 받을 수 있는 할인을 정리해 주세요.", "Ubot 가족 결합은 회선 수에 따라 대표 회선에서 월 6,000원부터 24,000원까지 할인됩니다. 휴대폰과 인터넷의 홈 결합 할인은 인터넷 속도에 따라 휴대폰 요금에서 월 3,300원부터 7,700원까지 적용됩니다. 인터넷과 IPTV를 결합하면 상품 조건에 따른 할인 금액은 가입 내역에서 확인할 수 있습니다."], "1196": ["모바일 데이터가 연결되지 않아요.", "모바일 데이터가 연결되지 않으면 휴대폰 설정에서 데이터가 켜져 있는지와 비행기 모드가 꺼져 있는지 확인한 뒤 휴대폰을 재부팅해 주세요. 휴대폰을 재부팅해도 모바일 데이터가 연결되지 않으면 앱에서 남은 데이터와 데이터 차단 부가서비스 가입 여부를 확인해 주세요. 모바일 데이터 연결 문제가 계속되면 고객센터(114)로 문의해 주세요."], "1161": ["자동이체 납부일을 바꾸고 싶어요.", "자동이체 납부일은 Ubot 앱·홈페이지의 납부 방법 메뉴에서 10일, 15일, 21일, 25일 중 하나로 바꿀 수 있습니다. 자동이체 납부일 변경은 신청한 다음 달 청구분부터 적용됩니다."], "1534": ["제 요금이 납부됐는지 확인해 주세요.", "로그인하면 회원님 회선의 청구 월별 납부 상태(미납·납부 완료·연체), 납부 금액, 납부일, 납부 방법을 조회해 안내해 드립니다."], "1416": ["배송지 주소를 바꾸고 싶어요.", "주문한 휴대폰이 출고되기 전이라면 앱의 주문 조회에서 배송지를 변경할 수 있습니다. 주문한 휴대폰이 이미 출고됐다면 송장 번호로 택배사에 직접 배송지 변경을 요청하거나 고객센터에 문의해 주세요."], "1536": ["제 미납 요금이 얼마인가요?", "로그인하면 회원님 회선의 미납·연체된 청구 월과 남은 금액을 조회해 안내해 드립니다."], "1844": ["미납 요금 뜻은 무엇인가요?", "납부 기한이 지났거나 아직 결제되지 않은 통신요금입니다."], "1441": ["요금 미납으로 직권 해지되면 어떻게 되나요?", "휴대폰 요금을 3개월 이상 내지 않으면 회선이 직권 해지되고 남은 요금과 할부금은 계속 청구됩니다. 직권 해지 후에도 요금을 계속 내지 않으면 신용정보기관에 연체 정보가 등록될 수 있으니 고객센터에서 분납 상담을 받아 주세요."], "726": ["제가 늦게 내서 붙은 연체 가산금이 얼마예요?", "회원의 미납 내역을 조회해 연체로 발생한 가산금의 금액을 안내해 드립니다. 요금 연체 가산금은 납부일 다음 날부터 미납액의 월 2%입니다."], "727": ["제 요금이 몇 달째 밀려 있는 거예요?", "회원의 미납 내역을 조회해 요금을 몇 달째 내지 않았는지와 미납 금액을 안내해 드립니다. 휴대폰 요금을 3개월 미납하면 이용이 정지됩니다."], "1436": ["미납 요금을 냈는데 정지가 풀리지 않아요.", "미납 요금을 납부하면 확인 후 보통 1시간 안에 이용 정지가 자동으로 해제됩니다. 미납 정지 해제 결과는 휴대폰을 다시 켜야 반영될 수 있습니다. 납부 후 2시간이 지나도 정지가 풀리지 않으면 고객센터(114)에 납부 내역을 알려 주세요."], "1276": ["QR 코드를 촬영할 수 없을 때 eSIM은 어떻게 등록하나요?", "eSIM QR 코드를 촬영할 수 없다면 휴대폰 설정의 eSIM 추가에서 '직접 입력'을 선택하고 QR 코드 아래 안내된 SM-DP+ 주소와 활성화 코드를 입력해 주세요."], "1739": ["eSIM 프로필 뜻이 무엇인가요?", "eUICC에 내려받아 설치하는 통신사 가입 정보입니다. 단말에 따라 여러 프로필을 저장할 수 있습니다."], "1285": ["eSIM으로 교통카드나 삼성페이를 쓸 수 있나요?", "휴대폰 자체 NFC 결제인 삼성페이·애플페이는 eSIM 사용 여부와 관계없이 쓸 수 있습니다. 유심에 저장하는 유심형 교통카드는 eSIM에서 이용할 수 없으므로 휴대폰 앱형 교통카드를 이용해 주세요."], "1632": ["휴대폰에서 EID는 어디에서 확인하나요?", "eSIM 지원 휴대폰의 설정에서 기기 정보 또는 휴대전화 정보에 있는 EID 항목을 확인하세요. EID는 eSIM 관련 식별번호이며 IMEI와 다른 값입니다. 휴대폰의 EID 표시 위치는 기종에 따라 다릅니다."], "1111": ["Ubot 실속 요금제는 어떤 요금제인가요?", "Ubot 실속은 약정 없는 저가 요금제로 LTE 10종(월 3,300원~9,900원)과 5G 3종(2GB 6,000원, 3GB 6,900원, 4GB 7,800원)이 있습니다. Ubot 실속에서 이름에 +가 붙은 요금제는 데이터를 다 쓴 뒤 1Mbps로 계속 이용할 수 있고 나머지 요금제는 데이터가 차단됩니다."], "1121": ["월 5만 원 정도 요금제 중에 데이터를 가장 많이 주는 것은 무엇인가요?", "월 5만 원 안팎 요금제 중 다이렉트 49는 월 49,000원에 데이터 120GB를 제공하고 소진 후 5Mbps로 이용하는 온라인 전용 상품입니다. 월 5만 원 안팎의 매장 가입 요금제로는 밸런스 49(11GB)와 베이직 50(10GB)이 있습니다. 만 19~34세라면 월 45,000원에 데이터 100GB를 제공하는 청년 100GB 요금제도 이용할 수 있습니다."], "113": ["5G 스탠다드에 약정 할인을 받으면 월 요금이 얼마인가요?", "5G 스탠다드 월 75,000원에 25% 할인이 적용되어 월 56,250원입니다."], "114": ["5G 라이트 요금제 약정 할인 후 금액이 궁금해요.", "5G 라이트 월 55,000원에 25% 할인이 적용되어 월 41,250원입니다."], "1110": ["Ubot 데이터 요금제 시리즈는 어떤 요금제인가요?", "Ubot 데이터 시리즈는 300MB(월 28,000원)부터 150GB(월 75,000원)까지 데이터 제공량에 따라 고르는 요금제이며 데이터 MAX(월 85,000원)는 무제한입니다. 데이터 시리즈 중 300MB·750MB는 음성 125분·문자 150건을 제공하고 나머지는 음성·문자를 기본 제공합니다."], "319": ["알뜰폰도 같은 통신망을 쓰나요?", "통신사 망을 이용하는 알뜰폰 서비스도 있습니다. 알뜰폰의 요금과 가입은 해당 알뜰폰 사업자 고객센터에 문의해 주세요."], "1470": ["본인인증할 때 통신사는 어디를 선택하나요?", "Ubot 회선으로 본인인증할 때는 통신사 목록에서 'Ubot'을 선택해 주세요. 본인인증 통신사 목록에 Ubot이 없으면 '알뜰폰'을 선택한 뒤 Ubot을 고르면 됩니다."], "425": ["알뜰폰 쓰다가 넘어오려는데 상담받을 매장이 가까이 있나요?", "알뜰폰에서 번호이동할 때 상담할 수 있는 매장을 현재 위치 주변에서 찾아 드립니다. 알뜰폰 회선도 번호이동할 수 있습니다."], "1394": ["수리 기간 동안 쓸 임대폰을 빌릴 수 있나요?", "휴대폰 수리 접수증이나 분실 신고 내역을 Ubot 매장에 보여 주면 임대폰을 빌릴 수 있습니다. Ubot 임대폰은 최초 7일 무료이며 이후 임대 기간에는 하루 2,200원이 청구됩니다."], "1882": ["데이터 충전 뜻은 무엇인가요?", "기본 제공 데이터를 다 쓰거나 더 필요할 때 추가 데이터를 구매하거나 받는 것입니다."], "872": ["지난달에는 데이터 충전을 몇 번 했었나요?", "회원의 지난달 데이터 충전 내역을 조회해 충전 횟수와 용량을 안내해 드립니다."], "742": ["이번 청구서에 데이터 충전비가 얼마 들어갔어요?", "회원의 이번 달 청구 내역을 조회해 청구서에 포함된 데이터 충전 요금을 안내해 드립니다."], "873": ["지난달 데이터 충전에 쓴 돈이 얼마예요?", "회원의 지난달 데이터 충전 내역을 조회해 충전에 쓴 금액을 안내해 드립니다. 지난달 데이터 충전 요금은 다음 달 요금에 합산됩니다."], "696": ["이번 달에 데이터 충전을 몇 번 했는지 알려 주세요.", "회원의 이번 달 데이터 충전 내역을 조회해 충전 횟수와 금액을 안내해 드립니다. 이번 달 데이터 충전 요금은 다음 달 요금에 합산됩니다."], "1887": ["데이터 초과 요금 뜻은 무엇인가요?", "요금제의 제공 범위를 넘어 모바일 데이터를 사용했을 때 조건에 따라 추가로 청구될 수 있는 요금입니다."], "132": ["청구서에 데이터 충전 요금이 있는데 언제 충전한 건가요?", "청구서에 나온 데이터 충전 요금의 충전 일시와 용량은 앱의 요금 상세 내역에서 확인할 수 있습니다."], "1073": ["가입한 적 없는 유료 부가서비스가 있어요.", "가입한 적 없는 유료 부가서비스가 있다면 Ubot 앱의 부가서비스 메뉴에서 가입 일시와 경로를 확인하고 바로 해지할 수 있습니다. 동의 없이 가입된 유료 부가서비스로 확인되면 고객센터(114)에서 가입일부터의 요금을 돌려 드립니다."], "1439": ["해지 증명서나 가입 증명서를 받을 수 있나요?", "가입 중인 회선의 가입 증명서는 Ubot 앱·홈페이지에서 바로 발급받을 수 있습니다. 해지한 회선의 해지 증명서는 신분증을 가지고 매장을 방문하거나 고객센터에 요청하면 받을 수 있습니다."], "1448": ["분실 신고는 어디에서 할 수 있나요?", "분실 신고는 Ubot 앱·홈페이지에서 본인인증 후 할 수 있습니다. 다른 전화로 114(Ubot 휴대폰이 아니면 홈페이지의 고객센터 대표번호)에 걸어 ARS로 24시간 분실 신고할 수도 있습니다. Ubot 매장에서도 신분증을 보여 주면 분실 신고할 수 있습니다."], "1456": ["분실한 동안 쓸 임대폰을 빌릴 수 있나요?", "분실 신고 후 Ubot 매장에서 신분증을 보여 주면 임대폰을 빌릴 수 있습니다. 분실 시 빌린 임대폰은 최초 7일 무료이고 이후 하루 2,200원이 청구됩니다. 임대폰을 잃어버리거나 파손하면 정해진 변상금이 청구됩니다."], "1455": ["듀얼번호를 쓰는데 분실 신고를 각각 해야 하나요?", "주 회선을 분실 신고하면 같은 휴대폰의 듀얼번호도 함께 정지됩니다. 유심과 eSIM에 다른 회선을 따로 개통해 쓰고 있었다면 분실한 휴대폰의 회선마다 신고해 주세요."], "1520": ["매장까지 가는 길을 알려 주세요.", "매장을 고른 뒤 도보, 자동차, 대중교통 중 이동 방법을 선택하면 현재 위치에서 매장까지 가는 경로와 예상 시간을 안내해 드립니다."], "1488": ["가까운 Ubot 매장은 어떻게 찾나요?", "가까운 Ubot 매장은 Ubot 앱이나 홈페이지의 매장 찾기에서 현재 위치, 지명·역 이름, 시·도와 시·군·구로 검색할 수 있습니다. Ubot 매장 찾기에서는 매장별 영업시간도 확인할 수 있습니다. 챗봇에 지역명을 말씀해 주셔도 가까운 매장을 찾아 드립니다."], "1512": ["내 주변에 있는 Ubot 매장을 찾아 주세요.", "현재 위치를 허용하면 가까운 Ubot 매장을 거리순으로 찾아 지도와 함께 보여 드립니다. 매장 검색에서 위치를 허용하지 않으면 지역이나 역 이름을 알려 주세요."], "1552": ["앱에서 지역별로 매장 목록을 볼 수 있나요?", "Ubot 앱의 매장 찾기에서 시·도를 고른 뒤 시·군·구를 고르면 그 지역에서 운영 중인 매장 목록을 볼 수 있습니다."], "1553": ["지도에서 매장 위치를 볼 수 있나요?", "Ubot 매장 찾기 지도에서 매장 위치를 볼 수 있습니다. 매장 찾기 지도를 넓게 보면 가까운 매장이 묶여 개수로 표시됩니다. 지도에서 묶음을 누르거나 확대하면 매장이 하나씩 보입니다."], "1527": ["근처에 매장이 없다고 나와요.", "검색한 반경 안에 Ubot 매장이 없으면 매장이 없다는 안내가 나옵니다. 근처 매장을 찾으려면 검색 범위를 넓히거나 가까운 다른 지역·역 이름으로 검색해 주세요."], "1554": ["특정 서비스가 되는 매장만 찾을 수 있나요?", "Ubot 매장 찾기에서 명의도용 접수, 애플 A/S, 외국어 지원 같은 서비스 종류를 고르면 그 서비스를 제공하는 매장만 볼 수 있습니다."], "254": ["집 전화로 고객센터에 걸려면 몇 번인가요?", "집 전화 등 일반전화로 고객센터에 연락하려면 1500-0000으로 걸어 주세요. 휴대폰으로 고객센터에 연락할 때는 114로 걸 수 있습니다."], "1516": ["매장 전화번호를 알려 주세요.", "매장 이름이나 지역을 알려 주시면 해당 매장의 전화번호와 주소를 안내해 드립니다."], "1486": ["고객센터 전화는 무료인가요?", "Ubot 휴대폰에서 114로 거는 고객센터 전화는 ARS와 상담원 모두 무료입니다. 다른 통신사 휴대폰이나 일반 전화로 고객센터에 걸면 통화료가 발생합니다."], "501": ["이 매장에 전화해 보고 싶은데 연락처가 어떻게 돼요?", "전화하려는 매장의 연락처는 해당 매장 정보에서 안내해 드립니다."], "1529": ["제 명의로 가입된 회선을 모두 알려 주세요.", "로그인하면 회원님 명의로 가입된 휴대폰·태블릿·워치 회선의 번호, 요금제, 이용 상태를 조회해 안내해 드립니다."], "887": ["통화 연결음은 언제 신청했었는지 알려 주세요.", "회원의 부가서비스 이력을 조회해 통화 연결음 가입일을 안내해 드립니다."], "888": ["통화 연결음 요금이 이번 달 얼마 나왔어요?", "회원의 이번 달 청구 내역을 조회해 통화 연결음 서비스 요금을 안내해 드립니다. 통화 연결음 서비스의 월 요금은 1,100원입니다."], "1226": ["HD Voice(VoLTE)가 무엇인가요?", "HD Voice(VoLTE)는 LTE·5G망으로 통화하는 고음질 음성통화로 일반 통화보다 소리가 선명하고 연결이 빠릅니다. HD Voice를 지원하는 휴대폰에서는 설정에서 켤 수 있으며 통화량은 일반 통화와 같이 계산됩니다."], "1498": ["Ubot 앱이 실행되지 않아요.", "Ubot 앱이 실행되지 않으면 앱을 최신 버전으로 업데이트하고 휴대폰을 다시 켜 주세요. 그래도 Ubot 앱이 실행되지 않으면 앱 캐시를 지우거나 앱을 삭제 후 다시 설치해 주세요. 앱 문제가 계속되면 홈페이지에서 같은 업무를 이용해 주세요."], "1596": ["회원 가입할 때 비밀번호 조건이 있나요?", "회원 가입 비밀번호는 8자 이상 20자 이하로 정하고 비밀번호 확인 칸에 같은 값을 입력해야 합니다. 한글처럼 글자당 용량이 큰 문자는 비밀번호에 입력할 수 있는 글자 수가 더 적을 수 있습니다."], "1080": ["번호이동 신청 중 이전 통신사 정보가 일치하지 않는다고 나와요.", "번호이동 신청 중 정보 불일치 안내는 신청서의 이름, 휴대폰 번호, 이전 통신사, 생년월일이 이전 통신사 등록 정보와 다를 때 나옵니다. 번호이동 정보를 다시 확인해 입력해 주세요. 번호이동 정보 불일치 안내가 반복되면 이전 통신사 고객센터에서 가입 정보를 확인해 주세요."], "1471": ["듀얼번호로도 본인인증을 할 수 있나요?", "듀얼번호로는 본인인증을 할 수 없으며 본인인증 문자는 주 회선으로만 받을 수 있습니다."], "1378": ["청년끼리 결합할 수 있나요?", "Ubot 청년 듀오는 만 19~34세의 청년 요금제 2회선을 결합하면 월 6,000원을 할인합니다. 청년 듀오 구성원 중 한 명이라도 청년 요금제를 벗어나면 결합 할인이 종료됩니다."], "436": ["어르신 요금제 상담받을 매장을 부모님 댁 근처에서 찾고 있어요.", "부모님 댁 주소 주변에서 시니어 요금제 상담을 받을 수 있는 매장을 찾아 드립니다. 시니어 LTE 요금제는 만 65세 이상 고객이 직접 신청할 수 있습니다."], "1340": ["시각·청각 장애인을 위한 서비스가 있나요?", "시각 장애인은 점자 청구서와 음성 안내 청구서를 이용할 수 있고 청각 장애인은 문자·영상 상담을 이용할 수 있습니다. 장애인 고객을 위한 서비스를 신청하려면 복지 할인을 등록한 뒤 고객센터나 매장에 문의해 주세요."], "827": ["이번 여행에서 로밍 요금이 지금까지 얼마 나왔어요?", "회원의 이번 여행 로밍 이용 내역을 조회해 지금까지 발생한 로밍 요금을 안내해 드립니다. 해외 로밍 요금의 실제 청구는 사용 후 1~2개월 늦게 될 수 있습니다."], "745": ["지난달 해외에서 쓴 로밍 요금이 이번 청구서에 들어갔나요?", "회원의 이번 달 청구 내역을 조회해 지난달 해외에서 쓴 로밍 요금이 포함됐는지 안내해 드립니다. 해외 로밍 요금은 사용 후 1~2개월 늦게 청구될 수 있습니다."], "200": ["로밍 요금이 이번 달 청구서에 없어요.", "해외 로밍 요금은 해외 통신사와 정산하는 과정 때문에 이번 달 청구서에 없고 1~2개월 늦게 청구될 수 있습니다."], "1767": ["테더링 뜻이 무엇인가요?", "휴대폰의 모바일 데이터 연결을 다른 기기와 공유하는 기능입니다. 와이파이 핫스팟·USB·블루투스 방식이 있습니다."], "1311": ["로밍 중에 테더링을 쓸 수 있나요?", "로밍 상품 제공량 안에서 테더링을 이용할 수 있으며 테더링으로 쓴 데이터도 같은 로밍 데이터 제공량에서 차감됩니다."], "1208": ["테더링 사용량은 어디에서 확인하나요?", "Ubot 앱의 사용량 상세에서 이번 달 테더링 사용량과 남은 테더링 한도를 확인할 수 있습니다."], "1207": ["테더링(핫스팟)을 쓸 수 있나요?", "데이터 기본 제공량이 있는 요금제라면 요금제별 테더링 한도까지 핫스팟을 이용할 수 있으며 테더링 사용량은 기본 데이터에서 함께 차감됩니다. 테더링 한도를 모두 쓰면 테더링만 차단되고 휴대폰 자체 데이터는 계속 이용할 수 있습니다."], "1142": ["테더링은 모든 요금제에서 쓸 수 있나요?", "데이터 기본 제공량이 있는 요금제라면 해당 요금제에서 정한 한도까지 테더링을 이용할 수 있습니다. 키즈·워치 요금제와 통화 전용 요금제는 테더링을 제공하지 않습니다."], "1122": ["요금제마다 테더링은 얼마나 쓸 수 있나요?", "테더링 한도는 요금제마다 다르며 데이터 무제한 요금제는 월 40GB~140GB, 데이터 제공량이 정해진 요금제는 대부분 기본 제공량과 월 20GB 중 적은 쪽입니다. 사용 중인 요금제의 정확한 테더링 한도는 앱의 요금제 상세에서 확인할 수 있습니다."], "1645": ["휴대폰을 USB 케이블로 연결해 컴퓨터에서 인터넷을 쓸 수 있나요?", "휴대폰을 데이터 전송이 가능한 USB 케이블로 컴퓨터에 연결한 뒤 USB 테더링을 켜면 컴퓨터에서 인터넷을 쓸 수 있습니다. USB 테더링을 이용하려면 컴퓨터 운영체제와 드라이버 지원을 확인해야 합니다. USB 테더링 사용량은 해당 회선의 테더링 조건에 따라 적용됩니다."], "1016": ["와이파이로 전화를 걸 수 있나요?", "와이파이 콜링을 지원하는 단말기에서 기능을 설정하면 와이파이 연결 상태로 전화를 걸 수 있습니다. 와이파이 콜링 지원 여부와 요금 적용은 단말기와 요금제에 따라 달라 고객센터에서 확인해 주세요."], "1895": ["와이파이 연결 뜻은 무엇인가요?", "휴대폰이나 컴퓨터가 가까운 무선 공유기의 네트워크에 접속한 상태입니다. 인터넷 이용 가능 여부는 별개입니다."], "1219": ["공공장소 무료 Wi-Fi를 쓸 수 있나요?", "Ubot은 별도의 통신사 전용 Wi-Fi를 운영하지 않습니다. 지하철·공공기관의 공공 Wi-Fi는 통신사와 관계없이 누구나 이용할 수 있습니다. 공공 Wi-Fi에서는 금융 거래처럼 민감한 작업을 하지 않는 것이 좋습니다."], "168": ["집에서는 와이파이만 쓰게 하려면 어떻게 하나요?", "집에서 휴대폰의 와이파이를 켜 두면 와이파이에 연결된 동안에는 모바일 데이터를 사용하지 않습니다. 집에서 모바일 데이터를 함께 꺼 두면 와이파이만 사용하는 상태를 더 확실하게 유지할 수 있습니다."], "1005": ["와이파이는 연결됐는데 인터넷을 사용할 수 없으면 무엇을 확인하나요?", "와이파이에 연결됐는데 인터넷이 되지 않으면 같은 와이파이를 쓰는 다른 기기에서도 문제가 나는지 확인하고 공유기와 휴대폰을 다시 시작해 보세요. 같은 와이파이에서 모든 기기의 인터넷이 안 되면 회선 장애를 문의해 주세요. 같은 와이파이에서 한 기기만 인터넷이 안 되면 그 기기의 네트워크 설정을 점검해 주세요."], "1644": ["모바일 핫스팟의 비밀번호를 바꾸려면 어떻게 하나요?", "휴대폰 설정의 모바일 핫스팟 또는 개인용 핫스팟에서 와이파이 비밀번호를 변경하세요. 핫스팟 비밀번호를 바꾸면 연결된 기기가 끊길 수 있으므로 새 암호로 다시 접속해야 합니다."], "1497": ["휴대폰 위젯에 남은 데이터가 표시되지 않아요.", "Ubot 앱 위젯에 남은 데이터가 표시되지 않으면 앱을 최신 버전으로 업데이트한 뒤 한 번 로그인하고 위젯을 지웠다가 다시 추가해 주세요. 요금제나 번호를 바꾼 직후에는 위젯의 남은 데이터 정보가 갱신될 때까지 시간이 걸릴 수 있습니다."], "1678": ["IPTV에서 자녀가 성인 채널을 보지 못하게 할 수 있나요?", "IPTV의 시청 연령 제한·자녀 보호 메뉴에서 성인 콘텐츠 차단과 보호 비밀번호를 설정하세요. IPTV에 연결된 OTT 앱에는 성인 콘텐츠를 막기 위한 별도 보호 설정이 필요할 수 있습니다."], "1358": ["회선을 해지하면 포인트는 어떻게 되나요?", "Ubot 회선을 해지하면 남은 포인트는 소멸됩니다. 회선을 해지하기 전에 포인트를 마지막 요금 납부에 쓰거나 본인 명의의 다른 Ubot 회선으로 옮겨 두세요."], "1365": ["멤버십을 탈퇴할 수 있나요?", "Ubot 멤버십은 앱의 멤버십 설정에서 탈퇴할 수 있습니다. 멤버십을 탈퇴해도 휴대폰 회선은 유지되지만 남은 혜택 횟수와 포인트 사용은 중지됩니다."], "1417": ["휴대폰을 해지하려면 어떻게 하나요?", "휴대폰 회선은 명의자 본인이 신분증을 가지고 매장을 방문하거나 고객센터(114)에서 본인 확인 후 해지할 수 있습니다. 휴대폰을 해지하기 전에는 남은 할부금과 할인반환금을 앱에서 확인해 주세요."], "1674": ["IPTV 화면이 멈추거나 모자이크처럼 깨져요.", "IPTV 화면이 멈추거나 모자이크처럼 깨지면 인터넷 장비와 셋톱박스의 연결 상태를 확인하고 다운로드 등 큰 트래픽을 잠시 멈춰 보세요. IPTV 화면 문제가 장비 재시작 후에도 반복되면 발생 채널과 시간을 기록해 회선·셋톱박스 점검을 요청하세요."], "1403": ["기기 변경 후 예전 휴대폰의 연락처와 사진은 어떻게 옮기나요?", "기기 변경 후 예전 휴대폰의 연락처·사진·앱은 갤럭시 Smart Switch나 아이폰 빠른 시작·iCloud 백업으로 옮길 수 있습니다. 휴대폰 데이터 이동이 어렵다면 매장에서 도움을 받을 수 있습니다."], "1658": ["인터넷 모뎀과 공유기는 어떤 순서로 재부팅하나요?", "인터넷 장비를 재부팅할 때는 일반적으로 모뎀의 연결 상태가 안정된 뒤 공유기를 켭니다. 모뎀과 공유기의 전원을 다시 연결한 뒤 각 장비의 부팅이 끝날 때까지 기다리세요. 장비별 재부팅 안내가 있으면 그 순서를 따르고 초기화 버튼과 전원 버튼을 혼동하지 마세요."], "1461": ["분실 신고된 휴대폰으로 기기 변경을 할 수 있나요?", "분실·도난 신고된 휴대폰은 국내 통신사에서 개통이 차단되어 기기 변경에 쓸 수 없습니다. 본인 휴대폰을 찾았다면 기기 변경 전에 분실 신고를 해제해 주세요."], "223": ["약정 기간에 휴대폰만 바꿔도 되나요?", "선택약정 기간 중에도 약정을 유지한 채 휴대폰만 바꿀 수 있습니다. 약정 중 새 휴대폰을 할부로 구매하면 새 단말의 할부금은 별도로 청구됩니다."], "863": ["제가 그동안 썼던 폰 기종 목록을 볼 수 있어요?", "회원의 단말 변경 이력을 조회해 지금까지 등록된 기종을 안내해 드립니다."], "1773": ["단말 할부금 뜻이 무엇인가요?", "휴대폰 구매 대금을 여러 달에 나누어 납부하는 금액입니다. 통신요금과 별도 항목입니다."], "996": ["폰 할부가 언제부터 시작됐어요?", "회원의 단말 할부 정보를 조회해 할부 시작일을 안내해 드립니다."], "1397": ["남은 할부금은 어디에서 확인하나요?", "Ubot 앱의 가입 정보에서 남은 할부 원금, 남은 개월 수, 이번 달 할부금을 확인할 수 있습니다."], "230": ["잃어버린 휴대폰의 할부금은 어떻게 되나요?", "분실한 휴대폰의 단말 할부금은 기기 사용 여부와 관계없이 남은 금액이 계속 청구됩니다. 분실한 휴대폰의 할부금을 한 번에 정리하려면 앱이나 매장에서 중도 완납할 수 있습니다."], "899": ["지난달 할부금이 얼마 빠져나갔어요?", "회원의 지난달 청구 내역을 조회해 단말 할부금과 할부 수수료를 안내해 드립니다."], "724": ["이번 달 요금에서 할부금이 얼마고 통신비가 얼마인지 나눠서 알려 주세요.", "회원의 이번 달 휴대폰 요금 청구 내역을 조회해 요금제 월정액, 단말 할부금, 부가서비스 등 항목별 금액을 안내해 드립니다."], "1184": ["할부를 24개월로 했는데 할부금이 25번 청구됐어요.", "단말 할부금은 하루 단위로 계산해 매월 1일부터 말일까지의 금액을 다음 달에 청구합니다. 휴대폰을 월 중간에 24개월 할부로 샀다면 첫 달과 마지막 달 금액이 나뉘어 청구 횟수가 25번이 될 수 있지만 전체 금액은 같습니다."], "1547": ["제 휴대폰 할부금이 얼마나 남았나요?", "로그인하면 회원님 회선의 할부 기기명, 할부 개월 수와 낸 개월 수, 월 할부금, 남은 할부 원금을 조회해 안내해 드립니다."], "939": ["할부 원금 남은 거 얼마예요?", "회원의 단말 할부 정보를 조회해 남은 원금을 안내해 드립니다."], "215": ["남은 할부금이 얼마인지 어디에서 보나요?", "남은 단말 할부 원금과 할부 회차는 앱의 가입 정보나 청구 내역에서 확인할 수 있습니다."], "1855": ["잔여 할부금 뜻은 무엇인가요?", "아직 납부하지 않은 휴대폰 할부 대금입니다."], "940": ["태블릿 할부금은 얼마나 남았어요?", "회원의 태블릿 단말 할부 정보를 조회해 남은 할부금을 안내해 드립니다."], "680": ["제 폰 할부 몇 개월 남았어요?", "회원의 휴대폰 단말 할부 정보를 조회해 남은 할부 회차와 원금을 안내해 드립니다."], "778": ["폰을 잃어버렸는데 제 남은 할부금이 얼마예요?", "분실한 휴대폰의 단말 할부 정보를 조회해 남은 할부금을 안내해 드립니다. 휴대폰을 분실해도 남은 단말 할부금은 계속 청구됩니다."], "1182": ["납부 확인서는 어디에서 발급받나요?", "납부 확인서는 Ubot 앱·홈페이지에서 최근 5년 치까지 바로 발급받을 수 있습니다. 해지한 회선의 납부 확인서는 신분증을 가지고 매장을 방문하거나 고객센터에 요청해 주세요."], "126": ["휴대폰 요금 납부 확인서는 어디서 발급하나요?", "앱이나 홈페이지에서 최근 5년 치 납부 확인서를 발급받을 수 있습니다."], "721": ["지난달 요금이 얼마 나왔는지 알려 주세요.", "회원의 휴대폰 요금 청구 내역을 조회해 지난달 청구 금액과 항목을 안내해 드립니다."], "907": ["요금 자동납부 카드가 어떤 카드로 등록돼 있어요?", "회원의 납부 정보를 조회해 등록된 카드를 일부 가린 형태로 안내해 드립니다."], "1619": ["휴대폰 분실 신고를 하면 통신요금 자동이체도 함께 중단되나요?", "휴대폰 분실 신고에 따른 회선 이용 정지와 요금 자동납부는 별도로 확인해 주세요. 분실 정지 후 청구서와 자동납부 설정에서 발생하는 요금 및 출금 예정액을 확인해 주세요. 분실 정지 후 납부 방법을 바꿔야 한다면 공식 상담 채널에 문의해 주세요."], "675": ["제 요금이 어떤 카드나 계좌로 나가고 있어요?", "회원의 요금 납부 정보를 조회해 등록된 결제 카드나 계좌를 일부 가린 형태로 안내해 드립니다."], "1183": ["통신 요금도 현금영수증을 받을 수 있나요?", "통신 요금은 부가세가 포함된 세금계산서 대상이라 현금영수증이 발급되지 않습니다. 기기 할부금, 유심·eSIM 비용, 휴대폰 결제 금액을 현금으로 낸 경우에는 현금영수증을 받을 수 있습니다."], "1026": ["통신요금도 현금영수증이나 소득공제 증빙을 받을 수 있나요?", "통신 요금 자체는 현금영수증이 발급되지 않으며 연말정산 소득공제 대상도 아닙니다. 통신 요금 납부 사실이 필요한 경우 Ubot 앱·홈페이지에서 납부 확인서를 발급받을 수 있습니다. 기기 할부금이나 유심·eSIM 비용 등을 현금으로 낸 경우의 현금영수증 발급 여부는 결제 내역에서 확인해 주세요."], "1063": ["가입 사실 확인서를 받을 수 있나요?", "가입 사실 확인서는 앱·홈페이지에서 바로 발급받거나 매장·고객센터에 요청할 수 있습니다."], "1361": ["실물 멤버십 카드를 받을 수 있나요?", "Ubot 멤버십은 앱의 모바일 카드로만 제공되며 실물 카드는 발급하지 않습니다."], "1489": ["고객센터에 서류를 보내야 할 때는 어떻게 하나요?", "고객센터에 제출할 서류는 Ubot 앱의 서류 제출 메뉴에서 사진을 찍어 올릴 수 있습니다. 상담원이 서류 제출을 요청했다면 안내받은 접수 번호를 함께 입력해 주세요."], "1332": ["발신번호 표시 서비스가 무엇인가요?", "발신번호 표시 서비스는 전화가 왔을 때 건 사람의 번호를 화면에 보여 주는 무료 서비스로 기본 가입되어 있습니다. 상대방이 발신번호를 숨기고 건 전화는 번호가 표시되지 않습니다."], "1545": ["제 가입 기간은 얼마나 되나요?", "로그인하면 회원님의 Ubot 가입일과 회선별 개통일을 조회해 이용 기간을 안내해 드립니다."], "1454": ["분실한 휴대폰의 유심을 다른 사람이 쓸 수 있나요?", "분실 정지를 하면 잃어버린 휴대폰의 유심으로 전화·문자·데이터를 쓸 수 없습니다. 분실 전에 유심 PIN 잠금과 유심 보호 서비스를 켜 두면 다른 사람이 유심을 쓰는 위험을 줄일 수 있습니다."], "1835": ["명의자 뜻은 무엇인가요?", "통신 회선의 계약상 이름으로 등록된 사람이나 법인입니다. 실제 휴대폰 사용자와 다를 수 있습니다."], "1091": ["번호를 변경하면 홈페이지 회원 정보도 바꿔야 하나요?", "Ubot 회원 계정은 이메일로 로그인하므로 휴대폰 번호를 바꿔도 홈페이지 회원 계정을 다시 만들 필요가 없습니다. 휴대폰 번호를 바꿨다면 은행이나 쇼핑몰 등 다른 서비스에 등록한 번호는 각 서비스에서 직접 변경해야 합니다."], "144": ["번호를 바꿀 때 뒷자리를 직접 고를 수 있나요?", "번호 변경 시에도 사용 가능한 번호 목록에서 뒷자리로 검색해 원하는 번호를 고를 수 있습니다."], "714": ["제 전화가 다른 번호로 돌려지게 설정돼 있나요?", "회원의 부가서비스 정보를 조회해 착신 전환 설정 여부와 현재 전환 번호를 안내해 드립니다."], "1206": ["최근 몇 달의 데이터 사용량을 볼 수 있나요?", "최근 6개월 동안의 월별 데이터·통화·문자 사용량은 Ubot 앱의 사용량 조회에서 확인할 수 있습니다. 최근 몇 달의 데이터 사용량은 요금제를 고를 때 참고할 수 있습니다."], "1251": ["남은 통화량은 어떻게 확인하나요?", "남은 통화·문자 제공량은 Ubot 앱 첫 화면이나 114 자동응답에서 확인할 수 있습니다. 음성통화가 기본 제공되는 요금제에서는 남은 통화량이 '무제한'으로 표시됩니다."], "1585": ["챗봇 답변이 오래 걸려요.", "챗봇 질문은 접수된 순서대로 처리되고 화면에 진행 상황이 표시됩니다. 챗봇에 질문이 몰리면 답변을 받는 데 시간이 더 걸릴 수 있습니다. 답변 처리가 오래 끝나지 않으면 실패로 안내되니 재시도 버튼으로 다시 보내 주세요."], "885": ["통화 몇 분 남았는지 확인해 주세요.", "회원의 요금제와 이번 달 사용량을 조회해 남은 통화 시간을 안내해 드립니다."], "1117": ["워치 요금제 종류와 가격이 궁금해요.", "Ubot 워치 요금제는 0.5GB(월 5,500원, 음성 50분·문자 100건), 1GB(8,800원, 음성 100분·문자 250건), 2GB(11,000원, 음성 200분·문자 500건)가 있습니다. Ubot 워치 요금제는 데이터를 다 쓰면 차단되며 같은 명의의 Ubot 휴대폰과 연결해야 이용할 수 있습니다."], "1138": ["태블릿이나 워치에서 쓸 수 있는 요금제가 있나요?", "태블릿은 데이터 전용 Ubot 태블릿 요금제(5GB 월 9,900원~50GB 월 29,900원)를 이용할 수 있습니다. 스마트워치는 Ubot 워치 요금제(0.5GB 월 5,500원~2GB 월 11,000원)를 이용할 수 있습니다. Ubot 태블릿 요금제와 워치 요금제는 모두 데이터를 다 쓰면 차단됩니다."], "103": ["태블릿에서 쓸 수 있는 요금제가 있나요?", "태블릿은 데이터 전용 Ubot 태블릿 요금제를 이용할 수 있습니다. Ubot 태블릿 요금제는 5GB 월 9,900원부터 50GB 월 29,900원까지 있으며 음성·문자는 제공하지 않습니다. 스마트워치는 별도의 Ubot 워치 요금제를 이용할 수 있습니다."], "21": ["데이터가 예상보다 빨리 소진됩니다.", "데이터가 예상보다 빨리 소진된다면 동영상 스트리밍, 앱 업데이트, 백그라운드 데이터 사용 등을 확인해 주세요."], "868": ["남은 데이터가 몇 기가인지 지금 알려 주세요.", "회원의 이번 달 사용량을 조회해 남은 기본 데이터를 GB 단위로 안내해 드립니다."], "869": ["오늘 기준으로 제 남은 데이터 양을 알려 줄래요?", "회원의 회선 정보를 조회해 현재 남은 데이터와 충전 데이터를 함께 안내해 드립니다."], "12": ["유심이 휴대폰에서 인식되지 않아요.", "휴대폰에서 유심이 인식되지 않으면 유심을 다시 장착하고 휴대폰을 재부팅해 보세요. 재부팅 후에도 유심이 인식되지 않으면 재발급을 권장합니다."], "1260": ["새 유심을 받았는데 끼워도 사용이 안 돼요.", "새 유심은 교체 등록을 해야 사용할 수 있습니다. Ubot 앱의 유심 교체 메뉴에 새 유심 번호를 등록한 뒤 휴대폰을 다시 켜 주세요. 새 유심을 등록한 뒤에도 이용할 수 없다면 고객센터(114)에 문의해 주세요."], "1680": ["이미 해외에 도착했는데 지금 로밍 패스에 가입할 수 있나요?", "이미 해외에 도착했어도 데이터 로밍이나 현지 와이파이로 통신사 앱에 접속하면 로밍 패스에 가입할 수 있습니다. 해외에서 가입한 로밍 패스와 이용 기간은 앱의 로밍 메뉴에서 확인해 주세요."], "203": ["로밍 패스에 가입하면 통화도 포함되나요?", "로밍 패스에 통화가 포함되는지는 가입하는 상품의 권역과 기간에 따라 제공 범위가 다르므로 확인해야 합니다. 로밍 패스에 가입하기 전 앱의 로밍 메뉴에서 해당 상품의 통화 제공 내용을 확인해 주세요."], "48": ["해지하면 남은 단말기 할부금은 어떻게 되나요?", "통신 서비스를 해지해도 남은 단말기 할부금은 계속 납부해야 합니다."], "1176": ["해지한 뒤 더 낸 요금은 어떻게 돌려받나요?", "회선을 해지한 뒤 과납금이 남았다면 앱이나 고객센터에 환불 계좌를 등록해 7영업일 안에 돌려받을 수 있습니다. 해지 후 과납금이 100원 이상이면 등록된 자동이체 계좌로 자동 환불됩니다."], "291": ["보유 포인트는 어디에서 확인하나요?", "앱의 멤버십 메뉴에서 보유 포인트와 적립·사용 내역을 확인할 수 있습니다."], "1356": ["포인트 잔액은 어디에서 확인하나요?", "Ubot 앱의 포인트 메뉴에서 잔액, 적립·사용 내역, 소멸 예정 포인트를 확인할 수 있습니다. Ubot 포인트가 소멸되기 30일 전에는 문자로도 알려 드립니다."], "1083": ["번호이동을 철회하면 예전 통신사 번호를 다시 쓸 수 있나요?", "번호이동을 철회한 뒤 예전 번호를 계속 쓰려면 철회 완료 후 4일 안에 이전 통신사 매장에서 다시 가입해야 합니다. 번호이동 철회 후 4일이 지나면 예전 번호를 되찾지 못할 수 있으니 바로 이전 통신사에 방문해 주세요."], "1087": ["번호이동하면 휴대폰 결제 자동결제도 유지되나요?", "휴대폰 결제 자동결제는 통신사별로 관리되므로 번호이동이나 명의 변경을 하면 해지됩니다. 번호이동 후 휴대폰 결제 자동결제가 필요하다면 Ubot에서 해당 서비스의 자동결제를 다시 등록해 주세요."], "1092": ["번호를 변경해도 가입한 부가서비스는 유지되나요?", "휴대폰 번호나 기기를 변경해도 가입한 부가서비스는 그대로 유지됩니다. 번호 변경 후 새 기기에서 지원하지 않는 부가서비스는 자동 해지될 수 있습니다."], "292": ["번호를 바꾸면 등급과 포인트가 사라지나요?", "휴대폰 번호를 변경해도 같은 회선이 유지되므로 멤버십 등급과 포인트는 그대로 유지됩니다."], "1449": ["잃어버린 휴대폰의 위치를 찾을 수 있나요?", "분실한 휴대폰의 위치 찾기 기능이 켜져 있었다면 갤럭시는 삼성 내 디바이스 찾기, 아이폰은 나의 찾기에서 위치를 확인할 수 있습니다. 통신사는 개인에게 분실 휴대폰의 위치를 알려 줄 수 없습니다."], "1622": ["새 휴대폰을 마련하기 전까지 임대폰을 이용할 수 있나요?", "새 휴대폰을 마련하기 전 임대폰을 쓸 수 있는지 가입 통신사의 고객센터나 방문 예정 매장에서 신청 대상, 재고, 이용 기간 및 비용을 확인해 주세요. 임대폰을 이용할 수 있다면 회선과 유심을 임대 기기에 연결하는 절차를 안내받아 주세요."], "671": ["저 이번 달 요금 얼마 나왔어요?", "로그인한 회원의 이번 달 청구 내역을 조회해 휴대폰 요금 총액과 항목을 안내해 드립니다. 휴대폰 요금의 청구 기간은 매월 1일부터 말일까지의 사용분입니다."], "895": ["두 달 전 요금이 얼마였는지 확인해 주세요.", "회원의 청구 내역을 조회해 두 달 전 청구 금액을 안내해 드립니다."], "676": ["제가 지금 무슨 요금제 쓰고 있어요?", "로그인한 회원의 회선 정보를 조회해 현재 사용 중인 요금제와 월정액, 기본 제공량을 안내해 드립니다."], "1189": ["휴대폰 결제를 취소하고 싶어요.", "휴대폰 결제를 취소하려면 결제한 쇼핑몰·앱 등 가맹점에 요청해야 합니다. 휴대폰 결제를 결제한 달 안에 취소하면 청구되지 않습니다. 휴대폰 결제를 다음 달에 취소하면 환불은 가맹점이 직접 처리합니다."], "514": ["가족 넷이 각자 다른 업무를 보려는데 다 되는 매장을 찾아요.", "현재 위치 주변에서 가족 네 명에게 필요한 업무를 모두 취급하는 매장을 찾아 드립니다. 가족이 함께 매장을 방문할 때 앱으로 방문 예약을 하면 우선 상담을 받을 수 있습니다."], "194": ["가족이 어디 있는지 확인할 수 있는 서비스가 있나요?", "가족 위치 알림은 월 1,650원이며 가족의 동의를 받은 뒤 앱에서 위치를 확인할 수 있습니다."], "1025": ["몇 달 동안 해외에 머물 때 회선은 어떻게 하나요?", "몇 달 동안 해외에 머무른다면 휴대폰 회선을 일시 정지하거나 요금제를 변경할 수 있습니다. 장기 해외 체류에 어떤 회선 유지 방법이 유리한지는 체류 기간과 이용 계획에 따라 달라 출국 전에 상담해 주세요."], "1435": ["일시정지와 장기 정지는 무엇이 다른가요?", "일시정지는 누구나 연 2회, 1회 최대 90일까지 월 3,850원에 신청할 수 있습니다. 장기 정지는 군 입대, 해외 체류, 입원처럼 증빙 서류가 있는 경우에 더 긴 기간 동안 신청할 수 있습니다."], "293": ["명의를 바꾸면 포인트는 어떻게 되나요?", "휴대폰 회선의 명의를 바꾸면 원칙적으로 이전 명의자의 멤버십 포인트는 새 명의자에게 이어지지 않습니다. 다만 가족에게 명의를 변경한 뒤 30일 안에 같은 가족과 Ubot 가족 결합에 가입하고 30일 이상 유지하면 포인트를 이어받을 수 있습니다."], "386": ["지금 보고 있는 매장의 취급 업무에 명의 변경이 있는지 확인해 주세요.", "선택하신 매장의 취급 업무에 명의 변경이 포함되는지 확인해 드립니다."], "1171": ["자동이체 계좌에 잔액이 부족해 일부만 납부됐어요.", "자동이체 계좌 잔액 부족으로 요금 일부만 납부됐다면 남은 금액은 다음 자동이체 출금일에 다시 출금됩니다. 자동이체로 일부만 납부하면 연체 가산금은 납부일에 내지 못한 금액에만 붙습니다. 남은 미납 금액을 바로 정리하려면 앱에서 즉시 납부해 주세요."], "17": ["모바일 데이터가 갑자기 안 됩니다.", "모바일 데이터가 갑자기 작동하지 않으면 데이터 설정, 비행기 모드, 데이터 잔여량 및 네트워크 상태를 확인해 주세요."], "177": ["집 안에서만 데이터가 잘 안 터져요.", "집 안에서만 데이터 연결이 잘되지 않는다면 창가나 다른 방에서 연결 상태를 확인하고 휴대폰을 재부팅해 주세요. 집 안의 특정 장소에서만 데이터가 계속 잘되지 않는다면 고객센터에 그 위치를 알려 주시면 확인해 드립니다."], "1899": ["인터넷 끊김 뜻은 무엇인가요?", "인터넷 연결이 잠시 끊어지거나 반복해서 불안정해지는 현상입니다."], "1665": ["기가 인터넷인데 컴퓨터에서는 100Mbps로만 연결돼요.", "기가 인터넷인데 컴퓨터가 100Mbps로만 연결된다면 컴퓨터 랜 포트, 랜 케이블, 공유기 포트 중 하나가 100Mbps까지만 지원하거나 연결 상태가 좋지 않을 수 있습니다. 100Mbps 연결 원인을 찾으려면 기가비트 지원 여부와 운영체제의 연결 속도를 확인하세요."], "1318": ["귀국했는데 데이터가 안 돼요.", "귀국 후 데이터가 연결되지 않으면 휴대폰을 재부팅하고 네트워크 선택을 자동으로 바꿔 주세요. 해외에서 현지 통신사를 수동 선택했거나 현지 유심을 사용했다면 귀국 후 APN 설정을 초기화해야 할 수 있습니다."], "1230": ["사진이나 동영상 문자(MMS)가 안 보내져요.", "사진이나 동영상 문자(MMS)는 모바일 데이터를 이용하므로 데이터를 켜야 보낼 수 있습니다. 모바일 데이터를 켜도 MMS가 보내지지 않으면 설정 > 모바일 네트워크 > APN을 초기화하고 휴대폰을 재부팅해 주세요."], "1753": ["콜 드롭 뜻이 무엇인가요?", "통화 중 연결이 예기치 않게 끊기는 현상입니다."], "458": ["통화가 자주 끊겨서 직접 상담받으러 갈 매장을 찾아요.", "통화가 자주 끊겨 직접 상담받고 싶다면 현재 위치 주변에서 통화 품질 상담을 지원하는 매장을 찾아 드립니다. 통화 끊김이 발생하는 장소와 시간, 사용 중인 단말기를 알려 주시면 매장이나 고객센터에서 품질 점검을 요청할 수 있습니다."], "1214": ["듀얼번호를 쓰는데 통화 중에 데이터가 끊겨요.", "한 기기에서 듀얼번호를 쓰면 한 번호로 통화하는 동안 다른 번호의 데이터가 끊길 수 있습니다. 듀얼번호 통화 중 데이터가 끊긴다면 데이터를 쓰는 번호로 통화하거나 휴대폰 설정의 통화 중 데이터 전환 기능을 켜 주세요."], "1409": ["같은 자리에 있는데 갑자기 휴대폰이 안 돼요.", "같은 장소에서 갑자기 휴대폰이 안 된다면 지역 통신 장애일 수 있으니 Ubot 앱·홈페이지의 장애 안내를 확인하고 휴대폰을 재부팅해 주세요. 장애 안내가 없는데도 휴대폰이 계속 안 되면 고객센터(114)에 연락해 주세요."], "1248": ["국제전화가 제한된다고 나와요.", "Ubot 국제전화 발신 차단에 가입돼 있거나 미성년자·선불 회선이라면 국제전화가 제한됩니다. 국제전화 발신 차단 때문에 통화가 안 된다면 앱의 부가서비스에서 차단을 해지할 수 있습니다."], "49": ["해지한 번호를 다시 사용할 수 있나요?", "휴대폰 회선을 해지한 뒤 28일 동안은 같은 명의자만 기존 번호로 다시 가입할 수 있습니다. 해지한 지 28일이 지나면 기존 번호가 다른 사람에게 배정될 수 있습니다."], "1440": ["해지한 번호를 다시 쓸 수 있나요?", "해지 후 28일 동안은 같은 명의자만 기존 번호로 다시 가입할 수 있습니다. 해지한 지 28일이 지나면 기존 번호가 다른 사람에게 배정될 수 있습니다."], "1199": ["5G가 잘 되는 지역인지 확인할 수 있나요?", "우리 동네의 5G 제공 여부는 Ubot 홈페이지의 커버리지 맵에 주소를 입력해 확인할 수 있습니다. 같은 지역에서도 5G 품질은 건물 안이나 지하에서 달라질 수 있습니다."], "1200": ["5G 속도는 실제로 얼마나 나오나요?", "5G의 최대 속도는 이론상 수치이며 실제 속도는 위치, 동시 사용자 수, 휴대폰 성능에 따라 달라집니다. 실제 5G는 일반적으로 LTE보다 빠르지만 건물 안이나 이동 중에는 속도 차이가 줄어들 수 있습니다."], "1023": ["우리 동네에서 5G가 잘 터지는지 확인할 수 있나요?", "우리 동네의 5G 제공 여부는 홈페이지나 앱의 서비스 지역 조회에서 확인할 수 있습니다. 우리 동네에서 실제 5G 통신 품질은 건물 내부나 이동 중 환경에 따라 다를 수 있습니다."], "1724": ["5G 뜻이 무엇인가요?", "5세대 이동통신으로, 4G보다 높은 데이터 용량과 낮은 지연 등을 목표로 하는 통신 체계입니다."], "124": ["청구서는 기본적으로 어떻게 받나요?", "청구서는 모바일 청구서로 기본 발송되며, 앱의 청구서 메뉴에서도 확인할 수 있습니다."], "991": ["지금 쓰는 유심 언제 바꾼 거예요?", "회원의 회선 이력을 조회해 현재 유심의 교체일을 안내해 드립니다."], "1268": ["유심을 바꾸면 유심에 충전된 교통카드 잔액은 어떻게 되나요?", "유심형 교통카드의 잔액은 유심을 바꿀 때 새 유심으로 자동 이전되지 않습니다. 유심형 교통카드를 썼다면 교체 전에 교통카드 앱에서 잔액 환불이나 이전을 신청해 주세요."], "850": ["최근에 제 유심이 교체된 적이 있나요?", "회원의 회선 이력을 조회해 최근 유심 교체 여부와 날짜를 안내해 드립니다."], "1609": ["듀얼심 휴대폰에서 모바일 데이터를 사용할 회선을 어떻게 바꾸나요?", "듀얼심 휴대폰의 SIM 또는 모바일 네트워크 설정에서 데이터용 회선을 선택해 주세요. 데이터용 회선 설정 메뉴의 이름은 기기마다 다릅니다. 데이터용 회선을 바꾼 뒤 연결 상태와 선택한 회선의 요금제·로밍 설정을 확인해 주세요."], "1407": ["태블릿이나 워치도 보험에 가입할 수 있나요?", "Ubot 회선으로 개통한 태블릿은 휴대폰 보험과 같은 조건으로 가입할 수 있습니다. 워치는 Ubot 휴대폰 보험 대상이 아니므로 제조사 보증이나 제조사 보험을 이용해 주세요."], "1567": ["예약하지 않고 매장에 가도 되나요?", "매장 예약 없이도 영업시간 안에 방문할 수 있습니다. 매장 방문을 예약하면 원하는 시간에 상담받을 수 있어 대기 시간을 줄일 수 있습니다."], "679": ["제 약정 언제 끝나요?", "로그인한 회원의 선택약정 정보를 조회해 약정 종류와 만료일을 안내해 드립니다. 선택약정은 만료 30일 전부터 재약정을 신청할 수 있습니다."], "934": ["약정 끝나는 날짜 좀 알려 주세요.", "회원의 약정 정보를 조회해 약정 만료일을 안내해 드립니다."], "766": ["제 약정이 몇 개월 남았는지 알려 주세요.", "회원의 약정 정보를 조회해 만료일까지 몇 개월 남았는지 안내해 드립니다."], "50": ["약정이 끝났는지 어디에서 확인할 수 있나요?", "약정이 끝났는지는 앱이나 홈페이지의 가입 정보에서 약정 기간을 확인해 알 수 있습니다."], "937": ["제 다른 번호 약정 만료일도 알려 주세요.", "회원 명의 다른 회선의 약정 정보를 조회해 만료일을 안내해 드립니다."], "935": ["제 약정이 언제 시작됐었나요?", "회원의 약정 정보를 조회해 약정 시작일과 기간을 안내해 드립니다."], "813": ["집 인터넷 약정이 언제 끝나요?", "회원의 집 인터넷 가입 정보를 조회해 약정 만료일을 안내해 드립니다. 인터넷 상품의 안내 요금은 3년 약정 기준입니다."], "1853": ["할부 뜻은 무엇인가요?", "휴대폰 구매 대금을 한 번에 내지 않고 여러 차례 나누어 내는 방식입니다."], "202": ["해외에 도착했는데 데이터가 안 돼요.", "해외에 도착했는데 데이터가 연결되지 않으면 휴대폰 설정에서 데이터 로밍이 켜져 있는지 확인하고 앱에서 로밍 차단 여부를 확인해 주세요. 해외 데이터가 연결되지 않는다면 로밍 패스 가입 여부도 함께 확인해 주세요."], "823": ["해외에서 지금까지 데이터를 몇 GB 썼어요?", "회원의 해외 로밍 이용 내역을 조회해 현재까지 쓴 데이터 용량을 GB 단위로 안내해 드립니다."], "329": ["앱 비밀번호를 주기적으로 바꾸고 싶어요.", "앱 비밀번호는 앱의 보안 설정에서 언제든 변경할 수 있습니다. 앱 비밀번호를 5회 연속 잘못 입력하면 30분간 잠기니 주의해 주세요."], "1476": ["Ubot 앱 비밀번호를 잊어버렸어요.", "Ubot 앱에서는 비밀번호 찾기 기능을 제공하지 않습니다. Ubot 앱 비밀번호를 잊었다면 고객센터(114)에서 본인 확인 후 초기화할 수 있습니다."], "1477": ["고객센터 상담 때 쓰는 고객 보호 비밀번호가 무엇인가요?", "고객 보호 비밀번호는 다른 사람이 나를 사칭해 고객센터에서 업무를 보지 못하도록 설정하는 숫자 4~6자리 비밀번호입니다. 고객 보호 비밀번호를 앱에서 설정해 두면 고객센터 상담 시 본인 확인에 함께 사용합니다."], "283": ["부가서비스에 대해 더 알고 싶어요.", "부가서비스의 설명과 월 요금은 앱의 부가서비스 메뉴에서 볼 수 있습니다. 부가서비스에 관한 궁금한 점은 고객센터나 AI 챗봇으로 문의해 주세요."], "911": ["제 명의 다른 번호 요금은 이번 달 얼마예요?", "회원 명의의 다른 회선 청구 내역을 조회해 이번 달 요금을 안내해 드립니다."], "788": ["이번 달에 새로 가입된 부가서비스가 있나요?", "회원의 부가서비스 가입 이력을 조회해 이번 달 새로 가입한 서비스를 안내해 드립니다."], "815": ["제가 쓰는 IPTV가 베이직인지 프리미엄인지 알려 주세요.", "회원의 IPTV 가입 정보를 조회해 현재 베이직 또는 프리미엄 중 이용 중인 상품과 월 요금을 안내해 드립니다."], "963": ["제 다른 번호에 쌓인 포인트도 알려 주세요.", "회원 명의의 다른 휴대폰 회선에 쌓인 멤버십 포인트를 조회해 안내해 드립니다. 본인 명의의 회선끼리는 멤버십 포인트를 옮길 수 있습니다."], "928": ["제 다른 번호는 어떤 요금제를 쓰고 있어요?", "회원 명의의 다른 회선을 조회해 가입된 요금제를 안내해 드립니다."], "330": ["이상한 링크가 담긴 문자가 왔어요.", "이상한 링크가 담긴 문자를 받았다면 링크를 누르지 말고 앱에서 스팸으로 신고해 주세요. 이상한 링크를 통해 결제가 발생했다면 고객센터로 연락해 주세요."], "1011": ["발신번호가 표시되지 않는 전화를 받지 않도록 차단할 수 있나요?", "발신번호가 표시되지 않는 전화를 차단하려면 휴대폰의 익명·발신번호 미표시 전화 차단 설정과 통신사의 관련 차단 서비스 제공 여부를 확인해 주세요. 수신하는 익명 전화를 차단하는 설정은 내가 거는 전화에서 발신번호를 숨기는 기능과 다릅니다."], "63": ["특정 전화번호를 차단하려면 어떻게 하나요?", "특정 전화번호는 전화 또는 메시지 앱에서 차단할 수 있습니다."], "1235": ["발신번호가 표시되지 않는 전화를 받지 않을 수 있나요?", "발신번호가 표시되지 않는 전화를 받지 않으려면 휴대폰의 알 수 없는 번호 차단 설정을 켜거나 Ubot 앱에서 익명 전화 수신 거부를 신청할 수 있습니다."], "792": ["이번 달 요금에 포인트를 얼마나 썼어요?", "회원의 이번 달 청구 내역을 조회해 휴대폰 요금 납부에 사용한 포인트를 안내해 드립니다. 휴대폰 요금 납부에는 월 최대 5,000포인트까지 사용할 수 있습니다."], "958": ["지난달 요금 낼 때 포인트를 얼마나 썼어요?", "회원의 지난달 청구 내역을 조회해 요금 납부에 사용한 포인트를 안내해 드립니다."], "864": ["중고폰 반납한 게 접수 처리됐나요?", "회원의 반납 내역을 조회해 접수 처리 상태와 보상 진행 여부를 안내해 드립니다."], "1610": ["기존 통신사에 미납 요금이 있으면 번호이동 전에 무엇을 확인해야 하나요?", "번호이동 전에 기존 통신사의 미납 내역과 번호이동 가능 상태를 확인해 주세요. 미납이 번호이동 개통에 영향을 주는지, 납부가 필요한지와 납부 후 반영 시점은 기존 통신사와 이동할 통신사의 안내를 확인해 주세요."], "1089": ["번호를 바꾸면 이전 번호로 온 전화를 어떻게 받나요?", "번호 변경 후 28일 동안 이전 번호로 전화한 사람에게 새 번호가 무료로 안내됩니다. 번호 변경 후 이전 번호로 온 전화가 안내 없이 새 번호로 바로 연결되도록 설정할 수도 있습니다. 번호 변경 안내 방식은 앱의 번호 변경 안내 메뉴에서 선택할 수 있습니다."], "785": ["아이 회선에 자녀 보호 서비스가 켜져 있나요?", "자녀 회선의 부가서비스 정보를 조회해 자녀 보호 서비스 가입 여부와 현재 설정 내용을 안내해 드립니다."], "5": ["번호를 변경하면 이전 번호로 온 전화나 문자를 받을 수 있나요?", "휴대폰 번호를 변경하면 일반적으로 이전 번호로 온 전화나 문자를 받을 수 없습니다."], "1627": ["가족이 내 멤버십 바코드를 대신 사용해도 되나요?", "가족이 내 멤버십 바코드를 대신 쓸 수 있는지는 가입한 멤버십과 제휴 혜택의 이용 조건에 따라 확인해야 합니다. 멤버십 바코드를 가족이 쓰기 전에 앱의 혜택 안내나 고객센터에서 본인 사용 제한과 가족 공유 규정을 확인해 주세요."], "805": ["작년에 멤버십으로 할인받은 금액이 얼마나 돼요?", "회원의 멤버십 사용 내역을 조회해 작년에 할인받은 금액의 합계를 안내해 드립니다."], "965": ["올해 영화 혜택을 언제 썼는지 보여 주세요.", "회원의 멤버십 사용 내역을 조회해 올해 영화 혜택 사용 날짜를 안내해 드립니다."], "1430": ["선택약정을 받다가 공시지원금으로 바꿀 수 있나요?", "선택약정 중 새 휴대폰으로 기기 변경하면서 공시지원금을 받을 수 있습니다. 기기 변경으로 공시지원금을 받으면 기존 선택약정은 해지되고 할인반환금이 정산됩니다."], "1067": ["주문할 때와 개통할 때 공시지원금이 다르면 어떻게 되나요?", "공시지원금은 휴대폰을 주문한 날이 아니라 개통일을 기준으로 적용됩니다. 주문 후 공시지원금이 바뀌었다면 개통 전에 문자로 안내합니다. 바뀐 공시지원금을 원하지 않으면 개통 전에 주문을 취소할 수 있습니다."], "1505": ["홈페이지에 보이는 공지와 장애 안내는 무엇인가요?", "Ubot 앱·홈페이지 상단 배너에서 서비스 공지와 통신 장애 안내를 볼 수 있습니다. 통신 장애 안내는 해당 지역 고객에게만 보일 수 있으며 안내 기간이 끝나면 자동으로 사라집니다."], "1411": ["휴대폰 요금도 연말정산 공제가 되나요?", "통신 요금은 연말정산 소득공제 대상이 아닙니다. 휴대폰 결제로 산 상품은 결제처에 따라 연말정산 공제 대상이 될 수 있습니다."], "843": ["혹시 제 번호가 정지된 상태는 아닌지 봐 주세요.", "회원의 휴대폰 회선 상태를 조회해 정상 이용 중인지, 발신 정지 또는 이용 정지 상태인지 안내해 드립니다."], "234": ["분실 뒤에 신규 가입이 안 되게 막고 싶어요.", "번호도용 방지 서비스를 무료로 신청하면 분실 이후 본인 모르게 회선이 개통되는 것을 막을 수 있습니다."], "1876": ["인증번호 뜻은 무엇인가요?", "본인 확인이나 로그인 등을 위해 문자나 앱으로 전달되는 일회성 숫자 또는 코드입니다."], "1310": ["해외에서도 인증 문자를 받을 수 있나요?", "해외 로밍 중에도 은행·쇼핑몰의 인증 문자를 받을 수 있고 문자 수신은 무료입니다. 데이터 로밍을 차단해도 해외 인증 문자는 받을 수 있습니다."], "968": ["결합 할인 이번 달에 얼마 받았어요?", "회원의 이번 달 청구 내역을 조회해 결합 할인 금액을 안내해 드립니다."], "918": ["지난달 요금에서 결합 할인이 얼마 들어갔어요?", "회원의 지난달 청구 내역을 조회해 결합 할인 금액을 안내해 드립니다."], "809": ["제 회선에 들어가는 결합 할인 금액이 청구서에 얼마로 나와요?", "회원의 가족 결합 정보와 이번 달 청구서를 조회해 대표 회선에 적용된 결합 할인 금액을 안내해 드립니다. 가족 결합 할인은 회선마다 나누어 적용되지 않고 대표 회선에서 차감됩니다."], "156": ["제가 가입하지 않은 회선이 제 명의로 개통됐어요.", "가입하지 않은 회선이 본인 명의로 개통됐다면 앱의 명의도용 조회에서 내 명의 회선을 확인하고 즉시 고객센터에 신고해 주세요. 명의도용을 막기 위해 무료 번호도용 방지 서비스도 신청할 수 있습니다."], "1468": ["통신사를 사칭한 전화나 문자를 받았어요.", "Ubot은 전화나 문자로 비밀번호, 인증번호, 카드번호를 묻지 않습니다. Ubot을 사칭한 전화나 문자가 의심되면 응대하지 말고 Ubot 앱이나 고객센터(114)에 직접 확인해 주세요."], "328": ["제가 모르는 회선이 조회됐어요.", "모르는 회선이 본인 명의로 조회됐다면 즉시 고객센터에 연락해 주세요. 번호도용 방지 서비스를 무료로 신청하면 본인 명의의 추가 회선 개통을 막을 수 있습니다."], "846": ["이 회선 명의자가 저로 되어 있는지 확인하고 싶어요.", "본인 확인 후 해당 휴대폰 회선의 명의자 정보를 조회해 회원 본인 명의인지 안내해 드립니다."], "38": ["휴대폰 요금이 평소보다 많이 나왔어요.", "휴대폰 요금이 평소보다 많이 나왔다면 데이터 추가 사용, 로밍, 소액결제, 부가서비스 등의 상세 내역을 확인해 주세요."], "1341": ["부가서비스 가입이 안 된다고 나와요.", "부가서비스 가입이 안 된다면 이용 중인 요금제나 기기에서 지원하지 않거나 미성년자·선불 회선이라 제한될 수 있습니다. 가입이 안 되는 부가서비스의 조건은 앱의 서비스 상세에서 확인해 주세요. 회선 일시정지 때문에 부가서비스 가입이 안 된다면 정지를 해제한 뒤 가입해 주세요."], "683": ["저 모르게 돈 나가는 유료 서비스가 있나요?", "회원 회선에 가입된 부가서비스를 조회해 유료 서비스와 금액을 안내해 드립니다. 필요 없는 유료 부가서비스는 앱에서 바로 해지할 수 있습니다."], "789": ["청구서에 모르는 서비스 이름이 있는데 제가 언제 가입한 건가요?", "회원의 부가서비스 가입 이력을 조회해 청구서에서 모르는 서비스의 가입일과 월 요금을 안내해 드립니다."], "281": ["어떤 회선에 서비스가 걸려 있는지 보고 싶어요.", "어느 회선에 부가서비스가 가입되어 있는지는 앱에서 회선을 선택해 해당 회선의 부가서비스 목록을 확인할 수 있습니다."], "697": ["제 쉐어링 서브 회선이 데이터를 얼마나 썼는지 알고 싶어요.", "회원의 데이터 쉐어링 정보를 조회해 태블릿 등 서브 회선별 데이터 사용량을 안내해 드립니다."], "876": ["지난달에 핫스팟으로 쓴 데이터는 얼마였어요?", "회원의 지난달 사용 내역을 조회해 테더링으로 쓴 데이터를 안내해 드립니다."], "59": ["전화가 걸리지 않아요.", "전화가 걸리지 않으면 통신 상태, 비행기 모드, 발신 제한 설정을 확인해 주세요."], "720": ["제 폰이 지금 전화를 걸 수 없는 상태인가요?", "회원의 회선 상태를 조회해 현재 발신 정지 여부와 사유를 안내해 드립니다. 요금 미납으로 전화 발신이 정지됐다면 요금을 납부한 뒤 다시 이용할 수 있습니다."], "60": ["전화가 오지 않아요.", "전화가 오지 않으면 수신 차단 설정과 네트워크 상태를 확인해 주세요."], "401": ["가까운 매장 중에 외국인 가입 받는 곳이 있는지 알려 주세요.", "현재 위치 주변 매장 중 외국인 신규 가입을 취급하는 곳만 골라 안내해 드립니다."], "1148": ["외국인도 요금제를 바꿀 수 있나요?", "외국인도 앱·홈페이지·매장에서 요금제를 변경할 수 있습니다. 청년·시니어 요금제처럼 나이 확인이 필요한 일부 요금제는 외국인등록증으로 확인한 뒤 가입할 수 있습니다."], "564": ["한남동 쪽에 외국인 가입 되는 매장이 있나요?", "한남동 주변에서 외국인 신규 가입을 취급하는 매장을 찾아 드립니다. 외국인 신규 가입을 위해서는 여권과 외국인등록증을 지참해 주세요."], "397": ["외국인 친구가 가입하려는데 데려갈 매장을 찾고 있어요.", "외국인 친구의 신규 가입을 취급하는 매장을 찾아 드립니다. 외국인이 휴대폰에 신규 가입할 때는 여권과 외국인등록증을 함께 지참해야 합니다."], "1051": ["신용에 문제가 있어도 가입할 수 있나요?", "다른 통신사 미납이나 신용 문제로 후불 가입이 제한될 수 있으며 이때는 선불 요금제로 가입할 수 있습니다. 미납을 정리하면 후불 요금제로 다시 가입을 신청할 수 있습니다."], "776": ["제가 해지 신청한 게 처리됐나요?", "회원의 회선 해지 신청 내역을 조회해 처리 상태를 안내해 드립니다. 회선 해지 처리 결과는 문자로도 안내됩니다."], "1861": ["해지 뜻은 무엇인가요?", "통신 서비스 이용 계약을 끝내고 해당 회선의 서비스를 종료하는 것입니다."], "1782": ["전송 속도 뜻이 무엇인가요?", "일정 시간 동안 보낼 수 있는 데이터 양으로, 보통 Mbps나 Gbps로 표시합니다."], "1765": ["속도 제한 뜻이 무엇인가요?", "약정된 조건이나 사용량에 따라 데이터 전송 속도의 상한을 낮추는 것입니다."], "1186": ["요금이 평소보다 많이 나왔어요.", "휴대폰 요금이 평소보다 많이 나왔다면 앱의 요금 상세 내역에서 데이터 추가 사용, 로밍, 휴대폰 결제, 부가서비스, 단말 할부금 항목을 확인해 주세요. 월 중간에 요금제를 바꿨다면 두 요금제의 요금이 날짜별로 나뉘어 청구돼 평소와 달라 보일 수 있습니다."], "1537": ["이번 달 요금이 왜 많이 나왔는지 알려 주세요.", "로그인하면 회원님 회선의 이번 달 청구 항목을 지난달과 비교해 로밍, 추가 사용, 부가서비스 중 어떤 금액이 늘었는지 안내해 드립니다."], "748": ["이번 달 요금이 지난달보다 왜 늘었는지 내역으로 비교해 주세요.", "회원의 최근 두 달 청구 내역을 조회해 이번 달 요금이 지난달보다 늘어난 항목과 금액을 비교해 안내해 드립니다."], "884": ["지난달 통화 초과 요금이 나왔었나요?", "회원의 지난달 청구 내역을 조회해 초과 통화료 발생 여부와 금액을 안내해 드립니다."], "710": ["제가 이번 달에 통화 제공량을 넘겨서 요금이 붙었나요?", "회원의 요금제와 이번 달 통화 사용량을 조회해 제공량 초과 여부와 초과 통화 요금을 안내해 드립니다."], "976": ["지난달 해외에서 데이터를 몇 GB 썼었는지 알려 주세요.", "회원의 로밍 이용 내역을 조회해 지난달 사용한 로밍 데이터를 안내해 드립니다."], "754": ["등록해 둔 엄마 회선 이번 달 요금이 얼마예요?", "명의자 동의로 등록된 가족 회선의 청구 내역을 조회해 어머니 회선의 이번 달 요금을 안내해 드립니다."], "913": ["아이 회선 이번 달 요금이 얼마 나왔어요?", "명의자 동의로 등록된 자녀 회선의 이번 달 청구 금액을 조회해 안내해 드립니다."], "822": ["집 인터넷 요금이 이번 달 얼마 나왔어요?", "회원의 집 인터넷 청구 내역을 조회해 이번 달 인터넷 요금과 결합 할인 금액을 안내해 드립니다."], "969": ["집 인터넷 지난달 요금이 얼마였어요?", "회원의 인터넷 청구 내역을 조회해 지난달 요금을 안내해 드립니다."], "1084": ["번호이동 후 첫 달 요금이 많이 나왔어요.", "번호이동 후 첫 청구서에는 Ubot 요금과 이전 통신사에서 정산되지 않은 요금이 함께 청구될 수 있습니다. 번호이동 후 첫 달 요금이 많다면 청구서에서 이전 통신사 요금 항목을 확인해 주세요. 이전 통신사 요금의 금액이 맞지 않으면 세부 내역을 아는 이전 통신사에 문의해 주세요."], "1085": ["번호이동했는데 이전 통신사에서 요금이 또 청구됐어요.", "국제전화, 로밍, 수신자 부담 전화처럼 정산이 늦은 요금은 번호이동 후 1~2개월 뒤에도 이전 통신사에서 청구될 수 있습니다. 번호이동 후 뒤늦게 청구된 이전 통신사 요금에는 연체 가산금이 붙지 않습니다."], "1412": ["휴대폰을 보내기 전에 무엇을 지워야 하나요?", "휴대폰을 팔거나 버리기 전에는 데이터를 백업하고 구글·삼성·애플 계정에서 로그아웃한 뒤 공장 초기화를 해 주세요. eSIM을 사용한 휴대폰을 처분한다면 초기화할 때 eSIM 삭제를 선택해 주세요. 휴대폰을 팔거나 버리기 전에는 유심도 반드시 빼 두세요."], "1478": ["휴대폰 결제 비밀번호를 설정할 수 있나요?", "Ubot 앱의 휴대폰 결제 메뉴에서 결제 비밀번호를 설정할 수 있습니다. 휴대폰 결제 비밀번호를 설정하면 결제할 때마다 비밀번호를 한 번 더 입력해야 합니다."], "191": ["업무용 번호를 따로 두고 싶은데 방법이 있나요?", "업무용으로 넘버플러스를 신청하면 같은 휴대폰에서 두 번째 번호로 전화를 걸고 받을 수 있습니다. 넘버플러스의 두 번째 번호는 새 회선을 개통하지 않아도 이용할 수 있습니다."], "1613": ["해외에서 현지 유심을 사용하는 동안 국내 번호로 오는 문자를 받을 수 있나요?", "해외에서 현지 유심을 쓰는 동안 국내 번호로 문자를 받으려면 국내 회선이 휴대폰에서 계속 활성화되어 있는지와 기기의 듀얼심 지원 여부를 먼저 확인해 주세요. 국내 유심을 빼거나 국내 회선을 꺼 두면 그 회선으로 오는 문자를 바로 받기 어려울 수 있습니다. 국내 번호 문자 수신 가능 여부와 로밍 요금은 회선 설정과 상품 조건을 확인해 주세요."], "695": ["제가 충전한 데이터가 아직 남아 있나요?", "회원의 데이터 충전 내역을 조회해 현재 남은 충전 데이터 용량을 안내해 드립니다. 충전한 데이터는 충전한 달 말일까지 사용할 수 있습니다."], "893": ["이번 달 휴대폰 요금 지금 얼마예요?", "회원의 이번 달 청구 정보를 조회해 현재까지의 금액을 안내해 드립니다."], "231": ["분실했다고 약정이 없어지나요?", "휴대폰을 분실해도 선택약정은 만료일까지 유지됩니다. 휴대폰 분실 후 약정 기간 중 회선을 해지하면 할인반환금이 청구됩니다."], "1774": ["할인반환금 뜻이 무엇인가요?", "약정 할인 등을 받은 뒤 약정 조건을 지키지 못했을 때 계약 조건에 따라 돌려내는 금액입니다."], "135": ["약정 할인이 청구서에 빠진 것 같아요.", "약정 할인이 청구서에 빠졌다면 앱의 약정 정보에서 약정 상태를 먼저 확인해 주세요. 약정이 만료되면 약정 할인도 종료됩니다. 약정 기간 중인데 청구서에서 할인이 누락됐다면 고객센터로 문의해 주세요."], "942": ["다음 달에 해지하면 할인반환금이 줄어드나요?", "회원의 약정 정보를 조회해 해지일에 따른 예상 할인반환금을 비교해 안내해 드립니다."], "1874": ["문자 수신 뜻은 무엇인가요?", "다른 사람이 보낸 문자 메시지를 내 휴대폰에서 받는 것입니다."], "1875": ["문자 발신 뜻은 무엇인가요?", "내 휴대폰에서 다른 번호로 문자 메시지를 보내는 것입니다."], "1197": ["전화와 문자는 되는데 데이터만 안 돼요.", "전화와 문자는 되는데 모바일 데이터만 연결되지 않으면 휴대폰의 APN(액세스 포인트 이름) 설정이 지워졌거나 잘못됐을 수 있습니다. 모바일 데이터만 안 될 때는 설정 > 모바일 네트워크 > APN에서 기본값으로 재설정하고 휴대폰을 다시 켜 주세요."], "129": ["해외에서 쓴 로밍 요금이 한참 뒤에 청구됐어요.", "로밍 요금은 해외 통신사와 정산하는 과정에서 1~2개월 늦게 청구될 수 있습니다."], "1614": ["여러 나라를 여행할 때 한 로밍 요금제를 계속 사용할 수 있나요?", "여러 나라를 여행할 때는 가입하려는 로밍 상품의 지원 국가, 이용 기간, 국가 이동 시 적용 조건을 확인해 주세요. 방문 국가가 바뀌면 동일 로밍 상품이 적용되는지와 추가 요금이 있는지 공식 상품 안내에서 확인해야 합니다."], "181": ["태블릿용 데이터 회선을 새로 만들려면 어떻게 하나요?", "태블릿용 데이터 회선은 앱이나 매장에서 Ubot 태블릿 요금제로 개통할 수 있습니다. Ubot 태블릿 요금제는 5GB 월 9,900원부터 50GB 월 29,900원까지 있으며 음성·문자는 제공하지 않습니다."], "446": ["신혼집 근처에서 인터넷·IPTV 같이 상담받을 매장을 찾아요.", "신혼집 주소 주변에서 인터넷과 IPTV를 함께 상담받을 수 있는 매장을 찾아 드립니다. 신혼집 인터넷·IPTV에 휴대폰까지 결합하면 추가 할인을 받을 수 있습니다."], "841": ["신규 가입 신청한 게 어떻게 진행되고 있어요?", "회원의 가입 신청 내역을 조회해 진행 상태를 안내해 드립니다."], "1684": ["할부가 24개월이 안 됐는데 반납 없이 새 폰으로 기기변경할 수 있나요?", "할부 24개월이 지나지 않았어도 기기변경은 반납과 관계없이 앱에서 신청하거나 매장을 방문해 진행할 수 있고 기존 요금제를 유지할 수 있습니다. 중고폰 반납은 할부 24개월 이후에만 가능합니다. 기기변경 후에도 기존 단말의 남은 할부금은 기기 사용 여부와 관계없이 계속 청구됩니다."], "1425": ["선택약정이 끝나면 할인도 끝나나요?", "선택약정 기간이 끝나면 할인도 종료되며 만료 한 달 전에 문자로 안내합니다. 선택약정 할인을 계속 받으려면 앱에서 다시 신청해 주세요."], "193": ["해외 번호로 문자를 보낼 수 있나요?", "해외 번호로 문자를 보낼 때는 국가번호를 포함해 입력할 수 있습니다. 해외로 보내는 국제 문자 요금은 앱의 이용요금 안내에서 확인해 주세요."], "36": ["해외에서 한국으로 전화하려면 어떻게 하나요?", "해외에서 한국으로 전화하려면 국가번호와 상대방 전화번호를 입력해 국제전화를 이용할 수 있습니다."], "1304": ["해외에서 한국으로 전화를 걸려면 어떻게 하나요?", "해외에서 한국으로 전화하려면 +82를 누른 뒤 상대방 전화번호에서 맨 앞 0을 빼고 입력하면 됩니다. 예를 들어 해외에서 010-1234-5678로 전화할 때는 +82 10-1234-5678로 걸며 국가별 분당 로밍 통화 요금이 부과됩니다."], "1656": ["선불 유심으로도 휴대폰 본인인증을 할 수 있나요?", "선불 회선도 명의자 정보와 해당 사업자·인증 서비스의 지원 조건에 따라 휴대폰 본인인증이 가능할 수 있습니다. 선불 유심의 본인인증 가능 여부는 개통 명의와 인증 지원 여부를 확인해 판단해 주세요."], "1319": ["해외에서 현지 유심을 써도 되나요?", "휴대폰에 통신사 잠금(컨트리 락)이 없다면 해외에서 현지 유심을 끼워 사용할 수 있습니다. 현지 유심으로 바꾼 동안에는 Ubot 번호로 오는 전화와 문자를 받을 수 없습니다. eSIM을 지원하는 휴대폰이라면 Ubot 번호를 eSIM으로 두고 현지 유심을 함께 쓸 수도 있습니다."], "898": ["지난달 소액결제가
