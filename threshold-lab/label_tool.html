어디서 나갔는지 보여 주세요.", "회원의 소액결제 이용내역을 조회해 지난달 결제처와 금액을 안내해 드립니다."], "740": ["이번 달 소액결제가 어디서 결제된 건지 보여 주세요.", "회원의 이번 달 소액결제 이용내역을 조회해 결제처와 금액을 건별로 안내해 드립니다."], "908": ["이번 달 소액결제 합계 알려 주세요.", "회원의 소액결제 이용내역을 조회해 이번 달 합계 금액을 안내해 드립니다."], "1190": ["휴대폰 결제 내역은 어디에서 확인하나요?", "휴대폰 결제 내역은 Ubot 앱의 요금 조회 > 휴대폰 결제 내역에서 가맹점과 금액을 확인할 수 있습니다. 구글 플레이 등 앱 마켓의 휴대폰 결제는 앱에서 금액만 보이며 상세 내역은 해당 마켓에서 확인해야 합니다."], "1339": ["자녀가 쓴 정보이용료를 알 수 있나요?", "법정대리인은 Ubot 앱의 자녀 회선 관리에서 자녀가 사용한 휴대폰 결제와 정보이용료 내역을 확인할 수 있습니다. 자녀의 휴대폰 결제를 막으려면 휴대폰 결제 차단을 신청해 주세요."], "713": ["지난주 금요일에 통화한 기록을 확인하고 싶어요.", "회원의 통화 내역을 조회해 지난주 금요일의 통화 기록을 안내해 드립니다. 조회한 통화 기록의 상대방 번호는 일부 가려서 표시됩니다."], "403": ["어머니 대신 업무 보러 가려는데 어머니 댁 근처 매장을 찾아 주세요.", "어머니 댁 주소 주변에서 가족의 대리인 업무를 취급하는 매장을 찾아 드립니다. 어머니의 회선 업무를 대신 처리하려면 명의자 신분증, 대리인 신분증, 위임장, 명의자 인감증명서가 필요합니다."], "1175": ["요금을 두 번 냈어요. 어떻게 돌려받나요?", "요금을 두 번 납부한 사실이 확인되면 문자로 알려 드리고 납부한 방법으로 환불합니다. 이중 납부 금액을 카드로 냈다면 승인을 취소하고 계좌로 냈다면 등록된 환불 계좌로 7영업일 안에 돌려드립니다. 이중 납부 금액을 다음 달 요금에서 차감받도록 선택할 수도 있습니다."], "735": ["요금을 두 번 냈는데 환불이 어떻게 처리되고 있어요?", "회원의 납부 내역을 조회해 두 번 낸 요금의 금액과 환불 처리 상태를 안내해 드립니다."], "890": ["넘버플러스 요금이 매달 청구되고 있나요?", "회원의 청구 내역을 조회해 넘버플러스 요금이 매달 청구되는지 안내해 드립니다. 넘버플러스의 월 요금은 3,300원입니다."], "857": ["제가 요청한 주소 정정이 처리됐나요?", "회원의 주소 정정 요청 내역을 조회해 처리 결과를 안내해 드립니다. 개인정보 정정 결과는 요청 후 10일 이내에 안내됩니다."], "149": ["주문한 휴대폰의 배송 주소를 바꿀 수 있나요?", "주문한 휴대폰이 출고되기 전이라면 앱의 주문 조회에서 배송지를 변경할 수 있습니다. 주문한 휴대폰이 이미 출고됐다면 배송지 변경에 관해 고객센터로 문의해 주세요."], "1612": ["번호이동한 첫 달에 이전 통신사와 새 통신사의 요금이 각각 청구되나요?", "번호이동 전후의 이용 기간과 청구 내역을 이전 통신사와 새 통신사에서 각각 확인해 주세요. 이전 통신사의 마지막 청구분과 새 회선의 첫 청구분은 청구 주기에 따라 따로 표시될 수 있습니다. 번호이동 첫 달의 청구 금액과 시점은 각 통신사 내역으로 확인해 주세요."], "1125": ["요금제를 바꿨는데 기본 제공 데이터가 요금제 안내보다 적게 보여요.", "월 중간에 요금제를 바꾸면 기본 제공 데이터가 남은 날짜만큼 나눠 제공되어 요금제 안내보다 적게 보일 수 있습니다. 요금제를 변경한 다음 달 1일부터는 안내된 기본 데이터 제공량이 그대로 적용됩니다."], "171": ["테더링으로 연결하면 휴대폰보다 느리게 느껴져요.", "테더링은 휴대폰이 받은 신호를 다른 기기로 다시 전달하므로 연결한 기기에서 속도 차이가 느껴질 수 있습니다. 테더링이 느리다면 연결 기기 수를 줄이고 휴대폰을 창가처럼 신호가 잘 잡히는 곳에 두는 것이 도움이 됩니다."], "1611": ["번호이동 개통 안내를 받았는데 새 휴대폰에 신호가 없으면 어떻게 하나요?", "번호이동 개통 안내를 받았는데 새 휴대폰에 신호가 없다면 개통 완료 상태와 새 유심 또는 eSIM의 활성화 상태를 확인하고 휴대폰을 다시 시작해 주세요. 새 휴대폰에 신호가 계속 없으면 개통 채널에 오류 화면과 안내받은 시각을 전달해 회선·단말 상태 점검을 요청해 주세요."], "1279": ["휴대폰을 초기화했더니 eSIM 전화가 안 돼요.", "휴대폰을 초기화할 때 eSIM 삭제 옵션을 선택하면 eSIM이 지워져 전화가 되지 않을 수 있습니다. 초기화로 eSIM을 삭제했더라도 회선은 유지되므로 앱이나 매장에서 2,750원을 내고 재발급받아 설치해 주세요. 다음에 휴대폰을 초기화할 때 eSIM을 유지하려면 초기화 옵션에서 eSIM 유지를 선택해 주세요."], "1266": ["유심을 바꾸면 저장된 연락처는 어떻게 되나요?", "요즘 휴대폰은 연락처를 유심이 아닌 휴대폰이나 클라우드 계정에 저장하므로 유심을 바꿔도 연락처가 사라지지 않습니다. 유심에 연락처를 저장했다면 교체 전에 휴대폰 연락처 앱에서 '휴대폰으로 가져오기'를 해 주세요."], "236": ["정지를 해제하면 원래 유심을 그대로 쓸 수 있나요?", "회선을 정지하는 동안 유심을 교체하지 않았다면 정지 해제 후 원래 유심을 그대로 사용할 수 있습니다. 회선 정지 해제 후 휴대폰을 재부팅하면 통신망에 연결됩니다."], "1003": ["자급제 휴대폰에 기존 유심을 넣었는데 통신이 안 되면 무엇을 확인하나요?", "자급제 휴대폰에 기존 유심을 넣었는데 통신이 되지 않으면 단말과 통신망·유심의 호환 여부를 확인하고 유심을 다시 장착한 뒤 재시작해 보세요. 자급제 휴대폰에서 계속 통신이 되지 않으면 고객센터나 매장에서 회선·유심 상태와 단말 등록 여부를 확인받으세요."], "1846": ["선납 뜻은 무엇인가요?", "통신요금을 청구되기 전에 미리 내는 것입니다."], "88": ["여러 개의 휴대폰 회선을 가입할 수 있나요?", "휴대폰 회선은 가입 심사와 회선 제한 범위 내에서 여러 개 가입할 수 있습니다."], "839": ["제 명의로 회선을 몇 개 더 만들 수 있어요?", "회원 명의로 현재 가입한 회선 수를 조회해 추가로 개통할 수 있는 회선 수를 안내해 드립니다. 휴대폰 회선은 1인당 최대 5개까지 가입할 수 있습니다."], "440": ["회사 법인폰 업무를 볼 수 있는 매장을 찾아 주세요.", "회사 주변에서 법인 명의 휴대폰 업무를 취급하는 매장을 찾아 드립니다. 법인폰 업무를 위해 매장을 방문할 때는 법인 서류와 담당자 신분증을 준비해 주세요."], "1099": ["듀얼번호를 쓰는데 번호마다 명의를 다르게 할 수 있나요?", "한 기기에서 듀얼번호로 쓰는 두 번호는 같은 명의여야 하므로 번호마다 다른 명의로 설정할 수 없습니다. 듀얼번호의 명의를 바꿀 때도 두 번호를 함께 같은 명의로 변경해야 합니다."], "1676": ["IPTV 리모컨이 작동하지 않아요.", "IPTV 리모컨이 작동하지 않으면 배터리와 극성, 버튼 눌림 상태를 확인하세요. 블루투스 IPTV 리모컨은 셋톱박스와 다시 연결해야 할 수 있으므로 모델별 페어링 안내를 따라 주세요. IPTV 리모컨 문제가 계속되면 교체·점검을 문의하세요."], "393": ["중학생 아들 폰 바꿔 주러 갈 매장을 집 근처에서 찾아요.", "집 주소 주변에서 중학생 자녀의 휴대폰 기기변경 등 미성년자 업무를 취급하는 매장을 찾아 드립니다. 중학생 자녀의 휴대폰을 바꿀 때는 법정대리인 신분증과 가족관계증명서를 준비해 주세요."], "426": ["가족 셋이 한꺼번에 폰을 바꾸려는데 같이 갈 매장을 찾아요.", "현재 위치 주변에서 가족 세 명의 휴대폰 기기변경을 취급하는 매장을 찾아 드립니다. 가족이 함께 기기변경하러 매장에 방문한다면 앱에서 방문 예약을 해 우선 상담을 받을 수 있습니다."], "57": ["휴대폰을 잠시 사용하지 않으려고 합니다.", "휴대폰을 잠시 사용하지 않으려면 일정 기간 회선을 일시 정지할 수 있습니다."], "70": ["데이터 사용량이 적은 사람에게 적합한 요금제가 있나요?", "데이터 사용량이 적다면 소량 데이터 중심의 저가 요금제를 선택할 수 있습니다."], "1307": ["데이터를 쓰지 않았는데 로밍 데이터 요금이 나왔어요.", "해외에서 데이터를 직접 사용하지 않아도 앱 자동 업데이트, 사진 클라우드 백업, 이메일 동기화 때문에 로밍 데이터 요금이 발생할 수 있습니다. 백그라운드 데이터 로밍 요금을 막으려면 출국 전에 데이터 로밍을 끄거나 로밍 상품에 가입해 주세요. 해외 데이터 사용 시간은 앱의 로밍 이용 내역에서 확인할 수 있습니다."], "760": ["제 최근 사용량으로 보면 어떤 요금제가 맞아요?", "회원의 최근 데이터와 통화 사용 내역을 조회해 사용 패턴에 맞는 요금제를 안내해 드립니다."], "32": ["해외에서 와이파이만 사용하고 싶어요.", "해외에서 와이파이만 사용하려면 데이터 로밍을 끈 상태에서 Wi-Fi를 이용할 수 있습니다."], "221": ["명의를 바꾸면 약정과 할부는 어떻게 되나요?", "휴대폰 회선 명의를 변경하면 약정과 할부 조건은 회선에 남아 새 명의자가 승계합니다. 명의 변경에 따른 약정과 할부의 자세한 조건은 매장에서 확인해 주세요."], "731": ["제 회선 요금은 누구 이름으로 내고 있어요?", "회원 회선의 요금 납부 정보를 조회해 현재 지정된 납부자의 이름을 안내해 드립니다. 휴대폰 요금 납부자는 회선별로 지정할 수 있습니다."], "1313": ["해외에서 로밍이 되지 않아요.", "해외에서 로밍이 되지 않으면 휴대폰을 재부팅하고 데이터 로밍이 켜져 있는지와 네트워크 선택이 자동인지 확인해 주세요. 해외 로밍이 계속되지 않으면 다른 현지 통신사를 수동으로 선택해 보세요. 현지 통신사를 바꿔도 로밍 문제가 해결되지 않으면 로밍 고객센터에 연락해 주세요."], "197": ["여행이 취소됐는데 로밍 패스는 어떻게 하나요?", "여행이 취소되어 출국하지 않았고 로밍 패스 사용이 시작되지 않았다면 가입을 취소하고 전액 환불받을 수 있습니다. 사용 전 로밍 패스 취소는 앱이나 고객센터에서 신청해 주세요."], "1300": ["로밍 상품에 가입하지 않고 해외에서 데이터를 쓰면 어떻게 되나요?", "로밍 상품에 가입하지 않고 해외에서 데이터를 사용하면 쓴 만큼 데이터 로밍 요금이 부과됩니다. 로밍 상품에 가입하지 않고 해외에서 쓴 데이터 로밍 요금이 하루 11,000원을 넘으면 그날은 추가 과금 없이 속도가 200kbps로 제한됩니다."], "1666": ["유선 인터넷 속도를 정확하게 측정하려면 어떻게 하나요?", "유선 인터넷 속도를 측정하려면 가능하면 기가비트를 지원하는 컴퓨터를 유선으로 연결하고 다운로드나 스트리밍 등 다른 트래픽을 멈춰 주세요. 유선 인터넷 속도 측정은 통신사 공식 측정 도구와 측정 환경 안내를 이용하면 비교에 도움이 됩니다."], "814": ["우리 집 인터넷이 몇 기가짜리 상품이에요?", "회원의 집 인터넷 가입 정보를 조회해 가입한 속도 상품과 월 요금을 안내해 드립니다."], "786": ["제가 쓰는 부가서비스 요금을 다 합치면 한 달에 얼마예요?", "회원이 현재 가입한 부가서비스를 조회해 매달 내는 월 요금의 합계를 안내해 드립니다."], "1329": ["유료 부가서비스에는 무엇이 있나요?", "부재중 알림(550원), 컬러링(990원), 착신전환(1,100원), 듀얼번호(3,300원), 키즈가드(2,200원), 피싱가드(2,200원), 패밀리 안심(3,300원), 디바이스 케어(4,400원)와 북패스·뮤직패스·비디오패스 같은 콘텐츠 상품이 있습니다."], "142": ["번호이동하면 기존 통신사 부가서비스는 어떻게 되나요?", "번호이동으로 기존 통신사 회선이 해지되면 그 통신사의 부가서비스도 종료됩니다. 번호이동 후에도 필요한 부가서비스는 새 통신사에서 다시 가입해야 합니다."], "1501": ["주문한 상품을 취소하거나 반품할 수 있나요?", "상품을 개통하기 전이라면 Ubot 앱의 주문 조회에서 주문을 취소할 수 있습니다. 상품을 받은 뒤에는 포장을 뜯지 않은 상태로 7일 안에 반품을 신청할 수 있습니다. 개통 후에는 제품 불량일 때만 14일 안에 교환·반품할 수 있습니다."], "999": ["환불 신청한 거 어떻게 됐어요?", "회원의 환불 요청 내역을 조회해 처리 상태를 안내해 드립니다."], "1395": ["새로 산 휴대폰이 불량이에요.", "새 휴대폰이 불량이라면 개통일을 포함해 14일 안에 제조사 서비스센터에서 불량 판정을 받아 새 제품으로 교환하거나 개통을 철회할 수 있습니다. 불량 휴대폰의 교환·철회는 불량 확인서를 가지고 구매한 매장이나 고객센터에 신청해 주세요."], "1847": ["환불 뜻은 무엇인가요?", "이미 낸 금액 중 돌려받을 금액을 반환받는 것입니다."], "1218": ["LTE 휴대폰인데 3G로 연결돼요.", "LTE망을 이용하려면 LTE 이상 요금제, LTE 지원 휴대폰, 해당 유심이 모두 필요합니다. LTE 휴대폰이 3G로만 연결된다면 네트워크 모드가 LTE인지 확인하고 유심이 오래됐다면 재발급받아 주세요."], "411": ["회사 근처에서 새 유심을 받을 수 있는 매장이 있나요?", "회사 주소 주변에서 새 유심을 받을 수 있는 유심 업무 취급 매장을 찾아 드립니다. 새 유심을 받으러 매장에 방문할 때는 신분증을 지참해 주세요."], "441": ["재약정 상담받으러 갈 매장을 집 근처에서 찾고 있어요.", "집 주소 주변에서 휴대폰 재약정 상담을 받을 매장을 찾아 드립니다. 재약정은 약정 만료 30일 전부터 앱이나 매장에서 신청할 수 있습니다."], "506": ["요금제 상담이랑 유심 교체를 한 번에 할 수 있는 매장이 근처에 있나요?", "요금제 상담과 유심 교체를 모두 취급하는 매장을 현재 위치 주변에서 찾아 드립니다."], "464": ["예약하려는데 집이랑 회사 중 어느 쪽 매장이 나을까요?", "집과 회사 주소를 알려 주시면 두 곳 주변 매장의 운영시간과 취급 업무를 비교해 안내해 드립니다."], "1291": ["유심만 받아서 개통할 때 매장에 가야 하나요?", "Ubot 앱·홈페이지에서 유심을 주문하고 받은 뒤 셀프개통하면 매장 방문 없이 개통할 수 있습니다. 주문한 유심은 받은 날부터 30일 안에 개통을 신청해 주세요."], "493": ["폰이 고장 나서 컴퓨터로 보고 있는데 집 근처 매장 좀 알려 주세요.", "집 주소를 알려 주시면 고장 난 휴대폰 문제로 방문할 주변 매장을 찾아 드립니다. 휴대폰 단말 수리는 제조사 서비스센터에서 접수합니다."], "1392": ["휴대폰이 고장 나면 어디에서 수리받나요?", "휴대폰 수리는 삼성전자서비스·애플 공인 서비스 제공업체 등 제조사 서비스센터에서 받을 수 있습니다. 휴대폰 수리 중 임시로 쓸 기기가 필요하다면 Ubot 매장에서 임대폰을 빌릴 수 있습니다."], "485": ["집에서 회사 가는 길 중간에 매장이 있을까요?", "집과 회사 주소를 알려 주시면 이동 경로 주변의 매장을 찾아 드립니다."], "421": ["번호를 하나 더 만들려는데 근처 매장 좀 알려 주세요.", "현재 위치 주변에서 새 휴대폰 번호를 위한 신규 가입을 취급하는 매장을 찾아 드립니다. 휴대폰 회선은 1인당 최대 5개까지 가입할 수 있습니다."], "1295": ["영국, 프랑스 같은 유럽 나라의 로밍 상품은 무엇이 있나요?", "영국, 프랑스, 독일, 스페인, 이탈리아에 유럽 국가별 전용 Ubot 로밍 상품이 있습니다. 유럽 국가별 로밍 상품은 데이터를 사용하는 24시간 구간마다 베이직 1GB 11,000원, 플러스 2GB 13,000원, 맥스 5GB 15,000원이 부과됩니다. 유럽 국가 로밍 상품은 방문하는 나라별로 따로 가입해야 합니다. 로밍 상품이 없는 다른 유럽 국가에서는 데이터 로밍 차단을 권장합니다."], "1294": ["미국, 캐나다, 호주 로밍 상품은 무엇이 있나요?", "미국, 캐나다, 호주에 국가별 전용 Ubot 로밍 상품이 있습니다. 미주·오세아니아 국가별 로밍 상품은 데이터를 사용하는 24시간 구간마다 베이직 1GB 11,000원, 플러스 2GB 13,000원, 맥스 5GB 15,000원이 부과됩니다. 미국·캐나다·호주 로밍 상품은 방문하는 나라별로 따로 가입해야 합니다."], "982": ["로밍 패스 요금이 몇 월 청구서에 나와요?", "회원의 로밍 패스 가입 내역을 조회해 로밍 패스 요금이 몇 월 청구서에 나오는지 안내해 드립니다."], "1357": ["포인트를 다른 사람에게 줄 수 있나요?", "Ubot 포인트는 본인 명의 회선끼리만 옮길 수 있고 다른 사람에게 줄 수 없습니다. 회선 명의를 바꾸면 원칙적으로 이전 명의자의 포인트는 이어지지 않습니다. 가족에게 명의를 변경한 뒤 30일 안에 같은 가족과 Ubot 가족 결합에 가입하고 30일 이상 유지하면 포인트를 이어받을 수 있습니다."], "316": ["기기 상태에 따라 반납 금액이 달라지나요?", "휴대폰 반납 금액은 화면 파손 여부나 외관 상태에 따라 달라집니다. 휴대폰 반납 금액은 매장에서 기기 상태를 확인한 뒤 안내받을 수 있습니다."], "771": ["제 약정이 이미 끝났는데 할인도 끝난 건가요?", "회원의 약정 정보를 조회해 약정 만료 여부와 현재 할인 적용 상태를 안내해 드립니다. 약정은 만료 후 자동으로 연장되지 않습니다."], "943": ["제가 지금 재약정할 수 있는 시기인가요?", "회원의 약정 만료일을 조회해 재약정 신청 가능 여부를 안내해 드립니다."], "1695": ["음영 지역 뜻이 무엇인가요?", "건물 구조나 지형 등의 영향으로 통신 신호가 약하거나 닿지 않는 곳입니다."], "418": ["다른 통신사에서 옮기려는데 상담받을 매장이 근처에 있나요?", "다른 통신사에서 번호이동할 때 상담할 수 있는 매장을 현재 위치 주변에서 찾아 드립니다. 다른 통신사에서 번호이동하는 신청은 앱에서도 할 수 있습니다."], "249": ["매장에 가기 전에 무엇을 확인하면 좋을까요?", "매장에 가기 전에는 앱에서 운영시간과 취급 업무, 주차 가능 여부를 확인하고 필요한 신분증을 챙겨 주세요. 매장 방문을 앱으로 예약하면 우선 상담을 받을 수 있습니다."], "1070": ["듀얼번호만 따로 개통할 수 있나요?", "듀얼번호는 Ubot 휴대폰 주 회선에 추가하는 부가서비스이므로 주 회선 없이 단독으로 개통할 수 없습니다."], "275": ["넘버플러스를 쓰면 요금제를 하나 더 가입해야 하나요?", "넘버플러스는 기존 회선에 추가하는 부가서비스라 별도 요금제에 가입하지 않아도 됩니다. 넘버플러스를 이용하면 월 3,300원이 청구됩니다."], "308": ["번호이동으로 들어온 회선도 결합에 넣을 수 있나요?", "번호이동으로 가입한 휴대폰 회선도 가족 결합에 추가할 수 있습니다. 번호이동 회선에 신청한 가족 결합 할인은 신청 다음 달 청구분부터 적용됩니다."], "1631": ["듀얼심에서 모바일 데이터를 사용할 회선을 바꾸려면 어떻게 하나요?", "듀얼심에서 모바일 데이터를 사용할 회선은 휴대폰 설정의 SIM 관리자 또는 셀룰러 메뉴에서 선택하세요. 기종에 따라 듀얼심 데이터 자동 전환 항목도 함께 확인할 수 있습니다."], "1599": ["회원 정보는 어떻게 바꾸나요?", "Ubot 앱·홈페이지의 내 정보 화면에서 이름(20자 이내)과 거주 지역을 바꿀 수 있습니다. 이메일, 생년월일, 성별은 앱에서 바꿀 수 없으니 고객센터(114)에 문의해 주세요."], "1603": ["가입한 이메일이 기억나지 않아요.", "Ubot 앱에서는 가입 이메일(아이디) 찾기 기능을 제공하지 않습니다. 가입한 이메일이 기억나지 않으면 고객센터(114)에서 본인 확인 후 안내받을 수 있습니다."], "1420": ["해지했는데 요금이 또 청구됐어요.", "회선을 해지한 뒤에도 해지 전 마지막 달 사용분, 뒤늦게 정산된 로밍·국제전화 요금, 남은 할부금이 청구될 수 있습니다. 해지 후 나온 요금은 청구서 상세 내역에서 확인하고 이해되지 않는 금액은 고객센터에 문의해 주세요."], "1442": ["해지 후 연체 요금 납부 안내를 받았어요.", "해지 후 남은 요금은 안내 문자나 우편에 적힌 가상계좌로 입금하거나 고객센터·매장에서 낼 수 있습니다. 해지 후 납부 안내가 의심스러우면 문자 링크를 누르지 말고 고객센터(114)에서 미납 여부를 확인해 주세요."], "1245": ["다른 사람이 내 통화 내역을 조회할 수 있나요?", "통화 내역은 원칙적으로 회선 명의자 본인만 조회할 수 있습니다. 대리인이 통화 내역을 조회하려면 명의자의 인감증명서와 위임장이 필요합니다. 만 14세 미만 회선의 통화 내역은 법정대리인이 신청합니다."], "461": ["제 명의로 모르는 회선이 있어서 매장에 바로 가 보려고요.", "모르는 회선이 본인 명의로 개통된 문제를 상담할 수 있는 현재 위치 주변 매장을 찾아 드립니다. 명의도용을 막는 번호도용 방지 서비스도 무료로 신청할 수 있습니다."], "687": ["제 회선이 누구랑 결합돼 있어요?", "로그인한 회원의 가족 결합 정보를 조회해 함께 묶인 회선 수와 대표 회선, 적용 중인 할인을 안내해 드립니다."], "905": ["제 납부일이 며칠로 돼 있죠?", "회원의 휴대폰 요금 납부 정보를 조회해 현재 설정된 납부일을 안내해 드립니다. 휴대폰 요금을 자동이체로 납부할 때는 납부일을 10일, 15일, 21일, 25일 중에서 고를 수 있습니다."], "708": ["올해 데이터를 제일 많이 쓴 달이 언제였어요?", "회원의 올해 월별 데이터 사용 내역을 조회해 데이터를 가장 많이 쓴 달을 안내해 드립니다."], "693": ["지난달에 제가 쓴 데이터가 총 몇 GB였는지 알려 주세요.", "회원의 지난달 데이터 사용 내역을 조회해 한 달 동안 쓴 총 데이터 용량을 안내해 드립니다."], "870": ["두 달 전에 제가 데이터를 얼마나 썼는지 알고 싶어요.", "회원의 사용 내역을 조회해 두 달 전 데이터 사용량을 안내해 드립니다."], "871": ["작년 이맘때 제 데이터 사용량이 어땠는지 비교해 주세요.", "회원의 사용 내역을 조회해 작년 같은 달 데이터 사용량과 이번 달 사용량을 비교해 안내해 드립니다."], "1890": ["인터넷 회선 뜻은 무엇인가요?", "집이나 사업장 등을 인터넷 서비스 제공자의 망에 연결하는 통신 서비스 단위입니다."], "246": ["매장에서도 휴대폰을 살 수 있나요?", "매장에서 휴대폰 단말을 구매할 수 있습니다. 휴대폰을 앱 온라인 샵에서 구매하면 배송비가 무료입니다."], "314": ["휴대폰은 어디에서 살 수 있나요?", "휴대폰은 앱의 온라인 샵이나 매장에서 구매할 수 있습니다. 휴대폰을 앱 온라인 샵에서 구매하면 배송비가 무료입니다."], "1172": ["자동이체 계좌에서 요금이 빠져나가지 않았어요.", "자동이체 계좌에서 요금이 빠져나가지 않았다면 계좌번호와 잔액, 계좌의 해지·거래정지 여부를 확인해 주세요. 은행이 별도로 발급한 평생계좌번호는 자동이체가 되지 않을 수 있으므로 실제 계좌번호로 등록해 주세요."], "729": ["이번 달 요금이 이미 빠져나갔나요?", "회원의 요금 납부 내역을 조회해 이번 달 요금의 납부 완료 여부를 안내해 드립니다."], "1247": ["국제전화는 어떻게 거나요?", "국제전화를 걸려면 국제전화 서비스 번호(예: 00700)나 +를 누른 뒤 국가번호와 상대방 번호를 입력하면 됩니다. 국제전화는 국내 요금제의 기본 제공 통화에 포함되지 않으며 국가별 요금이 별도로 부과됩니다."], "1889": ["공유기 뜻은 무엇인가요?", "집이나 사무실의 인터넷 연결을 여러 기기에 나누어 주는 장치입니다. 보통 와이파이 기능도 함께 제공합니다."], "1663": ["집 와이파이에 연결된 기기 목록을 확인할 수 있나요?", "집 와이파이에 연결된 기기는 공유기의 관리 화면이나 제조사 앱에서 연결된 클라이언트·기기 목록으로 확인할 수 있습니다. 와이파이 연결 기기를 이름만으로 구분하기 어려우면 각 기기의 네트워크 주소와 대조하세요."], "1669": ["개인 공유기를 통신사 인터넷에 연결해도 되나요?", "통신사 인터넷 회선에 개인 공유기를 연결할 수 있는지는 회선과 장비 구성에 따라 다릅니다. 개인 공유기를 연결하기 전에 통신사 장비의 필수 사용 여부와 IPTV·인터넷전화 연동 조건을 확인해 주세요. 개인 공유기 연결 방식은 해당 통신사와 공유기 안내를 따르세요."], "1347": ["키즈가드는 어떤 서비스인가요?", "Ubot 키즈가드(월 2,200원)는 보호자가 연결·동의한 뒤 자녀 위치를 공유받고 유해 사이트를 차단하는 서비스입니다. 키즈가드는 긴급 출동 서비스를 제공하지 않습니다. 키즈 안심 요금제에는 키즈가드가 포함되어 있습니다."], "988": ["제 다른 번호가 정상적으로 쓰이는 상태인지 봐 주세요.", "회원 명의 다른 회선의 상태를 조회해 정상·정지 여부를 안내해 드립니다."], "845": ["폰을 찾아서 정지를 풀었는데 지금 정상으로 돌아왔어요?", "회원의 회선 상태를 조회해 분실한 휴대폰을 찾은 뒤 신청한 정지 해제가 완료됐는지 안내해 드립니다."], "1530": ["제 회선은 언제 개통했나요?", "로그인하면 회원님 회선의 개통일과 현재 이용 상태(이용 중·정지·해지)를 조회해 안내해 드립니다."], "834": ["제 번호를 처음 개통한 날이 언제예요?", "회원의 가입 정보를 조회해 현재 휴대폰 번호를 처음 개통한 날짜를 안내해 드립니다."], "1683": ["챗봇 상담에 주민등록번호 같은 개인정보를 입력해도 되나요?", "챗봇 상담 내용에 주민등록번호, 카드번호, 계좌번호 같은 개인정보는 입력하지 마세요. 본인 확인이 필요한 업무는 Ubot 앱에서 공동·금융 인증서, 휴대폰 인증, 신분증 촬영으로 진행할 수 있습니다."], "1649": ["연락처에 없는 번호의 전화만 무음으로 받을 수 있나요?", "연락처에 없는 번호의 전화만 무음으로 받으려면 지원되는 전화 앱에서 알 수 없는 발신자 음소거 또는 연락처 미등록 번호 관련 설정을 확인하세요. 연락처 미등록 번호의 무음 처리와 발신번호 미표시 전화 차단은 다릅니다. 연락처 미등록 번호를 무음 처리하면 필요한 전화까지 무음이 될 수 있습니다."], "1043": ["가입할 때 휴대폰을 꼭 새로 사야 하나요?", "Ubot에 가입할 때 새 휴대폰을 꼭 살 필요는 없으며 쓰던 휴대폰이나 자급제폰에 유심(7,700원) 또는 eSIM(2,750원)만 받아 가입할 수 있습니다. 쓰던 휴대폰이나 자급제폰으로 가입하면 선택약정으로 요금 25% 할인을 받을 수 있습니다."], "1131": ["온라인 전용 요금제가 있나요?", "온라인 셀프개통으로만 가입할 수 있는 Ubot 다이렉트는 월 30,000원~69,000원의 무약정 요금제입니다. Ubot 다이렉트는 같은 데이터 제공량의 매장 가입 요금제보다 월정액이 낮습니다."], "1569": ["예약한 시간에 갈 수 없으면 어떻게 하나요?", "예약한 시간에 매장에 갈 수 없으면 방문 시간 전에 Ubot 앱에서 예약을 취소해 주세요. 매장 예약을 취소하면 그 시간대를 다른 고객이 예약할 수 있습니다. 취소 후에는 다른 시간으로 매장 방문을 다시 예약할 수 있습니다."], "65": ["발신번호 표시를 숨길 수 있나요?", "발신번호 표시를 숨기려면 발신번호 표시 제한 기능을 이용할 수 있습니다."], "1236": ["내 번호를 숨기고 전화할 수 있나요?", "한 번만 발신번호를 숨기려면 상대방 번호 앞에 *23#을 눌러 전화할 수 있습니다. 발신번호를 항상 숨기려면 휴대폰 설정의 발신번호 표시에서 숨기기를 선택해 주세요."], "1157": ["이번 달 청구된 요금은 언제 사용한 요금인가요?", "이번 달 청구서에는 지난달 1일부터 말일까지 사용한 요금이 들어 있습니다. 예를 들어 3월 청구서에는 2월 한 달 동안 사용한 요금이 청구됩니다."], "1034": ["매장 방문 예약으로 어떤 업무를 상담받을 수 있나요?", "구매 상담, 요금제 변경, 기기변경, 개통, 명의 이전, 유심 교체, 분실·파손 신고 목적으로 방문을 예약할 수 있습니다."], "927": ["워치 회선 요금제가 뭔지 알려 주세요.", "회원의 워치 회선을 조회해 가입된 요금제를 안내해 드립니다."], "910": ["워치 회선 요금이 이번 달 얼마 나왔나요?", "회원의 워치 회선 청구 내역을 조회해 이번 달 요금을 안내해 드립니다."], "1228": ["문자를 받을 때도 요금이 나오나요?", "국내에서 단문·장문·사진 문자를 받는 것은 무료입니다. 해외에서 문자를 받는 것도 일반적으로 무료지만 국가별 로밍 조건은 확인해 주세요."], "925": ["제 요금제에 데이터랑 통화가 얼마씩 들어 있어요?", "회원의 요금제를 조회해 기본 제공 데이터와 통화·문자 제공량을 안내해 드립니다."], "990": ["태블릿 회선은 유심으로 돼 있어요, eSIM으로 돼 있어요?", "회원의 태블릿 회선 정보를 조회해 유심·eSIM 사용 방식을 안내해 드립니다."], "277": ["태블릿 회선에도 부가서비스를 넣을 수 있나요?", "태블릿 데이터 전용 요금제는 통화와 문자를 제공하지 않아 통화 관련 부가서비스를 이용할 수 없습니다. 태블릿 회선에서 가입할 수 있는 부가서비스는 앱에서 확인해 주세요."], "225": ["태블릿 회선만 해지할 수 있나요?", "태블릿 서브 회선만 따로 해지할 수 있습니다. 해지한 태블릿 회선이 데이터 쉐어링으로 연결되어 있었다면 그 연결도 함께 종료됩니다."], "459": ["점검을 다 해봐도 데이터가 안 돼서 매장에 가 보려고요.", "데이터가 계속 연결되지 않아 점검받고 싶다면 현재 위치 주변 매장을 찾아 드립니다. 데이터 문제로 유심 점검이 필요할 수 있으니 매장에 방문할 때 신분증을 지참해 주세요."], "1301": ["자동 로밍이 무엇인가요?", "자동 로밍은 따로 신청하지 않아도 Ubot 휴대폰을 해외에서 켜면 현지 통신사 망에 연결되는 기능입니다. 자동 로밍으로 해외에서 전화와 문자를 쓸 수 있지만 로밍 상품 없이 데이터를 사용하면 사용량만큼 요금이 부과되므로 미리 상품에 가입하거나 데이터 로밍을 꺼 주세요."], "750": ["제 명의 회선 두 개 요금을 각각 알려 주세요.", "회원 명의의 휴대폰 회선 두 개를 각각 조회해 회선별 청구 금액을 안내해 드립니다."], "917": ["제 휴대폰 요금이 한 달 평균 얼마 정도예요?", "회원의 최근 청구 내역을 조회해 월평균 요금을 안내해 드립니다."], "1851": ["약정 기간 뜻은 무엇인가요?", "약정에 따라 서비스를 유지하거나 혜택 조건을 지키기로 정한 기간입니다."], "187": ["차단한 번호가 너무 많으면 문제가 되나요?", "차단한 번호의 목록은 휴대폰 기기 설정에 저장되며 저장 가능한 개수는 기기마다 다를 수 있습니다. 차단할 번호가 많다면 통신사의 스팸 차단 서비스를 함께 이용하는 것도 도움이 됩니다."], "1252": ["060 같은 유료 정보 서비스 이용을 막을 수 있나요?", "060 유료 정보 서비스 이용을 막으려면 고객센터(114)에서 060 발신 차단을 무료로 신청할 수 있습니다. 청구서에 060 정보이용료가 나온다면 앱의 요금 상세에서 사용처를 확인할 수 있습니다."], "263": ["예전에 문의한 내용을 다시 볼 수 있나요?", "예전에 문의한 내용은 앱의 상담 내역에서 다시 확인할 수 있습니다. 과거 상담 내역에 관한 자세한 사항은 고객센터로 문의해 주세요."], "1629": ["실물 멤버십 카드를 잃어버렸을 때 재발급은 어떻게 신청하나요?", "실물 멤버십 카드를 잃어버렸다면 멤버십 앱이나 고객센터에서 카드 이용 정지와 재발급 가능 여부를 확인해 주세요. 실물 멤버십 카드 재발급 절차와 비용, 그동안 모바일 카드 이용 가능 여부는 해당 멤버십의 안내에 따라 확인해 주세요."], "855": ["회원 정보에 제 예전 주소가 그대로 남아 있는지 봐 주세요.", "본인 확인 후 회원 정보에 등록된 주소가 예전 주소인지 확인할 수 있도록 이메일과 주소를 일부 가려 안내해 드립니다."], "883": ["지난달 국제전화 요금이 얼마 나왔어요?", "회원의 지난달 청구 내역을 조회해 국제전화 요금을 안내해 드립니다."], "1675": ["IPTV는 화면이 나오는데 소리만 안 들려요.", "IPTV에서 화면은 나오는데 소리가 안 들리면 TV와 셋톱박스 양쪽의 음소거·음량을 확인하고 사운드바 등 다른 오디오 장치로 출력되는지도 살펴보세요. IPTV의 HDMI 연결과 음성 출력 설정을 점검한 뒤에도 소리가 안 들리면 장비 점검을 요청하세요."], "1096": ["가족에게 명의를 변경하면 멤버십 등급과 포인트도 넘어가나요?", "가족에게 명의를 변경한 뒤 30일 안에 같은 가족과 Ubot 가족 결합에 가입하고 30일 이상 유지하면 가입 기간, 멤버십 등급, 포인트를 이어받습니다. 명의 변경 후 이 조건을 충족하지 않으면 이전 명의자의 멤버십 등급과 포인트는 이어지지 않습니다."], "1052": ["신규 가입할 때 원하는 번호를 고를 수 있나요?", "신규 가입할 때 원하는 번호의 뒷자리 4자리를 가입 화면에서 검색해 사용 가능한 번호 중에서 고를 수 있습니다. 신규 가입 시 원하는 번호가 없다면 비슷한 번호를 추천해 드립니다."], "833": ["이번에 가입한 로밍 패스 요금이 얼마로 청구돼요?", "회원이 이번에 가입한 로밍 패스 내역을 조회해 청구될 이용 요금을 안내해 드립니다."], "840": ["가족한테 넘긴 회선 명의 변경이 끝났나요?", "회원의 명의 변경 신청 내역을 조회해 가족에게 넘긴 회선의 명의 변경 처리 상태를 안내해 드립니다."], "1372": ["결합 할인은 언제부터 적용되나요?", "결합 할인은 신청한 다음 달 청구분부터 적용됩니다. 적용된 결합 할인은 대표 회선 청구서의 결합 할인 항목에서 확인할 수 있습니다."], "301": ["초고속 인터넷 100Mbps 요금은 얼마인가요?", "초고속 인터넷 100Mbps 상품의 요금은 3년 약정 기준 월 22,000원입니다."], "844": ["분실 신고가 제대로 접수돼서 회선이 정지됐나요?", "회원의 회선 상태를 조회해 분실 신고가 접수됐는지와 회선이 정지됐는지 안내해 드립니다."], "56": ["분실 정지를 해제하려면 어떻게 하나요?", "분실로 정지한 회선은 본인 인증 후 고객센터나 홈페이지에서 정지를 해제할 수 있습니다."], "755": ["제가 요금제를 언제 무엇으로 바꿨는지 이력을 보고 싶어요.", "회원의 요금제 변경 이력을 조회해 언제 어떤 요금제로 바꿨는지 안내해 드립니다."], "1560": ["예약한 날짜나 시간을 바꿀 수 있나요?", "매장 예약 날짜나 시간을 바로 변경하는 기능은 없습니다. 예약 날짜나 시간을 바꾸려면 내 예약 목록에서 기존 예약을 취소한 뒤 원하는 날짜와 시간으로 다시 예약해 주세요."], "749": ["다음 요금 출금 예정일이 언제예요?", "회원의 요금 납부 정보를 조회해 다음 요금 출금 예정일과 예상 금액을 안내해 드립니다."], "851": ["제 eSIM이 어느 기기에 설치돼 있는지 알 수 있어요?", "회원의 eSIM 정보를 조회해 등록된 기기를 안내해 드립니다."], "409": ["eSIM 설정이 어려워서 직접 도와줄 매장을 찾고 싶어요.", "현재 위치 주변에서 eSIM 설정과 발급을 도와드리는 매장을 찾아 드립니다. eSIM은 앱에서도 직접 발급받을 수 있습니다."], "120": ["휴대폰 요금은 언제부터 언제까지 사용한 금액이 청구되나요?", "휴대폰 요금은 매월 1일부터 말일까지 사용한 금액이 다음 달에 청구됩니다."], "858": ["이 폰을 언제 샀는지 알려 주세요.", "회원의 단말 할부 정보를 조회해 구매일과 할부 시작일을 안내해 드립니다."], "443": ["IPTV 가입 상담을 직접 받아 보고 싶은데 근처 매장 있나요?", "현재 위치 주변에서 IPTV 가입 상담을 받을 수 있는 매장을 찾아 드립니다. IPTV 가입은 앱이나 고객센터에서도 신청할 수 있습니다."], "116": ["만 17세도 성인 요금제에 가입할 수 있나요?", "만 19세 미만도 성인 요금제에 가입할 수 있지만 법정대리인 동의가 필요해 법정대리인과 함께 매장을 방문해야 합니다."], "1321": ["해외 체류로 장기 일시정지를 신청할 때 필요한 서류가 있나요?", "해외 체류로 장기 일시정지를 신청하려면 항공권이나 출입국 사실 증명서와 명의자 신분증이 필요합니다. 해외에 출국한 뒤에는 대리인이 위임장을 가지고 매장에서 장기 일시정지를 신청할 수도 있습니다."], "280": ["해외에 있는 동안 부가서비스를 신청할 수 있나요?", "해외에서도 데이터 로밍이나 와이파이로 앱에 접속하면 부가서비스를 신청할 수 있습니다. 해외에서도 로밍 차단을 앱에서 신청할 수 있습니다."], "1577": ["비회원도 알림을 받을 수 있나요?", "매장 예약과 요금 알림은 로그인한 회원에게만 보내 드립니다. 매장 예약과 요금 정보가 회원 계정에 연결되어 있어야 알림을 받을 수 있습니다."], "1564": ["비회원도 매장 예약을 할 수 있나요?", "매장 방문 예약은 로그인한 회원만 할 수 있습니다. 회원 가입 후 로그인하면 매장 예약과 예약 알림을 이용할 수 있습니다."], "1480": ["개인정보 제공에 동의하지 않으면 정지된다는 문자를 받았어요.", "번호이동이나 신규 가입 때 법에 따라 필요한 본인 확인 정보 제공에 동의하지 않으면 개통이 정지될 수 있습니다. 개인정보 제공 동의 안내를 받았다면 문자 안내에 따라 앱에서 동의를 완료하거나 고객센터에 문의해 주세요."], "269": ["무료 체험이 있는 서비스는 어떻게 되나요?", "부가서비스 무료 체험이 끝나고 유료로 전환되기 전에 안내 문자가 발송됩니다. 무료 체험 부가서비스를 계속 이용하지 않으려면 유료 전환 전에 앱에서 해지해 주세요."], "268": ["달 중간에 부가서비스를 가입하면 요금이 전부 나오나요?", "달 중간에 가입한 부가서비스 요금은 가입한 달에 사용한 일수만큼 나누어 청구됩니다. 예를 들어 월 3,300원인 부가서비스를 15일에 가입하면 그 달에는 요금의 절반가량이 청구됩니다."], "1418": ["다른 통신사로 옮길 때도 Ubot에 해지 신청을 해야 하나요?", "다른 통신사로 번호이동을 신청하면 새 회선 개통과 동시에 Ubot 회선이 자동 해지되므로 따로 해지할 필요가 없습니다. 번호이동 전에 Ubot 회선을 먼저 해지하면 쓰던 번호를 잃을 수 있으니 개통이 끝날 때까지 해지하지 마세요."], "1278": ["설정에서 eSIM을 실수로 삭제했어요.", "휴대폰에서 eSIM을 삭제해도 통신 회선은 해지되지 않습니다. 실수로 삭제한 eSIM은 Ubot 앱이나 매장에서 다시 발급받아 설치할 수 있으며 재발급 비용 2,750원이 청구됩니다. 이전에 받은 eSIM QR 코드는 다시 사용할 수 없습니다."], "1296": ["어떤 나라에서 Ubot 로밍 상품을 쓸 수 있나요?", "Ubot 로밍 상품은 일본, 중국, 대만, 홍콩, 베트남, 태국, 싱가포르, 필리핀, 미국, 캐나다, 영국, 프랑스, 독일, 스페인, 이탈리아, 호주 16개국에서 이용할 수 있습니다. 로밍 상품은 국가별 전용이라 가입한 나라 외에서는 사용할 수 없습니다."], "1373": ["친구끼리도 결합할 수 있나요?", "Ubot 친구 결합은 월정액 19,000원 이상인 친구 휴대폰 2회선이면 월 4,000원, 3회선이면 월 9,000원을 대표 회선에서 할인합니다."], "1438": ["명의자가 사망했을 때 휴대폰은 어떻게 해지하나요?", "명의자가 사망한 회선은 가족이 사망 사실이 기재된 서류(가족관계증명서 등)와 본인 신분증을 가지고 매장에 방문하면 해지하거나 가족 명의로 바꿀 수 있습니다. 사망한 명의자의 회선을 정리할 때 남은 할부금과 요금도 함께 정리합니다."], "1508": ["로그인하지 않아도 챗봇을 쓸 수 있나요?", "비회원도 챗봇에 질문할 수 있지만 대화당 5개까지 질문할 수 있습니다. 비회원 챗봇 질문 한도를 넘으면 로그인 후 계속 이용할 수 있습니다. 챗봇이 답변을 찾지 못한 질문은 횟수에 포함되지 않습니다."], "1053": ["온라인 셀프개통은 어떻게 하나요?", "온라인 셀프개통은 Ubot 앱·홈페이지에서 신청서를 작성하고 유심을 받거나 eSIM을 발급받은 뒤 개통 요청 버튼을 누르면 됩니다. 온라인 셀프개통에는 본인 명의 신분증과 휴대폰·인증서 등 본인인증 수단을 준비해 주세요."], "1054": ["셀프개통은 언제 할 수 있나요?", "신규 가입은 매일 오전 8시부터 오후 10시까지, 번호이동은 평일·토요일 오전 10시부터 오후 7시 50분까지 셀프개통할 수 있습니다."], "1284": ["eSIM은 유심보다 보안에 취약한가요?", "eSIM은 휴대폰 안의 칩에 암호화되어 저장되고 물리적으로 빼낼 수 없어 유심보다 분실·복제 위험이 낮습니다. eSIM QR 코드는 다른 사람에게 보여 주지 마세요."], "1282": ["한 휴대폰에서 유심과 eSIM으로 번호 두 개를 쓸 수 있나요?", "듀얼 SIM을 지원하는 휴대폰이라면 유심과 eSIM에 각각 번호를 개통해 두 번호를 함께 쓸 수 있습니다. 한 휴대폰에서 유심과 eSIM으로 쓰는 두 번호는 같은 명의여야 하며 최대 2회선까지 사용할 수 있습니다."], "1118": ["태블릿 요금제 종류와 가격이 궁금해요.", "Ubot 태블릿 요금제는 데이터 전용 5G 상품으로 5GB(월 9,900원), 10GB(14,900원), 20GB(19,900원), 50GB(29,900원)가 있습니다. Ubot 태블릿 요금제는 음성·문자를 제공하지 않으며 데이터를 다 쓰면 차단됩니다."], "1722": ["LTE 뜻이 무엇인가요?", "Long Term Evolution의 약자로, 4G 이동통신에 널리 쓰이는 무선 접속 기술입니다."], "1751": ["VoWiFi 뜻이 무엇인가요?", "Voice over Wi-Fi의 약자로, 지원되는 환경에서 와이파이 연결을 이용해 통화하는 기술입니다."], "1733": ["LTE-M 뜻이 무엇인가요?", "LTE 망을 기반으로 사물인터넷 단말 연결을 지원하는 이동통신 기술입니다."], "1750": ["VoNR 뜻이 무엇인가요?", "Voice over New Radio의 약자로, 5G NR을 이용해 음성 통화를 제공하는 기술입니다."], "1762": ["요금제 뜻이 무엇인가요?", "통화·문자·데이터 제공량과 이용요금 등의 조건을 정한 통신 서비스 상품입니다."], "1904": ["바이트 뜻은 무엇인가요?", "일반적으로 8비트로 이루어진 데이터 크기 단위입니다."], "1819": ["VPN 뜻이 무엇인가요?", "인터넷 위에 암호화된 연결을 만들어 기기와 다른 네트워크 사이의 통신을 전달하는 기술입니다."], "1723": ["LTE-A 뜻이 무엇인가요?", "LTE Advanced의 약자로, 주파수 묶음 등으로 LTE의 성능을 확장한 기술입니다."], "1816": ["OTT 뜻이 무엇인가요?", "인터넷을 통해 영상·음성 콘텐츠를 직접 제공하는 서비스 또는 전달 방식을 뜻합니다."], "1256": ["유심(USIM)이 무엇인가요?", "유심은 가입자 정보를 저장해 휴대폰이 통신망에 접속할 수 있게 해 주는 작은 카드입니다. 유심을 다른 휴대폰에 옮겨 꽂으면 같은 번호로 그 휴대폰을 쓸 수 있습니다."], "1227": ["문자 메시지 요금은 얼마인가요?", "대부분의 요금제는 국내 문자 메시지를 기본 제공합니다. 문자 기본 제공량이 있는 요금제에서 이를 초과하면 단문(SMS) 건당 22원, 장문(LMS) 33원, 사진·동영상(MMS) 110원이 부과됩니다."], "711": ["문자를 많이 보냈는데 추가 요금이 나왔는지 확인해 주세요.", "회원의 이번 달 문자 사용량을 조회해 제공량 초과 건수와 추가 요금을 안내해 드립니다. LTE 세이브 요금제는 제공량을 초과한 문자 한 건당 22원이 청구됩니다."], "100": ["LTE 세이브 요금제에서 문자를 100건 넘게 보내면 요금이 붙나요?", "LTE 세이브 요금제는 문자 100건을 제공합니다. LTE 세이브 요금제에서 문자 100건을 초과하면 초과한 문자는 건당 22원이 청구됩니다."], "1727": ["5G SA 뜻이 무엇인가요?", "Standalone의 약자로, 5G 무선망과 5G 코어망을 사용하는 구성입니다."], "1726": ["5G NSA 뜻이 무엇인가요?", "Non-Standalone의 약자로, 5G 무선망을 LTE 망의 제어 기능과 함께 사용하는 구성입니다."], "1725": ["5G NR 뜻이 무엇인가요?", "New Radio의 약자로, 5G 이동통신의 무선 접속 기술입니다."], "1661": ["집 와이파이의 2.4GHz와 5GHz는 어떻게 다른가요?", "집 와이파이의 2.4GHz는 일반적으로 도달 범위와 벽 통과에 유리합니다. 집 와이파이의 5GHz는 일반적으로 가까운 거리에서 높은 속도를 얻기 좋습니다. 2.4GHz와 5GHz의 실제 성능은 공유기·기기 성능과 주변 간섭에 따라 달라집니다."], "111": ["안내된 요금제 가격에 부가세가 포함되어 있나요?", "안내된 요금제 가격은 모두 부가세가 포함된 금액입니다."], "901": ["지난달 요금에 부가세가 얼마 붙었어요?", "회원의 지난달 청구 내역을 조회해 포함된 부가세를 안내해 드립니다."], "743": ["이번 달 요금에서 부가세가 얼마예요?", "회원의 이번 달 청구 내역을 조회해 청구 금액에 포함된 부가세를 안내해 드립니다."], "1166": ["통합 청구를 하면 회선별 요금은 어떻게 확인하나요?", "통합 청구 중에는 요금 조회 화면에 회선 요금의 합산 금액이 보입니다. 통합 청구한 회선별 상세 요금은 앱의 요금 조회에서 회선을 선택해 확인할 수 있습니다."], "1694": ["커버리지 뜻이 무엇인가요?", "통신망의 신호를 받아 서비스를 이용할 수 있는 지역이나 범위입니다."], "227": ["해지하기 전에 무엇을 확인하면 좋을까요?", "휴대폰 회선을 해지하기 전에는 약정 만료일과 예상 할인반환금, 남은 단말 할부금, 남은 멤버십 포인트를 확인해 주세요. 해지 전 확인할 항목은 모두 앱에서 조회할 수 있습니다."], "439": ["회선 해지하러 갈 가까운 매장을 알려 주세요.", "현재 위치 주변에서 휴대폰 회선 해지 업무를 처리하는 매장을 찾아 드립니다. 회선 해지를 위해 매장에 방문할 때는 신분증을 지참해 주세요."], "985": ["주문한 휴대폰 배송 어디까지 왔어요?", "회원의 주문 내역을 조회해 현재 배송 단계를 안내해 드립니다."], "420": ["새로 나온 폰을 직접 보고 사고 싶은데 가까운 매장이 어디예요?", "현재 위치 주변에서 새 휴대폰 단말을 직접 보고 살 수 있는 판매 매장을 찾아 드립니다. 새 휴대폰은 앱 온라인 샵에서도 무료 배송으로 구매할 수 있습니다."], "723": ["이번 달 요금이 지금까지 얼마쯤 쌓였어요?", "회원의 이번 달 사용 내역을 조회해 현재까지 쌓인 휴대폰 요금의 예상 금액을 안내해 드립니다."], "859": ["제 폰을 처음에 얼마에 샀는지 확인하고 싶어요.", "회원의 단말 할부 정보를 조회해 할부 원금 총액을 안내해 드립니다."], "323": ["주문한 휴대폰이 어디까지 왔는지 보고 싶어요.", "주문한 휴대폰의 배송 상태는 앱의 주문 조회에서 확인할 수 있습니다. 온라인으로 주문한 휴대폰은 택배로 1~2일 걸립니다."], "510": ["우리 동네에 새로 생긴 매장이 있나요?", "동네 이름이나 주소를 알려 주시면 그 주변에서 운영 중인 매장을 찾아 드립니다."], "84": ["휴대폰 개통에는 얼마나 시간이 걸리나요?", "휴대폰은 본인 인증과 가입 심사가 완료되면 일반적으로 당일 개통됩니다. 휴대폰 개통은 상황에 따라 당일보다 더 걸릴 수 있습니다."], "835": ["이 통신사를 쓴 지 몇 년 됐어요?", "회원의 휴대폰 가입 정보를 조회해 이 통신사를 이용하기 시작한 날짜와 이용 기간을 안내해 드립니다."], "341": ["지금 바로 갈 수 있는 매장이 있을까요?", "현재 시간과 위치를 기준으로 지금 영업 중인 매장을 안내해 드릴 수 있습니다. 매장은 평일에 20:00, 토요일에 17:00에 마감합니다."], "736": ["올해 제가 낸 통신비가 전부 얼마예요?", "회원의 휴대폰 요금 납부 내역을 조회해 올해 낸 통신비 총액을 안내해 드립니다. 통신비 납부 확인서는 앱이나 홈페이지에서 발급받을 수 있습니다."], "962": ["올해 제휴 할인을 몇 번 썼는지 알려 주세요.", "회원의 멤버십 사용 내역을 조회해 올해 사용한 제휴 할인 횟수를 안내해 드립니다."], "1533": ["이번 달이나 지난달 요금이 얼마인지 알려 주세요.", "로그인하면 회원님 회선의 월별 청구 금액과 항목별 금액(요금제, 부가서비스, 로밍, 추가 사용), 할인 금액, 납부 상태를 조회해 안내해 드립니다."], "896": ["작년 12월에 제 요금이 얼마 나왔었나요?", "회원의 청구 내역을 조회해 작년 12월 청구 금액을 안내해 드립니다."], "810": ["우리 가족 결합의 대표 회선이 누구로 돼 있어요?", "회원의 가족 결합 정보를 조회해 대표 회선이 무엇인지 안내해 드립니다. 가족 결합의 대표 회선은 한 개입니다."], "1481": ["이용약관과 개인정보 처리방침은 어디에서 볼 수 있나요?", "Ubot 홈페이지 맨 아래의 이용약관, 개인정보 처리방침 메뉴에서 현재 약관과 방침을 확인할 수 있습니다. 이전 버전의 이용약관도 같은 메뉴에서 볼 수 있습니다."], "1829": ["통신사 뜻은 무엇인가요?", "휴대폰 통화·문자·데이터나 인터넷 서비스를 제공하는 회사를 말합니다."], "486": ["외근 나왔는데 지금 있는 곳에서 업무 볼 매장 좀 찾아 주세요.", "외근 중인 현재 위치 주변 매장과 운영시간을 안내해 드립니다. 외근 중 처리할 업무를 말씀해 주시면 해당 업무를 취급하는 매장만 골라 드립니다."], "984": ["태블릿 회선은 언제 개통했어요?", "회원의 태블릿 회선 가입 정보를 조회해 개통일을 안내해 드립니다."], "1057": ["온라인으로 주문한 휴대폰은 언제 받을 수 있나요?", "온라인으로 주문한 휴대폰은 주문 후 택배로 1~2일 안에 도착하며 배송비는 무료입니다. 온라인 휴대폰 주문의 배송 상태는 앱의 주문 조회에서 확인할 수 있습니다."], "761": ["지금 요금제로 바꾼 지 얼마나 됐어요?", "회원의 요금제 변경 이력을 조회해 현재 요금제로 바꾼 날짜를 안내해 드립니다."], "1810": ["와이파이 6 뜻이 무엇인가요?", "IEEE 802.11ax 기반 와이파이 기술을 쉽게 구분하기 위한 세대 이름입니다."], "1796": ["IPv6 뜻이 무엇인가요?", "128비트 주소를 사용하는 인터넷 프로토콜 버전 6입니다."], "1811": ["와이파이 6E 뜻이 무엇인가요?", "와이파이 6 기술을 6GHz 주파수 대역까지 확장해 쓰는 이름입니다. 사용 가능 여부는 국가와 기기에 따라 다릅니다."], "235": ["새 휴대폰을 사기 전까지 쓸 방법이 있나요?", "새 휴대폰을 사기 전까지 예전에 쓰던 단말에 회선을 연결해 임시로 쓸 수 있습니다. 예전에 쓰던 단말로 회선을 이용하는 방법은 가까운 매장에서 안내받을 수 있습니다."], "266": ["휴대폰 기능 사용법도 물어볼 수 있나요?", "휴대폰 기기 조작이나 기능 사용법은 제조사 안내를 확인하는 것이 정확합니다. 휴대폰의 통신 서비스 관련 문의는 고객센터나 매장에서 도와드립니다."], "1646": ["휴대폰의 통신사 설정 업데이트는 어떻게 하나요?", "iPhone에서는 인터넷에 연결한 뒤 설정의 일반·정보 화면에서 통신사 설정 업데이트 안내가 있는지 확인하세요. 다른 기종의 통신사 설정 업데이트는 제조사와 통신사 안내를 따르세요. 통신사 설정 업데이트는 통신사를 바꾸는 절차와 다릅니다."], "1642": ["앱이 모바일 데이터로 자동 업데이트되지 않게 하려면 어떻게 하나요?", "앱이 모바일 데이터로 자동 업데이트되지 않게 하려면 앱스토어의 자동 업데이트 설정에서 와이파이에서만 업데이트하도록 선택하세요. 앱 자동 업데이트는 운영체제와 앱스토어별로 따로 설정할 수 있습니다. 앱을 수동으로 업데이트할 때도 연결 상태를 확인하세요."], "180": ["데이터 문제로 네트워크 설정을 초기화해도 되나요?", "데이터 문제가 재부팅과 유심 재장착으로 해결되지 않으면 네트워크 설정 초기화를 시도할 수 있습니다. 네트워크 설정을 초기화하면 저장된 와이파이 비밀번호가 지워집니다."], "1071": ["애플워치나 갤럭시워치는 어떻게 개통하나요?", "애플워치나 갤럭시워치는 같은 명의의 Ubot 휴대폰과 연결해야 셀룰러로 개통할 수 있습니다. 애플워치는 아이폰과, 갤럭시워치는 갤럭시 휴대폰과 연결한 뒤 워치 앱에서 셀룰러를 설정하면 Ubot 워치 요금제로 개통됩니다."], "1410": ["아이패드에서 내 휴대폰 번호는 어떻게 확인하나요?", "아이패드의 셀룰러 회선 번호는 설정 > 셀룰러 데이터 > 셀룰러 데이터 번호에서 확인할 수 있습니다. Ubot 앱의 회선 목록에서도 아이패드·태블릿 번호를 볼 수 있습니다."], "1686": ["APN은 무엇이고 어떻게 설정하나요?", "APN은 휴대폰이 통신사의 모바일 데이터망에 연결할 때 사용하는 설정입니다. 일부 자급제·해외 구매 단말은 APN을 별도로 설정해야 할 수 있습니다. 안드로이드의 APN은 일반적으로 ‘설정 → 연결 → 모바일 네트워크 → 액세스 포인트 이름’에서 확인하거나 변경할 수 있습니다. APN 메뉴 위치와 입력값은 기기·통신사에 따라 다르므로 이용 중인 통신사의 공식 안내에 따라 설정해 주세요."], "1643": ["클라우드 사진 백업을 와이파이에서만 하게 설정할 수 있나요?", "클라우드 사진 백업을 와이파이에서만 하려면 사진 백업 앱에서 모바일 데이터 백업을 꺼 주세요. Google 포토나 iCloud 사진 등 사용하는 사진 백업 서비스별로 설정을 확인해야 합니다."], "1639": ["지운 문자 메시지를 복구할 수 있나요?", "지운 문자 메시지는 문자 앱에 휴지통이나 최근 삭제된 항목이 있으면 복원을 시도할 수 있습니다. 문자 복구 가능 여부는 기종과 삭제 후 경과 기간에 따라 다릅니다. 문자 백업이나 복구 기능이 없다면 삭제한 메시지를 되살리지 못할 수 있습니다."], "1509": ["이전 챗봇 대화를 다시 볼 수 있나요?", "로그인한 회원은 챗봇 대화 기록 메뉴에서 이전 대화를 열어 볼 수 있습니다. 챗봇 대화는 마지막으로 이용한 날부터 3개월 동안 보관됩니다."], "1506": ["챗봇 답변이 실패하면 다시 물어볼 수 있나요?", "일시적인 오류로 챗봇 답변을 받지 못하면 답변 아래의 재시도 버튼으로 같은 질문을 다시 보낼 수 있습니다. 챗봇 질문 하나당 처음 시도를 포함해 최대 3번까지 시도할 수 있습니다."], "1217": ["모바일 인터넷 전화(보이스톡 등)를 쓰면 데이터가 차감되나요?", "보이스톡 같은 모바일 인터넷 전화는 일반 데이터처럼 요금제의 기본 데이터 제공량에서 차감됩니다. 휴대폰 기본 전화 앱의 VoLTE 음성통화는 데이터가 아닌 통화량으로 계산됩니다."], "239": ["분실한 뒤 계정 보안을 어떻게 점검하나요?", "휴대폰 분실 후 계정 보안을 점검하려면 제조사 계정과 자주 쓰는 서비스의 비밀번호를 바꾸고 앱의 명의도용 조회에서 내 명의 가입 회선을 확인해 주세요."], "303": ["IPTV 베이직과 프리미엄은 무엇이 다른가요?", "IPTV 베이직 요금은 월 16,500원이고 프리미엄 요금은 월 22,000원입니다. IPTV 베이직과 프리미엄 두 상품 모두 셋톱박스 임대가 포함됩니다."], "920": ["영상 구독팩 요금이 이번 달 청구서에 얼마로 나왔어요?", "회원의 이번 달 청구 내역을 조회해 영상 구독팩인 Ubot 비디오패스에 실제 청구된 금액을 안내해 드립니다. Ubot 비디오패스의 월 요금은 9,900원이며 라이프 비디오 요금제에는 포함되어 있습니다."], "1119": ["Ubot 라이프 요금제는 어떤 혜택이 있나요?", "Ubot 라이프는 뮤직·비디오·커피·교통·쇼핑·보안 중 혜택 하나가 포함된 LTE 요금제입니다. 라이프 뮤직 15GB는 월 22,900원에 뮤직패스, 비디오 100GB는 월 42,900원에 비디오패스, 커피 10GB는 월 21,900원에 카페 5,000포인트, 교통 20GB는 월 25,900원에 교통지갑 5,000포인트, 쇼핑 30GB는 월 29,900원에 스토어 5,000포인트, 보안 10GB는 월 20,900원에 피싱가드를 제공합니다."], "190": ["넘버플러스는 월 얼마인가요?", "넘버플러스의 월 요금은 3,300원입니다. 넘버플러스는 앱에서 신청하면 바로 이용할 수 있습니다."], "759": ["제가 매달 내는 요금제 기본료가 얼마예요?", "회원이 매달 내는 요금제의 월정액과 선택약정 할인 적용 후 금액을 조회해 안내해 드립니다."], "1651": ["앱마켓 결제 수단에서 휴대폰 결제를 삭제하려면 어떻게 하나요?", "앱마켓 결제 수단에서 휴대폰 결제를 삭제하려면 Google Play나 App Store의 결제 수단 관리를 확인하세요. 활성 구독이나 미결제 금액이 있으면 휴대폰 결제를 삭제하기 전에 다른 유효한 결제 수단을 등록해야 할 수 있습니다."], "259": ["환불을 요청하면 언제 받나요?", "계좌 환불을 요청하면 처리 결과를 문자로 안내하고 환불 대상 금액은 등록된 환불 계좌로 7영업일 안에 돌려드립니다. 환불을 별도로 요청하지 않으면 환불 대상 금액은 다음 달 요금에서 차감될 수 있습니다."], "867": ["요청한 요금 환불이 제 계좌로 들어왔나요?", "회원의 환불 요청 내역을 조회해 처리 상태와 입금 여부를 안내해 드립니다."], "160": ["유심 크기가 여러 가지인가요?", "최근 휴대폰은 대부분 나노 유심을 사용합니다. 사용하는 휴대폰의 유심 규격이 다르다면 매장에서 맞는 유심을 확인해 주세요."], "926": ["태블릿 회선은 무슨 요금제로 돼 있어요?", "회원의 태블릿 회선을 조회해 가입된 요금제를 안내해 드립니다."], "518": ["제주도 여행 중인데 렌터카로 갈 수 있는 매장 좀 알려 주세요.", "지금 계신 제주 지역 주변에서 주차 가능한 매장을 찾아 드립니다."], "1650": ["로밍 중 현지 통신망을 수동으로 선택하려면 어떻게 하나요?", "로밍 중 현지 통신망을 수동으로 선택하려면 휴대폰의 모바일 네트워크 또는 셀룰러 설정에서 네트워크 자동 선택을 끄고 통신사가 안내하는 현지 제휴망을 선택하세요. 로밍을 마치고 귀국한 뒤에는 네트워크 자동 선택으로 되돌리는 것이 좋습니다."], "414": ["여행 중에 유심 오류가 났는데 숙소 근처에 매장이 있을까요?", "숙소 주소나 현재 위치 주변에서 유심 업무를 취급하는 매장을 찾아 드립니다."], "1293": ["일본, 중국, 동남아 같은 아시아 나라의 로밍 상품은 무엇이 있나요?", "일본, 중국, 대만, 홍콩, 베트남, 태국, 싱가포르, 필리핀에 아시아 국가별 전용 Ubot 로밍 상품이 있습니다. 아시아 국가별 로밍 상품은 데이터를 사용하는 24시간 구간마다 베이직 1GB 11,000원, 플러스 2GB 13,000원, 맥스 5GB 15,000원이 부과됩니다. 아시아 국가 로밍 상품은 방문하는 나라별로 따로 가입해야 합니다."], "416": ["퇴근하고 유심 바꾸러 갈 수 있는 매장을 찾아 주세요.", "평일 저녁까지 영업하면서 유심 교체를 취급하는 매장을 현재 위치 주변에서 찾아 드립니다."], "533": ["제주공항 근처에서 유심 문제를 봐줄 매장이 있나요?", "제주공항 주변에서 유심 업무를 취급하는 매장을 찾아 드립니다."], "1647": ["휴대폰의 비행기 모드를 켜도 와이파이를 사용할 수 있나요?", "비행기 모드를 켠 뒤에도 와이파이를 별도로 다시 켤 수 있는 휴대폰이 많습니다. 실제 기내에서 비행기 모드와 와이파이를 이용할 때는 항공사의 전자기기·와이파이 안내를 따르세요."], "451": ["새벽 6시 비행기인데 그 시간에 여는 로밍센터가 있나요?", "인천공항 로밍센터는 매일 오전 6시에 문을 엽니다. 새벽 6시 비행기 이용 전에 방문할 터미널의 로밍센터 위치를 안내해 드립니다."], "856": ["제 계정에 가족 회선이 등록돼 있는지 봐 주세요.", "회원 계정에 등록된 가족 회선 목록을 조회해 안내해 드립니다. 가족 회선은 그 회선 명의자의 동의를 받아 등록할 수 있습니다."], "428": ["집에 있던 공기계에 유심을 새로 넣으려는데 근처에 유심 받을 매장이 있나요?", "현재 위치 주변에서 공기계에 사용할 유심 업무를 취급하는 매장을 찾아 드립니다. 집에 있던 공기계가 정상 작동한다면 유심을 끼워 이용할 수 있습니다."], "1413": ["공기계에 유심을 꽂았는데 사용할 수 없다고 나와요.", "공기계에 유심을 넣었는데 사용할 수 없다면 기기가 분실·도난 신고됐거나 국내 전파 인증이 없는 해외 모델일 수 있습니다. 사용하려는 공기계는 Ubot 홈페이지의 단말기 조회에서 IMEI로 이용 가능 여부를 확인할 수 있습니다."], "327": ["중고폰 반납은 어디에서 하나요?", "중고폰은 매장에서 기기 상태를 확인한 뒤 반납할 수 있습니다. 중고폰 반납은 할부 24개월 이후에 가능합니다."], "432": ["새 폰 사면서 예전 폰도 반납하려는데 둘 다 되는 매장을 찾아요.", "현재 위치 주변에서 새 휴대폰 기기변경과 중고폰 반납을 함께 취급하는 매장을 찾아 드립니다. 쓰던 휴대폰을 반납하기 전에는 기기를 초기화하고 계정에서 로그아웃해 주세요."], "997": ["언제부터 중고폰 반납 보상을 받을 수 있어요?", "회원의 단말 할부 정보를 조회해 할부 24개월이 지나는 날짜를 안내해 드립니다."], "1014": ["휴대폰을 사고 얼마 동안 무상 수리를 받을 수 있나요?", "휴대폰 무상 수리 기간과 범위는 제조사 보증 정책을 따르며 수리는 통신사 매장이 아닌 제조사 서비스센터에서 접수합니다. 휴대폰이 고의나 부주의로 파손됐다면 무상 보증 기간에도 유상 수리일 수 있습니다."], "774": ["제 폰을 24개월 할부로 샀는지 36개월로 샀는지 알고 싶어요.", "회원의 단말 할부 정보를 조회해 휴대폰을 24개월 또는 36개월 중 어느 기간으로 구매했는지와 할부 시작일을 안내해 드립니다."], "705": ["제 워치 회선은 이번 달에 데이터 얼마나 썼나요?", "회원의 스마트워치 회선을 조회해 이번 달 데이터 사용량을 안내해 드립니다."], "1531": ["제가 지금 쓰고 있는 요금제가 뭔지 알려 주세요.", "로그인하면 회원님 회선의 현재 요금제와 월정액, 데이터·통화 기본 제공량을 조회해 안내해 드립니다."], "922": ["가족 위치 알림 요금이 매달 나가고 있나요?", "회원의 청구 내역을 조회해 가족 위치 알림 서비스 요금이 매달 청구되는지 안내해 드립니다. 가족 위치 알림 서비스의 월 요금은 1,650원입니다."], "488": ["우리 아파트 단지 근처에 매장이 있나요?", "아파트 주소를 알려 주시면 단지 주변 매장을 찾아 드립니다."], "765": ["제 명의 회선들이 각각 무슨 요금제인지 알려 주세요.", "회원 명의의 각 회선을 조회해 회선별로 현재 사용 중인 요금제를 안내해 드립니다."], "1898": ["통신 장애 뜻은 무엇인가요?", "통신망이나 관련 설비의 문제로 통화·문자·인터넷 서비스가 정상적으로 작동하지 않는 상태입니다."], "288": ["생일 쿠폰은 언제 나오나요?", "멤버십 생일 쿠폰은 생일이 속한 달의 1일에 발급됩니다. 멤버십 생일 쿠폰은 모든 등급에 연 1회 제공됩니다."], "798": ["이번 달 제 생일 쿠폰이 발급됐나요?", "회원의 멤버십 정보를 조회해 이번 달 생일 쿠폰 발급 여부를 안내해 드립니다. 멤버십 생일 쿠폰은 생일이 속한 달의 1일에 발급됩니다."], "1579": ["공지사항은 어디에서 보나요?", "Ubot 앱·홈페이지의 공지사항 메뉴에서 서비스 공지와 장애 안내를 최신순으로 볼 수 있습니다. 중요한 공지는 화면 상단 배너로도 보여 드립니다."], "1594": ["인기 질문 순위는 얼마나 자주 바뀌나요?", "인기 질문과 급상승 질문은 5분마다 최근 1시간 질문을 다시 집계해 갱신합니다."], "964": ["올해 생일 쿠폰을 이미 썼나요?", "회원의 멤버십 사용 내역을 조회해 올해 생일 쿠폰 사용 여부를 안내해 드립니다."], "1582": ["보이던 공지가 사라졌어요.", "공지마다 게시 기간이 정해져 있어 기간이 끝나면 상단 배너에서 내려갑니다. 배너에서 사라진 지난 공지는 공지사항 목록에서 확인해 주세요."], "348": ["자주 가던 매장이 없어졌어요.", "자주 가던 매장이 없어졌다면 앱 매장 찾기에서 현재 운영 중인 매장을 확인할 수 있습니다. 지금 위치 주변에서 대신 방문할 매장도 안내해 드릴 수 있습니다."], "410": ["출국 전에 유심을 바꿔야 하는데 공항 가는 길에 매장이 있을까요?", "공항으로 가는 경로 주변에서 출국 전 유심 교체를 취급하는 매장을 찾아 드립니다. 출국 전 로밍 상담이 필요하다면 인천공항 로밍센터도 매일 06:00~22:00 운영합니다."], "398": ["회사 외국인 직원 휴대폰 가입을 도와주러 갈 매장을 찾아요.", "회사 주변에서 외국인 신규 가입을 취급하는 매장을 찾아 드립니다."], "1391": ["휴대폰 일련번호(IMEI)는 어디에서 확인하나요?", "휴대폰 IMEI는 전화 앱에서 *#06#을 누르거나 설정 > 휴대폰 정보에서 확인할 수 있습니다. 휴대폰 IMEI는 제품 상자 옆면의 스티커에도 적혀 있습니다."], "1069": ["듀얼번호는 어떻게 가입하나요?", "eSIM을 지원하는 휴대폰이라면 Ubot 앱에서 Ubot 듀얼번호를 신청해 월 3,300원에 보조 번호 1개를 추가할 수 있습니다. 듀얼번호의 보조 번호로 사용한 통화·데이터는 주 회선의 제공량에서 차감됩니다."], "1670": ["스마트홈 기기가 집 와이파이에 연결되지 않아요.", "스마트홈 기기가 집 와이파이에 연결되지 않으면 기기가 지원하는 주파수와 공유기 보안 방식을 확인하세요. 일부 스마트홈 기기는 2.4GHz만 지원하므로 해당 대역에 연결해 주세요. 스마트홈 기기 설정 중에는 휴대폰도 제품 안내에 맞는 네트워크를 사용하세요."], "993": ["제 앱 계정이 지금 잠겨 있는 상태인가요?", "회원 앱 계정의 현재 잠금 상태를 조회해 안내해 드립니다. 앱 비밀번호를 5회 연속 잘못 입력하면 계정이 30분간 잠깁니다."], "837": ["앱에서 셀프 개통을 했는데 완료된 건지 모르겠어요.", "회원의 앱 셀프 개통 신청 내역을 조회해 개통 완료 여부를 안내해 드립니다."], "1028": ["앱 아이디를 잊어버렸어요. 어떻게 찾나요?", "Ubot 앱에는 가입 이메일(아이디) 찾기 기능이 없습니다. 앱 아이디를 잊었다면 고객센터(114)에서 본인 확인 후 가입한 이메일을 안내받아 주세요. 앱 비밀번호를 잊었다면 고객센터에서 본인 확인 후 초기화를 요청해 주세요."], "852": ["앱 비밀번호를 여러 번 틀려서 잠겼는데 언제 풀려요?", "회원 계정의 잠금 상태를 조회해 앱 비밀번호를 여러 번 틀려 잠긴 계정의 해제 예정 시각을 안내해 드립니다. 앱 비밀번호를 5회 연속 잘못 입력하면 계정이 30분간 잠깁니다."], "1402": ["주문한 것과 다른 휴대폰이 왔어요.", "주문한 것과 다른 휴대폰이 왔다면 포장을 뜯거나 개통하지 말고 고객센터(114)에 알려 주세요. 잘못 배송된 휴대폰은 회수한 뒤 주문한 제품으로 무료 교환해 드립니다."], "1055": ["셀프개통에 실패했다고 나와요.", "셀프개통 실패의 주된 원인은 이전 통신사 정보 불일치, 가입 3개월 이내 번호이동 제한, 명의도용 방지 서비스 가입, 신분증 확인 실패입니다. 셀프개통이 실패했다면 화면에 나온 사유를 해결한 뒤 다시 시도해 주세요. 셀프개통이 계속 실패하면 고객센터(114)에서 일반 개통으로 진행해 드립니다."], "1607": ["eSIM 설치 중 오류가 나면 무엇을 확인하고 어떻게 다시 시도하나요?", "eSIM 설치 중 오류가 나면 인터넷 연결, 기기의 eSIM 지원 여부, 발급 및 개통 상태와 오류 메시지를 확인해 주세요. eSIM 프로파일을 임의로 삭제하기 전에 발급한 통신사의 개통 채널에서 재설치 또는 재발급 가능 여부를 확인해 주세요."], "1269": ["유심 크기가 휴대폰과 맞지 않아요.", "Ubot 유심은 표준·마이크로·나노 크기로 떼어 쓸 수 있는 3in1 유심입니다. 유심 크기가 휴대폰과 맞지 않으면 필요한 크기로 눌러 떼어 쓰고 가위로 자르지 마세요."], "1056": ["셀프개통에서 인정되는 신분증은 무엇인가요?", "셀프개통에는 주민등록증, 운전면허증, 여권, 외국인등록증을 신분증으로 사용할 수 있습니다. 셀프개통 신분증은 실물을 촬영해야 하며 사본이나 화면 캡처는 인정되지 않습니다."], "1626": ["실물 멤버십 카드 없이 앱의 모바일 카드로 혜택을 받을 수 있나요?", "실물 멤버십 카드 없이 혜택을 받으려면 멤버십 앱에서 모바일 카드 또는 바코드 제공 여부를 확인해 주세요. 모바일 카드로 이용할 수 있는 혜택인지와 제시 방법은 제휴처·혜택별 이용 조건에서 확인해 주세요."], "1878": ["모바일 데이터 뜻은 무엇인가요?", "휴대폰이 와이파이 대신 이동통신망을 통해 인터넷을 사용하는 데이터 연결입니다."], "1360": ["멤버십 바코드는 어디에서 보나요?", "Ubot 앱 첫 화면의 멤버십 카드를 누르면 멤버십 바코드를 볼 수 있습니다. 멤버십 바코드를 자주 쓴다면 휴대폰 잠금 화면에 바로가기를 추가할 수 있습니다."], "1500": ["주문 내역은 어디에서 확인하나요?", "Ubot 앱·홈페이지의 주문 조회에서 휴대폰·유심 주문 상태, 배송 정보, 개통 진행 상태를 확인할 수 있습니다. 비회원으로 주문했다면 주문할 때 입력한 연락처로 인증해 주문 내역을 조회해 주세요."], "1565": ["예약 내역은 어디에서 확인하나요?", "Ubot 앱의 내 예약 목록에서 예약한 매장, 방문 일시, 방문 목적, 예약 상태를 확인할 수 있습니다. 로그인한 상태라면 챗봇에 내 매장 예약 내역을 물어봐도 됩니다."], "1692": ["기지국 뜻이 무엇인가요?", "휴대폰과 무선 신호를 주고받아 통신망으로 연결해 주는 설비입니다."], "167": ["데이터 안심을 쓰면 속도 제한 대신 아예 끊기는 건가요?", "데이터 안심 서비스를 이용하면 기본 데이터 소진 시 추가 과금을 막기 위해 데이터를 차단합니다. 기본 데이터를 다 쓴 뒤에도 제한 속도로 계속 사용하고 싶다면 데이터 안심 서비스를 신청하지 않으면 됩니다."], "1721": ["3G 뜻이 무엇인가요?", "2G 다음 세대의 이동통신으로, 음성 통화와 모바일 데이터 서비스를 제공했습니다."], "1834": ["가입자 뜻은 무엇인가요?", "통신 서비스 이용 계약을 맺은 사람이나 법인입니다."], "860": ["제 단말 기준으로 반납 보상 대상인지랑 할부 경과 기간을 알려 주세요.", "회원의 단말 할부 정보를 조회해 할부가 시작된 때부터 현재까지의 경과 기간과 중고폰 반납 보상 대상 여부를 안내해 드립니다. 중고폰 반납 보상 금액은 기기 상태에 따라 출고가의 최대 40%까지 달라집니다."], "807": ["제 멤버십 카드 번호를 알려 주세요.", "본인 확인 후 회원의 멤버십 바코드 번호를 안내해 드립니다. 멤버십 바코드는 앱의 멤버십 메뉴에서도 바로 제시할 수 있습니다."], "1165": ["회선마다 납부 방법을 다르게 할 수 있나요?", "한 명의로 여러 회선을 사용해도 회선별로 납부 방법과 납부자를 다르게 지정할 수 있습니다. 여러 회선의 요금을 하나로 합쳐 내려면 통합 청구를 신청할 수 있습니다."], "1062": ["개통 이력이나 가입일은 어디에서 확인하나요?", "Ubot 앱의 가입 정보에서 회선별 가입일, 개통 매장, 기기 변경 이력을 확인할 수 있습니다."], "1106": ["밸런스 59 데이터업 요금제는 무엇이 다른가요?", "밸런스 59 데이터업은 밸런스 59에 데이터를 더한 요금제로 13GB업(월 62,000원, 37GB), 30GB업(64,000원, 54GB), 50GB업(66,000원, 74GB), 75GB업(68,000원, 99GB)이 있습니다. 밸런스 59 데이터업 요금제는 모두 데이터를 다 쓰면 1Mbps로 계속 이용할 수 있고 테더링은 월 24GB입니다."], "1041": ["예약한 매장 방문 전에 알림을 받을 수 있나요?", "예약한 매장 방문 시간은 방문 하루 전, 6시간 전, 1시간 전에 앱 알림함으로 알려 드립니다. 매장 방문까지 남은 시간이 짧게 예약했다면 남은 시간에 해당하는 알림만 받습니다."], "1090": ["번호 변경 안내 서비스가 끝나기 전에 알림이 오나요?", "번호 변경 안내 기간이 끝나기 7일 전과 1일 전에 문자로 알려 드립니다."], "1634": ["안드로이드로 바꾼 뒤 아이메시지를 해제하려면 어떻게 하나요?", "안드로이드로 바꾼 뒤 아이메시지를 해제하려면 기존 iPhone에서 iMessage를 끄거나 Apple의 온라인 등록 취소 페이지를 이용하세요. iMessage 등록이 해제되면 해당 번호가 iMessage 대상으로 처리되는 문제를 줄일 수 있습니다."], "1401": ["배송 완료로 나오는데 휴대폰을 받지 못했어요.", "주문한 휴대폰이 배송 완료로 나오는데 받지 못했다면 경비실, 택배함, 문 앞 등 다른 장소에 보관됐는지 확인해 주세요. 배송 완료된 휴대폰을 찾을 수 없다면 고객센터(114)에 알려 주시면 택배사와 함께 확인하고 분실로 확인되면 회선을 보호 조치한 뒤 다시 보내 드립니다."], "1720": ["2G 뜻이 무엇인가요?", "디지털 방식의 2세대 이동통신입니다. 음성 통화와 문자 중심으로 쓰였습니다."], "1662": ["손님에게만 쓸 수 있는 와이파이를 따로 만들 수 있나요?", "공유기가 게스트 네트워크를 지원하면 손님용 와이파이 이름과 암호를 따로 설정할 수 있습니다. 손님용 와이파이에서 내부 기기에 접근하지 못하게 하려면 게스트 격리나 로컬 네트워크 접근 허용 항목도 확인하세요."], "1664": ["집 와이파이 신호가 방 안쪽까지 닿지 않아요.", "집 와이파이 신호가 방 안쪽까지 닿지 않으면 공유기를 막힌 장식장이나 구석에서 개방된 위치로 옮겨 보세요. 벽과 거리 때문에 집 와이파이 신호가 약하면 메시 와이파이·추가 AP 등 지원되는 확장 방법을 검토할 수 있습니다."], "1581": ["장애 안내가 다른 지역 사람에게는 안 보인다고 해요.", "통신 장애 안내는 장애가 난 시·도를 대상으로 올리는 경우가 있어 해당 지역에서 볼 때만 표시될 수 있습니다. 전국 통신 장애나 서비스 공지는 모든 지역에 보입니다."], "1584": ["비회원으로 하던 대화를 로그인하면 이어서 볼 수 있나요?", "비회원으로 질문하다가 같은 화면에서 로그인하면 그 챗봇 대화가 회원 계정으로 옮겨져 대화 기록에 남습니다. 로그인하기 전에 창을 닫아 비회원 세션이 끝나면 이전 대화를 이어 볼 수 없습니다."], "572": ["강변역 근처에 새로 나온 폰 볼 수 있는 매장 있어요?", "강변역 주변에서 새 휴대폰 단말을 직접 볼 수 있는 판매 매장을 찾아 드립니다. 새 휴대폰은 앱 온라인 샵에서도 무료 배송으로 구매할 수 있습니다."], "1672": ["와이파이 비밀번호를 QR코드로 공유할 수 있나요?", "지원되는 휴대폰은 연결된 와이파이의 공유 메뉴에서 접속용 QR코드를 표시할 수 있습니다. 와이파이 QR코드를 스캔하면 접속 정보가 전달되므로 신뢰하는 사람에게만 공유하세요."], "1806": ["SSID 뜻이 무엇인가요?", "와이파이 네트워크를 구별하기 위해 표시하는 이름입니다."], "104": ["내 사용 패턴에 맞는 요금제를 추천받을 수 있나요?", "사용 패턴에 맞는 요금제를 추천받으려면 앱에서 최근 사용량을 확인한 뒤 AI 챗봇에 문의할 수 있습니다."], "737": ["연말정산에 쓰게 작년 한 해 통신비 합계를 알려 주세요.", "회원의 납부 내역을 조회해 연말정산에 필요한 작년 한 해 통신비 납부 합계를 안내해 드립니다. 통신비 납부 확인서는 최근 5년 치까지 발급받을 수 있습니다."], "722": ["3월에 제 휴대폰 요금이 얼마였어요?", "회원의 휴대폰 요금 청구 내역을 조회해 3월에 청구된 금액을 안내해 드립니다."], "916": ["올해 상반기에 낸 휴대폰 요금이 다 합쳐서 얼마예요?", "회원의 납부 내역을 조회해 올해 1월부터 6월까지 납부한 금액 합계를 안내해 드립니다."], "983": ["이 번호 개통한 날짜 알려 주세요.", "회원의 가입 정보를 조회해 개통일을 안내해 드립니다."], "704": ["제 태블릿 회선 데이터가 얼마나 남았어요?", "회원의 태블릿 데이터 전용 회선을 조회해 이번 달 남은 데이터 용량을 안내해 드립니다. 태블릿 데이터 전용 요금제는 월 20GB를 제공합니다."], "909": ["제 태블릿 회선 요금은 이번 달 얼마예요?", "회원의 태블릿 회선 청구 내역을 조회해 이번 달 요금을 안내해 드립니다."], "751": ["이번 달 요금에서 제일 많이 나온 항목이 뭐예요?", "회원의 이번 달 청구 내역을 조회해 휴대폰 요금에서 금액이 가장 큰 항목부터 안내해 드립니다."], "1839": ["청구 금액 뜻은 무엇인가요?", "청구서에 적힌 이번 납부 대상 금액입니다. 월정액 외 사용 요금이나 할인 등이 반영될 수 있습니다."], "791": ["이번 달에 포인트가 얼마나 쌓였어요?", "회원의 멤버십 포인트 적립 내역을 조회해 이번 달 쌓인 포인트를 안내해 드립니다. Ubot 포인트는 매월 납부한 요금제 월정액의 1%가 적립됩니다."], "802": ["제 명의 회선마다 포인트가 각각 얼마씩 있어요?", "회원 명의의 각 회선에 쌓인 멤버십 포인트를 회선별로 조회해 안내해 드립니다. 본인 명의의 회선끼리는 멤버십 포인트를 옮길 수 있습니다."], "685": ["곧 없어지는 제 포인트가 있나요?", "회원의 포인트 적립 내역을 조회해 유효기간이 곧 끝나는 포인트를 안내해 드립니다."], "345": ["근처에 매장이 여러 곳이면 어디로 가는 게 좋나요?", "가까운 매장 중 어디를 방문할지 고를 때는 취급 업무와 주차 가능 여부를 확인해 필요한 업무가 되는 곳을 선택해 주세요. 현재 위치 주변의 여러 매장을 함께 안내해 드릴 수 있습니다."], "378": ["이사 온 지 얼마 안 돼서 동네를 잘 모르는데 차 대기 편한 매장이 있을까요?", "이사 온 동네의 새 주소 주변에서 주차 가능한 매장을 찾아 드립니다. 주차 가능한 매장의 운영시간과 취급 업무도 함께 안내합니다."], "454": ["내일 출국인데 오늘 저녁에 로밍 상담받을 수 있는 매장 있어요?", "현재 위치 주변에서 출국 전인 오늘 저녁까지 영업하는 로밍 상담 매장을 찾아 드립니다. 출국 전 로밍 패스는 앱에서도 가입할 수 있습니다."], "752": ["다음 달에는 요금이 얼마 정도 나올까요?", "회원이 사용하는 요금제와 할인, 단말 할부 정보를 조회해 다음 달 예상 요금을 안내해 드립니다."], "836": ["온라인으로 주문한 폰이 지금 어디쯤 오고 있어요?", "회원의 온라인 휴대폰 주문 내역을 조회해 현재 배송 상태를 안내해 드립니다. 온라인으로 주문한 휴대폰의 택배 배송은 보통 1~2일 걸립니다."], "1574": ["예약 확정 알림이 오지 않았어요.", "매장 예약 확정 알림이 오지 않았다면 먼저 Ubot 앱 알림함과 내 예약 목록에서 예약 상태를 확인해 주세요. 내 예약 목록에 예약됨으로 보이면 매장 예약은 정상 완료된 것입니다. 내 예약 목록에 없다면 예약이 끝나지 않았으니 다시 시도해 주세요."], "1225": ["휴대폰에 '서비스 지역이 아닙니다'라고 나와요.", "휴대폰에 '서비스 지역이 아닙니다'라고 표시되는 것은 신호가 닿지 않거나 유심이 인식되지 않기 때문일 수 있습니다. '서비스 지역이 아닙니다'라는 표시가 나오면 다른 장소로 이동해 휴대폰을 재부팅하고 계속되면 유심을 다시 끼우거나 매장에서 점검받아 주세요."], "1482": ["광고 문자 수신 동의를 바꾸고 싶어요.", "광고 문자 수신 동의는 Ubot 앱의 설정 > 알림 및 마케팅 수신 동의에서 바꿀 수 있습니다. 문자·앱 알림·이메일 광고 수신 여부는 각각 바꿀 수 있습니다. 요금·서비스 안내처럼 꼭 필요한 문자는 광고 수신 동의와 관계없이 발송됩니다."], "853": ["제가 마케팅 문자 수신에 동의해 놨나요?", "회원의 수신 동의 설정을 조회해 마케팅 문자 수신에 동의했는지 안내해 드립니다. 마케팅 문자 수신 동의 여부는 앱에서 언제든 변경할 수 있습니다."], "924": ["지금 제 요금제 이름 알려 주세요.", "회원의 회선 정보를 조회해 가입된 요금제 이름을 안내해 드립니다."], "1524": ["이 매장에 오늘 예약 가능한 시간이 있나요?", "매장을 알려 주시면 오늘부터 14일 안에 예약할 수 있는 1시간 단위 방문 시간대를 보여 드립니다. 매장 방문 예약에서는 일요일과 이미 예약된 시간대가 제외됩니다."], "1563": ["오늘 바로 매장 예약도 되나요?", "오늘이라도 지금 이후의 비어 있는 시간대라면 매장 방문을 예약할 수 있습니다. 일요일에는 매장 방문을 예약할 수 없습니다."], "466": ["오늘 오후에 바로 예약 잡을 수 있는 매장이 근처에 있나요?", "현재 위치 주변에서 오늘 오후에 방문 예약이 가능한 매장을 찾아 드립니다. 매장 방문 예약은 앱에서 매장과 시간을 선택해 진행합니다."], "504": ["가려는 매장이 오늘 쉬는 날인지 확인해 주세요.", "방문하려는 매장의 오늘 운영 여부를 확인해 드립니다. 해당 매장이 오늘 휴무라면 가까운 다른 매장도 안내해 드립니다."], "367": ["가까운 매장이 오늘 임시로 문 닫았는지 알 수 있나요?", "가까운 매장이 오늘 임시 휴무인지 현재 위치 주변 매장의 운영 여부를 확인해 드립니다. 가까운 매장이 휴무라면 대신 방문할 다른 가까운 매장도 안내해 드립니다."], "352": ["오늘 공휴일인데 열려 있는 매장을 찾아 주세요.", "공휴일은 매장 휴무가 기본이므로 현재 위치 주변 매장 중 오늘 영업하는 곳이 있는지 확인해 드립니다."], "355": ["점심시간에 회사 근처에서 잠깐 들를 매장이 있나요?", "회사 주소나 현재 위치를 기준으로 점심시간에 영업 중인 매장을 찾아 드립니다."], "521": ["광화문 근처 매장에 점심시간으로 방문 예약하고 싶어요.", "광화문 주변에서 점심시간에 예약 가능한 매장을 찾아 드립니다."], "385": ["회사 점심시간에 명의 변경하러 갈 수 있는 매장이 근처에 있을까요?", "회사 주소 주변에서 점심시간에 명의 변경을 취급하는 매장을 찾아 드립니다. 점심시간에 명의 변경을 처리하려면 서류를 미리 갖춰 가는 것이 좋습니다."], "337": ["퇴근하고 저녁에 갈 수 있는 매장을 찾고 싶어요.", "매장의 평일 운영시간은 10:00~20:00이므로 퇴근 후 방문할 수 있습니다. 저녁에 방문할 매장은 현재 위치에서 영업 중인 가까운 곳으로 안내해 드릴 수 있습니다."], "364": ["평일 오후 2시쯤 30분 정도 들를 수 있는 매장을 찾고 있어요.", "현재 위치 주변에서 평일 오후 2시쯤 영업하는 매장을 찾아 드립니다. 평일 오후에 30분 정도 매장을 방문한다면 앱으로 예약해 우선 상담을 받을 수 있습니다."], "375": ["평일 저녁에 차 몰고 갈 수 있는 매장을 찾아 주세요.", "평일 20:00까지 운영하면서 주차가 가능한 매장을 현재 위치 주변에서 찾아 드립니다."], "360": ["이 근처에서 평일에 제일 늦게까지 하는 매장이 어디예요?", "현재 위치 주변 매장의 평일 운영시간을 비교해 가장 늦게까지 영업하는 곳을 안내해 드립니다."], "394": ["방학이라 평일 낮에 아이랑 갈 매장을 찾고 있어요.", "현재 위치 주변에서 평일에 영업하며 미성년자 업무를 취급하는 매장을 찾아 드립니다."], "499": ["근처 매장을 가까운 순서대로 정렬해서 보여 주세요.", "현재 위치에서 가까운 순서대로 주변 매장 목록을 안내해 드립니다."], "478": ["반경 1km 안에 있는 매장만 보고 싶어요.", "현재 위치에서 반경 1km 안에 있는 매장만 골라 안내해 드립니다."], "182": ["전화가 안 될 때 어떤 순서로 확인하나요?", "전화가 안 될 때는 수신 차단과 착신 전환 설정을 먼저 확인하고 휴대폰을 재부팅한 뒤 다른 장소에서도 같은지 확인해 주세요."], "1595": ["급상승 질문이 비어 있어요.", "급상승 질문은 최근 질문 수가 일정 수 이상이고 평소보다 크게 늘었을 때만 표시됩니다. 질문이 적은 시간대나 지역에서는 급상승 질문 목록이 비어 있을 수 있습니다."], "1522": ["매장까지 걸어서 얼마나 걸리나요?", "도보 길찾기를 선택하면 현재 위치에서 매장까지의 거리와 예상 소요 시간을 안내해 드립니다."], "1788": ["왕복 시간(RTT) 뜻이 무엇인가요?", "네트워크에서 신호를 보내 상대의 응답을 받기까지 걸리는 시간입니다."], "709": ["이번 달 제가 통화한 시간이 총 얼마예요?", "회원의 이번 달 통화 사용 내역을 조회해 지금까지 통화한 시간을 안내해 드립니다."], "1754": ["SMS 뜻이 무엇인가요?", "Short Message Service의 약자로, 짧은 문자 메시지를 전송하는 서비스입니다."], "1571": ["어떤 알림을 받을 수 있나요?", "Ubot 앱 알림함에서 매장 예약 확정·취소 알림과 방문 하루 전·6시간 전·1시간 전 리마인더를 받을 수 있습니다. Ubot 앱 알림함에서 요금 납부 기한 3일 전 알림과 연체 알림도 받을 수 있습니다."], "1759": ["국제전화 뜻이 무엇인가요?", "국가 간 전화망을 거쳐 다른 나라의 번호와 연결하는 통화입니다."], "1487": ["매장에 갈 때 무엇을 챙겨야 하나요?", "명의자 본인이 Ubot 매장에 갈 때는 신분증만 있으면 됩니다. 가족이나 대리인이 Ubot 매장에 갈 때는 명의자 신분증, 대리인 신분증, 위임장, 발급 3개월 이내 명의자 인감증명서가 필요합니다."], "244": ["매장에 갈 때 무엇을 가져가야 하나요?", "매장을 방문할 때는 주민등록증, 운전면허증, 여권 중 하나를 지참해 주세요. 매장에서 처리할 업무에 따라 추가 서류가 필요할 수 있습니다."], "1367": ["친구를 추천하면 혜택이 있나요?", "Ubot 앱의 친구 추천 링크로 가입한 친구가 3개월 이상 이용하면 추천한 사람과 친구 모두에게 5,000포인트를 드립니다."], "473": ["기차역에 내려서 바로 갈 수 있는 매장 있나요?", "도착하는 기차역 주변에서 바로 방문할 매장을 찾아 드립니다. 기차역 주변 매장의 운영시간과 주차 가능 여부도 함께 안내합니다."], "469": ["여행 와서 숙소 근처 매장을 찾고 있어요.", "숙소 주소나 현재 위치를 알려 주시면 여행 중 방문할 주변 매장을 찾아 드립니다. 숙소 주변 매장의 운영시간과 취급 업무도 함께 안내합니다."], "365": ["오늘 저녁 6시 반에 갈 건데 그때 열려 있는 매장이 있을까요?", "오늘 저녁 시간에 영업하는 매장을 현재 위치 주변에서 찾아 드립니다."], "1817": ["스트리밍 뜻이 무엇인가요?", "콘텐츠 전체를 내려받을 때까지 기다리지 않고, 데이터를 받으면서 재생하는 방식입니다."], "1860": ["이용 정지 뜻은 무엇인가요?", "통신 회선의 통화나 데이터 이용이 제한된 상태입니다. 신청·분실·미납 등 사유에 따라 범위가 다를 수 있습니다."], "1879": ["데이터 사용량 뜻은 무엇인가요?", "정해진 기간 동안 모바일 데이터로 주고받은 데이터의 양입니다."], "1703": ["스펙트럼 뜻이 무엇인가요?", "무선 통신에 사용할 수 있는 전파 주파수의 범위입니다."], "1903": ["비트 뜻은 무엇인가요?", "디지털 데이터의 가장 작은 단위로, 0 또는 1 한 자리를 나타냅니다."], "1697": ["로밍 뜻이 무엇인가요?", "가입한 통신사 이외의 통신망을 이용해 통화나 데이터를 쓰는 것입니다. 해외 로밍은 방문 국가의 제휴 망을 이용합니다."], "879": ["지난주에 데이터 얼마나 썼어요?", "회원의 일별 사용 내역을 조회해 지난주 데이터 사용량을 안내해 드립니다."], "854": ["지난주에 요청한 개인정보 열람 결과가 나왔나요?", "회원의 지난주 개인정보 열람 요청 내역을 조회해 처리 상태를 안내해 드립니다. 개인정보 열람 결과는 요청 후 10일 이내에 안내됩니다."], "800": ["오늘 이미 멤버십을 한 번 썼는지 확인해 주세요.", "회원의 오늘 멤버십 사용 내역을 조회해 이미 사용했는지 안내해 드립니다. 멤버십 혜택은 하루에 한 번 사용할 수 있습니다."], "1593": ["지역별 급상승 질문은 어떻게 정해지나요?", "지역별 급상승 질문은 접속 지역을 시·도 단위로 나눠 17개 시·도마다 따로 집계합니다. 지역별 급상승 질문에서 우리 지역에서 갑자기 많이 묻는 내용을 볼 수 있습니다."], "492": ["시골이라 근처에 매장이 없는 것 같은데 그래도 제일 가까운 곳이 어디예요?", "현재 위치에서 가장 가까운 매장을 거리와 함께 안내해 드립니다. 가까운 매장이 멀다면 필요한 업무를 앱에서도 처리할 수 있는지 확인해 보세요."], "1592": ["급상승 질문은 무엇인가요?", "급상승 질문은 최근 1시간 동안 질문 수가 지난 7일 평소보다 크게 늘어난 질문입니다. 급상승 질문에서는 장애나 새 요금제 출시처럼 갑자기 관심이 몰린 주제를 확인할 수 있습니다."], "700": ["이번 달 핫스팟으로 쓴 데이터가 얼마인지 궁금해요.", "회원의 이번 달 데이터 사용량을 조회해 핫스팟 등 테더링으로 사용한 데이터 용량을 안내해 드립니다."], "1241": ["음성사서함을 쓸 수 있나요?", "전화를 받지 못하면 음성사서함으로 연결되어 상대방이 메시지를 남길 수 있으며 남겨진 메시지는 *88로 전화해 들을 수 있습니다. 음성사서함 메시지는 7일 동안 보관됩니다."], "1838": ["청구서 뜻은 무엇인가요?", "일정 기간의 통신요금과 할인·납부 정보를 정리해 알려 주는 문서입니다."], "90": ["음성사서함을 이용할 수 있나요?", "음성사서함 서비스를 신청하면 전화를 받지 못했을 때 음성 메시지를 받을 수 있습니다."], "1831": ["개통 뜻은 무엇인가요?", "신청한 회선이 통신망에 등록되어 통화나 데이터를 사용할 수 있게 되는 과정입니다."], "1832": ["개통일 뜻은 무엇인가요?", "휴대폰 회선이 실제로 개통되어 서비스를 이용하기 시작한 날짜입니다."], "1867": ["통화료 뜻은 무엇인가요?", "음성 통화를 이용한 대가로 부과되는 요금입니다. 요금제의 기본 제공 통화가 적용될 수 있습니다."], "1850": ["약정 뜻은 무엇인가요?", "통신 서비스나 할인 혜택을 일정 기간 이용하기로 정한 계약 조건입니다."], "1864": ["수신 뜻은 무엇인가요?", "상대방이 보낸 전화나 문자를 내 휴대폰으로 받는 것입니다."], "1848": ["부가가치세 뜻은 무엇인가요?", "상품이나 서비스에 부과되는 세금으로, 통신요금 청구서에도 표시될 수 있습니다."], "1892": ["무선 인터넷 뜻은 무엇인가요?", "케이블을 직접 꽂지 않고 와이파이나 이동통신망을 통해 인터넷에 연결하는 방식입니다."], "500": ["지금 위치에서 그 매장까지 얼마나 떨어져 있어요?", "현재 위치에서 선택하신 매장까지의 거리와 위치를 지도로 안내해 드립니다."], "1558": ["내 주변 몇 km까지 매장을 찾아 주나요?", "현재 위치를 기준으로 매장 검색 반경을 0.1km부터 100km까지 정할 수 있습니다. 검색된 Ubot 매장은 가까운 순서로 보여 드립니다."], "377": ["명의 변경하러 차 타고 갈 건데 주차되는 매장 중 가까운 곳은요?", "명의 변경을 취급하고 주차가 가능한 매장을 현재 위치 주변에서 찾아 드립니다. 명의 변경을 위해 매장에 갈 때는 양도인·양수인 신분증과 명의 변경 동의서를 준비해 주세요."], "419": ["기기변경하러 갈 매장을 회사 근처에서 찾고 있어요.", "회사 주소를 알려 주시면 주변에서 기기변경을 취급하는 매장을 찾아 드립니다."], "1625": ["통신사 매장에 가기 전에 필요한 신분 확인 서류는 어디서 확인하나요?", "통신사 매장에 가기 전에 처리하려는 업무와 방문자 유형에 따라 필요한 서류를 확인해 주세요. 공식 고객센터나 방문할 매장에 업무 내용과 본인·대리인 방문 여부를 알려 필요한 신분 확인 자료와 추가 서류를 미리 확인해 주세요."], "392": ["주말에 아이랑 같이 갈 수 있는 매장을 찾고 있어요.", "현재 위치 주변에서 주말인 토요일에 영업하는 매장을 찾아 드립니다. 토요일에 미성년 자녀의 업무로 매장을 방문한다면 법정대리인 신분증과 가족관계증명서를 챙겨 주세요."], "77": ["주말에도 운영하는 매장이 있나요?", "일부 매장은 주말에도 운영하며, 주말 영업시간은 매장별로 확인해야 합니다."], "463": ["토요일 오전에 예약하고 갈 매장을 찾고 있어요.", "토요일 오전에 예약할 수 있는 매장을 현재 위치 주변에서 찾아 드립니다."], "351": ["지금 있는 곳 근처에서 일요일에 영업하는 매장을 찾아 주세요.", "일요일은 매장 휴무가 기본이므로 현재 위치 주변에서 일요일에 영업하는 매장이 있는지 매장별로 확인해 드립니다."], "558": ["상수역 근처에 토요일에 문 여는 매장 있어요?", "상수역 주변에서 토요일에 영업하는 매장을 찾아 드립니다. 토요일 매장은 보통 17:00에 마감합니다."], "350": ["이번 토요일에 문 여는 매장을 근처에서 찾아 주세요.", "현재 위치 주변에서 이번 토요일에 영업하는 매장을 찾아 드릴 수 있습니다. 토요일 매장은 보통 10:00~17:00에 운영합니다."], "644": ["가평 놀러 왔는데 일요일에 여는 매장이 근처에 있나요?", "가평 주변 매장이 일요일에 영업하는지 확인해 드립니다. 일요일에는 휴무인 매장이 많습니다."], "371": ["토요일에 차로 갈 건데 주차되는 매장을 찾아 주세요.", "토요일에 영업하면서 주차가 가능한 매장을 현재 위치 주변에서 찾아 드립니다."], "1510": ["다른 사람들이 많이 묻는 질문을 볼 수 있나요?", "챗봇 화면의 인기 질문에서 최근 1시간 동안 많이 물어본 질문 5개를 볼 수 있습니다. 챗봇 인기 질문을 누르면 바로 답변을 확인할 수 있습니다."], "512": ["이 근처에서 웬만한 업무는 다 되는 매장이 어디예요?", "현재 위치 주변 매장의 취급 업무를 비교해 가장 많은 업무를 처리하는 곳을 안내해 드립니다."], "1589": ["질문은 얼마나 길게 쓸 수 있나요?", "챗봇 질문 하나에 4,000자까지 쓸 수 있습니다. 챗봇에 여러 내용을 물을 때는 질문을 나눠서 보내면 더 정확한 답변을 받을 수 있습니다."], "1624": ["장애가 있는 고객을 위한 매장 상담 지원은 어떻게 확인하나요?", "장애가 있는 고객을 위한 매장 상담 지원이 필요하다면 방문할 매장이나 고객센터에 필요한 상담 방식을 미리 알려 주세요. 해당 매장의 접근 시설, 의사소통 지원, 예약 가능 여부를 확인한 뒤 방문해 주세요. 장애 고객 상담 지원 범위는 매장마다 확인이 필요합니다."], "264": ["한국어가 서툰데 상담을 받을 수 있나요?", "한국어가 서툴러 상담이 필요하다면 가까운 매장을 방문해 도움을 받을 수 있습니다. 외국인 신규 가입은 여권과 외국인등록증을 지참해 매장에서 처리합니다."], "339": ["강남역 근처 매장을 알려 주세요.", "강남역 주변 매장을 찾아 드릴 수 있습니다. 강남역 주변 매장의 주소와 운영시간, 취급 업무도 함께 확인해 드립니다."], "655": ["센텀시티 근처에 폰 사러 갈 매장 있나요?", "센텀시티 주변에서 새 휴대폰 단말을 판매하는 매장을 찾아 드립니다. 새 휴대폰은 앱 온라인 샵에서도 무료 배송으로 구매할 수 있습니다."], "536": ["교대역 근처에서 위임장 들고 대신 처리하러 갈 매장을 찾아요.", "교대역 주변에서 위임장을 가지고 대리인 업무를 처리할 수 있는 매장을 찾아 드립니다. 대리인 업무를 위해서는 위임장 외에 명의자 신분증과 인감증명서도 준비해 주세요."], "1113": ["북패스 요금제는 어떤 요금제인가요?", "북패스 요금제에는 Ubot 북패스 전자책 이용권 1개가 포함되며 7GB+(월 16,300원), 10GB+(19,000원), 15GB+(21,500원), 100GB+(38,300원)가 있습니다. 북패스의 기본 데이터를 다 쓰면 7GB+~15GB+는 1Mbps, 100GB+는 5Mbps로 계속 이용할 수 있습니다."], "1335": ["음악이나 영상 콘텐츠 부가서비스가 있나요?", "음악·영상 콘텐츠 부가서비스로 Ubot 뮤직패스(월 6,900원), 비디오패스(월 9,900원), 북패스(월 4,900원)가 있습니다. 뮤직패스·비디오패스·북패스의 콘텐츠를 이용할 때 쓰는 데이터는 가입한 요금제에서 차감됩니다."], "1345": ["북패스는 어떤 서비스인가요?", "Ubot 북패스(월 4,900원)는 Ubot 전자책 라이브러리를 이용하는 부가서비스입니다. 북패스 요금제에는 북패스 이용권이 포함되어 있어 따로 가입하지 않아도 됩니다."], "470": ["출장 간 도시에서 들를 수 있는 매장을 알려 주세요.", "출장지 주소나 현재 위치 주변 매장을 찾아 드립니다."], "357": ["내일 오전에 갈 매장을 미리 찾아 두고 싶어요.", "내일 운영시간을 기준으로 현재 위치 주변에서 오전에 방문할 수 있는 매장을 찾아 드립니다."], "1636": ["문자를 원하는 시간에 예약해서 보낼 수 있나요?", "예약 전송을 지원하는 문자 앱에서 문자 발송 시각을 지정할 수 있습니다. Google 메시지에서는 내용을 입력한 뒤 보내기 버튼을 길게 눌러 예약 날짜와 시간을 선택합니다. 문자 예약 발송 시각은 기기와 연결 상태에 따라 달라질 수 있습니다."], "718": ["착신 전환된 통화 때문에 이번 달 요금이 얼마나 나왔어요?", "회원의 이번 달 통화 내역을 조회해 착신 전환으로 발생한 통화료를 안내해 드립니다. 착신 전환으로 연결된 통화의 요금은 착신 전환을 신청한 사람이 부담합니다."], "343": ["매장까지 가는 길을 알고 싶어요.", "매장까지 가는 길은 Ubot 앱의 매장 상세에서 길찾기를 누른 뒤 도보·자동차·대중교통 중 이동 방법을 선택해 확인할 수 있습니다. 현재 위치에서 선택한 매장까지의 경로와 예상 소요 시간이 표시됩니다."], "477": ["여기서 걸어서 갈 수 있는 거리에 매장이 있나요?", "현재 위치에서 도보로 갈 수 있는 거리의 매장을 찾아 드립니다."], "152": ["신규 가입할 때 가입비가 있나요?", "휴대폰 신규 가입에는 가입비가 없습니다."], "117": ["월 중간에 가입하면 첫 달 요금은 어떻게 나오나요?", "월 중간에 가입하면 첫 달 요금은 개통일부터 말일까지의 일수만큼 계산되어 청구됩니다."], "1598": ["로그아웃은 어떻게 하나요?", "Ubot 앱·홈페이지의 내 정보 화면에서 로그아웃을 누르면 됩니다. 공용 기기에서 Ubot 계정을 쓴 뒤에는 꼭 로그아웃해 주세요."], "701": ["제가 데이터 안심 서비스에 가입돼 있나요?", "회원의 부가서비스 정보를 조회해 데이터 안심 서비스 가입 여부를 안내해 드립니다. 데이터 안심 서비스는 무료입니다."], "1485": ["상담원과 바로 통화하려면 어떻게 하나요?", "Ubot 휴대폰에서 114로 전화한 뒤 안내에 따라 상담원 연결을 선택하면 됩니다. 상담원 대기가 길면 Ubot 앱의 채팅 상담이나 상담 예약을 이용해 주세요."], "1507": ["챗봇 답변이 질문 의도와 다를 때는 어떻게 하나요?", "로그인한 상태라면 질문 의도와 다른 챗봇 답변 아래에서 일반 문의, 매장 찾기, 내 정보 확인 중 원하는 의도를 골라 같은 질문을 다시 검색할 수 있습니다. 같은 챗봇 질문을 같은 의도로 다시 검색하는 것은 한 번만 가능합니다."], "1587": ["챗봇이 상담 범위 밖이라며 답하지 않아요.", "Ubot 챗봇은 Ubot 통신 서비스 관련 질문에 답합니다. 통신 서비스와 관계없는 질문이나 개인적인 판단이 필요한 질문에는 챗봇이 답하지 않으니 Ubot 이용과 관련해 다시 질문해 주세요."], "1343": ["뮤직패스는 어떤 서비스인가요?", "Ubot 뮤직패스(월 6,900원)는 Ubot 음악 스트리밍을 이용하는 부가서비스입니다. 뮤직패스로 음악을 들을 때 쓰는 데이터는 가입한 요금제에서 차감됩니다. 라이프 뮤직 요금제에는 뮤직패스가 이미 포함되어 있습니다."], "362": ["근처 매장들 오늘 몇 시까지 하는지 한 번에 보여 주세요.", "현재 위치 주변 매장의 오늘 운영시간을 함께 정리해 안내해 드립니다."], "1541": ["이번 달 통화를 몇 분 썼나요?", "로그인하면 회원님 회선의 이번 달 음성통화 사용 시간과 문자 발송 건수, 기본 제공량을 조회해 안내해 드립니다."], "1400": ["주문한 사람과 휴대폰 명의자가 달라도 되나요?", "휴대폰을 온라인으로 주문할 때는 명의자 본인인증이 필요하므로 회선 명의자가 직접 주문해야 합니다. 가족 명의의 휴대폰을 주문하려면 그 명의자의 본인인증을 받아 진행해 주세요."], "1009": ["통신사 직영점과 일반 대리점은 어떻게 다른가요?", "통신사 직영점은 통신사가 직접 운영하고 일반 대리점은 계약한 사업자가 운영합니다. 직영점과 대리점의 처리 가능 업무와 판매 조건은 매장별로 다를 수 있으므로 방문 전에 원하는 업무를 알려 확인해 주세요."], "507": ["처음 알려 준 매장 말고 다른 가까운 곳도 알려 주세요.", "앞서 안내한 매장을 제외하고 현재 위치에서 가까운 다른 매장을 찾아 드립니다."], "481": ["전통시장 근처에 매장이 있나요?", "말씀하신 시장 주변 매장을 찾아 드립니다."], "1514": ["지금 문을 연 매장이 있나요?", "주변 Ubot 매장의 영업시간을 확인해 지금 운영 중인 매장을 알려 드립니다. 지금 문을 연 매장을 찾으려면 위치나 지역을 알려 주세요."], "462": ["방문 예약이 되는 가까운 매장을 찾아 주세요.", "현재 위치 주변에서 앱으로 방문 예약을 할 수 있는 매장을 찾아 드립니다. 매장 방문을 예약한 고객은 우선 상담을 받을 수 있습니다."], "1362": ["VIP 혜택은 무엇인가요?", "VIP 멤버십은 제휴처 할인 한도가 늘고 매월 영화 예매 1회와 카페 음료 1회 같은 전용 혜택을 받을 수 있습니다. VIP 혜택의 제휴처와 이용 횟수는 앱의 멤버십 혜택 메뉴에서 확인할 수 있습니다."], "795": ["VIP 영화 혜택이 올해 몇 번 남았어요?", "회원의 VIP 멤버십 정보를 조회해 올해 남은 영화 혜택 횟수를 안내해 드립니다."], "253": ["공휴일인데 급하게 처리할 일이 있어요.", "공휴일에도 분실 신고는 24시간 365일 접수되고 앱의 AI 챗봇도 24시간 이용할 수 있습니다. 공휴일에 서류가 필요한 업무는 매장 운영일에 방문해 주세요."], "1246": ["협박이나 욕설 문자를 받았는데 보낸 사람을 알 수 있나요?", "번호를 숨기고 보낸 협박·욕설 문자의 발신자 정보는 통신사가 개인에게 알려 줄 수 없습니다. 협박·욕설 문자를 경찰에 신고하면 수사기관이 법적 절차에 따라 발신자를 확인할 수 있으니 문자를 지우지 말고 보관해 주세요."], "1504": ["앱 알림은 어디에서 확인하나요?", "Ubot 앱의 알림함에서 앱 알림을 확인할 수 있습니다. 앱 알림함에는 읽지 않은 알림 개수가 표시됩니다. 알림을 누르면 읽음으로 바뀌고 모두 읽음으로 한 번에 정리할 수도 있습니다."], "1633": ["문자 채팅 서비스인 RCS를 끄려면 어떻게 하나요?", "Google 메시지의 RCS 채팅은 메시지 설정의 RCS 채팅에서 끌 수 있습니다. 다른 문자 앱에서는 채팅플러스 등 해당 RCS 기능의 설정을 확인하세요. 이전 기기를 사용할 수 없다면 RCS 서비스 제공자의 등록 해제 방법을 이용하세요."], "1880": ["남은 데이터 뜻은 무엇인가요?", "요금제의 기본 제공량 등에서 아직 사용할 수 있는 모바일 데이터의 양입니다."], "361": ["가까운 매장 중에 오늘 쉬는 곳은 빼고 알려 주세요.", "오늘 휴무인 매장을 제외하고 현재 위치 주변에서 영업하는 매장만 안내해 드립니다."], "1499": ["이 챗봇에서는 무엇을 물어볼 수 있나요?", "Ubot 챗봇에는 요금제, 요금·청구, 데이터, 유심·eSIM, 로밍, 가입·해지 같은 Ubot 이용 방법을 물어볼 수 있습니다. 챗봇에 지역을 말하면 가까운 매장을 찾아 드립니다. 챗봇에 로그인하면 내 정보에 관한 질문도 할 수 있습니다."], "1568": ["챗봇에서 바로 매장 예약을 할 수 있나요?", "챗봇에서는 Ubot 매장을 찾아 드리고 내 예약 내역을 안내해 드립니다. 매장 방문 예약 자체는 Ubot 앱의 매장 화면에서 해야 합니다."], "1641": ["모바일 데이터의 저데이터 모드는 어디서 켜나요?", "iPhone에서는 셀룰러 데이터 옵션의 저데이터 모드를, Android에서는 데이터 절약 모드 등 지원되는 설정을 확인하세요. 저데이터 모드를 켜면 백그라운드 통신 등이 제한되어 일부 앱의 동기화나 알림이 늦어질 수 있습니다."], "1238": ["착신전환을 신청했는데 전화가 넘어가지 않아요.", "착신전환 부가서비스에 가입한 뒤 휴대폰에서 전환할 번호를 따로 설정해야 전화가 넘어갑니다. 착신전환이 작동하지 않으면 전화 앱 설정에서 전환 번호를 입력했는지 확인해 주세요. 착신전환을 설정한 뒤 휴대폰을 바꿨다면 새 기기에서 다시 설정해 주세요."], "1671": ["공유기 관리자 비밀번호를 잊어버렸어요.", "공유기 관리자 로그인 암호는 와이파이 접속 암호와 다를 수 있습니다. 관리자 비밀번호를 잊었다면 공유기 제조사의 계정 복구 방법을 먼저 확인하세요. 관리자 비밀번호를 복구할 수 없어 공장 초기화가 필요하다면 기존 설정과 임대 장비 여부를 확인한 뒤 진행하세요."], "1894": ["와이파이 비밀번호 뜻은 무엇인가요?", "허용된 기기만 와이파이 네트워크에 접속하도록 설정하는 암호입니다."], "717": ["넘버플러스로 받은 제 두 번째 번호가 뭐였죠?", "회원의 부가서비스 정보를 조회해 넘버플러스로 받은 두 번째 전화번호를 안내해 드립니다."], "891": ["착신 전환을 언제 걸어 뒀는지 알 수 있어요?", "회원의 부가서비스 이력을 조회해 착신 전환 설정일과 전환 번호를 안내해 드립니다."], "1744": ["MSISDN 뜻이 무엇인가요?", "이동통신 가입자에게 연결된 전화번호를 뜻하는 통신망 용어입니다."], "1095": ["명의를 바꾸면 이전 명의자의 통화 내역을 볼 수 있나요?", "명의 변경 전의 통화 내역은 이전 명의자만 조회할 수 있으므로 새 명의자는 볼 수 없습니다. 명의 변경 전 통화 내역을 조회하려면 이전 명의자가 신분증을 가지고 매장에서 신청해야 합니다."], "1244": ["통화 내역은 얼마 동안 조회할 수 있나요?", "Ubot 앱에서는 최근 6개월의 발신 통화 내역을 조회할 수 있습니다. 통화 내역은 최근 12개월까지 조회할 수 있으며 앱에서 볼 수 없는 기간의 내역은 명의자가 신분증을 가지고 매장에서 신청해 주세요. 법령에 따른 통화 내역 보관 기간이 지났다면 내역을 제공할 수 없습니다."], "1866": ["통화 기록 뜻은 무엇인가요?", "걸거나 받은 전화의 번호와 시각 등을 휴대폰에 남긴 내역입니다."], "1870": ["스팸 전화 뜻은 무엇인가요?", "광고나 사기 등에 사용될 수 있는 원하지 않는 전화입니다."], "1466": ["스미싱 문자를 받으면 어떻게 해야 하나요?", "스미싱 문자를 받으면 문자 속 링크를 누르지 말고 삭제해 주세요. 스미싱 링크를 눌러 앱을 설치했다면 휴대폰을 비행기 모드로 바꾸고 해당 앱을 지워 주세요. 스미싱 앱을 설치했다면 휴대폰 결제 한도를 0원으로 바꾸고 고객센터(114)와 경찰(112)에 알려 주세요."], "1749": ["데이터 세션 뜻이 무엇인가요?", "휴대폰이 이동통신망을 통해 인터넷 등 데이터 서비스에 연결된 상태입니다."], "1886": ["백그라운드 데이터 뜻은 무엇인가요?", "화면에 띄워 쓰지 않는 앱이 업데이트·알림 등을 위해 사용하는 모바일 데이터입니다."], "1797": ["DNS 뜻이 무엇인가요?", "Domain Name System의 약자로, 도메인 이름에 연결된 IP 주소 등의 정보를 찾는 체계입니다."], "1791": ["패킷 뜻이 무엇인가요?", "네트워크에서 데이터를 전송하기 위해 나눈 작은 단위입니다."], "1556": ["앱에서 매장까지 길찾기는 어떻게 하나요?", "Ubot 앱의 매장 상세에서 길찾기를 누르고 도보, 자동차, 대중교통 중 하나를 고르면 현재 위치에서 매장까지 경로와 예상 시간을 볼 수 있습니다. 대중교통 길찾기는 소요 시간 순으로 경로 후보를 보여 줍니다. 대중교통 경로를 고르면 환승과 도보 구간까지 안내합니다."], "1518": ["외국어 상담이 되는 매장이 있나요?", "외국어 상담을 지원하는 Ubot 매장을 찾아 드립니다. 위치나 지역을 알려 주시면 가까운 외국어 상담 지원 매장을 보여 드립니다."], "1576": ["예약·납부 알림을 끌 수 있나요?", "매장 예약 알림과 요금 납부 알림은 서비스 안내라 따로 끌 수 없습니다. 받은 예약·납부 알림은 알림함에서 읽음으로 정리할 수 있습니다."], "1648": ["휴대폰에서 재난문자 알림을 끄려면 어떻게 하나요?", "휴대폰의 안전·긴급 알림 또는 알림 설정에서 재난문자 수신 항목을 확인하세요. 재난문자 알림을 끌 수 있는 범위는 알림 종류와 운영체제에 따라 다릅니다. 일부 긴급 재난문자 알림은 해제할 수 없습니다."], "273": ["가족 위치 알림을 그만 쓰고 싶어요.", "가족 위치 알림 서비스는 앱이나 고객센터에서 즉시 해지할 수 있습니다. 가족 위치 알림 서비스의 월 요금 1,650원은 사용한 일수만큼 나누어 청구됩니다."], "1511": ["챗봇이 답하지 못한 질문은 어떻게 되나요?", "챗봇이 답변을 찾지 못한 질문은 담당자가 검토해 FAQ를 보완하는 데 사용합니다. 챗봇이 답하지 못한 급한 문의는 고객센터(114)로 연락해 주세요."], "1792": ["IP 주소 뜻이 무엇인가요?", "인터넷 프로토콜로 통신하는 기기의 네트워크 연결 지점을 식별하는 주소입니다."], "1793": ["공인 IP 주소 뜻이 무엇인가요?", "인터넷에서 다른 네트워크와 통신할 때 사용하는 전역적으로 식별 가능한 IP 주소입니다."], "1794": ["사설 IP 주소 뜻이 무엇인가요?", "집이나 회사 같은 내부망에서 쓰는 주소로, 그대로는 공용 인터넷에서 목적지 주소로 라우팅되지 않습니다."], "1588": ["질문을 보냈더니 사용할 수 없는 표현이 있다고 나와요.", "챗봇 질문에 욕설이나 부적절한 표현이 들어 있으면 질문이 접수되지 않습니다. 사용할 수 없는 표현을 빼고 챗봇에 다시 질문해 주세요."], "1681": ["의심스러운 문자의 링크를 이미 눌렀다면 어떻게 해야 하나요?", "의심스러운 문자 링크를 이미 눌렀다면 앱의 소액결제 이용내역에서 모르는 결제가 있는지 확인해 주세요. 의심스러운 링크를 누른 뒤 모르는 결제가 발생했다면 고객센터로 연락해 주세요. 의심스러운 문자 링크를 눌렀다면 앱에서 소액결제를 차단할 수 있습니다. 번호도용 방지 서비스를 무료로 신청하면 내 명의로 추가 개통되는 것을 막을 수 있습니다."], "1637": ["RCS 채팅에서 내가 읽었다는 표시를 보내지 않으려면 어떻게 하나요?", "RCS 채팅의 수신 확인 보내기를 끄면 지원되는 대화에서 내가 읽었다는 표시를 보내지 않도록 설정할 수 있습니다. 일반 SMS에는 RCS와 같은 방식의 읽음 확인 기능이 없습니다."], "874": ["제 명의 두 번째 회선은 데이터가 얼마나 남았어요?", "회원 명의의 두 번째 휴대폰 회선을 조회해 현재 남은 데이터 용량을 안내해 드립니다."], "1575": ["예약을 취소했는데 리마인더가 계속 오나요?", "취소된 매장 예약에는 방문 리마인더를 보내지 않습니다. 매장 예약을 취소하면 직후 알림함에 예약 취소 알림이 표시됩니다."], "1780": ["다운로드 뜻이 무엇인가요?", "인터넷이나 다른 장치에서 내 기기로 데이터를 받아오는 것입니다."], "334": ["제 계정에 다른 사람이 접근하면 알 수 있나요?", "Ubot 앱 비밀번호를 5회 연속 잘못 입력하면 계정이 30분간 잠기며 본인 확인 후 비밀번호를 재설정할 수 있습니다. 다만 다른 사람이 계정에 접근했을 때 별도의 로그인 알림이 제공되는지는 현재 안내된 정보로 확인할 수 없습니다. 본인이 하지 않은 접근이 의심되면 앱 비밀번호를 변경하고 고객센터(114)에 계정 보안 점검을 요청해 주세요."], "1590": ["챗봇에 개인정보를 입력해도 되나요?", "챗봇에 주민등록번호, 계좌번호, 카드번호, 비밀번호를 입력하지 마세요. 챗봇 질문 내용은 서비스 개선을 위해 보관하며 3개월이 지나면 원문을 지우고 통계로만 씁니다."], "746": ["요금 낼 가상계좌 번호를 알려 주세요.", "회원의 요금 납부 정보를 조회해 요금을 낼 수 있는 가상계좌 번호를 안내해 드립니다."], "1324": ["로밍 중이라고 상대방에게 안내할 수 있나요?", "Ubot은 로밍 중임을 상대방에게 알리는 안내 멘트를 자동으로 제공하지 않습니다. 해외에 있는 동안 부재중 알림이나 착신 전환을 설정해 두면 걸려 온 전화를 확인할 수 있습니다."], "490": ["친구가 있는 곳 근처 매장을 대신 찾아 줄 수 있어요?", "친구분이 계신 주소나 지역을 알려 주시면 그 주변 매장을 찾아 드립니다."], "1557": ["현재 위치로 매장이 검색되지 않아요.", "현재 위치로 Ubot 매장을 찾으려면 휴대폰 설정에서 Ubot 앱의 위치 권한을 허용해야 합니다. 위치 권한을 허용하지 않으려면 지명이나 역 이름으로 매장을 검색해 주세요."], "162": ["다른 사람 명의 회선의 eSIM을 제 폰에 발급받을 수 있나요?", "다른 사람 명의 회선의 eSIM을 발급받으려면 그 회선 명의자의 본인인증이 필요합니다. 가족 명의 회선이라면 명의자가 직접 eSIM 발급 절차를 진행해 주세요."], "331": ["공동인증서로도 본인 확인이 되나요?", "공동·금융 인증서로 본인 확인을 진행할 수 있습니다. 본인 확인에는 휴대폰 인증이나 신분증 촬영도 선택할 수 있습니다."], "886": ["이번 달 문자 몇 건 더 보낼 수 있어요?", "회원의 요금제와 이번 달 사용량을 조회해 남은 문자 건수를 안내해 드립니다."], "719": ["이번 달 제가 보낸 문자가 몇 건이에요?", "회원의 이번 달 문자 사용 내역을 조회해 보낸 문자 건수를 안내해 드립니다."], "1756": ["RCS 뜻이 무엇인가요?", "Rich Communication Services의 약자로, 지원되는 앱과 망에서 채팅·읽음 확인 등 확장 기능을 제공하는 메시지 표준입니다."], "1591": ["챗봇이 내 요금이나 가입 정보도 알려 주나요?", "챗봇에 로그인하면 회원 정보를 바탕으로 내 요금이나 가입 정보를 물어볼 수 있습니다. 비회원은 내 정보를 조회할 수 없어 챗봇에서 로그인이 필요하다고 안내합니다."], "959": ["이번 달 말에 사라지는 포인트가 있나요?", "회원의 포인트 적립 내역을 조회해 이번 달 유효기간이 끝나는 포인트를 안내해 드립니다."], "804": ["지금 해지하면 사라지는 제 포인트가 얼마예요?", "회원의 멤버십 포인트 잔액을 조회해 지금 회선을 해지하면 소멸될 포인트를 안내해 드립니다."], "932": ["이번 달에 요금제를 이미 한 번 바꿨었나요?", "회원의 요금제 변경 이력을 조회해 이번 달에 이미 변경했는지 안내해 드립니다. 요금제는 한 달에 한 번만 변경할 수 있습니다."], "105": ["요금제는 한 달에 몇 번까지 바꿀 수 있나요?", "요금제는 한 달에 1회 변경할 수 있습니다. 이번 달에 이미 요금제를 변경했다면 다음 달에 다시 변경할 수 있습니다."], "450": ["출국 전에 로밍 상담받을 매장을 집 근처에서 찾고 싶어요.", "집 주소 주변에서 출국 전 로밍 패스 가입 상담이 가능한 매장을 찾아 드립니다. 출국 전 로밍 패스는 앱에서도 가입할 수 있습니다."], "1363": ["멤버십 혜택 사용 횟수를 넘었다고 나와요.", "VIP 멤버십 전용 혜택은 월별 이용 횟수가 정해져 있어 이번 달 횟수를 다 쓰면 다음 달 1일부터 다시 사용할 수 있습니다. 멤버십 혜택의 남은 이용 횟수는 앱의 멤버십 메뉴에서 확인할 수 있습니다."], "794": ["제 등급으로 올해 남은 제휴 할인 횟수가 몇 번이에요?", "회원의 멤버십 정보를 조회해 현재 등급에서 올해 남은 제휴 할인 횟수를 안내해 드립니다."], "694": ["최근 석 달 동안 제 데이터 사용량을 비교해 보고 싶어요.", "회원의 최근 3개월 사용 내역을 조회해 월별 데이터 사용량을 비교해 드립니다. 최근 3개월의 데이터 사용량은 요금제를 고를 때 참고할 수 있습니다."], "732": ["가족 요금이랑 제 요금이 한 청구서로 묶여 있나요?", "회원의 청구 정보를 조회해 가족 회선 요금과 본인 회선 요금의 통합 청구 여부 및 묶인 회선을 안내해 드립니다."], "980": ["지난 출장 때 해외에서 보낸 문자 요금 내역을 보여 주세요.", "회원의 로밍 이용 내역을 조회해 해외에서 보낸 문자 요금을 안내해 드립니다."], "93": ["로밍 사용량을 확인할 수 있나요?", "로밍 사용량은 앱이나 홈페이지의 로밍 이용내역에서 확인할 수 있습니다."], "744": ["이번 달에 요금제를 바꿔서 일할 계산된 금액이 얼마예요?", "회원의 청구 내역을 조회해 이번 달 요금제 변경으로 각각의 요금제에 일할 계산된 금액을 안내해 드립니다."], "143": ["명의자 대신 가족이 매장에서 번호이동을 신청할 수 있나요?", "명의자 대신 가족 등 대리인이 매장에서 번호이동을 신청하려면 명의자 신분증, 대리인 신분증, 위임장, 발급 3개월 이내의 명의자 인감증명서를 준비해야 합니다."], "382": ["저랑 동생이 사는 곳 중간쯤에서 명의 변경할 매장을 찾고 싶어요.", "두 분의 주소를 알려 주시면 중간 지역에서 명의 변경을 취급하는 매장을 찾아 드립니다."], "1772": ["일할 계산 뜻이 무엇인가요?", "한 달 전체가 아닌 실제 이용한 날짜를 기준으로 월 요금을 나누어 계산하는 방식입니다."], "423": ["토요일에 폰 바꾸러 갈 매장을 찾아 주세요.", "토요일에 영업하면서 기기변경을 취급하는 매장을 현재 위치 주변에서 찾아 드립니다."], "848": ["제 회선이 유심으로 쓰는 건지 eSIM으로 쓰는 건지 확인해 주세요.", "회원의 회선 정보를 조회해 유심과 eSIM 중 어떤 방식으로 개통돼 있는지 안내해 드립니다."], "784": ["가족 위치 알림에 누가 연결돼 있어요?", "회원의 가족 위치 알림 서비스 정보를 조회해 현재 연결된 가족 회선을 안내해 드립니다."], "245": ["매장에 가지 않고 앱으로 되는 일은 어떤 게 있나요?", "요금제 변경, 부가서비스, 요금 조회와 납부 방법 변경, 분실 신고, eSIM 발급, 신규 가입, 번호이동, 기기변경을 앱에서 처리할 수 있습니다."], "838": ["번호이동 신청한 게 끝났는지, 예전 통신사는 해지됐는지 알려 주세요.", "회원의 번호이동 신청 내역을 조회해 개통 완료 여부를 안내해 드립니다. 번호이동 개통이 끝나면 기존 통신사 회선은 자동 해지됩니다."], "353": ["저녁 7시 넘어서 갈 수 있는 매장이 이 근처에 있을까요?", "평일 매장은 보통 20:00까지 운영합니다. 현재 위치 주변에서 평일 저녁 7시 이후에도 방문할 수 있는 매장을 찾아 드립니다."], "430": ["퇴근하고 번호이동 상담받을 수 있는 매장 있어요?", "평일 저녁까지 영업하면서 번호이동 상담이 가능한 매장을 현재 위치 주변에서 찾아 드립니다."], "658": ["연산역 근처에 저녁에 갈 수 있는 매장 알려 주세요.", "연산역 주변에서 평일 저녁까지 영업하는 매장을 찾아 드립니다. 매장의 평일 운영시간은 보통 20:00까지입니다."], "1045": ["한 사람이 몇 회선까지 가입할 수 있나요?", "개인 명의로 Ubot 휴대폰 회선을 최대 5개까지 가입할 수 있고 태블릿·워치 회선은 별도로 가입할 수 있습니다. 미성년자는 Ubot 휴대폰 회선을 1개만 가입할 수 있습니다."], "1685": ["유심보호서비스는 무엇인가요?", "유심보호서비스는 내 유심이 다른 휴대폰에서 무단으로 사용되는 것을 제한하는 서비스입니다. 유심보호서비스 가입 가능 여부와 신청 방법은 이용 중인 통신사의 앱이나 고객센터에서 확인할 수 있습니다. 기기를 변경하거나 유심을 다른 휴대폰으로 옮기기 전에는 유심보호서비스 이용 조건을 확인해 주세요."], "950": ["데이터 안심 서비스는 언제 신청한 거예요?", "회원의 부가서비스 이력을 조회해 데이터 안심 신청일을 안내해 드립니다."], "904": ["지금 내야 할 미납 금액이 총 얼마예요?", "회원의 미납 내역을 조회해 미납 금액 합계와 납부 방법을 안내해 드립니다."]};
const KEY='ubot_label_a_v1';let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let cur=0;
function st(id){return S[id]||(S[id]={label:'',gold:[],note:''})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function cls(id){const l=(S[id]||{}).label;return l==='ANSWER'?'A':l==='NO_ANSWER'?'N':l==='BORDER'?'B':'U'}
function side(){const d=document.getElementById('side');d.innerHTML='';ITEMS.forEach((it,i)=>{const e=document.createElement('div');e.className=cls(it.id)+(i===cur?' cur':'');e.textContent=it.id+' '+it.q;e.onclick=()=>{cur=i;render()};d.appendChild(e)});
 const cu=d.children[cur];if(cu)cu.scrollIntoView({block:'nearest'});
 const n=ITEMS.filter(x=>(S[x.id]||{}).label).length;document.getElementById('prog').textContent=` 진행 ${n}/${ITEMS.length}`}
function esc(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(){const it=ITEMS[cur],s=st(it.id);let h=`<h2>${it.id}  ${esc(it.q)}</h2><div class="meta">${it.et} · ${cur+1}/${ITEMS.length}</div>
<div class="btns">`+[['ANSWER','A','1'],['NO_ANSWER','N','2'],['BORDER','B','3']].map(([l,c,k])=>`<button class="${c}${s.label===l?' on':''}" onclick="setL('${l}')">${k} ${l}</button>`).join('')+`<button onclick="setL('')">지우기(0)</button></div>
<div class="small" style="margin:6px 0">ANSWER: 이 FAQ를 LLM에게 주면 올바른 답을 만들 수 있다 / NO_ANSWER: 주제만 비슷하고 답이 안 됨 / BORDER: 애매(전체의 10% 이하). 정답이 되는 후보는 카드를 클릭(또는 Q W E R T Y U I O P 키)해서 초록색으로.</div>`;
 const keys='qwertyuiop';
 it.c.forEach((id,i)=>{if(!id)return;const f=FAQ[id]||['?','?'];const g=s.gold.includes(id);
  h+=`<div class="cand${g?' gold':''}" onclick="tg('${id}')"><span class="k">${keys[i].toUpperCase()}</span><b>[${id}]</b> ${esc(f[0])}<div class="a">${esc(f[1])}</div></div>`});
 const out=s.gold.filter(g=>!it.c.includes(g));
 h+=`<div class="row"><b>후보 밖 정답 FAQ</b> (선택됨: ${out.map(o=>`<a href="#" onclick="tg('${o}');return false">[${o}] ✕</a>`).join(' ')||'없음'})</div>
 <div class="row"><b>메모</b><input type="text" value="${esc(s.note).replace(/"/g,'&quot;')}" oninput="st('${it.id}').note=this.value;save()" id="note"></div>`;
 document.getElementById('body').innerHTML=h;side()}
function setL(l){st(ITEMS[cur].id).label=l;save();render()}
function tg(id){const s=st(ITEMS[cur].id),i=s.gold.indexOf(id);if(i<0)s.gold.push(id);else s.gold.splice(i,1);save();render()}
function prev(){if(cur>0){cur--;render()}}function next(){if(cur<ITEMS.length-1){cur++;render()}}
function nextUn(){for(let k=1;k<=ITEMS.length;k++){const i=(cur+k)%ITEMS.length;if(!(S[ITEMS[i].id]||{}).label){cur=i;render();return}}alert('모두 라벨링했습니다')}
function search(){const q=document.getElementById('sq').value.trim();if(!q)return;const ws=q.split(/\s+/);let r=[];
 for(const id in FAQ){const t=FAQ[id][0]+' '+FAQ[id][1];if(ws.every(w=>t.includes(w)))r.push(id)}
 document.getElementById('sres').innerHTML=`<div class="small">${r.length}건${r.length>30?' (30건만 표시)':''}</div>`+r.slice(0,30).map(id=>`<div class="res"><button onclick="tg('${id}')">정답에 추가/제거</button><b>[${id}]</b> ${esc(FAQ[id][0])}<br><span class="small">${esc(FAQ[id][1])}</span></div>`).join('')}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
 if(k==='1')setL('ANSWER');else if(k==='2')setL('NO_ANSWER');else if(k==='3')setL('BORDER');else if(k==='0')setL('');
 else if(k==='arrowright'||k==='j')next();else if(k==='arrowleft'||k==='k')prev();
 else{const i='qwertyuiop'.indexOf(k);if(i>=0&&ITEMS[cur].c[i])tg(ITEMS[cur].c[i])}});
function q(v){v=String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCsv(){const H=['id','question','expression_type','candidate_1','candidate_2','candidate_3','candidate_4','candidate_5','candidate_6','candidate_7','candidate_8','candidate_9','candidate_10','label','gold_faq_ids','gold_outside','note'];
 let o=[H.join(',')];ITEMS.forEach(it=>{const s=S[it.id]||{label:'',gold:[],note:''};const out=s.gold.some(g=>!it.c.includes(g));
  o.push([it.id,it.q,it.et,...it.raw,s.label,s.gold.join(';'),out?'Y':'',s.note].map(q).join(','))});
 const b=new Blob(['\ufeff'+o.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='labels_a.csv';a.click()}
function parseCsv(t){const rows=[];let r=[],f='',inq=false;t=t.replace(/^\ufeff/,'');for(let i=0;i<t.length;i++){const c=t[i];
 if(inq){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else inq=false}else f+=c}else if(c==='"')inq=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}else if(c!=='\r')f+=c}
 if(f||r.length){r.push(f);rows.push(r)}return rows}
function importCsv(file){const rd=new FileReader();rd.onload=()=>{const rows=parseCsv(rd.result),H=rows[0],ix=n=>H.indexOf(n);let n=0;
 rows.slice(1).forEach(r=>{const id=r[ix('id')];if(!id)return;const l=(r[ix('label')]||'').trim();if(l||r[ix('gold_faq_ids')]){S[id]={label:l,gold:(r[ix('gold_faq_ids')]||'').split(';').map(x=>x.trim()).filter(Boolean),note:r[ix('note')]||''};n++}});
 save();render();alert(n+'건 불러옴')};rd.readAsText(file,'utf-8')}
render();
</script></body></html>
