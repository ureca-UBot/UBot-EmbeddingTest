: "\uc81c \ud3f0\uc5d0 \ud1b5\ud654 \uc5f0\uacb0\uc74c\uc774 \uc124\uc815\ub3fc \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \ud1b5\ud654 \uc5f0\uacb0\uc74c \uc11c\ube44\uc2a4 \uac00\uc785 \uc5ec\ubd80\uc640 \uc6d4 \uc694\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "887", "t": "\ud1b5\ud654 \uc5f0\uacb0\uc74c\uc740 \uc5b8\uc81c \uc2e0\uccad\ud588\uc5c8\ub294\uc9c0 \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uc774\ub825\uc744 \uc870\ud68c\ud574 \ud1b5\ud654 \uc5f0\uacb0\uc74c \uac00\uc785\uc77c\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "888", "t": "\ud1b5\ud654 \uc5f0\uacb0\uc74c \uc694\uae08\uc774 \uc774\ubc88 \ub2ec \uc5bc\ub9c8 \ub098\uc654\uc5b4\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uc774\ubc88 \ub2ec \uccad\uad6c \ub0b4\uc5ed\uc744 \uc870\ud68c\ud574 \ud1b5\ud654 \uc5f0\uacb0\uc74c \uc11c\ube44\uc2a4 \uc694\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud1b5\ud654 \uc5f0\uacb0\uc74c \uc11c\ube44\uc2a4\uc758 \uc6d4 \uc694\uae08\uc740 1,100\uc6d0\uc785\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0106", "q": "\uc2a4\ud338 \ucc28\ub2e8", "g": "ANS", "f": [{"id": "1232", "t": "\ud2b9\uc815 \ubc88\ud638\uc758 \uc804\ud654\ub098 \ubb38\uc790\ub97c \ucc28\ub2e8\ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud2b9\uc815 \ubc88\ud638\uc758 \uc804\ud654\ub098 \ubb38\uc790\ub294 \ud734\ub300\ud3f0\uc758 \uc804\ud654\u00b7\uba54\uc2dc\uc9c0 \uc571\uc5d0\uc11c \ucc28\ub2e8\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0\uc744 \ubc14\uafd4\ub3c4 \ud2b9\uc815 \ubc88\ud638\uc758 \uc218\uc2e0 \ucc28\ub2e8\uc744 \uc720\uc9c0\ud558\ub824\uba74 Ubot \uc571\uc758 \uc218\uc2e0 \ucc28\ub2e8 \uba54\ub274\uc5d0 \ubc88\ud638\ub97c \ub4f1\ub85d\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "1233", "t": "\uc2a4\ud338 \uc804\ud654\uc640 \ubb38\uc790\ub97c \uc904\uc774\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ubb34\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\uc778 Ubot \uc2a4\ud338 \ucc28\ub2e8\uc5d0 \uac00\uc785\ud558\uba74 \uc2a4\ud338 \uc758\uc2ec \uc804\ud654\uc640 \ubb38\uc790\ub97c \uc54c\ub824 \uc8fc\uace0 \ucc28\ub2e8\ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "Ubot \uc2a4\ud338 \ucc28\ub2e8\uc73c\ub85c \uac78\ub7ec\uc9c4 \ubb38\uc790\ub294 \uc571\uc758 \uc2a4\ud338 \ubcf4\uad00\ud568\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uace0 \uc798\ubabb \ucc28\ub2e8\ub41c \ubc88\ud638\ub294 \ubaa9\ub85d\uc5d0\uc11c \ud574\uc81c\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1234", "t": "\uc2a4\ud338\uc774\ub098 \ubd88\ubc95 \uad11\uace0\ub294 \uc5b4\ub514\uc5d0 \uc2e0\uace0\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc2a4\ud338\uc774\ub098 \ubd88\ubc95 \uad11\uace0\ub294 \ud734\ub300\ud3f0 \uba54\uc2dc\uc9c0 \uc571\uc758 \uc2a4\ud338 \uc2e0\uace0 \uae30\ub2a5 \ub610\ub294 \ud55c\uad6d\uc778\ud130\ub137\uc9c4\ud765\uc6d0 \ubd88\ubc95\uc2a4\ud338\ub300\uc751\uc13c\ud130(\uad6d\ubc88 \uc5c6\uc774 118)\uc5d0 \uc2e0\uace0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc2a4\ud338\uc774\ub098 \ubd88\ubc95 \uad11\uace0\ub85c \uae08\uc804 \ud53c\ud574\ub97c \uc785\uc5c8\ub2e4\uba74 \uacbd\ucc30\uccad(112)\uc5d0\ub3c4 \uc2e0\uace0\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "185", "t": "\ud1b5\uc2e0\uc0ac \uc2a4\ud338 \ucc28\ub2e8 \uc11c\ube44\uc2a4\ub294 \uc720\ub8cc\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uc2a4\ud338 \ucc28\ub2e8 \uc11c\ube44\uc2a4\ub294 \ubb34\ub8cc\uc774\uba70 \uc571\uc5d0\uc11c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "64", "t": "\uc2a4\ud338 \ubb38\uc790\ub97c \ucc28\ub2e8\ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc2a4\ud338 \ubb38\uc790\ub294 \ud734\ub300\ud3f0 \ub610\ub294 \ud1b5\uc2e0\uc0ac\uc758 \uc2a4\ud338 \ucc28\ub2e8 \uae30\ub2a5\uc73c\ub85c \ucc28\ub2e8\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "715", "t": "\uc81c \ud68c\uc120\uc5d0 \uc2a4\ud338 \ucc28\ub2e8\uc774 \uac00\uc785\ub3fc \uc788\ub294\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \uc2a4\ud338 \ucc28\ub2e8 \uc11c\ube44\uc2a4 \uac00\uc785 \uc5ec\ubd80\ub97c \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc2a4\ud338 \ucc28\ub2e8 \uc11c\ube44\uc2a4\uc5d0 \uac00\uc785\ud558\uc9c0 \uc54a\uc558\ub2e4\uba74 \uc571\uc5d0\uc11c \ubb34\ub8cc\ub85c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "892", "t": "\uc2a4\ud338 \ucc28\ub2e8\uc740 \uc5b8\uc81c \uc2e0\uccad\ud588\uc5c8\ub098\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uc774\ub825\uc744 \uc870\ud68c\ud574 \uc2a4\ud338 \ucc28\ub2e8 \uc2e0\uccad\uc77c\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0108", "q": "\uccad\uc18c\ub144 \uc694\uae08\uc81c", "g": "ANS", "f": [{"id": "101", "t": "\uccad\uc18c\ub144 5G \uc694\uae08\uc81c\ub294 \ub370\uc774\ud130\ub97c \ub2e4 \uc4f0\uba74 \ucd94\uac00 \uc694\uae08\uc774 \ub098\uc624\ub098\uc694?", "s": [{"i": 0, "t": "\uccad\uc18c\ub144 5G \uc694\uae08\uc81c\ub294 \ub370\uc774\ud130 15GB\ub97c \ubaa8\ub450 \uc0ac\uc6a9\ud55c \ub4a4\uc5d0\ub3c4 1Mbps\ub85c \uacc4\uc18d \uc0ac\uc6a9\ud560 \uc218 \uc788\uc5b4 \ub370\uc774\ud130 \ucd94\uac00 \uc694\uae08\uc774 \ubc1c\uc0dd\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1029", "t": "\uccad\ub144 \uc694\uae08\uc81c\ub294 \uba87 \uc0b4\uae4c\uc9c0 \uac00\uc785\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uccad\ub144 \uc694\uae08\uc81c\ub294 \ub9cc 19~34\uc138\uac00 \uac00\uc785 \ub300\uc0c1\uc774\uba70 \ub9cc 35\uc138\uac00 \ub418\ub294 \ub2ec \ub9d0\uc77c\uae4c\uc9c0 \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uccad\ub144 \uc694\uae08\uc81c \uc774\uc6a9 \uae30\uac04\uc774 \ub05d\ub098\uba74 \uc77c\ubc18 \uc694\uae08\uc81c\ub85c \ubcc0\uacbd\ud558\ub294 \uc0c1\ub2f4\uc744 \ubc1b\uc544\uc57c \ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "1114", "t": "\uccad\ub144 \uc694\uae08\uc81c \uc885\ub958\uc640 \uac00\uaca9\uc774 \uad81\uae08\ud574\uc694.", "s": [{"i": 0, "t": "\uccad\ub144 \uc694\uae08\uc81c\ub294 \ub9cc 19~34\uc138 \uc804\uc6a9\uc73c\ub85c 5GB(\uc6d4 19,000\uc6d0), 10GB(25,000\uc6d0), 30GB(33,000\uc6d0), 100GB(45,000\uc6d0), 200GB(55,000\uc6d0), \ubb34\uc81c\ud55c(65,000\uc6d0)\uc774 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uccad\ub144 \uc694\uae08\uc81c\ub294 \ubaa8\ub450 \uc74c\uc131\u00b7\ubb38\uc790\ub97c \uae30\ubcf8 \uc81c\uacf5\ud558\uba70 100GB\u00b7200GB\ub294 \ub370\uc774\ud130\ub97c \ub2e4 \uc4f4 \ub4a4 5Mbps\ub85c \uacc4\uc18d \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1133", "t": "\uccad\ub144 \uc694\uae08\uc81c\ub294 \ub204\uac00 \uac00\uc785\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uccad\ub144 \uc694\uae08\uc81c\ub294 \ub9cc 19\uc138\ubd80\ud130 34\uc138\uae4c\uc9c0 \uac00\uc785\ud560 \uc218 \uc788\uc73c\uba70 \uccad\ub144 5GB(\uc6d4 19,000\uc6d0)\ubd80\ud130 \uccad\ub144 \ubb34\uc81c\ud55c(\uc6d4 65,000\uc6d0)\uae4c\uc9c0 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uccad\ub144 \uc694\uae08\uc81c\ub294 \ub9cc 35\uc138\uac00 \ub418\ub294 \ub2ec \ub9d0\uc77c\uae4c\uc9c0 \uc774\uc6a9\ud560 \uc218 \uc788\uace0 \uc774\ud6c4\uc5d0\ub294 \uc77c\ubc18 \uc694\uae08\uc81c\ub85c \ubcc0\uacbd\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "1134", "t": "\uccad\uc18c\ub144\uc774\ub098 \uc5b4\ub9b0\uc774\uc6a9 \uc694\uae08\uc81c\uac00 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub9cc 12\uc138 \uc774\ud558 \uc5b4\ub9b0\uc774\ub294 Ubot \ud0a4\uc988 \uc548\uc2ec \uc694\uae08\uc81c(\uc6d4 6,900\uc6d0~19,000\uc6d0)\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc73c\uba70 \uc790\ub140 \uc704\uce58 \uacf5\uc720\uc640 \uc720\ud574 \uc0ac\uc774\ud2b8 \ucc28\ub2e8\uc744 \uc81c\uacf5\ud558\ub294 Ubot \ud0a4\uc988\uac00\ub4dc\uac00 \ud3ec\ud568\ub429\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ub9cc 13\uc138\ubd80\ud130 18\uc138\uae4c\uc9c0\uc758 \uccad\uc18c\ub144\uc740 \ubc95\uc815\ub300\ub9ac\uc778 \ub3d9\uc758\ub97c \ubc1b\uc544 \uc77c\ubc18 \uc694\uae08\uc81c\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1378", "t": "\uccad\ub144\ub07c\ub9ac \uacb0\ud569\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uccad\ub144 \ub4c0\uc624\ub294 \ub9cc 19~34\uc138\uc758 \uccad\ub144 \uc694\uae08\uc81c 2\ud68c\uc120\uc744 \uacb0\ud569\ud558\uba74 \uc6d4 6,000\uc6d0\uc744 \ud560\uc778\ud569\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uccad\ub144 \ub4c0\uc624 \uad6c\uc131\uc6d0 \uc911 \ud55c \uba85\uc774\ub77c\ub3c4 \uccad\ub144 \uc694\uae08\uc81c\ub97c \ubc97\uc5b4\ub098\uba74 \uacb0\ud569 \ud560\uc778\uc774 \uc885\ub8cc\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "390", "t": "\uc544\uc774 \ud559\uad50 \uadfc\ucc98\uc5d0 \uccad\uc18c\ub144 \uc694\uae08\uc81c \uac00\uc785\ub418\ub294 \ub9e4\uc7a5\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud559\uad50 \uc8fc\uc18c\ub97c \uc54c\ub824 \uc8fc\uc2dc\uba74 \uc8fc\ubcc0\uc5d0\uc11c \uccad\uc18c\ub144 \uc694\uae08\uc81c \uac00\uc785\uc744 \uc704\ud55c \ubbf8\uc131\ub144\uc790 \uac00\uc785 \uc5c5\ubb34\ub97c \ucde8\uae09\ud558\ub294 \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ubbf8\uc131\ub144\uc790 \uac00\uc785\uc744 \uc704\ud574\uc11c\ub294 \ubc95\uc815\ub300\ub9ac\uc778\uc774 \ud568\uaed8 \ubc29\ubb38\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "74", "t": "\uccad\uc18c\ub144 \uc804\uc6a9 \uc694\uae08\uc81c\uac00 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uccad\uc18c\ub144\uc744 \uc704\ud55c \uc804\uc6a9 \ud61c\ud0dd\uc774 \ud3ec\ud568\ub41c \uc694\uae08\uc81c\uac00 \uc81c\uacf5\ub420 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0109", "q": "\uc2dc\ub2c8\uc5b4 \uc694\uae08", "g": "ANS", "f": [{"id": "102", "t": "\ub9cc 65\uc138\uac00 \ub418\uba74 \uc2dc\ub2c8\uc5b4 \uc694\uae08\uc81c\ub85c \uc790\ub3d9\uc73c\ub85c \ubc14\ub00c\ub098\uc694?", "s": [{"i": 0, "t": "\ub9cc 65\uc138\uac00 \ub418\uc5b4\ub3c4 \uc2dc\ub2c8\uc5b4 LTE \uc694\uae08\uc81c\ub85c \uc790\ub3d9 \ubcc0\uacbd\ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc2dc\ub2c8\uc5b4 LTE \uc694\uae08\uc81c\ub85c \ubc14\uafb8\ub824\uba74 \uc571\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \uc9c1\uc811 \uc2e0\uccad\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "1115", "t": "\uc2dc\ub2c8\uc5b4 \uc548\uc2ec \uc694\uae08\uc81c \uc885\ub958\uc640 \uac00\uaca9\uc774 \uad81\uae08\ud574\uc694.", "s": [{"i": 0, "t": "\uc2dc\ub2c8\uc5b4 \uc548\uc2ec\uc740 \ub9cc 65\uc138 \uc774\uc0c1 \uc804\uc6a9 LTE \uc694\uae08\uc81c\ub85c 1GB(\uc6d4 3,900\uc6d0), 2GB(6,900\uc6d0), 4GB(8,900\uc6d0), 8GB(13,900\uc6d0), 15GB(19,900\uc6d0)\uac00 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc2dc\ub2c8\uc5b4 \uc548\uc2ec 1GB\ub294 \uc74c\uc131 100\ubd84\u00b7\ubb38\uc790 100\uac74\uc744 \uc81c\uacf5\ud558\uba70 \ub098\uba38\uc9c0 \uc2dc\ub2c8\uc5b4 \uc548\uc2ec \uc694\uae08\uc81c\ub294 \uc74c\uc131\u00b7\ubb38\uc790\ub97c \uae30\ubcf8 \uc81c\uacf5\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "1137", "t": "\uc2dc\ub2c8\uc5b4 \uc694\uae08\uc81c\ub294 \uba87 \uc0b4\ubd80\ud130 \uac00\uc785\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub9cc 65\uc138 \uc774\uc0c1\uc774\uba74 Ubot \uc2dc\ub2c8\uc5b4 \uc548\uc2ec \uc694\uae08\uc81c(\uc6d4 3,900\uc6d0~19,900\uc6d0)\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub9cc 65\uc138\uac00 \ub418\uc5b4\ub3c4 \uc2dc\ub2c8\uc5b4 \uc694\uae08\uc81c\ub85c \uc790\ub3d9 \ubcc0\uacbd\ub418\uc9c0 \uc54a\uc73c\ubbc0\ub85c \uc571\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \uc9c1\uc811 \uc2e0\uccad\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "436", "t": "\uc5b4\ub974\uc2e0 \uc694\uae08\uc81c \uc0c1\ub2f4\ubc1b\uc744 \ub9e4\uc7a5\uc744 \ubd80\ubaa8\ub2d8 \ub301 \uadfc\ucc98\uc5d0\uc11c \ucc3e\uace0 \uc788\uc5b4\uc694.", "s": [{"i": 0, "t": "\ubd80\ubaa8\ub2d8 \ub301 \uc8fc\uc18c \uc8fc\ubcc0\uc5d0\uc11c \uc2dc\ub2c8\uc5b4 \uc694\uae08\uc81c \uc0c1\ub2f4\uc744 \ubc1b\uc744 \uc218 \uc788\ub294 \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc2dc\ub2c8\uc5b4 LTE \uc694\uae08\uc81c\ub294 \ub9cc 65\uc138 \uc774\uc0c1 \uace0\uac1d\uc774 \uc9c1\uc811 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0110", "q": "\ubcf5\uc9c0 \ud560\uc778", "g": "ANS", "f": [{"id": "1017", "t": "\uc7a5\uc560\uc778\uc774\ub098 \uae30\ucd08\uc218\uae09\uc790\ub3c4 \uc694\uae08 \uac10\uba74\uc744 \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc7a5\uc560\uc778\uc774\ub098 \uae30\ucd08\uc0dd\ud65c\uc218\uae09\uc790 \ub4f1 \uac10\uba74 \ub300\uc0c1\uc5d0 \ud574\ub2f9\ud558\uace0 \uc870\uac74\uc744 \ucda9\uc871\ud558\uba74 \ud1b5\uc2e0\uc694\uae08 \uac10\uba74\uc744 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud1b5\uc2e0\uc694\uae08 \uac10\uba74 \ub300\uc0c1 \ud655\uc778\uc5d0\ub294 \uc99d\ube59 \uc11c\ub958\uac00 \ud544\uc694\ud560 \uc218 \uc788\uc73c\ub2c8 \uace0\uac1d\uc13c\ud130\ub098 \ub9e4\uc7a5\uc5d0 \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1156", "t": "\ubcf5\uc9c0 \ud560\uc778\uc740 \uc5b4\ub5bb\uac8c \ubc1b\ub098\uc694?", "s": [{"i": 0, "t": "\uae30\ucd08\uc0dd\ud65c\uc218\uae09\uc790, \uc7a5\uc560\uc778, \uad6d\uac00\uc720\uacf5\uc790 \ub4f1 \ubcf5\uc9c0 \ud560\uc778 \ub300\uc0c1\uc790\ub294 \ub9e4\uc7a5\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \uc2e0\uccad\ud558\uba74 \uc694\uae08\uc81c\uc640 \uad00\uacc4\uc5c6\uc774 \uc6d4 \uc694\uae08\uc744 \uac10\uba74\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubcf5\uc9c0 \ud560\uc778 \ub300\uc0c1 \uc790\uaca9\uc740 1\ub144\ub9c8\ub2e4 \ub2e4\uc2dc \ud655\uc778\ud558\uba70 \uc790\uaca9\uc774 \uc5c6\uc5b4\uc9c0\uba74 \ud560\uc778\uc774 \uc885\ub8cc\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1388", "t": "\uacb0\ud569 \ud560\uc778\uacfc \ubcf5\uc9c0 \ud560\uc778\uc744 \ud568\uaed8 \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubcf5\uc9c0 \ud560\uc778\uc740 \ud734\ub300\ud3f0 \ud68c\uc120\ubcc4 \uac10\uba74\uc774\ubbc0\ub85c \uacb0\ud569 \ud560\uc778\uacfc \ud568\uaed8 \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ubcf5\uc9c0 \ud560\uc778\uacfc \uacb0\ud569 \ud560\uc778\uc744 \ud568\uaed8 \ubc1b\uc73c\uba74 \ubcf5\uc9c0 \ud560\uc778\uc774 \uba3c\uc800 \uc801\uc6a9\ub41c \ub4a4 \uacb0\ud569 \ud560\uc778\uc774 \ucc28\uac10\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1492", "t": "\ubcf5\uc9c0 \ud560\uc778 \ub300\uc0c1\uc740 \ub204\uad6c\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ubcf5\uc9c0 \ud560\uc778 \ub300\uc0c1\uc740 \uc7a5\uc560\uc778, \uad6d\uac00\uc720\uacf5\uc790, \uae30\ucd08\uc0dd\ud65c\uc218\uae09\uc790, \ucc28\uc0c1\uc704\uacc4\uce35, \uae30\ucd08\uc5f0\uae08 \uc218\uae09\uc790\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubcf5\uc9c0 \ud560\uc778 \uae08\uc561\uc740 \ub300\uc0c1\ubcc4\ub85c \ub2e4\ub985\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\ubcf5\uc9c0 \ud560\uc778\uc740 \ub9e4\uc7a5\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \uc2e0\uccad\ud558\uba74 \uc815\ubd80 \uc790\uaca9 \ud655\uc778 \ud6c4 \uc801\uc6a9\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "1493", "t": "\ubcf5\uc9c0 \ud560\uc778\uc740 \uba87 \ud68c\uc120\uae4c\uc9c0 \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubcf5\uc9c0 \ud560\uc778\uc740 \ub300\uc0c1\uc790 1\uba85\ub2f9 \ud734\ub300\ud3f0 1\ud68c\uc120\uc5d0 \uc801\uc6a9\ub429\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uae30\ucd08\uc0dd\ud65c\uc218\uae09\uc790\ub294 \uac19\uc740 \uac00\uad6c \uad6c\uc131\uc6d0 \ud68c\uc120\uc744 \ud3ec\ud568\ud574 \ucd5c\ub300 4\ud68c\uc120\uae4c\uc9c0 \ubcf5\uc9c0 \ud560\uc778\uc744 \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1494", "t": "\uc6d4 \uc911\uac04\uc5d0 \ubcf5\uc9c0 \ud560\uc778\uc744 \uc2e0\uccad\ud558\uba74 \uc5b8\uc81c\ubd80\ud130 \uc801\uc6a9\ub418\ub098\uc694?", "s": [{"i": 0, "t": "\uc2e0\uccad\uc774 \uc2b9\uc778\ub41c \ub0a0\ubd80\ud130 \uc77c\ud560 \uacc4\uc0b0\ub418\uc5b4 \uadf8\ub2ec \uc694\uae08\ubd80\ud130 \ud560\uc778\ub429\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0111", "q": "\ud574\uc678 \ub85c\ubc0d \uc694\uae08", "g": "ANS", "f": [{"id": "1302", "t": "\ud574\uc678\uc5d0\uc11c \uc804\ud654\ub098 \ubb38\uc790\ub97c \ubc1b\uc73c\uba74 \uc694\uae08\uc774 \ub098\uc624\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \ubb38\uc790\ub97c \ubc1b\ub294 \uac83\uc740 \uc77c\ubc18\uc801\uc73c\ub85c \ubb34\ub8cc\uc9c0\ub9cc \uad6d\uac00\ubcc4 \ub85c\ubc0d \uc870\uac74\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\ud574\uc678\uc5d0\uc11c \uc74c\uc131\ud1b5\ud654\ub97c \ubc1b\uc73c\uba74 \uad6d\uac00\ubcc4 \ubd84\ub2f9 \ub85c\ubc0d \uc694\uae08\uc774 \ubd80\uacfc\ub418\uc9c0\ub9cc \ubca8\ub9cc \uc6b8\ub9ac\uace0 \ubc1b\uc9c0 \uc54a\uc73c\uba74 \uc694\uae08\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1306", "t": "\ud574\uc678\uc5d0\uc11c \uce74\uce74\uc624\ud1a1\uc774\ub098 \uc778\uc2a4\ud0c0\uadf8\ub7a8\uc744 \uc4f0\uba74 \uc694\uae08\uc774 \ub098\uc624\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \uce74\uce74\uc624\ud1a1\uc774\ub098 \uc778\uc2a4\ud0c0\uadf8\ub7a8 \uac19\uc740 \uba54\uc2e0\uc800\u00b7SNS\ub97c Wi-Fi\uac00 \uc544\ub2cc \ubaa8\ubc14\uc77c \ub370\uc774\ud130\ub85c \uc4f0\uba74 \ub370\uc774\ud130 \ub85c\ubc0d \uc694\uae08\uc774 \ubc1c\uc0dd\ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud574\uc678\uc5d0\uc11c \ub85c\ubc0d \uc0c1\ud488\uc5d0 \uac00\uc785\ud588\ub2e4\uba74 \uba54\uc2e0\uc800\u00b7SNS\ub97c \uc0c1\ud488 \ub370\uc774\ud130 \uc81c\uacf5\ub7c9 \uc548\uc5d0\uc11c \ucd94\uac00 \uc694\uae08 \uc5c6\uc774 \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "28", "t": "\ud574\uc678 \ub370\uc774\ud130 \ub85c\ubc0d \uc694\uae08\uc740 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678 \ub370\uc774\ud130 \ub85c\ubc0d \uc694\uae08\uc740 \ubc29\ubb38 \uad6d\uac00\uc640 \uac00\uc785\ud55c \ub85c\ubc0d \uc0c1\ud488\uc5d0 \ub530\ub77c \ub2ec\ub77c\uc9d1\ub2c8\ub2e4.", "y": 1}]}, {"id": "33", "t": "\ud574\uc678 \ub85c\ubc0d \uc694\uae08 \ud3ed\ud0c4\uc744 \ubc29\uc9c0\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678 \ub85c\ubc0d \uc694\uae08\uc774 \ub9ce\uc774 \ub098\uc624\uc9c0 \uc54a\ub3c4\ub85d \ud558\ub824\uba74 \ub85c\ubc0d \uc0c1\ud488\uc5d0 \uac00\uc785\ud558\uac70\ub098 \ub370\uc774\ud130 \uc0ac\uc6a9\uc744 \uc81c\ud55c\ud558\uac70\ub098 \ucc28\ub2e8 \uc11c\ube44\uc2a4\ub97c \uc774\uc6a9\ud558\ub294 \uac83\uc774 \uc88b\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "34", "t": "\ud574\uc678\uc5d0\uc11c \uc804\ud654\ub97c \ubc1b\uc73c\uba74 \uc694\uae08\uc774 \ubc1c\uc0dd\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \uc804\ud654\ub97c \ubc1b\uc744 \ub54c\ub294 \uad6d\uac00\uc640 \ub85c\ubc0d \uc870\uac74\uc5d0 \ub530\ub77c \uc218\uc2e0 \ud1b5\ud654 \uc694\uae08\uc774 \ubc1c\uc0dd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "35", "t": "\ud574\uc678\uc5d0\uc11c \ubb38\uc790 \uc218\uc2e0\uc5d0\ub3c4 \uc694\uae08\uc774 \ubc1c\uc0dd\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \ubc1b\ub294 \ubb38\uc790\ub294 \uc77c\ubc18\uc801\uc73c\ub85c \ubb34\ub8cc\uc9c0\ub9cc \uad6d\uac00\ubcc4 \ub85c\ubc0d \uc870\uac74\uc774 \ub2e4\ub97c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0112", "q": "\ud14c\ub354\ub9c1", "g": "ANS", "f": [{"id": "1122", "t": "\uc694\uae08\uc81c\ub9c8\ub2e4 \ud14c\ub354\ub9c1\uc740 \uc5bc\ub9c8\ub098 \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud14c\ub354\ub9c1 \ud55c\ub3c4\ub294 \uc694\uae08\uc81c\ub9c8\ub2e4 \ub2e4\ub974\uba70 \ub370\uc774\ud130 \ubb34\uc81c\ud55c \uc694\uae08\uc81c\ub294 \uc6d4 40GB~140GB, \ub370\uc774\ud130 \uc81c\uacf5\ub7c9\uc774 \uc815\ud574\uc9c4 \uc694\uae08\uc81c\ub294 \ub300\ubd80\ubd84 \uae30\ubcf8 \uc81c\uacf5\ub7c9\uacfc \uc6d4 20GB \uc911 \uc801\uc740 \ucabd\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc0ac\uc6a9 \uc911\uc778 \uc694\uae08\uc81c\uc758 \uc815\ud655\ud55c \ud14c\ub354\ub9c1 \ud55c\ub3c4\ub294 \uc571\uc758 \uc694\uae08\uc81c \uc0c1\uc138\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1142", "t": "\ud14c\ub354\ub9c1\uc740 \ubaa8\ub4e0 \uc694\uae08\uc81c\uc5d0\uc11c \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub370\uc774\ud130 \uae30\ubcf8 \uc81c\uacf5\ub7c9\uc774 \uc788\ub294 \uc694\uae08\uc81c\ub77c\uba74 \ud574\ub2f9 \uc694\uae08\uc81c\uc5d0\uc11c \uc815\ud55c \ud55c\ub3c4\uae4c\uc9c0 \ud14c\ub354\ub9c1\uc744 \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud0a4\uc988\u00b7\uc6cc\uce58 \uc694\uae08\uc81c\uc640 \ud1b5\ud654 \uc804\uc6a9 \uc694\uae08\uc81c\ub294 \ud14c\ub354\ub9c1\uc744 \uc81c\uacf5\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1207", "t": "\ud14c\ub354\ub9c1(\ud56b\uc2a4\ud31f)\uc744 \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub370\uc774\ud130 \uae30\ubcf8 \uc81c\uacf5\ub7c9\uc774 \uc788\ub294 \uc694\uae08\uc81c\ub77c\uba74 \uc694\uae08\uc81c\ubcc4 \ud14c\ub354\ub9c1 \ud55c\ub3c4\uae4c\uc9c0 \ud56b\uc2a4\ud31f\uc744 \uc774\uc6a9\ud560 \uc218 \uc788\uc73c\uba70 \ud14c\ub354\ub9c1 \uc0ac\uc6a9\ub7c9\uc740 \uae30\ubcf8 \ub370\uc774\ud130\uc5d0\uc11c \ud568\uaed8 \ucc28\uac10\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud14c\ub354\ub9c1 \ud55c\ub3c4\ub97c \ubaa8\ub450 \uc4f0\uba74 \ud14c\ub354\ub9c1\ub9cc \ucc28\ub2e8\ub418\uace0 \ud734\ub300\ud3f0 \uc790\uccb4 \ub370\uc774\ud130\ub294 \uacc4\uc18d \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1208", "t": "\ud14c\ub354\ub9c1 \uc0ac\uc6a9\ub7c9\uc740 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\uc758 \uc0ac\uc6a9\ub7c9 \uc0c1\uc138\uc5d0\uc11c \uc774\ubc88 \ub2ec \ud14c\ub354\ub9c1 \uc0ac\uc6a9\ub7c9\uacfc \ub0a8\uc740 \ud14c\ub354\ub9c1 \ud55c\ub3c4\ub97c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1311", "t": "\ub85c\ubc0d \uc911\uc5d0 \ud14c\ub354\ub9c1\uc744 \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub85c\ubc0d \uc0c1\ud488 \uc81c\uacf5\ub7c9 \uc548\uc5d0\uc11c \ud14c\ub354\ub9c1\uc744 \uc774\uc6a9\ud560 \uc218 \uc788\uc73c\uba70 \ud14c\ub354\ub9c1\uc73c\ub85c \uc4f4 \ub370\uc774\ud130\ub3c4 \uac19\uc740 \ub85c\ubc0d \ub370\uc774\ud130 \uc81c\uacf5\ub7c9\uc5d0\uc11c \ucc28\uac10\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "1645", "t": "\ud734\ub300\ud3f0\uc744 USB \ucf00\uc774\ube14\ub85c \uc5f0\uacb0\ud574 \ucef4\ud4e8\ud130\uc5d0\uc11c \uc778\ud130\ub137\uc744 \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \ub370\uc774\ud130 \uc804\uc1a1\uc774 \uac00\ub2a5\ud55c USB \ucf00\uc774\ube14\ub85c \ucef4\ud4e8\ud130\uc5d0 \uc5f0\uacb0\ud55c \ub4a4 USB \ud14c\ub354\ub9c1\uc744 \ucf1c\uba74 \ucef4\ud4e8\ud130\uc5d0\uc11c \uc778\ud130\ub137\uc744 \uc4f8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "USB \ud14c\ub354\ub9c1\uc744 \uc774\uc6a9\ud558\ub824\uba74 \ucef4\ud4e8\ud130 \uc6b4\uc601\uccb4\uc81c\uc640 \ub4dc\ub77c\uc774\ubc84 \uc9c0\uc6d0\uc744 \ud655\uc778\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "USB \ud14c\ub354\ub9c1 \uc0ac\uc6a9\ub7c9\uc740 \ud574\ub2f9 \ud68c\uc120\uc758 \ud14c\ub354\ub9c1 \uc870\uac74\uc5d0 \ub530\ub77c \uc801\uc6a9\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "170", "t": "\ud14c\ub354\ub9c1\uc73c\ub85c \uc4f4 \ub370\uc774\ud130\ub294 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud14c\ub354\ub9c1\uc73c\ub85c \uc0ac\uc6a9\ud55c \ub370\uc774\ud130\ub294 \uc571\uc758 \uc0ac\uc6a9\ub7c9 \ud654\uba74\uc5d0\uc11c \uc250\uc5b4\ub9c1 \ub370\uc774\ud130\uc640 \ud569\uc0b0\ub41c \uc0ac\uc6a9\ub7c9\uc73c\ub85c \ubcfc \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud14c\ub354\ub9c1\uacfc \uc250\uc5b4\ub9c1\uc5d0 \uc81c\uacf5\ub418\ub294 \ub370\uc774\ud130\ub294 5G \ud504\ub9ac\ubbf8\uc5c4 \uc694\uae08\uc81c\uc5d0\uc11c \uc6d4 50GB, 5G \uc2a4\ud0e0\ub2e4\ub4dc \uc694\uae08\uc81c\uc5d0\uc11c \uc6d4 30GB\uc785\ub2c8\ub2e4.", "y": 0}]}, {"id": "1767", "t": "\ud14c\ub354\ub9c1 \ub73b\uc774 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc758 \ubaa8\ubc14\uc77c \ub370\uc774\ud130 \uc5f0\uacb0\uc744 \ub2e4\ub978 \uae30\uae30\uc640 \uacf5\uc720\ud558\ub294 \uae30\ub2a5\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc640\uc774\ud30c\uc774 \ud56b\uc2a4\ud31f\u00b7USB\u00b7\ube14\ub8e8\ud22c\uc2a4 \ubc29\uc2dd\uc774 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "26", "t": "\ud56b\uc2a4\ud31f\uc5d0\ub3c4 \ub370\uc774\ud130 \uc81c\ud55c\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud56b\uc2a4\ud31f\uc5d0 \uc801\uc6a9\ub418\ub294 \ud14c\ub354\ub9c1 \ub370\uc774\ud130 \uc81c\uacf5\ub7c9\uc774\ub098 \uc18d\ub3c4 \uc81c\ud55c\uc740 \uc694\uae08\uc81c\uc5d0 \ub530\ub77c \ub2e4\ub97c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0116", "q": "\uae30\uae30\ubcc0\uacbd", "g": "ANS", "f": [{"id": "1389", "t": "\uae30\uae30 \ubcc0\uacbd\uc774 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uae30\uae30 \ubcc0\uacbd\uc740 Ubot \uc804\ud654\ubc88\ud638\uc640 \uc694\uae08\uc81c\ub97c \uadf8\ub300\ub85c \ub450\uace0 \ud734\ub300\ud3f0\ub9cc \uc0c8 \uae30\uae30\ub85c \ubc14\uafb8\ub294 \uac83\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uae30\uae30 \ubcc0\uacbd\uc740 \uc571\u00b7\ud648\ud398\uc774\uc9c0\u00b7\ub9e4\uc7a5\uc5d0\uc11c \uc0c8 \ud734\ub300\ud3f0\uc744 \uc8fc\ubb38\ud558\uac70\ub098 \uac00\uc9c4 \ud734\ub300\ud3f0\uc5d0 \uc720\uc2ec\uc744 \uc62e\uaca8 \ub07c\uc6cc \uc9c4\ud589\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1390", "t": "\uc911\uace0\ud3f0\uc73c\ub85c \uae30\uae30 \ubcc0\uacbd\uc744 \ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4\u00b7\ub3c4\ub09c \uc2e0\uace0\uac00 \uc5c6\ub294 \uc911\uace0\ud3f0\uc774\ub77c\uba74 Ubot \uc720\uc2ec\uc744 \uc62e\uaca8 \ub07c\uc6cc \uae30\uae30 \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc911\uace0\ud3f0\uc73c\ub85c \uae30\uae30 \ubcc0\uacbd\ud558\uba74 \uacf5\uc2dc\uc9c0\uc6d0\uae08\uc740 \ubc1b\uc744 \uc218 \uc5c6\uc9c0\ub9cc \uc120\ud0dd\uc57d\uc815 \ud560\uc778\uc740 \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1408", "t": "\ub4c0\uc5bc\ubc88\ud638\ub97c \uc4f0\ub294\ub370 \ud734\ub300\ud3f0\uc744 \ubc14\uafb8\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ub4c0\uc5bc\ubc88\ud638 \uc8fc \ud68c\uc120\uc758 \ud734\ub300\ud3f0\uc744 \ubc14\uafb8\uba74 \uc0c8 \ud734\ub300\ud3f0\uc5d0\uc11c \ub4c0\uc5bc\ubc88\ud638 eSIM\uc744 \ub2e4\uc2dc \ubc1c\uae09\ubc1b\uc544\uc57c \ud569\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud734\ub300\ud3f0 \ubcc0\uacbd \ud6c4 \uc571\uc758 \ub4c0\uc5bc\ubc88\ud638 \uba54\ub274\uc5d0\uc11c \uae30\uae30 \ubcc0\uacbd\uc744 \uc2e0\uccad\ud558\uba74 \uc0c8 QR \ucf54\ub4dc\uac00 \ubc1c\uae09\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1461", "t": "\ubd84\uc2e4 \uc2e0\uace0\ub41c \ud734\ub300\ud3f0\uc73c\ub85c \uae30\uae30 \ubcc0\uacbd\uc744 \ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4\u00b7\ub3c4\ub09c \uc2e0\uace0\ub41c \ud734\ub300\ud3f0\uc740 \uad6d\ub0b4 \ud1b5\uc2e0\uc0ac\uc5d0\uc11c \uac1c\ud1b5\uc774 \ucc28\ub2e8\ub418\uc5b4 \uae30\uae30 \ubcc0\uacbd\uc5d0 \uc4f8 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ubcf8\uc778 \ud734\ub300\ud3f0\uc744 \ucc3e\uc558\ub2e4\uba74 \uae30\uae30 \ubcc0\uacbd \uc804\uc5d0 \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud574\uc81c\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "223", "t": "\uc57d\uc815 \uae30\uac04\uc5d0 \ud734\ub300\ud3f0\ub9cc \ubc14\uafd4\ub3c4 \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\uc120\ud0dd\uc57d\uc815 \uae30\uac04 \uc911\uc5d0\ub3c4 \uc57d\uc815\uc744 \uc720\uc9c0\ud55c \ucc44 \ud734\ub300\ud3f0\ub9cc \ubc14\uafc0 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc57d\uc815 \uc911 \uc0c8 \ud734\ub300\ud3f0\uc744 \ud560\ubd80\ub85c \uad6c\ub9e4\ud558\uba74 \uc0c8 \ub2e8\ub9d0\uc758 \ud560\ubd80\uae08\uc740 \ubcc4\ub3c4\ub85c \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "321", "t": "\uae30\uae30\ubcc0\uacbd\uc740 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uae30\uae30\ubcc0\uacbd\uc740 \uc571\uc5d0\uc11c \uc2e0\uccad\ud558\uac70\ub098 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud574 \uc9c4\ud589\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uae30\uae30\ubcc0\uacbd\uc744 \ud574\ub3c4 \uae30\uc874 \uc694\uae08\uc81c\ub97c \uadf8\ub300\ub85c \uc720\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "7", "t": "\ud734\ub300\ud3f0\uc744 \ubc14\uafb8\uba74\uc11c \ud1b5\uc2e0\uc0ac\ub3c4 \ubcc0\uacbd\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \ubc14\uafb8\uba74\uc11c \ud1b5\uc2e0\uc0ac\ub3c4 \ubcc0\uacbd\ud558\ub824\uba74 \ubc88\ud638\uc774\ub3d9\uacfc \uae30\uae30 \ubcc0\uacbd\uc744 \ud568\uaed8 \uc9c4\ud589\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "95", "t": "\ud734\ub300\ud3f0\uc744 \uc911\uace0 \uae30\uae30\ub85c \ubcc0\uacbd\ud574\ub3c4 \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\uc911\uace0 \ud734\ub300\ud3f0\uc774 \uc815\uc0c1 \uc0ac\uc6a9 \uac00\ub2a5\ud55c \ub2e8\ub9d0\uae30\ub77c\uba74 \uae30\uc874 \uc720\uc2ec\uc744 \uc7a5\ucc29\ud558\uac70\ub098 \uae30\uae30 \ubcc0\uacbd \uc808\ucc28\ub97c \uac70\uccd0 \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0117", "q": "\ub2e8\ub9d0 \ud560\ubd80", "g": "ANS", "f": [{"id": "1184", "t": "\ud560\ubd80\ub97c 24\uac1c\uc6d4\ub85c \ud588\ub294\ub370 \ud560\ubd80\uae08\uc774 25\ubc88 \uccad\uad6c\ub410\uc5b4\uc694.", "s": [{"i": 0, "t": "\ub2e8\ub9d0 \ud560\ubd80\uae08\uc740 \ud558\ub8e8 \ub2e8\uc704\ub85c \uacc4\uc0b0\ud574 \ub9e4\uc6d4 1\uc77c\ubd80\ud130 \ub9d0\uc77c\uae4c\uc9c0\uc758 \uae08\uc561\uc744 \ub2e4\uc74c \ub2ec\uc5d0 \uccad\uad6c\ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0\uc744 \uc6d4 \uc911\uac04\uc5d0 24\uac1c\uc6d4 \ud560\ubd80\ub85c \uc0c0\ub2e4\uba74 \uccab \ub2ec\uacfc \ub9c8\uc9c0\ub9c9 \ub2ec \uae08\uc561\uc774 \ub098\ub258\uc5b4 \uccad\uad6c \ud69f\uc218\uac00 25\ubc88\uc774 \ub420 \uc218 \uc788\uc9c0\ub9cc \uc804\uccb4 \uae08\uc561\uc740 \uac19\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1185", "t": "\ub0a8\uc740 \ub2e8\ub9d0 \ud560\ubd80\uae08\uc744 \ud55c \ubc88\uc5d0 \ub0bc \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub0a8\uc740 \ub2e8\ub9d0 \ud560\ubd80\uae08\uc758 \uc804\uccb4 \ub610\ub294 \uc77c\ubd80\ub294 \uace0\uac1d\uc13c\ud130(114)\ub098 \ub9e4\uc7a5\uc5d0\uc11c \ud55c \ubc88\uc5d0 \ub0bc \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc571\uc5d0\uc11c\ub294 \ub0a8\uc740 \ub2e8\ub9d0 \ud560\ubd80\uae08\uc744 \uc870\ud68c\ub9cc \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1397", "t": "\ub0a8\uc740 \ud560\ubd80\uae08\uc740 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\uc758 \uac00\uc785 \uc815\ubcf4\uc5d0\uc11c \ub0a8\uc740 \ud560\ubd80 \uc6d0\uae08, \ub0a8\uc740 \uac1c\uc6d4 \uc218, \uc774\ubc88 \ub2ec \ud560\ubd80\uae08\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1773", "t": "\ub2e8\ub9d0 \ud560\ubd80\uae08 \ub73b\uc774 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uad6c\ub9e4 \ub300\uae08\uc744 \uc5ec\ub7ec \ub2ec\uc5d0 \ub098\ub204\uc5b4 \ub0a9\ubd80\ud558\ub294 \uae08\uc561\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud1b5\uc2e0\uc694\uae08\uacfc \ubcc4\ub3c4 \ud56d\ubaa9\uc785\ub2c8\ub2e4.", "y": 1}]}, {"id": "230", "t": "\uc783\uc5b4\ubc84\ub9b0 \ud734\ub300\ud3f0\uc758 \ud560\ubd80\uae08\uc740 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4\ud55c \ud734\ub300\ud3f0\uc758 \ub2e8\ub9d0 \ud560\ubd80\uae08\uc740 \uae30\uae30 \uc0ac\uc6a9 \uc5ec\ubd80\uc640 \uad00\uacc4\uc5c6\uc774 \ub0a8\uc740 \uae08\uc561\uc774 \uacc4\uc18d \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ubd84\uc2e4\ud55c \ud734\ub300\ud3f0\uc758 \ud560\ubd80\uae08\uc744 \ud55c \ubc88\uc5d0 \uc815\ub9ac\ud558\ub824\uba74 \uc571\uc774\ub098 \ub9e4\uc7a5\uc5d0\uc11c \uc911\ub3c4 \uc644\ub0a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0118", "q": "\ud560\ubd80 \uc794\uc561", "g": "ANS", "f": [{"id": "1397", "t": "\ub0a8\uc740 \ud560\ubd80\uae08\uc740 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\uc758 \uac00\uc785 \uc815\ubcf4\uc5d0\uc11c \ub0a8\uc740 \ud560\ubd80 \uc6d0\uae08, \ub0a8\uc740 \uac1c\uc6d4 \uc218, \uc774\ubc88 \ub2ec \ud560\ubd80\uae08\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1547", "t": "\uc81c \ud734\ub300\ud3f0 \ud560\ubd80\uae08\uc774 \uc5bc\ub9c8\ub098 \ub0a8\uc558\ub098\uc694?", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc758 \ud560\ubd80 \uae30\uae30\uba85, \ud560\ubd80 \uac1c\uc6d4 \uc218\uc640 \ub0b8 \uac1c\uc6d4 \uc218, \uc6d4 \ud560\ubd80\uae08, \ub0a8\uc740 \ud560\ubd80 \uc6d0\uae08\uc744 \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "1855", "t": "\uc794\uc5ec \ud560\ubd80\uae08 \ub73b\uc740 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uc544\uc9c1 \ub0a9\ubd80\ud558\uc9c0 \uc54a\uc740 \ud734\ub300\ud3f0 \ud560\ubd80 \ub300\uae08\uc785\ub2c8\ub2e4.", "y": 1}]}, {"id": "215", "t": "\ub0a8\uc740 \ud560\ubd80\uae08\uc774 \uc5bc\ub9c8\uc778\uc9c0 \uc5b4\ub514\uc5d0\uc11c \ubcf4\ub098\uc694?", "s": [{"i": 0, "t": "\ub0a8\uc740 \ub2e8\ub9d0 \ud560\ubd80 \uc6d0\uae08\uacfc \ud560\ubd80 \ud68c\ucc28\ub294 \uc571\uc758 \uac00\uc785 \uc815\ubcf4\ub098 \uccad\uad6c \ub0b4\uc5ed\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "772", "t": "\uc9c0\uae08 \ud560\ubd80\ub97c \ud55c \ubc88\uc5d0 \uac1a\uc73c\uba74 \uc5bc\ub9c8\ub97c \ub0b4\uc57c \ud574\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ub2e8\ub9d0 \ud560\ubd80 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \uc624\ub298 \ud55c \ubc88\uc5d0 \uac1a\uc744 \ub54c \ud544\uc694\ud55c \uc911\ub3c4 \uc644\ub0a9 \uae08\uc561\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub2e8\ub9d0 \ud560\ubd80\ub97c \uc911\ub3c4 \uc644\ub0a9\ud560 \ub54c\ub294 \ub0a8\uc740 \uc6d0\uae08\ub9cc \ub0a9\ubd80\ud558\uba74 \ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "939", "t": "\ud560\ubd80 \uc6d0\uae08 \ub0a8\uc740 \uac70 \uc5bc\ub9c8\uc608\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ub2e8\ub9d0 \ud560\ubd80 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \ub0a8\uc740 \uc6d0\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0119", "q": "\uc694\uae08 \ub0a9\ubd80", "g": "ANS", "f": [{"id": "1159", "t": "\uccad\uad6c \uc694\uae08\uacfc \ub0a9\ubd80 \ub0b4\uc5ed\uc740 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uccad\uad6c \uc694\uae08\uacfc \ub0a9\ubd80 \ub0b4\uc5ed\uc740 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc758 \uc694\uae08 \uc870\ud68c \uba54\ub274\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc571\uc5d0\uc11c\ub294 \ucd5c\uadfc 12\uac1c\uc6d4\uc758 \uc694\uae08 \ub0b4\uc5ed\uc744 \uc870\ud68c\ud560 \uc218 \uc788\uc73c\uba70 \ub354 \uc624\ub798\ub41c \ub0b4\uc5ed\uc740 \uace0\uac1d\uc13c\ud130\uc5d0 \uc694\uccad\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1160", "t": "\uc694\uae08 \ub0a9\ubd80\uc77c\uc740 \uc5b8\uc81c\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc694\uae08\uc758 \uae30\ubcf8 \ub0a9\ubd80\uc77c\uc740 \ub9e4\uc6d4 21\uc77c\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uacc4\uc88c\u00b7\uce74\ub4dc \uc790\ub3d9\uc774\uccb4\ub97c \uc774\uc6a9\ud55c\ub2e4\uba74 \ub0a9\ubd80\uc77c\uc744 10\uc77c, 15\uc77c, 21\uc77c, 25\uc77c \uc911\uc5d0\uc11c \uc120\ud0dd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1162", "t": "\uc694\uae08\uc740 \uc5b4\ub5a4 \ubc29\ubc95\uc73c\ub85c \ub0bc \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uacc4\uc88c \uc790\ub3d9\uc774\uccb4, \uce74\ub4dc \uc790\ub3d9\ub0a9\ubd80, \uc571\u00b7\ud648\ud398\uc774\uc9c0 \uc989\uc2dc \ub0a9\ubd80(\uacc4\uc88c\uc774\uccb4\u00b7\uce74\ub4dc), \uccad\uad6c\uc11c\uc5d0 \uc801\ud78c \uac00\uc0c1\uacc4\uc88c \uc785\uae08, \ub9e4\uc7a5 \uc218\ub0a9\uc73c\ub85c \ub0bc \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1182", "t": "\ub0a9\ubd80 \ud655\uc778\uc11c\ub294 \uc5b4\ub514\uc5d0\uc11c \ubc1c\uae09\ubc1b\ub098\uc694?", "s": [{"i": 0, "t": "\ub0a9\ubd80 \ud655\uc778\uc11c\ub294 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ucd5c\uadfc 5\ub144 \uce58\uae4c\uc9c0 \ubc14\ub85c \ubc1c\uae09\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud574\uc9c0\ud55c \ud68c\uc120\uc758 \ub0a9\ubd80 \ud655\uc778\uc11c\ub294 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud558\uac70\ub098 \uace0\uac1d\uc13c\ud130\uc5d0 \uc694\uccad\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "126", "t": "\ud734\ub300\ud3f0 \uc694\uae08 \ub0a9\ubd80 \ud655\uc778\uc11c\ub294 \uc5b4\ub514\uc11c \ubc1c\uae09\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc571\uc774\ub098 \ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ucd5c\uadfc 5\ub144 \uce58 \ub0a9\ubd80 \ud655\uc778\uc11c\ub97c \ubc1c\uae09\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1535", "t": "\uc81c \uc694\uae08 \ub0a9\ubd80 \uae30\ud55c\uc774 \uc5b8\uc81c\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc758 \uc774\ubc88 \uccad\uad6c \uc694\uae08 \ub0a9\ubd80 \uae30\ud55c\uacfc \ub0a8\uc740 \uae08\uc561\uc744 \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0121", "q": "\uc601\uc218\uc99d \ubc1c\uae09", "g": "ANS", "f": [{"id": "1026", "t": "\ud1b5\uc2e0\uc694\uae08\ub3c4 \ud604\uae08\uc601\uc218\uc99d\uc774\ub098 \uc18c\ub4dd\uacf5\uc81c \uc99d\ube59\uc744 \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud1b5\uc2e0 \uc694\uae08 \uc790\uccb4\ub294 \ud604\uae08\uc601\uc218\uc99d\uc774 \ubc1c\uae09\ub418\uc9c0 \uc54a\uc73c\uba70 \uc5f0\ub9d0\uc815\uc0b0 \uc18c\ub4dd\uacf5\uc81c \ub300\uc0c1\ub3c4 \uc544\ub2d9\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud1b5\uc2e0 \uc694\uae08 \ub0a9\ubd80 \uc0ac\uc2e4\uc774 \ud544\uc694\ud55c \uacbd\uc6b0 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ub0a9\ubd80 \ud655\uc778\uc11c\ub97c \ubc1c\uae09\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\uae30\uae30 \ud560\ubd80\uae08\uc774\ub098 \uc720\uc2ec\u00b7eSIM \ube44\uc6a9 \ub4f1\uc744 \ud604\uae08\uc73c\ub85c \ub0b8 \uacbd\uc6b0\uc758 \ud604\uae08\uc601\uc218\uc99d \ubc1c\uae09 \uc5ec\ubd80\ub294 \uacb0\uc81c \ub0b4\uc5ed\uc5d0\uc11c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1182", "t": "\ub0a9\ubd80 \ud655\uc778\uc11c\ub294 \uc5b4\ub514\uc5d0\uc11c \ubc1c\uae09\ubc1b\ub098\uc694?", "s": [{"i": 0, "t": "\ub0a9\ubd80 \ud655\uc778\uc11c\ub294 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ucd5c\uadfc 5\ub144 \uce58\uae4c\uc9c0 \ubc14\ub85c \ubc1c\uae09\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud574\uc9c0\ud55c \ud68c\uc120\uc758 \ub0a9\ubd80 \ud655\uc778\uc11c\ub294 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud558\uac70\ub098 \uace0\uac1d\uc13c\ud130\uc5d0 \uc694\uccad\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1183", "t": "\ud1b5\uc2e0 \uc694\uae08\ub3c4 \ud604\uae08\uc601\uc218\uc99d\uc744 \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud1b5\uc2e0 \uc694\uae08\uc740 \ubd80\uac00\uc138\uac00 \ud3ec\ud568\ub41c \uc138\uae08\uacc4\uc0b0\uc11c \ub300\uc0c1\uc774\ub77c \ud604\uae08\uc601\uc218\uc99d\uc774 \ubc1c\uae09\ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uae30\uae30 \ud560\ubd80\uae08, \uc720\uc2ec\u00b7eSIM \ube44\uc6a9, \ud734\ub300\ud3f0 \uacb0\uc81c \uae08\uc561\uc744 \ud604\uae08\uc73c\ub85c \ub0b8 \uacbd\uc6b0\uc5d0\ub294 \ud604\uae08\uc601\uc218\uc99d\uc744 \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "126", "t": "\ud734\ub300\ud3f0 \uc694\uae08 \ub0a9\ubd80 \ud655\uc778\uc11c\ub294 \uc5b4\ub514\uc11c \ubc1c\uae09\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc571\uc774\ub098 \ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ucd5c\uadfc 5\ub144 \uce58 \ub0a9\ubd80 \ud655\uc778\uc11c\ub97c \ubc1c\uae09\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1316", "t": "\ub85c\ubc0d \uc694\uae08 \uc601\uc218\uc99d\uc744 \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub85c\ubc0d \uc694\uae08 \uc601\uc218\uc99d\uc73c\ub85c Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ub85c\ubc0d \uc774\uc6a9 \ub0b4\uc5ed\uacfc \uc694\uae08\uc774 \ud45c\uc2dc\ub41c \uccad\uad6c\uc11c\ub97c \ub0b4\ub824\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ucd9c\uc7a5\ube44 \uc815\uc0b0\uc6a9 \ub85c\ubc0d \uc99d\ube59\uc774 \ud544\uc694\ud558\uba74 \uace0\uac1d\uc13c\ud130\uc5d0 \ub85c\ubc0d \uc774\uc6a9 \ud655\uc778\uc11c\ub97c \uc694\uccad\ud574 \uc8fc\uc138\uc694.", "y": 0}]}]}, {"id": "Q0122", "q": "\uac00\uc785 \uc99d\uba85\uc11c", "g": "ANS", "f": [{"id": "1063", "t": "\uac00\uc785 \uc0ac\uc2e4 \ud655\uc778\uc11c\ub97c \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uac00\uc785 \uc0ac\uc2e4 \ud655\uc778\uc11c\ub294 \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubc14\ub85c \ubc1c\uae09\ubc1b\uac70\ub098 \ub9e4\uc7a5\u00b7\uace0\uac1d\uc13c\ud130\uc5d0 \uc694\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1439", "t": "\ud574\uc9c0 \uc99d\uba85\uc11c\ub098 \uac00\uc785 \uc99d\uba85\uc11c\ub97c \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uac00\uc785 \uc911\uc778 \ud68c\uc120\uc758 \uac00\uc785 \uc99d\uba85\uc11c\ub294 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubc14\ub85c \ubc1c\uae09\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud574\uc9c0\ud55c \ud68c\uc120\uc758 \ud574\uc9c0 \uc99d\uba85\uc11c\ub294 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud558\uac70\ub098 \uace0\uac1d\uc13c\ud130\uc5d0 \uc694\uccad\ud558\uba74 \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0123", "q": "\uba85\uc758\ub3c4\uc6a9", "g": "ANS", "f": [{"id": "1463", "t": "\uba85\uc758\ub3c4\uc6a9\uc744 \ub2f9\ud55c \uac83 \uac19\uc544\uc694. \uc5b4\ub5bb\uac8c \ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uba85\uc758\ub3c4\uc6a9\uc774 \uc758\uc2ec\ub418\uba74 \ubc14\ub85c \uace0\uac1d\uc13c\ud130(114)\uc5d0 \uc2e0\uace0\ud558\uace0 \ud55c\uad6d\uc815\ubcf4\ud1b5\uc2e0\uc9c4\ud765\ud611\ud68c\uc758 \uba85\uc758\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4(\uc5e0\uc138\uc774\ud37c)\uc5d0\uc11c \ub0b4 \uba85\uc758\ub85c \uac00\uc785\ub41c \ud68c\uc120\uc744 \ubaa8\ub450 \uc870\ud68c\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9\uc73c\ub85c \ud655\uc778\ub41c \ud68c\uc120\uc740 \uacbd\ucc30 \uc2e0\uace0 \uc811\uc218\uc99d\uacfc \ud568\uaed8 \ub9e4\uc7a5\uc5d0\uc11c \ud574\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1464", "t": "\uba85\uc758\ub3c4\uc6a9\uc744 \ubbf8\ub9ac \ub9c9\uc744 \uc218 \uc788\ub294 \ubc29\ubc95\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc5e0\uc138\uc774\ud37c(M-Safer)\uc5d0\uc11c \uac00\uc785 \uc81c\ud55c \uc11c\ube44\uc2a4\ub97c \uc2e0\uccad\ud558\uba74 \ub2e4\ub978 \uc0ac\ub78c\uc774 \ub0b4 \uba85\uc758\ub85c \uc0c8 \ud734\ub300\ud3f0\uc744 \uac1c\ud1b5\ud558\ub294 \uac83\uc744 \ub9c9\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9\uc744 \ub9c9\uc73c\ub824\uba74 \uc2e0\ubd84\uc99d \uc0ac\ubcf8\uc744 \ud568\ubd80\ub85c \ubcf4\ub0b4\uc9c0 \ub9d0\uace0 \uc2e0\ubd84\uc99d\uc744 \uc783\uc5b4\ubc84\ub838\ub2e4\uba74 \ubc14\ub85c \ubd84\uc2e4 \uc2e0\uace0\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1519", "t": "\uba85\uc758\ub3c4\uc6a9 \uc2e0\uace0\ub97c \uc811\uc218\ud558\ub294 \ub9e4\uc7a5\uc774 \uc5b4\ub514\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uba85\uc758\ub3c4\uc6a9 \uc2e0\uace0 \uc811\uc218\ub97c \uc9c0\uc6d0\ud558\ub294 Ubot \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9 \uc2e0\uace0 \uc811\uc218\ub97c \uc704\ud574 \ub9e4\uc7a5\uc5d0 \ubc29\ubb38\ud560 \ub54c\ub294 \uc2e0\ubd84\uc99d\uacfc \uacbd\ucc30 \uc2e0\uace0 \uc811\uc218\uc99d\uc744 \ucc59\uaca8 \uc8fc\uc138\uc694.", "y": 0}]}]}, {"id": "Q0124", "q": "\ubc88\ud638 \ubcc0\uacbd", "g": "ANS", "f": [{"id": "1091", "t": "\ubc88\ud638\ub97c \ubcc0\uacbd\ud558\uba74 \ud648\ud398\uc774\uc9c0 \ud68c\uc6d0 \uc815\ubcf4\ub3c4 \ubc14\uafd4\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \ud68c\uc6d0 \uacc4\uc815\uc740 \uc774\uba54\uc77c\ub85c \ub85c\uadf8\uc778\ud558\ubbc0\ub85c \ud734\ub300\ud3f0 \ubc88\ud638\ub97c \ubc14\uafd4\ub3c4 \ud648\ud398\uc774\uc9c0 \ud68c\uc6d0 \uacc4\uc815\uc744 \ub2e4\uc2dc \ub9cc\ub4e4 \ud544\uc694\uac00 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \ubc88\ud638\ub97c \ubc14\uafe8\ub2e4\uba74 \uc740\ud589\uc774\ub098 \uc1fc\ud551\ubab0 \ub4f1 \ub2e4\ub978 \uc11c\ube44\uc2a4\uc5d0 \ub4f1\ub85d\ud55c \ubc88\ud638\ub294 \uac01 \uc11c\ube44\uc2a4\uc5d0\uc11c \uc9c1\uc811 \ubcc0\uacbd\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "144", "t": "\ubc88\ud638\ub97c \ubc14\uafc0 \ub54c \ub4b7\uc790\ub9ac\ub97c \uc9c1\uc811 \uace0\ub97c \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638 \ubcc0\uacbd \uc2dc\uc5d0\ub3c4 \uc0ac\uc6a9 \uac00\ub2a5\ud55c \ubc88\ud638 \ubaa9\ub85d\uc5d0\uc11c \ub4b7\uc790\ub9ac\ub85c \uac80\uc0c9\ud574 \uc6d0\ud558\ub294 \ubc88\ud638\ub97c \uace0\ub97c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1837", "t": "\ubc88\ud638 \ubcc0\uacbd \ub73b\uc740 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ud1b5\uc2e0\uc0ac\ub294 \uc720\uc9c0\ud558\uba74\uc11c \ud604\uc7ac \ud68c\uc120\uc758 \uc804\ud654\ubc88\ud638\ub97c \ub2e4\ub978 \ubc88\ud638\ub85c \ubc14\uafb8\ub294 \uac83\uc785\ub2c8\ub2e4.", "y": 1}]}, {"id": "4", "t": "\ud734\ub300\ud3f0 \ubc88\ud638\ub97c \ubcc0\uacbd\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ubc88\ud638 \ubcc0\uacbd\uc740 \ubcf8\uc778 \uc778\uc99d \ud6c4 \ud648\ud398\uc774\uc9c0, \uace0\uac1d\uc13c\ud130 \ub610\ub294 \ub9e4\uc7a5\uc5d0\uc11c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0125", "q": "\uc120\ubd88\ud3f0 \ucda9\uc804", "g": "ANS", "f": [{"id": "1153", "t": "\uc120\ubd88 \uc694\uae08\uc81c\uac00 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot\uc740 \uc678\uad6d\uc778\ub4f1\ub85d\uc99d\uc774 \uc5c6\ub294 \uc678\uad6d\uc778\uacfc \ub2e8\uae30 \uc774\uc6a9\uc790\ub97c \uc704\ud55c \uc120\ubd88 \uc694\uae08\uc81c\ub97c \uc81c\uacf5\ud569\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "Ubot \uc120\ubd88 \uc694\uae08\uc81c\ub294 \ub9e4\uc7a5\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \uac00\uc785\ud558\uba70 \ucda9\uc804\ud55c \uae08\uc561\ub9cc\ud07c \uc0ac\uc6a9\ud558\ub294 \ubc29\uc2dd\uc785\ub2c8\ub2e4.", "y": 0}]}, {"id": "1154", "t": "\uc120\ubd88 \uc694\uae08\uc81c\ub294 \uc5b4\ub5bb\uac8c \ucda9\uc804\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc120\ubd88 \uc694\uae08\uc81c\ub294 \uc571\u00b7\ud648\ud398\uc774\uc9c0, \uace0\uac1d\uc13c\ud130, \ub9e4\uc7a5\uc5d0\uc11c 5,000\uc6d0, 10,000\uc6d0, 30,000\uc6d0, 50,000\uc6d0 \ub2e8\uc704\ub85c \ucda9\uc804\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc120\ubd88 \ucda9\uc804 \uae08\uc561\uc740 \ucda9\uc804\uc77c\ubd80\ud130 1\ub144 \uc548\uc5d0 \uc0ac\uc6a9\ud574\uc57c \ud558\uba70 \ub0a8\uc740 \uae08\uc561\uc740 \uc18c\uba78\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1655", "t": "\uc120\ubd88 \ud734\ub300\ud3f0\uc740 \ucda9\uc804\ud558\uc9c0 \uc54a\uc73c\uba74 \ubc88\ud638\uac00 \uc5c6\uc5b4\uc9c0\ub098\uc694?", "s": [{"i": 0, "t": "\uc120\ubd88 \ud68c\uc120\uc740 \ucda9\uc804 \uae08\uc561\u00b7\uc0c1\ud488\uc5d0 \uc815\ud574\uc9c4 \uc0ac\uc6a9\uae30\uac04\uc774 \uc788\uace0 \uae30\uac04\uc774 \uc9c0\ub098\uba74 \uc774\uc6a9 \uc81c\ud55c\uc774\ub098 \ud574\uc9c0\ub85c \uc774\uc5b4\uc9c8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc120\ubd88 \ubc88\ud638\ub97c \uc720\uc9c0\ud558\ub824\uba74 \ucda9\uc804 \uc794\uc561\ubfd0 \uc544\ub2c8\ub77c \ud574\ub2f9 \uc0c1\ud488\uc758 \ub9cc\ub8cc\uc77c\uacfc \ubc88\ud638 \uc720\uc9c0 \uc870\uac74\uc744 \ud655\uc778\ud558\uc138\uc694.", "y": 0}]}, {"id": "1657", "t": "\uc120\ubd88 \uc694\uae08\uc81c\uc758 \ucda9\uc804 \uc794\uc561\uc740 \uc5b4\ub514\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc120\ubd88 \uc694\uae08\uc81c \ucda9\uc804 \uc794\uc561\uc740 \uc11c\ube44\uc2a4 \uc81c\uacf5 \uc0ac\uc5c5\uc790\uc758 \uc571\u00b7\ud648\ud398\uc774\uc9c0\u00b7ARS \ub4f1 \uc9c0\uc6d0\ub418\ub294 \ubc29\ubc95\uc73c\ub85c \uc870\ud68c\ud558\uc138\uc694.", "y": 0}, {"i": 1, "t": "\uc120\ubd88 \ucda9\uc804 \uc794\uc561\uacfc \ub370\uc774\ud130 \uc794\uc5ec\ub7c9\uc740 \uc11c\ub85c \ub2e4\ub978 \ud56d\ubaa9\uc77c \uc218 \uc788\uc73c\ubbc0\ub85c \ud655\uc778\ud558\ub824\ub294 \ud56d\ubaa9\uc744 \uad6c\ubd84\ud574 \uc870\ud68c\ud558\uc138\uc694.", "y": 0}]}]}, {"id": "Q0126", "q": "\ub370\uc774\ud130 \uc774\uc6d4", "g": "ANS", "f": [{"id": "1883", "t": "\ub370\uc774\ud130 \uc774\uc6d4 \ub73b\uc740 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uc774\ubc88 \uc0ac\uc6a9 \uae30\uac04\uc5d0 \ub0a8\uc740 \ub370\uc774\ud130\ub97c \uc815\ud574\uc9c4 \uc870\uac74\uc5d0 \ub530\ub77c \ub2e4\uc74c \uae30\uac04\uc73c\ub85c \ub118\uae30\ub294 \uac83\uc785\ub2c8\ub2e4.", "y": 1}]}, {"id": "72", "t": "\ub0a8\uc740 \ub370\uc774\ud130\ub97c \ub2e4\uc74c \ub2ec\ub85c \ub118\uae38 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub0a8\uc740 \ub370\uc774\ud130\ub294 \ub370\uc774\ud130 \uc774\uc6d4\uc744 \uc9c0\uc6d0\ud558\ub294 \uc694\uae08\uc81c\uc5d0\uc11c \ub2e4\uc74c \ub2ec\ub85c \ub118\uae38 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0127", "q": "\ud1b5\ud654 \ub300\uae30", "g": "ANS", "f": [{"id": "1239", "t": "\ud1b5\ud654 \uc911\uc5d0 \uac78\ub824 \uc628 \ub2e4\ub978 \uc804\ud654\ub97c \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubb34\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\uc778 Ubot \ud1b5\ud654\uc911 \ub300\uae30\uc5d0 \uac00\uc785\ud558\uace0 \ud734\ub300\ud3f0 \uc124\uc815\uc5d0\uc11c \ud1b5\ud654 \uc911 \ub300\uae30\ub97c \ucf1c\uba74, \ud1b5\ud654 \uc911 \ub2e4\ub978 \uc804\ud654\uac00 \uc624\uba74 \uc54c\ub9bc\uc74c\uc774 \uc6b8\ub824 \ubc14\uafd4 \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1758", "t": "\ud1b5\ud654 \ub300\uae30 \ub73b\uc774 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ud1b5\ud654 \uc911 \uc0c8 \uc804\ud654\uac00 \uc654\uc74c\uc744 \uc54c\ub9ac\uace0 \uc0c1\ud669\uc5d0 \ub530\ub77c \ub450 \ud1b5\ud654\ub97c \uc804\ud658\ud560 \uc218 \uc788\uac8c \ud558\ub294 \uae30\ub2a5\uc785\ub2c8\ub2e4.", "y": 1}]}, {"id": "186", "t": "\ud1b5\ud654 \uc911 \ub300\uae30\ub97c \ub044\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud1b5\ud654 \uc911 \ub300\uae30\ub294 \ud734\ub300\ud3f0 \ud1b5\ud654 \uc124\uc815\uc5d0\uc11c \ud574\uc81c\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud1b5\ud654 \uc911 \ub300\uae30\ub97c \ud574\uc81c\ud558\uba74 \ud1b5\ud654 \uc911\uc5d0 \uc624\ub294 \ub2e4\ub978 \uc804\ud654\uac00 \uc5f0\uacb0\ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0128", "q": "LTE \uc694\uae08\uc81c", "g": "ANS", "f": [{"id": "1001", "t {"id": "19", "t": "\ub370\uc774\ud130\ub97c \ubaa8\ub450 \uc0ac\uc6a9\ud558\uba74 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ub370\uc774\ud130\ub97c \ubaa8\ub450 \uc0ac\uc6a9\ud55c \ub4a4\uc758 \ucc98\ub9ac \ubc29\uc2dd\uc740 \uc694\uae08\uc81c\uc5d0 \ub530\ub77c \ub2e4\ub974\uba70, \ub370\uc774\ud130\uac00 \ucc28\ub2e8\ub418\uac70\ub098 \ucd94\uac00 \uc694\uae08\uc774 \ubd80\uacfc\ub418\uac70\ub098 \uc18d\ub3c4\uac00 \uc81c\ud55c\ub420 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0131", "q": "\uc720\uc2ec \uc783\uc5b4\ubc84\ub9bc \u315c", "g": "ANS", "f": [{"id": "1259", "t": "\uc720\uc2ec\uc744 \uc7ac\ubc1c\uae09(\uad50\uccb4)\ubc1b\uc73c\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc720\uc2ec\uc744 \uc7ac\ubc1c\uae09\ubc1b\uc73c\ub824\uba74 \uba85\uc758\uc790 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud558\uac70\ub098 Ubot \uc571\uc5d0\uc11c \uc2e0\uccad\ud574 \ud0dd\ubc30\ub85c \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc0c8 \uc720\uc2ec\uc744 \ubc1b\uc558\ub2e4\uba74 \uc571\uc5d0\uc11c \uc720\uc2ec \uad50\uccb4 \ub4f1\ub85d\uc744 \ud558\uac70\ub098 \ub9e4\uc7a5\uc5d0\uc11c \ubc14\ub85c \uad50\uccb4\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1454", "t": "\ubd84\uc2e4\ud55c \ud734\ub300\ud3f0\uc758 \uc720\uc2ec\uc744 \ub2e4\ub978 \uc0ac\ub78c\uc774 \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4 \uc815\uc9c0\ub97c \ud558\uba74 \uc783\uc5b4\ubc84\ub9b0 \ud734\ub300\ud3f0\uc758 \uc720\uc2ec\uc73c\ub85c \uc804\ud654\u00b7\ubb38\uc790\u00b7\ub370\uc774\ud130\ub97c \uc4f8 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubd84\uc2e4 \uc804\uc5d0 \uc720\uc2ec PIN \uc7a0\uae08\uacfc \uc720\uc2ec \ubcf4\ud638 \uc11c\ube44\uc2a4\ub97c \ucf1c \ub450\uba74 \ub2e4\ub978 \uc0ac\ub78c\uc774 \uc720\uc2ec\uc744 \uc4f0\ub294 \uc704\ud5d8\uc744 \uc904\uc77c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "55", "t": "\ubd84\uc2e4\ud55c \uc720\uc2ec\uc744 \ub2e4\ub978 \uc0ac\ub78c\uc774 \uc0ac\uc6a9\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4\ud55c \uc720\uc2ec\uc744 \ub2e4\ub978 \uc0ac\ub78c\uc774 \uc0ac\uc6a9\ud558\uc9c0 \ubabb\ud558\ub3c4\ub85d \ud558\ub824\uba74 \ud68c\uc120\uc744 \uc815\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0132", "q": "\ub85c\ubc0d \uaf2d \uc2e0\uccad\ud574\uc57c\ub3fc?", "g": "ANS", "f": [{"id": "30", "t": "\ub85c\ubc0d\uc744 \uc2e0\uccad\ud558\uc9c0 \uc54a\uc544\ub3c4 \ud574\uc678\uc5d0\uc11c \uc0ac\uc6a9\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub85c\ubc0d \uc0c1\ud488\uc744 \uc2e0\uccad\ud558\uc9c0 \uc54a\uc544\ub3c4 \uc790\ub3d9 \ub85c\ubc0d\uc774 \uc9c0\uc6d0\ub418\ub294 \uad6d\uac00\uc5d0\uc11c\ub294 \ud734\ub300\ud3f0\uc744 \uc0ac\uc6a9\ud560 \uc218 \uc788\uc9c0\ub9cc \ub192\uc740 \ub85c\ubc0d \uc694\uae08\uc774 \ubc1c\uc0dd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0133", "q": "\ud574\uc9c0\ud558\uba74 \ub3c8 \ub0b4\uc57c\ub3fc?", "g": "ANS", "f": [{"id": "1419", "t": "\ud574\uc9c0 \uc804\uae4c\uc9c0 \uc4f4 \uc694\uae08\uc740 \uc5b4\ub5bb\uac8c \uccad\uad6c\ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ud68c\uc120\uc744 \ud574\uc9c0\ud558\uba74 \ud574\uc9c0\uc77c\uae4c\uc9c0 \uc4f4 \uc694\uae08\uacfc \ub0a8\uc740 \ud560\ubd80\uae08, \ud560\uc778\ubc18\ud658\uae08\uc774 \uc815\uc0b0\ub418\uc5b4 \ub2e4\uc74c \ub2ec\uc5d0 \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud68c\uc120 \ud574\uc9c0 \uc804\uc5d0 \uc790\ub3d9\uc774\uccb4\ub97c \uc0ac\uc6a9\ud588\ub2e4\uba74 \ub9c8\uc9c0\ub9c9 \uc694\uae08\ub3c4 \ub4f1\ub85d\ub41c \uacc4\uc88c\ub098 \uce74\ub4dc\ub85c \ucd9c\uae08\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1421", "t": "\ud574\uc9c0\ud558\uba74 \ub0a8\uc740 \ub2e8\ub9d0 \ud560\ubd80\uae08\uc740 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ud68c\uc120\uc744 \ud574\uc9c0\ud574\ub3c4 \ub0a8\uc740 \ub2e8\ub9d0 \ud560\ubd80\uae08\uc740 \uc6d0\ub798 \uc77c\uc815\ub300\ub85c \ub9e4\uc6d4 \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud574\uc9c0\ud558\uba74\uc11c \ub2e8\ub9d0 \ud560\ubd80\uae08\uc744 \ud55c \ubc88\uc5d0 \uc815\ub9ac\ud558\ub824\uba74 \ub9e4\uc7a5\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \ub0a8\uc740 \ud560\ubd80\uae08\uc744 \uc77c\uc2dc \ub0a9\ubd80\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1427", "t": "\uc57d\uc815 \uc911\uc5d0 \ud574\uc9c0\ud558\uba74 \uc704\uc57d\uae08\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc120\ud0dd\uc57d\uc815\uc774\ub098 \uacf5\uc2dc\uc9c0\uc6d0\uae08\uc744 \ubc1b\uace0 \uc57d\uc815 \uae30\uac04 \uc548\uc5d0 \ud68c\uc120\uc744 \ud574\uc9c0\ud558\uba74 \ubc1b\uc740 \ud560\uc778 \uae08\uc561 \uc911 \uc77c\ubd80\ub97c \ud560\uc778\ubc18\ud658\uae08\uc73c\ub85c \ub0b4\uc57c \ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc57d\uc815 \uae30\uac04\uc774 \ub9ce\uc774 \uc9c0\ub0a0\uc218\ub85d \ud574\uc9c0\ud560 \ub54c\uc758 \ud560\uc778\ubc18\ud658\uae08\uc740 \uc904\uc5b4\ub4ed\ub2c8\ub2e4.", "y": 0}]}, {"id": "46", "t": "\uc57d\uc815 \uae30\uac04 \uc911 \ud574\uc9c0\ud558\uba74 \uc704\uc57d\uae08\uc774 \ubc1c\uc0dd\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc57d\uc815 \uae30\uac04 \uc911 \ud1b5\uc2e0 \uc11c\ube44\uc2a4\ub97c \ud574\uc9c0\ud558\uba74 \ud560\uc778\uc774\ub098 \uc9c0\uc6d0\uae08\uc744 \ubc1b\uc740 \uacbd\uc6b0 \uacc4\uc57d \uc870\uac74\uc5d0 \ub530\ub77c \uc704\uc57d\uae08\uc774 \ubc1c\uc0dd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0134", "q": "\uba64\ubc84\uc27d \ud3ec\uc778\ud2b8 \uc5b4\ub514\uc11c \uc368", "g": "ANS", "f": [{"id": "1354", "t": "\ud3ec\uc778\ud2b8\ub294 \uc5b4\ub514\uc5d0 \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \ud3ec\uc778\ud2b8\ub294 \ud734\ub300\ud3f0 \uc694\uae08 \ub0a9\ubd80, \ub370\uc774\ud130 \ud50c\ub7ec\uc2a4 \uad6c\ub9e4, \uc561\uc138\uc11c\ub9ac \uad6c\ub9e4\uc5d0 \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "Ubot \ud3ec\uc778\ud2b8\ub294 1\ud3ec\uc778\ud2b8\ub97c 1\uc6d0\uc73c\ub85c \uacc4\uc0b0\ud558\uba70 1,000\ud3ec\uc778\ud2b8 \uc774\uc0c1\ubd80\ud130 \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "276", "t": "\ubd80\uac00\uc11c\ube44\uc2a4 \uc694\uae08\uc744 \ud3ec\uc778\ud2b8\ub85c \ub0bc \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd80\uac00\uc11c\ube44\uc2a4 \uc694\uae08\ub3c4 \ud3ec\ud568\ud55c \uccad\uad6c \uc694\uae08 \ub0a9\ubd80\uc5d0\ub294 \ud3ec\uc778\ud2b8\ub97c \uc6d4 \ucd5c\ub300 5,000\ud3ec\uc778\ud2b8\uae4c\uc9c0 \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud3ec\uc778\ud2b8\ub294 \uccad\uad6c\ub41c \uc694\uae08 \uc804\uccb4\uc5d0 \uc801\uc6a9\ub429\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0135", "q": "\ubc88\ud638\uc774\ub3d9 \ud558\uba74 \ubc88\ud638 \uadf8\ub300\ub85c\uc784?", "g": "ANS", "f": [{"id": "1075", "t": "\ubc88\ud638\uc774\ub3d9\uc774 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9\uc740 \uc4f0\ub358 \ud734\ub300\ud3f0 \ubc88\ud638\ub97c \uadf8\ub300\ub85c \uc720\uc9c0\ud558\uba74\uc11c \ud1b5\uc2e0\uc0ac\ub9cc \ubc14\uafb8\ub294 \uc81c\ub3c4\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "Ubot\uc73c\ub85c \ubc88\ud638\uc774\ub3d9\ud558\uba74 \uc0c8 \ud68c\uc120\uc774 \uac1c\ud1b5\ub418\ub294 \uc989\uc2dc \uc774\uc804 \ud1b5\uc2e0\uc0ac \ud68c\uc120\uc740 \uc790\ub3d9 \ud574\uc9c0\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1083", "t": "\ubc88\ud638\uc774\ub3d9\uc744 \ucca0\ud68c\ud558\uba74 \uc608\uc804 \ud1b5\uc2e0\uc0ac \ubc88\ud638\ub97c \ub2e4\uc2dc \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9\uc744 \ucca0\ud68c\ud55c \ub4a4 \uc608\uc804 \ubc88\ud638\ub97c \uacc4\uc18d \uc4f0\ub824\uba74 \ucca0\ud68c \uc644\ub8cc \ud6c4 4\uc77c \uc548\uc5d0 \uc774\uc804 \ud1b5\uc2e0\uc0ac \ub9e4\uc7a5\uc5d0\uc11c \ub2e4\uc2dc \uac00\uc785\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ubc88\ud638\uc774\ub3d9 \ucca0\ud68c \ud6c4 4\uc77c\uc774 \uc9c0\ub098\uba74 \uc608\uc804 \ubc88\ud638\ub97c \ub418\ucc3e\uc9c0 \ubabb\ud560 \uc218 \uc788\uc73c\ub2c8 \ubc14\ub85c \uc774\uc804 \ud1b5\uc2e0\uc0ac\uc5d0 \ubc29\ubb38\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "3", "t": "\ubc88\ud638\uc774\ub3d9\uc744 \ud558\uba74 \uae30\uc874 \ubc88\ud638\ub97c \uadf8\ub300\ub85c \uc0ac\uc6a9\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9\uc744 \ud574\ub3c4 \uae30\uc874 \uc804\ud654\ubc88\ud638\ub97c \uadf8\ub300\ub85c \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0136", "q": "\ud3f0 \uc783\uc5b4\ubc84\ub838\ub294\ub370", "g": "ANS", "f": [{"id": "1314", "t": "\ud574\uc678\uc5d0\uc11c \ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \uc5b4\ub514\ub85c \uc5f0\ub77d\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud558\uac70\ub098 \ub2e4\ub978 \uc804\ud654\ub85c Ubot \ub85c\ubc0d \uace0\uac1d\uc13c\ud130(24\uc2dc\uac04, \ubc88\ud638\ub294 \ud648\ud398\uc774\uc9c0 \ub85c\ubc0d \uba54\ub274\uc5d0 \uc548\ub0b4)\uc5d0 \uc5f0\ub77d\ud574 \ud68c\uc120\uc744 \uc815\uc9c0\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4\ub85c \ud68c\uc120\uc744 \uc815\uc9c0\ud55c \ub3d9\uc548\uc5d0\ub294 \ub85c\ubc0d \uc694\uae08\uc774 \ubc1c\uc0dd\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1447", "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\uc5b4\uc694. \uc5b4\ub5bb\uac8c \ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \uba3c\uc800 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\ub098 \uace0\uac1d\uc13c\ud130 ARS(114)\uc5d0\uc11c \ubd84\uc2e4 \uc2e0\uace0\uc640 \ubd84\uc2e4 \uc815\uc9c0\ub97c \ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ubd84\uc2e4 \uc815\uc9c0\ub294 \ubb34\ub8cc\uc774\uace0 \ucd5c\ub300 90\uc77c \ub3d9\uc548 \ub2e4\ub978 \uc0ac\ub78c\uc774 \ub0b4 \ubc88\ud638\ub85c \uc804\ud654\u00b7\uacb0\uc81c\ud558\ub294 \uac83\uc744 \ub9c9\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1449", "t": "\uc783\uc5b4\ubc84\ub9b0 \ud734\ub300\ud3f0\uc758 \uc704\uce58\ub97c \ucc3e\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4\ud55c \ud734\ub300\ud3f0\uc758 \uc704\uce58 \ucc3e\uae30 \uae30\ub2a5\uc774 \ucf1c\uc838 \uc788\uc5c8\ub2e4\uba74 \uac24\ub7ed\uc2dc\ub294 \uc0bc\uc131 \ub0b4 \ub514\ubc14\uc774\uc2a4 \ucc3e\uae30, \uc544\uc774\ud3f0\uc740 \ub098\uc758 \ucc3e\uae30\uc5d0\uc11c \uc704\uce58\ub97c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud1b5\uc2e0\uc0ac\ub294 \uac1c\uc778\uc5d0\uac8c \ubd84\uc2e4 \ud734\ub300\ud3f0\uc758 \uc704\uce58\ub97c \uc54c\ub824 \uc904 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1453", "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\ub294\ub370 \ubc88\ud638\ub294 \uacc4\uc18d \uc4f0\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub824\ub3c4 \ub9e4\uc7a5\uc5d0\uc11c \uc2e0\ubd84\uc99d\uc744 \ubcf4\uc5ec \uc8fc\uace0 \uc720\uc2ec\uc744 \uc7ac\ubc1c\uae09(7,700\uc6d0)\ubc1b\uc73c\uba74 \ub2e4\ub978 \ud734\ub300\ud3f0\uc5d0\uc11c \uac19\uc740 \ubc88\ud638\ub97c \uc4f8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubd84\uc2e4 \ud6c4 \uc0c8 \ud734\ub300\ud3f0\uc744 \uc0ac\uc11c \uae30\uae30 \ubcc0\uacbd\uc744 \ud574\ub3c4 \uac19\uc740 \ubc88\ud638\ub97c \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "237", "t": "\ud574\uc678\uc5ec\ud589 \uc911\uc5d0 \ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud574\uc678\uc5ec\ud589 \uc911 \ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \ub85c\ubc0d \uace0\uac1d\uc13c\ud130 +82-2-1500-0000\uc5d0 24\uc2d ": "Ubot\uc740 \uac00\uc871 \ud68c\uc120\ub07c\ub9ac \ub370\uc774\ud130\ub97c \ub098\ub220 \uc4f0\ub294 \ubcc4\ub3c4\uc758 \uacf5\uc720 \uc694\uae08\uc81c\ub97c \uc81c\uacf5\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub370\uc774\ud130 \uc250\uc5b4\ub9c1\uc744 \uc9c0\uc6d0\ud558\ub294 \uc694\uae08\uc81c\ub77c\uba74 \ubcf8\uc778 \uba85\uc758\uc758 \ud0dc\ube14\ub9bf \ub4f1 \uc11c\ube0c \ud68c\uc120\uacfc \ub370\uc774\ud130\ub97c \ub098\ub220 \uc4f8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\uac00\uc871 \ud68c\uc120\uc758 \ub370\uc774\ud130\uac00 \ubd80\uc871\ud558\ub2e4\uba74 \ud574\ub2f9 \ud68c\uc120\uc5d0 \ub370\uc774\ud130 \ud50c\ub7ec\uc2a4 \uc0c1\ud488\uc744 \ucd94\uac00\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0140", "q": "\uc77c\uc2dc\uc815\uc9c0 \ub418\ub098\uc694??", "g": "ANS", "f": [{"id": "1431", "t": "\ud734\ub300\ud3f0\uc744 \uc7a0\uc2dc \uc26c\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc7a0\uc2dc \uc26c\ub824\uba74 Ubot \uc571\u00b7\uace0\uac1d\uc13c\ud130\u00b7\ub9e4\uc7a5\uc5d0\uc11c \uc77c\uc2dc\uc815\uc9c0\ub97c \uc2e0\uccad\ud558\uba74 \ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \uc77c\uc2dc\uc815\uc9c0\ub294 \uc5f0 2\ud68c, 1\ud68c \ucd5c\ub300 90\uc77c, \uc5f0\uac04 \ud569\uacc4 180\uc77c\uae4c\uc9c0 \uac00\ub2a5\ud569\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\uc77c\uc2dc\uc815\uc9c0 \uae30\uac04\uc5d0\ub294 \uc6d4 3,850\uc6d0\uc774 \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1435", "t": "\uc77c\uc2dc\uc815\uc9c0\uc640 \uc7a5\uae30 \uc815\uc9c0\ub294 \ubb34\uc5c7\uc774 \ub2e4\ub978\uac00\uc694?", "s": [{"i": 0, "t": "\uc77c\uc2dc\uc815\uc9c0\ub294 \ub204\uad6c\ub098 \uc5f0 2\ud68c, 1\ud68c \ucd5c\ub300 90\uc77c\uae4c\uc9c0 \uc6d4 3,850\uc6d0\uc5d0 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc7a5\uae30 \uc815\uc9c0\ub294 \uad70 \uc785\ub300, \ud574\uc678 \uccb4\ub958, \uc785\uc6d0\ucc98\ub7fc \uc99d\ube59 \uc11c\ub958\uac00 \uc788\ub294 \uacbd\uc6b0\uc5d0 \ub354 \uae34 \uae30\uac04 \ub3d9\uc548 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0141", "q": "\uba85\uc758 \ubc14\uafb8\ub294\ubc95 \uc54c\ub824\uc918", "g": "ANS", "f": [{"id": "1094", "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \ud558\ub824\uba74 \ubb34\uc5c7\uc774 \ud544\uc694\ud55c\uac00\uc694?", "s": [{"i": 0, "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \ud558\ub824\uba74 \uae30\uc874 \uba85\uc758\uc790\uc640 \uc0c8 \uba85\uc758\uc790\uac00 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ud568\uaed8 \ub9e4\uc7a5\uc5d0 \ubc29\ubb38\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uac00\uc871 \uac04 \uba85\uc758 \ubcc0\uacbd\uc5d0\ub294 \ubc1c\uae09 3\uac1c\uc6d4 \uc774\ub0b4\uc758 \uac00\uc871\uad00\uacc4\uc99d\uba85\uc11c\ub3c4 \uc900\ube44\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 2, "t": "\uba85\uc758 \ubcc0\uacbd\uc5d0 \ud55c \uc0ac\ub78c\ub9cc \ubc29\ubb38\ud55c\ub2e4\uba74 \uc624\uc9c0 \uc54a\ub294 \uc0ac\ub78c\uc758 \uc778\uac10\uc99d\uba85\uc11c\uc640 \uc704\uc784\uc7a5\uc774 \ucd94\uac00\ub85c \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "381", "t": "\uba85\uc758 \ubcc0\uacbd \uc5c5\ubb34\ub97c \ud558\ub294 \uac00\uae4c\uc6b4 \ub9e4\uc7a5\uc744 \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud604\uc7ac \uc704\uce58 \uc8fc\ubcc0\uc5d0\uc11c \uba85\uc758 \ubcc0\uacbd\uc744 \ucde8\uae09\ud558\ub294 \uac00\uae4c\uc6b4 \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \uc704\ud574 \ub9e4\uc7a5\uc5d0 \ubc29\ubb38\ud560 \ub54c\ub294 \uc591\ub3c4\uc778\uacfc \uc591\uc218\uc778 \uc2e0\ubd84\uc99d, \uba85\uc758 \ubcc0\uacbd \ub3d9\uc758\uc11c\uac00 \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "81", "t": "\uba85\uc758 \ubcc0\uacbd\uc774 \uac00\ub2a5\ud55c\uac00\uc694?", "s": [{"i": 0, "t": "\ud5c8\uc6a9\ub418\ub294 \uc870\uac74\uc5d0\uc11c \ubcf8\uc778 \ud655\uc778 \ubc0f \ud544\uc694\ud55c \uc11c\ub958\ub97c \uc81c\ucd9c\ud558\uba74 \uba85\uc758 \ubcc0\uacbd\uc744 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0144", "q": "\ubb38\uc790 \uc548\uc634", "g": "ANS", "f": [{"id": "1012", "t": "\ud734\ub300\ud3f0 \ubcf8\uc778 \uc778\uc99d \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc73c\uba74 \ubb34\uc5c7\uc744 \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ubcf8\uc778 \uc778\uc99d \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc73c\uba74 \ud734\ub300\ud3f0\uc758 \uc2e0\ud638\u00b7\ubb38\uc790 \uc218\uc2e0 \uc0c1\ud0dc\uc640 \uc2a4\ud338 \ucc28\ub2e8\ud568, \uc778\uc99d \uc694\uccad \ud69f\uc218 \uc81c\ud55c \uc5ec\ubd80\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uc77c\ubc18 \ubb38\uc790\ub3c4 \ubc1b\uc9c0 \ubabb\ud55c\ub2e4\uba74 \ud68c\uc120\uc774\ub098 \uae30\uae30 \ubb38\uc81c\ub97c \uc810\uac80\ubc1b\uc544 \uc8fc\uc138\uc694.", "y": 1}, {"i": 2, "t": "\ud2b9\uc815 \uc11c\ube44\uc2a4\uc758 \uc778\uc99d \ubb38\uc790\ub9cc \uc624\uc9c0 \uc54a\ub294\ub2e4\uba74 \ud574\ub2f9 \uc11c\ube44\uc2a4\uc758 \ubb38\uc790 \ubc1c\uc1a1 \uc0c1\ud0dc\ub97c \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1231", "t": "\uc7ac\ub09c \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc544\uc694.", "s": [{"i": 0, "t": "\uc7ac\ub09c \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\ub294\ub2e4\uba74 \ud734\ub300\ud3f0 \uc124\uc815 > \uc548\uc804 \ubc0f \uae34\uae09(\ub610\ub294 \uc54c\ub9bc) > \uae34\uae09 \uc7ac\ub09c \ubb38\uc790\uac00 \ucf1c\uc838 \uc788\ub294\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\uc7ac\ub09c \ubb38\uc790\ub294 \uae30\uc9c0\uad6d \ub2e8\uc704\ub85c \ubc1c\uc1a1\ub418\ubbc0\ub85c \uac19\uc740 \uc9c0\uc5ed\uc5d0\uc11c\ub3c4 \uc5f0\uacb0\ub41c \uae30\uc9c0\uad6d\uc5d0 \ub530\ub77c \ubc1b\uc9c0 \ubabb\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1469", "t": "\ubcf8\uc778\uc778\uc99d \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc544\uc694.", "s": [{"i": 0, "t": "\ubcf8\uc778\uc778\uc99d \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc73c\uba74 \uc2a4\ud338 \ucc28\ub2e8 \uc571, \uba54\uc2dc\uc9c0 \uc218\uc2e0 \ucc28\ub2e8 \uc124\uc815, \ubb38\uc790\ud568 \uc800\uc7a5 \uacf5\uac04\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uc778\uc99d \uc694\uccad\uc744 \uc9e7\uc740 \uc2dc\uac04\uc5d0 \uc5ec\ub7ec \ubc88 \ubc18\ubcf5\ud558\uba74 \ubcf8\uc778\uc778\uc99d\uc774 \uc7a0\uc2dc \uc81c\ud55c\ub420 \uc218 \uc788\uc73c\ub2c8 \uba87 \ubd84 \ub4a4 \ub2e4\uc2dc \uc2dc\ub3c4\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "183", "t": "\ubb38\uc790\uac00 \uc624\uac00\uc9c0 \uc54a\uc744 \ub54c\ub294 \ubb34\uc5c7\uc744 \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ubb38\uc790\uac00 \uc624\uac00\uc9c0 \uc54a\uc744 \ub54c\ub294 \uc800\uc7a5 \uacf5\uac04\uacfc \uc2a4\ud338 \ucc28\ub2e8 \uc124\uc815\uc744 \ud655\uc778\ud558\uace0 \uba54\uc2dc\uc9c0 \uc571 \uc124\uc815\uc744 \uc810\uac80\ud55c \ub4a4 \ud734\ub300\ud3f0\uc744 \uc7ac\ubd80\ud305\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "184", "t": "\uc800\uc7a5 \uacf5\uac04\uc774 \ubd80\uc871\ud558\uba74 \ubb38\uc790\uac00 \uc548 \uc624\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc800\uc7a5 \uacf5\uac04\uc774 \ubd80\uc871\ud558\uba74 \uc0c8 \ubb38\uc790 \uba54\uc2dc\uc9c0\uac00 \uc800\uc7a5\ub418\uc9c0 \uc54a\uc544 \uc218\uc2e0\ub418\uc9c0 \uc54a\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc800\uc7a5 \uacf5\uac04 \ubd80\uc871\uc73c\ub85c \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\ub294\ub2e4\uba74 \uc624\ub798\ub41c \ub300\ud654\ub97c \uc815\ub9ac\ud55c \ub4a4 \ub2e4\uc2dc \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "62", "t": "\ubb38\uc790 \uba54\uc2dc\uc9c0\ub97c \ubc1b\uc9c0 \ubabb\ud558\uace0 \uc788\uc5b4\uc694.", "s": [{"i": 0, "t": "\ubb38\uc790 \uba54\uc2dc\uc9c0\ub97c \ubc1b\uc9c0 \ubabb\ud55c\ub2e4\uba74 \uc218\uc2e0 \ucc28\ub2e8 \uc124\uc815\uacfc \uc800\uc7a5 \uacf5\uac04, \ub124\ud2b8\uc6cc\ud06c \uc0c1\ud0dc\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}]}]}, {"id": "Q0145", "q": "\ud1b5\ud654\uac00 \uc790\uafb8 \ub04a\uae40", "g": "ANS", "f": [{"id": "1015", "t": "\ud1b5\ud654\ud560 \ub54c \uc18c\ub9ac\uac00 \ub04a\uae30\uac70\ub098 \uc7a1\uc74c\uc774 \ub4e4\ub824\uc694.", "s": [{"i": 0, "t": "\ud1b5\ud654\ud560 \ub54c \uc18c\ub9ac\uac00 \ub04a\uae30\uac70\ub098 \uc7a1\uc74c\uc774 \ub4e4\ub9ac\ub294 \uac83\uc740 \ud2b9\uc815 \uc7a5\uc18c\uc758 \uc804\ud30c \uc0c1\ud0dc\ub098 \ub2e8\ub9d0\uae30 \uc124\uc815 \ub54c\ubb38\uc77c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud1b5\ud654 \ud488\uc9c8\uc774 \ub098\uc058\ub2e4\uba74 \uc704\uce58\ub97c \uc62e\uae30\uace0 \ud734\ub300\ud3f0\uc744 \uc7ac\ubd80\ud305\ud574 \ubcf4\uc138\uc694.", "y": 1}, {"i": 2, "t": "\uc704\uce58\ub97c \uc62e\uae30\uace0 \uc7ac\ubd80\ud305\ud574\ub3c4 \ud1b5\ud654 \ud488\uc9c8 \ubb38\uc81c\uac00 \uacc4\uc18d\ub418\uba74 \uace0\uac1d\uc13c\ud130\uc5d0 \ubc1c\uc0dd \uc7a5\uc18c\uc640 \uc2dc\uac04\uc744 \uc54c\ub824 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "1223", "t": "\uac74\ubb3c \uc548\uc774\ub098 \uc9d1\uc5d0\uc11c\ub9cc \ud1b5\ud654\uac00 \uc798 \uc548 \ub3fc\uc694.", "s": [{"i": 0, "t": "\uac74\ubb3c \uad6c\uc870\ub098 \uc9c0\ud558\ucc98\ub7fc \uc804\ud30c\uac00 \uc57d\ud55c \uacf3\uc5d0\uc11c\ub294 \ud734\ub300\ud3f0 \ud1b5\ud654 \ud488\uc9c8\uc774 \ub5a8\uc5b4\uc9c8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc9d1 \uc548\uc5d0\uc11c \ud1b5\ud654\uac00 \uc798\ub418\uc9c0 \uc54a\uc73c\uba74 \ud734\ub300\ud3f0 \uc124\uc815\uc5d0\uc11c Wi-Fi \ud1b5\ud654\ub97c \ucf1c\uc11c \uc9d1 Wi-Fi\ub85c \ud1b5\ud654\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\uc9d1\uc5d0\uc11c Wi-Fi \ud1b5\ud654\ub97c \uc774\uc6a9\ud574\ub3c4 \uacc4\uc18d \ubd88\ud3b8\ud558\uba74 \uace0\uac1d\uc13c\ud130(114)\uc5d0 \ud1b5\ud654 \ud488\uc9c8 \uc810\uac80\uc744 \uc2e0\uccad\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "1224", "t": "\ud1b5\ud654 \uc911\uc5d0 \uc18c\ub9ac\uac00 \ub04a\uae30\uac70\ub098 \uc7a1\uc74c\uc774 \uc0dd\uaca8\uc694.", "s": [{"i": 0, "t": "\ud1b5\ud654 \uc911 \uc18c\ub9ac\uac00 \ub04a\uae30\uac70\ub098 \uc7a1\uc74c\uc774 \uc0dd\uae30\uba74 \ud734\ub300\ud3f0\uc744 \uc7ac\ubd80\ud305\ud558\uace0 \uc774\uc5b4\ud3f0\uc774\ub098 \ucf00\uc774\uc2a4\uac00 \ub9c8\uc774\ud06c\ub97c \uac00\ub9ac\uc9c0 \uc54a\ub294\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ud1b5\ud654 \uc911 \uc7a1\uc74c\uc774\ub098 \ub04a\uae40\uc774 \ud2b9\uc815 \uc7a5\uc18c\uc5d0\uc11c\ub9cc \ubc18\ubcf5\ub418\uba74 \uace0\uac1d\uc13c\ud130\uc5d0 \uc704\uce58\uc640 \uc2dc\uac04\uc744 \uc54c\ub824 \uc8fc\uc2dc\uba74 \ud488\uc9c8\uc744 \uc810\uac80\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "458", "t": "\ud1b5\ud654\uac00 \uc790\uc8fc \ub04a\uaca8\uc11c \uc9c1\uc811 \uc0c1\ub2f4\ubc1b\uc73c\ub7ec \uac08 \ub9e4\uc7a5\uc744 \ucc3e\uc544\uc694.", "s": [{"i": 0, "t": "\ud1b5\ud654\uac00 \uc790\uc8fc \ub04a\uaca8 \uc9c1\uc811 \uc0c1\ub2f4\ubc1b\uace0 \uc2f6\ub2e4\uba74 \ud604\uc7ac \uc704\uce58 \uc8fc\ubcc0\uc5d0\uc11c \ud1b5\ud654 \ud488\uc9c8 \uc0c1\ub2f4\uc744 \uc9c0\uc6d0\ud558\ub294 \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud1b5\ud654 \ub04a\uae40\uc774 \ubc1c\uc0dd\ud558\ub294 \uc7a5\uc18c\uc640 \uc2dc\uac04, \uc0ac\uc6a9 \uc911\uc778 \ub2e8\ub9d0\uae30\ub97c \uc54c\ub824 \uc8fc\uc2dc\uba74 \ub9e4\uc7a5\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \ud488\uc9c8 \uc810\uac80\uc744 \uc694\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0147", "q": "5g \uc4f0\ub294\uac70 \ub9de\ub294\uc9c0 \uc5b4\ucf00 \ud655\uc778\ud568", "g": "ANS", "f": [{"id": "762", "t": "\uc9c0\uae08 \uc81c \ud68c\uc120\uc5d0 \uac78\ub9b0 \uc694\uae08\uc81c\uac00 5G\uc778\uc9c0 LTE\uc778\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc774 \ud604\uc7ac \uc0ac\uc6a9 \uc911\uc778 \uc694\uae08\
