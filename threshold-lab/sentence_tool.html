t": "\uc2e0\uaddc \uac00\uc785\uacfc \ub3d9\uc2dc\uc5d0 \uac00\uc871 \uacb0\ud569\uc744 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc2e0\uaddc \uac00\uc785\uacfc \ud568\uaed8 \uc2e0\uccad\ud55c \uac00\uc871 \uacb0\ud569 \ud560\uc778\uc740 \uc2e0\uccad \ub2e4\uc74c \ub2ec \uccad\uad6c\ubd84\ubd80\ud130 \uc801\uc6a9\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1857", "t": "\uac00\uc871 \uacb0\ud569 \ub73b\uc740 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uac00\uc871\uc758 \ud1b5\uc2e0 \ud68c\uc120\uc744 \uc815\ud574\uc9c4 \uc870\uac74\uc5d0 \ub530\ub77c \ubb36\uc5b4 \ud560\uc778 \ud61c\ud0dd\uc744 \ubc1b\ub294 \uc0c1\ud488\uc774\ub098 \ubc29\uc2dd\uc785\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0092", "q": "\uc778\ud130\ub137 \uacb0\ud569", "g": "ANS", "f": [{"id": "1376", "t": "\ud734\ub300\ud3f0\uacfc \uc778\ud130\ub137\uc744 \ud568\uaed8 \uc4f0\uba74 \ud560\uc778\ub418\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \ud648 \uacb0\ud569\uc73c\ub85c \ud734\ub300\ud3f0 1\ud68c\uc120\uacfc \uc778\ud130\ub137\uc744 \ud568\uaed8 \uc4f0\uba74 \uc778\ud130\ub137 \uc18d\ub3c4 100Mbps\ub294 \uc6d4 3,300\uc6d0, 500Mbps\ub294 \uc6d4 5,500\uc6d0, 1Gbps\ub294 \uc6d4 7,700\uc6d0\uc774 \ud734\ub300\ud3f0 \uc694\uae08\uc5d0\uc11c \ud560\uc778\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "305", "t": "\uac00\uc871 \uacb0\ud569\uacfc \uc778\ud130\ub137 \uacb0\ud569\uc744 \ud568\uaed8 \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uac00\uc871 \uacb0\ud569\uacfc \ud734\ub300\ud3f0\u00b7\uc778\ud130\ub137 \ud648 \uacb0\ud569\uc740 \uac00\uc785 \uc870\uac74\uc744 \ucda9\uc871\ud558\uba74 \ud568\uaed8 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uac00\uc871 \uacb0\ud569 \ud560\uc778\uc740 \ub300\ud45c \ud734\ub300\ud3f0 \ud68c\uc120\uc5d0\uc11c \ucc28\uac10\ub429\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\ud648 \uacb0\ud569 \ud560\uc778\uc740 \uc778\ud130\ub137 \uc18d\ub3c4\uc5d0 \ub530\ub77c \ud734\ub300\ud3f0 \uc694\uae08\uc5d0\uc11c \uc6d4 3,300\uc6d0\ubd80\ud130 7,700\uc6d0\uae4c\uc9c0 \uc801\uc6a9\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "313", "t": "\uacb0\ud569\uc73c\ub85c \ubc1b\uc744 \uc218 \uc788\ub294 \ud560\uc778\uc744 \uc815\ub9ac\ud574 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "Ubot \uac00\uc871 \uacb0\ud569\uc740 \ud68c\uc120 \uc218\uc5d0 \ub530\ub77c \ub300\ud45c \ud68c\uc120\uc5d0\uc11c \uc6d4 6,000\uc6d0\ubd80\ud130 24,000\uc6d0\uae4c\uc9c0 \ud560\uc778\ub429\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud734\ub300\ud3f0\uacfc \uc778\ud130\ub137\uc758 \ud648 \uacb0\ud569 \ud560\uc778\uc740 \uc778\ud130\ub137 \uc18d\ub3c4\uc5d0 \ub530\ub77c \ud734\ub300\ud3f0 \uc694\uae08\uc5d0\uc11c \uc6d4 3,300\uc6d0\ubd80\ud130 7,700\uc6d0\uae4c\uc9c0 \uc801\uc6a9\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\uc778\ud130\ub137\uacfc IPTV\ub97c \uacb0\ud569\ud558\uba74 \uc0c1\ud488 \uc870\uac74\uc5d0 \ub530\ub978 \ud560\uc778 \uae08\uc561\uc740 \uac00\uc785 \ub0b4\uc5ed\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "442", "t": "\uc778\ud130\ub137\uc774\ub791 \ud734\ub300\ud3f0 \uacb0\ud569 \uc0c1\ub2f4\ubc1b\uc744 \ub9e4\uc7a5\uc744 \ucc3e\uace0 \uc788\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud604\uc7ac \uc704\uce58 \uc8fc\ubcc0\uc5d0\uc11c \ud734\ub300\ud3f0\uacfc \uc778\ud130\ub137 \uacb0\ud569 \uc0c1\ub2f4\uc744 \ubc1b\uc744 \uc218 \uc788\ub294 \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud734\ub300\ud3f0\uacfc \uc778\ud130\ub137\uc744 \uacb0\ud569\ud558\uba74 \uc778\ud130\ub137 \uc694\uae08\uc774 \uc6d4 5,500\uc6d0 \ud560\uc778\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "812", "t": "\uc81c \ud734\ub300\ud3f0\uc774 \uc9d1 \uc778\ud130\ub137\uc774\ub791 \uacb0\ud569\ub3fc \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uacb0\ud569 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \uc9d1 \uc778\ud130\ub137\uacfc \ud734\ub300\ud3f0\uc758 \uacb0\ud569 \uc5ec\ubd80 \ubc0f \ud560\uc778 \uae08\uc561\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0093", "q": "\uccad\uad6c\uc11c \uc870\ud68c", "g": "ANS", "f": [{"id": "1158", "t": "\uc774\ubc88 \ub2ec \uccad\uad6c \uc694\uae08\uc740 \uc5b8\uc81c\ubd80\ud130 \ud655\uc778\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc774\ubc88 \ub2ec \uccad\uad6c \uc694\uae08\uc740 \ub9e4\uc6d4 5\uc77c \uc624\ud6c4\ubd80\ud130 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc774\ubc88 \ub2ec \ubaa8\ubc14\uc77c \uccad\uad6c\uc11c\ub294 \ub9e4\uc6d4 8\uc77c\ucbe4 \ubc1c\uc1a1\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1159", "t": "\uccad\uad6c \uc694\uae08\uacfc \ub0a9\ubd80 \ub0b4\uc5ed\uc740 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uccad\uad6c \uc694\uae08\uacfc \ub0a9\ubd80 \ub0b4\uc5ed\uc740 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc758 \uc694\uae08 \uc870\ud68c \uba54\ub274\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc571\uc5d0\uc11c\ub294 \ucd5c\uadfc 12\uac1c\uc6d4\uc758 \uc694\uae08 \ub0b4\uc5ed\uc744 \uc870\ud68c\ud560 \uc218 \uc788\uc73c\uba70 \ub354 \uc624\ub798\ub41c \ub0b4\uc5ed\uc740 \uace0\uac1d\uc13c\ud130\uc5d0 \uc694\uccad\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "1178", "t": "\uccad\uad6c\uc11c \ubc1b\ub294 \ubc29\ubc95\uc744 \ubc14\uafb8\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uccad\uad6c\uc11c \uc218\uc2e0 \ubc29\ubc95\uc740 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubaa8\ubc14\uc77c \uccad\uad6c\uc11c, \uc774\uba54\uc77c \uccad\uad6c\uc11c, \uc6b0\ud3b8 \uccad\uad6c\uc11c \uc911 \ud558\ub098\ub85c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "Ubot\uc758 \uae30\ubcf8 \uc218\uc2e0 \ubc29\ubc95\uc740 \ubaa8\ubc14\uc77c \uccad\uad6c\uc11c\uc774\uba70 \uc6b0\ud3b8 \uccad\uad6c\uc11c\uc5d0\ub3c4 \ucd94\uac00 \uc694\uae08\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1179", "t": "\uccad\uad6c\uc11c\ub97c \ub2e4\uc2dc \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc6d0\ud558\ub294 \ub2ec\uc758 \uccad\uad6c\uc11c\ub294 \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ub2e4\uc2dc \uc5f4\ub78c\ud558\uac70\ub098 \ubb38\uc790\u00b7\uc774\uba54\uc77c\ub85c \uc7ac\ubc1c\ud589\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uccad\uad6c\uc11c\ub97c \ubc1b\uc9c0 \uc54a\ub3c4\ub85d \uc124\uc815\ud588\ub354\ub77c\ub3c4 \uc7ac\ubc1c\ud589\uc744 \uc694\uccad\ud558\uba74 \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "733", "t": "\uc81c \uccad\uad6c\uc11c\uac00 \uc9c0\uae08 \uc5b4\ub5a4 \ubc29\uc2dd\uc73c\ub85c \uc624\uace0 \uc788\uc5b4\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uccad\uad6c\uc11c \uc218\uc2e0 \uc124\uc815\uc744 \uc870\ud68c\ud574 \ud604\uc7ac \ubaa8\ubc14\uc77c\u00b7\uc774\uba54\uc77c\u00b7\uc885\uc774 \uc911 \uc5b4\ub5a4 \ubc29\uc2dd\uc73c\ub85c \uccad\uad6c\uc11c\ub97c \ubc1b\ub294\uc9c0 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "734", "t": "\uccad\uad6c\uc11c \ubc1b\ub294 \uc774\uba54\uc77c \uc8fc\uc18c\uac00 \ubb50\ub85c \ub4f1\ub85d\ub3fc \uc788\uc5b4\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uccad\uad6c\uc11c \uc218\uc2e0 \uc124\uc815\uc744 \uc870\ud68c\ud574 \uccad\uad6c\uc11c\ub97c \ubc1b\ub294 \ub370 \ub4f1\ub85d\ub41c \uc774\uba54\uc77c \uc8fc\uc18c\ub97c \uc77c\ubd80 \uac00\ub824 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "747", "t": "\uc774\ubc88 \ub2ec \uccad\uad6c\uc11c\uac00 \uc800\ud55c\ud14c \ubc1c\uc1a1\ub410\ub294\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uccad\uad6c\uc11c \ubc1c\uc1a1 \ub0b4\uc5ed\uc744 \uc870\ud68c\ud574 \uc774\ubc88 \ub2ec \uccad\uad6c\uc11c\uc758 \ubc1c\uc1a1 \uc5ec\ubd80\uc640 \uc218\uc2e0 \ubc29\ubc95\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "89", "t": "\uccad\uad6c\uc11c\ub97c \uc774\uba54\uc77c\ub85c \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uccad\uad6c\uc11c\ub97c \uc774\uba54\uc77c\ub85c \ubc1b\uc73c\ub824\uba74 \uccad\uad6c\uc11c \uc218\uc2e0 \ubc29\ubc95\uc744 \uc774\uba54\uc77c\ub85c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uccad\uad6c\uc11c \uc218\uc2e0 \ubc29\ubc95\uc744 \ubaa8\ubc14\uc77c \uccad\uad6c\uc11c\ub85c\ub3c4 \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0094", "q": "\uc790\ub3d9\uc774\uccb4 \ubcc0\uacbd", "g": "ANS", "f": [{"id": "1161", "t": "\uc790\ub3d9\uc774\uccb4 \ub0a9\ubd80\uc77c\uc744 \ubc14\uafb8\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc790\ub3d9\uc774\uccb4 \ub0a9\ubd80\uc77c\uc740 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc758 \ub0a9\ubd80 \ubc29\ubc95 \uba54\ub274\uc5d0\uc11c 10\uc77c, 15\uc77c, 21\uc77c, 25\uc77c \uc911 \ud558\ub098\ub85c \ubc14\uafc0 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc790\ub3d9\uc774\uccb4 \ub0a9\ubd80\uc77c \ubcc0\uacbd\uc740 \uc2e0\uccad\ud55c \ub2e4\uc74c \ub2ec \uccad\uad6c\ubd84\ubd80\ud130 \uc801\uc6a9\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "1163", "t": "\uc790\ub3d9\uc774\uccb4\ub97c \uc2e0\uccad\ud558\uac70\ub098 \uacc4\uc88c\ub97c \ubc14\uafb8\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc790\ub3d9\uc774\uccb4\ub97c \uc2e0\uccad\ud558\uac70\ub098 \uacc4\uc88c\ub97c \ubc14\uafb8\ub824\uba74 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubcf8\uc778\uc778\uc99d \ud6c4 \ub0a9\ubd80 \ubc29\ubc95 \uba54\ub274\uc5d0 \uacc4\uc88c\ub098 \uce74\ub4dc\ub97c \ub4f1\ub85d\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc790\ub3d9\uc774\uccb4 \uc2e0\uccad\uc740 \ub2e4\uc74c \ub0a9\ubd80\uc77c\ubd80\ud130 \uc801\uc6a9\ub418\uba70 \ucc98\ub9ac \uc911\uc5d0\ub294 \ub0a9\ubd80 \ubc29\ubc95\uc774 '\uc9c0\ub85c \ub0a9\ubd80'\ub85c \ubcf4\uc77c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "40", "t": "\uc790\ub3d9\uc774\uccb4 \uacc4\uc88c\ub97c \ubcc0\uacbd\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc790\ub3d9\uc774\uccb4 \uacc4\uc88c\ub294 \ubcf8\uc778 \uc778\uc99d \ud6c4 \ub0a9\ubd80 \uacc4\uc88c\ub97c \ubcc0\uacbd\ud558\ub294 \ubc29\uc2dd\uc73c\ub85c \ubc14\uafc0 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "41", "t": "\ud734\ub300\ud3f0 \uc694\uae08 \uacb0\uc81c \uce74\ub4dc\ub97c \ubcc0\uacbd\ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc694\uae08 \uacb0\uc81c \uce74\ub4dc\ub294 \uc694\uae08 \ub0a9\ubd80 \uad00\ub9ac \uba54\ub274\uc5d0\uc11c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0095", "q": "\ubbf8\ub0a9 \uc694\uae08", "g": "ANS", "f": [{"id": "1167", "t": "\uc571\uc5d0\uc11c \ubc14\ub85c \uc694\uae08\uc744 \ub0bc \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc758 \uc989\uc2dc \ub0a9\ubd80\uc5d0\uc11c \uacc4\uc88c\uc774\uccb4\ub098 \uce74\ub4dc\ub85c \uc774\ubc88 \ub2ec \uc694\uae08\uacfc \ubbf8\ub0a9 \uc694\uae08\uc744 \ubc14\ub85c \ub0bc \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc790\ub3d9\uc774\uccb4 \ucd9c\uae08\uc774 \uc9c4\ud589 \uc911\uc77c \ub54c\ub294 \uc774\uc911 \ub0a9\ubd80\ub97c \ub9c9\uae30 \uc704\ud574 \uc989\uc2dc \ub0a9\ubd80\uac00 \uc7a0\uc2dc \uc81c\ud55c\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1169", "t": "\ubbf8\ub0a9 \uc694\uae08\uc740 \uc5b4\ub5bb\uac8c \ub0b4\ub098\uc694?", "s": [{"i": 0, "t": "\ubbf8\ub0a9 \uc694\uae08\uc740 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc758 \uc989\uc2dc \ub0a9\ubd80, \uccad\uad6c\uc11c\u00b7\ubb38\uc790\uc5d0 \uc548\ub0b4\ub41c \uac00\uc0c1\uacc4\uc88c \uc785\uae08, \ub9e4\uc7a5 \uc218\ub0a9\uc73c\ub85c \ub0bc \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubbf8\ub0a9 \uc694\uae08\uc744 \ub0a9\ubd80\ud558\uba74 \uc815\uc9c0\ub41c \uc11c\ube44\uc2a4\ub294 \ub0a9\ubd80 \ud655\uc778 \ud6c4 \ubc14\ub85c \ub2e4\uc2dc \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1174", "t": "\uc694\uae08\uc744 \ub0a9\ubd80\ud588\ub294\ub370 \uc544\uc9c1 \ubbf8\ub0a9\uc73c\ub85c \ub098\uc640\uc694.", "s": [{"i": 0, "t": "\uc694\uae08\uc744 \ub0a9\ubd80\ud588\ub294\ub370 \ubbf8\ub0a9\uc73c\ub85c \ubcf4\uc778\ub2e4\uba74 \uc790\ub3d9\uc774\uccb4 \ucd9c\uae08 \uc911\uc774\uac70\ub098 \ub0a9\ubd80 \uacb0\uacfc\uac00 \uc544\uc9c1 \ubc18\uc601\ub418\uc9c0 \uc54a\uc558\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ub9e4\uc6d4 3~5\uc77c \uccad\uad6c\uc11c \ud655\uc815 \ud6c4\uc5d0 \ub0a9\ubd80\ud55c \uae08\uc561\ub3c4 \uccad\uad6c\uc11c\uc5d0\ub294 \ubbf8\ub0a9\uc73c\ub85c \ud45c\uc2dc\ub420 \uc218 \uc788\uc73c\ubbc0\ub85c \uc571\uc758 \ubbf8\ub0a9 \uc870\ud68c\uc5d0\uc11c \ucd5c\uc2e0 \uc0c1\ud0dc\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1436", "t": "\ubbf8\ub0a9 \uc694\uae08\uc744 \ub0c8\ub294\ub370 \uc815\uc9c0\uac00 \ud480\ub9ac\uc9c0 \uc54a\uc544\uc694.", "s": [{"i": 0, "t": "\ubbf8\ub0a9 \uc694\uae08\uc744 \ub0a9\ubd80\ud558\uba74 \ud655\uc778 \ud6c4 \ubcf4\ud1b5 1\uc2dc\uac04 \uc548\uc5d0 \uc774\uc6a9 \uc815\uc9c0\uac00 \uc790\ub3d9\uc73c\ub85c \ud574\uc81c\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubbf8\ub0a9 \uc815\uc9c0 \ud574\uc81c \uacb0\uacfc\ub294 \ud734\ub300\ud3f0\uc744 \ub2e4\uc2dc \ucf1c\uc57c \ubc18\uc601\ub420 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\ub0a9\ubd80 \ud6c4 2\uc2dc\uac04\uc774 \uc9c0\ub098\ub3c4 \uc815\uc9c0\uac00 \ud480\ub9ac\uc9c0 \uc54a\uc73c\uba74 \uace0\uac1d\uc13c\ud130(114)\uc5d0 \ub0a9\ubd80 \ub0b4\uc5ed\uc744 \uc54c\ub824 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1441", "t": "\uc694\uae08 \ubbf8\ub0a9\uc73c\ub85c \uc9c1\uad8c \ud574\uc9c0\ub418\uba74 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc694\uae08\uc744 3\uac1c\uc6d4 \uc774\uc0c1 \ub0b4\uc9c0 \uc54a\uc73c\uba74 \ud68c\uc120\uc774 \uc9c1\uad8c \ud574\uc9c0\ub418\uace0 \ub0a8\uc740 \uc694\uae08\uacfc \ud560\ubd80\uae08\uc740 \uacc4\uc18d \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc9c1\uad8c \ud574\uc9c0 \ud6c4\uc5d0\ub3c4 \uc694\uae08\uc744 \uacc4\uc18d \ub0b4\uc9c0 \uc54a\uc73c\uba74 \uc2e0\uc6a9\uc815\ubcf4\uae30\uad00\uc5d0 \uc5f0\uccb4 \uc815\ubcf4\uac00 \ub4f1\ub85d\ub420 \uc218 \uc788\uc73c\ub2c8 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \ubd84\ub0a9 \uc0c1\ub2f4\uc744 \ubc1b\uc544 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1536", "t": "\uc81c \ubbf8\ub0a9 \uc694\uae08\uc774 \uc5bc\ub9c8\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc758 \ubbf8\ub0a9\u00b7\uc5f0\uccb4\ub41c \uccad\uad6c \uc6d4\uacfc \ub0a8\uc740 \uae08\uc561\uc744 \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "1844", "t": "\ubbf8\ub0a9 \uc694\uae08 \ub73b\uc740 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ub0a9\ubd80 \uae30\ud55c\uc774 \uc9c0\ub0ac\uac70\ub098 \uc544\uc9c1 \uacb0\uc81c\ub418\uc9c0 \uc54a\uc740 \ud1b5\uc2e0\uc694\uae08\uc785\ub2c8\ub2e4.", "y": 1}]}, {"id": "726", "t": "\uc81c\uac00 \ub2a6\uac8c \ub0b4\uc11c \ubd99\uc740 \uc5f0\uccb4 \uac00\uc0b0\uae08\uc774 \uc5bc\ub9c8\uc608\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ubbf8\ub0a9 \ub0b4\uc5ed\uc744 \uc870\ud68c\ud574 \uc5f0\uccb4\ub85c \ubc1c\uc0dd\ud55c \uac00\uc0b0\uae08\uc758 \uae08\uc561\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc694\uae08 \uc5f0\uccb4 \uac00\uc0b0\uae08\uc740 \ub0a9\ubd80\uc77c \ub2e4\uc74c \ub0a0\ubd80\ud130 \ubbf8\ub0a9\uc561\uc758 \uc6d4 2%\uc785\ub2c8\ub2e4.", "y": 0}]}, {"id": "727", "t": "\uc81c \uc694\uae08\uc774 \uba87 \ub2ec\uc9f8 \ubc00\ub824 \uc788\ub294 \uac70\uc608\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ubbf8\ub0a9 \ub0b4\uc5ed\uc744 \uc870\ud68c\ud574 \uc694\uae08\uc744 \uba87 \ub2ec\uc9f8 \ub0b4\uc9c0 \uc54a\uc558\ub294\uc9c0\uc640 \ubbf8\ub0a9 \uae08\uc561\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud734\ub300\ud3f0 \uc694\uae08\uc744 3\uac1c\uc6d4 \ubbf8\ub0a9\ud558\uba74 \uc774\uc6a9\uc774 \uc815\uc9c0\ub429\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0096", "q": "eSIM", "g": "ANS", "f": [{"id": "1274", "t": "eSIM\uc740 \uc5b4\ub5bb\uac8c \uac1c\ud1b5\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c eSIM \uac00\uc785\uc744 \uc2e0\uccad\ud558\uba74 QR \ucf54\ub4dc\uac00 \ubc1c\uae09\ub418\uba70 \ud734\ub300\ud3f0 \uc124\uc815\uc5d0\uc11c \ucf54\ub4dc\ub97c \ucd2c\uc601\ud558\uba74 \uac1c\ud1b5\ub429\ub2c8\ub2e4. eSIM\uc740 \ub9e4\uc7a5\uc5d0\uc11c\ub3c4 \ubc14\ub85c \ubc1c\uae09\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1276", "t": "QR \ucf54\ub4dc\ub97c \ucd2c\uc601\ud560 \uc218 \uc5c6\uc744 \ub54c eSIM\uc740 \uc5b4\ub5bb\uac8c \ub4f1\ub85d\ud558\ub098\uc694?", "s": [{"i": 0, "t": "eSIM QR \ucf54\ub4dc\ub97c \ucd2c\uc601\ud560 \uc218 \uc5c6\ub2e4\uba74 \ud734\ub300\ud3f0 \uc124\uc815\uc758 eSIM \ucd94\uac00\uc5d0\uc11c '\uc9c1\uc811 \uc785\ub825'\uc744 \uc120\ud0dd\ud558\uace0 QR \ucf54\ub4dc \uc544\ub798 \uc548\ub0b4\ub41c SM-DP+ \uc8fc\uc18c\uc640 \ud65c\uc131\ud654 \ucf54\ub4dc\ub97c \uc785\ub825\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "14", "t": "eSIM\uc774 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "eSIM\uc740 \ubb3c\ub9ac\uc801\uc778 SIM \uce74\ub4dc \uc5c6\uc774 \uc0ac\uc6a9\ud558\ub294 \ub514\uc9c0\ud138 SIM\uc785\ub2c8\ub2e4.", "y": 1}]}, {"id": "1739", "t": "eSIM \ud504\ub85c\ud544 \ub73b\uc774 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "eUICC\uc5d0 \ub0b4\ub824\ubc1b\uc544 \uc124\uce58\ud558\ub294 \ud1b5\uc2e0\uc0ac \uac00\uc785 \uc815\ubcf4\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub2e8\ub9d0\uc5d0 \ub530\ub77c \uc5ec\ub7ec \ud504\ub85c\ud544\uc744 \uc800\uc7a5\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0099", "q": "\ub370\uc774\ud130 \ucd94\uac00 \uad6c\ub9e4", "g": "ANS", "f": [{"id": "109", "t": "\ub370\uc774\ud130 \ucd94\uac00 \ucda9\uc804\uc740 \uc5b4\ub514\uc5d0\uc11c \uc2e0\uccad\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ub370\uc774\ud130 \ucd94\uac00 \ucda9\uc804\uc740 \uc571\uc758 \ub370\uc774\ud130 \ucda9\uc804 \uba54\ub274\uc5d0\uc11c \ubc14\ub85c \uad6c\ub9e4\ud558\uac70\ub098 \uace0\uac1d\uc13c\ud130\ub97c \ud1b5\ud574 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1151", "t": "\ub370\uc774\ud130\uac00 \ubaa8\uc790\ub77c\uba74 \ucd94\uac00\ub85c \uc0b4 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub370\uc774\ud130\uac00 \ubaa8\uc790\ub77c\uba74 Ubot \uc571\uc5d0\uc11c \ub370\uc774\ud130 \ud50c\ub7ec\uc2a4 1GB(\uc6d4 3,300\uc6d0), 5GB(\uc6d4 9,900\uc6d0), 10GB(\uc6d4 14,900\uc6d0) \uc911 \ud558\ub098\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub370\uc774\ud130 \ud50c\ub7ec\uc2a4\ub294 \ub9e4\uc6d4 \uc790\ub3d9 \uac31\uc2e0\ub418\ubbc0\ub85c \ub354 \ud544\uc694\ud558\uc9c0 \uc54a\uc744 \ub54c\ub294 \ud574\uc9c0\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1211", "t": "\ub370\uc774\ud130 \ud50c\ub7ec\uc2a4\ub294 \ucde8\uc18c\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub370\uc774\ud130 \ud50c\ub7ec\uc2a4\ub294 \uc571\uc5d0\uc11c \uc5b8\uc81c\ub4e0 \ud574\uc9c0\ud560 \uc218 \uc788\uc73c\uba70 \ud574\uc9c0 \ud6c4\uc5d0\ub3c4 \uadf8\ub2ec \ub9d0\uc77c\uae4c\uc9c0 \ucd94\uac00 \ub370\uc774\ud130\ub97c \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ub370\uc774\ud130 \ud50c\ub7ec\uc2a4\ub294 \uac00\uc785\ud55c \ub2ec\uc5d0\ub3c4 \uc694\uae08\uc774 \uc77c\ud560 \uacc4\uc0b0\ub418\uc9c0 \uc54a\uace0 \uc6d4\uc815\uc561\uc774 \uadf8\ub300\ub85c \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1882", "t": "\ub370\uc774\ud130 \ucda9\uc804 \ub73b\uc740 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uae30\ubcf8 \uc81c\uacf5 \ub370\uc774\ud130\ub97c \ub2e4 \uc4f0\uac70\ub098 \ub354 \ud544\uc694\ud560 \ub54c \ucd94\uac00 \ub370\uc77 ud574 \uc608\uc804\uc5d0 \ud574\uc9c0\ud55c \uc11c\ube44\uc2a4\uc640 \ud574\uc9c0\uc77c\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0101", "q": "\ud734\ub300\ud3f0 \ubcf4\ud5d8", "g": "ANS", "f": [{"id": "1404", "t": "\ud734\ub300\ud3f0 \ubcf4\ud5d8\uc740 \uc5b4\ub5bb\uac8c \uac00\uc785\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \ud734\ub300\ud3f0 \ubcf4\ud5d8\uc740 \uac1c\ud1b5\uc77c\ubd80\ud130 30\uc77c \uc548\uc5d0 \ub9e4\uc7a5\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \ubcf4\ud5d8\uc5d0\ub294 \ud30c\uc190\ud615\uacfc \ubd84\uc2e4\u00b7\ud30c\uc190 \uc885\ud569\ud615\uc774 \uc788\uc73c\uba70 \ubcf4\uc0c1 \uc2dc \uc790\uae30\ubd80\ub2f4\uae08\uc774 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1405", "t": "\ud734\ub300\ud3f0 \ubcf4\ud5d8\uc5d0 \uac00\uc785\ud558\uba74 \ubc14\ub85c \ubcf4\uc0c1\ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ubcf4\ud5d8 \ubcf4\uc7a5\uc740 \uac00\uc785\uc77c\ubd80\ud130 \uc2dc\uc791\ub418\ubbc0\ub85c \uac00\uc785 \uc804\uc5d0 \uc0dd\uae34 \ud30c\uc190\uc774\ub098 \ubd84\uc2e4\uc740 \ubcf4\uc0c1\ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \ubcf4\ud5d8 \ubcf4\uc0c1\uc740 \ubcf4\ud5d8\uc0ac\uc5d0 \uc811\uc218\ud55c \ub4a4 \uc2ec\uc0ac\ub97c \uac70\uccd0 \ucc98\ub9ac\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1620", "t": "\ub0b4 \ud734\ub300\ud3f0\uc5d0 \ubd84\uc2e4 \ubcf4\ud5d8\uc774 \uac00\uc785\ub418\uc5b4 \uc788\ub294\uc9c0 \uc5b4\ub514\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4 \ubcf4\ud5d8 \uac00\uc785 \uc5ec\ubd80\ub294 \ud1b5\uc2e0\uc0ac \uc571\uc774\ub098 \ud648\ud398\uc774\uc9c0\uc758 \uac00\uc785 \ubd80\uac00\uc11c\ube44\uc2a4\u00b7\ubcf4\ud5d8 \ub0b4\uc5ed\uc5d0\uc11c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\ubd84\uc2e4 \ubcf4\ud5d8 \ub0b4\uc5ed\uc774 \uc870\ud68c\ub418\uc9c0 \uc54a\uc73c\uba74 \uace0\uac1d\uc13c\ud130\uc5d0 \ubcf8\uc778 \ud655\uc778 \ud6c4 \uac00\uc785 \uc5ec\ubd80\uc640 \ubcf4\uc7a5 \ubc94\uc704\ub97c \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}]}]}, {"id": "Q0102", "q": "\ubd84\uc2e4 \uc2e0\uace0", "g": "ANS", "f": [{"id": "1314", "t": "\ud574\uc678\uc5d0\uc11c \ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \uc5b4\ub514\ub85c \uc5f0\ub77d\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud558\uac70\ub098 \ub2e4\ub978 \uc804\ud654\ub85c Ubot \ub85c\ubc0d \uace0\uac1d\uc13c\ud130(24\uc2dc\uac04, \ubc88\ud638\ub294 \ud648\ud398\uc774\uc9c0 \ub85c\ubc0d \uba54\ub274\uc5d0 \uc548\ub0b4)\uc5d0 \uc5f0\ub77d\ud574 \ud68c\uc120\uc744 \uc815\uc9c0\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4\ub85c \ud68c\uc120\uc744 \uc815\uc9c0\ud55c \ub3d9\uc548\uc5d0\ub294 \ub85c\ubc0d \uc694\uae08\uc774 \ubc1c\uc0dd\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1447", "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\uc5b4\uc694. \uc5b4\ub5bb\uac8c \ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \uba3c\uc800 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\ub098 \uace0\uac1d\uc13c\ud130 ARS(114)\uc5d0\uc11c \ubd84\uc2e4 \uc2e0\uace0\uc640 \ubd84\uc2e4 \uc815\uc9c0\ub97c \ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ubd84\uc2e4 \uc815\uc9c0\ub294 \ubb34\ub8cc\uc774\uace0 \ucd5c\ub300 90\uc77c \ub3d9\uc548 \ub2e4\ub978 \uc0ac\ub78c\uc774 \ub0b4 \ubc88\ud638\ub85c \uc804\ud654\u00b7\uacb0\uc81c\ud558\ub294 \uac83\uc744 \ub9c9\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1448", "t": "\ubd84\uc2e4 \uc2e0\uace0\ub294 \uc5b4\ub514\uc5d0\uc11c \ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4 \uc2e0\uace0\ub294 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubcf8\uc778\uc778\uc99d \ud6c4 \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub2e4\ub978 \uc804\ud654\ub85c 114(Ubot \ud734\ub300\ud3f0\uc774 \uc544\ub2c8\uba74 \ud648\ud398\uc774\uc9c0\uc758 \uace0\uac1d\uc13c\ud130 \ub300\ud45c\ubc88\ud638)\uc5d0 \uac78\uc5b4 ARS\ub85c 24\uc2dc\uac04 \ubd84\uc2e4 \uc2e0\uace0\ud560 \uc218\ub3c4 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "Ubot \ub9e4\uc7a5\uc5d0\uc11c\ub3c4 \uc2e0\ubd84\uc99d\uc744 \ubcf4\uc5ec \uc8fc\uba74 \ubd84\uc2e4 \uc2e0\uace0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1455", "t": "\ub4c0\uc5bc\ubc88\ud638\ub97c \uc4f0\ub294\ub370 \ubd84\uc2e4 \uc2e0\uace0\ub97c \uac01\uac01 \ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc8fc \ud68c\uc120\uc744 \ubd84\uc2e4 \uc2e0\uace0\ud558\uba74 \uac19\uc740 \ud734\ub300\ud3f0\uc758 \ub4c0\uc5bc\ubc88\ud638\ub3c4 \ud568\uaed8 \uc815\uc9c0\ub429\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc720\uc2ec\uacfc eSIM\uc5d0 \ub2e4\ub978 \ud68c\uc120\uc744 \ub530\ub85c \uac1c\ud1b5\ud574 \uc4f0\uace0 \uc788\uc5c8\ub2e4\uba74 \ubd84\uc2e4\ud55c \ud734\ub300\ud3f0\uc758 \ud68c\uc120\ub9c8\ub2e4 \uc2e0\uace0\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "228", "t": "\uc0c1\ub2f4\uc6d0 \uc6b4\uc601\uc2dc\uac04\uc774 \uc544\ub2cc\ub370 \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc0c1\ub2f4\uc6d0 \uc6b4\uc601\uc2dc\uac04\uc774 \uc544\ub2c8\uc5b4\ub3c4 \uace0\uac1d\uc13c\ud130 \uc790\ub3d9\uc751\ub2f5\uc73c\ub85c 24\uc2dc\uac04 \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubd84\uc2e4 \uc2e0\uace0\ub97c \uc704\ud574 \ud734\ub300\ud3f0\uc5d0\uc11c\ub294 114, \uc77c\ubc18\uc804\ud654\uc5d0\uc11c\ub294 1500-0000\uc73c\ub85c \uc5f0\ub77d\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "229", "t": "\ubd84\uc2e4 \uc2e0\uace0\ud560 \ub54c \ubcf8\uc778 \ud655\uc778\uc740 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud560 \ub54c\ub294 \ud734\ub300\ud3f0 \uc778\uc99d, \uacf5\ub3d9\u00b7\uae08\uc735 \uc778\uc99d\uc11c, \uc2e0\ubd84\uc99d \ucd2c\uc601 \uc911 \ud558\ub098\ub85c \ubcf8\uc778 \ud655\uc778\uc744 \uc9c4\ud589\ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubd84\uc2e4 \uc2e0\uace0 \uc911 \ud734\ub300\ud3f0 \uc778\uc99d\uc774 \uc5b4\ub835\ub2e4\uba74 \ub2e4\ub978 \ubcf8\uc778 \ud655\uc778 \ubc29\ubc95\uc744 \uc120\ud0dd\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "238", "t": "\ubc95\uc778 \uba85\uc758 \ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ubc95\uc778 \uba85\uc758 \ud734\ub300\ud3f0\uc744 \ubd84\uc2e4\ud588\ub2e4\uba74 \ubc95\uc778 \uc11c\ub958\uc640 \ub2f4\ub2f9\uc790 \uc2e0\ubd84\uc99d\uc744 \uc900\ube44\ud574 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud558\uac70\ub098 \uace0\uac1d\uc13c\ud130\ub85c \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\ubc95\uc778 \uba85\uc758 \ud734\ub300\ud3f0\uc744 \uae09\ud788 \uc815\uc9c0\ud574\uc57c \ud55c\ub2e4\uba74 \uace0\uac1d\uc13c\ud130 \uc790\ub3d9\uc751\ub2f5\uc73c\ub85c \uba3c\uc800 \uc815\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "52", "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4 \uc2e0\uace0\ub294 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4 \uc2e0\uace0\ub294 \uc571, \ud648\ud398\uc774\uc9c0 \ub610\ub294 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0103", "q": "\ub9e4\uc7a5 \ucc3e\uae30", "g": "ANS", "f": [{"id": "1488", "t": "\uac00\uae4c\uc6b4 Ubot \ub9e4\uc7a5\uc740 \uc5b4\ub5bb\uac8c \ucc3e\ub098\uc694?", "s": [{"i": 0, "t": "\uac00\uae4c\uc6b4 Ubot \ub9e4\uc7a5\uc740 Ubot \uc571\uc774\ub098 \ud648\ud398\uc774\uc9c0\uc758 \ub9e4\uc7a5 \ucc3e\uae30\uc5d0\uc11c \ud604\uc7ac \uc704\uce58, \uc9c0\uba85\u00b7\uc5ed \uc774\ub984, \uc2dc\u00b7\ub3c4\uc640 \uc2dc\u00b7\uad70\u00b7\uad6c\ub85c \uac80\uc0c9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "Ubot \ub9e4\uc7a5 \ucc3e\uae30\uc5d0\uc11c\ub294 \ub9e4\uc7a5\ubcc4 \uc601\uc5c5\uc2dc\uac04\ub3c4 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\ucc57\ubd07\uc5d0 \uc9c0\uc5ed\uba85\uc744 \ub9d0\uc500\ud574 \uc8fc\uc154\ub3c4 \uac00\uae4c\uc6b4 \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}]}, {"id": "1512", "t": "\ub0b4 \uc8fc\ubcc0\uc5d0 \uc788\ub294 Ubot \ub9e4\uc7a5\uc744 \ucc3e\uc544 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud604\uc7ac \uc704\uce58\ub97c \ud5c8\uc6a9\ud558\uba74 \uac00\uae4c\uc6b4 Ubot \ub9e4\uc7a5\uc744 \uac70\ub9ac\uc21c\uc73c\ub85c \ucc3e\uc544 \uc9c0\ub3c4\uc640 \ud568\uaed8 \ubcf4\uc5ec \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub9e4\uc7a5 \uac80\uc0c9\uc5d0\uc11c \uc704\uce58\ub97c \ud5c8\uc6a9\ud558\uc9c0 \uc54a\uc73c\uba74 \uc9c0\uc5ed\uc774\ub098 \uc5ed \uc774\ub984\uc744 \uc54c\ub824 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1520", "t": "\ub9e4\uc7a5\uae4c\uc9c0 \uac00\ub294 \uae38\uc744 \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub9e4\uc7a5\uc744 \uace0\ub978 \ub4a4 \ub3c4\ubcf4, \uc790\ub3d9\ucc28, \ub300\uc911\uad50\ud1b5 \uc911 \uc774\ub3d9 \ubc29\ubc95\uc744 \uc120\ud0dd\ud558\uba74 \ud604\uc7ac \uc704\uce58\uc5d0\uc11c \ub9e4\uc7a5\uae4c\uc9c0 \uac00\ub294 \uacbd\ub85c\uc640 \uc608\uc0c1 \uc2dc\uac04\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "1526", "t": "\ud68c\uc0ac \uadfc\ucc98\uc5d0 \uc788\ub294 \ub9e4\uc7a5\uc744 \ucc3e\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud68c\uc0ac \uc8fc\uc18c\ub098 \uac00\uae4c\uc6b4 \uc5ed\u00b7\uac74\ubb3c \uc774\ub984\uc744 \uc54c\ub824 \uc8fc\uc2dc\uba74 \uadf8 \uc8fc\ubcc0 Ubot \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "1552", "t": "\uc571\uc5d0\uc11c \uc9c0\uc5ed\ubcc4\ub85c \ub9e4\uc7a5 \ubaa9\ub85d\uc744 \ubcfc \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\uc758 \ub9e4\uc7a5 \ucc3e\uae30\uc5d0\uc11c \uc2dc\u00b7\ub3c4\ub97c \uace0\ub978 \ub4a4 \uc2dc\u00b7\uad70\u00b7\uad6c\ub97c \uace0\ub974\uba74 \uadf8 \uc9c0\uc5ed\uc5d0\uc11c \uc6b4\uc601 \uc911\uc778 \ub9e4\uc7a5 \ubaa9\ub85d\uc744 \ubcfc \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1553", "t": "\uc9c0\ub3c4\uc5d0\uc11c \ub9e4\uc7a5 \uc704\uce58\ub97c \ubcfc \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \ub9e4\uc7a5 \ucc3e\uae30 \uc9c0\ub3c4\uc5d0\uc11c \ub9e4\uc7a5 \uc704\uce58\ub97c \ubcfc \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub9e4\uc7a5 \ucc3e\uae30 \uc9c0\ub3c4\ub97c \ub113\uac8c \ubcf4\uba74 \uac00\uae4c\uc6b4 \ub9e4\uc7a5\uc774 \ubb36\uc5ec \uac1c\uc218\ub85c \ud45c\uc2dc\ub429\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\uc9c0\ub3c4\uc5d0\uc11c \ubb36\uc74c\uc744 \ub204\ub974\uac70\ub098 \ud655\ub300\ud558\uba74 \ub9e4\uc7a5\uc774 \ud558\ub098\uc529 \ubcf4\uc785\ub2c8\ub2e4.", "y": 0}]}, {"id": "1554", "t": "\ud2b9\uc815 \uc11c\ube44\uc2a4\uac00 \ub418\ub294 \ub9e4\uc7a5\ub9cc \ucc3e\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \ub9e4\uc7a5 \ucc3e\uae30\uc5d0\uc11c \uba85\uc758\ub3c4\uc6a9 \uc811\uc218, \uc560\ud50c A/S, \uc678\uad6d\uc5b4 \uc9c0\uc6d0 \uac19\uc740 \uc11c\ube44\uc2a4 \uc885\ub958\ub97c \uace0\ub974\uba74 \uadf8 \uc11c\ube44\uc2a4\ub97c \uc81c\uacf5\ud558\ub294 \ub9e4\uc7a5\ub9cc \ubcfc \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "482", "t": "\uc9c0\ub3c4\uc5d0\uc11c \ud540 \ucc0d\uc740 \uc704\uce58 \uc8fc\ubcc0 \ub9e4\uc7a5\uc744 \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\uc120\ud0dd\ud558\uc2e0 \uc9c0\ub3c4 \uc704\uce58\ub97c \uae30\uc900\uc73c\ub85c \uc8fc\ubcc0 \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "75", "t": "\uac00\uae4c\uc6b4 \ub9e4\uc7a5\uc740 \uc5b4\ub5bb\uac8c \ucc3e\ub098\uc694?", "s": [{"i": 0, "t": "\uac00\uae4c\uc6b4 \ub9e4\uc7a5\uc740 \ud648
