218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0235", "q": "\uac00\uc785\uc790 \uc815\ubcf4\uc5d0 \uc788\ub294 \uc774\uba54\uc77c \uc8fc\uc18c\ub97c \ubc14\uafb8\uace0 \uc2f6\uc2b5\ub2c8\ub2e4", "g": "ANS", "f": [{"id": "1599", "t": "\ud68c\uc6d0 \uc815\ubcf4\ub294 \uc5b4\ub5bb\uac8c \ubc14\uafb8\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc758 \ub0b4 \uc815\ubcf4 \ud654\uba74\uc5d0\uc11c \uc774\ub984(20\uc790 \uc774\ub0b4)\uacfc \uac70\uc8fc \uc9c0\uc5ed\uc744 \ubc14\uafc0 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc774\uba54\uc77c, \uc0dd\ub144\uc6d4\uc77c, \uc131\ubcc4\uc740 \uc571\uc5d0\uc11c \ubc14\uafc0 \uc218 \uc5c6\uc73c\ub2c8 \uace0\uac1d\uc13c\ud130(114)\uc5d0 \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 1}]}]}, {"id": "Q0236", "q": "\ud574\uc9c0\ud55c \uc9c0 \ud55c \ub2ec\uc774 \uc9c0\ub0ac\ub294\ub370 \ub9c8\uc9c0\ub9c9 \uc694\uae08\uc774 \ub610 \uccad\uad6c\ub410\uc2b5\ub2c8\ub2e4", "g": "ANS", "f": [{"id": "1176", "t": "\ud574\uc9c0\ud55c \ub4a4 \ub354 \ub0b8 \uc694\uae08\uc740 \uc5b4\ub5bb\uac8c \ub3cc\ub824\ubc1b\ub098\uc694?", "s": [{"i": 0, "t": "\ud68c\uc120\uc744 \ud574\uc9c0\ud55c \ub4a4 \uacfc\ub0a9\uae08\uc774 \ub0a8\uc558\ub2e4\uba74 \uc571\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0 \ud658\ubd88 \uacc4\uc88c\ub97c \ub4f1\ub85d\ud574 7\uc601\uc5c5\uc77c \uc548\uc5d0 \ub3cc\ub824\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud574\uc9c0 \ud6c4 \uacfc\ub0a9\uae08\uc774 100\uc6d0 \uc774\uc0c1\uc774\uba74 \ub4f1\ub85d\ub41c \uc790\ub3d9\uc774\uccb4 \uacc4\uc88c\ub85c \uc790\ub3d9 \ud658\ubd88\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1184", "t": "\ud560\ubd80\ub97c 24\uac1c\uc6d4\ub85c \ud588\ub294\ub370 \ud560\ubd80\uae08\uc774 25\ubc88 \uccad\uad6c\ub410\uc5b4\uc694.", "s": [{"i": 0, "t": "\ub2e8\ub9d0 \ud560\ubd80\uae08\uc740 \ud558\ub8e8 \ub2e8\uc704\ub85c \uacc4\uc0b0\ud574 \ub9e4\uc6d4 1\uc77c\ubd80\ud130 \ub9d0\uc77c\uae4c\uc9c0\uc758 \uae08\uc561\uc744 \ub2e4\uc74c \ub2ec\uc5d0 \uccad\uad6c\ud569\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud734\ub300\ud3f0\uc744 \uc6d4 \uc911\uac04\uc5d0 24\uac1c\uc6d4 \ud560\ubd80\ub85c \uc0c0\ub2e4\uba74 \uccab \ub2ec\uacfc \ub9c8\uc9c0\ub9c9 \ub2ec \uae08\uc561\uc774 \ub098\ub258\uc5b4 \uccad\uad6c \ud69f\uc218\uac00 25\ubc88\uc774 \ub420 \uc218 \uc788\uc9c0\ub9cc \uc804\uccb4 \uae08\uc561\uc740 \uac19\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "127", "t": "\ud574\uc9c0\ud588\ub294\ub370 \ub354 \ub0b8 \uc694\uae08\uc774 \uc788\uc73c\uba74 \uc5b4\ub5bb\uac8c \ub3cc\ub824\ubc1b\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ud68c\uc120\uc744 \ud574\uc9c0\ud55c \ub4a4 \uacfc\ub0a9\uae08\uc774 \ub0a8\uc558\ub2e4\uba74 \uace0\uac1d\uc13c\ud130\uc5d0 \ud658\ubd88 \uacc4\uc88c\ub97c \ub4f1\ub85d\ud574 \ub3cc\ub824\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1420", "t": "\ud574\uc9c0\ud588\ub294\ub370 \uc694\uae08\uc774 \ub610 \uccad\uad6c\ub410\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud68c\uc120\uc744 \ud574\uc9c0\ud55c \ub4a4\uc5d0\ub3c4 \ud574\uc9c0 \uc804 \ub9c8\uc9c0\ub9c9 \ub2ec \uc0ac\uc6a9\ubd84, \ub4a4\ub2a6\uac8c \uc815\uc0b0\ub41c \ub85c\ubc0d\u00b7\uad6d\uc81c\uc804\ud654 \uc694\uae08, \ub0a8\uc740 \ud560\ubd80\uae08\uc774 \uccad\uad6c\ub420 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud574\uc9c0 \ud6c4 \ub098\uc628 \uc694\uae08\uc740 \uccad\uad6c\uc11c \uc0c1\uc138 \ub0b4\uc5ed\uc5d0\uc11c \ud655\uc778\ud558\uace0 \uc774\ud574\ub418\uc9c0 \uc54a\ub294 \uae08\uc561\uc740 \uace0\uac1d\uc13c\ud130\uc5d0 \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "1442", "t": "\ud574\uc9c0 \ud6c4 \uc5f0\uccb4 \uc694\uae08 \ub0a9\ubd80 \uc548\ub0b4\ub97c \ubc1b\uc558\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud574\uc9c0 \ud6c4 \ub0a8\uc740 \uc694\uae08\uc740 \uc548\ub0b4 \ubb38\uc790\ub098 \uc6b0\ud3b8\uc5d0 \uc801\ud78c \uac00\uc0c1\uacc4\uc88c\ub85c \uc785\uae08\ud558\uac70\ub098 \uace0\uac1d\uc13c\ud130\u00b7\ub9e4\uc7a5\uc5d0\uc11c \ub0bc \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud574\uc9c0 \ud6c4 \ub0a9\ubd80 \uc548\ub0b4\uac00 \uc758\uc2ec\uc2a4\ub7ec\uc6b0\uba74 \ubb38\uc790 \ub9c1\ud06c\ub97c \ub204\ub974\uc9c0 \ub9d0\uace0 \uace0\uac1d\uc13c\ud130(114)\uc5d0\uc11c \ubbf8\ub0a9 \uc5ec\ubd80\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}]}, {"id": "Q0238", "q": "\ud3f0 \uc783\uc5b4\ubc84\ub9b0 \uac83 \uac19\uc740\ub370 \ub204\uac00 \uc4f0\uba74 \uc5b4\uca4c\uc8e0", "g": "ANS", "f": [{"id": "1447", "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\uc5b4\uc694. \uc5b4\ub5bb\uac8c \ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \uba3c\uc800 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\ub098 \uace0\uac1d\uc13c\ud130 ARS(114)\uc5d0\uc11c \ubd84\uc2e4 \uc2e0\uace0\uc640 \ubd84\uc2e4 \uc815\uc9c0\ub97c \ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ubd84\uc2e4 \uc815\uc9c0\ub294 \ubb34\ub8cc\uc774\uace0 \ucd5c\ub300 90\uc77c \ub3d9\uc548 \ub2e4\ub978 \uc0ac\ub78c\uc774 \ub0b4 \ubc88\ud638\ub85c \uc804\ud654\u00b7\uacb0\uc81c\ud558\ub294 \uac83\uc744 \ub9c9\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "51", "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\ub2e4\uba74 \uc989\uc2dc \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud558\uace0 \ud68c\uc120\uc744 \uc77c\uc2dc \uc815\uc9c0\ud558\ub294 \uac83\uc744 \uad8c\uc7a5\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "52", "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4 \uc2e0\uace0\ub294 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4 \uc2e0\uace0\ub294 \uc571, \ud648\ud398\uc774\uc9c0 \ub610\ub294 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0240", "q": "\uc560\uac00 \ud3f0\uc73c\ub85c \uacb0\uc81c\ub97c \ub108\ubb34 \ub9ce\uc774 \ud574\uc694", "g": "ANS", "f": [{"id": "1187", "t": "\ud734\ub300\ud3f0 \uacb0\uc81c(\uc18c\uc561\uacb0\uc81c) \ud55c\ub3c4\ub294 \uc5bc\ub9c8\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uacb0\uc81c\uc758 \uae30\ubcf8 \ud55c\ub3c4\ub294 \uc6d4 30\ub9cc \uc6d0\uc774\uba70 \uc571\uc5d0\uc11c 1\ub9cc \uc6d0 \ub2e8\uc704\ub85c \ucd5c\ub300 100\ub9cc \uc6d0\uae4c\uc9c0 \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub9cc 19\uc138 \ubbf8\ub9cc\uc758 \ud734\ub300\ud3f0 \uacb0\uc81c \ud55c\ub3c4\ub294 \uc6d4 \ucd5c\ub300 5\ub9cc \uc6d0\uc785\ub2c8\ub2e4.", "y": 0}]}, {"id": "1188", "t": "\ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \uc544\uc608 \ub9c9\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \uc644\uc804\ud788 \ucc28\ub2e8\ud558\ub824\uba74 \uc571\uc5d0\uc11c \uacb0\uc81c \ud55c\ub3c4\ub97c 0\uc6d0\uc73c\ub85c \ubc14\uafb8\uac70\ub098 \ubb34\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\uc778 Ubot \ud734\ub300\ud3f0 \uacb0\uc81c \ucc28\ub2e8\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc774\ubbf8 \uc774\ub8e8\uc5b4\uc9c4 \ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \ucde8\uc18c\ud558\ub824\uba74 \uacb0\uc81c\ud55c \uac00\ub9f9\uc810\uc5d0 \uc694\uccad\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "1478", "t": "\ud734\ub300\ud3f0 \uacb0\uc81c \ube44\ubc00\ubc88\ud638\ub97c \uc124\uc815\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\uc758 \ud734\ub300\ud3f0 \uacb0\uc81c \uba54\ub274\uc5d0\uc11c \uacb0\uc81c \ube44\ubc00\ubc88\ud638\ub97c \uc124\uc815\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \uacb0\uc81c \ube44\ubc00\ubc88\ud638\ub97c \uc124\uc815\ud558\uba74 \uacb0\uc81c\ud560 \ub54c\ub9c8\ub2e4 \ube44\ubc00\ubc88\ud638\ub97c \ud55c \ubc88 \ub354 \uc785\ub825\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0241", "q": "\ub2e4\ub978 \ub370\ub85c \uc62e\uae30\uba74 \ubc88\ud638\ub294 \uc5b4\ub5bb\uac8c \ub418\ub294 \uac70\uc8e0", "g": "ANS", "f": [{"id": "1075", "t": "\ubc88\ud638\uc774\ub3d9\uc774 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9\uc740 \uc4f0\ub358 \ud734\ub300\ud3f0 \ubc88\ud638\ub97c \uadf8\ub300\ub85c \uc720\uc9c0\ud558\uba74\uc11c \ud1b5\uc2e0\uc0ac\ub9cc \ubc14\uafb8\ub294 \uc81c\ub3c4\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "Ubot\uc73c\ub85c \ubc88\ud638\uc774\ub3d9\ud558\uba74 \uc0c8 \ud68c\uc120\uc774 \uac1c\ud1b5\ub418\ub294 \uc989\uc2dc \uc774\uc804 \ud1b5\uc2e0\uc0ac \ud68c\uc120\uc740 \uc790\ub3d9 \ud574\uc9c0\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "3", "t": "\ubc88\ud638\uc774\ub3d9\uc744 \ud558\uba74 \uae30\uc874 \ubc88\ud638\ub97c \uadf8\ub300\ub85c \uc0ac\uc6a9\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9\uc744 \ud574\ub3c4 \uae30\uc874 \uc804\ud654\ubc88\ud638\ub97c \uadf8\ub300\ub85c \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0242", "q": "\ud1b5\ud654 \ud488\uc9c8\uc774 \ub5a8\uc5b4\uc9c0\ub294 \uac78 \ub204\uad6c\ud55c\ud14c \ub9d0\ud574\uc57c \ud558\uc8e0", "g": "ANS", "f": [{"id": "1015", "t": "\ud1b5\ud654\ud560 \ub54c \uc18c\ub9ac\uac00 \ub04a\uae30\uac70\ub098 \uc7a1\uc74c\uc774 \ub4e4\ub824\uc694.", "s": [{"i": 0, "t": "\ud1b5\ud654\ud560 \ub54c \uc18c\ub9ac\uac00 \ub04a\uae30\uac70\ub098 \uc7a1\uc74c\uc774 \ub4e4\ub9ac\ub294 \uac83\uc740 \ud2b9\uc815 \uc7a5\uc18c\uc758 \uc804\ud30c \uc0c1\ud0dc\ub098 \ub2e8\ub9d0\uae30 \uc124\uc815 \ub54c\ubb38\uc77c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud1b5\ud654 \ud488\uc9c8\uc774 \ub098\uc058\ub2e4\uba74 \uc704\uce58\ub97c \uc62e\uae30\uace0 \ud734\ub300\ud3f0\uc744 \uc7ac\ubd80\ud305\ud574 \ubcf4\uc138\uc694.", "y": 0}, {"i": 2, "t": "\uc704\uce58\ub97c \uc62e\uae30\uace0 \uc7ac\ubd80\ud305\ud574\ub3c4 \ud1b5\ud654 \ud488\uc9c8 \ubb38\uc81c\uac00 \uacc4\uc18d\ub418\uba74 \uace0\uac1d\uc13c\ud130\uc5d0 \ubc1c\uc0dd \uc7a5\uc18c\uc640 \uc2dc\uac04\uc744 \uc54c\ub824 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "1223", "t": "\uac74\ubb3c \uc548\uc774\ub098 \uc9d1\uc5d0\uc11c\ub9cc \ud1b5\ud654\uac00 \uc798 \uc548 \ub3fc\uc694.", "s": [{"i": 0, "t": "\uac74\ubb3c \uad6c\uc870\ub098 \uc9c0\ud558\ucc98\ub7fc \uc804\ud30c\uac00 \uc57d\ud55c \uacf3\uc5d0\uc11c\ub294 \ud734\ub300\ud3f0 \ud1b5\ud654 \ud488\uc9c8\uc774 \ub5a8\uc5b4\uc9c8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc9d1 \uc548\uc5d0\uc11c \ud1b5\ud654\uac00 \uc798\ub418\uc9c0 \uc54a\uc73c\uba74 \ud734\ub300\ud3f0 \uc124\uc815\uc5d0\uc11c Wi-Fi \ud1b5\ud654\ub97c \ucf1c\uc11c \uc9d1 Wi-Fi\ub85c \ud1b5\ud654\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\uc9d1\uc5d0\uc11c Wi-Fi \ud1b5\ud654\ub97c \uc774\uc6a9\ud574\ub3c4 \uacc4\uc18d \ubd88\ud3b8\ud558\uba74 \uace0\uac1d\uc13c\ud130(114)\uc5d0 \ud1b5\ud654 \ud488\uc9c8 \uc810\uac80\uc744 \uc2e0\uccad\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "1224", "t": "\ud1b5\ud654 \uc911\uc5d0 \uc18c\ub9ac\uac00 \ub04a\uae30\uac70\ub098 \uc7a1\uc74c\uc774 \uc0dd\uaca8\uc694.", "s": [{"i": 0, "t": "\ud1b5\ud654 \uc911 \uc18c\ub9ac\uac00 \ub04a\uae30\uac70\ub098 \uc7a1\uc74c\uc774 \uc0dd\uae30\uba74 \ud734\ub300\ud3f0\uc744 \uc7ac\ubd80\ud305\ud558\uace0 \uc774\uc5b4\ud3f0\uc774\ub098 \ucf00\uc774\uc2a4\uac00 \ub9c8\uc774\ud06c\ub97c \uac00\ub9ac\uc9c0 \uc54a\ub294\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\ud1b5\ud654 \uc911 \uc7a1\uc74c\uc774\ub098 \ub04a\uae40\uc774 \ud2b9\uc815 \uc7a5\uc18c\uc5d0\uc11c\ub9cc \ubc18\ubcf5\ub418\uba74 \uace0\uac1d\uc13c\ud130\uc5d0 \uc704\uce58\uc640 \uc2dc\uac04\uc744 \uc54c\ub824 \uc8fc\uc2dc\uba74 \ud488\uc9c8\uc744 \uc810\uac80\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "1615", "t": "\uc2e4\ub0b4\uc5d0\uc11c \ud1b5\ud654\uac00 \uc798 \uc548 \ub418\uba74 \ud1b5\uc2e0 \ud488\uc9c8 \uac1c\uc120\uc744 \uc694\uccad\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc2e4\ub0b4 \ud1b5\ud654\uac00 \uc798 \uc548 \ub418\uba74 \ubb38\uc81c\uac00 \ub098\ub294 \uc7a5\uc18c\uc640 \uc2dc\uac04, \ud1b5\ud654 \ub04a\uae40 \ub610\ub294 \uc218\uc2e0 \ubd88\ub7c9 \uc99d\uc0c1\uc744 \uae30\ub85d\ud574 \uace0\uac1d\uc13c\ud130\uc758 \ud1b5\uc2e0 \ud488\uc9c8 \uc0c1\ub2f4 \ucc44\ub110\uc5d0 \uc810\uac80\uc744 \uc694\uccad\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uc2e4\ub0b4 \ud1b5\ud654 \ud488\uc9c8 \uc810\uac80\uc5d0\uc11c\ub294 \ub2e8\ub9d0 \uc124\uc815\uacfc \ud574\ub2f9 \uc9c0\uc5ed\uc758 \ub9dd \uc0c1\ud0dc\ub97c \ud568\uaed8 \ud655\uc778\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\uc2e4\ub0b4 \ud1b5\ud654 \ud488\uc9c8 \uac1c\uc120 \ubc29\ubc95\uc740 \uc810\uac80 \uacb0\uacfc\uc5d0 \ub530\ub77c \uc548\ub0b4\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "83", "t": "\ud1b5\uc2e0 \uc11c\ube44\uc2a4 \uc7a5\uc560\uac00 \ubc1c\uc0dd\ud588\ub294\uc9c0 \ud655\uc778\ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud1b5\uc2e0 \uc11c\ube44\uc2a4 \uc7a5\uc560 \uc5ec\ubd80\ub294 \ud1b5\uc2e0\uc0ac \ud648\ud398\uc774\uc9c0\ub098 \uace0\uac1d\uc13c\ud130\uc758 \uc7a5\uc560\u00b7\uc810\uac80 \uc548\ub0b4\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0243", "q": "\uc81c \uc774\ub984\uc73c\ub85c \ubaa8\ub974\ub294 \ud68c\uc120\uc774 \uc788\ub294 \uac83 \uac19\uc544\uc694", "g": "ANS", "f": [{"id": "1463", "t": "\uba85\uc758\ub3c4\uc6a9\uc744 \ub2f9\ud55c \uac83 \uac19\uc544\uc694. \uc5b4\ub5bb\uac8c \ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uba85\uc758\ub3c4\uc6a9\uc774 \uc758\uc2ec\ub418\uba74 \ubc14\ub85c \uace0\uac1d\uc13c\ud130(114)\uc5d0 \uc2e0\uace0\ud558\uace0 \ud55c\uad6d\uc815\ubcf4\ud1b5\uc2e0\uc9c4\ud765\ud611\ud68c\uc758 \uba85\uc758\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4(\uc5e0\uc138\uc774\ud37c)\uc5d0\uc11c \ub0b4 \uba85\uc758\ub85c \uac00\uc785\ub41c \ud68c\uc120\uc744 \ubaa8\ub450 \uc870\ud68c\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9\uc73c\ub85c \ud655\uc778\ub41c \ud68c\uc120\uc740 \uacbd\ucc30 \uc2e0\uace0 \uc811\uc218\uc99d\uacfc \ud568\uaed8 \ub9e4\uc7a5\uc5d0\uc11c \ud574\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1529", "t": "\uc81c \uba85\uc758\ub85c \uac00\uc785\ub41c \ud68c\uc120\uc744 \ubaa8\ub450 \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \uba85\uc758\ub85c \uac00\uc785\ub41c \ud734\ub300\ud3f0\u00b7\ud0dc\ube14\ub9bf\u00b7\uc6cc\uce58 \ud68c\uc120\uc758 \ubc88\ud638, \uc694\uae08\uc81c, \uc774\uc6a9 \uc0c1\ud0dc\ub97c \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "156", "t": "\uc81c\uac00 \uac00\uc785\ud558\uc9c0 \uc54a\uc740 \ud68c\uc120\uc774 \uc81c \uba85\uc758\ub85c \uac1c\ud1b5\ub410\uc5b4\uc694.", "s": [{"i": 0, "t": "\uac00\uc785\ud558\uc9c0 \uc54a\uc740 \ud68c\uc120\uc774 \ubcf8\uc778 \uba85\uc758\ub85c \uac1c\ud1b5\ub410\ub2e4\uba74 \uc571\uc758 \uba85\uc758\ub3c4\uc6a9 \uc870\ud68c\uc5d0\uc11c \ub0b4 \uba85\uc758 \ud68c\uc120\uc744 \ud655\uc778\ud558\uace0 \uc989\uc2dc \uace0\uac1d\uc13c\ud130\uc5d0 \uc2e0\uace0\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9\uc744 \ub9c9\uae30 \uc704\ud574 \ubb34\ub8cc \ubc88\ud638\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4\ub3c4 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "328", "t": "\uc81c\uac00 \ubaa8\ub974\ub294 \ud68c\uc120\uc774 \uc870\ud68c\ub410\uc5b4\uc694.", "s": [{"i": 0, "t": "\ubaa8\ub974\ub294 \ud68c\uc120\uc774 \ubcf8\uc778 \uba85\uc758\ub85c \uc870\ud68c\ub410\ub2e4\uba74 \uc989\uc2dc \uace0\uac1d\uc13c\ud130\uc5d0 \uc5f0\ub77d\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ubc88\ud638\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4\ub97c \ubb34\ub8cc\ub85c \uc2e0\uccad\ud558\uba74 \ubcf8\uc778 \uba85\uc758\uc758 \ucd94\uac00 \ud68c\uc120 \uac1c\ud1b5\uc744 \ub9c9\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "461", "t": "\uc81c \uba85\uc758\ub85c \ubaa8\ub974\ub294 \ud68c\uc120\uc774 \uc788\uc5b4\uc11c \ub9e4\uc7a5\uc5d0 \ubc14\ub85c \uac00 \ubcf4\ub824\uace0\uc694.", "s": [{"i": 0, "t": "\ubaa8\ub974\ub294 \ud68c\uc120\uc774 \ubcf8\uc778 \uba85\uc758\ub85c \uac1c\ud1b5\ub41c \ubb38\uc81c\ub97c \uc0c1\ub2f4\ud560 \uc218 \uc788\ub294 \ud604\uc7ac \uc704\uce58 \uc8fc\ubcc0 \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9\uc744 \ub9c9\ub294 \ubc88\ud638\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4\ub3c4 \ubb34\ub8cc\ub85c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0244", "q": "\ud734\ub300\ud3f0 \uc694\uae08 \ub0b4\ub294 \ub0a0\uc774 \ub108\ubb34 \ube68\ub77c\uc11c\uc694", "g": "ANS", "f": [{"id": "1160", "t": "\uc694\uae08 \ub0a9\ubd80\uc77c\uc740 \uc5b8\uc81c\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc694\uae08\uc758 \uae30\ubcf8 \ub0a9\ubd80\uc77c\uc740 \ub9e4\uc6d4 21\uc77c\uc785\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uacc4\uc88c\u00b7\uce74\ub4dc \uc790\ub3d9\uc774\uccb4\ub97c \uc774\uc6a9\ud55c\ub2e4\uba74 \ub0a9\ubd80\uc77c\uc744 10\uc77c, 15\uc77c, 21\uc77c, 25\uc77c \uc911\uc5d0\uc11c \uc120\ud0dd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0246", "q": "\uc774\uc0ac \uac00\uba74 \uc778\ud130\ub137 \uc120\uc740 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694", "g": "ANS", "f": [{"id": "304", "t": "\uc774\uc0ac \uac08 \ub54c \uc778\ud130\ub137\uc744 \uc62e\uae30\uba74 \ube44\uc6a9\uc774 \ub4dc\ub098\uc694?", "s": [{"i": 0, "t": "\uc774\uc0ac\ud560 \ub54c \uc778\ud130\ub137\uc744 \uc62e\uae30\ub294 \uc774\uc804 \uc124\uce58\ube44\ub294 22,000\uc6d0\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc778\ud130\ub137 \uc774\uc804 \uc124\uce58\ub294 \uc2e0\uccad \ud6c4 \ud3c9\uade0 2~3\uc77c \uc774\ub0b4\uc5d0 \ubc29\ubb38\ud574 \uc9c4\ud589\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "444", "t": "\uc774\uc0ac \uac08 \ub3d9\ub124\uc5d0\uc11c \uc778\ud130\ub137 \uc774\uc804 \uc0c1\ub2f4\ubc1b\uc744 \ub9e4\uc7a5\uc774 \uc788\uc744\uae4c\uc694?", "s": [{"i": 0, "t": "\uc774\uc0ac \uac08 \uc0c8 \uc8fc\uc18c\ub97c \uc54c\ub824 \uc8fc\uc2dc\uba74 \uc8fc\ubcc0\uc5d0\uc11c \uc778\ud130\ub137 \uc774\uc804 \uc0c1\ub2f4\uc774 \uac00\ub2a5\ud55c \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc774\uc0ac\ub85c \uc778\ud55c \uc778\ud130\ub137 \uc774\uc804 \uc124\uce58\ube44\ub294 22,000\uc6d0\uc785\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0248", "q": "\ud574\uc678 \uc9c1\uad6c\ud55c \ud3f0\ub3c4 \uc6b0\ub9ac\ub098\ub77c\uc5d0\uc11c \ub418\ub098\uc694", "g": "ANS", "f": [{"id": "1322", "t": "\ud574\uc678\uc5d0\uc11c \uc0b0 \ud734\ub300\ud3f0\uc744 \uad6d\ub0b4\uc5d0\uc11c \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \uc0b0 \ud734\ub300\ud3f0\ub3c4 \uad6d\ub0b4 \uc804\ud30c \uc778\uc99d\uc744 \ubc1b\uc740 \ubaa8\ub378\uc774\uace0 \ud1b5\uc2e0\uc0ac \uc7a0\uae08\uc774 \uc5c6\ub2e4\uba74 Ubot \uc720\uc2ec\uc744 \ub07c\uc6cc \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud574\uc678 \uc804\uc6a9 \ud734\ub300\ud3f0 \ubaa8\ub378\uc740 \uad6d\ub0b4 \uc77c\ubd80 \uc8fc\ud30c\uc218\ub098 VoLTE\ub97c \uc9c0\uc6d0\ud558\uc9c0 \uc54a\uc544 \ud1b5\ud654 \ud488\uc9c8\uc774 \ub5a8\uc5b4\uc9c8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0249", "q": "\uac00\uc871 \uc911 \ud55c \uba85\uc774 \ud574\uc9c0\ud558\uba74 \ub098\uba38\uc9c0\ub294\uc694", "g": "ANS", "f": [{"id": "1382", "t": "\uacb0\ud569 \uc911\uc778 \ud68c\uc120 \ud558\ub098\ub97c \ud574\uc9c0\ud558\uba74 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\uacb0\ud569 \uc911\uc778 \ud68c\uc120 \ud558\ub098\ub97c \ud574\uc9c0\ud558\uba74 \ub0a8\uc740 \ud68c\uc120 \uc218\uc5d0 \ub9de\ub294 \ud560\uc778 \uae08\uc561\uc73c\ub85c \ub2e4\uc74c \ub2ec\ubd80\ud130 \uc790\ub3d9 \ubcc0\uacbd\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud68c\uc120 \ud574\uc9c0 \ud6c4 \uacb0\ud569 \ucd5c\uc18c \uc870\uac74\uc778 2\ud68c\uc120\uc744 \ucc44\uc6b0\uc9c0 \ubabb\ud558\uba74 \uacb0\ud5 ub3d9\ud558\uba74 \uae30\uc874 \ud1b5\uc2e0\uc0ac \ubd80\uac00\uc11c\ube44\uc2a4\ub294 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9\uc73c\ub85c \uae30\uc874 \ud1b5\uc2e0\uc0ac \ud68c\uc120\uc774 \ud574\uc9c0\ub418\uba74 \uadf8 \ud1b5\uc2e0\uc0ac\uc758 \ubd80\uac00\uc11c\ube44\uc2a4\ub3c4 \uc885\ub8cc\ub429\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ubc88\ud638\uc774\ub3d9 \ud6c4\uc5d0\ub3c4 \ud544\uc694\ud55c \ubd80\uac00\uc11c\ube44\uc2a4\ub294 \uc0c8 \ud1b5\uc2e0\uc0ac\uc5d0\uc11c \ub2e4\uc2dc \uac00\uc785\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "1610", "t": "\uae30\uc874 \ud1b5\uc2e0\uc0ac\uc5d0 \ubbf8\ub0a9 \uc694\uae08\uc774 \uc788\uc73c\uba74 \ubc88\ud638\uc774\ub3d9 \uc804\uc5d0 \ubb34\uc5c7\uc744 \ud655\uc778\ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9 \uc804\uc5d0 \uae30\uc874 \ud1b5\uc2e0\uc0ac\uc758 \ubbf8\ub0a9 \ub0b4\uc5ed\uacfc \ubc88\ud638\uc774\ub3d9 \uac00\ub2a5 \uc0c1\ud0dc\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\ubbf8\ub0a9\uc774 \ubc88\ud638\uc774\ub3d9 \uac1c\ud1b5\uc5d0 \uc601\ud5a5\uc744 \uc8fc\ub294\uc9c0, \ub0a9\ubd80\uac00 \ud544\uc694\ud55c\uc9c0\uc640 \ub0a9\ubd80 \ud6c4 \ubc18\uc601 \uc2dc\uc810\uc740 \uae30\uc874 \ud1b5\uc2e0\uc0ac\uc640 \uc774\ub3d9\ud560 \ud1b5\uc2e0\uc0ac\uc758 \uc548\ub0b4\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "3", "t": "\ubc88\ud638\uc774\ub3d9\uc744 \ud558\uba74 \uae30\uc874 \ubc88\ud638\ub97c \uadf8\ub300\ub85c \uc0ac\uc6a9\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9\uc744 \ud574\ub3c4 \uae30\uc874 \uc804\ud654\ubc88\ud638\ub97c \uadf8\ub300\ub85c \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0292", "q": "\ub85c\ubc0d \uc2e0\uccad\uc740 \uc5b4\ub514\uc11c \ud558\uace0 \uc694\uae08\uc740 \uc5bc\ub9c8\uc778\uac00\uc694?", "g": "ANS", "f": [{"id": "1297", "t": "\ub85c\ubc0d \uc0c1\ud488 \uc694\uae08\uc740 \uc5bc\ub9c8\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ub85c\ubc0d \uc0c1\ud488 \uc694\uae08\uc740 \uad6d\uac00\uc640 \uad00\uacc4\uc5c6\uc774 \ub370\uc774\ud130 \uc0ac\uc6a9 24\uc2dc\uac04 \uad6c\uac04\ub9c8\ub2e4 \ubca0\uc774\uc9c1 1GB 11,000\uc6d0, \ud50c\ub7ec\uc2a4 2GB 13,000\uc6d0, \ub9e5\uc2a4 5GB 15,000\uc6d0\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub85c\ubc0d \uc0c1\ud488\uc740 \ub370\uc774\ud130\ub97c \uc4f4 24\uc2dc\uac04 \uad6c\uac04\uc5d0\ub9cc \uc694\uae08\uc774 \ubd80\uacfc\ub418\uba70 \uc74c\uc131\ud1b5\ud654\uc640 \ubb38\uc790 \uc694\uae08\uc740 \ud3ec\ud568\ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "29", "t": "\ud574\uc678 \ub85c\ubc0d\uc740 \uc5b4\ub5bb\uac8c \uc2e0\uccad\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678 \ub85c\ubc0d\uc740 \uc571, \ud648\ud398\uc774\uc9c0, \uace0\uac1d\uc13c\ud130 \ub610\ub294 \ub85c\ubc0d\uc13c\ud130\uc5d0\uc11c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0293", "q": "\uba85\uc758\ubcc0\uacbd \uc808\ucc28\ub791 \ud544\uc694 \uc11c\ub958 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "ANS", "f": [{"id": "1093", "t": "\uba85\uc758 \ubcc0\uacbd\uc740 \uc544\ubb34\uc5d0\uac8c\ub098 \ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc815\ubd80\uc758 \ubc88\ud638 \ub9e4\ub9e4 \ubc29\uc9c0 \uc815\ucc45\uc5d0 \ub530\ub77c \ud734\ub300\ud3f0 \ud68c\uc120 \uba85\uc758 \ubcc0\uacbd\uc740 \uac00\uc871 \uac04 \ub4f1 \uc77c\ubd80 \uacbd\uc6b0\uc5d0\ub9cc \ud5c8\uc6a9\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uac00\uc871 \uac04 \uba85\uc758 \ubcc0\uacbd\uc740 \uac00\uc871\uad00\uacc4\uc99d\uba85\uc11c\ub85c \uad00\uacc4\ub97c \ud655\uc778\ud55c \ub4a4 \uc9c4\ud589\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "1094", "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \ud558\ub824\uba74 \ubb34\uc5c7\uc774 \ud544\uc694\ud55c\uac00\uc694?", "s": [{"i": 0, "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \ud558\ub824\uba74 \uae30\uc874 \uba85\uc758\uc790\uc640 \uc0c8 \uba85\uc758\uc790\uac00 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ud568\uaed8 \ub9e4\uc7a5\uc5d0 \ubc29\ubb38\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uac00\uc871 \uac04 \uba85\uc758 \ubcc0\uacbd\uc5d0\ub294 \ubc1c\uae09 3\uac1c\uc6d4 \uc774\ub0b4\uc758 \uac00\uc871\uad00\uacc4\uc99d\uba85\uc11c\ub3c4 \uc900\ube44\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 2, "t": "\uba85\uc758 \ubcc0\uacbd\uc5d0 \ud55c \uc0ac\ub78c\ub9cc \ubc29\ubb38\ud55c\ub2e4\uba74 \uc624\uc9c0 \uc54a\ub294 \uc0ac\ub78c\uc758 \uc778\uac10\uc99d\uba85\uc11c\uc640 \uc704\uc784\uc7a5\uc774 \ucd94\uac00\ub85c \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "1606", "t": "\uac00\uc871\uc5d0\uac8c \ud734\ub300\ud3f0 \ud68c\uc120 \uba85\uc758\ub97c \ubcc0\uacbd\ud558\ub824\uba74 \uc5b4\ub5a4 \uc11c\ub958\ub97c \uc900\ube44\ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uac00\uc871\uc5d0\uac8c \ud734\ub300\ud3f0 \ud68c\uc120 \uba85\uc758\ub97c \ubcc0\uacbd\ud558\ub824\uba74 \ud604\uc7ac \uba85\uc758\uc790\uc640 \ubc1b\uc744 \uc0ac\ub78c\uc758 \ubcf8\uc778 \ud655\uc778 \ubc0f \uad00\uacc4 \ud655\uc778\uc5d0 \ud544\uc694\ud55c \uc11c\ub958\ub97c \uc2e0\uccad \ucc44\ub110\uc5d0 \uba3c\uc800 \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uac00\uc871 \uba85\uc758 \ubcc0\uacbd\uc740 \ub300\ub9ac \uc2e0\uccad \uc5ec\ubd80\uc640 \uac00\uc785 \uc0c1\ud0dc\uc5d0 \ub530\ub77c \ucd94\uac00 \uc11c\ub958\uac00 \ub2ec\ub77c\uc9c8 \uc218 \uc788\uc73c\ubbc0\ub85c \ubc29\ubb38 \uc804\uc5d0 \ud544\uc694\ud55c \ubaa9\ub85d\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "381", "t": "\uba85\uc758 \ubcc0\uacbd \uc5c5\ubb34\ub97c \ud558\ub294 \uac00\uae4c\uc6b4 \ub9e4\uc7a5\uc744 \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud604\uc7ac \uc704\uce58 \uc8fc\ubcc0\uc5d0\uc11c \uba85\uc758 \ubcc0\uacbd\uc744 \ucde8\uae09\ud558\ub294 \uac00\uae4c\uc6b4 \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \uc704\ud574 \ub9e4\uc7a5\uc5d0 \ubc29\ubb38\ud560 \ub54c\ub294 \uc591\ub3c4\uc778\uacfc \uc591\uc218\uc778 \uc2e0\ubd84\uc99d, \uba85\uc758 \ubcc0\uacbd \ub3d9\uc758\uc11c\uac00 \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "81", "t": "\uba85\uc758 \ubcc0\uacbd\uc774 \uac00\ub2a5\ud55c\uac00\uc694?", "s": [{"i": 0, "t": "\ud5c8\uc6a9\ub418\ub294 \uc870\uac74\uc5d0\uc11c \ubcf8\uc778 \ud655\uc778 \ubc0f \ud544\uc694\ud55c \uc11c\ub958\ub97c \uc81c\ucd9c\ud558\uba74 \uba85\uc758 \ubcc0\uacbd\uc744 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0294", "q": "\uc77c\uc2dc\uc815\uc9c0 \uae30\uac04\uc740 \ucd5c\ub300 \uc5bc\ub9c8\uace0 \uc815\uc9c0 \uc911 \uc694\uae08\uc740 \ub0b4\uc57c \ud558\ub098\uc694?", "g": "ANS", "f": [{"id": "1431", "t": "\ud734\ub300\ud3f0\uc744 \uc7a0\uc2dc \uc26c\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc7a0\uc2dc \uc26c\ub824\uba74 Ubot \uc571\u00b7\uace0\uac1d\uc13c\ud130\u00b7\ub9e4\uc7a5\uc5d0\uc11c \uc77c\uc2dc\uc815\uc9c0\ub97c \uc2e0\uccad\ud558\uba74 \ub429\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud734\ub300\ud3f0 \uc77c\uc2dc\uc815\uc9c0\ub294 \uc5f0 2\ud68c, 1\ud68c \ucd5c\ub300 90\uc77c, \uc5f0\uac04 \ud569\uacc4 180\uc77c\uae4c\uc9c0 \uac00\ub2a5\ud569\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\uc77c\uc2dc\uc815\uc9c0 \uae30\uac04\uc5d0\ub294 \uc6d4 3,850\uc6d0\uc774 \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "1432", "t": "\uc77c\uc2dc\uc815\uc9c0 \uc911\uc5d0\ub3c4 \uc694\uae08\uc774 \ub098\uc624\ub098\uc694?", "s": [{"i": 0, "t": "\uc77c\uc2dc\uc815\uc9c0 \uae30\uac04\uc5d0\ub294 \uc694\uae08\uc81c \uc6d4\uc815\uc561 \ub300\uc2e0 \uc6d4 3,850\uc6d0\uc774 \uc77c\ud560 \uacc4\uc0b0\ub418\uc5b4 \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc77c\uc2dc\uc815\uc9c0 \uc911\uc5d0\ub3c4 \uc720\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4 \uc694\uae08\uc740 \uccad\uad6c\ub418\ubbc0\ub85c \ud544\uc694 \uc5c6\uc73c\uba74 \ud574\uc9c0\ud574 \uc8fc\uc138\ 5\uc758 \uc804\ud654\ubc88\ud638\uc640 \uc8fc\uc18c\ub97c \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "254", "t": "\uc9d1 \uc804\ud654\ub85c \uace0\uac1d\uc13c\ud130\uc5d0 \uac78\ub824\uba74 \uba87 \ubc88\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uc9d1 \uc804\ud654 \ub4f1 \uc77c\ubc18\uc804\ud654\ub85c \uace0\uac1d\uc13c\ud130\uc5d0 \uc5f0\ub77d\ud558\ub824\uba74 1500-0000\uc73c\ub85c \uac78\uc5b4 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0\uc73c\ub85c \uace0\uac1d\uc13c\ud130\uc5d0 \uc5f0\ub77d\ud560 \ub54c\ub294 114\ub85c \uac78 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "255", "t": "\uc0c1\ub2f4\uc6d0\uacfc \ud1b5\ud654\ud560 \uc218 \uc788\ub294 \uc2dc\uac04\uc740 \uc5b8\uc81c\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uc0c1\ub2f4\uc6d0 \uc6b4\uc601\uc2dc\uac04\uc740 \ud3c9\uc77c 09:00~18:00\uc774\uba70 \uc8fc\ub9d0\uacfc \uacf5\ud734\uc77c\uc740 \ud734\ubb34\uc785\ub2c8\ub2e4.", "y": 1}]}, {"id": "79", "t": "\uace0\uac1d\uc13c\ud130 \uc6b4\uc601\uc2dc\uac04\uc740 \uc5b8\uc81c\uc778\uac00\uc694?", "s": [{"i": 0, "t": "Ubot \uace0\uac1d\uc13c\ud130 \uc0c1\ub2f4\uc6d0\uc740 \ud3c9\uc77c \uc624\uc804 9\uc2dc\ubd80\ud130 \uc624\ud6c4 6\uc2dc\uae4c\uc9c0 \uc5f0\uacb0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubd84\uc2e4 \uc2e0\uace0\uc640 \uc694\uae08 \uc870\ud68c\u00b7\ub0a9\ubd80\ub294 114 \uc790\ub3d9\uc751\ub2f5\uc774\ub098 Ubot \uc571\uc5d0\uc11c 24\uc2dc\uac04 \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0312", "q": "\uba85\uc758\ub3c4\uc6a9 \ud655\uc778 \ubc29\ubc95\uc774\ub791 \uc2e0\uace0 \ubc29\ubc95\uc744 \uc54c\uace0 \uc2f6\uc5b4\uc694", "g": "ANS", "f": [{"id": "1463", "t": "\uba85\uc758\ub3c4\uc6a9\uc744 \ub2f9\ud55c \uac83 \uac19\uc544\uc694. \uc5b4\ub5bb\uac8c \ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uba85\uc758\ub3c4\uc6a9\uc774 \uc758\uc2ec\ub418\uba74 \ubc14\ub85c \uace0\uac1d\uc13c\ud130(114)\uc5d0 \uc2e0\uace0\ud558\uace0 \ud55c\uad6d\uc815\ubcf4\ud1b5\uc2e0\uc9c4\ud765\ud611\ud68c\uc758 \uba85\uc758\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4(\uc5e0\uc138\uc774\ud37c)\uc5d0\uc11c \ub0b4 \uba85\uc758\ub85c \uac00\uc785\ub41c \ud68c\uc120\uc744 \ubaa8\ub450 \uc870\ud68c\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9\uc73c\ub85c \ud655\uc778\ub41c \ud68c\uc120\uc740 \uacbd\ucc30 \uc2e0\uace0 \uc811\uc218\uc99d\uacfc \ud568\uaed8 \ub9e4\uc7a5\uc5d0\uc11c \ud574\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1464", "t": "\uba85\uc758\ub3c4\uc6a9\uc744 \ubbf8\ub9ac \ub9c9\uc744 \uc218 \uc788\ub294 \ubc29\ubc95\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc5e0\uc138\uc774\ud37c(M-Safer)\uc5d0\uc11c \uac00\uc785 \uc81c\ud55c \uc11c\ube44\uc2a4\ub97c \uc2e0\uccad\ud558\uba74 \ub2e4\ub978 \uc0ac\ub78c\uc774 \ub0b4 \uba85\uc758\ub85c \uc0c8 \ud734\ub300\ud3f0\uc744 \uac1c\ud1b5\ud558\ub294 \uac83\uc744 \ub9c9\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9\uc744 \ub9c9\uc73c\ub824\uba74 \uc2e0\ubd84\uc99d \uc0ac\ubcf8\uc744 \ud568\ubd80\ub85c \ubcf4\ub0b4\uc9c0 \ub9d0\uace0 \uc2e0\ubd84\uc99d\uc744 \uc783\uc5b4\ubc84\ub838\ub2e4\uba74 \ubc14\ub85c \ubd84\uc2e4 \uc2e0\uace0\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1519", "t": "\uba85\uc758\ub3c4\uc6a9 \uc2e0\uace0\ub97c \uc811\uc218\ud558\ub294 \ub9e4\uc7a5\uc774 \uc5b4\ub514\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uba85\uc758\ub3c4\uc6a9 \uc2e0\uace0 \uc811\uc218\ub97c \uc9c0\uc6d0\ud558\ub294 Ubot \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9 \uc2e0\uace0 \uc811\uc218\ub97c \uc704\ud574 \ub9e4\uc7a5\uc5d0 \ubc29\ubb38\ud560 \ub54c\ub294 \uc2e0\ubd84\uc99d\uacfc \uacbd\ucc30 \uc2e0\uace0 \uc811\uc218\uc99d\uc744 \ucc59\uaca8 \uc8fc\uc138\uc694.", "y": 0}]}]}, {"id": "Q0313", "q": "\uc120\ubd88\ud3f0 \uac00\uc785 \ubc29\ubc95\uacfc \ucda9\uc804 \ubc29\ubc95\uc774 \uad81\uae08\ud569\ub2c8\ub2e4", "g": "ANS", "f": [{"id": "1", "t": "\ud734\ub300\ud3f0 \uc2e0\uaddc \uac00\uc785\uc740 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc2e0\uaddc \uac00\uc785\uc740 \ubcf8\uc778 \uc778\uc99d \ud6c4 \uc628\ub77c\uc778 \ub610\ub294 \ub9e4\uc7a5\uc5d0\uc11c \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1153", "t": "\uc120\ubd88 \uc694\uae08\uc81c\uac00 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot\uc740 \uc678\uad6d\uc778\ub4f1\ub85d\uc99d\uc774 \uc5c6\ub294 \uc678\uad6d\uc778\uacfc \ub2e8\uae30 \uc774\uc6a9\uc790\ub97c \uc704\ud55c \uc120\ubd88 \uc694\uae08\uc81c\ub97c \uc81c\uacf5\ud569\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "Ubot \uc120\ubd88 \uc694\uae08\uc81c\ub294 \ub9e4\uc7a5\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \uac00\uc785\ud558\uba70 \ucda9\uc804\ud55c \uae08\uc561\ub9cc\ud07c \uc0ac\uc6a9\ud558\ub294 \ubc29\uc2dd\uc785\ub2c8\ub2e4.", "y": 1}]}, {"id": "1154", "t": "\uc120\ubd88 \uc694\uae08\uc81c\ub294 \uc5b4\ub5bb\uac8c \ucda9\uc804\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc120\ubd88 \uc694\uae08\uc81c\ub294 \uc571\u00b7\ud648\ud398\uc774\uc9c0, \uace0\uac1d\uc13c\ud130, \ub9e4\uc7a5\uc5d0\uc11c 5,000\uc6d0, 10,000\uc6d0, 30,000\uc6d0, 50,000\uc6d0 \ub2e8\uc704\ub85c \ucda9\uc804\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc120\ubd88 \ucda9\uc804 \uae08\uc561\uc740 \ucda9\uc804\uc77c\ubd80\ud130 1\ub144 \uc548\uc5d0 \uc0ac\uc6a9\ud574\uc57c \ud558\uba70 \ub0a8\uc740 \uae08\uc561\uc740 \uc18c\uba78\ub429\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0314", "q": "\ubbf8\uc131\ub144\uc790 \uac00\uc785\uc5d0 \ud544\uc694\ud55c \uc11c\ub958\uc640 \uc694\uae08\uc81c \uc81c\ud55c\uc774 \uc788\ub294\uc9c0 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "ANS", "f": [{"id": "1029", "t": "\uccad\ub144 \uc694\uae08\uc81c\ub294 \uba87 \uc0b4\uae4c\uc9c0 \uac00\uc785\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uccad\ub144 \uc694\uae08\uc81c\ub294 \ub9cc 19~34\uc138\uac00 \uac00\uc785 \ub300\uc0c1\uc774\uba70 \ub9cc 35\uc138\uac00 \ub418\ub294 \ub2ec \ub9d0\uc77c\uae4c\uc9c0 \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uccad\ub144 \uc694\uae08\uc81c \uc774\uc6a9 \uae30\uac04\uc774 \ub05d\ub098\uba74 \uc77c\ubc18 \uc694\uae08\uc81c\ub85c \ubcc0\uacbd\ud558\ub294 \uc0c1\ub2f4\uc744 \ubc1b\uc544\uc57c \ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "1046", "t": "\ubbf8\uc131\ub144\uc790\ub3c4 \uac00\uc785\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubbf8\uc131\ub144\uc790\ub3c4 \ubc95\uc815\ub300\ub9ac\uc778\uc758 \ub3d9\uc758\uac00 \uc788\uc73c\uba74 \ud734\ub300\ud3f0\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubbf8\uc131\ub144\uc790 \uac00\uc785\uc5d0\ub294 \ubc95\uc815\ub300\ub9ac\uc778 \uc2e0\ubd84\uc99d, \ubc1c\uae09 3\uac1c\uc6d4 \uc774\ub0b4 \uac00\uc871\uad00\uacc4\uc99d\uba85\uc11c, \ubbf8\uc131\ub144\uc790 \ubcf8\uc778 \ud655\uc778 \uc11c\ub958\ub97c \uac00\uc9c0\uace0 \ubc95\uc815\ub300\ub9ac\uc778\uacfc \ud568\uaed8 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "1134", "t": "\uccad\uc18c\ub144\uc774\ub098 \uc5b4\ub9b0\uc774\uc6a9 \uc694\uae08\uc81c\uac00 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub9cc 12\uc138 \uc774\ud558 \uc5b4\ub9b0\uc774\ub294 Ubot \ud0a4\uc988 \uc548\uc2ec \uc694\uae08\uc81c(\uc6d4 6,900\uc6d0~19,000\uc6d0)\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc73c\uba70 \uc790\ub140 \uc704\uce58 \uacf5\uc720\uc640 \uc720\ud574 \uc0ac\uc774\ud2b8 \ucc28\ub2e8\uc744 \uc81c\uacf5\ud558\ub294 Ubot \ud0a4\uc988\uac00\ub4dc\uac00 \ud3ec\ud568\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub9cc 13\uc138\ubd80\ud130 18\uc138\uae4c\uc9c0\uc758 \uccad\uc18c\ub144\uc740 \ubc95\uc815\ub300\ub9ac\uc778 \ub3d9\uc758\ub97c \ubc1b\uc544 \uc77c\ubc18 \uc694\uae08\uc81c\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1136", "t": "\ubbf8\uc131\ub144\uc790\uac00 \uc694\uae08\uc81c\ub97c \ubc14\uafb8\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ub9cc 19\uc138 \ubbf8\ub9cc \uc774\uc6a9\uc790\uac00 \uc694\uae08\uc81c\ub97c \ubcc0\uacbd\ud560 \ub54c\ub294 \ubc95\uc815\ub300\ub9ac\uc778 \ub3d9\uc758\uac00 \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ubbf8\uc131\ub144\uc790 \uc694\uae08\uc81c \ubcc0\uacbd\uc740 \ubc95\uc815\ub300\ub9ac\uc778\uc774 \uace0\uac1d\uc13c\ud130\ub85c \uc804\ud654\ud558\uac70\ub098 \ud568\uaed8 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud574 \uc2e0\uccad\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 2, "t": "\ub9cc 19\uc138 \uc774\uc0c1\uc774\uba74 \ubc95\uc815\ub300\ub9ac\uc778 \ub3d9\uc758 \uc5c6\uc774 \uc571\uc5d0\uc11c \uc9c1\uc811 \uc694\uae08\uc81c\ub97c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "116", "t": "\ub9cc 17\uc138\ub3c4 \uc131\uc778 \uc694\uae08\uc81c\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub9cc 19\uc138 \ubbf8\ub9cc\ub3c4 \uc131\uc778 \uc694\uae08\uc81c\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc9c0\ub9cc \ubc95\uc815\ub300\ub9ac\uc778 \ub3d9\uc758\uac00 \ud544\uc694\ud574 \ubc95\uc815\ub300\ub9ac\uc778\uacfc \ud568\uaed8 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "74", "t": "\uccad\uc18c\ub144 \uc804\uc6a9 \uc694\uae08\uc81c\uac00 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uccad\uc18c\ub144\uc744 \uc704\ud55c \uc804\uc6a9 \ud61c\ud0dd\uc774 \ud3ec\ud568\ub41c \uc694\uae08\uc81c\uac00 \uc81c\uacf5\ub420 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "86", "t": "\ubbf8\uc131\ub144\uc790\ub3c4 \ud734\ub300\ud3f0\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubbf8\uc131\ub144\uc790\ub3c4 \ubc95\uc815\ub300\ub9ac\uc778 \ub3d9\uc758\uc640 \ud544\uc694\ud55c \uc11c\ub958\ub97c \uc900\ube44\ud558\uba74 \ud734\ub300\ud3f0\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "98", "t": "\uac00\uc785\ud560 \ub54c \ud544\uc694\ uc694\uae08\uc81c\uc785\ub2c8\ub2e4.", "y": 1}]}, {"id": "1446", "t": "\uac1c\ud1b5 \ud6c4 14\uc77c \uc548\uc5d0 \ud574\uc9c0\ud558\uba74 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\uac1c\ud1b5 \ud6c4 14\uc77c \uc548\uc5d0 \ud1b5\ud654 \ud488\uc9c8\uc774\ub098 \ub2e8\ub9d0\uae30 \ubd88\ub7c9\uc744 \uc774\uc720\ub85c \uac1c\ud1b5\uc744 \ucca0\ud68c\ud558\uba74 \ud560\uc778\ubc18\ud658\uae08 \uc5c6\uc774 \ud574\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uac1c\ud1b5 \ud6c4 \ub2e8\uc21c \ubcc0\uc2ec\uc5d0 \ub530\ub978 \ud574\uc9c0\ub294 \ucca0\ud68c \uc0ac\uc720\uac00 \uc544\ub2c8\ub77c \uc77c\ubc18 \ud574\uc9c0\ub85c \ucc98\ub9ac\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "219", "t": "\uacb0\ud569 \uc0c1\ud488\ub9cc \ud574\uc9c0\ud558\uba74 \uc704\uc57d\uae08\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uac00\uc871 \uacb0\ud569 \uc0c1\ud488\ub9cc \ud574\uc9c0\ud560 \ub54c \uacb0\ud569 \ud574\uc9c0\uc5d0 \ub530\ub978 \uc704\uc57d\uae08\uc740 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uac00\uc871 \uacb0\ud569 \ud560\uc778\uc744 \ud574\uc9c0\ud55c \ub2ec\uc758 \ub2e4\uc74c \ub2ec\ubd80\ud130 \ud560\uc778\uc774 \uc885\ub8cc\ub429\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0325", "q": "\uac00\uc871\uc774 \uc544\ub2c8\uc5b4\ub3c4 \uacb0\ud569\ud560 \uc218 \uc788\ub098\uc694?", "g": "ANS", "f": [{"id": "1373", "t": "\uce5c\uad6c\ub07c\ub9ac\ub3c4 \uacb0\ud569\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uce5c\uad6c \uacb0\ud569\uc740 \uc6d4\uc815\uc561 19,000\uc6d0 \uc774\uc0c1\uc778 \uce5c\uad6c \ud734\ub300\ud3f0 2\ud68c\uc120\uc774\uba74 \uc6d4 4,000\uc6d0, 3\ud68c\uc120\uc774\uba74 \uc6d4 9,000\uc6d0\uc744 \ub300\ud45c \ud68c\uc120\uc5d0\uc11c \ud560\uc778\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "1374", "t": "\ubd80\ubd80\ub098 \uc608\ube44 \ubd80\ubd80\ub3c4 \uacb0\ud569\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd80\ubd80\ub294 Ubot \uac00\uc871 \uacb0\ud569\uc73c\ub85c \ud560\uc778\ubc 9c0\ud574 \uc904 \uc0ac\ub78c\uc744 \ubbf8\ub9ac \uc9c0\uc815\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc7a5\uae30 \uc785\uc6d0\uc774\ub098 \uace0\ub839 \ub4f1\uc73c\ub85c \uc9c1\uc811 \ud574\uc9c0\ud558\uae30 \uc5b4\ub824\uc6b8 \ub54c\ub97c \ub300\ube44\ud574 \ub9e4\uc7a5\uc5d0\uc11c \ud574\uc9c0 \ub300\ub9ac\uc778\uc744 \ubbf8\ub9ac \uc9c0\uc815\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubbf8\ub9ac \uc9c0\uc815\ub41c \ud574\uc9c0 \ub300\ub9ac\uc778\uc740 \ubcf8\uc778 \uc2e0\ubd84\uc99d\ub9cc\uc73c\ub85c \ud574\uc9c0\ub97c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "217", "t": "\uac00\uc871\uc774 \ub300\uc2e0 \ud574\uc9c0\ud574 \uc904 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ud68c\uc120 \ud574\uc9c0\ub294 \uac00\uc871 \ub4f1 \ub300\ub9ac\uc778\ub3c4 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub300\ub9ac\uc778\uc774 \ud68c\uc120\uc744 \ud574\uc9c0\ud558\ub824\uba74 \uba85\uc758\uc790 \uc2e0\ubd84\uc99d\uacfc \uc704\uc784\uc7a5, \ubc1c\uae09 3\uac1c\uc6d4 \uc774\ub0b4\uc758 \uba85\uc758\uc790 \uc778\uac10\uc99d\uba85\uc11c\ub97c \uc900\ube44\ud574 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "45", "t": "\uc11c\ube44\uc2a4\ub97c \ud574\uc9c0\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud1b5\uc2e0 \uc11c\ube44\uc2a4\ub97c \ud574\uc9c0\ud558\ub824\uba74 \ubcf8\uc778 \uc778\uc99d \ud6c4 \uace0\uac1d\uc13c\ud130 \ub610\ub294 \ub9e4\uc7a5\uc5d0\uc11c \ud574\uc9c0\ub97c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0327", "q": "\uc694\uae08\uc744 \uc548 \ub0b4\uba74 \ubc14\ub85c \uc815\uc9c0\ub418\ub294 \uac74 \uc544\ub2c8\uc8e0?", "g": "ANS", "f": [{"id": "1168", "t": "\uc694\uae08\uc744 \ub0b4\uc9c0 \ubabb\ud558\uba74 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\uc694\uae08\uc744 \ub0a9\ubd80\uc77c\uc5d0 \ub0b4\uc9c0 \ubabb\ud558\uba74 \ub2e4\uc74c \ub0a0 \ubbf8\ub0a9 \uc548\ub0b4 \ubb38\uc790\uac00 \ubc1c\uc1a1\ub418\uace0 \ubbf8\ub0a9 \uae08\uc561\uc758 2%\uac00 \uc5f0\uccb4 \uac00\uc0b0\uae08\uc73c\ub85c \ud55c \ubc88 \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \uc694\uae08\uc744 2\uac1c\uc6d4 \uc774\uc0c1 \ubbf8\ub0a9\ud558\uba74 \uc804\ud654 \ubc1c\uc2e0\uc774 \uc815\uc9c0\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\ud734\ub300\ud3f0 \uc694\uae08\uc744 3\uac1c\uc6d4 \uc774\uc0c1 \ubbf8\ub0a9\ud558\uba74 \uc804\ud654 \uc218\uc2e0\uae4c\uc9c0 \uc815\uc9c0\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "1436", "t": "\ubbf8\ub0a9 \uc694\uae08\uc744 \ub0c8\ub294\ub370 \uc815\uc9c0\uac00 \ud480\ub9ac\uc9c0 \uc54a\uc544\uc694.", "s": [{"i": 0, "t": "\ubbf8\ub0a9 \uc694\uae08\uc744 \ub0a9\ubd80\ud558\uba74 \ud655\uc778 \ud6c4 \ubcf4\ud1b5 1\uc2dc\uac04 \uc548\uc5d0 \uc774\uc6a9 \uc815\uc9c0\uac00 \uc790\ub3d9\uc73c\ub85c \ud574\uc81c\ub429\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ubbf8\ub0a9 \uc815\uc9c0 \ud574\uc81c \uacb0\uacfc\ub294 \ud734\ub300\ud3f0\uc744 \ub2e4\uc2dc \ucf1c\uc57c \ubc18\uc601\ub420 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\ub0a9\ubd80 \ud6c4 2\uc2dc\uac04\uc774 \uc9c0\ub098\ub3c4 \uc815\uc9c0\uac00 \ud480\ub9ac\uc9c0 \uc54a\uc73c\uba74 \uace0\uac1d\uc13c\ud130(114)\uc5d0 \ub0a9\ubd80 \ub0b4\uc5ed\uc744 \uc54c\ub824 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1441", "t": "\uc694\uae08 \ubbf8\ub0a9\uc73c\ub85c \uc9c1\uad8c \ud574\uc9c0\ub418\uba74 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc694\uae08\uc744 3\uac1c\uc6d4 \uc774\uc0c1 \ub0b4\uc9c0 \uc54a\uc73c\uba74 \ud68c\uc120\uc774 \uc9c1\uad8c \ud574\uc9c0\ub418\uace0 \ub0a8\uc740 \uc694\uae08\uacfc \ud560\ubd80\uae08\uc740 \uacc4\uc18d \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc9c1\uad8c \ud574\uc9c0 \ud6c4\uc5d0\ub3c4 \uc694\uae08\uc744 \uacc4\uc18d \ub0b4\uc9c0 \uc54a\uc73c\uba74 \uc2e0\uc6a9\uc815\ubcf4\uae30\uad00 97c \uc9c0\uc6b0\uc9c0 \ub9d0\uace0 \ubcf4\uad00\ud574 \uc8fc\uc138\uc694.", "y": 1}]}]}, {"id": "Q0498", "q": "\ud574\uc9c0\ud558\uba74 \uc704\uc57d\uae08\uc774 \uc5bc\ub9c8\uc778\uc9c0\ub791 \uc624\ub298 \ub0a0\uc528\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1427", "t": "\uc57d\uc815 \uc911\uc5d0 \ud574\uc9c0\ud558\uba74 \uc704\uc57d\uae08\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc120\ud0dd\uc57d\uc815\uc774\ub098 \uacf5\uc2dc\uc9c0\uc6d0\uae08\uc744 \ubc1b\uace0 \uc57d\uc815 \uae30\uac04 \uc548\uc5d0 \ud68c\uc120\uc744 \ud574\uc9c0\ud558\uba74 \ubc1b\uc740 \ud560\uc778 \uae08\uc561 \uc911 \uc77c\ubd80\ub97c \ud560\uc778\ubc18\ud658\uae08\uc73c\ub85c \ub0b4\uc57c \ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc57d\uc815 \uae30\uac04\uc774 \ub9ce\uc774 \uc9c0\ub0a0\uc218\ub85d \ud574\uc9c0\ud560 \ub54c\uc758 \ud560\uc778\ubc18\ud658\uae08\uc740 \uc904\uc5b4\ub4ed\ub2c8\ub2e4.", "y": 1}]}, {"id": "46", "t": "\uc57d\uc815 \uae30\uac04 \uc911 \ud574\uc9c0\ud558\uba74 \uc704\uc57d\uae08\uc774 \ubc1c\uc0dd\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc57d\uc815 \uae30\uac04 \uc911 \ud1b5\uc2e0 \uc11c\ube44\uc2a4\ub97c \ud574\uc9c0\ud558\uba74 \ud560\uc778\uc774\ub098 \uc9c0\uc6d0\uae08\uc744 \ubc1b\uc740 \uacbd\uc6b0 \uacc4\uc57d \uc870\uac74\uc5d0 \ub530\ub77c \uc704\uc57d\uae08\uc774 \ubc1c\uc0dd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "681", "t": "\uc81c\uac00 \uc9c0\uae08 \ud574\uc9c0\ud558\uba74 \ud560\uc778\ubc18\ud658\uae08\uc774 \uc5bc\ub9c8\ub098 \ub098\uc640\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uc57d\uc815 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \uc624\ub298 \ud574\uc9c0\ud560 \uacbd\uc6b0\uc758 \uc608\uc0c1 \ud560\uc778\ubc18\ud658\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud560\uc778\ubc18\ud658\uae08\uc758 \uc2e4\uc81c \uccad\uad6c\uc561\uc740 \ud68c\uc120\uc744 \ud574\uc9c0\ud558\ub294 \ub0a0\uc5d0 \ub530\ub77c \ub2ec\ub77c\uc9c8 \uc218 \uc788\uc2b5 18 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1259", "t": "\uc720\uc2ec\uc744 \uc7ac\ubc1c\uae09(\uad50\uccb4)\ubc1b\uc73c\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc720\uc2ec\uc744 \uc7ac\ubc1c\uae09\ubc1b\uc73c\ub824\uba74 \uba85\uc758\uc790 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud558\uac70\ub098 Ubot \uc571\uc5d0\uc11c \uc2e0\uccad\ud574 \ud0dd\ubc30\ub85c \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc0c8 \uc720\uc2ec\uc744 \ubc1b\uc558\ub2e4\uba74 \uc571\uc5d0\uc11c \uc720\uc2ec \uad50\uccb4 \ub4f1\ub85d\uc744 \ud558\uac70\ub098 \ub9e4\uc7a5\uc5d0\uc11c \ubc14\ub85c \uad50\uccb4\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0501", "q": "\ub85c\ubc0d \uc2e0\uccad \ubc29\ubc95\uc774\ub791 \uc77c\ubcf8 \ud604\uc9c0 \ub9db\uc9d1\ub3c4 \ucd94\ucc9c\ud574 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "29", "t": "\ud574\uc678 \ub85c\ubc0d\uc740 \uc5b4\ub5bb\uac8c \uc2e0\uccad\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678 \ub85c\ubc0d\uc740 \uc571, \ud648\ud398\uc774\uc9c0, \uace0\uac1d\uc13c\ud130 \ub610\ub294 \ub85c\ubc0d\uc13c\ud130\uc5d0\uc11c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0502", "q": "\uba85\uc758\ubcc0\uacbd \ubc29\ubc95\uc774\ub791 \uc774 \ud68c\uc0ac \uc8fc\uac00\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1093", "t": "\uba85\uc758 \ubcc0\uacbd\uc740 \uc544\ubb34\uc5d0\uac8c\ub098 \ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc815\ubd80\uc758 \ubc88\ud638 \ub9e4\ub9e4 \ubc29\uc9c0 \uc815\ucc45\uc5d0 \ub530\ub77c \ud734\ub300\ud3f0 \ud68c\uc120 \uba85\uc758 \ubcc0\uacbd\uc740 \uac00\uc871 \uac04 \ub4f1 \uc77c\ubd80 \uacbd\uc6b0\uc5d0\ub9cc \ud5c8\uc6a9\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uac00\uc871 \uac04 \uba85\uc758 \ubcc0\uacbd\uc740 \uac00\uc871\uad00\uacc4\uc99d\uba85\uc11c\ub85c \uad00\uacc4\ub97c \ud655\uc778\ud55c \ub4a4 \uc9c4\ud589\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "1094", "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \ud558\ub824\uba74 \ubb34\uc5c7\uc774 \ud544\uc694\ud55c\uac00\uc694?", "s": [{"i": 0, "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \ud558\ub824\uba74 \uae30\uc874 \uba85\uc758\uc790\uc640 \uc0c8 \uba85\uc758\uc790\uac00 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ud568\uaed8 \ub9e4\uc7a5\uc5d0 \ubc29\ubb38\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uac00\uc871 \uac04 \uba85\uc758 \ubcc0\uacbd\uc5d0\ub294 \ubc1c\uae09 3\uac1c\uc6d4 \uc774\ub0b4\uc758 \uac00\uc871\uad00\uacc4\uc99d\uba85\uc11c\ub3c4 \uc900\ube44\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 2, "t": "\uba85\uc758 \ubcc0\uacbd\uc5d0 \ud55c \uc0ac\ub78c\ub9cc \ubc29\ubb38\ud55c\ub2e4\uba74 \uc624\uc9c0 \uc54a\ub294 \uc0ac\ub78c\uc758 \uc778\uac10\uc99d\uba85\uc11c\uc640 \uc704\uc784\uc7a5\uc774 \ucd94\uac00\ub85c \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "81", "t": "\uba85\uc758 \ubcc0\uacbd\uc774 \uac00\ub2a5\ud55c\uac00\uc694?", "s": [{"i": 0, "t": "\ud5c8\uc6a9\ub418\ub294 \uc870\uac74\uc5d0\uc11c \ubcf8\uc778 \ud655\uc778 \ubc0f \ud544\uc694\ud55c \uc11c\ub958\ub97c \uc81c\ucd9c\ud558\uba74 \uba85\uc758 \ubcc0\uacbd\uc744 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0503", "q": "\ubc88\ud638\uc774\ub3d9 \uc808\ucc28\ub791 \ud0c0\uc0ac \ubc88\ud638\uc774\ub3d9 \ud61c\ud0dd \ube44\uad50\ub3c4 \ud574 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "2", "t": "\ub2e4\ub978 \ud1b5\uc2e0\uc0ac\uc5d0\uc11c \ubc88\ud638\uc774\ub3d9\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ub2e4\ub978 \ud1b5\uc2e0\uc0ac\uc5d0\uc11c Ubot\uc73c\ub85c \ubc88\ud638\uc774\ub3d9\ud558\ub824\uba74 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \uc2e0\uccad\ud558\uac70\ub098 \uba85\uc758\uc790 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ubc88\ud638\uc774\ub3d9 \uc2e0\uccad \uc2dc \ud604\uc7ac \ud1b5\uc2e0\uc0ac\ub97c \uc120\ud0dd\ud558\uace0 \ubcf8\uc778\uc778\uc99d\uc744 \uac70\uce58\uba74 \uae30\uc874 \uc804\ud654\ubc88\ud638\ub97c \uc720\uc9c0\ud55c \ucc44 \uac1c\ud1b5\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0504", "q": "\uc18c\uc561\uacb0\uc81c \ucc28\ub2e8 \ubc29\ubc95\uc774\ub791 \uce74\uce74\uc624\ud398\uc774 \ud55c\ub3c4\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1188", "t": "\ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \uc544\uc608 \ub9c9\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \uc644\uc804\ud788 \ucc28\ub2e8\ud558\ub824\uba74 \uc571\uc5d0\uc11c \uacb0\uc81c \ud55c\ub3c4\ub97c 0\uc6d0\uc73c\ub85c \ubc14\uafb8\uac70\ub098 \ubb34\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\uc778 Ubot \ud734\ub300\ud3f0 \uacb0\uc81c \ucc28\ub2e8\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc774\ubbf8 \uc774\ub8e8\uc5b4\uc9c4 \ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \ucde8\uc18c\ud558\ub824\uba74 \uacb0\uc81c\ud55c \uac00\ub9f9\uc810\uc5d0 \uc694\uccad\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "332", "t": "\uc18c\uc561\uacb0\uc81c\ub97c \uc544\uc608 \ub9c9\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc18c\uc561\uacb0\uc81c\ub97c \uc544\uc608 \ub9c9\uc73c\ub824\uba74 \uc571\uc5d0\uc11c \uc18c\uc561\uacb0\uc81c\ub97c \ucc28\ub2e8\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc18c\uc561\uacb0\uc81c \ud55c\ub3c4\ub3c4 \uc571\uc5d0\uc11c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\uc18c\uc561\uacb0\uc81c \ub0b4\uc5ed\uc740 \uc571\uc758 \uc18c\uc561\uacb0\uc81c \uc774\uc6a9\ub0b4\uc5ed\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "43", "t": "\ud734\ub300\ud3f0 \uc18c\uc561\uacb0\uc81c\ub97c \ucc28\ub2e8\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc18c\uc561\uacb0\uc81c\ub294 \uc18c\uc561\uacb0\uc81c \uad00\ub9ac \uba54\ub274\ub098 \uace0\uac1d\uc13c\ud130\ub97c \ud1b5\ud574 \ucc28\ub2e8\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0505", "q": "\uc778\ud130\ub137 \uc124\uce58 \uc2e0\uccad \ubc29\ubc95\uc774\ub791 \uc6b0\ub9ac \uc9d1 \uacf5\uc720\uae30 \ube44\ubc00\ubc88\ud638 \ucc3e\ub294 \ubc95\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1659", "t": "\uc640\uc774\ud30c\uc774 \ube44\ubc00\ubc88\ud638\ub294 \uc5b4\ub514\uc5d0\uc11c \ubc14\uafb8\ub098\uc694?", "s": [{"i": 0, "t": "\uc640\uc774\ud30c\uc774 \ube44\ubc00\ubc88\ud638\ub294 \uc5f0\uacb0\ub41c \uacf5\uc720\uae30\uc758 \uad00\ub9ac \ud654\uba74\uc774\ub098 \uc81c\uc870\uc0ac \uc571\uc5d0\uc11c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc640\uc774\ud30c\uc774 \ube44\ubc00\ubc88\ud638\ub97c \uc800\uc7a5\ud558\uba74 \uae30\uc874 \uae30\uae30\uc758 \uc5f0\uacb0\uc774 \ub04a\uae38 \uc218 \uc788\uc73c\ubbc0\ub85c \uc0c8 \ube44\ubc00\ubc88\ud638\ub85c \ub2e4\uc2dc \uc5f0\uacb0\ud558\uc138\uc694.", "y": 0}]}, {"id": "1671", "t": "\uacf5\uc720\uae30 \uad00\ub9ac\uc790 \ube44\ubc00\ubc88\ud638\ub97c \uc78a\uc5b4\ubc84\ub838\uc5b4\uc694.", "s": [{"i": 0, "t": "\uacf5\uc720\uae30 \uad00\ub9ac\uc790 \ub85c\uadf8\uc778 \uc554\ud638\ub294 \uc640\uc774\ud30c\uc774 \uc811\uc18d \uc554\ud638\uc640 \ub2e4\ub97c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uad00\ub9ac\uc790 \ube44\ubc00\ubc88\ud638\ub97c \uc78a\uc5c8\ub2e4\uba74 \uacf5\uc720\uae30 \uc81c\uc870\uc0ac\uc758 \uacc4\uc815 \ubcf5\uad6c \ubc29\ubc95\uc744 \uba3c\uc800 \ud655\uc778\ud558\uc138\uc694.", "y": 1}, {"i": 2, "t": "\uad00\ub9ac\uc790 \ube44\ubc00\ubc88\ud638\ub97c \ubcf5\uad6c\ud560 \uc218 \uc5c6\uc5b4 \uacf5\uc7a5 \ucd08\uae30\ud654\uac00 \ud544\uc694\ud558\ub2e4\uba74 \uae30\uc874 \uc124\uc815\uacfc \uc784\ub300 \uc7a5\ube44 \uc5ec\ubd80\ub97c \ud655\uc778\ud55c \ub4a4 \uc9c4\ud589\ud558\uc138\uc694.", "y": 0}]}]}, {"id": "Q0506", "q": "\ubd84\uc2e4 \uc2e0\uace0 \ubc29\ubc95\uc774\ub791 \ud3f0 \ucc3e\ub294 \uc571 \ucd94\ucc9c\ub3c4 \ud574 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1447", "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\uc5b4\uc694. \uc5b4\ub5bb\uac8c \ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \uba3c\uc800 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\ub098 \uace0\uac1d\uc13c\ud130 ARS(114)\uc5d0\uc11c \ubd84\uc2e4 \uc2e0\uace0\uc640 \ubd84\uc2e4 \uc815\uc9c0\ub97c \ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ubd84\uc2e4 \uc815\uc9c0\ub294 \ubb34\ub8cc\uc774\uace0 \ucd5c\ub300 90\uc77c \ub3d9\uc548 \ub2e4\ub978 \uc0ac\ub78c\uc774 \ub0b4 \ubc88\ud638\ub85c \uc804\ud654\u00b7\uacb0\uc81c\ud558\ub294 \uac83\uc744 \ub9c9\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1448", "t": "\ubd84\uc2e4 \uc2e0\uace0\ub294 \uc5b4\ub514\uc5d0\uc11c \ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4 \uc2e0\uace0\ub294 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubcf8\uc778\uc778\uc99d \ud6c4 \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub2e4\ub978 \uc804\ud654\ub85c 114(Ubot \ud734\ub300\ud3f0\uc774 \uc544\ub2c8\uba74 \ud648\ud398\uc774\uc9c0\uc758 \uace0\uac1d\uc13c\ud130 \ub300\ud45c\ubc88\ud638)\uc5d0 \uac78\uc5b4 ARS\ub85c 24\uc2dc\uac04 \ubd84\uc2e4 \uc2e0\uace0\ud560 \uc218\ub3c4 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "Ubot \ub9e4\uc7a5\uc5d0\uc11c\ub3c4 \uc2e0\ubd84\uc99d\uc744 \ubcf4\uc5ec \uc8fc\uba74 \ubd84\uc2e4 \uc2e0\uace0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1449", "t": "\uc783\uc5b4\ubc84\ub9b0 \ud734\ub300\ud3f0\uc758 \uc704\uce58\ub97c \ucc3e\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4\ud55c \ud734\ub300\ud3f0\uc758 \uc704\uce58 \ucc3e\uae30 \uae30\ub2a5\uc774 \ucf1c\uc838 \uc788\uc5c8\ub2e4\uba74 \uac24\ub7ed\uc2dc\ub294 \uc0bc\uc131 \ub0b4 \ub514\ubc14\uc774\uc2a4 \ucc3e\uae30, \uc544\uc774\ud3f0\uc740 \ub098\uc758 \ucc3e\uae30\uc5d0\uc11c \uc704\uce58\ub97c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud1b5\uc2e0\uc0ac\ub294 \uac1c\uc778\uc5d0\uac8c \ubd84\uc2e4 \ud734\ub300\ud3f0\uc758 \uc704\uce58\ub97c \uc54c\ub824 \uc904 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "228", "t": "\uc0c1\ub2f4\uc6d0 \uc6b4\uc601\uc2dc\uac04\uc774 \uc544\ub2cc\ub370 \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc0c1\ub2f4\uc6d0 \uc6b4\uc601\uc2dc\uac04\uc774 \uc544\ub2c8\uc5b4\ub3c4 \uace0\uac1d\uc13c\ud130 \uc790\ub3d9\uc751\ub2f5\uc73c\ub85c 24\uc2dc\uac04 \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubd84\uc2e4 \uc2e0\uace0\ub97c \uc704\ud574 \ud734\ub300\ud3f0\uc5d0\uc11c\ub294 114, \uc77c\ubc18\uc804\ud654\uc5d0\uc11c\ub294 1500-0000\uc73c\ub85c \uc5f0\ub77d\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "238", "t": "\ubc95\uc778 \uba85\uc758 \ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ubc95\uc778 \uba85\uc758 \ud734\ub300\ud3f0\uc744 \ubd84\uc2e4\ud588\ub2e4\uba74 \ubc95\uc778 \uc11c\ub958\uc640 \ub2f4\ub2f9\uc790 \uc2e0\ubd84\uc99d\uc744 \uc900\ube44\ud574 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud558\uac70\ub098 \uace0\uac1d\uc13c\ud130\ub85c \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\ubc95\uc778 \uba85\uc758 \ud734\ub300\ud3f0\uc744 \uae09\ud788 \uc815\uc9c0\ud574\uc57c \ud55c\ub2e4\uba74 \uace0\uac1d\uc13c\ud130 \uc790\ub3d9\uc751\ub2f5\uc73c\ub85c \uba3c\uc800 \uc815\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "51", "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\ub2e4\uba74 \uc989\uc2dc \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud558\uace0 \ud68c\uc120\uc744 \uc77c\uc2dc \uc815\uc9c0\ud558\ub294 \uac83\uc744 \uad8c\uc7a5\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "52", "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4 \uc2e0\uace0\ub294 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4 \uc2e0\uace0\ub294 \uc571, \ud648\ud398\uc774\uc9c0 \ub610\ub294 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "53", "t": "\ubd84\uc2e4\ud55c \ud734\ub300\ud3f0 \uc704\uce58\ub97c \ucc3e\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4\ud55c \ud734\ub300\ud3f0\uc758 \uc704\uce58 \ucc3e\uae30 \uae30\ub2a5\uc774 \ud65c\uc131\ud654\ub3fc \uc788\ub2e4\uba74 \uc81c\uc870\uc0ac \uc11c\ube44\uc2a4\ub97c \uc774\uc6a9\ud574 \uc704\uce58\ub97c \ucc3e\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0507", "q": "\uba64\ubc84\uc2ed \uc0ac\uc6a9\ubc95\uc774\ub791 \uc774\ubc88 \uc8fc \uc601\ud654 \uc2dc\uac04\ud45c\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "287", "t": "\uba64\ubc84\uc2ed \ud560\uc778\uc740 \uc5b4\ub5bb\uac8c \ubc1b\ub098\uc694?", "s": [{"i": 0, "t": "\uba64\ubc84\uc2ed \ud560\uc778\uc744 \ubc1b\uc73c\ub824\uba74 \uc81c\ud734\ucc98\uc5d0\uc11c \uc571\uc758 \uba64\ubc84\uc2ed \ubc14\ucf54\ub4dc\ub97c \uc81c\uc2dc\ud558\uba74 \ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uba64\ubc84\uc2ed \ud560\uc778 \uc0ac\uc6a9\uc740 1\uc77c 1\ud68c\ub85c \uc81c\ud55c\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "297", "t": "\uba64\ubc84\uc2ed\uc5d0 \ub300\ud574 \ub354 \uc54c\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uba64\ubc84\uc2ed \ub4f1\uae09, \ud61c\ud0dd, \uc81c\ud734\ucc98\ub294 \uc571\uc758 \uba64\ubc84\uc2ed \uba54\ub274\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uba64\ubc84\uc2ed\uc5d0 \uad00\ud574 \uad81\uae08\ud55c \uc810\uc740 \uace0\uac1d\uc13c\ud130\ub098 AI \ucc57\ubd07\uc73c\ub85c \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}]}]}, {"id": "Q0508", "q": "\uc790\ub3d9\uc774\uccb4 \ubcc0\uacbd\uc774\ub791 \uce74\ub4dc \uc5f0\ud68c\ube44 \ud560\uc778\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1161", "t": "\uc790\ub3d9\uc774\uccb4 \ub0a9\ubd80\uc77c\uc744 \ubc14\uafb8\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc790\ub3d9\uc774\uccb4 \ub0a9\ubd80\uc77c\uc740 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc758 \ub0a9\ubd80 \ubc29\ubc95 \uba54\ub274\uc5d0\uc11c 10\uc77c, 15\uc77c, 21\uc77c, 25\uc77c \uc911 \ud558\ub098\ub85c \ubc14\uafc0 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc790\ub3d9\uc774\uccb4 \ub0a9\ubd80\uc77c \ubcc0\uacbd\uc740 \uc2e0\uccad\ud55c \ub2e4\uc74c \ub2ec \uccad\uad6c\ubd84\ubd80\ud130 \uc801\uc6a9\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1163", "t": "\uc790\ub3d9\uc774\uccb4\ub97c \uc2e0\uccad\ud558\uac70\ub098 \uacc4\uc88c\ub97c \ubc14\uafb8\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc790\ub3d9\uc774\uccb4\ub97c \uc2e0\uccad\ud558\uac70\ub098 \uacc4\uc88c\ub97c \ubc14\uafb8\ub824\uba74 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubcf8\uc778\uc778\uc99d \ud6c4 \ub0a9\ubd80 \ubc29\ubc95 \uba54\ub274\uc5d0 \uacc4\uc88c\ub098 \uce74\ub4dc\ub97c \ub4f1\ub85d\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc790\ub3d9\uc774\uccb4 \uc2e0\uccad\uc740 \ub2e4\uc74c \ub0a9\ubd80\uc77c\ubd80\ud130 \uc801\uc6a9\ub418\uba70 \ucc98\ub9ac \uc911\uc5d0\ub294 \ub0a9\ubd80 \ubc29\ubc95\uc774 '\uc9c0\ub85c \ub0a9\ubd80'\ub85c \ubcf4\uc77c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "40", "t": "\uc790\ub3d9\uc774\uccb4 \uacc4\uc88c\ub97c \ubcc0\uacbd\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc790\ub3d9\uc774\uccb4 \uacc4\uc88c\ub294 \ubcf8\uc778 \uc778\uc99d \ud6c4 \ub0a9\ubd80 \uacc4\uc88c\ub97c \ubcc0\uacbd\ud558\ub294 \ubc29\uc2dd\uc73c\ub85c \ubc14\uafc0 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0509", "q": "\uc77c\uc2dc\uc815\uc9c0 \ubc29\ubc95\uc774\ub791 \uad70\ub300 \uac00\ub294 \uc808\ucc28\ub3c4 \uc54c\ub824 \ ub098 \uc571\uc5d0\uc11c \uc11c\ub958\ub97c \uc62c\ub824 \uc2e0\uccad\ud574 \uc8fc\uc138\uc694.", "y": 1}]}]}, {"id": "Q0510", "q": "eSIM \uac1c\ud1b5 \ubc29\ubc95\uc774\ub791 \uc544\uc774\ud3f0 \uc124\uc815 \ubc29\ubc95\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1273", "t": "eSIM\uc744 \uc4f8 \uc218 \uc788\ub294 \ud734\ub300\ud3f0\uc740 \uc5b4\ub5a4 \uac83\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ucd5c\uadfc \ucd9c\uc2dc\ub41c \uc544\uc774\ud3f0 XS \uc774\ud6c4 \ubaa8\ub378\uacfc \uac24\ub7ed\uc2dc S\u00b7Z \uc2dc\ub9ac\uc988 \ub4f1 eSIM\uc744 \uc9c0\uc6d0\ud558\ub294 \ud734\ub300\ud3f0\uc5d0\uc11c eSIM\uc744 \uc4f8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \uc124\uc815 > \ud734\ub300\ud3f0 \uc815\ubcf4\uc5d0 EID \ud56d\ubaa9\uc774 \ubcf4\uc774\uba74 eSIM\uc744 \uc9c0\uc6d0\ud558\ub294 \uae30\uae30\uc785\ub2c8\ub2e4.", "y": 1}]}, {"id": "1274", "t": "eSIM\uc740 \uc5b4\ub5bb\uac8c \uac1c\ud1b5\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c eSIM \uac00\uc785\uc744 \uc2e0\uccad\ud558\uba74 QR \ucf54\ub4dc\uac00 \ubc1c\uae09\ub418\uba70 \ud734\ub300\ud3f0 \uc124\uc815\uc5d0\uc11c \ucf54\ub4dc\ub97c \ucd2c\uc601\ud558\uba74 \uac1c\ud1b5\ub429\ub2c8\ub2e4. eSIM\uc740 \ub9e4\uc7a5\uc5d0\uc11c\ub3c4 \ubc14\ub85c \ubc1c\uae09\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0511", "q": "\ub370\uc774\ud130 \uc774\uc6d4 \ubc29\ubc95\uc774\ub791 \ud1b5\uc2e0 3\uc0ac \ube44\uad50\ub3c4 \ud574 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "72", "t": "\ub0a8\uc740 \ub370\uc774\ud130\ub97c \ub2e4\uc74c \ub2ec\ub85c \ub118\uae38 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub0a8\uc740 \ub370\uc774\ud130\ub294 \ub370\uc774\ud130 \uc774\uc6d4\uc744 \uc9c0\uc6d0\ud558\ub294 \uc694\uae08\uc81c\uc5d0\uc11c \ub2e4\uc74c \ub2ec\ub85c \ub118\uae38 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0512", "q": "\uac00\uc871\uacb0\ud569 \uc870\ua d": "281", "t": "\uc5b4\ub5a4 \ud68c\uc120\uc5d0 \uc11c\ube44\uc2a4\uac00 \uac78\ub824 \uc788\ub294\uc9c0 \ubcf4\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc5b4\ub290 \ud68c\uc120\uc5d0 \ubd80\uac00\uc11c\ube44\uc2a4\uac00 \uac00\uc785\ub418\uc5b4 \uc788\ub294\uc9c0\ub294 \uc571\uc5d0\uc11c \ud68c\uc120\uc744 \uc120\ud0dd\ud574 \ud574\ub2f9 \ud68c\uc120\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \ubaa9\ub85d\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "682", "t": "\uc81c\uac00 \uac00\uc785\ud55c \ubd80\uac00\uc11c\ube44\uc2a4 \ubaa9\ub85d \uc880 \ubcf4\uc5ec \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud55c \ud68c\uc6d0\uc758 \ud68c\uc120 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \ud604\uc7ac \uac00\uc785 \uc911\uc778 \ubd80\uac00\uc11c\ube44\uc2a4 \ubaa9\ub85d\uacfc \uc6d4 \uc694\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "945", "t": "\uc81c\uac00 \uc4f0\uace0 \uc788\ub294 \ubd80\uac00\uc11c\ube44\uc2a4 \ubb50\ubb50 \uc788\uc5b4\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ud68c\uc120 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \uac00\uc785 \uc911\uc778 \ubd80\uac00\uc11c\ube44\uc2a4 \ubaa9\ub85d\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0514", "q": "\ub85c\ubc0d \uc694\uae08\uc774\ub791 \ud604\uc9c0 \ud658\uc728\ub3c4 \uac19\uc774 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "28", "t": "\ud574\uc678 \ub370\uc774\ud130 \ub85c\ubc0d \uc694\uae08\uc740 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678 \ub370\uc774\ud130 \ub85c\ubc0d \uc694\uae08\uc740 \ubc29\ubb38 \uad6d\uac00\uc640 \uac00\uc785\ud55c \ub85c\ubc0d \uc0c1\ud488\uc5d0 \ub530\ub77c \ub2ec\ub77c\uc9d1\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0515", "q": "\uc2a4\ud338 \ucc28\ub2e8 \ubc29\ubc95\uc774\ub791 \uc2a4\ud338 \uac74 \ubcf4\ub0b8 \uc5c5\uccb4 \uc774\ub984\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1233", "t": "\uc2a4\ud3
