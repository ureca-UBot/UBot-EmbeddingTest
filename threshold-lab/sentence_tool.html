<title>문장 라벨 검토</title>
<style>
:root{--bg:#f6f7f9;--pn:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e2e5ea;--y:#16a34a;--yb:#e7f7ec;--n:#9ca3af;--nb:#f3f4f6;--ac:#2563eb;--wa:#d97706;--wb:#fff4e0}
*{box-sizing:border-box}body{margin:0;font:14px/1.55 -apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--tx);display:flex;height:100vh}
#side{width:300px;background:var(--pn);border-right:1px solid var(--bd);display:flex;flex-direction:column}
#top{padding:10px;border-bottom:1px solid var(--bd)}#top b{font-size:15px}
#filters{display:flex;gap:4px;margin:8px 0;flex-wrap:wrap}
#filters button{border:1px solid var(--bd);background:#fff;border-radius:14px;padding:2px 9px;cursor:pointer;font-size:12px}
#filters button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#list{overflow:auto;flex:1}
.it{padding:6px 10px;border-bottom:1px solid #f0f1f3;cursor:pointer;font-size:13px;display:flex;gap:6px}
.it:hover{background:#f5f8ff}.it.cur{background:#e8f0fe}.it .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:#d1d5db}
.it.rv .dot{background:var(--y)}.it.fl .dot{box-shadow:0 0 0 2px var(--wa)}
.it small{color:var(--mu);display:block}
#main{flex:1;overflow:auto;padding:18px 24px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
h2{margin:0 0 4px;font-size:18px}.meta{color:var(--mu);font-size:12px}
.faq .t{font-weight:600;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.faq .t .id{font-size:12px;color:var(--mu);font-weight:400}
.faq.warn{border-color:var(--wa);background:var(--wb)}
.s{display:flex;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer;border:1px solid transparent;margin:3px 0;align-items:flex-start}
.s .b{flex:none;width:22px;height:22px;border-radius:5px;text-align:center;font-weight:700;font-size:12px;line-height:22px}
.s.y{background:var(--yb)}.s.y .b{background:var(--y);color:#fff}
.s.n{background:var(--nb);color:#6b7280}.s.n .b{background:var(--n);color:#fff}
.s:hover{border-color:var(--ac)}
.small{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:1px 8px;cursor:pointer;font-size:12px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.btn{border:1px solid var(--bd);background:#fff;border-radius:7px;padding:6px 12px;cursor:pointer}.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
kbd{background:#eee;border:1px solid #ccc;border-radius:3px;padding:0 4px;font-size:11px}
#msg{color:var(--mu);font-size:12px}
</style></head><body>

<script>
const DATA={"q": [{"id": "Q0001", "q": "\uc694\uae08\uc81c\ub97c \ubc14\uafb8\uace0 \uc2f6\uc740\ub370 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "g": "ANS", "f": [{"id": "1123", "t": "\uc694\uae08\uc81c\ub294 \uc5b4\ub514\uc5d0\uc11c \ubcc0\uacbd\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc694\uae08\uc81c\ub294 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0 \ub85c\uadf8\uc778\ud574 \uc694\uae08\uc81c \ubcc0\uacbd \uba54\ub274\uc5d0\uc11c \ubc14\uafb8\uac70\ub098 \uace0\uac1d\uc13c\ud130(114)\u00b7\ub9e4\uc7a5\uc5d0\uc11c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud0a4\uc988 \uc694\uae08\uc81c\ucc98\ub7fc \ubc95\uc815\ub300\ub9ac\uc778 \ub3d9\uc758\uac00 \ud544\uc694\ud55c \uc694\uae08\uc81c\ub294 \uace0\uac1d\uc13c\ud130\ub098 \ub9e4\uc7a5\uc5d0\uc11c\ub9cc \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1136", "t": "\ubbf8\uc131\ub144\uc790\uac00 \uc694\uae08\uc81c\ub97c \ubc14\uafb8\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ub9cc 19\uc138 \ubbf8\ub9cc \uc774\uc6a9\uc790\uac00 \uc694\uae08\uc81c\ub97c \ubcc0\uacbd\ud560 \ub54c\ub294 \ubc95\uc815\ub300\ub9ac\uc778 \ub3d9\uc758\uac00 \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ubbf8\uc131\ub144\uc790 \uc694\uae08\uc81c \ubcc0\uacbd\uc740 \ubc95\uc815\ub300\ub9ac\uc778\uc774 \uace0\uac1d\uc13c\ud130\ub85c \uc804\ud654\ud558\uac70\ub098 \ud568\uaed8 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud574 \uc2e0\uccad\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 2, "t": "\ub9cc 19\uc138 \uc774\uc0c1\uc774\uba74 \ubc95\uc815\ub300\ub9ac\uc778 \ub3d9\uc758 \uc5c6\uc774 \uc571\uc5d0\uc11c \uc9c1\uc811 \uc694\uae08\uc81c\ub97c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "67", "t": "\uc694\uae08\uc81c\ub97c \ubcc0\uacbd\ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc694\uae08\uc81c\ub294 \uc571, \ud648\ud398\uc774\uc9c0, \uace0\uac1d\uc13c\ud130 \ub610\ub294 \ub9e4\uc7a5\uc5d0\uc11c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0002", "q": "\ub370\uc774\ud130\ub97c \ub2e4 \uc4f0\uba74 \uc18d\ub3c4\uac00 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "g": "ANS", "f": [{"id": "1129", "t": "\ub370\uc774\ud130\ub97c \ub2e4 \uc4f0\uba74 \uc18d\ub3c4\uac00 \uc5bc\ub9c8\ub098 \ub290\ub824\uc9c0\ub098\uc694?", "s": [{"i": 0, "t": "\ub370\uc774\ud130\ub97c \ub2e4 \uc4f4 \ub4a4\uc758 \uc18d\ub3c4\ub294 \uc694\uae08\uc81c\ub9c8\ub2e4 \ub2e4\ub985\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubc38\ub7f0\uc2a4 79\u00b769\ub294 \ub370\uc774\ud130\ub97c \uc18c\uc9c4\ud55c \ub4a4 \ucd5c\ub300 5Mbps, \ubc38\ub7f0\uc2a4 39\ub098 \uc77c\ubd80 \ubca0\uc774\uc9c1 \uc694\uae08\uc81c\ub294 \ucd5c\ub300 0.4Mbps\ub85c \uacc4\uc18d \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\uc2e4\uc18d LTE\u00b7\ud0dc\ube14\ub9bf\u00b7\uc6cc\uce58 \uc694\uae08\uc81c\ub294 \ub370\uc774\ud130\ub97c \ubaa8\ub450 \uc4f0\uba74 \ucc28\ub2e8\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "1201", "t": "\ub370\uc774\ud130\ub97c \ub2e4 \uc4f0\uba74 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ub370\uc774\ud130\ub97c \ubaa8\ub450 \uc0ac\uc6a9\ud55c \ub4a4\uc758 \ucc98\ub9ac \ubc29\uc2dd\uc740 \uc694\uae08\uc81c\ub9c8\ub2e4 \ub2e4\ub985\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub300\ubd80\ubd84\uc758 5G \uc694\uae08\uc81c\ub294 \ub370\uc774\ud130\ub97c \ub2e4 \uc4f0\uba74 0.4~5Mbps\uc758 \uc815\ud574\uc9c4 \uc18d\ub3c4\ub85c \ucd94\uac00 \uc694\uae08 \uc5c6\uc774 \uacc4\uc18d \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\uc2e4\uc18d LTE\u00b7\ud0dc\ube14\ub9bf\u00b7\uc6cc\uce58 \uc694\uae08\uc81c\ub294 \ub370\uc774\ud130\ub97c \ubaa8\ub450 \uc4f0\uba74 \ucc28\ub2e8\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 3, "t": "\ub370\uc774\ud130 \uc18c\uc9c4 \ub4a4 \ub354 \ube60\ub978 \uc18d\ub3c4\ub85c \uc4f0\uace0 \uc2f6\ub2e4\uba74 \ub370\uc774\ud130 \ud50c\ub7ec\uc2a4 \uc0c1\ud488\uc744 \ucd94\uac00\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "19", "t": "\ub370\uc774\ud130\ub97c \ubaa8\ub450 \uc0ac\uc6a9\ud558\uba74 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ub370\uc774\ud130\ub97c \ubaa8\ub450 \uc0ac\uc6a9\ud55c \ub4a4\uc758 \ucc98\ub9ac \ubc29\uc2dd\uc740 \uc694\uae08\uc81c\uc5d0 \ub530\ub77c \ub2e4\ub974\uba70, \ub370\uc774\ud130\uac00 \ucc28\ub2e8\ub418\uac70\ub098 \ucd94\uac00 \uc694\uae08\uc774 \ubd80\uacfc\ub418\uac70\ub098 \uc18d\ub3c4\uac00 \uc81c\ud55c\ub420 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "707", "t": "\uc81c \uc694\uae08\uc81c\ub294 \ub370\uc774\ud130 \ub2e4 \uc4f0\uba74 \uc18d\ub3c4\uac00 \uc5bc\ub9c8\ub85c \ub5a8\uc5b4\uc838\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc774 \uc0ac\uc6a9 \uc911\uc778 \uc694\uae08\uc81c\ub97c \uc870\ud68c\ud574 \uae30\ubcf8 \ub370\uc774\ud130\ub97c \ubaa8\ub450 \uc0ac\uc6a9\ud55c \ub4a4 \uc801\uc6a9\ub418\ub294 \uc18d\ub3c4\ub97c \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0003", "q": "\ud734\ub300\ud3f0 \ubc88\ud638\ub97c \uadf8\ub300\ub85c \ub450\uace0 \ud1b5\uc2e0\uc0ac\ub97c \uc62e\uae38 \uc218 \uc788\ub098\uc694?", "g": "ANS", "f": [{"id": "1075", "t": "\ubc88\ud638\uc774\ub3d9\uc774 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9\uc740 \uc4f0\ub358 \ud734\ub300\ud3f0 \ubc88\ud638\ub97c \uadf8\ub300\ub85c \uc720\uc9c0\ud558\uba74\uc11c \ud1b5\uc2e0\uc0ac\ub9cc \ubc14\uafb8\ub294 \uc81c\ub3c4\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "Ubot\uc73c\ub85c \ubc88\ud638\uc774\ub3d9\ud558\uba74 \uc0c8 \ud68c\uc120\uc774 \uac1c\ud1b5\ub418\ub294 \uc989\uc2dc \uc774\uc804 \ud1b5\uc2e0\uc0ac \ud68c\uc120\uc740 \uc790\ub3d9 \ud574\uc9c0\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "3", "t": "\ubc88\ud638\uc774\ub3d9\uc744 \ud558\uba74 \uae30\uc874 \ubc88\ud638\ub97c \uadf8\ub300\ub85c \uc0ac\uc6a9\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9\uc744 \ud574\ub3c4 \uae30\uc874 \uc804\ud654\ubc88\ud638\ub97c \uadf8\ub300\ub85c \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0004", "q": "\uac00\uc871\ub07c\ub9ac \ub370\uc774\ud130\ub97c \ub098\ub220 \uc4f0\ub294 \ubc29\ubc95\uc774 \uc788\ub098\uc694?", "g": "ANS", "f": [{"id": "1150", "t": "\uac00\uc871\ub07c\ub9ac \ub370\uc774\ud130\ub97c \ub098\ub220 \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot\uc740 \uac00\uc871\ub07c\ub9ac \ub370\uc774\ud130\ub97c \ub098\ub220 \uc4f0\ub294 \ubcc4\ub3c4\uc758 \uacf5\uc720 \uc694\uae08\uc81c\ub97c \uc81c\uacf5\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uac00\uc871\ub07c\ub9ac Ubot \uac00\uc871 \uacb0\ud569\uc5d0 \uac00\uc785\ud558\uba74 \uc694\uae08 \ud560\uc778\uc744 \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\uac00\uc871 \ud68c\uc120 \uc911 \ub370\uc774\ud130\uac00 \ubd80\uc871\ud55c \ud68c\uc120\uc5d0\ub294 \ub370\uc774\ud130 \ud50c\ub7ec\uc2a4 \uc0c1\ud488\uc744 \ucd94\uac00\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1210", "t": "\ub370\uc774\ud130\ub97c \uac00\uc871\uc774\ub098 \uce5c\uad6c\uc5d0\uac8c \uc120\ubb3c\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot\uc740 \ud68c\uc120 \uac04 \ub370\uc774\ud130 \uc120\ubb3c \uae30\ub2a5\uc744 \uc81c\uacf5\ud558\uc9c0 \uc54a\uc544 \uac00\uc871\uc774\ub098 \uce5c\uad6c\uc5d0\uac8c \ub370\uc774\ud130\ub97c \ubcf4\ub0bc \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub370\uc774\ud130\uac00 \ubd80\uc871\ud55c \ud68c\uc120\uc5d0\ub294 \ub370\uc774\ud130 \ud50c\ub7ec\uc2a4 1GB(\uc6d4 3,300\uc6d0)\ubd80\ud130 \ucd94\uac00\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "71", "t": "\uac00\uc871\ub07c\ub9ac \ub370\uc774\ud130\ub97c \uacf5\uc720\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot\uc740 \uac00\uc871 \ud68c\uc120\ub07c\ub9ac \ub370\uc774\ud130\ub97c \ub098\ub220 \uc4f0\ub294 \ubcc4\ub3c4\uc758 \uacf5\uc720 \uc694\uae08\uc81c\ub97c \uc81c\uacf5\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub370\uc774\ud130 \uc250\uc5b4\ub9c1\uc744 \uc9c0\uc6d0\ud558\ub294 \uc694\uae08\uc81c\ub77c\uba74 \ubcf8\uc778 \uba85\uc758\uc758 \ud0dc\ube14\ub9bf \ub4f1 \uc11c\ube0c \ud68c\uc120\uacfc \ub370\uc774\ud130\ub97c \ub098\ub220 \uc4f8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\uac00\uc871 \ud68c\uc120\uc758 \ub370\uc774\ud130\uac00 \ubd80\uc871\ud558\ub2e4\uba74 \ud574\ub2f9 \ud68c\uc120\uc5d0 \ub370\uc774\ud130 \ud50c\ub7ec\uc2a4 \uc0c1\ud488\uc744 \ucd94\uac00\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0005", "q": "USIM\uc744 \uc783\uc5b4\ubc84\ub838\uc744 \ub54c \uc7ac\ubc1c\uae09\uc740 \uc5b4\ub514\uc11c \ubc1b\ub098\uc694?", "g": "ANS", "f": [{"id": "10", "t": "\uc720\uc2ec\uc744 \uc7ac\ubc1c\uae09\ubc1b\uc73c\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc720\uc2ec\uc744 \uc7ac\ubc1c\uae09\ubc1b\uc73c\ub824\uba74 \uc2e0\ubd84\uc99d\uc744 \uc9c0\ucc38\ud574 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc628\ub77c\uc778 \uc7ac\ubc1c\uae09\uc774 \uc9c0\uc6d0\ub418\ub294 \uacbd\uc6b0\uc5d0\ub294 \uc628\ub77c\uc778\uc73c\ub85c\ub3c4 \uc720\uc2ec\uc744 \uc7ac\ubc1c\uae09\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1259", "t": "\uc720\uc2ec\uc744 \uc7ac\ubc1c\uae09(\uad50\uccb4)\ubc1b\uc73c\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc720\uc2ec\uc744 \uc7ac\ubc1c\uae09\ubc1b\uc73c\ub824\uba74 \uba85\uc758\uc790 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud558\uac70\ub098 Ubot \uc571\uc5d0\uc11c \uc2e0\uccad\ud574 \ud0dd\ubc30\ub85c \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc0c8 \uc720\uc2ec\uc744 \ubc1b\uc558\ub2e4\uba74 \uc571\uc5d0\uc11c \uc720\uc2ec \uad50\uccb4 \ub4f1\ub85d\uc744 \ud558\uac70\ub098 \ub9e4\uc7a5\uc5d0\uc11c \ubc14\ub85c \uad50\uccb4\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "9", "t": "\uc720\uc2ec\uc744 \ubd84\uc2e4\ud558\uba74 \uc5b4\ub5bb\uac8c \ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc720\uc2ec\uc744 \ubd84\uc2e4\ud588\ub2e4\uba74 \uae30\uc874 \uc720\uc2ec\uc744 \uc815\uc9c0\ud55c \ud6c4 \uc0c8\ub85c\uc6b4 \uc720\uc2ec\uc744 \uc7ac\ubc1c\uae09\ubc1b\ub294 \uac83\uc774 \uc88b\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0006", "q": "\ud574\uc678\uc5d0\uc11c \ud734\ub300\ud3f0\uc744 \uc4f0\ub824\uba74 \ubbf8\ub9ac \uc2e0\uccad\ud574\uc57c \ud558\ub098\uc694?", "g": "ANS", "f": [{"id": "1317", "t": "\ucd9c\uad6d \uc804\uc5d0 \uaf2d \ud655\uc778\ud574\uc57c \ud560 \uac83\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ucd9c\uad6d \uc804\uc5d0\ub294 \ubc29\ubb38 \uad6d\uac00\uc758 \ub85c\ubc0d \uc0c1\ud488 \uac00\uc785 \uc5ec\ubd80, \uc720\uc2ec PIN \uc7a0\uae08 \uc5ec\ubd80, \ud734\ub300\ud3f0\uc758 \ub370\uc774\ud130 \ub85c\ubc0d \uc124\uc815\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ud574\uc678\uc5d0\uc11c \ub370\uc774\ud130\ub97c \uc0ac\uc6a9\ud558\uc9c0 \uc54a\uc744 \uacc4\ud68d\uc774\ub77c\uba74 Ubot \ub370\uc774\ud130 \ub85c\ubc0d \ucc28\ub2e8\uc5d0 \uac00\uc785\ud574 \uc694\uae08 \ubc1c\uc0dd\uc744 \ub9c9\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "208", "t": "\ud574\uc678\uc5ec\ud589 \uc804\uc5d0 \ud1b5\uc2e0 \uad00\ub828\ud574\uc11c \uc900\ube44\ud560 \uac8c \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5ec\ud589 \uc804\uc5d0 \ubc29\ubb38 \uad6d\uac00\uc758 \ub85c\ubc0d \uad8c\uc5ed\uc744 \ud655\uc778\ud574 \ub85c\ubc0d \ud328\uc2a4\uc5d0 \uac00\uc785\ud558\uac70\ub098, \ub85c\ubc0d\uc744 \uc4f0\uc9c0 \uc54a\uc744 \uacc4\ud68d\uc774\uba74 \ub85c\ubc0d \ucc28\ub2e8\uc744 \uc2e0\uccad\ud574 \ub458 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub85c\ubc0d \ud328\uc2a4 \uac00\uc785\uacfc \ub85c\ubc0d \ucc28\ub2e8 \uc2e0\uccad\uc740 \ubaa8\ub450 \uc571\uc5d0\uc11c \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "27", "t": "\ud574\uc678\uc5d0\uc11c \ud734\ub300\ud3f0\uc744 \uc0ac\uc6a9\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc790\ub3d9 \ub85c\ubc0d\uc774 \uc9c0\uc6d0\ub418\ub294 \ud574\uc678 \uad6d\uac00\uc5d0\uc11c\ub294 \ud734\ub300\ud3f0\uc73c\ub85c \uc804\ud654, \ubb38\uc790, \ub370\uc774\ud130\ub97c \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "30", "t": "\ub85c\ubc0d\uc744 \uc2e0\uccad\ud558\uc9c0 \uc54a\uc544\ub3c4 \ud574\uc678\uc5d0\uc11c \uc0ac\uc6a9\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub85c\ubc0d \uc0c1\ud488\uc744 \uc2e0\uccad\ud558\uc9c0 \uc54a\uc544\ub3c4 \uc790\ub3d9 \ub85c\ubc0d\uc774 \uc9c0\uc6d0\ub418\ub294 \uad6d\uac00\uc5d0\uc11c\ub294 \ud734\ub300\ud3f0\uc744 \uc0ac\uc6a9\ud560 \uc218 \uc788\uc9c0\ub9cc \ub192\uc740 \ub85c\ubc0d \uc694\uae08\uc774 \ubc1c\uc0dd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0007", "q": "\uc774\ubc88 \ub2ec \uc694\uae08 \uba85\uc138\uc11c\ub294 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\ub098\uc694?", "g": "ANS", "f": [{"id": "1127", "t": "\uc9c0\uae08 \uc4f0\ub294 \uc694\uae08\uc81c\uc640 \ub0a8\uc740 \ub370\uc774\ud130\ub294 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud604\uc7ac \uc694\uae08\uc81c\uc640 \ub0a8\uc740 \ub370\uc774\ud130\u00b7\ud1b5\ud654\u00b7\ubb38\uc790\ub294 Ubot \uc571 \uccab \ud654\uba74\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ub0a8\uc740 \ub370\uc774\ud130\ub294 \uace0\uac1d\uc13c\ud130 114 \uc790\ub3d9\uc751\ub2f5\uc774\ub098 114\ub85c '\ub370\uc774\ud130'\ub77c\uace0 \ubb38\uc790\ub97c \ubcf4\ub0b4\ub3c4 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1158", "t": "\uc774\ubc88 \ub2ec \uccad\uad6c \uc694\uae08\uc740 \uc5b8\uc81c\ubd80\ud130 \ud655\uc778\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc774\ubc88 \ub2ec \uccad\uad6c \uc694\uae08\uc740 \ub9e4\uc6d4 5\uc77c \uc624\ud6c4\ubd80\ud130 Ubot \u 88c\ub97c \ubc14\uafb8\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc790\ub3d9\uc774\uccb4\ub97c \uc2e0\uccad\ud558\uac70\ub098 \uacc4\uc88c\ub97c \ubc14\uafb8\ub824\uba74 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubcf8\uc778\uc778\uc99d \ud6c4 \ub0a9\ubd80 \ubc29\ubc95 \uba54\ub274\uc5d0 \uacc4\uc88c\ub098 \uce74\ub4dc\ub97c \ub4f1\ub85d\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc790\ub3d9\uc774\uccb4 \uc2e0\uccad\uc740 \ub2e4\uc74c \ub0a9\ubd80\uc77c\ubd80\ud130 \uc801\uc6a9\ub418\uba70 \ucc98\ub9ac \uc911\uc5d0\ub294 \ub0a9\ubd80 \ubc29\ubc95\uc774 '\uc9c0\ub85c \ub0a9\ubd80'\ub85c \ubcf4\uc77c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "40", "t": "\uc790\ub3d9\uc774\uccb4 \uacc4\uc88c\ub97c \ubcc0\uacbd\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc790\ub3d9\uc774\uccb4 \uacc4\uc88c\ub294 \ubcf8\uc778 \uc778\uc99d \ud6c4 \ub0a9\ubd80 \uacc4\uc88c\ub97c \ubcc0\uacbd\ud558\ub294 \ubc29\uc2dd\uc73c\ub85c \ubc14\uafc0 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0009", "q": "\uba64\ubc84\uc2ed \ud3ec\uc778\ud2b8\ub294 \uc5b4\ub514\uc5d0\uc11c \uc0ac\uc6a9\ud560 \uc218 \uc788\ub098\uc694?", "g": "ANS", "f": [{"id": "1354", "t": "\ud3ec\uc778\ud2b8\ub294 \uc5b4\ub514\uc5d0 \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \ud3ec\uc778\ud2b8\ub294 \ud734\ub300\ud3f0 \uc694\uae08 \ub0a9\ubd80, \ub370\uc774\ud130 \ud50c\ub7ec\uc2a4 \uad6c\ub9e4, \uc561\uc138\uc11c\ub9ac \uad6c\ub9e4\uc5d0 \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "Ubot \ud3ec\uc778\ud2b8\ub294 1\ud3ec\uc778\ud2b8\ub97c 1\uc6d0\uc73c\ub85c \uacc4\uc0b0\ud558\uba70 1,000\ud3ec\uc778\ud2b8 \uc774\uc0c1\ubd80\ud130 \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "276", "t": "\ubd80\uac00\uc11c\ube44\uc2a4 \uc694\uae08\uc744 \ud3ec\uc778\ud2b8\ub85c \ub0bc \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd80\u 0 \ud6c4\uc5d0\ub3c4 \uadf8\ub2ec \ub9d0\uc77c\uae4c\uc9c0 \ucd94\uac00 \ub370\uc774\ud130\ub97c \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub370\uc774\ud130 \ud50c\ub7ec\uc2a4\ub294 \uac00\uc785\ud55c \ub2ec\uc5d0\ub3c4 \uc694\uae08\uc774 \uc77c\ud560 \uacc4\uc0b0\ub418\uc9c0 \uc54a\uace0 \uc6d4\uc815\uc561\uc774 \uadf8\ub300\ub85c \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1444", "t": "\ubd80\uac00\uc11c\ube44\uc2a4\ub294 \uc5b4\ub5bb\uac8c \ud574\uc9c0\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ubd80\uac00\uc11c\ube44\uc2a4\ub294 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uba54\ub274\ub098 \uace0\uac1d\uc13c\ud130(114)\uc5d0\uc11c \ud574\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc6d4\uc815\uc561 \ubd80\uac00\uc11c\ube44\uc2a4\ub97c \ud574\uc9c0\ud574\ub3c4 \ud574\uc9c0\ud55c \ub2ec\uae4c\uc9c0 \uc694\uae08\uc774 \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "45", "t": "\uc11c\ube44\uc2a4\ub97c \ud574\uc9c0\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud1b5\uc2e0 \uc11c\ube44\uc2a4\ub97c \ud574\uc9c0\ud558\ub824\uba74 \ubcf8\uc778 \uc778\uc99d \ud6c4 \uace0\uac1d\uc13c\ud130 \ub610\ub294 \ub9e4\uc7a5\uc5d0\uc11c \ud574\uc9c0\ub97c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0014", "q": "\uc120\ud0dd\uc57d\uc815 \ud560\uc778\uc740 \uc5b4\ub5bb\uac8c \uc2e0\uccad\ud558\ub098\uc694?", "g": "ANS", "f": [{"id": "1423", "t": "\uc120\ud0dd\uc57d\uc815\uc740 \uc5b4\ub514\uc5d0\uc11c \uac00\uc785\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc120\ud0dd\uc57d\uc815\uc740 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \uac00\uc785\ud558\uac70\ub098 \ub9e4\uc7a5\u00b7\uace0\uac1d\uc13c\ud130\uc5d0\uc11c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc774\ubbf8 Ubot\uc744 \uc4f0\uace0 \uc788\uc5b4\ub3c4 \uacf5\uc2dc\uc9c0\uc6d0\uae08 \uc57d\uc815\uc774 \u , {"id": "1048", "t": "\uba87 \uc0b4\ubd80\ud130 \ud734\ub300\ud3f0\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uac00\uc785\uc5d0 \ub098\uc774 \uc81c\ud55c\uc740 \uc5c6\uc73c\uba70 \ub9cc 12\uc138 \uc774\ud558\ub294 Ubot \ud0a4\uc988 \uc548\uc2ec \uc694\uae08\uc81c\ub97c \uc4f8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub9cc 14\uc138 \ubbf8\ub9cc\uc758 \ud734\ub300\ud3f0 \uac00\uc785 \uc808\ucc28\ub294 \ubc95\uc815\ub300\ub9ac\uc778\uc774 \ub300\uc2e0 \uc9c4\ud589\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "86", "t": "\ubbf8\uc131\ub144\uc790\ub3c4 \ud734\ub300\ud3f0\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubbf8\uc131\ub144\uc790\ub3c4 \ubc95\uc815\ub300\ub9ac\uc778 \ub3d9\uc758\uc640 \ud544\uc694\ud55c \uc11c\ub958\ub97c \uc900\ube44\ud558\uba74 \ud734\ub300\ud3f0\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0016", "q": "\uc2a4\ud338 \ubb38\uc790\ub97c \uc790\ub3d9\uc73c\ub85c \ucc28\ub2e8\ud558\ub294 \uae30\ub2a5\uc774 \uc788\ub098\uc694?", "g": "ANS", "f": [{"id": "1022", "t": "\uad11\uace0 \ubb38\uc790\ub97c \ub354 \uc774\uc0c1 \ubc1b\uc9c0 \uc54a\uc73c\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uad11\uace0 \ubb38\uc790\ub97c \ub354 \uc774\uc0c1 \ubc1b\uc9c0 \uc54a\uc73c\ub824\uba74 \ubb38\uc790 \ud558\ub2e8\uc758 \uc218\uc2e0 \uac70\ubd80 \ubc29\ubc95\uc744 \uc774\uc6a9\ud558\uac70\ub098 \uc218\uc2e0 \ub3d9\uc758 \uc124\uc815\uc744 \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uad11\uace0 \ubb38\uc790\ub97c \uc218\uc2e0 \uac70\ubd80\ud55c \ub4a4\uc5d0\ub3c4 \uc2a4\ud338\uc774 \uacc4\uc18d \uc624\uba74 \uc2e0\uace0\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1232", "t": "\ud2b9\uc815 \ubc88\ud638\uc758 \uc804\ud654\ub098 \ubb38\uc790\ub97c \ucc28\ub2e8\ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud2b9\uc815 \ubc88\ud638\uc758 \uc804\ud654\ub098 \ub \ubcf4\ub0b4\ub3c4 \ubb38\uc790\ub85c \uc548\ub0b4\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1222", "t": "\uc790\ub140 \ud734\ub300\ud3f0\uc758 \ub0a8\uc740 \ub370\uc774\ud130\ub97c \ud655\uc778\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubc95\uc815\ub300\ub9ac\uc778\uc73c\ub85c \ub4f1\ub85d\ub41c \ubd80\ubaa8\ub294 Ubot \uc571\uc758 \uc790\ub140 \ud68c\uc120 \uad00\ub9ac\uc5d0\uc11c \uc790\ub140 \ud734\ub300\ud3f0\uc758 \ub0a8\uc740 \ub370\uc774\ud130\uc640 \uc774\uc6a9 \uc694\uae08\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc790\ub140\uac00 \ub9cc 19\uc138\uac00 \ub418\uba74 \ubd80\ubaa8\uac00 \ud68c\uc120 \ub370\uc774\ud130\ub97c \uacc4\uc18d \uc870\ud68c\ud558\ub824\uba74 \uc790\ub140 \ubcf8\uc778 \ub3d9\uc758\uac00 \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "1312", "t": "\ub0a8\uc740 \ub85c\ubc0d \ub370\uc774\ud130\ub294 \uc5b4\ub5bb\uac8c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ub0a8\uc740 \ub85c\ubc0d \ub370\uc774\ud130\uc640 \ub2e4\uc74c \uc81c\uacf5\ub7c9 \ucd08\uae30\ud654 \uc2dc\uac01\uc740 Ubot \uc571\uc758 \ub85c\ubc0d \uba54\ub274\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud574\uc678\uc5d0\uc11c Ubot \uc571\uc744 \ubaa8\ubc14\uc77c \ub370\uc774\ud130\ub85c \uc774\uc6a9\ud558\uba74 \ub370\uc774\ud130 \ub85c\ubc0d \uc694\uae08\uc774 \ubc1c\uc0dd\ud560 \uc218 \uc788\uc73c\ubbc0\ub85c \ub85c\ubc0d \uc0c1\ud488\uc758 \ub370\uc774\ud130 \uc81c\uacf5\ub7c9\uc774\ub098 Wi-Fi \uc5f0\uacb0 \uc0c1\ud0dc\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1539", "t": "\uc774\ubc88 \ub2ec \ub370\uc774\ud130\ub97c \uc5bc\ub9c8\ub098 \uc37c\ub098\uc694?", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc758 \uc774\ubc88 \ub2ec \ub370\uc774\ud130 \uc0ac\uc6a9\ub7c9\uacfc \uc694\uae08\uc81c \uae30\ubcf8 \uc81c\uacf5\ub7c9\uc744 \uc870\ud68c\ud574 \ub0a8\uc740 \ub370\ 0052", "q": "\ubb38\uc790 \uba54\uc2dc\uc9c0\uac00 \uc548 \uc62c \ub54c\ub294 \uc5b4\ub5bb\uac8c \ud574\uc57c \ud558\ub098\uc694?", "g": "ANS", "f": [{"id": "1012", "t": "\ud734\ub300\ud3f0 \ubcf8\uc778 \uc778\uc99d \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc73c\uba74 \ubb34\uc5c7\uc744 \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ubcf8\uc778 \uc778\uc99d \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc73c\uba74 \ud734\ub300\ud3f0\uc758 \uc2e0\ud638\u00b7\ubb38\uc790 \uc218\uc2e0 \uc0c1\ud0dc\uc640 \uc2a4\ud338 \ucc28\ub2e8\ud568, \uc778\uc99d \uc694\uccad \ud69f\uc218 \uc81c\ud55c \uc5ec\ubd80\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uc77c\ubc18 \ubb38\uc790\ub3c4 \ubc1b\uc9c0 \ubabb\ud55c\ub2e4\uba74 \ud68c\uc120\uc774\ub098 \uae30\uae30 \ubb38\uc81c\ub97c \uc810\uac80\ubc1b\uc544 \uc8fc\uc138\uc694.", "y": 1}, {"i": 2, "t": "\ud2b9\uc815 \uc11c\ube44\uc2a4\uc758 \uc778\uc99d \ubb38\uc790\ub9cc \uc624\uc9c0 \uc54a\ub294\ub2e4\uba74 \ud574\ub2f9 \uc11c\ube44\uc2a4\uc758 \ubb38\uc790 \ubc1c\uc1a1 \uc0c1\ud0dc\ub97c \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1231", "t": "\uc7ac\ub09c \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc544\uc694.", "s": [{"i": 0, "t": "\uc7ac\ub09c \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\ub294\ub2e4\uba74 \ud734\ub300\ud3f0 \uc124\uc815 > \uc548\uc804 \ubc0f \uae34\uae09(\ub610\ub294 \uc54c\ub9bc) > \uae34\uae09 \uc7ac\ub09c \ubb38\uc790\uac00 \ucf1c\uc838 \uc788\ub294\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\uc7ac\ub09c \ubb38\uc790\ub294 \uae30\uc9c0\uad6d \ub2e8\uc704\ub85c \ubc1c\uc1a1\ub418\ubbc0\ub85c \uac19\uc740 \uc9c0\uc5ed\uc5d0\uc11c\ub3c4 \uc5f0\uacb0\ub41c \uae30\uc9c0\uad6d\uc5d0 \ub530\ub77c \ubc1b\uc9c0 \ubabb\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1469", "t": "\ubcf8\uc778\uc778\uc99d \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc544\uc694.", "s": [{"i": 0, "t": "\ubcf8\uc778\uc778\uc99d \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc73c\uba74 \uc2a4\ud338 \ucc28\ub2e8 \uc571, \uba54\uc2dc\uc9c0 \uc218\uc2e0 \ucc28\ub2e8 \uc124\uc815, \ubb38\uc790\ud568 \uc800\uc7a5 \uacf5\uac04\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uc778\uc99d \uc694\uccad\uc744 \uc9e7\uc740 \uc2dc\uac04\uc5d0 \uc5ec\ub7ec \ubc88 \ubc18\ubcf5\ud558\uba74 \ubcf8\uc778\uc778\uc99d\uc774 \uc7a0\uc2dc \uc81c\ud55c\ub420 \uc218 \uc788\uc73c\ub2c8 \uba87 \ubd84 \ub4a4 \ub2e4\uc2dc \uc2dc\ub3c4\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1687", "t": "\uae34\uae09\uc7ac\ub09c\ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc73c\uba74 \ubb34\uc5c7\uc744 \ud655\uc778\ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uae34\uae09\uc7ac\ub09c\ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc73c\uba74 \ud734\ub300\ud3f0\uc758 \uc7ac\ub09c\ubb38\uc790 \uc218\uc2e0 \uc124\uc815\uc774 \ucf1c\uc838 \uc788\ub294\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\uc548\ub4dc\ub85c\uc774\ub4dc\uc758 \uc7ac\ub09c\ubb38\uc790 \uc218\uc2e0 \uc124\uc815\uc740 \uae30\uc885\uc5d0 \ub530\ub77c \uc124\uc815 \ub610\ub294 \uba54\uc2dc\uc9c0 \uc571\uc758 \u2018\uc7ac\ub09c\ubb38\uc790\u00b7\uae34\uae09 \uc54c\ub9bc\u2019 \uba54\ub274\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\uc544\uc774\ud3f0\uc758 \uc7ac\ub09c\ubb38\uc790 \uc218\uc2e0 \uc124\uc815\uc740 \u2018\uc124\uc815 \u2192 \uc54c\ub9bc\u2019 \ud654\uba74 \ud558\ub2e8\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 3, "t": "\uc7ac\ub09c\ubb38\uc790 \uc218\uc2e0 \uc124\uc815\uc774 \uc815\uc0c1\uc774\uc5b4\ub3c4 \ubb38\uc790 \ubc1c\uc1a1 \ub2f9\uc2dc\uc758 \uae30\uc9c0\uad6d\u00b7\ud734\ub300\ud3f0 \ub124\ud2b8\uc6cc\ud06c \uc0c1\ud0dc\uc5d0 \ub530\ub77c \uc218\uc2e0\ud558\uc9c0 \ubabb\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 4, "t": "\uae34\uae09\uc7ac\ub09c\ubb38\uc790 \ubbf8\uc218\uc2e0 \ubb38\uc81c\uac00 \ubc18\ubcf5\ub418\uba74 \uae30\uae30 \uc81c\uc870\uc0ac\ub098 \ud1b5\uc2e0\uc0ac \uace0\uac1d\uc13c\ud130\uc5d0 \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "183", "t": "\ubb38\uc790\uac00 \uc624\uac00\uc9c0 \uc54a\uc744 \ub54c\ub294 \ubb34\uc5c7\uc744 \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ubb38\uc790\uac00 \uc624\uac00\uc9c0 \uc54a\uc744 \ub54c\ub294 \uc800\uc7a5 \uacf5\uac04\uacfc \uc2a4\ud338 \ucc28\ub2e8 \uc124\uc815\uc744 \ud655\uc778\ud558\uace0 \uba54\uc2dc\uc9c0 \uc571 \uc124\uc815\uc744 \uc810\uac80\ud55c \ub4a4 \ud734\ub300\ud3f0\uc744 \uc7ac\ubd80\ud305\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "184", "t": "\uc800\uc7a5 \uacf5\uac04\uc774 \ubd80\uc871\ud558\uba74 \ubb38\uc790\uac00 \uc548 \uc624\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc800\uc7a5 \uacf5\uac04\uc774 \ubd80\uc871\ud558\uba74 \uc0c8 \ubb38\uc790 \uba54\uc2dc\uc9c0\uac00 \uc800\uc7a5\ub418\uc9c0 \uc54a\uc544 \uc218\uc2e0\ub418\uc9c0 \uc54a\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc800\uc7a5 \uacf5\uac04 \ubd80\uc871\uc73c\ub85c \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\ub294\ub2e4\uba74 \uc624\ub798\ub41c \ub300\ud654\ub97c \uc815\ub9ac\ud55c \ub4a4 \ub2e4\uc2dc \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "460", "t": "\ubb38\uc790\uac00 \uc548 \uc640\uc11c \ub9e4\uc7a5\uc5d0\uc11c \ud655\uc778\ubc1b\uace0 \uc2f6\uc740\ub370 \uac00\uae4c\uc6b4 \uacf3\uc774 \uc5b4\ub514\uc608\uc694?", "s": [{"i": 0, "t": "\ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\ub294 \ubb38\uc81c\ub97c \uc0c1\ub2f4\ud560 \uc218 \uc788\ub294 \ud604\uc7ac \uc704\uce58 \uc8fc\ubcc0 \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\ub294\ub2e4\uba74 \ub9e4\uc7a5 \ubc29\ubb38 \uc804\uc5d0 \ud734\ub300\ud3f0 \uc800\uc7a5 \uacf5\uac04\uacfc \ucc28\ub2e8 \uc124\uc815\uc744 \ud655\uc778\ud574 \ubcf4\uc138\uc694.", "y": 1}]}, {"id": "62", "t": "\ubb38\uc790 \uba54\uc2dc\uc9c0\ub97c \ubc1b\uc9c0 \ubabb\ud558\uace0 \uc788\uc5b4\uc694.", "s": [{"i": 0, "t": "\ubb38\uc790 \uba54\uc2dc\uc9c0\ub97c \ubc1b\uc9c0 \ubabb\ud55c\ub2e4\uba74 \uc218\uc2e0 \ucc28\ub2e8 \uc124\uc815\uacfc \uc800\uc7a5 \uacf5\uac04, \ub124\ud2b8\uc6cc\ud06c \uc0c1\ud0dc\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}]}]}, {"id": "Q0053", "q": "\ud1b5\ud654 \ud488\uc9c8\uc774 \ub098\uc060 \ub54c \uc2e0\uace0\ud558\ub294 \ubc29\ubc95\uc774 \uc788\ub098\uc694?", "g": "ANS", "f": [{"id": "1015", "t": "\ud1b5\ud654\ud560 \ub54c \uc18c\ub9ac\uac00 \ub04a\uae30\uac70\ub098 \uc7a1\uc74c\uc774 \ub4e4\ub824\uc694.", "s": [{"i": 0, "t": "\ud1b5\ud654\ud560 \ub54c \uc18c\ub9ac\uac00 \ub04a\uae30\uac70\ub098 \uc7a1\uc74c\uc774 \ub4e4\ub9ac\ub294 \uac83\uc740 \ud2b9\uc815 \uc7a5\uc18c\uc758 \uc804\ud30c \uc0c1\ud0dc\ub098 \ub2e8\ub9d0\uae30 \uc124\uc815 \ub54c\ubb38\uc77c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud1b5\ud654 \ud488\uc9c8\uc774 \ub098\uc058\ub2e4\uba74 \uc704\uce58\ub97c \uc62e\uae30\uace0 \ud734\ub300\ud3f0\uc744 \uc7ac\ubd80\ud305\ud574 \ubcf4\uc138\uc694.", "y": 1}, {"i": 2, "t": "\uc704\uce58\ub97c \uc62e\uae30\uace0 \uc7ac\ubd80\ud305\ud574\ub3c4 \ud1b5\ud654 \ud488\uc9c8 \ubb38\uc81c\uac00 \uacc4\uc18d\ub418\uba74 \uace0\uac1d\uc13c\ud130\uc5d0 \ubc1c\uc0dd \uc7a5\uc18c\uc640 \uc2dc\uac04\uc744 \uc54c\ub824 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "1223", "t": "\uac74\ubb3c \uc548\uc774\ub098 \uc9d1\uc5d0\uc11c\ub9cc \ud1b5\ud654\uac00 \uc798 \uc548 \ub3fc\uc694.", "s": [{"i": 0, "t": "\uac74\ubb3c \uad6c\uc870\ub098 \uc9c0\ud558\ucc98\ub7fc \uc804\ud30c\uac00 \uc57d\ud55c \uacf3\uc5d0\uc11c\ub294 \ud734\ub300\ud3f0 \ud1b5\ud654 \ud488\uc9c8\uc774 \ub5a8\uc5b4\uc9c8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc9d1 \uc548\uc5d0\uc11c \ud1b5\ud654\uac00 \uc798\ub418\uc9c0 \uc54a\uc73c\uba74 \ud734\ub300\ud3f0 \uc124\uc815\uc5d0\uc11c Wi-Fi \ud1b5\ud654\ub97c \ucf1c\uc11c \uc9d1 Wi-Fi\ub85c \ud1b5\ud654\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\ 418\ub098\uc694?", "g": "ANS", "f": [{"id": "1302", "t": "\ud574\uc678\uc5d0\uc11c \uc804\ud654\ub098 \ubb38\uc790\ub97c \ubc1b\uc73c\uba74 \uc694\uae08\uc774 \ub098\uc624\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \ubb38\uc790\ub97c \ubc1b\ub294 \uac83\uc740 \uc77c\ubc18\uc801\uc73c\ub85c \ubb34\ub8cc\uc9c0\ub9cc \uad6d\uac00\ubcc4 \ub85c\ubc0d \uc870\uac74\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\ud574\uc678\uc5d0\uc11c \uc74c\uc131\ud1b5\ud654\ub97c \ubc1b\uc73c\uba74 \uad6d\uac00\ubcc4 \ubd84\ub2f9 \ub85c\ubc0d \uc694\uae08\uc774 \ubd80\uacfc\ub418\uc9c0\ub9cc \ubca8\ub9cc \uc6b8\ub9ac\uace0 \ubc1b\uc9c0 \uc54a\uc73c\uba74 \uc694\uae08\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1323", "t": "\ub85c\ubc0d \uc911 \uac78\ub824 \uc628 \uc804\ud654\ub97c \uad6d\ub0b4 \ubc88\ud638\ub85c \ucc29\uc2e0 \uc804\ud658\ud558\uba74 \uc694\uae08\uc774 \ub098\uc624\ub098\uc694?", "s": [{"i": 0, "t": "\ub85c\ubc0d \uc911\uc778 \ud734\ub300\ud3f0\uc73c\ub85c \uc5f0\uacb0\ub418\uc9c0 \uc54a\uace0 \uad6d\ub0b4 \ubc88\ud638\ub85c \ubc14\ub85c \ucc29\uc2e0 \uc804\ud658\ub41c\ub2e4\uba74 \ub85c\ubc0d \uc694\uae08\uc740 \uc5c6\uace0 \uad6d\ub0b4 \ucc29\uc2e0 \uc804\ud658 \uc694\uae08\ub9cc \ubd80\uacfc\ub429\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uad6d\ub0b4 \ubc88\ud638\uc5d0\uc11c \ub85c\ubc0d \uc911\uc778 \ubc88\ud638\ub85c \ucc29\uc2e0 \uc804\ud658\ud558\uba74 \ub85c\ubc0d \uc218\uc2e0 \uc694\uae08\uc774 \ubc1c\uc0dd\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "34", "t": "\ud574\uc678\uc5d0\uc11c \uc804\ud654\ub97c \ubc1b\uc73c\uba74 \uc694\uae08\uc774 \ubc1c\uc0dd\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \uc804\ud654\ub97c \ubc1b\uc744 \ub54c\ub294 \uad6d\uac00\uc640 \ub85c\ubc0d \uc870\uac74\uc5d0 \ub530\ub77c \uc218\uc2e0 \ud1b5\ud654 \uc694\uae08\uc774 \ubc1c\uc0dd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "828", "t": "\ud574\uc678\uc5d0\uc11c \ubc1b\uc740 \uc804\ud654\ub3c4 \uc694\uae08\uc774 \ub098\uac14\ub294\uc9c0 \ubcf4\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ub85c\ubc0d \uc774\uc6a9 \ub0b4\uc5ed\uc744 \uc870\ud68c\ud574 \ud574\uc678\uc5d0\uc11c \ubc1b\uc740 \uc804\ud654\uc758 \uae30\ub85d\uacfc \uc694\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0057", "q": "\uac00\uc785\ud55c \ubd80\uac00\uc11c\ube44\uc2a4 \ubaa9\ub85d\uc740 \uc5b4\ub514\uc11c \ubcf4\ub098\uc694?", "g": "ANS", "f": [{"id": "1327", "t": "\uac00\uc785\ub41c \ubd80\uac00\uc11c\ube44\uc2a4\ub294 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uba54\ub274\uc5d0\uc11c \uac00\uc785\ub41c \ubb34\ub8cc\u00b7\uc720\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\uc640 \uc6d4 \uc694\uae08, \uac00\uc785\uc77c\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1386", "t": "\ub0b4 \uacb0\ud569 \uac00\uc785 \uc815\ubcf4\ub294 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\uc758 \uac00\uc785 \uc815\ubcf4 > \uacb0\ud569 \uc0c1\ud488\uc5d0\uc11c \uacb0\ud569 \uc774\ub984, \uacb0\ud569\ub41c \ud68c\uc120, \ub300\ud45c \ud68c\uc120, \ud560\uc778 \uae08\uc561\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1544", "t": "\uc81c\uac00 \uac00\uc785\ud55c \ubd80\uac00\uc11c\ube44\uc2a4\ub97c \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc5d0 \uac00\uc785\ub41c \ubd80\uac00\uc11c\ube44\uc2a4\uc640 \uac01 \uc11c\ube44\uc2a4\uc758 \uc6d4 \uc694\uae08, \uac00\uc785\uc77c\uc744 \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "682", "t": "\uc81c\uac00 \uac00\uc785\ud55c \ubd80\uac00\uc11c\ube44\uc2a4 \ubaa9\ub85d \uc880 \ubcf4\uc5ec \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud55c \ud68c\uc6d0\uc758 \ud68c\uc120 \uc815\ubcf4\ub97c \uc870\u 54a\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "287", "t": "\uba64\ubc84\uc2ed \ud560\uc778\uc740 \uc5b4\ub5bb\uac8c \ubc1b\ub098\uc694?", "s": [{"i": 0, "t": "\uba64\ubc84\uc2ed \ud560\uc778\uc744 \ubc1b\uc73c\ub824\uba74 \uc81c\ud734\ucc98\uc5d0\uc11c \uc571\uc758 \uba64\ubc84\uc2ed \ubc14\ucf54\ub4dc\ub97c \uc81c\uc2dc\ud558\uba74 \ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uba64\ubc84\uc2ed \ud560\uc778 \uc0ac\uc6a9\uc740 1\uc77c 1\ud68c\ub85c \uc81c\ud55c\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "295", "t": "\uba64\ubc84\uc2ed\uc740 \ub530\ub85c \uac00\uc785\ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uba64\ubc84\uc2ed\uc740 Ubot \ud734\ub300\ud3f0 \ud68c\uc120\uc774 \uc788\ub2e4\uba74 \uc571\uc5d0\uc11c \uac00\uc785\ube44 \uc5c6\uc774 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc2e0\uaddc \uac00\uc785\uc790\uc758 \uba64\ubc84\uc2ed \ub4f1\uae09\uc740 \uac00\uc785 \ub2e4\uc74c \ub2ec 1\uc77c\uc5d0 \uc815\ud574\uc9d1\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\uba64\ubc84\uc2ed \ud61c\ud0dd\uc744 \uc774\uc6a9\ud560 \ub54c\ub294 \uc571\uc758 \ubaa8\ubc14\uc77c \uce74\ub4dc \ubc14\ucf54\ub4dc\ub97c \uc81c\uc2dc\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "297", "t": "\uba64\ubc84\uc2ed\uc5d0 \ub300\ud574 \ub354 \uc54c\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uba64\ubc84\uc2ed \ub4f1\uae09, \ud61c\ud0dd, \uc81c\ud734\ucc98\ub294 \uc571\uc758 \uba64\ubc84\uc2ed \uba54\ub274\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uba64\ubc84\uc2ed\uc5d0 \uad00\ud574 \uad81\uae08\ud55c \uc810\uc740 \uace0\uac1d\uc13c\ud130\ub098 AI \ucc57\ubd07\uc73c\ub85c \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}]}]}, {"id": "Q0085", "q": "\uba85\uc758\ubcc0\uacbd", "g": "ANS", "f": [{"id": "1093", "t": "\uba85\uc758 \ubcc0\uacbd\uc740 \uc544\ubb34\uc5d0\uac8c\ub098 \ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc815\ubd80\uc758 \ubc88\ud638 \ub9e4\ub9e4 \ubc29\uc9c0 \uc815\ucc45\uc5d0 \ub530\ub77c \ud734\ub300\ud3f0 \ud68c\uc120 \uba85\uc758 \ubcc0\uacbd\uc740 \uac00\uc871 \uac04 \ub4f1 \uc77c\ubd80 \uacbd\uc6b0\uc5d0\ub9cc \ud5c8\uc6a9\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uac00\uc871 \uac04 \uba85\uc758 \ubcc0\uacbd\uc740 \uac00\uc871\uad00\uacc4\uc99d\uba85\uc11c\ub85c \uad00\uacc4\ub97c \ud655\uc778\ud55c \ub4a4 \uc9c4\ud589\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "1094", "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \ud558\ub824\uba74 \ubb34\uc5c7\uc774 \ud544\uc694\ud55c\uac00\uc694?", "s": [{"i": 0, "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \ud558\ub824\uba74 \uae30\uc874 \uba85\uc758\uc790\uc640 \uc0c8 \uba85\uc758\uc790\uac00 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ud568\uaed8 \ub9e4\uc7a5\uc5d0 \ubc29\ubb38\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uac00\uc871 \uac04 \uba85\uc758 \ubcc0\uacbd\uc5d0\ub294 \ubc1c\uae09 3\uac1c\uc6d4 \uc774\ub0b4\uc758 \uac00\uc871\uad00\uacc4\uc99d\uba85\uc11c\ub3c4 \uc900\ube44\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 2, "t": "\uba85\uc758 \ubcc0\uacbd\uc5d0 \ud55c \uc0ac\ub78c\ub9cc \ubc29\ubb38\ud55c\ub2e4\uba74 \uc624\uc9c0 \uc54a\ub294 \uc0ac\ub78c\uc758 \uc778\uac10\uc99d\uba85\uc11c\uc640 \uc704\uc784\uc7a5\uc774 \ucd94\uac00\ub85c \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "1097", "t": "\uba85\uc758\ub97c \ubc14\uafb8\uba74 \uc120\ud0dd\uc57d\uc815\uc740 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\uac00\uc871 \uac04 \uba85\uc758 \ubcc0\uacbd\uc5d0\uc11c\ub294 \uc0c8 \uba85\uc758\uc790\uac00 \ub0a8\uc740 \uc120\ud0dd\uc57d\uc815\uc744 \uc774\uc5b4\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uac00\uc871 \uac04 \uba85\uc758 \ubcc0\uacbd\uc5d0\uc11c \uc120\ud0dd\uc57d\uc815\uc744 \uc774\uc5b4\ubc1b\uc9c0 \uc54a\uc73c\uba74 \ud560\uc778\ubc18\ud658\uae08\uc774 \uc815\uc0b0\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\uac00\uc871\uc774 \uc544\ub2cc \uc0ac\ub78c\uc5d0\uac8c \uba85\uc758\ub97c \ubcc0\uacbd\ud560 \ub54c s": [{"i": 0, "t": "\ud5c8\uc6a9\ub418\ub294 \uc870\uac74\uc5d0\uc11c \ubcf8\uc778 \ud655\uc778 \ubc0f \ud544\uc694\ud55c \uc11c\ub958\ub97c \uc81c\ucd9c\ud558\uba74 \uba85\uc758 \ubcc0\uacbd\uc744 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0086", "q": "\uc77c\uc2dc\uc815\uc9c0", "g": "ANS", "f": [{"id": "1320", "t": "\uc7a5\uae30\uac04 \ud574\uc678\uc5d0 \uba38\ubb34\ub294\ub370 \ubc88\ud638\ub97c \uc720\uc9c0\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0 \uc7a5\uae30\uac04 \uba38\ubb34\ub97c \ub54c \uc77c\uc2dc\uc815\uc9c0\ub97c \uc2e0\uccad\ud558\uba74 \uc6d4 3,850\uc6d0\uc73c\ub85c \ubc88\ud638\ub97c \uc720\uc9c0\ud560 \uc218 \uc788\uc73c\uba70 \uc5f0 2\ud68c, \ud55c \ubc88\uc5d0 \ucd5c\ub300 90\uc77c\uae4c\uc9c0 \uac00\ub2a5\ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uad70 \ubcf5\ubb34\ub098 \uc720\ud559 \ub4f1\uc73c\ub85c \ub354 \uc624\ub798 \ud68c\uc120\uc744 \uc815\uc9c0\ud574\uc57c \ud55c\ub2e4\uba74 \ucd9c\uad6d \uc0ac\uc2e4\uc744 \uc99d\uba85\ud558\ub294 \uc11c\ub958\ub85c \uc7a5\uae30 \uc77c\uc2dc\uc815\uc9c0\ub97c \uc2e0\uccad\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1352", "t": "\uc77c\uc2dc\uc815\uc9c0 \uc911\uc5d0\ub3c4 \uba64\ubc84\uc2ed\uc744 \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud68c\uc120 \uc77c\uc2dc\uc815\uc9c0 \uae30\uac04\uc5d0\ub294 \uba64\ubc84\uc2ed \ud61c\ud0dd\uc744 \uc4f8 \uc218 \uc5c6\uace0 \uc815\uc9c0\ub97c \ud574\uc81c\ud558\uba74 \ub2e4\uc2dc \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc77c\uc2dc\uc815\uc9c0 \uae30\uac04\uc740 \uba64\ubc84\uc2ed \ub4f1\uae09 \uc0b0\uc815 \ud3c9\uade0\uc5d0\uc11c \uc81c\uc678\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1385", "t": "\uacb0\ud569 \uc911\uc778 \ud68c\uc120\uc774 \uc77c\uc2dc\uc815\uc9c0\ub418\uba74 \ud560\uc778\uc740 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\uacb0\ud569 \ud68c\uc120\uc774 \uc77c\uc2dc\uc815\uc9c0\ub3fc\ub3c4 \uacb0\ud569\uc740 \uc720\uc9c0\ub429\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uacb0\ud569 \ub300\ud45c \ud68c\uc120\uc774 \uc77c\uc2dc\uc815\uc9c0\ub41c \ub2ec\uc5d0\ub294 \uacb0\ud569 \ud560\uc778\uc774 \uc801\uc6a9\ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1431", "t": "\ud734\ub300\ud3f0\uc744 \uc7a0\uc2dc \uc26c\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc7a0\uc2dc \uc26c\ub824\uba74 Ubot \uc571\u00b7\uace0\uac1d\uc13c\ud130\u00b7\ub9e4\uc7a5\uc5d0\uc11c \uc77c\uc2dc\uc815\uc9c0\ub97c \uc2e0\uccad\ud558\uba74 \ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \uc77c\uc2dc\uc815\uc9c0\ub294 \uc5f0 2\ud68c, 1\ud68c \ucd5c\ub300 90\uc77c, \uc5f0\uac04 \ud569\uacc4 180\uc77c\uae4c\uc9c0 \uac00\ub2a5\ud569\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\uc77c\uc2dc\uc815\uc9c0 \uae30\uac04\uc5d0\ub294 \uc6d4 3,850\uc6d0\uc774 \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "1433", "t": "\uc77c\uc2dc\uc815\uc9c0 \uae30\uac04\uc774 \ub05d\ub098\uba74 \uc790\ub3d9\uc73c\ub85c \ud480\ub9ac\ub098\uc694?", "s": [{"i": 0, "t": "\uc2e0\uccad\ud55c \uc77c\uc2dc\uc815\uc9c0 \uae30\uac04\uc774 \ub05d\ub098\uba74 \uc815\uc9c0\uac00 \uc790\ub3d9\uc73c\ub85c \ud574\uc81c\ub418\uc5b4 \uc6d0\ub798 \uc694\uae08\uc81c\ub85c \ub2e4\uc2dc \uc4f8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc77c\uc2dc\uc815\uc9c0\ub294 1\ud68c \ucd5c\ub300 90\uc77c\uc744 \ub118\uaca8 \uc790\ub3d9 \uc5f0\uc7a5\ub418\uc9c0 \uc54a\uc73c\ubbc0\ub85c, \ub354 \uc26c\ub824\uba74 \ub2e4\uc2dc \uc2e0\uccad\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "1549", "t": "\uc81c \ud68c\uc120\uc774 \uc9c0\uae08 \uc815\uc9c0 \uc0c1\ud0dc\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc758 \uc774\uc6a9 \uc0c1\ud0dc\uac00 \uc815\uc0c1, \uc815\uc9c0, \ud574\uc9c0 \uc911 \ubb34\uc5c7\uc778\uc9c0 \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "1859", "t": "\uc77c\uc2dc\uc815\uc9c0 \ub73b\uc740 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ud68c\uc120\uc744 \ud574\uc9c0\ud558\uc9c0 \uc54a\uace0 \uc77c\uc815 \uae30\uac04 \ud1b5\ud654\ub098 \ub370\uc774\ud130 \uc774\uc6a9\uc744 \uc7a0\uc2dc \uba48\ucd94\ub294 \uac83\uc785\ub2c8\ub2e4.", "y": 1}]}, {"id": "987", "t": "\uc81c \ubc88\ud638\uac00 \uc815\uc9c0\ub41c \uc774\uc720\uac00 \ubb50\uc608\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ud68c\uc120 \uc0c1\ud0dc\ub97c \uc870\ud68c\ud574 \uc815\uc9c0 \uc0ac\uc720\uc640 \ud574\uc81c \ubc29\ubc95\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0087", "q": "\uc18c\uc561\uacb0\uc81c \ucc28\ub2e8", "g": "ANS", "f": [{"id": "1188", "t": "\ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \uc544\uc608 \ub9c9\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \uc644\uc804\ud788 \ucc28\ub2e8\ud558\ub824\uba74 \uc571\uc5d0\uc11c \uacb0\uc81c \ud55c\ub3c4\ub97c 0\uc6d0\uc73c\ub85c \ubc14\uafb8\uac70\ub098 \ubb34\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\uc778 Ubot \ud734\ub300\ud3f0 \uacb0\uc81c \ucc28\ub2e8\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc774\ubbf8 \uc774\ub8e8\uc5b4\uc9c4 \ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \ucde8\uc18c\ud558\ub824\uba74 \uacb0\uc81c\ud55c \uac00\ub9f9\uc810\uc5d0 \uc694\uccad\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "332", "t": "\uc18c\uc561\uacb0\uc81c\ub97c \uc544\uc608 \ub9c9\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc18c\uc561\uacb0\uc81c\ub97c \uc544\uc608 \ub9c9\uc73c\ub824\uba74 \uc571\uc5d0\uc11c \uc18c\uc561\uacb0\uc81c\ub97c \ucc28\ub2e8\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc18c\uc561\uacb0\uc81c \ud55c\ub3c4\ub3c4 \uc571\uc5d0\uc11c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\uc18c\uc561\uacb0\uc81c \ub0b4\uc5ed\uc740 \uc571\uc758 \uc18c\uc561\uacb0\uc81c \uc774\uc6a9\ub0b4\uc5ed\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "43", "t": "\ud734\ub300\ud3f0 \uc18c\uc561\uacb0\uc81c\ub97c \ucc28\ub2e8\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc18c\uc561\uacb0\uc81c\ub294 \uc18c\uc561\uacb0\uc81c \uad00\ub9ac \uba54\ub274\ub098 \uace0\uac1d\uc13c\ud130\ub97c \ud1b5\ud574 \ucc28\ub2e8\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "739", "t": "\uc81c \ubc88\ud638\ub85c \uc18c\uc561\uacb0\uc81c\uac00 \ub9c9\ud600 \uc788\ub294\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uc18c\uc561\uacb0\uc81c \uc124\uc815\uc744 \uc870\ud68c\ud574 \ud604\uc7ac \uc18c\uc561\uacb0\uc81c\uac00 \ucc28\ub2e8\ub418\uc5b4 \uc788\ub294\uc9c0 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0088", "q": "\ubc88\ud638\uc774\ub3d9", "g": "ANS", "f": [{"id": "1075", "t": "\ubc88\ud638\uc774\ub3d9\uc774 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9\uc740 \uc4f0\ub358 \ud734\ub300\ud3f0 \ubc88\ud638\ub97c \uadf8\ub300\ub85c \uc720\uc9c0\ud558\uba74\uc11c \ud1b5\uc2e0\uc0ac\ub9cc \ubc14\uafb8\ub294 \uc81c\ub3c4\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "Ubot\uc73c\ub85c \ubc88\ud638\uc774\ub3d9\ud558\uba74 \uc0c8 \ud68c\uc120\uc774 \uac1c\ud1b5\ub418\ub294 \uc989\uc2dc \uc774\uc804 \ud1b5\uc2e0\uc0ac \ud68c\uc120\uc740 \uc790\ub3d9 \ud574\uc9c0\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "1077", "t": "\ubc88\ud638\uc774\ub3d9\uc740 \uc5b8\uc81c \uc2e0\uccad\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9 \uac1c\ud1b5\uc740 \ud3c9\uc77c\uacfc \ud1a0\uc694\uc77c \uc624\uc804 10\uc2dc\ubd80\ud130 \uc624\ud6c4 7\uc2dc 50\ubd84\uae4c\uc9c0 \ucc98\ub9ac\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubc88\ud638\uc774\ub3d9\uc744 \uc77c\uc694\uc77c\uc774\ub098 \uacf5\ud734\uc77c\uc5d0 \uc2e0\uccad\ud558\uba74 \ub2e4\uc74c \ucc98\ub9ac\uc77c\uc5d0 \uac1c\ud1b5\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1078", "t": "\ubc88\ud638\uc774\ub3d9\uc744 \ud560 \uc218 \uc5c6\ub294 \uacbd\uc6b0\ub3c4 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc774\uc804 \ud1b5\uc2e0\uc0ac\uc5d0 \ubbf8\ub0a9 \uc694\uae08\uc774 \uc788\uac70\ub098 \uc2e0\uaddc \uac00\uc785\u00b7\ubc88\ud638\uc774\ub3d9\u00b7\uba85\uc758 \ubcc0\uacbd \ud6c4 3\uac1c\uc6d4\uc774 \uc9c0\ub098\uc9c0 \uc54a\uc558\ub2e4\uba74 \ubc88\ud638\uc774\ub3d9\uc774 \uc81c\ud55c\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4\uc5d0 \uac00\uc785\ub418\uc5b4 \ubc88\ud638\uc774\ub3d9\uc774 \uc81c\ud55c\ub41c\ub2e4\uba74 \uc11c\ube44\uc2a4\ub97c \ud574\uc81c\ud55c \ub4a4 \uc2e0\uccad\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1082", "t": "\ubc88\ud638\uc774\ub3d9\uc744 \ucde8\uc18c(\ucca0\ud68c)\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9 \uac1c\ud1b5 \uc804\uc5d0\ub294 \uc571\uc758 \uc8fc\ubb38 \uc870\ud68c\uc5d0\uc11c \uc2e0\uccad\uc744 \ubc14\ub85c \ucde8\uc18c\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubc88\ud638\uc774\ub3d9 \uac1c\ud1b5 \ud6c4 14\uc77c \uc774\ub0b4\uc5d0\ub294 \ud1b5\ud654 \ud488\uc9c8 \ubd88\ub7c9\uc774\ub098 \ub2e8\ub9d0\uae30 \ubd88\ub7c9 \uac19\uc740 \uc0ac\uc720\uac00 \uc788\uc744 \ub54c \uace0\uac1d\uc13c\ud130\ub098 \ub9e4\uc7a5\uc5d0\uc11c \ucca0\ud68c\ub97c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1088", "t": "\ubc88\ud638\uc774\ub3d9, \uc2e0\uaddc \uac00\uc785, \uae30\uae30 \ubcc0\uacbd\uc740 \uc5b4\ub5bb\uac8c \ub2e4\ub978\uac00\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9\uc740 \uc4f0\ub358 \ubc88\ud638\ub97c \uc720\uc9c0\ud558\uba70 \ud1b5\uc2e0\uc0ac\ub9cc Ubot\uc73c\ub85c \ubc14\uafb8\ub294 \uac83\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc2e0\uaddc \uac00\uc785\uc740 \uc0c8 \ubc88\ud638\ub97c \ubc1b\uc544 \ud68c\uc120\uc744 \uac1c\ud1b5\ud558\ub294 \uac83\uc785\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\uae30\uae30 \ubcc0\uacbd\uc740 Ubot \ubc88\ud638\uc640 \uc694\uae08\uc81c\ub97c \uc720\uc9c0\ud558\uba70 \ud734\ub300\ud3f0\ub9cc \ubc14\uafb8\ub294 \uac83\uc785\ub2c8\ub2e4.", "y": 0}]}, {"id": "2", "t": "\ub2e4\ub978 \ud1b5\uc2e0\uc0ac\uc5d0\uc11c \ubc88\ud638\uc774\ub3d9\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ub2e4\ub978 \ud1b5\uc2e0\uc0ac\uc5d0\uc11c Ubot\uc73c\ub85c \ubc88\ud638\uc774\ub3d9\ud558\ub824\uba74 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \uc2e0\uccad\ud558\uac70\ub098 \uba85\uc758\uc790 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ubc88\ud638\uc774\ub3d9 \uc2e0\uccad \uc2dc \ud604\uc7ac \ud1b5\uc2e0\uc0ac\ub97c \uc120\ud0dd\ud558\uace0 \ubcf8\uc778\uc778\uc99d\uc744 \uac70\uce58\uba74 \uae30\uc874 \uc804\ud654\ubc88\ud638\ub97c \uc720\uc9c0\ud55c \ucc44 \uac1c\ud1b5\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "3", "t": "\ubc88\ud638\uc774\ub3d9\uc744 \ud558\uba74 \uae30\uc874 \ubc88\ud638\ub97c \uadf8\ub300\ub85c \uc0ac\uc6a9\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9\uc744 \ud574\ub3c4 \uae30\uc874 \uc804\ud654\ubc88\ud638\ub97c \uadf8\ub300\ub85c \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "986", "t": "\ubc88\ud638\uc774\ub3d9 \ub05d\ub0ac\ub294\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ubc88\ud638\uc774\ub3d9 \ub0b4\uc5ed\uc744 \uc870\ud68c\ud574 \ucc98\ub9ac \uc644\ub8cc \uc5ec\ubd80\ub97c \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0089", "q": "\uc790\uae09\uc81c", "g": "ANS", "f": [{"id": "1065", "t": "\uc81c\uc870\uc0ac \ub9e4\uc7a5\uc5d0\uc11c \uc0b0 \ud734\ub300\ud3f0\ub3c4 \uc120\ud0dd\uc57d\uc815 \ud560\uc778\uc744 \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc81c\uc870\uc0ac \ub9e4\uc7a5\uc774\ub098 \uc628\ub77c\uc778\ubab0\uc5d0\uc11c \uc0b0 \uc790\uae09\uc81c \ud734\ub300\ud3f0\uc740 \uacf5\uc2dc\uc9c0\uc6d0\uae08\uc744 \ubc1b\uc9c0 \uc54a\uc558\uc73c\ubbc0\ub85c \uc120\ud0dd\uc57d\uc815\uc73c\ub85c \uc694\uae08 25% \ud560\uc778\uc744 \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1139", "t": "\uc790\uae09\uc81c\ub098 \ub2e4\ub978 \ud1b5\uc2e0\uc0ac\uc5d0\uc11c \uc0b0 \ud0dc\ube14\ub9bf\ub3c4 \ud0dc\ube14\ub9bf \uc694\uae08\uc81c\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "LTE\ub098 5G\ub97c \uc9c0\uc6d0\ud558\ub294 \ud0dc\ube14\ub9bf\uc774\ub77c\uba74 \uc790\uae09\uc81c \uc81c\ud488\uc774\ub098 \ub2e4\ub978 \ud1b5\uc2e0\uc0ac\uc5d0\uc11c \uc0b0 \uae30\uae30\ub3c4 Ubot \ud0dc\ube14\ub9bf \uc694\uae08\uc81c\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "Ubot \ud0dc\ube14\ub9bf \uc694\uae08\uc81c\ub294 \ud734\ub300\ud3f0\uc5d0\uc11c \uc774\uc6a9\ud560 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1254", "t": "\uc790\uae09\uc81c\ud3f0\uc73c\ub85c \uae34\uae09 \uc804\ud654(112, 119)\ub97c \uac78 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc790\uae09\uc81c \ud734\ub300\ud3f0\ub3c4 \uac1c\ud1b5 \uc5ec\ubd80\uc640 \ud1b5\uc2e0\uc0ac\uc5d0 \uad00\uacc4\uc5c6\uc774 112, 119 \uac19\uc740 \uae34\uae09 \uc804\ud654\ub97c \uac78 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1287", "t": "\uc911\uace0\ud3f0\uc774\ub098 \uc790\uae09\uc81c\ud3f0\uc73c\ub85c eSIM\uc744 \uac1c\ud1b5\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "eSIM\uc744 \uc9c0\uc6d0\ud558\ub294 \uc911\uace0\ud3f0\uc774\ub098 \uc790\uae09\uc81c\ud3f0\uc774\ub77c\uba74 eSIM\uc73c\ub85c \uac1c\ud1b5\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc911\uace0\ud3f0\u00b7\uc790\uae09\uc81c\ud3f0\uc758 eSIM\uc744 \uc2e0\uccad\ud560 \ub54c\ub294 \uc124\uc815 > \ud734\ub300\ud3f0 \uc815\ubcf4\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\ub294 IMEI\uc640 EID \ubc88\ud638\uac00 \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "1393", "t": "\uc790\uae09\uc81c\ud3f0\ub3c4 \uc11c\ube44\uc2a4\uc13c\ud130\uc5d0\uc11c \uc218\ub9ac\ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc790\uae09\uc81c \ud734\ub300\ud3f0\ub3c4 \ud1b5\uc2e0\uc0ac\uc640 \uad00\uacc4\uc5c6\uc774 \uc81c\uc870\uc0ac \uc11c\ube44\uc2a4\uc13c\ud130\uc5d0\uc11c \uac19\uc740 \ubcf4\uc99d \uc870\uac74\uc73c\ub85c \uc218\ub9ac\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1406", "t": "\uc790\uae09\uc81c\ud3f0\uc774\ub098 \uc911\uace0\ud3f0\ub3c4 \ud734\ub300\ud3f0 \ubcf4\ud5d8\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uad6d\ub0b4\uc5d0\uc11c \uc0b0 \uc790\uae09\uc81c\ud3f0\uc740 \uac1c\ud1b5\uc77c\ubd80\ud130 30\uc77c \uc548\uc5d0 \uae30\uae30 \uc0c1\ud0dc\ub97c \ud655\uc778\ubc1b\uc740 \ub4a4 \ud734\ub300\ud3f0 \ubcf4\ud5d8\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc911\uace0\ud3f0\uc740 Ubot \ud734\ub300\ud3f0 \ubcf4\ud5d8\uc5d0 \uac00\uc785\ud560 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1777", "t": "\uc790\uae09\uc81c\ud3f0 \ub73b\uc774 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ud1b5\uc2e0\uc0ac \uac00\uc785\uacfc \ubcc4\uac1c\ub85c \uad6c\ub9e4\ud574 \ud638\ud658\ub418\ub294 \ud68c\uc120\uc758 SIM\uc774\ub098 eSIM\uc744 \ub123\uc5b4 \uc0ac\uc6a9\ud558\ub294 \ud734\ub300\ud3f0\uc785\ub2c8\ub2e4.", "y": 1}]}, {"id": "427", "t": "\uc790\uae09\uc81c \ud3f0\uc744 \uc0c0\ub294\ub370 \uac1c\ud1b5 \ub3c4\uc640\uc904 \ub9e4\uc7a5\uc774 \uadfc\ucc98\uc5d0 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud604\uc7ac \uc704\uce58 \uc8fc\ubcc0\uc5d0\uc11c \uc790\uae09\uc81c \ud734\ub300\ud3f0\uc758 \uc720\uc2ec\uc774\ub098 eSIM \uac1c\ud1b5\uc744 \ub3c4\uc640\ub4dc\ub9ac\ub294 \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc790\uae09\uc81c \ud734\ub300\ud3f0\uc744 \uac1c\ud1b5\ud558\ub824\uace0 \ub9e4\uc7a5\uc5d0 \ubc29\ubb38\ud560 \ub54c\ub294 \uc2e0\ubd84\uc99d\uc744 \uc9c0\ucc38\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "862", "t": "\uc81c \ud3f0\uc774 \uc790\uae09\uc81c\ub85c \ub4f1\ub85d\ub3fc \uc788\ub294\uc9c0 \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ub2e8\ub9d0 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \uc790\uae09\uc81c \ub2e8\ub9d0 \uc5ec\ubd80\ub97c \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0090", "q": "\uc120\ud0dd\uc57d\uc815", "g": "ANS", "f": [{"id": "1065", "t": "\uc81c\uc870\uc0ac \ub9e4\uc7a5\uc5d0\uc11c \uc0b0 \ud734\ub300\ud3f0\ub3c4 \uc120\ud0dd\uc57d\uc815 \ud560\uc778\uc744 \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc81c\uc870\uc0ac \ub9e4\uc7a5\uc774\ub098 \uc628\ub77c\uc778\ubab0\uc5d0\uc11c \uc0b0 \uc790\uae09\uc81c \ud734\ub300\ud3f0\uc740 \uacf5\uc2dc\uc9c0\uc6d0\uae08\uc744 \ubc1b\uc9c0 \uc54a\uc558\uc73c\ubbc0\ub85c \uc120\ud0dd\uc57d\uc815\uc73c\ub85c \uc694\uae08 25% \ud560\uc778\uc744 \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1068", "t": "\uacf5\uc2dc\uc9c0\uc6d0\uae08\uc744 \ubc1b\uc73c\uba74 \uc120\ud0dd\uc57d\uc815 \ud560\uc778\ub3c4 \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uacf5\uc2dc\uc9c0\uc6d0\uae08\uacfc \uc120\ud0dd\uc57d\uc815 \ud560\uc778\uc740 \ub458 \uc911 \ud558\ub098\ub9cc \ubc1b\uc744 \uc218 \uc788\uc73c\uba70 \ub3d9\uc2dc\uc5d0 \uc801\uc6a9\ud560 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \uac1c\ud1b5 \ud6c4\uc5d0\ub294 \uc9c0\uc6d0\uae08 \uc720\ud615\uc744 \ubc14\uafc0 \uc218 \uc5c6\uc73c\ub2c8 \uc8fc\ubb38\ud560 \ub54c \ub450 \ud61c\ud0dd\uc744 \ube44\uad50\ud574 \uace8\ub77c \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "112", "t": "\uc120\ud0dd\uc57d\uc815\uc740 \uba87 \uac1c\uc6d4\uc9dc\ub9ac\uac00 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc120\ud0dd\uc57d\uc815\uc740 12\uac1c\uc6d4\uacfc 24\uac1c\uc6d4 \ub450 \uac00\uc9c0\uac00 \uc788\uc73c\uba70 \ud560\uc778\uc728\uc740 \ubaa8\ub450 25%\uc785\ub2c8\ub2e4.", "y": 1}]}, {"id": "1144", "t": "\uc120\ud0dd\uc57d\uc815 \ud560\uc778\uc740 \uba87 \ud37c\uc13c\ud2b8\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uc120\ud0dd\uc57d\uc815\uc740 12\uac1c\uc6d4 \ub610\ub294 24\uac1c\uc6d4 \uc911\uc5d0\uc11c \uae30\uac04\uc744 \uace0\ub97c \uc218 \uc788\uace0 \ub450 \uae30\uac04 \ubaa8\ub450 \uc694\uae08\uc81c \uc6d4\uc815\uc561\uc758 25%\ub97c \ud560\uc778\ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub2e8\ub9d0\uae30\ub97c \uacf5\uc2dc\uc9c0\uc6d0\uae08 \uc5c6\uc774 \uad6c\ub9e4\ud588\uac70\ub098 \uc790\uae09\uc81c \uae30\uae30\ub97c \uc774\uc6a9\ud558\uba74 \uc120\ud0dd\uc57d\uc815\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1422", "t": "\uc120\ud0dd\uc57d\uc815\uc774 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uc120\ud0dd\uc57d\uc815\uc740 \uacf5\uc2dc\uc9c0\uc6d0\uae08\uc744 \ubc1b\uc9c0 \uc54a\ub294 \ub300\uc2e0 12\uac1c\uc6d4 \ub610\ub294 24\uac1c\uc6d4 \ub3d9\uc548 \uc694\uae08\uc81c \uc6d4\uc815\uc561\uc758 25%\ub97c \ud560\uc778\ubc1b\ub294 \uc81c\ub3c4\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc120\ud0dd\uc57d\uc815\uc740 \uc790\uae09\uc81c\ud3f0\uc774\ub098 \uc4f0\ub358 \ud734\ub300\ud3f0\uc73c\ub85c\ub3c4 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1423", "t": "\uc120\ud0dd\uc57d\uc815\uc740 \uc5b4\ub514\uc5d0\uc11c \uac00\uc785\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc120\ud0dd\uc57d\uc815\uc740 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \uac00\uc785\ud558\uac70\ub098 \ub9e4\uc7a5\u00b7\uace0\uac1d\uc13c\ud130\uc5d0\uc11c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc774\ubbf8 Ubot\uc744 \uc4f0\uace0 \uc788\uc5b4\ub3c4 \uacf5\uc2dc\uc9c0\uc6d0\uae08 \uc57d\uc815\uc774 \uc5c6\ub2e4\uba74 \uc120\ud0dd\uc57d\uc815\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1424", "t": "\uc120\ud0dd\uc57d\uc815 \uae30\uac04\uc744 12\uac1c\uc6d4\uc5d0\uc11c 24\uac1c\uc6d4
