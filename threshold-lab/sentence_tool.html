7d\uc815\uc774 \uc5c6\ub2e4\uba74 \uc120\ud0dd\uc57d\uc815\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "212", "t": "\uc120\ud0dd\uc57d\uc815 \ud560\uc778\uc740 \uc5b4\ub514\uc5d0\uc11c \uc2e0\uccad\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc120\ud0dd\uc57d\uc815 \ud560\uc778\uc740 \uc571, \uace0\uac1d\uc13c\ud130 \ub610\ub294 \ub9e4\uc7a5\uc5d0\uc11c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc120\ud0dd\uc57d\uc815\uc740 12\uac1c\uc6d4 \ub610\ub294 24\uac1c\uc6d4 \uc911\uc5d0\uc11c \uae30\uac04\uc744 \uace0\ub97c \uc218 \uc788\uc73c\uba70 \uc6d4 \uc694\uae08\uc758 25%\uac00 \ud560\uc778\ub429\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0517", "q": "\uccad\uad6c\uc11c \ud655\uc778 \ubc29\ubc95\uc774\ub791 \uc774\ubc88 \ub2ec \uc81c \uccad\uad6c \uae08\uc561\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1158", "t": "\uc774\ubc88 \ub2ec \uccad\uad6c \uc694\uae08\uc740 \uc5b8\uc81c\ubd80\ud130 \ud655\uc778\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc774\ubc88 \ub2ec \uccad\uad6c \uc694\uae08\uc740 \ub9e4\uc6d4 5\uc77c \uc624\ud6c4\ubd80\ud130 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc774\ubc88 \ub2ec \ubaa8\ubc14\uc77c \uccad\uad6c\uc11c\ub294 \ub9e4\uc6d4 8\uc77c\ucbe4 \ubc1c\uc1a1\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1159", "t": "\uccad\uad6c \uc694\uae08\uacfc \ub0a9\ubd80 \ub0b4\uc5ed\uc740 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uccad\uad6c \uc694\uae08\uacfc \ub0a9\ubd80 \ub0b4\uc5ed\uc740 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc758 \uc694\uae08 \uc870\ud68c \uba54\ub274\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc571\uc5d0\uc11c\ub294 \ucd5c\uadfc 12\uac1c\uc6d4\uc758 \uc694\uae08 \ub0b4\uc5ed\uc744 \uc870\ud68c\ud560 \uc218 \uc788\uc73c\uba70 \ub354 \uc624\ub798\ub41c \ub0b4\uc5ed\uc740 \uace0\uac1d\uc13c\ud130\uc5d0 \uc694\uccad\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1533", "t": "\uc774\ubc88 \ub2ec\uc774\ub098 \uc9c0\ub09c\ub2ec \uc694\uae08\uc774 \uc5bc\ub9c8\uc778\uc9c0 \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc758 \uc6d4\ubcc4 \uccad\uad6c \uae08\uc561\uacfc \ud56d\ubaa9\ubcc4 \uae08\uc561(\uc694\uae08\uc81c, \ubd80\uac00\uc11c\ube44\uc2a4, \ub85c\ubc0d, \ucd94\uac00 \uc0ac\uc6a9), \ud560\uc778 \uae08\uc561, \ub0a9\ubd80 \uc0c1\ud0dc\ub97c \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "723", "t": "\uc774\ubc88 \ub2ec \uc694\uae08\uc774 \uc9c0\uae08\uae4c\uc9c0 \uc5bc\ub9c8\ucbe4 \uc313\uc600\uc5b4\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uc774\ubc88 \ub2ec \uc0ac\uc6a9 \ub0b4\uc5ed\uc744 \uc870\ud68c\ud574 \ud604\uc7ac\uae4c\uc9c0 \uc313\uc778 \ud734\ub300\ud3f0 \uc694\uae08\uc758 \uc608\uc0c1 \uae08\uc561\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "893", "t": "\uc774\ubc88 \ub2ec \ud734\ub300\ud3f0 \uc694\uae08 \uc9c0\uae08 \uc5bc\ub9c8\uc608\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uc774\ubc88 \ub2ec \uccad\uad6c \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \ud604\uc7ac\uae4c\uc9c0\uc758 \uae08\uc561\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "894", "t": "\uc774\ubc88 \ub2ec \uccad\uad6c\ub420 \uae08\uc561 \uc880 \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uc774\ubc88 \ub2ec \uccad\uad6c \uc608\uc815 \uae08\uc561\uacfc \uc8fc\uc694 \ud56d\ubaa9\uc744 \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0518", "q": "\ud574\uc678\uc5d0\uc11c \ub85c\ubc0d\uc744 \uc4f0\ub294 \uc911\uc778\ub370 \ud638\ud154 \uc640\uc774\ud30c\uc774 \ube44\ubc00\ubc88\ud638\ub3c4 \ubaa8\ub974\uaca0\uace0 \ub85c\ubc0d \ub370\uc774\ud130\ub3c4 \uc5bc\ub9c8 \ub0a8\uc558\ub294\uc9c0 \ubaa8\ub974\uaca0\uc5b4\uc694", "g": "BORDER", "f": [{"id": "1312", "t": "\ub0a8\uc740 \ub85c\ubc0d \ub370\uc774\ud130\ub294 \uc5b4\ub5bb\uac8c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ub0a8\uc740 \ub85c\ubc0d \ub370\uc774\ud130\uc640 \ub2e4\uc74c \uc81c\uacf5\ub7c9 \ucd08\uae30\ud654 \uc2dc\uac01\uc740 Ubot \uc571\uc758 \ub85c\ubc0d \uba54\ub274\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud574\uc678\uc5d0\uc11c Ubot \uc571\uc744 \ubaa8\ubc14\uc77c \ub370\uc774\ud130\ub85c \uc774\uc6a9\ud558\uba74 \ub370\uc774\ud130 \ub85c\ubc0d \uc694\uae08\uc774 \ubc1c\uc0dd\ud560 \uc218 \uc788\uc73c\ubbc0\ub85c \ub85c\ubc0d \uc0c1\ud488\uc758 \ub370\uc774\ud130 \uc81c\uacf5\ub7c9\uc774\ub098 Wi-Fi \uc5f0\uacb0 \uc0c1\ud0dc\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "93", "t": "\ub85c\ubc0d \uc0ac\uc6a9\ub7c9\uc744 \ud655\uc778\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub85c\ubc0d \uc0ac\uc6a9\ub7c9\uc740 \uc571\uc774\ub098 \ud648\ud398\uc774\uc9c0\uc758 \ub85c\ubc0d \uc774\uc6a9\ub0b4\uc5ed\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0519", "q": "\ud3f0\uc744 \uc783\uc5b4\ubc84\ub824\uc11c \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud558\ub824\ub294\ub370 \uc5b4\ub514\uc11c \uc783\uc5b4\ubc84\ub838\ub294\uc9c0 \uc704\uce58\ub3c4 \uc54c\ub824 \uc904 \uc218 \uc788\ub098\uc694", "g": "BORDER", "f": [{"id": "1447", "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\uc5b4\uc694. \uc5b4\ub5bb\uac8c \ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \uba3c\uc800 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\ub098 \uace0\uac1d\uc13c\ud130 ARS(114)\uc5d0\uc11c \ubd84\uc2e4 \uc2e0\uace0\uc640 \ubd84\uc2e4 \uc815\uc9c0\ub97c \ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ubd84\uc2e4 \uc815\uc9c0\ub294 \ubb34\ub8cc\uc774\uace0 \ucd5c\ub300 90\uc77c \ub3d9\uc548 \ub2e4\ub978 \uc0ac\ub78c\uc774 \ub0b4 \ubc88\ud638\ub85c \uc804\ud654\u00b7\uacb0\uc81c\ud558\ub294 \uac83\uc744 \ub9c9\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1448", "t": "\ubd84\uc2e4 \uc2e0\uace0\ub294 \uc5b4\ub514\uc5d0\uc11c \ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4 \uc2e0\uace0\ub294 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubcf8\uc778\uc778\uc99d \ud6c4 \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub2e4\ub978 \uc804\ud654\ub85c 114(Ubot \ud734\ub300\ud3f0\uc774 \uc544\ub2c8\uba74 \ud648\ud398\uc774\uc9c0\uc758 \uace0\uac1d\uc13c\ud130 \ub300\ud45c\ubc88\ud638)\uc5d0 \uac78\uc5b4 ARS\ub85c 24\uc2dc\uac04 \ubd84\uc2e4 \uc2e0\uace0\ud560 \uc218\ub3c4 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "Ubot \ub9e4\uc7a5\uc5d0\uc11c\ub3c4 \uc2e0\ubd84\uc99d\uc744 \ubcf4\uc5ec \uc8fc\uba74 \ubd84\uc2e4 \uc2e0\uace0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1449", "t": "\uc783\uc5b4\ubc84\ub9b0 \ud734\ub300\ud3f0\uc758 \uc704\uce58\ub97c \ucc3e\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4\ud55c \ud734\ub300\ud3f0\uc758 \uc704\uce58 \ucc3e\uae30 \uae30\ub2a5\uc774 \ucf1c\uc838 \uc788\uc5c8\ub2e4\uba74 \uac24\ub7ed\uc2dc\ub294 \uc0bc\uc131 \ub0b4 \ub514\ubc14\uc774\uc2a4 \ucc3e\uae30, \uc544\uc774\ud3f0\uc740 \ub098\uc758 \ucc3e\uae30\uc5d0\uc11c \uc704\uce58\ub97c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud1b5\uc2e0\uc0ac\ub294 \uac1c\uc778\uc5d0\uac8c \ubd84\uc2e4 \ud734\ub300\ud3f0\uc758 \uc704\uce58\ub97c \uc54c\ub824 \uc904 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1461", "t": "\ubd84\uc2e4 \uc2e0\uace0\ub41c \ud734\ub300\ud3f0\uc73c\ub85c \uae30\uae30 \ubcc0\uacbd\uc744 \ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4\u00b7\ub3c4\ub09c \uc2e0\uace0\ub41c \ud734\ub300\ud3f0\uc740 \uad6d\ub0b4 \ud1b5\uc2e0\uc0ac\uc5d0\uc11c \uac1c\ud1b5\uc774 \ucc28\ub2e8\ub418\uc5b4 \uae30\uae30 \ubcc0\uacbd\uc5d0 \uc4f8 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ubcf8\uc778 \ud734\ub300\ud3f0\uc744 \ucc3e\uc558\ub2e4\uba74 \uae30\uae30 \ubcc0\uacbd \uc804\uc5d0 \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud574\uc81c\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "228", "t": "\uc0c1\ub2f4\uc6d0 \uc6b4\uc601\uc2dc\uac04\uc774 \uc544\ub2cc\ub370 \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc0c1\ub2f4\uc6d0 \uc6b4\uc601\uc2dc\uac04\uc774 \uc544\ub2c8\uc5b4\ub3c4 \uace0\uac1d\uc13c\ud130 \uc790\ub3d9\uc751\ub2f5\uc73c\ub85c 24\uc2dc\uac04 \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubd84\uc2e4 \uc2e0\uace0\ub97c \uc704\ud574 \ud734\ub300\ud3f0\uc5d0\uc11c\ub294 114, \uc77c\ubc18\uc804\ud654\uc5d0\uc11c\ub294 1500-0000\uc73c\ub85c \uc5f0\ub77d\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "238", "t": "\ubc95\uc778 \uba85\uc758 \ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ubc95\uc778 \uba85\uc758 \ud734\ub300\ud3f0\uc744 \ubd84\uc2e4\ud588\ub2e4\uba74 \ubc95\uc778 \uc11c\ub958\uc640 \ub2f4\ub2f9\uc790 \uc2e0\ubd84\uc99d\uc744 \uc900\ube44\ud574 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud558\uac70\ub098 \uace0\uac1d\uc13c\ud130\ub85c \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\ubc95\uc778 \uba85\uc758 \ud734\ub300\ud3f0\uc744 \uae09\ud788 \uc815\uc9c0\ud574\uc57c \ud55c\ub2e4\uba74 \uace0\uac1d\uc13c\ud130 \uc790\ub3d9\uc751\ub2f5\uc73c\ub85c \uba3c\uc800 \uc815\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "52", "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4 \uc2e0\uace0\ub294 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4 \uc2e0\uace0\ub294 \uc571, \ud648\ud398\uc774\uc9c0 \ub610\ub294 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "53", "t": "\ubd84\uc2e4\ud55c \ud734\ub300\ud3f0 \uc704\uce58\ub97c \ucc3e\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4\ud55c \ud734\ub300\ud3f0\uc758 \uc704\uce58 \ucc3e\uae30 \uae30\ub2a5\uc774 \ud65c\uc131\ud654\ub3fc \uc788\ub2e4\uba74 \uc81c\uc870\uc0ac \uc11c\ube44\uc2a4\ub97c \uc774\uc6a9\ud574 \uc704\uce58\ub97c \ucc3e\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0520", "q": "\uc694\uae08\uc81c\ub97c \ubc14\uafb8\ub824\ub294\ub370 \uc81c \uc0ac\uc6a9\ub7c9\uc73c\ub85c \uc5b4\ub5a4 \uac8c \ub9de\ub294\uc9c0 \uc815\ud655\ud788 \uacc4\uc0b0\ud574\uc11c \ucd94\ucc9c\ud574 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "104", "t": "\ub0b4 \uc0ac\uc6a9 \ud328\ud134\uc5d0 \ub9de\ub294 \uc694\uae08\uc81c\ub97c \ucd94\ucc9c\ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc0ac\uc6a9 \ud328\ud134\uc5d0 \ub9de\ub294 \uc694\uae08\uc81c\ub97c \ucd94\ucc9c\ubc1b\uc73c\ub824\uba74 \uc571\uc5d0\uc11c \ucd5c\uadfc \uc0ac\uc6a9\ub7c9\uc744 \ud655\uc778\ud55c \ub4a4 AI \ucc57\ubd07\uc5d0 \ubb38\uc758\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1532", "t": "\uc81c \uc0ac\uc6a9\ub7c9\uc5d0 \ub9de\ub294 \uc694\uae08\uc81c\ub97c \ucd94\ucc9c\ud574 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc758 \ucd5c\uadfc \ub370\uc774\ud130\u00b7\ud1b5\ud654 \uc0ac\uc6a9\ub7c9\uacfc \ud604\uc7ac \uc694\uae08\uc81c\ub97c \uc870\ud68c\ud574, \uc0ac\uc6a9\ub7c9\uc5d0 \ub9de\ub294 Ubot \uc694\uae08\uc81c\ub97c \ube44\uad50\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "760", "t": "\uc81c \ucd5c\uadfc \uc0ac\uc6a9\ub7c9\uc73c\ub85c \ubcf4\uba74 \uc5b4\ub5a4 \uc694\uae08\uc81c\uac00 \ub9de\uc544\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ucd5c\uadfc \ub370\uc774\ud130\uc640 \ud1b5\ud654 \uc0ac\uc6a9 \ub0b4\uc5ed\uc744 \uc870\ud68c\ud574 \uc0ac\uc6a9 \ud328\ud134\uc5d0 \ub9de\ub294 \uc694\uae08\uc81c\ub97c \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0523", "q": "\uba85\uc758\ubcc0\uacbd\uc744 \ud558\uace0 \uc2f6\uc740\ub370 \uc0c1\ub300\ubc29\uc774 \ud574\uc678\uc5d0 \uc788\uc5b4\uc11c \uc624\uc9c0 \ubabb\ud569\ub2c8\ub2e4. \uac00\ub2a5\ud55c \ubc29\ubc95\uc774 \uc788\uc744\uae4c\uc694", "g": "BORDER", "f": [{"id": "1093", "t": "\uba85\uc758 \ubcc0\uacbd\uc740 \uc544\ubb34\uc5d0\uac8c\ub098 \ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc815\ubd80\uc758 \ubc88\ud638 \ub9e4\ub9e4 \ubc29\uc9c0 \uc815\ucc45\uc5d0 \ub530\ub77c \ud734\ub300\ud3f0 \ud68c\uc120 \uba85\uc758 \ubcc0\uacbd\uc740 \uac00\uc871 \uac04 \ub4f1 \uc77c\ubd80 \uacbd\uc6b0\uc5d0\ub9cc \ud5c8\uc6a9\ub429\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uac00\uc871 \uac04 \uba85\uc758 \ubcc0\uacbd\uc740 \uac00\uc871\uad00\uacc4\uc99d\uba85\uc11c\ub85c \uad00\uacc4\ub97c \ud655\uc778\ud55c \ub4a4 \uc9c4\ud589\ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "1094", "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \ud558\ub824\uba74 \ubb34\uc5c7\uc774 \ud544\uc694\ud55c\uac00\uc694?", "s": [{"i": 0, "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \ud558\ub824\uba74 \uae30\uc874 \uba85\uc758\uc790\uc640 \uc0c8 \uba85\uc758\uc790\uac00 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ud568\uaed8 \ub9e4\uc7a5\uc5d0 \ubc29\ubb38\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uac00\uc871 \uac04 \uba85\uc758 \ubcc0\uacbd\uc5d0\ub294 \ubc1c\uae09 3\uac1c\uc6d4 \uc774\ub0b4\uc758 \uac00\uc871\uad00\uacc4\uc99d\uba85\uc11c\ub3c4 \uc900\ube44\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 2, "t": "\uba85\uc758 \ubcc0\uacbd\uc5d0 \ud55c \uc0ac\ub78c\ub9cc \ubc29\ubb38\ud55c\ub2e4\uba74 \uc624\uc9c0 \uc54a\ub294 \uc0ac\ub78c\uc758 \uc778\uac10\uc99d\uba85\uc11c\uc640 \uc704\uc784\uc7a5\uc774 \ucd94\uac00\ub85c \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "143", "t": "\uba85\uc758\uc790 \ub300\uc2e0 \uac00\uc871\uc774 \ub9e4\uc7a5\uc5d0\uc11c \ubc88\ud638\uc774\ub3d9\uc744 \uc2e0\uccad\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uba85\uc758\uc790 \ub300\uc2e0 \uac00\uc871 \ub4f1 \ub300\ub9ac\uc778\uc774 \ub9e4\uc7a5\uc5d0\uc11c \ubc88\ud638\uc774\ub3d9\uc744 \uc2e0\uccad\ud558\ub824\uba74 \uba85\uc758\uc790 \uc2e0\ubd84\uc99d, \ub300\ub9ac\uc778 \uc2e0\ubd84\uc99d, \uc704\uc784\uc7a5, \ubc1c\uae09 3\uac1c\uc6d4 \uc774\ub0b4\uc758 \uba85\uc758\uc790 \uc778\uac10\uc99d\uba85\uc11c\ub97c \uc900\ube44\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "81", "t": "\uba85\uc758 \ubcc0\uacbd\uc774 \uac00\ub2a5\ud55c\uac00\uc694?", "s": [{"i": 0, "t": "\ud5c8\uc6a9\ub418\ub294 \uc870\uac74\uc5d0\uc11c \ubcf8\uc778 \ud655\uc778 \ubc0f \ud544\uc694\ud55c \uc11c\ub958\ub97c \uc81c\ucd9c\ud558\uba74 \uba85\uc758 \ubcc0\uacbd\uc744 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0527", "q": "\ud574\uc678 \uc720\ud559\uc744 \uac00\ub294\ub370 \ud55c\uad6d \ubc88\ud638\ub97c \uc720\uc9c0\ud558\uba74\uc11c \ud604\uc9c0 \uc694\uae08\uc81c\ub3c4 \uc4f0\uace0 \uc2f6\uc2b5\ub2c8\ub2e4", "g": "BORDER", "f": [{"id": "1025", "t": "\uba87 \ub2ec \ub3d9\uc548 \ud574\uc678\uc5d0 \uba38\ubb3c \ub54c \ud68c\uc120\uc740 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uba87 \ub2ec \ub3d9\uc548 \ud574\uc678\uc5d0 \uba38\ubb34\ub978\ub2e4\uba74 \ud734\ub300\ud3f0 \ud68c\uc120\uc744 \uc77c\uc2dc \uc815\uc9c0\ud558\uac70\ub098 \uc694\uae08\uc81c\ub97c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc7a5\uae30 \ud574\uc678 \uccb4\ub958\uc5d0 \uc5b4\ub5a4 \ud68c\uc120 \uc720\uc9c0 \ubc29\ubc95\uc774 \uc720\ub9ac\ud55c\uc9c0\ub294 \uccb4\ub958 \uae30\uac04\uacfc \uc774\uc6a9 \uacc4\ud68d\uc5d0 \ub530\ub77c \ub2ec\ub77c \ucd9c\uad6d \uc804\uc5d0 \uc0c1\ub2f4\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1319", "t": "\ud574\uc678\uc5d0\uc11c \ud604\uc9c0 \uc720\uc2ec\uc744 \uc368\ub3c4 \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc5d0 \ud1b5\uc2e0\uc0ac \uc7a0\uae08(\ucee8\ud2b8\ub9ac \ub77d)\uc774 \uc5c6\ub2e4\uba74 \ud574\uc678\uc5d0\uc11c \ud604\uc9c0 \uc720\uc2ec\uc744 \ub07c\uc6cc \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud604\uc9c0 \uc720\uc2ec\uc73c\ub85c \ubc14\uafbc \ub3d9\uc548\uc5d0\ub294 Ubot \ubc88\ud638\ub85c \uc624\ub294 \uc804\ud654\uc640 \ubb38\uc790\ub97c \ubc1b\uc744 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4. eSIM\uc744 \uc9c0\uc6d0\ud558\ub294 \ud734\ub300\ud3f0\uc774\ub77c\uba74 Ubot \ubc88\ud638\ub97c eSIM\uc73c\ub85c \ub450\uace0 \ud604\uc9c0 \uc720\uc2ec\uc744 \ud568\uaed8 \uc4f8 \uc218\ub3c4 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1320", "t": "\uc7a5\uae30\uac04 \ud574\uc678\uc5d0 \uba38\ubb34\ub294\ub370 \ubc88\ud638\ub97c \uc720\uc9c0\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0 \uc7a5\uae30\uac04 \uba38\ubb34\ub97c \ub54c \uc77c\uc2dc\uc815\uc9c0\ub97c \uc2e0\uccad\ud558\uba74 \uc6d4 3,850\uc6d0\uc73c\ub85c \ubc88\ud638\ub97c \uc720\uc9c0\ud560 \uc218 \uc788\uc73c\uba70 \uc5f0 2\ud68c, \ud55c \ubc88\uc5d0 \ucd5c\ub300 90\uc77c\uae4c\uc9c0 \uac00\ub2a5\ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uad70 \ubcf5\ubb34\ub098 \uc720\ud559 \ub4f1\uc73c\ub85c \ub354 \uc624\ub798 \ud68c\uc120\uc744 \uc815\uc9c0\ud574\uc57c \ud55c\ub2e4\uba74 \ucd9c\uad6d \uc0ac\uc2e4\uc744 \uc99d\uba85\ud558\ub294 \uc11c\ub958\ub85c \uc7a5\uae30 \uc77c\uc2dc\uc815\uc9c0\ub97c \uc2e0\uccad\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1613", "t": "\ud574\uc678\uc5d0\uc11c \ud604\uc9c0 \uc720\uc2ec\uc744 \uc0ac\uc6a9\ud558\ub294 \ub3d9\uc548 \uad6d\ub0b4 \ubc88\ud638\ub85c \uc624\ub294 \ubb38\uc790\ub97c \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \ud604\uc9c0 \uc720\uc2ec\uc744 \uc4f0\ub294 \ub3d9\uc548 \uad6d\ub0b4 \ubc88\ud638\ub85c \ubb38\uc790\ub97c \ubc1b\uc73c\ub824\uba74 \uad6d\ub0b4 \ud68c\uc120\uc774 \ud734\ub300\ud3f0\uc5d0\uc11c \uacc4\uc18d \ud65c\uc131\ud654\ub418\uc5b4 \uc788\ub294\uc9c0\uc640 \uae30\uae30\uc758 \ub4c0\uc5bc\uc2ec \uc9c0\uc6d0 \uc5ec\ubd80\ub97c \uba3c\uc800 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uad6d\ub0b4 \uc720\uc2ec\uc744 \ube7c\uac70\ub098 \uad6d\ub0b4 \ud68c\uc120\uc744 \uaebc \ub450\uba74 \uadf8 \ud68c\uc120\uc73c\ub85c \uc624\ub294 \ubb38\uc790\ub97c \ubc14\ub85c \ubc1b\uae30 \uc5b4\ub824\uc6b8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\uad6d\ub0b4 \ubc88\ud638 \ubb38\uc790 \uc218\uc2e0 \uac00\ub2a5 \uc5ec\ubd80\uc640 \ub85c\ubc0d \uc694\uae08\uc740 \ud68c\uc120 \uc124\uc815\uacfc \uc0c1\ud488 \uc870\uac74\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}]}, {"id": "Q0528", "q": "\uc694\uae08 \uc815\ub9ac\ud558\uace0 \uc2f6\uc740\ub370 \uc5b4\ub514\ubd80\ud130 \uc904\uc774\uba74 \uc88b\uc744\uae4c\uc694", "g": "BORDER", "f": [{"id": "1532", "t": "\uc81c \uc0ac\uc6a9\ub7c9\uc5d0 \ub9de\ub294 \uc694\uae08\uc81c\ub97c \ucd94\ucc9c\ud574 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc758 \ucd5c\uadfc \ub370\uc774\ud130\u00b7\ud1b5\ud654 \uc0ac\uc6a9\ub7c9\uacfc \ud604\uc7ac \uc694\uae08\uc81c\ub97c \uc870\ud68c\ud574, \uc0ac\uc6a9\ub7c9\uc5d0 \ub9de\ub294 Ubot \uc694\uae08\uc81c\ub97c \ube44\uad50\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0529", "q": "\ud3f0\uc744 \ubc14\uafb8\uace0 \uc2f6\uc740\ub370 \uc5b4\ub5a4 \ud3f0\uc774 \uc88b\uc744\uc9c0\ub3c4 \uac19\uc774 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1262", "t": "\uc4f0\ub358 \uc720\uc2ec\uc744 \uc0c8 \ud734\ub300\ud3f0\uc5d0 \uadf8\ub300\ub85c \uc368\ub3c4 \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\uc0c8 \ud734\ub300\ud3f0\uc774 \uac19\uc740 \ud06c\uae30\uc758 \uc720\uc2ec\uc744 \uc4f0\uace0 Ubot \ud1b5\uc2e0\ub9dd\uc744 \uc9c0\uc6d0\ud558\uba74 \uae30\uc874 \uc720\uc2ec\uc744 \uc62e\uaca8 \ub07c\uc6cc \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uae30\uc874 \uc720\uc2ec\uc744 \uc0c8 \ud734\ub300\ud3f0\uc73c\ub85c \uc62e\uaca8\ub3c4 \uc694\uae08\uc81c\uc640 \ubd80\uac00\uc11c\ube44\uc2a4\ub294 \uadf8\ub300\ub85c \uc720\uc9c0\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "321", "t": "\uae30\uae30\ubcc0\uacbd\uc740 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uae30\uae30\ubcc0\uacbd\uc740 \uc571\uc5d0\uc11c \uc2e0\uccad\ud558\uac70\ub098 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud574 \uc9c4\ud589\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uae30\uae30\ubcc0\uacbd\uc744 \ud574\ub3c4 \uae30\uc874 \uc694\uae08\uc81c\ub97c \uadf8\ub300\ub85c \uc720\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "325", "t": "\uc4f0\ub358 \ud3f0\uc744 \ubc18\ub0a9\ud558\uba74\uc11c \uc0c8 \ud3f0\uc744 \uc0b4 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub9e4\uc7a5\uc5d0\uc11c \uc4f0\ub358 \ud734\ub300\ud3f0 \ubc18\ub0a9\uacfc \uc0c8 \ud734\ub300\ud3f0 \uad6c\ub9e4\ub97c \ud568\uaed8 \uc9c4\ud589\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc4f0\ub358 \ud734\ub300\ud3f0\uc758 \ubc18\ub0a9\uc740 \ud560\ubd80 24\uac1c\uc6d4 \uc774\ud6c4\uc5d0 \uac00\ub2a5\ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "8", "t": "\ud1b5\uc2e0\uc0ac\ub294 \uadf8\ub300\ub85c \ub450\uace0 \ud734\ub300\ud3f0\ub9cc \ubc14\uafc0 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uae30\uae30 \ubcc0\uacbd\uc744 \ud558\uba74 \uae30\uc874 \ud1b5\uc2e0\uc0ac\ub97c \uc720\uc9c0\ud558\uba74\uc11c \ud734\ub300\ud3f0\ub9cc \ubc14\uafc0 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "95", "t": "\ud734\ub300\ud3f0\uc744 \uc911\uace0 \uae30\uae30\ub85c \ubcc0\uacbd\ud574\ub3c4 \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\uc911\uace0 \ud734\ub300\ud3f0\uc774 \uc815\uc0c1 \uc0ac\uc6a9 \uac00\ub2a5\ud55c \ub2e8\ub9d0\uae30\ub77c\uba74 \uae30\uc874 \uc720\uc2ec\uc744 \uc7a5\ucc29\ud558\uac70\ub098 \uae30\uae30 \ubcc0\uacbd \uc808\ucc28\ub97c \uac70\uccd0 \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0531", "q": "\uc778\ud130\ub137\uc774 \uc548 \ub418\ub294\ub370 \uacf5\uc720\uae30 \ubb38\uc81c\uc778\uc9c0 \ud68c\uc120 \ubb38\uc81c\uc778\uc9c0 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1005", "t": "\uc640\uc774\ud30c\uc774\ub294 \uc5f0\uacb0\ub410\ub294\ub370 \uc778\ud130\ub137\uc744 \uc0ac\uc6a9\ud560 \uc218 \uc5c6\uc73c\uba74 \ubb34\uc5c7\uc744 \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc640\uc774\ud30c\uc774\uc5d0 \uc5f0\uacb0\ub410\ub294\ub370 \uc778\ud130\ub137\uc774 \ub418\uc9c0 \uc54a\uc73c\uba74 \uac19\uc740 \uc640\uc774\ud30c\uc774\ub97c \uc4f0\ub294 \ub2e4\ub978 \uae30\uae30\uc5d0\uc11c\ub3c4 \ubb38\uc81c\uac00 \ub098\ub294\uc9c0 \ud655\uc778\ud558\uace0 \uacf5\uc720\uae30\uc640 \ud734\ub300\ud3f0\uc744 \ub2e4\uc2dc \uc2dc\uc791\ud574 \ubcf4\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uac19\uc740 \uc640\uc774\ud30c\uc774\uc5d0\uc11c \ubaa8\ub4e0 \uae30\uae30\uc758 \uc778\ud130\ub137\uc774 \uc548 \ub418\uba74 \ud68c\uc120 \uc7a5\uc560\ub97c \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 2, "t": "\uac19\uc740 \uc640\uc774\ud30c\uc774\uc5d0\uc11c \ud55c \uae30\uae30\ub9cc \uc778\ud130\ub137\uc774 \uc548 \ub418\uba74 \uadf8 \uae30\uae30\uc758 \ub124\ud2b8\uc6cc\ud06c \uc124\uc815\uc744 \uc810\uac80\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "1196", "t": "\ubaa8\ubc14\uc77c \ub370\uc774\ud130\uac00 \uc5f0\uacb0\ub418\uc9c0 \uc54a\uc544\uc694.", "s": [{"i": 0, "t": "\ubaa8\ubc14\uc77c \ub370\uc774\ud130\uac00 \uc5f0\uacb0\ub418\uc9c0 \uc54a\uc73c\uba74 \ud734\ub300\ud3f0 \uc124\uc815\uc5d0\uc11c \ub370\uc774\ud130\uac00 \ucf1c\uc838 \uc788\ub294\uc9c0\uc640 \ube44\ud589\uae30 \ubaa8\ub4dc\uac00 \uaebc\uc838 \uc788\ub294\uc9c0 \ud655\uc778\ud55c \ub4a4 \ud734\ub300\ud3f0\uc744 \uc7ac\ubd80\ud305\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\ud734\ub300\ud3f0\uc744 \uc7ac\ubd80\ud305\ud574\ub3c4 \ubaa8\ubc14\uc77c \ub370\uc774\ud130\uac00 \uc5f0\uacb0\ub418\uc9c0 \uc54a\uc73c\uba74 \uc571\uc5d0\uc11c \ub0a8\uc740 \ub370\uc774\ud130\uc640 \ub370\uc774\ud130 \ucc28\ub2e8 \ubd80\uac00\uc11c\ube44\uc2a4 \uac00\uc785 \uc5ec\ubd80\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 2, "t": "\ubaa8\ubc14\uc77c \ub370\uc774\ud130 \uc5f0\uacb0 \ubb38\uc81c\uac00 \uacc4\uc18d\ub418\uba74 \uace0\uac1d\uc13c\ud130(114)\ub85c \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1197", "t": "\uc804\ud654\uc640 \ubb38\uc790\ub294 \ub418\ub294\ub370 \ub370\uc774\ud130\ub9cc \uc548 \ub3fc\uc694.", "s": [{"i": 0, "t": "\uc804\ud654\uc640 \ubb38\uc790\ub294 \ub418\ub294\ub370 \ubaa8\ubc14\uc77c \ub370\uc774\ud130\ub9cc \uc5f0\uacb0\ub418\uc9c0 \uc54a\uc73c\uba74 \ud734\ub300\ud3f0\uc758 APN(\uc561\uc138\uc2a4 \ud3ec\uc778\ud2b8 \uc774\ub984) \uc124\uc815\uc774 \uc9c0\uc6cc\uc84c\uac70\ub098 \uc798\ubabb\ub410\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ubaa8\ubc14\uc77c \ub370\uc774\ud130\ub9cc \uc548 \ub420 \ub54c\ub294 \uc124\uc815 > \ubaa8\ubc14\uc77c \ub124\ud2b8\uc6cc\ud06c > APN\uc5d0\uc11c \uae30\ubcf8\uac12\uc73c\ub85c \uc7ac\uc124\uc815\ud558\uace0 \ud734\ub300\ud3f0\uc744 \ub2e4\uc2dc \ucf1c \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1616", "t": "\ubaa8\ubc14\uc77c \ub370\uc774\ud130\uac00 \ucf1c\uc9c0\uc9c0 \uc54a\uc744 \ub54c \ud68c\uc120 \uc0c1\ud0dc\ub294 \uc5b4\ub5bb\uac8c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ubaa8\ubc14\uc77c \ub370\uc774\ud130\uac00 \ucf1c\uc9c0\uc9c0 \uc54a\uc73c\uba74 \ud734\ub300\ud3f0\uc758 \ubaa8\ubc14\uc77c \ub370\uc774\ud130 \uc124\uc815\uacfc \uc2e0\ud638 \ud45c\uc2dc, \ube44\ud589\uae30 \ubaa8\ub4dc, \uc0ac\uc6a9 \uc911\uc778 \ub370\uc774\ud130 \ud68c\uc120\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\ubaa8\ubc14\uc77c \ub370\uc774\ud130\uac00 \uc5f0\uacb0\ub418\uc9c0 \uc54a\uc744 \ub54c\ub294 \uc571\uc758 \uac00\uc785\u00b7\uc774\uc6a9 \uc0c1\ud0dc\uc5d0\uc11c \ud68c\uc120 \uc815\uc9c0\ub098 \ub370\uc774\ud130 \ucc28\ub2e8 \uc124\uc815\uc744 \ud655\uc778\ud558\uace0, \uc6d0\uc778\uc744 \ucc3e\uc9c0 \ubabb\ud558\uba74 \uace0\uac1d\uc13c\ud130\uc5d0 \ud68c\uc120 \uc0c1\ud0dc \uc810\uac80\uc744 \uc694\uccad\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "17", "t": "\ubaa8\ubc14\uc77c \ub370\uc774\ud130\uac00 \uac11\uc790\uae30 \uc548 \ub429\ub2c8\ub2e4.", "s": [{"i": 0, "t": "\ubaa8\ubc14\uc77c \ub370\uc774\ud130\uac00 \uac11\uc790\uae30 \uc791\ub3d9\ud558\uc9c0 \uc54a\uc73c\uba74 \ub370\uc774\ud130 \uc124\uc815, \ube44\ud589\uae30 \ubaa8\ub4dc, \ub370\uc774\ud130 \uc794\uc5ec\ub7c9 \ubc0f \ub124\ud2b8\uc6cc\ud06c \uc0c1\ud0dc\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "83", "t": "\ud1b5\uc2e0 \uc11c\ube44\uc2a4 \uc7a5\uc560\uac00 \ubc1c\uc0dd\ud588\ub294\uc9c0 \ud655\uc778\ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud1b5\uc2e0 \uc11c\ube44\uc2a4 \uc7a5\uc560 \uc5ec\ubd80\ub294 \ud1b5\uc2e0\uc0ac \ud648\ud398\uc774\uc9c0\ub098 \uace0\uac1d\uc13c\ud130\uc758 \uc7a5\uc560\u00b7\uc810\uac80 \uc548\ub0b4\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0532", "q": "\ud574\uc678\uc5d0\uc11c \ud55c\uad6d \uc740\ud589 \uc778\uc99d\uc744 \ubc1b\uc73c\ub824\uba74 \uc5b4\ub5bb\uac8c \ud574\uc57c \ud558\ub098\uc694", "g": "BORDER", "f": [{"id": "1304", "t": "\ud574\uc678\uc5d0\uc11c \ud55c\uad6d\uc73c\ub85c \uc804\ud654\ub97c \uac78\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \ud55c\uad6d\uc73c\ub85c \uc804\ud654\ud558\ub824\uba74 +82\ub97c \ub204\ub978 \ub4a4 \uc0c1\ub300\ubc29 \uc804\ud654\ubc88\ud638\uc5d0\uc11c \ub9e8 \uc55e 0\uc744 \ube7c\uace0 \uc785\ub825\ud558\uba74 \ub429\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc608\ub97c \ub4e4\uc5b4 \ud574\uc678\uc5d0\uc11c 010-1234-5678\ub85c \uc804\ud654\ud560 \ub54c\ub294 +82 10-1234-5678\ub85c \uac78\uba70 \uad6d\uac00\ubcc4 \ubd84\ub2f9 \ub85c\ubc0d \ud1b5\ud654 \uc694\uae08\uc774 \ubd80\uacfc\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "1310", "t": "\ud574\uc678\uc5d0\uc11c\ub3c4 \uc778\uc99d \ubb38\uc790\ub97c \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678 \ub85c\ubc0d \uc911\uc5d0\ub3c4 \uc740\ud589\u00b7\uc1fc\ud551\ubab0\uc758 \uc778\uc99d \ubb38\uc790\ub97c \ubc1b\uc744 \uc218 \uc788\uace0 \ubb38\uc790 \uc218\uc2e0\uc740 \ubb34\ub8cc\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub370\uc774\ud130 \ub85c\ubc0d\uc744 \ucc28\ub2e8\ud574\ub3c4 \ud574\uc678 \uc778\uc99d \ubb38\uc790\ub294 \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1613", "t": "\ud574\uc678\uc5d0\uc11c \ud604\uc9c0 \uc720\uc2ec\uc744 \uc0ac\uc6a9\ud558\ub294 \ub3d9\uc548 \uad6d\ub0b4 \ubc88\ud638\ub85c \uc624\ub294 \ubb38\uc790\ub97c \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \ud604\uc9c0 \uc720\uc2ec\uc744 \uc4f0\ub294 \ub3d9\uc548 \uad6d\ub0b4 \ubc88\ud638\ub85c \ubb38\uc790\ub97c \ubc1b\uc73c\ub824\uba74 \uad6d\ub0b4 \ud68c\uc120\uc774 \ud734\ub300\ud3f0\uc5d0\uc11c \uacc4\uc18d \ud65c\uc131\ud654\ub418\uc5b4 \uc788\ub294\uc9c0\uc640 \uae30\uae30\uc758 \ub4c0\uc5bc\uc2ec \uc9c0\uc6d0 \uc5ec\ubd80\ub97c \uba3c\uc800 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uad6d\ub0b4 \uc720\uc2ec\uc744 \ube7c\uac70\ub098 \uad6d\ub0b4 \ud68c\uc120\uc744 \uaebc \ub450\uba74 \uadf8 \ud68c\uc120\uc73c\ub85c \uc624\ub294 \ubb38\uc790\ub97c \ubc14\ub85c \ubc1b\uae30 \uc5b4\ub824\uc6b8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\uad6d\ub0b4 \ubc88\ud638 \ubb38\uc790 \uc218\uc2e0 \uac00\ub2a5 \uc5ec\ubd80\uc640 \ub85c\ubc0d \uc694\uae08\uc740 \ud68c\uc120 \uc124\uc815\uacfc \uc0c1\ud488 \uc870\uac74\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "36", "t": "\ud574\uc678\uc5d0\uc11c \ud55c\uad6d\uc73c\ub85c \uc804\ud654\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \ud55c\uad6d\uc73c\ub85c \uc804\ud654\ud558\ub824\uba74 \uad6d\uac00\ubc88\ud638\uc640 \uc0c1\ub300\ubc29 \uc804\ud654\ubc88\ud638\ub97c \uc785\ub825\ud574 \uad6d\uc81c\uc804\ud654\ub97c \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0534", "q": "\ud734\ub300\ud3f0 \uacb0\uc81c \ub0b4\uc5ed\uc744 \ud655\uc778\ud558\uace0 \ud658\ubd88\ub3c4 \ubc1b\uace0 \uc2f6\uc5b4\uc694", "g": "BORDER", "f": [{"id": "1189", "t": "\ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \ucde8\uc18c\ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \ucde8\uc18c\ud558\ub824\uba74 \uacb0\uc81c\ud55c \uc1fc\ud551\ubab0\u00b7\uc571 \ub4f1 \uac00\ub9f9\uc810\uc5d0 \uc694\uccad\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \uacb0\uc81c\ud55c \ub2ec \uc548\uc5d0 \ucde8\uc18c\ud558\uba74 \uccad\uad6c\ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \ub2e4\uc74c \ub2ec\uc5d0 \ucde8\uc18c\ud558\uba74 \ud658\ubd88\uc740 \uac00\ub9f9\uc810\uc774 \uc9c1\uc811 \ucc98\ub9ac\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "1190", "t": "\ud734\ub300\ud3f0 \uacb0\uc81c \ub0b4\uc5ed\uc740 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uacb0\uc81c \ub0b4\uc5ed\uc740 Ubot \uc571\uc758 \uc694\uae08 \uc870\ud68c > \ud734\ub300\ud3f0 \uacb0\uc81c \ub0b4\uc5ed\uc5d0\uc11c \uac00\ub9f9\uc810\uacfc \uae08\uc561\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uad6c\uae00 \ud50c\ub808\uc774 \ub4f1 \uc571 \ub9c8\ucf13\uc758 \ud734\ub300\ud3f0 \uacb0\uc81c\ub294 \uc571\uc5d0\uc11c \uae08\uc561\ub9cc \ubcf4\uc774\uba70 \uc0c1\uc138 \ub0b4\uc5ed\uc740 \ud574\ub2f9 \ub9c8\ucf13\uc5d0\uc11c \ud655\uc778\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "259", "t": "\ud658\ubd88\uc744 \uc694\uccad\ud558\uba74 \uc5b8\uc81c \ubc1b\ub098\uc694?", "s": [{"i": 0, "t": "\uacc4\uc88c \ud658\ubd88\uc744 \uc694\uccad\ud558\uba74 \ucc98\ub9ac \uacb0\uacfc\ub97c \ubb38\uc790\ub85c \uc548\ub0b4\ud558\uace0 \ud658\ubd88 \ub300\uc0c1 \uae08\uc561\uc740 \ub4f1\ub85d\ub41c \ud658\ubd88 \uacc4\uc88c\ub85c 7\uc601\uc5c5\uc77c \uc548\uc5d0 \ub3cc\ub824\ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud658\ubd88\uc744 \ubcc4\ub3c4\ub85c \uc694\uccad\ud558\uc9c0 \uc54a\uc73c\uba74 \ud658\ubd88 \ub300\uc0c1 \uae08\uc561\uc740 \ub2e4\uc74c \ub2ec \uc694\uae08\uc5d0\uc11c \ucc28\uac10\ub420 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0537", "q": "\uc790\ub3d9\uc73c\ub85c \ubd80\uac00\uc11c\ube44\uc2a4\uac00 \uac00\uc785 \uc548 \ub41c\ub2e4\uace0 \ud588\ub294\ub370 \uc9c0\uae08 \uc81c \ubaa9\ub85d\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1073", "t": "\uac00\uc785\ud55c \uc801 \uc5c6\ub294 \uc720\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\uac00 \uc788\uc5b4\uc694.", "s": [{"i": 0, "t": "\uac00\uc785\ud55c \uc801 \uc5c6\ub294 \uc720\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\uac00 \uc788\ub2e4\uba74 Ubot \uc571\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uba54\ub274\uc5d0\uc11c \uac00\uc785 \uc77c\uc2dc\uc640 \uacbd\ub85c\ub97c \ud655\uc778\ud558\uace0 \ubc14\ub85c \ud574\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub3d9\uc758 \uc5c6\uc774 \uac00\uc785\ub41c \uc720\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\ub85c \ud655\uc778\ub418\uba74 \uace0\uac1d\uc13c\ud130(114)\uc5d0\uc11c \uac00\uc785\uc77c\ubd80\ud130\uc758 \uc694\uae08\uc744 \ub3cc\ub824 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}]}, {"id": "1327", "t": "\uac00\uc785\ub41c \ubd80\uac00\uc11c\ube44\uc2a4\ub294 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uba54\ub274\uc5d0\uc11c \uac00\uc785\ub41c \ubb34\ub8cc\u00b7\uc720\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\uc640 \uc6d4 \uc694\uae08, \uac00\uc785\uc77c\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1544", "t": "\uc81c\uac00 \uac00\uc785\ud55c \ubd80\uac00\uc11c\ube44\uc2a4\ub97c \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc5d0 \uac00\uc785\ub41c \ubd80\uac00\uc11c\ube44\uc2a4\uc640 \uac01 \uc11c\ube44\uc2a4\uc758 \uc6d4 \uc694\uae08, \uac00\uc785\uc77c\uc744 \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "281", "t": "\uc5b4\ub5a4 \ud68c\uc120\uc5d0 \uc11c\ube44\uc2a4\uac00 \uac78\ub824 \uc788\ub294\uc9c0 \ubcf4\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc5b4\ub290 \ud68c\uc120\uc5d0 \ubd80\uac00\uc11c\ube44\uc2a4\uac00 \uac00\uc785\ub418\uc5b4 \uc788\ub294\uc9c0\ub294 \uc571\uc5d0\uc11c \ud68c\uc120\uc744 \uc120\ud0dd\ud574 \ud574\ub2f9 \ud68c\uc120\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \ubaa9\ub85d\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "682", "t": "\uc81c\uac00 \uac00\uc785\ud55c \ubd80\uac00\uc11c\ube44\uc2a4 \ubaa9\ub85d \uc880 \ubcf4\uc5ec \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud55c \ud68c\uc6d0\uc758 \ud68c\uc120 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \ud604\uc7ac \uac00\uc785 \uc911\uc778 \ubd80\uac00\uc11c\ube44\uc2a4 \ubaa9\ub85d\uacfc \uc6d4 \uc694\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "683", "t": "\uc800 \ubaa8\ub974\uac8c \ub3c8 \ub098\uac00\ub294 \uc720\ub8cc \uc11c\ube44\uc2a4\uac00 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0 \ud68c\uc120\uc5d0 \uac00\uc785\ub41c \ubd80\uac00\uc11c\ube44\uc2a4\ub97c \uc870\ud68c\ud574 \uc720\ub8cc \uc11c\ube44\uc2a4\uc640 \uae08\uc561\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud544\uc694 \uc5c6\ub294 \uc720\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\ub294 \uc571\uc5d0\uc11c \ubc14\ub85c \ud574\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "789", "t": "\uccad\uad6c\uc11c\uc5d0 \ubaa8\ub974\ub294 \uc11c\ube44\uc2a4 \uc774\ub984\uc774 \uc788\ub294\ub370 \uc81c\uac00 \uc5b8\uc81c \uac00\uc785\ud55c \uac74\uac00\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uac00\uc785 \uc774\ub825\uc744 \uc870\ud68c\ud574 \uccad\uad6c\uc11c\uc5d0\uc11c \ubaa8\ub974\ub294 \uc11c\ube44\uc2a4\uc758 \uac00\uc785\uc77c\uacfc \uc6d4 \uc694\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "945", "t": "\uc81c\uac00 \uc4f0\uace0 \uc788\ub294 \ubd80\uac00\uc11c\ube44\uc2a4 \ubb50\ubb50 \uc788\uc5b4\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ud68c\uc120 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \uac00\uc785 \uc911\uc778 \ubd80\uac00\uc11c\ube44\uc2a4 \ubaa9\ub85d\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0541", "q": "\uc694\uae08\uc81c \ubcc0\uacbd \ubc29\ubc95\uc774\ub791 \uc774\ubc88 \ub2ec \uc81c \uc694\uae08 \ubcc0\ub3d9 \uc774\uc720\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1123", "t": "\uc694\uae08\uc81c\ub294 \uc5b4\ub514\uc5d0\uc11c \ubcc0\uacbd\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc694\uae08\uc81c\ub294 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0 \ub85c\uadf8\uc778\ud574 \uc694\uae08\uc81c \ubcc0\uacbd \uba54\ub274\uc5d0\uc11c \ubc14\uafb8\uac70\ub098 \uace0\uac1d\uc13c\ud130(114)\u00b7\ub9e4\uc7a5\uc5d0\uc11c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud0a4\uc988 \uc694\uae08\uc81c\ucc98\ub7fc \ubc95\uc815\ub300\ub9ac\uc778 \ub3d9\uc758\uac00 \ud544\uc694\ud55c \uc694\uae08\uc81c\ub294 \uace0\uac1d\uc13c\ud130\ub098 \ub9e4\uc7a5\uc5d0\uc11c\ub9cc \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "67", "t": "\uc694\uae08\uc81c\ub97c \ubcc0\uacbd\ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc694\uae08\uc81c\ub294 \uc571, \ud648\ud398\uc774\uc9c0, \uace0\uac1d\uc13c\ud130 \ub610\ub294 \ub9e4\uc7a5\uc5d0\uc11c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "748", "t": "\uc774\ubc88 \ub2ec \uc694\uae08\uc774 \uc9c0\ub09c\ub2ec\ubcf4\ub2e4 \uc65c \ub298\uc5c8\ub294\uc9c0 \ub0b4\uc5ed\uc73c\ub85c \ube44\uad50\ud574 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ucd5c\uadfc \ub450 \ub2ec \uccad\uad6c \ub0b4\uc5ed\uc744 \uc870\ud68c\ud574 \uc774\ubc88 \ub2ec \uc694\uae08\uc774 \uc9c0\ub09c\ub2ec\ubcf4\ub2e4 \ub298\uc5b4\ub09c \ud56d\ubaa9\uacfc \uae08\uc561\uc744 \ube44\uad50\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0542", "q": "\uc704\uc57d\uae08 \uacc4\uc0b0 \ubc29\ubc95\uc774\ub791 \uc81c \uacc4\uc57d \ud574\uc9c0 \uc2dc \uc704\uc57d\uae08\ub3c4 \uc815\ud655\ud788 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1426", "t": "\uc57d\uc815 \uae30\uac04\uacfc \ud560\uc778\ubc18\ud658\uae08\uc740 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\uc758 \uac00\uc785 \uc815\ubcf4\uc5d0\uc11c \uc57d\uc815 \uc2dc\uc791\uc77c\u00b7\uc885\ub8cc\uc77c, \uc9c0\uae08 \ud574\uc9c0\ud560 \ub54c\uc758 \ud560\uc778\ubc18\ud658\uae08, \ub0a8\uc740 \ud560\ubd80\uae08\uc744 \ud55c \ubc88\uc5d0 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1427", "t": "\uc57d\uc815 \uc911\uc5d0 \ud574\uc9c0\ud558\uba74 \uc704\uc57d\uae08\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc120\ud0dd\uc57d\uc815\uc774\ub098 \uacf5\uc2dc\uc9c0\uc6d0\uae08\uc744 \ubc1b\uace0 \uc57d\uc815 \uae30\uac04 \uc548\uc5d0 \ud68c\uc120\uc744 \ud574\uc9c0\ud558\uba74 \ubc1b\uc740 \ud560\uc778 \uae08\uc561 \uc911 \uc77c\ubd80\ub97c \ud560\uc778\ubc18\ud658\uae08\uc73c\ub85c \ub0b4\uc57c \ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc57d\uc815 \uae30\uac04\uc774 \ub9ce\uc774 \uc9c0\ub0a0\uc218\ub85d \ud574\uc9c0\ud560 \ub54c\uc758 \ud560\uc778\ubc18\ud658\uae08\uc740 \uc904\uc5b4\ub4ed\ub2c8\ub2e4.", "y": 1}]}, {"id": "219", "t": "\uacb0\ud569 \uc0c1\ud488\ub9cc \ud574\uc9c0\ud558\uba74 \uc704\uc57d\uae08\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uac00\uc871 \uacb0\ud569 \uc0c1\ud488\ub9cc \ud574\uc9c0\ud560 \ub54c \uacb0\ud569 \ud574\uc9c0\uc5d0 \ub530\ub978 \uc704\uc57d\uae08\uc740 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uac00\uc871 \uacb0\ud569 \ud560\uc778\uc744 \ud574\uc9c0\ud55c \ub2ec\uc758 \ub2e4\uc74c \ub2ec\ubd80\ud130 \ud560\uc778\uc774 \uc885\ub8cc\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "46", "t": "\uc57d\uc815 \uae30\uac04 \uc911 \ud574\uc9c0\ud558\uba74 \uc704\uc57d\uae08\uc774 \ubc1c\uc0dd\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc57d\uc815 \uae30\uac04 \uc911 \ud1b5\uc2e0 \uc11c\ube44\uc2a4\ub97c \ud574\uc9c0\ud558\uba74 \ud560\uc778\uc774\ub098 \uc9c0\uc6d0\uae08\uc744 \ubc1b\uc740 \uacbd\uc6b0 \uacc4\uc57d \uc870\uac74\uc5d0 \ub530\ub77c \uc704\uc57d\uae08\uc774 \ubc1c\uc0dd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "681", "t": "\uc81c\uac00 \uc9c0\uae08 \ud574\uc9c0\ud558\uba74 \ud560\uc778\ubc18\ud658\uae08\uc774 \uc5bc\ub9c8\ub098 \ub098\uc640\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uc57d\uc815 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \uc624\ub298 \ud574\uc9c0\ud560 \uacbd\uc6b0\uc758 \uc608\uc0c1 \ud560\uc778\ubc18\ud658\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud560\uc778\ubc18\ud658\uae08\uc758 \uc2e4\uc81c \uccad\uad6c\uc561\uc740 \ud68c\uc120\uc744 \ud574\uc9c0\ud558\ub294 \ub0a0\uc5d0 \ub530\ub77c \ub2ec\ub77c\uc9c8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "941", "t": "\uc624\ub298 \ud574\uc9c0 \uc2e0\uccad\ud558\uba74 \uc81c\uac00 \ubb3c\uc5b4\uc57c \ud560 \ud560\uc778\ubc18\ud658\uae08\uc774 \ub300\ub7b5 \uc5bc\ub9c8\uc608\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uc57d\uc815 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \uc624\ub298 \ud574\uc9c0\ud560 \uacbd\uc6b0 \uc608\uc0c1\ub418\ub294 \ud560\uc778\ubc18\ud658\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0543", "q": "\ub85c\ubc0d \ucc28\ub2e8 \ubc29\ubc95\uc774\ub791 \uc81c\uac00 \uc9c0\ub09c\ub2ec \uc4f4 \ub85c\ubc0d \uc694\uae08\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1308", "t": "\ud574\uc678\uc5d0\uc11c \ub370\uc774\ud130 \uc0ac\uc6a9\uc744 \uc644\uc804\ud788 \ub9c9\uc73c\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \ub370\uc774\ud130 \ub85c\ubc0d \ucc28\ub2e8\uc5d0 \ubb34\ub8cc\ub85c \uac00\uc785\ud558\uba74 \ud574\uc678 \ubaa8\ubc14\uc77c \ub370\uc774\ud130\uac00 \ucc28\ub2e8\ub418\uace0 \uad6d\ub0b4 \ub370\uc774\ud130\uc640 Wi-Fi\ub294 \uacc4\uc18d \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud574\uc678 \ub370\uc774\ud130 \ub85c\ubc0d\uc740 \ud734\ub300\ud3f0 \uc124\uc815\uc5d0\uc11c \ub04c \uc218\ub3c4 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1309", "t": "\ub370\uc774\ud130 \ub85c\ubc0d\uc744 \ucc28\ub2e8\ud574\ub3c4 \uc804\ud654\uc640 \ubb38\uc790\ub294 \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \ub370\uc774\ud130 \ub85c\ubc0d \ucc28\ub2e8\uc740 \ud574\uc678 \ub370\uc774\ud130\ub9cc \ub9c9\uc73c\ubbc0\ub85c \ud574\uc678\uc5d0\uc11c\ub3c4 \uc74c\uc131\ud1b5\ud654\uc640 \ubb38\uc790\ub294 \uacc4\uc18d \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud574\uc678\uc5d0\uc11c \ud1b5\ud654\ub3c4 \ub9c9\uace0 \uc2f6\ub2e4\uba74 \ud734\ub300\ud3f0\uc744 \ube44\ud589\uae30 \ubaa8\ub4dc\ub85c \ub450\uace0 Wi-Fi\ub9cc \ucf1c \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "31", "t": "\ud574\uc678\uc5d0\uc11c \ub370\uc774\ud130 \uc0ac\uc6a9\uc744 \ucc28\ub2e8\ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \ub370\uc774\ud130 \uc0ac\uc6a9\uc744 \ucc28\ub2e8\ud558\ub824\uba74 \ud734\ub300\ud3f0\uc758 \ub370\uc774\ud130 \ub85c\ubc0d\uc744 \ub044\uac70\ub098 \ub85c\ubc0d \ucc28\ub2e8 \uc11c\ube44\uc2a4\ub97c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "33", "t": "\ud574\uc678 \ub85c\ubc0d \uc694\uae08 \ud3ed\ud0c4\uc744 \ubc29\uc9c0\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678 \ub85c\ubc0d \uc694\uae08\uc774 \ub9ce\uc774 \ub098\uc624\uc9c0 \uc54a\ub3c4\ub85d \ud558\ub824\uba74 \ub85c\ubc0d \uc0c1\ud488\uc5d0 \uac00\uc785\ud558\uac70\ub098 \ub370\uc774\ud130 \uc0ac\uc6a9\uc744 \uc81c\ud55c\ud558\uac70\ub098 \ucc28\ub2e8 \uc11c\ube44\uc2a4\ub97c \uc774\uc6a9\ud558\ub294 \uac83\uc774 \uc88b\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "689", "t": "\uc81c \ud3f0 \uc9c0\uae08 \ub85c\ubc0d \ucc28\ub2e8\ub3fc \uc788\uc5b4\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \ub370\uc774\ud130 \ub85c\ubc0d \ucc28\ub2e8\uacfc \uc804\uccb4 \ub85c\ubc0d \ucc28\ub2e8\uc758 \ud604\uc7ac \uc124\uc815 \uc0c1\ud0dc\ub97c \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "745", "t": "\uc9c0\ub09c\ub2ec \ud574\uc678\uc5d0\uc11c \uc4f4 \ub85c\ubc0d \uc694\uae08\uc774 \uc774\ubc88 \uccad\uad6c\uc11c\uc5d0 \ub4e4\uc5b4\uac14\ub098\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uc774\ubc88 \ub2ec \uccad\uad6c \ub0b4\uc5ed\uc744 \uc870\ud68c\ud574 \uc9c0\ub09c\ub2ec \ud574\uc678\uc5d0\uc11c \uc4f4 \ub85c\ubc0d \uc694\uae08\uc774 \ud3ec\ud568\ub410\ub294\uc9c0 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud574\uc678 \ub85c\ubc0d \uc694\uae08\uc740 \uc0ac\uc6a9 \ud6c4 1~2\uac1c\uc6d4 \ub2a6\uac8c \uccad\uad6c\ub420 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "975", "t": "\uc9c0\ub09c\ubc88 \uc5ec\ud589 \ub54c \ub85c\ubc0d \uc694\uae08\uc774 \uc5bc\ub9c8 \ub098\uc654\uc5c8\ub098\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ub85c\ubc0d \uc774\uc6a9 \ub0b4\uc5ed\uc744 \uc870\ud68c\ud574 \uc9c0\ub09c \uc5ec\ud589\uc758 \ub85c\ubc0d \uc694\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "979", "t": "\uc81c \ud3f0\uc5d0 \ub370\uc774\ud130 \ub85c\ubc0d\uc774 \ub9c9\ud600 \uc788\ub294\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \ub370\uc774\ud130 \ub85c\ubc0d \ucc28\ub2e8 \uc124\uc815 \uc5ec\ubd80\ub97c \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0544", "q": "\uba85\uc758\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4\ub791 \uc81c \uba85\uc758\ub85c \uac1c\ud1b5\ub41c \ud68c\uc120\uc774 \uba87 \uac1c\uc778\uc9c0\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1464", "t": "\uba85\uc758\ub3c4\uc6a9\uc744 \ubbf8\ub9ac \ub9c9\uc744 \uc218 \uc788\ub294 \ubc29\ubc95\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc5e0\uc138\uc774\ud37c(M-Safer)\uc5d0\uc11c \uac00\uc785 \uc81c\ud55c \uc11c\ube44\uc2a4\ub97c \uc2e0\uccad\ud558\uba74 \ub2e4\ub978 \uc0ac\ub78c\uc774 \ub0b4 \uba85\uc758\ub85c \uc0c8 \ud734\ub300\ud3f0\uc744 \uac1c\ud1b5\ud558\ub294 \uac83\uc744 \ub9c9\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9\uc744 \ub9c9\uc73c\ub824\uba74 \uc2e0\ubd84\uc99d \uc0ac\ubcf8\uc744 \ud568\ubd80\ub85c \ubcf4\ub0b4\uc9c0 \ub9d0\uace0 \uc2e0\ubd84\uc99d\uc744 \uc783\uc5b4\ubc84\ub838\ub2e4\uba74 \ubc14\ub85c \ubd84\uc2e4 \uc2e0\uace0\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1529", "t": "\uc81c \uba85\uc758\ub85c \uac00\uc785\ub41c \ud68c\uc120\uc744 \ubaa8\ub450 \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \uba85\uc758\ub85c \uac00\uc785\ub41c \ud734\ub300\ud3f0\u00b7\ud0dc\ube14\ub9bf\u00b7\uc6cc\uce58 \ud68c\uc120\uc758 \ubc88\ud638, \uc694\uae08\uc81c, \uc774\uc6a9 \uc0c1\ud0dc\ub97c \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "155", "t": "\uc81c\uac00 \uc9c0\uae08 \uba87 \ud68c\uc120\uc744 \uc4f0\uace0 \uc788\ub294\uc9c0 \uc54c \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud604\uc7ac \uc774\uc6a9 \uc911\uc778 \ud734\ub300\ud3f0 \ud68c\uc120 \uc218\ub294 \uc571\uc758 \uac00\uc785 \uc815\ubcf4\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \ud68c\uc120\uc740 1\uc778\ub2f9 \ucd5c\ub300 5\uac1c\uae4c\uc9c0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "691", "t": "\uc81c\uac00 \ubc88\ud638\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4 \uc2e0\uccad\ud574 \ub480\uc5c8\ub098\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \ubc88\ud638\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4 \uac00\uc785 \uc5ec\ubd80\ub97c \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubc88\ud638\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4\uc5d0 \uac00\uc785\ud558\uc9c0 \uc54a\uc558\ub2e4\uba74 \ubb34\ub8cc\ub85c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "951", "t": "\ubc88\ud638\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4\ub294 \uc5b8\uc81c \uc2e0\uccad\ud588\uc5c8\ub098\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uc774\ub825\uc744 \uc870\ud68c\ud574 \ubc88\ud638\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4 \uc2e0\uccad\uc77c\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0545", "q": "\uc720\uc2ec \ubcf4\ud638 \uc11c\ube44\uc2a4 \uac00\uc785 \ubc29\ubc95\uc774\ub791 \uc720\uc2ec \ud574\ud0b9 \uc0ac\uac74 \uacbd\uacfc\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1272", "t": "\uc720\uc2ec \ubcf4\ud638 \uc11c\ube44\uc2a4\ub294 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uc720\uc2ec \ubcf4\ud638 \uc11c\ube44\uc2a4\ub294 \uc720\uc2ec\uc744 \ub2e4\ub978 \ud734\ub300\ud3f0\uc5d0 \uaf42\uc73c\uba74 \ud1b5\uc2e0\uc744 \ucc28\ub2e8\ud574 \uc720\uc2ec \ubcf5\uc81c\ub098 \ub3c4\uc6a9\uc744 \ub9c9\ub294 \ubb34\ub8cc \uc11c\ube44\uc2a4\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc720\uc2ec \ubcf4\ud638 \uc11c\ube44\uc2a4\ub294 \uc571\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \uac00\uc785\ud560 \uc218 \uc788\uace0 \ud734\ub300\ud3f0\uc744 \ubc14\uafc0 \ub54c\ub294 \uc7a0\uc2dc \ud574\uc81c\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "1685", "t": "\uc720\uc2ec\ubcf4\ud638\uc11c\ube44\uc2a4\ub294 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uc720\uc2ec\ubcf4\ud638\uc11c\ube44\uc2a4\ub294 \ub0b4 \uc720\uc2ec\uc774 \ub2e4\ub978 \ud734\ub300\ud3f0\uc5d0\uc11c \ubb34\ub2e8\uc73c\ub85c \uc0ac\uc6a9\ub418\ub294 \uac83\uc744 \uc81c\ud55c\ud558\ub294 \uc11c\ube44\uc2a4\uc785\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc720\uc2ec\ubcf4\ud638\uc11c\ube44\uc2a4 \uac00\uc785 \uac00\ub2a5 \uc5ec\ubd80\uc640 \uc2e0\uccad \ubc29\ubc95\uc740 \uc774\uc6a9 \uc911\uc778 \ud1b5\uc2e0\uc0ac\uc758 \uc571\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\uae30\uae30\ub97c \ubcc0\uacbd\ud558\uac70\ub098 \uc720\uc2ec\uc744 \ub2e4\ub978 \ud734\ub300\ud3f0\uc73c\ub85c \uc62e\uae30\uae30 \uc804\uc5d0\ub294 \uc720\uc2ec\ubcf4\ud638\uc11c\ube44\uc2a4 \uc774\uc6a9 \uc870\uac74\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}]}, {"id": "Q0546", "q": "\ud574\uc678\uc5d0\uc11c \ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\ub294\ub370 \ubd84\uc2e4 \uc2e0\uace0\uc640 \ud568\uaed8 \ud604\uc9c0 \uacbd\ucc30\uc11c \ubc88\ud638\ub3c4 \uc54c\ub824 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1314", "t": "\ud574\uc678\uc5d0\uc11c \ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \uc5b4\ub514\ub85c \uc5f0\ub77d\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud558\uac70\ub098 \ub2e4\ub978 \uc804\ud654\ub85c Ubot \ub85c\ubc0d \uace0\uac1d\uc13c\ud130(24\uc2dc\uac04, \ubc88\ud638\ub294 \ud648\ud398\uc774\uc9c0 \ub85c\ubc0d \uba54\ub274\uc5d0 \uc548\ub0b4)\uc5d0 \uc5f0\ub77d\ud574 \ud68c\uc120\uc744 \uc815\uc9c0\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4\ub85c \ud68c\uc120\uc744 \uc815\uc9c0\ud55c \ub3d9\uc548\uc5d0\ub294 \ub85c\ubc0d \uc694\uae08\uc774 \ubc1c\uc0dd\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1447", "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\uc5b4\uc694. \uc5b4\ub5bb\uac8c \ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \uba3c\uc800 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\ub098 \uace0\uac1d\uc13c\ud130 ARS(114)\uc5d0\uc11c \ubd84\uc2e4 \uc2e0\uace0\uc640 \ubd84\uc2e4 \uc815\uc9c0\ub97c \ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ubd84\uc2e4 \uc815\uc9c0\ub294 \ubb34\ub8cc\uc774\uace0 \ucd5c\ub300 90\uc77c \ub3d9\uc548 \ub2e4\ub978 \uc0ac\ub78c\uc774 \ub0b4 \ubc88\ud638\ub85c \uc804\ud654\u00b7\uacb0\uc81c\ud558\ub294 \uac83\uc744 \ub9c9\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1448", "t": "\ubd84\uc2e4 \uc2e0\uace0\ub294 \uc5b4\ub514\uc5d0\uc11c \ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4 \uc2e0\uace0\ub294 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubcf8\uc778\uc778\uc99d \ud6c4 \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub2e4\ub978 \uc804\ud654\ub85c 114(Ubot \ud734\ub300\ud3f0\uc774 \uc544\ub2c8\uba74 \ud648\ud398\uc774\uc9c0\uc758 \uace0\uac1d\uc13c\ud130 \ub300\ud45c\ubc88\ud638)\uc5d0 \uac78\uc5b4 ARS\ub85c 24\uc2dc\uac04 \ubd84\uc2e4 \uc2e0\uace0\ud560 \uc218\ub3c4 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "Ubot \ub9e4\uc7a5\uc5d0\uc11c\ub3c4 \uc2e0\ubd84\uc99d\uc744 \ubcf4\uc5ec \uc8fc\uba74 \ubd84\uc2e4 \uc2e0\uace0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1449", "t": "\uc783\uc5b4\ubc84\ub9b0 \ud734\ub300\ud3f0\uc758 \uc704\uce58\ub97c \ucc3e\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4\ud55c \ud734\ub300\ud3f0\uc758 \uc704\uce58 \ucc3e\uae30 \uae30\ub2a5\uc774 \ucf1c\uc838 \uc788\uc5c8\ub2e4\uba74 \uac24\ub7ed\uc2dc\ub294 \uc0bc\uc131 \ub0b4 \ub514\ubc14\uc774\uc2a4 \ucc3e\uae30, \uc544\uc774\ud3f0\uc740 \ub098\uc758 \ucc3e\uae30\uc5d0\uc11c \uc704\uce58\ub97c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud1b5\uc2e0\uc0ac\ub294 \uac1c\uc778\uc5d0\uac8c \ubd84\uc2e4 \ud734\ub300\ud3f0\uc758 \uc704\uce58\ub97c \uc54c\ub824 \uc904 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "228", "t": "\uc0c1\ub2f4\uc6d0 \uc6b4\uc601\uc2dc\uac04\uc774 \uc544\ub2cc\ub370 \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc0c1\ub2f4\uc6d0 \uc6b4\uc601\uc2dc\uac04\uc774 \uc544\ub2c8\uc5b4\ub3c4 \uace0\uac1d\uc13c\ud130 \uc790\ub3d9\uc751\ub2f5\uc73c\ub85c 24\uc2dc\uac04 \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ubd84\uc2e4 \uc2e0\uace0\ub97c \uc704\ud574 \ud734\ub300\ud3f0\uc5d0\uc11c\ub294 114, \uc77c\ubc18\uc804\ud654\uc5d0\uc11c\ub294 1500-0000\uc73c\ub85c \uc5f0\ub77d\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "237", "t": "\ud574\uc678\uc5ec\ud589 \uc911\uc5d0 \ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud574\uc678\uc5ec\ud589 \uc911 \ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \ub85c\ubc0d \uace0\uac1d\uc13c\ud130 +82-2-1500-0000\uc5d0 24\uc2dc\uac04 \uc2e0\uace0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud574\uc678\uc5d0\uc11c \ud734\ub300\ud3f0\uc744 \ubd84\uc2e4\ud55c \uacbd\uc6b0 \ub2e4\ub978 \uae30\uae30\uc5d0\uc11c \uc571\uc774\ub098 \ud648\ud398\uc774\uc9c0\ub85c\ub3c4 \uc2e0\uace0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "52", "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4 \uc2e0\uace0\ub294 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ubd84\uc2e4 \uc2e0\uace0\ub294 \uc571, \ud648\ud398\uc774\uc9c0 \ub610\ub294 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "53", "t": "\ubd84\uc2e4\ud55c \ud734\ub300\ud3f0 \uc704\uce58\ub97c \ucc3e\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4\ud55c \ud734\ub300\ud3f0\uc758 \uc704\uce58 \ucc3e\uae30 \uae30\ub2a5\uc774 \ud65c\uc131\ud654\ub3fc \uc788\ub2e4\uba74 \uc81c\uc870\uc0ac \uc11c\ube44\uc2a4\ub97c \uc774\uc6a9\ud574 \uc704\uce58\ub97c \ucc3e\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0547", "q": "\uc778\ud130\ub137 \uc18d\ub3c4\uac00 \ub290\ub824\uc11c \uc810\uac80\uc744 \ubc1b\uace0 \uc2f6\uc740\ub370 \uc6b0\ub9ac \uc9d1 \ud68c\uc120 \uc18d\ub3c4\ub97c \uc9c0\uae08 \uce21\uc815\ud574 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1666", "t": "\uc720\uc120 \uc778\ud130\ub137 \uc18d\ub3c4\ub97c \uc815\ud655\ud558\uac8c \uce21\uc815\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc720\uc120 \uc778\ud130\ub137 \uc18d\ub3c4\ub97c \uce21\uc815\ud558\ub824\uba74 \uac00\ub2a5\ud558\uba74 \uae30\uac00\ube44\ud2b8\ub97c \uc9c0\uc6d0\ud558\ub294 \ucef4\ud4e8\ud130\ub97c \uc720\uc120\uc73c\ub85c \uc5f0\uacb0\ud558\uace0 \ub2e4\uc6b4\ub85c\ub4dc\ub098 \uc2a4\ud2b8\ub9ac\ubc0d \ub4f1 \ub2e4\ub978 \ud2b8\ub798\ud53d\uc744 \uba48\ucdb0 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uc720\uc120 \uc778\ud130\ub137 \uc18d\ub3c4 \uce21\uc815\uc740 \ud1b5\uc2e0\uc0ac \uacf5\uc2dd \uce21\uc815 \ub3c4\uad6c\uc640 \uce21\uc815 \ud658\uacbd \uc548\ub0b4\ub97c \uc774\uc6a9\ud558\uba74 \ube44\uad50\uc5d0 \ub3c4\uc6c0\uc774 \ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "814", "t": "\uc6b0\ub9ac \uc9d1 \uc778\ud130\ub137\uc774 \uba87 \uae30\uac00\uc9dc\ub9ac \uc0c1\ud488\uc774\uc5d0\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uc9d1 \uc778\ud130\ub137 \uac00\uc785 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \uac00\uc785\ud55c \uc18d\ub3c4 \uc0c1\ud488\uacfc \uc6d4 \uc694\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0548", "q": "\ud1b5\uc2e0\ube44\ub97c \uc904\uc774\uace0 \uc2f6\uc740\ub370 \uc9c0\uae08 \uc81c \uc694\uae08\uc81c\ub85c\ub294 \uc5bc\ub9c8\ub098 \uc904\uc77c \uc218 \uc788\ub294\uc9c0 \uacc4\uc0b0\ud574 \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1531", "t": "\uc81c\uac00 \uc9c0\uae08 \uc4f0\uace0 \uc788\ub294 \uc694\uae08\uc81c\uac00 \ubb54\uc9c0 \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc758 \ud604\uc7ac \uc694\uae08\uc81c\uc640 \uc6d4\uc815\uc561, \ub370\uc774\ud130\u00b7\ud1b5\ud654 \uae30\ubcf8 \uc81c\uacf5\ub7c9\uc744 \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "1532", "t": "\uc81c \uc0ac\uc6a9\ub7c9\uc5d0 \ub9de\ub294 \uc694\uae08\uc81c\ub97c \ucd94\ucc9c\ud574 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc758 \ucd5c\uadfc \ub370\uc774\ud130\u00b7\ud1b5\ud654 \uc0ac\uc6a9\ub7c9\uacfc \ud604\uc7ac \uc694\uae08\uc81c\ub97c \uc870\ud68c\ud574, \uc0ac\uc6a9\ub7c9\uc5d0 \ub9de\ub294 Ubot \uc694\uae08\uc81c\ub97c \ube44\uad50\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "676", "t": "\uc81c\uac00 \uc9c0\uae08 \ubb34\uc2a8 \uc694\uae08\uc81c \uc4f0\uace0 \uc788\uc5b4\uc694?", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud55c \ud68c\uc6d0\uc758 \ud68c\uc120 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \ud604\uc7ac \uc0ac\uc6a9 \uc911\uc778 \uc694\uae08\uc81c\uc640 \uc6d4\uc815\uc561, \uae30\ubcf8 \uc81c\uacf5\ub7c9\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "760", "t": "\uc81c \ucd5c\uadfc \uc0ac\uc6a9\ub7c9\uc73c\ub85c \ubcf4\uba74 \uc5b4\ub5a4 \uc694\uae08\uc81c\uac00 \ub9de\uc544\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ucd5c\uadfc \ub370\uc774\ud130\uc640 \ud1b5\ud654 \uc0ac\uc6a9 \ub0b4\uc5ed\uc744 \uc870\ud68c\ud574 \uc0ac\uc6a9 \ud328\ud134\uc5d0 \ub9de\ub294 \uc694\uae08\uc81c\ub97c \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "933", "t": "\uc57d\uc815 \ud560\uc778 \ubc1b\uace0 \ub098\uba74 \uc81c \uc694\uae08\uc81c\uac00 \uc2e4\uc81c\ub85c \uc5bc\ub9c8\uc608\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc774 \uc0ac\uc6a9\ud558\ub294 \uc694\uae08\uc81c\uc640 \uc120\ud0dd\uc57d\uc815 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \uc57d\uc815 \ud560\uc778 \ud6c4 \uc2e4\uc81c \uc6d4 \uc694\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0550", "q": "\uc77c\uc2dc\uc815\uc9c0 \ubc29\ubc95\uc774\ub791 \uc815\uc9c0 \uae30\uac04 \ub3d9\uc548 \uc81c \ud734\ub300\ud3f0\uc5d0 \uc313\uc778 \ubb38\uc790\ub97c \ubcf4\uc5ec \uc8fc\uc138\uc694", "g": "BORDER", "f": [{"id": "1431", "t": "\ud734\ub300\ud3f0\uc744 \uc7a0\uc2dc \uc26c\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc7a0\uc2dc \uc26c\ub824\uba74 Ubot \uc571\u00b7\uace0\uac1d\uc13c\ud130\u00b7\ub9e4\uc7a5\uc5d0\uc11c \uc77c\uc2dc\uc815\uc9c0\ub97c \uc2e0\uccad\ud558\uba74 \ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \uc77c\uc2dc\uc815\uc9c0\ub294 \uc5f0 2\ud68c, 1\ud68c \ucd5c\ub300 90\uc77c, \uc5f0\uac04 \ud569\uacc4 180\uc77c\uae4c\uc9c0 \uac00\ub2a5\ud569\ub2c8\ub2e4.", "y": 1}, {"i": 2, "t": "\uc77c\uc2dc\uc815\uc9c0 \uae30\uac04\uc5d0\ub294 \uc6d4 3,850\uc6d0\uc774 \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "220", "t": "\ub2f9\ubd84\uac04 \ud734\ub300\ud3f0\uc744 \uc4f0\uc9c0 \uc54a\uc744 \ub54c \ubc29\ubc95\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \ub2f9\ubd84\uac04 \uc4f0\uc9c0 \uc54a\uc744 \ub54c\ub294 \uc77c\uc815 \uae30\uac04 \ud68c\uc120\uc744 \uc77c\uc2dc \uc815\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud68c\uc120 \uc77c\uc2dc\uc815\uc9c0\ub294 \uace0\uac1d\uc13c\ud130\ub098 \ub9e4\uc7a5\uc5d0\uc11c \ubcf8\uc778 \ud655\uc778 \ud6c4 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "57", "t": "\ud734\ub300\ud3f0\uc744 \uc7a0\uc2dc \uc0ac\uc6a9\ud558\uc9c0 \uc54a\uc73c\ub824\uace0 \ud569\ub2c8\ub2e4.", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc7a0\uc2dc \uc0ac\uc6a9\ud558\uc9c0 \uc54a\uc73c\ub824\uba74 \uc77c\uc815 \uae30\uac04 \ud68c\uc120\uc744 \uc77c\uc2dc \uc815\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}]};
const KEY='sentlab_v1';
let st={}; try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){st={}}
if(!st.n)st.n={}; if(!st.rv)st.rv={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
// n[qid|faq|idx]=0/1 override
const Q=DATA.q; let cur=0, filt='all', shown=[];
function key(q,f,i){return q+'|'+f+'|'+i}
function val(q,f,s){const k=key(q,f,s.i);return k in st.n?st.n[k]:s.y}
function flagged(q){return q.f.some(f=>!f.s.some(s=>val(q.id,f.id,s)))}
function render(){
  shown=Q.map((q,i)=>i).filter(i=>{const q=Q[i];
    if(filt==='all')return true; if(filt==='flag')return flagged(q);
    if(filt==='todo')return !st.rv[q.id]; if(filt==='todoflag')return !st.rv[q.id]&&flagged(q); return true});
  const L=document.getElementById('list');L.innerHTML='';
  shown.forEach(i=>{const q=Q[i];const d=document.createElement('div');
    d.className='it'+(i===cur?' cur':'')+(st.rv[q.id]?' rv':'')+(flagged(q)?' fl':'');
    d.innerHTML='<span class="dot"></span><span>'+q.id+' '+esc(q.q.slice(0,40))+'<small>FAQ '+q.f.length+'개'+(flagged(q)?' · 필요문장 없는 FAQ':'')+'</small></span>';
    d.onclick=()=>{cur=i;render()};L.appendChild(d)});
  const rv=Q.filter(q=>st.rv[q.id]).length;
  document.getElementById('prog').textContent=rv+' / '+Q.length+' 검토';
  const F=document.getElementById('filters');F.innerHTML='';
  [['all','전체'],['flag','필요문장 없는 FAQ 있음'],['todo','미검토'],['todoflag','미검토+의심']].forEach(([k,l])=>{
    const b=document.createElement('button');b.textContent=l;b.className=filt===k?'on':'';b.onclick=()=>{filt=k;render()};F.appendChild(b)});
  main();
  const c=L.querySelector('.cur');if(c)c.scrollIntoView({block:'nearest'});
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function main(){
  const q=Q[cur];const M=document.getElementById('main');
  let h='<div class="card"><h2>'+q.id+' '+esc(q.q)+'</h2><div class="meta">그룹 '+q.g+' · 정답 FAQ '+q.f.length+'개 · 문장을 클릭하면 필요(Y)/불필요(N)가 바뀝니다. 필요 = 이 문장이 없으면 질문에 대한 답이 불완전하거나 틀려지는 문장.</div></div>';
  h+='<div class="bar"><button class="btn pri" id="ok">검토 완료 + 다음 (Enter)</button><button class="btn" id="prev">← 이전</button><button class="btn" id="next">다음 →</button><span class="meta"><kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>Enter</kbd> 완료</span></div>';
  q.f.forEach(f=>{const any=f.s.some(s=>val(q.id,f.id,s));
    h+='<div class="card faq'+(any?'':' warn')+'"><div class="t"><span>FAQ '+f.id+'</span><span>'+esc(f.t)+'</span>'+(any?'':'<span class="id" style="color:var(--wa)">⚠ 필요한 문장 없음 → 이 FAQ는 정답에서 제외됩니다</span>')+'<button class="small" data-all="1" data-f="'+f.id+'">전체 Y</button><button class="small" data-all="0" data-f="'+f.id+'">전체 N</button></div>';
    f.s.forEach(s=>{const y=val(q.id,f.id,s);h+='<div class="s '+(y?'y':'n')+'" data-f="'+f.id+'" data-i="'+s.i+'"><span class="b">'+(y?'Y':'N')+'</span><span>'+esc(s.t)+'</span></div>'});
    h+='</div>'});
  M.innerHTML=h;
  M.querySelectorAll('.s').forEach(e=>e.onclick=()=>{const k=key(q.id,e.dataset.f,e.dataset.i);const f=q.f.find(x=>x.id===e.dataset.f);const s=f.s.find(x=>String(x.i)===e.dataset.i);st.n[k]=val(q.id,f.id,s)?0:1;save();render()});
  M.querySelectorAll('.small').forEach(e=>e.onclick=()=>{const f=q.f.find(x=>x.id===e.dataset.f);f.s.forEach(s=>st.n[key(q.id,f.id,s.i)]=+e.dataset.all);save();render()});
  document.getElementById('ok').onclick=()=>{st.rv[q.id]=1;save();step(1)};
  document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
  M.scrollTop=0;
}
function step(d){const p=shown.indexOf(cur);let np=p+d;if(p<0)np=0;if(np>=0&&np<shown.length)cur=shown[np];render()}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='j')step(1);else if(e.key==='ArrowLeft'||e.key==='k')step(-1);
  else if(e.key==='Enter'){st.rv[Q[cur].id]=1;save();step(1)}});
function csvq(s){s=String(s);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
document.getElementById('exp').onclick=()=>{
  const rows=[['qid','question','faq_id','sentence_idx','sentence','needed']];
  Q.forEach(q=>q.f.forEach(f=>f.s.forEach(s=>rows.push([q.id,q.q,f.id,s.i,s.t,val(q.id,f.id,s)?'Y':'N']))));
  const t='\ufeff'+rows.map(r=>r.map(csvq).join(',')).join('\r\n')+'\r\n';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='sentence_sheet_final.csv';a.click();
  document.getElementById('msg').textContent=rows.length-1+'문장 저장됨 (파일: sentence_sheet_final.csv)';
};
document.getElementById('imp').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=ev=>{const r=new FileReader();r.onload=()=>{
  const lines=[];let cell='',row=[],inq=false,t=r.result.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){const c=t[i];if(inq){if(c==='"'){if(t[i+1]==='"'){cell+='"';i++}else inq=false}else cell+=c}
    else if(c==='"')inq=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);cell='';if(row.length>1)lines.push(row);row=[]}else cell+=c}
  if(cell||row.length){row.push(cell);lines.push(row)}
  let n=0;lines.slice(1).forEach(x=>{st.n[key(x[0],x[2],x[3])]=x[5]==='Y'?1:0;n++});save();render();
  document.getElementById('msg').textContent=n+'문장 불러옴'};r.readAsText(ev.target.files[0],'utf-8')};
render();
</script></body></html>
