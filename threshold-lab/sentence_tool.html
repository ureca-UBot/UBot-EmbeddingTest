 [{"i": 0, "t": "\ud2b9\uc815 \uc804\ud654\ubc88\ud638\ub294 \uc804\ud654 \ub610\ub294 \uba54\uc2dc\uc9c0 \uc571\uc5d0\uc11c \ucc28\ub2e8\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "64", "t": "\uc2a4\ud338 \ubb38\uc790\ub97c \ucc28\ub2e8\ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc2a4\ud338 \ubb38\uc790\ub294 \ud734\ub300\ud3f0 \ub610\ub294 \ud1b5\uc2e0\uc0ac\uc758 \uc2a4\ud338 \ucc28\ub2e8 \uae30\ub2a5\uc73c\ub85c \ucc28\ub2e8\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0160", "q": "\ud3ec\uc778\ud2b8\ub85c \uc694\uae08 \ub0bc\uc218\uc788\uc5b4?", "g": "ANS", "f": [{"id": "1354", "t": "\ud3ec\uc778\ud2b8\ub294 \uc5b4\ub514\uc5d0 \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \ud3ec\uc778\ud2b8\ub294 \ud734\ub300\ud3f0 \uc694\uae08 \ub0a9\ubd80, \ub370\uc774\ud130 \ud50c\ub7ec\uc2a4 \uad6c\ub9e4, \uc561\uc138\uc11c\ub9ac \uad6c\ub9e4\uc5d0 \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "Ubot \ud3ec\uc778\ud2b8\ub294 1\ud3ec\uc778\ud2b8\ub97c 1\uc6d0\uc73c\ub85c \uacc4\uc0b0\ud558\uba70 1,000\ud3ec\uc778\ud2b8 \uc774\uc0c1\ubd80\ud130 \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1355", "t": "\ud3ec\uc778\ud2b8\ub85c \uc694\uae08\uc744 \ub0b4\uba74 \uc5b8\uc81c \ubc18\uc601\ub418\ub098\uc694?", "s": [{"i": 0, "t": "\uc571\uc5d0\uc11c \ud3ec\uc778\ud2b8\ub85c \uc694\uae08 \ub0a9\ubd80\ub97c \uc2e0\uccad\ud558\uba74 \ub2e4\uc74c \uccad\uad6c\uc11c\uc5d0\uc11c \uc2e0\uccad\ud55c \ud3ec\uc778\ud2b8\ub9cc\ud07c \ucc28\uac10\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub9e4\uc6d4 3~5\uc77c\uc778 \uccad\uad6c\uc11c \ud655\uc815\uc77c \uc774\ud6c4\uc5d0 \ud3ec\uc778\ud2b8 \ub0a9\ubd80\ub97c \uc2e0\uccad\ud558\uba74 \uadf8\ub2e4\uc74c \uccad\uad6c\uc11c\uc5d0 \ubc18\uc601\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "276", "t": "\ubd80\uac00\uc11c\ube44\uc2a4 \uc694\uae08\uc744 \ud3ec\uc778\ud2b8\ub85c \ub0bc \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd80\uac00\uc11c\ube44\uc2a4 \uc694\uae08\ub3c4 \ud3ec\ud568\ud55c \uccad\uad6c \uc694\uae08 \ub0a9\ubd80\uc5d0\ub294 \ud3ec\uc778\ud2b8\ub97c \uc6d4 \ucd5c\ub300 5,000\ud3ec\uc778\ud2b8\uae4c\uc9c0 \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud3ec\uc778\ud2b8\ub294 \uccad\uad6c\ub41c \uc694\uae08 \uc804\uccb4\uc5d0 \uc801\uc6a9\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "289", "t": "\ud3ec\uc778\ud2b8\ub85c \uc694\uae08\uc744 \ub0bc \ub54c \ud55c\ub3c4\uac00 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uba64\ubc84\uc2ed \ud3ec\uc778\ud2b8\ub294 \ud734\ub300\ud3f0 \uc694\uae08 \ub0a9\ubd80\uc5d0 \uc6d4 \ucd5c\ub300 5,000\ud3ec\uc778\ud2b8\uae4c\uc9c0 \uc0ac\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc694\uae08 \ub0a9\ubd80\uc5d0 \uc4f0\uc9c0 \uc54a\uc740 \ud3ec\uc778\ud2b8\ub294 \ub370\uc774\ud130 \ud50c\ub7ec\uc2a4\ub098 \uc561\uc138\uc11c\ub9ac \uad6c\ub9e4 \ub4f1 \uc0ac\uc6a9 \uac00\ub2a5\ud55c \ud56d\ubaa9\uc5d0 \uc4f8 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0161", "q": "\uc911\uace0\ud3f0 \uac1c\ud1b5\ub428?", "g": "ANS", "f": [{"id": "1064", "t": "\uc790\uae09\uc81c\ud3f0\uc774\ub098 \uc911\uace0\ud3f0\ub3c4 \uc628\ub77c\uc778\uc73c\ub85c \uac00\uc785\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uad6d\ub0b4 \uc804\ud30c \uc778\uc99d\uc744 \ubc1b\uc740 \uc790\uae09\uc81c\ud3f0\uacfc \ubd84\uc2e4\u00b7\ub3c4\ub09c \uc2e0\uace0\uac00 \uc5c6\ub294 \uc911\uace0\ud3f0\uc740 \uc720\uc2ec\uc774\ub098 eSIM\uc73c\ub85c \uc628\ub77c\uc778 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1287", "t": "\uc911\uace0\ud3f0\uc774\ub098 \uc790\uae09\uc81c\ud3f0\uc73c\ub85c eSIM\uc744 \uac1c\ud1b5\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "eSIM\uc744 \uc9c0\uc6d0\ud558\ub294 \uc911\uace0\ud3f0\uc774\ub098 \uc790\uae09\uc81c\ud3f0\uc774\ub77c\uba74 eSIM\uc73c\ub85c \uac1c\ud1b5\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc911\uace0\ud3f0\u00b7\uc790\uae09\uc81c\ud3f0\uc758 eSIM\uc744 \uc2e0\uccad\ud560 \ub54c\ub294 \uc124\uc815 > \ud734\ub300\ud3f0 \uc815\ubcf4\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\ub294 IMEI\uc640 EID \ubc88\ud638\uac00 \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "1390", "t": "\uc911\uace0\ud3f0\uc73c\ub85c \uae30\uae30 \ubcc0\uacbd\uc744 \ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubd84\uc2e4\u00b7\ub3c4\ub09c \uc2e0\uace0\uac00 \uc5c6\ub294 \uc911\uace0\ud3f0\uc774\ub77c\uba74 Ubot \uc720\uc2ec\uc744 \uc62e\uaca8 \ub07c\uc6cc \uae30\uae30 \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc911\uace0\ud3f0\uc73c\ub85c \uae30\uae30 \ubcc0\uacbd\ud558\uba74 \uacf5\uc2dc\uc9c0\uc6d0\uae08\uc740 \ubc1b\uc744 \uc218 \uc5c6\uc9c0\ub9cc \uc120\ud0dd\uc57d\uc815 \ud560\uc778\uc740 \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "95", "t": "\ud734\ub300\ud3f0\uc744 \uc911\uace0 \uae30\uae30\ub85c \ubcc0\uacbd\ud574\ub3c4 \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\uc911\uace0 \ud734\ub300\ud3f0\uc774 \uc815\uc0c1 \uc0ac\uc6a9 \uac00\ub2a5\ud55c \ub2e8\ub9d0\uae30\ub77c\uba74 \uae30\uc874 \uc720\uc2ec\uc744 \uc7a5\ucc29\ud558\uac70\ub098 \uae30\uae30 \ubcc0\uacbd \uc808\ucc28\ub97c \uac70\uccd0 \uc774\uc6a9\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0163", "q": "\uc790\ub140\ud3f0 \uad00\ub9ac\ud558\uace0\uc2f6\uc740\ub370", "g": "ANS", "f": [{"id": "1019", "t": "\uc790\ub140\uac00 \uc720\ud574 \uc0ac\uc774\ud2b8\uc5d0 \uc811\uc18d\ud558\uc9c0 \ubabb\ud558\uac8c \ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc790\ub140 \ubcf4\ud638 \uc11c\ube44\uc2a4\ub97c \uc2e0\uccad\ud558\uba74 \uc790\ub140 \ud734\ub300\ud3f0\uc758 \uc774\uc6a9 \uc2dc\uac04\uacfc \uc811\uadfc\uc744 \uad00\ub9ac\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc790\ub140 \ubcf4\ud638 \uc11c\ube44\uc2a4\ub294 \ubb34\ub8cc\uc774\uba70 \uc571\uc5d0\uc11c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1194", "t": "\ubbf8\uc131\ub144 \uc790\ub140\uc758 \uccad\uad6c\uc11c\ub97c \ubd80\ubaa8\ub3c4 \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc571\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \ubc95\uc815\ub300\ub9ac\uc778 \ub3d9\uc2dc \uc548\ub0b4\ub97c \uc2e0\uccad\ud558\uba74 \ubbf8\uc131\ub144 \uc790\ub140\uc640 \ubd80\ubaa8\uc778 \ubc95\uc815\ub300\ub9ac\uc778\uc5d0\uac8c \ubaa8\ubc14\uc77c \uccad\uad6c\uc11c\ub97c \ud568\uaed8 \ubcf4\ub0b4 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "1222", "t": "\uc790\ub140 \ud734\ub300\ud3f0\uc758 \ub0a8\uc740 \ub370\uc774\ud130\ub97c \ud655\uc778\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ubc95\uc815\ub300\ub9ac\uc778\uc73c\ub85c \ub4f1\ub85d\ub41c \ubd80\ubaa8\ub294 Ubot \uc571\uc758 \uc790\ub140 \ud68c\uc120 \uad00\ub9ac\uc5d0\uc11c \uc790\ub140 \ud734\ub300\ud3f0\uc758 \ub0a8\uc740 \ub370\uc774\ud130\uc640 \uc774\uc6a9 \uc694\uae08\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc790\ub140\uac00 \ub9cc 19\uc138\uac00 \ub418\uba74 \ubd80\ubaa8\uac00 \ud68c\uc120 \ub370\uc774\ud130\ub97c \uacc4\uc18d \uc870\ud68c\ud558\ub824\uba74 \uc790\ub140 \ubcf8\uc778 \ub3d9\uc758\uac00 \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "1483", "t": "\uc790\ub140\uac00 \ud734\ub300\ud3f0\uc744 \uc548\uc804\ud558\uac8c \uc4f0\uac8c \ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \ud0a4\uc988\uac00\ub4dc(\uc6d4 2,200\uc6d0, \ud0a4\uc988 \uc548\uc2ec \uc694\uae08\uc81c\uc5d0\ub294 \ud3ec\ud568)\uc5d0 \uac00\uc785\ud558\uba74 \ubcf4\ud638\uc790\uac00 \uc790\ub140 \uc704\uce58\ub97c \ud655\uc778\ud558\uace0 \uc720\ud574 \uc0ac\uc774\ud2b8\ub97c \ucc28\ub2e8\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc790\ub140\uc758 \ud734\ub300\ud3f0 \uacb0\uc81c \ucc28\ub2e8\uacfc \ub370\uc774\ud130 \ucc28\ub2e8\ub3c4 \ud568\uaed8 \uc124\uc815\ud558\uba74 \uc548\uc804\ud558\uac8c \uc774 758\ub3c4\uc6a9\uc774 \uc758\uc2ec\ub418\uba74 \ubc14\ub85c \uace0\uac1d\uc13c\ud130(114)\uc5d0 \uc2e0\uace0\ud558\uace0 \ud55c\uad6d\uc815\ubcf4\ud1b5\uc2e0\uc9c4\ud765\ud611\ud68c\uc758 \uba85\uc758\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4(\uc5e0\uc138\uc774\ud37c)\uc5d0\uc11c \ub0b4 \uba85\uc758\ub85c \uac00\uc785\ub41c \ud68c\uc120\uc744 \ubaa8\ub450 \uc870\ud68c\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9\uc73c\ub85c \ud655\uc778\ub41c \ud68c\uc120\uc740 \uacbd\ucc30 \uc2e0\uace0 \uc811\uc218\uc99d\uacfc \ud568\uaed8 \ub9e4\uc7a5\uc5d0\uc11c \ud574\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1464", "t": "\uba85\uc758\ub3c4\uc6a9\uc744 \ubbf8\ub9ac \ub9c9\uc744 \uc218 \uc788\ub294 \ubc29\ubc95\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc5e0\uc138\uc774\ud37c(M-Safer)\uc5d0\uc11c \uac00\uc785 \uc81c\ud55c \uc11c\ube44\uc2a4\ub97c \uc2e0\uccad\ud558\uba74 \ub2e4\ub978 \uc0ac\ub78c\uc774 \ub0b4 \uba85\uc758\ub85c \uc0c8 \ud734\ub300\ud3f0\uc744 \uac1c\ud1b5\ud558\ub294 \uac83\uc744 \ub9c9\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9\uc744 \ub9c9\uc73c\ub824\uba74 \uc2e0\ubd84\uc99d \uc0ac\ubcf8\uc744 \ud568\ubd80\ub85c \ubcf4\ub0b4\uc9c0 \ub9d0\uace0 \uc2e0\ubd84\uc99d\uc744 \uc783\uc5b4\ubc84\ub838\ub2e4\uba74 \ubc14\ub85c \ubd84\uc2e4 \uc2e0\uace0\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1519", "t": "\uba85\uc758\ub3c4\uc6a9 \uc2e0\uace0\ub97c \uc811\uc218\ud558\ub294 \ub9e4\uc7a5\uc774 \uc5b4\ub514\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uba85\uc758\ub3c4\uc6a9 \uc2e0\uace0 \uc811\uc218\ub97c \uc9c0\uc6d0\ud558\ub294 Ubot \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9 \uc2e0\uace0 \uc811\uc218\ub97c \uc704\ud574 \ub9e4\uc7a5\uc5d0 \ubc29\ubb38\ud560 \ub54c\ub294 \uc2e0\ubd84\uc99d\uacfc \uacbd\ucc30 \uc2e0\uace0 \uc811\uc218\uc99d\uc744 \ucc59\uaca8 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "156", "t": "\uc81c\uac00 \uac00\uc785\ud558\uc9c0 \uc54a\uc740 \ud68c\uc120\uc774 \uc81c \uba85\uc758\ub85c \uac1c\ud1b5\ub410\uc5b4\uc694.", "s": [{"i": 0, "t": "\uac00\uc785\ud558\uc9c0 \uc54a\uc740 \ud68c\uc120\uc774 \ubcf8\uc778 \uba85\uc758\ub85c \uac1c\ud1b5\ub410\ub2e4\uba74 \uc571\uc758 \uba85\uc758\ub3c4\uc6a9 \uc870\ud68c\uc5d0\uc11c \ub0b4 \uba85\uc758 \ud68c\uc120\uc744 \ud655\uc778\ud558\uace0 \uc989\uc2dc \uace0\uac1d\uc13c\ud130\uc5d0 \uc2e0\uace0\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uba85\uc758\ub3c4\uc6a9\uc744 \ub9c9\uae30 \uc704\ud574 \ubb34\ub8cc \ubc88\ud638\ub3c4\uc6a9 \ubc29\uc9c0 \uc11c\ube44\uc2a4\ub3c4 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "846", "t": "\uc774 \ud68c\uc120 \uba85\uc758\uc790\uac00 \uc800\ub85c \ub418\uc5b4 \uc788\ub294\uc9c0 \ud655\uc778\ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ubcf8\uc778 \ud655\uc778 \ud6c4 \ud574\ub2f9 \ud734\ub300\ud3f0 \ud68c\uc120\uc758 \uba85\uc758\uc790 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \ud68c\uc6d0 \ubcf8\uc778 \uba85\uc758\uc778\uc9c0 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0172", "q": "\ud734\ub300\ud3f0 \uc694\uae08 \uce74\ub4dc\ub85c \ub0b4\uace0\uc2f6\uc74c", "g": "ANS", "f": [{"id": "1162", "t": "\uc694\uae08\uc740 \uc5b4\ub5a4 \ubc29\ubc95\uc73c\ub85c \ub0bc \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uacc4\uc88c \uc790\ub3d9\uc774\uccb4, \uce74\ub4dc \uc790\ub3d9\ub0a9\ubd80, \uc571\u00b7\ud648\ud398\uc774\uc9c0 \uc989\uc2dc \ub0a9\ubd80(\uacc4\uc88c\uc774\uccb4\u00b7\uce74\ub4dc), \uccad\uad6c\uc11c\uc5d0 \uc801\ud78c \uac00\uc0c1\uacc4\uc88c \uc785\uae08, \ub9e4\uc7a5 \uc218\ub0a9\uc73c\ub85c \ub0bc \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1163", "t": "\uc790\ub3d9\uc774\uccb4\ub97c \uc2e0\uccad\ud558\uac70\ub098 \uacc4\uc88c\ub97c \ubc14\uafb8\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc790\ub3d9\uc774\uccb4\ub97c \uc2e0\uccad\ud558\uac70\ub098 \uacc4\uc88c\ub97c \ubc14\uafb8\ub824\uba74 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubcf8\uc778\uc778\uc99d \ud6c4 \ub0a9\ubd80 \ubc29\ubc95 \uba54\ub274\uc5d0 \uacc4\uc88c\ub098 \uce74\ub4dc\ub97c \ub4f1\ub85d\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc790\ub3d9\uc774\uccb4 \uc2e0\uccad\uc740 \ub2e4\uc74c \ub0a9\ubd80\uc77c\ubd80\ud130 \uc801\uc6a9\ub418\uba70 \ucc98\ub9ac \uc911\uc5d0\ub294 \ub0a9\ubd80 \ubc29\ubc95\uc774 '\uc9c0\ub85c \ub0a9\ubd80'\ub85c \ubcf4\uc77c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "41", "t": "\ud734\ub300\ud3f0 \uc694\uae08 \uacb0\uc81c \uce74\ub4dc\ub97c \ubcc0\uacbd\ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc694\uae08 \uacb0\uc81c \uce74\ub4dc\ub294 \uc694\uae08 \ub0a9\ubd80 \uad00\ub9ac \uba54\ub274\uc5d0\uc11c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0173", "q": "\ubd80\uac00\uc11c\ube44\uc2a4 \ubb50 \uac00\uc785\ub418\uc5b4\uc788\ub294\uc9c0 \ubaa8\ub974\uaca0\uc74c", "g": "ANS", "f": [{"id": "1327", "t": "\uac00\uc785\ub41c \ubd80\uac00\uc11c\ube44\uc2a4\ub294 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uba54\ub274\uc5d0\uc11c \uac00\uc785\ub41c \ubb34\ub8cc\u00b7\uc720\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\uc640 \uc6d4 \uc694\uae08, \uac00\uc785\uc77c\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1544", "t": "\uc81c\uac00 \uac00\uc785\ud55c \ubd80\uac00\uc11c\ube44\uc2a4\ub97c \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc5d0 \uac00\uc785\ub41c \ubd80\uac00\uc11c\ube44\uc2a4\uc640 \uac01 \uc11c\ube44\uc2a4\uc758 \uc6d4 \uc694\uae08, \uac00\uc785\uc77c\uc744 \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "945", "t": "\uc81c\uac00 \uc4f0\uace0 \uc788\ub294 \ubd80\uac00\uc11c\ube44\uc2a4 \ubb50\ubb50 \uc788\uc5b4\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ud68c\uc120 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \uac00\uc785 \uc911\uc778 \ubd80\uac00\uc11c\ube44\uc2a4 \ubaa9\ub85d\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0174", "q": "\ub370\uc774\ud130 \uc250\uc5b4 \uc5b4\ucf00\ud568", "g": "ANS", "f": [{"id": "172", "t": "\ub370\uc774\ud130 \uc250\uc5b4\ub9c1\uc740 \uc5b4\ub514\uc5d0\uc11c \uc2e0\uccad\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ub370\uc774\ud130 \uc250\uc5b4\ub9c1\uc740 \uc571\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uba54\ub274\ub098 \uace0\uac1d\uc13c\ud130, \ub9e4\uc7a5\uc5d0\uc11c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub370\uc774\ud130 \uc250\uc5b4\ub9c1\uc740 5G \uc2a4\ud0e0\ub2e4\ub4dc \uc774\uc0c1 \uc694\uae08\uc81c\uc5d0\uc11c \ubcf8\uc778 \uba85\uc758 \uc11c\ube0c \ud68c\uc120\uc744 \ucd5c\ub300 2\uac1c\uae4c\uc9c0 \uc5f0\uacb0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1766", "t": "\ub370\uc774\ud130 \uc250\uc5b4\ub9c1 \ub73b\uc774 \ubb34\uc5c7\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\uc8fc \ud68c\uc120\uc758 \ub370\uc774\ud130 \uc81c\uacf5\ub7c9\uc744 \ud0dc\ube14\ub9bf\uc774\ub098 \uc6cc\uce58 \uac19\uc740 \ub2e4\ub978 \ud68c\uc120\uacfc \ub098\ub220 \uc4f0\ub294 \uc11c\ube44\uc2a4\uc785\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0175", "q": "\ud1b5\uc2e0\uc0ac \ubc14\uafb8\uba74 \uc704\uc57d\uae08 \ubb50\uc784", "g": "ANS", "f": [{"id": "1086", "t": "\ubc88\ud638\uc774\ub3d9\ud558\uba74 \uc774\uc804 \ud1b5\uc2e0\uc0ac\uc758 \ub0a8\uc740 \uc704\uc57d\uae08\uc740 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ubc88\ud638\uc774\ub3d9\ud558\uba74 \uc774\uc804 \ud1b5\uc2e0\uc0ac\uc758 \uc57d\uc815 \ud560\uc778\ubc18\ud658\uae08\uc774\ub098 \ub0a8\uc740 \ub2e8\ub9d0 \ud560\ubd80\uae08\uc774 \uc774\uc804 \ud1b5\uc2e0\uc0ac \uc694\uae08\uacfc \ud568\uaed8 \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubc88\ud638\uc774\ub3d9\uc73c\ub85c \uccad\uad6c\ub420 \uc704\uc57d\uae08\uacfc \ud560\ubd80\uae08\uc740 \uc774\ub3d9 \uc804\uc5d0 \uc774\uc804 \ud1b5\uc2e0\uc0ac \uc571\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "222", "t": "\uc57d\uc815 \uc911\uc5d0 \ubc88\ud638\uc774\ub3d9\uc744 \ud558\uba74 \ubb34\uc5c7\uc774 \uccad\uad6c\ub418\ub098\uc694?", "s": [{"i": 0, "t": "\uc57d\uc815 \uae30\uac04 \uc911 \ubc88\ud638\uc774\ub3d9\uc744 \ud558\uba74 \ub0a8\uc740 \uae30\uac04\uc5d0 \ud574\ub2f9\ud558\ub294 \ud560\uc778\ubc18\ud658\uae08\uc774 \uccad\uad6c\ub418\uba70 \uc608\uc0c1 \uae08\uc561\uc740 \uc571\uc5d0\uc11c \uc870\ud68c\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc57d\uc815 \uc911 \ubc88\ud638\uc774\ub3d9\uc744 \ud558\ub354\ub77c\ub3c4 \ub2e8\ub9d0 \ud560\ubd80\uac00 \ub0a8\uc544 \uc788\ub2e4\uba74 \ud560\ubd80\uae08\uc740 \uacc4\uc18d \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0176", "q": "\uad70\ub300\uac00\ub294\ub370 \ud3f0 \uc5b4\ub5a1\ud574", "g": "ANS", "f": [{"id": "1018", "t": "\uad70 \uc785\ub300 \uc911\uc5d0\ub294 \ud734\ub300\ud3f0 \ud68c\uc120\uc744 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uad70 \uc785\ub300 \uae30\uac04\uc5d0\ub294 \ud734\ub300\ud3f0 \ud68c\uc120\uc744 \uc77c\uc2dc \uc815\uc9c0\ud558\uac70\ub098 \uc694\uae08\uc81c\ub97c \ub0ae\ucdb0 \uc720\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc785\ub300 \uc911 \ud68c\uc120 \uc77c\uc2dc\uc815\uc9c0\ub098 \uc694\uae08\uc81c \ubcc0\uacbd\uc758 \uac00\ub2a5 \uc870\uac74\uc740 \uac00\uc785 \uc0c1\ud0dc\uc5d0 \ub530\ub77c \ub2ec\ub77c \uc571\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1434", "t": "\uad70 \uc785\ub300\ub85c \ud734\ub300\ud3f0\uc744 \uc815\uc9c0\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uad70 \uc785\ub300 \uc815\uc9c0\ub97c \uc2e0\uccad\ud558\uba74 \ubcf5\ubb34 \uae30\uac04 \ub3d9\uc548 \uc694\uae08 \uc5c6\uc774 \ud734\ub300\ud3f0 \ubc88\ud638\ub97c \uc720\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uad70 \uc785\ub300 \uc815\uc9c0\ub294 \uc785\uc601\ud1b5\uc9c0\uc11c\ub098 \ubcd1\uc801\uc99d\uba85\uc11c\ub97c \uac00\uc9c0\uace0 \ub9e4\uc7a5\uc5d0 \ubc29\ubb38\ud558\uac70\ub098 \uc571\uc5d0\uc11c \uc11c\ub958\ub97c \uc62c\ub824 \uc2e0\uccad\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1496", "t": "\uad70\uc778\uc744 \uc704\ud55c \ud61c\ud0dd\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud604\uc5ed \ubcf5\ubb34 \uc911\uc778 \uc7a5\ubcd1\uc740 \uad70 \uc785\ub300 \uc815\uc9c0\ub85c \ubcf5\ubb34 \uae30\uac04 \ub3d9\uc548 \uc694\uae08 \uc5c6\uc774 \ud68c\uc120\uc744 \uc720\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uad70 \ubcf5\ubb34 \uc911 \ud734\ub300\ud3f0\uc744 \uc4f4\ub2e4\uba74 \uc77c\ubc18 \uc694\uae08\uc81c\uc5d0 \uac00\uc785\ud558\uba74 \ub418\uba70 \ubcc4\ub3c4 \uad70\uc778 \uc804\uc6a9 \uc694\uae08\uc81c\ub294 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0177", "q": "\uc678\uad6d\uc778\uc778\ub370 \uac00\uc785 \uac00\ub2a5?", "g": "ANS", "f": [{"id": "1049", "t": "\uc678\uad6d\uc778\ub3c4 \uac00\uc785\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc678\uad6d\uc778\ub4f1\ub85d\uc99d\uc774 \uc788\ub294 \uc678\uad6d\uc778\uc740 \ud6c4\ubd88 \uc694\uae08\uc81c\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uace0 \uc5ec\uad8c\ub9cc \uc788\ub2e4\uba74 \uc120\ubd88 \uc694\uae08\uc81c\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc678\uad6d\uc778\uc758 \uc628\ub77c\uc778 \uc140\ud504\uac1c\ud1b5\uc740 \uc678\uad6d\uc778\ub4f1\ub85d\uc99d\uc73c\ub85c \ubcf8\uc778\uc778\uc99d\uc774 \ub418\ub294 \uacbd\uc6b0\uc5d0\ub9cc \uac00\ub2a5\ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "1288", "t": "\uc678\uad6d\uc778\ub3c4 eSIM\uc73c\ub85c \uac1c\ud1b5\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc678\uad6d\uc778\ub4f1\ub85d\uc99d\uc774 \uc788\ub294 \uc678\uad6d\uc778\uc740 eSIM\uc73c\ub85c \uac1c\ud1b5\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc678\uad6d\uc778\ub4f1\ub85d\uc99d\uc774 \uc5c6\ub2e4\uba74 \ub9e4\uc7a5\uc5d0\uc11c \uc120\ubd88 \uc694\uae08\uc81c\ub85c \uac1c\ud1b5\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "397", "t": "\uc678\uad6d\uc778 \uce5c\uad6c\uac00 \uac00\uc785\ud558\ub824\ub294\ub370 \ub370\ub824\uac08 \ub9e4\uc7a5\uc744 \ucc3e\uace0 \uc788\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc678\uad6d\uc778 \uce5c\uad6c\uc758 \uc2e0\uaddc \uac00\uc785\uc744 \ucde8\uae09\ud558\ub294 \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc678\uad6d\uc778\uc774 \ud734\ub300\ud3f0\uc5d0 \uc2e0\uaddc \uac00\uc785\ud560 \ub54c\ub294 \uc5ec\uad8c\uacfc \uc678\uad6d\uc778\ub4f1\ub85d\uc99d\uc744 \ud568\uaed8 \uc9c0\ucc38\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "87", "t": "\uc678\uad6d\uc778\ub3c4 \ud734\ub300\ud3f0 \uac00\uc785\uc774 \uac00\ub2a5\ud55c\uac00\uc694?", "s": [{"i": 0, "t": "\uc678\uad6d\uc778\ub3c4 \ubcf8\uc778 \ud655\uc778\uc774 \uac00\ub2a5\ud55c \uc678\uad6d\uc778 \uc2e0\ubd84\uc99d\uacfc \ud544\uc694\ud55c \uc11c\ub958\ub97c \uc900\ube44\ud558\uba74 \ud734\ub300\ud3f0\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0178", "q": "\ud574\uc9c0 \uc2e0\uccad \uc5b4\ub514\uc11c \ud568", "g": "ANS", "f": [{"id": "1417", "t": "\ud734\ub300\ud3f0\uc744 \ud574\uc9c0\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ud68c\uc120\uc740 \uba85\uc758\uc790 \ubcf8\uc778\uc774 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ub9e4\uc7a5\uc744 \ubc29\ubb38\ud558\uac70\ub098 \uace0\uac1d\uc13c\ud130(114)\uc5d0\uc11c \ubcf8\uc778 \ud655\uc778 \ud6c4 \ud574\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0\uc744 \ud574\uc9c0\ud558\uae30 \uc804\uc5d0\ub294 \ub0a8\uc740 \ud560\ubd80\uae08\uacfc \ud560\uc778\ubc18\ud658\uae08\uc744 \uc571\uc5d0\uc11c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "45", "t": "\uc11c\ube44\uc2a4\ub97c \ud574\uc9c0\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud1b5\uc2e0 \uc11c\ube44\uc2a4\ub97c \ud574\uc9c0\ud558\ub824\uba74 \ubcf8\uc778 \uc778\uc99d \ud6c4 \uace0\uac1d\uc13c\ud130 \ub610\ub294 \ub9e4\uc7a5\uc5d0\uc11c \ud574\uc9c0\ub97c \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0180", "q": "\uc9c0\ub09c\ub2ec \uc694\uae08\uc774 \ud3c9\uc18c\ubcf4\ub2e4 2\ub9cc \uc6d0 \ub118\uac8c \ub098\uc654\ub294\ub370 \uc774\uc720\uac00 \ubb58\uae4c\uc694", "g": "ANS", "f": [{"id": "1186", "t": "\uc694\uae08\uc774 \ud3c9\uc18c\ubcf4\ub2e4 \ub9ce\uc774 \ub098\uc654\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc694\uae08\uc774 \ud3c9\uc18c\ubcf4\ub2e4 \ub9ce\uc774 \ub098\uc654\ub2e4\uba74 \uc571\uc758 \uc694\uae08 \uc0c1\uc138 \ub0b4\uc5ed\uc5d0\uc11c \ub370\uc774\ud130 \ucd94\uac00 \uc0ac\uc6a9, \ub85c\ubc0d, \ud734\ub300\ud3f0 \uacb0\uc81c, \ubd80\uac00\uc11c\ube44\uc2a4, \ub2e8\ub9d0 \ud560\ubd80\uae08 \ud56d\ubaa9\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uc6d4 \uc911\uac04\uc5d0 \uc694\uae08\uc81c\ub97c \ubc14\uafe8\ub2e4\uba74 \ub450 \uc694\uae08\uc81c\uc758 \uc694\uae08\uc774 \ub0a0\uc9dc\ubcc4\ub85c \ub098\ub258\uc5b4 \uccad\uad6c\ub3fc \ud3c9\uc18c\uc640 \ub2ec\ub77c \ubcf4\uc77c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1537", "t": "\uc774\ubc88 \ub2ec \uc694\uae08\uc774 \uc65c \ub9ce\uc774 \ub098\uc654\ub294\uc9c0 \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc758 \uc774\ubc88 \ub2ec \uccad\uad6c \ud56d\ubaa9\uc744 \uc9c0\ub09c\ub2ec\uacfc \ube44\uad50\ud574 \ub85c\ubc0d, \ucd94\uac00 \uc0ac\uc6a9, \ubd80\uac00\uc11c\ube44\uc2a4 \uc911 \uc5b4\ub5a4 \uae08\uc561\uc774 \ub298\uc5c8\ub294\uc9c0 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "38", "t": "\ud734\ub300\ud3f0 \uc694\uae08\uc774 \ud3c9\uc18c\ubcf4\ub2e4 \ub9ce\uc774 \ub098\uc654\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc694\uae08\uc774 \ud3c9\uc18c\ubcf4\ub2e4 \ub9ce\uc774 \ub098\uc654\ub2e4\uba74 \ub370\uc774\ud130 \ucd94\uac00 \uc0ac\uc6a9, \ub85c\ubc0d, \uc18c\uc561\uacb0\uc81c, \ubd80\uac00\uc11c\ube44\uc2a4 \ub4f1\uc758 \uc0c1\uc138 \ub0b4\uc5ed\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "710", "t": "\uc81c\uac00 \uc774\ubc88 \ub2ec\uc5d0 \ud1b5\ud654 \uc81c\uacf5\ub7c9\uc744 \ub118\uaca8\uc11c \uc694\uae08\uc774 \ubd99\uc5c8\ub098\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \uc694\uae08\uc81c\uc640 \uc774\ubc88 \ub2ec \ud1b5\ud654 \uc0ac\uc6a9\ub7c9\uc744 \uc870\ud68c\ud574 \uc81c\uacf5\ub7c9 \ucd08\uacfc \uc5ec\ubd80\uc640 \ucd08\uacfc \ud1b5\ud654 \uc694\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "748", "t": "\uc774\ubc88 \ub2ec \uc694\uae08\uc774 \uc9c0\ub09c\ub2ec\ubcf4\ub2e4 \uc65c \ub298\uc5c8\ub294\uc9c0 \ub0b4\uc5ed\uc73c\ub85c \ube44\uad50\ud574 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ucd5c\uadfc \ub450 \ub2ec \uccad\uad6c \ub0b4\uc5ed\uc744 \uc870\ud68c\ud574 \uc774\ubc88 \ub2ec \uc694\uae08\uc774 \uc9c0\ub09c\ub2ec\ubcf4\ub2e4 \ub298\uc5b4\ub09c \ud56d\ubaa9\uacfc \uae08\uc561\uc744 \ube44\uad50\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0181", "q": "\ub2e4\uc74c \ub2ec\uc5d0 \ud574\uc678 \ucd9c\uc7a5\uc744 \uac00\ub294\ub370 \ud604\uc9c0\uc5d0\uc11c \ub370\uc774\ud130\ub97c \uc4f0\uace0 \uc2f6\uc2b5\ub2c8\ub2e4. \uc5b4\ub5a4 \ubc29\ubc95\uc774 \uc788\ub098\uc694", "g": "ANS", "f": [{"id": "1020", "t": "\ud574\uc678\uc5d0\uc11c \ud3ec\ucf13 \uc640\uc774\ud30c\uc774(\ub85c\ubc0d \uc5d0\uadf8)\ub97c \uc4f8 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \ub85c\ubc0d \uc5d0\uadf8\ub97c \ub300\uc5ec\ud558\uba74 \uc5ec\ub7ec \ ub294 \ub370\uc774\ud130\ub97c \ub2e4 \uc4f0\uba74 \ucc28\ub2e8\ub418\uace0 \uc57d\uc815\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0183", "q": "\uc774\uc0ac\ub97c \uac00\uac8c \ub3fc\uc11c \uc778\ud130\ub137\uc744 \uc62e\uaca8\uc57c \ud558\ub294\ub370 \ube44\uc6a9\uc774 \ub4dc\ub294\uc9c0 \uad81\uae08\ud569\ub2c8\ub2e4", "g": "ANS", "f": [{"id": "304", "t": "\uc774\uc0ac \uac08 \ub54c \uc778\ud130\ub137\uc744 \uc62e\uae30\uba74 \ube44\uc6a9\uc774 \ub4dc\ub098\uc694?", "s": [{"i": 0, "t": "\uc774\uc0ac\ud560 \ub54c \uc778\ud130\ub137\uc744 \uc62e\uae30\ub294 \uc774\uc804 \uc124\uce58\ube44\ub294 22,000\uc6d0\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc778\ud130\ub137 \uc774\uc804 \uc124\uce58\ub294 \uc2e0\uccad \ud6c4 \ud3c9\uade0 2~3\uc77c \uc774\ub0b4\uc5d0 \ubc29\ubb38\ud574 \uc9c4\ud589\ud569\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0184", "q": "\ud734\ub300\ud3f0\uc744 \ud0dd\uc2dc\uc5d0 \ub193\uace0 \ub0b4\ub838\ub294\ub370 \uc9c0\uae08 \ud560 \uc218 \uc788\ub294 \uc870\uce58\uac00 \ubb54\uac00\uc694", "g": "ANS", "f": [{"id": "1447", "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\uc5b4\uc694. \uc5b4\ub5bb\uac8c \ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub9ac\uba74 \uba3c\uc800 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\ub098 \uace0\uac1d\uc13c\ud130 ARS(114)\uc5d0\uc11c \ubd84\uc2e4 \uc2e0\uace0\uc640 \ubd84\uc2e4 \uc815\uc9c0\ub97c \ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ubd84\uc2e4 \uc815\uc9c0\ub294 \ubb34\ub8cc\uc774\uace0 \ucd5c\ub300 90\uc77c \ub3d9\uc548 \ub2e4\ub978 \uc0ac\ub78c\uc774 \ub0b4 \ubc88\ud638\ub85c \uc804\ud654\u00b7\uacb0\uc81c\ud558\ub294 \uac83\uc744 \ub9c9\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "51", "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 \uc783\uc5b4\ubc84\ub838\ub2e4\uba74 \uc989\uc2dc \ubd84\uc2e4 \uc2e0\uace0\ub97c \ud558\uace0 \ud68c\uc120\uc744 \uc77c\uc2dc \uc815\uc9c0\ud558\ub294 \uac83\uc744 \uad8c\uc7a5\ud569\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0185", "q": "\ud559\uad50\uc5d0 \ub2e4\ub2c8\ub294 \uc544\uc774\uac00 \uc4f8 \ud3f0\uc778\ub370 \uac8c\uc784 \uacb0\uc81c\uac00 \uac71\uc815\ub429\ub2c8\ub2e4. \ub9c9\uc744 \uc218 \uc788\ub098\uc694", "g": "ANS", "f": [{"id": "1188", "t": "\ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \uc544\uc608 \ub9c9\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \uc644\uc804\ud788 \ucc28\ub2e8\ud558\ub824\uba74 \uc571\uc5d0\uc11c \uacb0\uc81c \ud55c\ub3c4\ub97c 0\uc6d0\uc73c\ub85c \ubc14\uafb8\uac70\ub098 \ubb34\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\uc778 Ubot \ud734\ub300\ud3f0 \uacb0\uc81c \ucc28\ub2e8\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc774\ubbf8 \uc774\ub8e8\uc5b4\uc9c4 \ud734\ub300\ud3f0 \uacb0\uc81c\ub97c \ucde8\uc18c\ud558\ub824\uba74 \uacb0\uc81c\ud55c \uac00\ub9f9\uc810\uc5d0 \uc694\uccad\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "1478", "t": "\ud734\ub300\ud3f0 \uacb0\uc81c \ube44\ubc00\ubc88\ud638\ub97c \uc124\uc815\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\uc758 \ud734\ub300\ud3f0 \uacb0\uc81c \uba54\ub274\uc5d0\uc11c \uacb0\uc81c \ube44\ubc00\ubc88\ud638\ub97c \uc124\uc815\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud734\ub300\ud3f0 \uacb0\uc81c \ube44\ubc00\ubc88\ud638\ub97c \uc124\uc815\ud558\uba74 \uacb0\uc81c\ud560 \ub54c\ub9c8\ub2e4 \ube44\ubc00\ubc88\ud638\ub97c \ud55c \ubc88 \ub354 \uc785\ub825\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "395", "t": "\uc544\uc774 \ud3f0 \uc720\ud574 \uc0ac\uc774\ud2b8 \ucc28\ub2e8 \uc124\uc815\uc744 \ub3c4\uc640\uc904 \uac00\uae4c\uc6b4 \ub9e4\uc7a5\uc744 \ucc3e\uc544\uc694.", "s": [{"i": 0, "t": "\uc790\ub140 \ud734\ub300\ud3f0\uc758 \uc720\ud574 \uc0ac\uc774\ud2b8 \ucc28\ub2e8 \uc124\uc815\uc744 \ub3c4\uc640\uc904 \uc218 \uc788\ub294 \ud604\uc7ac \uc704\uce58 \uc8fc\ubcc0 \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc790\ub140 \ubcf4\ud638 \uc11c\ube44\uc2a4\ub294 \ubb34\ub8cc\uc774\uba70 \uc571\uc5d0\uc11c\ub3c4 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "43", "t": "\ud734\ub300\ud3f0 \uc18c\uc561\uacb0\uc81c\ub97c \ucc28\ub2e8\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc18c\uc561\uacb0\uc81c\ub294 \uc18c\uc561\uacb0\uc81c \uad00\ub9ac \uba54\ub274\ub098 \uace0\uac1d\uc13c\ud130\ub97c \ud1b5\ud574 \ucc28\ub2e8\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "915", "t": "\uc544\uc774 \ud68c\uc120\uc5d0 \uc18c\uc561\uacb0\uc81c\uac00 \ub9c9\ud600 \uc788\ub294\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\uba85\uc758\uc790 \ub3d9\uc758\ub85c \ub4f1\ub85d\ub41c \uc790\ub140 \ud68c\uc120\uc758 \uc18c\uc561\uacb0\uc81c \ucc28\ub2e8 \uc5ec\ubd80\ub97c \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0187", "q": "\ub370\uc774\ud130\ub97c \uc6d4 \ucd08\uc5d0 \ub2e4 \uc368\uc11c \ub0a8\uc740 \uae30\uac04\uc774 \uac71\uc815\uc785\ub2c8\ub2e4. \ucd94\uac00\ub85c \uc0b4 \uc218 \uc788\ub098\uc694", "g": "ANS", "f": [{"id": "1151", "t": "\ub370\uc774\ud130\uac00 \ubaa8\uc790\ub77c\uba74 \ucd94\uac00\ub85c \uc0b4 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub370\uc774\ud130\uac00 \ubaa8\uc790\ub77c\uba74 Ubot \uc571\uc5d0\uc11c \ub370\uc774\ud130 \ud50c\ub7ec\uc2a4 1GB(\uc6d4 3,300\uc6d0), 5GB(\uc6d4 9,900\uc6d0), 10GB(\uc6d4 14,900\uc6d0) \uc911 \ud558\ub098\uc5d0 \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub370\uc774\ud130 \ud50c\ub7ec\uc2a4\ub294 \ub9e4\uc6d4 \uc790\ub3d9 \uac31\uc2e0\ub418\ubbc0\ub85c \ub354 \ud544\uc694\ud558\uc9c0 \uc54a\uc744 \ub54c\ub294 \ud574\uc9c0\ud574 \uc8fc\uc138\uc694.", "y": 0}]}]}, {"id": "Q0188", "q": "\uc774\ubc88 \uc8fc\uc5d0 \uad70\ub300\uc5d0 \uac00\ub294\ub370 \uc694\uae08\uc81c\uc640 \ubc88\ud638\ub97c \uc5b uc804\uc6a9 \uc694\uae08\uc81c\ub294 \uc5c6\uc2b5\ub2c8\ub2e4.", "y": 0}]}]}, {"id": "Q0189", "q": "\ud1b5\ud654\ub97c \ud558\uba74 \uc0c1\ub300\ubc29 \ubaa9\uc18c\ub9ac\uac00 \uc790\uafb8 \ub04a\uaca8\uc11c \uc5c5\ubb34\uc5d0 \uc9c0\uc7a5\uc774 \uc788\uc5b4\uc694. \uc5b4\ub514\uc5d0 \ub9d0\ud558\uba74 \ub418\ub098\uc694", "g": "ANS", "f": [{"id": "1015", "t": "\ud1b5\ud654\ud560 \ub54c \uc18c\ub9ac\uac00 \ub04a\uae30\uac70\ub098 \uc7a1\uc74c\uc774 \ub4e4\ub824\uc694.", "s": [{"i": 0, "t": "\ud1b5\ud654\ud560 \ub54c \uc18c\ub9ac\uac00 \ub04a\uae30\uac70\ub098 \uc7a1\uc74c\uc774 \ub4e4\ub9ac\ub294 \uac83\uc740 \ud2b9\uc815 \uc7a5\uc18c\uc758 \uc804\ud30c \uc0c1\ud0dc\ub098 \ub2e8\ub9d0\uae30 \uc124\uc815 \ub54c\ubb38\uc77c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud1b5\ud654 \ud488\uc9c8\uc774 \ub098\uc058\ub2e4\uba74 \uc704\uce58\ub97c \uc62e\uae30\uace0 \ud734\ub300\ud3f0\uc744 \uc7ac\ubd80\ud305\ud574 \ubcf4\uc138\uc694.", "y": 0}, {"i": 2, "t": "\uc704\uce58\ub97c \uc62e\uae30\uace0 \uc7ac\ubd80\ud305\ud574\ub3c4 \ud1b5\ud654 \ud488\uc9c8 \ubb38\uc81c\uac00 \uacc4\uc18d\ub418\uba74 \uace0\uac1d\uc13c\ud130\uc5d0 \ubc1c\uc0dd \uc7a5\uc18c\uc640 \uc2dc\uac04\uc744 \uc54c\ub824 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "1224", "t": "\ud1b5\ud654 \uc911\uc5d0 \uc18c\ub9ac\uac00 \ub04a\uae30\uac70\ub098 \uc7a1\uc74c\uc774 \uc0dd\uaca8\uc694.", "s": [{"i": 0, "t": "\ud1b5\ud654 \uc911 \uc18c\ub9ac\uac00 \ub04a\uae30\uac70\ub098 \uc7a1\uc74c\uc774 \uc0dd\uae30\uba74 \ud734\ub300\ud3f0\uc744 \uc7ac\ubd80\ud305\ud558\uace0 \uc774\uc5b4\ud3f0\uc774\ub098 \ucf00\uc774\uc2a4\uac00 \ub9c8\uc774\ud06c\ub97c \uac00\ub9ac\uc9c0 \uc54a\ub294\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\ud1b5\ud654 \uc911 \uc7a1\uc74c\uc774\ub098 \ub04a\uae40\uc774 \ud2b9\uc815 \uc7a5\uc18c\uc5d0\uc11c\ub9cc \ubc18\ubcf5\ub418\uba74 \uace0\uac1d\uc13c\ud130\uc5d0 \uc704\uce58\uc640 \uc2dc\uac04\uc744 \uc54c\ub824 \uc8fc\uc2dc\uba74 \ud488\uc9c8\uc744 \uc810\uac80\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "1615", "t": "\uc2e4\ub0b4\uc5d0\uc11c \ud1b5\ud654\uac00 \uc798 \uc548 \ub418\uba74 \ud1b5\uc2e0 \ud488\uc9c8 \uac1c\uc120\uc744 \uc694\uccad\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc2e4\ub0b4 \ud1b5\ud654\uac00 \uc798 \uc548 \ub418\uba74 \ubb38\uc81c\uac00 \ub098\ub294 \uc7a5\uc18c\uc640 \uc2dc\uac04, \ud1b5\ud654 \ub04a\uae40 \ub610\ub294 \uc218\uc2e0 \ubd88\ub7c9 \uc99d\uc0c1\uc744 \uae30\ub85d\ud574 \uace0\uac1d\uc13c\ud130\uc758 \ud1b5\uc2e0 \ud488\uc9c8 \uc0c1\ub2f4 \ucc44\ub110\uc5d0 \uc810\uac80\uc744 \uc694\uccad\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uc2e4\ub0b4 \ud1b5\ud654 \ud488\uc9c8 \uc810\uac80\uc5d0\uc11c\ub294 \ub2e8\ub9d0 \uc124\uc815\uacfc \ud574\ub2f9 \uc9c0\uc5ed\uc758 \ub9dd \uc0c1\ud0dc\ub97c \ud568\uaed8 \ud655\uc778\ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\uc2e4\ub0b4 \ud1b5\ud654 \ud488\uc9c8 \uac1c\uc120 \ubc29\ubc95\uc740 \uc810\uac80 \uacb0\uacfc\uc5d0 \ub530\ub77c \uc548\ub0b4\ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "458", "t": "\ud1b5\ud654\uac00 \uc790\uc8fc \ub04a\uaca8\uc11c \uc9c1\uc811 \uc0c1\ub2f4\ubc1b\uc73c\ub7ec \uac08 \ub9e4\uc7a5\uc744 \ucc3e\uc544\uc694.", "s": [{"i": 0, "t": "\ud1b5\ud654\uac00 \uc790\uc8fc \ub04a\uaca8 \uc9c1\uc811 \uc0c1\ub2f4\ubc1b\uace0 \uc2f6\ub2e4\uba74 \ud604\uc7ac \uc704\uce58 \uc8fc\ubcc0\uc5d0\uc11c \ud1b5\ud654 \ud488\uc9c8 \uc0c1\ub2f4\uc744 \uc9c0\uc6d0\ud558\ub294 \ub9e4\uc7a5\uc744 \ucc3e\uc544 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud1b5\ud654 \ub04a\uae40\uc774 \ubc1c\uc0dd\ud558\ub294 \uc7a5\uc18c\uc640 \uc2dc\uac04, \uc0ac\uc6a9 \uc911\uc778 \ub2e8\ub9d0\uae30\ub97c \uc54c\ub824 \uc8fc\uc2dc\uba74 \ub9e4\uc7a5\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \ud488\uc9c8 \uc810\uac80\uc744 \uc694\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0190", "q": "\uc544\uc774\uac00 \ud3f0\uc744 \ub5a8\uc5b4\ub728\ub824\uc11c \uc561\uc815\uc774 \uae68\uc84c\ub294\ub370 \ubcf4\ud5d8 \ucc98\ub9ac\uac00 \ub418\ub294\uc9c0 \uad81\uae08\ud569\ub2c8\ub2e4", "g": "ANS", "f": [{"id": "1007", "t": "\ud734\ub300\ud3f0 \uc561\uc815\uc774 \uae68\uc84c\uc744 \ub54c \uac00\uc785\ud55c \ubcf4\ud5d8\uc758 \ubcf4\uc0c1\uc740 \uc5b4\ub5bb\uac8c \uc2e0\uccad\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc561\uc815 \ud30c\uc190\uc5d0 \ub300\ud55c \ubcf4\ud5d8\uae08\uc744 \uc2e0\uccad\ud558\ub824\uba74 \uac00\uc785\ud55c \ubcf4\ud5d8 \uc0c1\ud488\uc758 \ud30c\uc190 \ubcf4\uc7a5 \uc5ec\ubd80\uc640 \uc790\uae30\ubd80\ub2f4\uae08\u00b7\uc811\uc218 \uae30\ud55c\uc744 \ud655\uc778\ud55c \ub4a4 \uc9c0\uc815\ub41c \ubcf4\uc0c1 \ucc44\ub110\uc5d0 \uc0ac\uace0 \ub0b4\uc6a9\uacfc \uc218\ub9ac \uc99d\ube59 \ub4f1 \uc694\uad6c \uc11c\ub958\ub97c \uc81c\ucd9c\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uc561\uc815 \ud30c\uc190 \ubcf4\ud5d8\uae08 \uccad\uad6c\uc5d0 \ud544\uc694\ud55c \uc11c\ub958\uc640 \uc808\ucc28\ub294 \ubcf4\ud5d8 \uc0c1\ud488\ubcc4\ub85c \ub2e4\ub97c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1404", "t": "\ud734\ub300\ud3f0 \ubcf4\ud5d8\uc740 \uc5b4\ub5bb\uac8c \uac00\uc785\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \ud734\ub300\ud3f0 \ubcf4\ud5d8\uc740 \uac1c\ud1b5\uc77c\ubd80\ud130 30\uc77c \uc548\uc5d0 \ub9e4\uc7a5\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \uac00\uc785\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ud734\ub300\ud3f0 \ubcf4\ud5d8\uc5d0\ub294 \ud30c\uc190\ud615\uacfc \ubd84\uc2e4\u00b7\ud30c\uc190 \uc885\ud569\ud615\uc774 \uc788\uc73c\uba70 \ubcf4\uc0c1 \uc2dc \uc790\uae30\ubd80\ub2f4\uae08\uc774 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1458", "t": "\ud734\ub300\ud3f0 \uc561\uc815\uc774 \uae68\uc84c\ub294\ub370 \ubcf4\ud5d8\uc73c\ub85c \uc218\ub9ac\ud560 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \uc561\uc815\uc774 \uae68\uc84c\uace0 \ud30c\uc190 \ubcf4\ud5d8\uc5d0 \uac00\uc785\ub418\uc5b4 \uc788\ub2e4\uba74 \uc81c\uc870\uc0ac \uc11c\ube44\uc2a4\uc13c\ud130\uc5d0\uc11c \uba3c\uc800 \uc218\ub9ac\ud55c \ub4a4 \uc218\ub9ac\ube44 \uc601\uc218\uc99d\uc73c\ub85c \ubcf4\ud5d8\uc0ac\uc5d0 \uccad\uad6c\ud558\uba74 \ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud30c\uc190 \ubcf4\ud5d8\uc5d0\uc11c\ub294 \uc218\ub9ac\ube44\uc5d0\uc11c \uc790\uae30\ubd80\ub2f4\uae08\uc744 \ube80 \uae08\uc561\uc744 \ub3cc\ub824\ubc1b\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0192", "q": "\ub0a8\ud3b8 \uba85\uc758 \ud734\ub300\ud3f0\uc744 \uc81c \uba85\uc758\ub85c \ubc14\uafb8\ub824\ub294\ub370 \ub458 \ub2e4 \uac00\uc57c \ud558\ub098\uc694", "g": "ANS", "f": [{"id": "1094", "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \ud558\ub824\uba74 \ubb34\uc5c7\uc774 \ud544\uc694\ud55c\uac00\uc694?", "s": [{"i": 0, "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \ud558\ub824\uba74 \uae30\uc874 \uba85\uc758\uc790\uc640 \uc0c8 \uba85\uc758\uc790\uac00 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ud568\uaed8 \ub9e4\uc7a5\uc5d0 \ubc29\ubb38\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uac00\uc871 \uac04 \uba85\uc758 \ubcc0\uacbd\uc5d0\ub294 \ubc1c\uae09 3\uac1c\uc6d4 \uc774\ub0b4\uc758 \uac00\uc871\uad00\uacc4\uc99d\uba85\uc11c\ub3c4 \uc900\ube44\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 2, "t": "\uba85\uc758 \ubcc0\uacbd\uc5d0 \ud55c \uc0ac\ub78c\ub9cc \ubc29\ubb38\ud55c\ub2e4\uba74 \uc624\uc9c0 \uc54a\ub294 \uc0ac\ub78c\uc758 \uc778\uac10\uc99d\uba85\uc11c\uc640 \uc704\uc784\uc7a5\uc774 \ucd94\uac00\ub85c \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "1606", "t": "\uac00\uc871\uc5d0\uac8c \ud734\ub300\ud3f0 \ud68c\uc120 \uba85\uc758\ub97c \ubcc0\uacbd\ud558\ub824\uba74 \uc5b4\ub5a4 \uc11c\ub958\ub97c \uc900\ube44\ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uac00\uc871\uc5d0\uac8c \ud734\ub300\ud3f0 \ud68c\uc120 \uba85\uc758\ub97c \ubcc0\uacbd\ud558\ub824\uba74 \ud604\uc7ac \uba85\uc758\uc790\uc640 \ubc1b\uc744 \uc0ac\ub78c\uc758 \ubcf8\uc778 \ud655\uc778 \ubc0f \uad00\uacc4 \ud655\uc778\uc5d0 \ud544\uc694\ud55c \uc11c\ub958\ub97c \uc2e0\uccad \ucc44\ub110\uc5d0 \uba3c\uc800 \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\uac00\uc871 \uba85\uc758 \ubcc0\uacbd\uc740 \ub300\ub9ac \uc2e0\uccad \uc5ec\ubd80\uc640 \uac00\uc785 \uc0c1\ud0dc\uc5d0 \ub530\ub77c \ucd94\uac00 \uc11c\ub958\uac00 \ub2ec\ub77c\uc9c8 \uc218 \uc788\uc73c\ubbc0\ub85c \ubc29\ubb38 \uc804\uc5d0 \ud544\uc694\ud55c \ubaa9\ub85d\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "81", "t": "\uba85\uc758 \ubcc0\uacbd\uc774 \uac00\ub2a5\ud55c\uac00\uc694?", "s": [{"i": 0, "t": "\ud5c8\uc6a9\ub418\ub294 \uc870\uac74\uc5d0\uc11c \ubcf8\uc778 \ud655\uc778 \ubc0f \ud544\uc694\ud55c \uc11c\ub958\ub97c \uc81c\ucd9c\ud558\uba74 \uba85\uc758 \ubcc0\uacbd\uc744 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0193", "q": "\uc5b4\uc81c\ubd80\ud130 \ubb38\uc790\ub97c \ubc1b\uc744 \uc218 \uc5c6\uace0 \ubc1c\uc2e0\ub9cc \ub429\ub2c8\ub2e4. \uc65c \uc774\ub7f4\uae4c\uc694", "g": "ANS", "f": [{"id": "183", "t": "\ubb38\uc790\uac00 \uc624\uac00\uc9c0 \uc54a\uc744 \ub54c\ub294 \ubb34\uc5c7\uc744 \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ubb38\uc790\uac00 \uc624\uac00\uc9c0 \uc54a\uc744 \ub54c\ub294 \uc800\uc7a5 \uacf5\uac04\uacfc \uc2a4\ud338 \ucc28\ub2e8 \uc124\uc815\uc744 \ud655\uc778\ud558\uace0 \uba54\uc2dc\uc9c0 \uc571 \uc124\uc815\uc744 \uc810\uac80\ud55c \ub4a4 \ud734\ub300\ud3f0\uc744 \uc7ac\ubd80\ud305\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "62", "t": "\ubb38\uc790 \uba54\uc2dc\uc9c0\ub97c \ubc1b\uc9c0 \ubabb\ud558\uace0 \uc788\uc5b4\uc694.", "s": [{"i": 0, "t": "\ubb38\uc790 \uba54\uc2dc\uc9c0\ub97c \ubc1b\uc9c0 \ubabb\ud55c\ub2e4\uba74 \uc218\uc2e0 \ucc28\ub2e8 \uc124\uc815\uacfc \uc800\uc7a5 \uacf5\uac04, \ub124\ud2b8\uc6cc\ud06c \uc0c1\ud0dc\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}]}]}, {"id": "Q0194", "q": "\ud734\ub300\ud3f0 \uc694\uae08\uc774 \uc790\ub3d9\uc774\uccb4\ub85c \ube60\uc9c0\ub294 \ud1b5\uc7a5\uc744 \ubc14\uafb8\uace0 \uc2f6\uc740\ub370 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694", "g": "ANS", "f": [{"id": "1163", "t": "\uc790\ub3d9\uc774\uccb4\ub97c \uc2e0\uccad\ud558\uac70\ub098 \uacc4\uc88c\ub97c \ubc14\uafb8\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc790\ub3d9\uc774\uccb4\ub97c \uc2e0\uccad\ud558\uac70\ub098 \uacc4\uc88c\ub97c \ubc14\uafb8\ub824\uba74 Ubot \uc571\u00b7\ud648\ud398\uc774\uc9c0\uc5d0\uc11c \ubcf8\uc778\uc778\uc99d \ud6c4 \ub0a9\ubd80 \ubc29\ubc95 \uba54\ub274\uc5d0 \uacc4\uc88c\ub098 \uce74\ub4dc\ub97c \ub4f1\ub85d\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc790\ub3d9\uc774\uccb4 \uc2e0\uccad\uc740 \ub2e4\uc74c \ub0a9\ubd80\uc77c\ubd80\ud130 \uc801\uc6a9\ub418\uba70 \ucc98\ub9ac \uc911\uc5d0\ub294 \ub0a9\ubd80 \ubc29\ubc95\uc774 '\uc9c0\ub85c \ub0a9\ubd80'\ub85c \ubcf4\uc77c \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "40", "t": "\uc790\ub3d9\uc774\uccb4 \uacc4\uc88c\ub97c \ubcc0\uacbd\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uc790\ub3d9\uc774\uccb4 \uacc4\uc88c\ub294 \ubcf8\uc778 \uc778\uc99d \ud6c4 \ub0a9\ubd80 \uacc4\uc88c\ub97c \ubcc0\uacbd\ud558\ub294 \ubc29\uc2dd\uc73c\ub85c \ubc14\uafc0 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0197", "q": "\ud1b5\uc2e0\uc0ac\ub97c \ubc14\uafc0\uae4c \uace0\ubbfc \uc911\uc778\ub370 \uc9c0\uae08 \uc694\uae08\uc81c\uc758 \ub0a8\uc740 \ud560\ubd80\uae08\uc740 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694", "g": "ANS", "f": [{"id": "1397", "t": "\ub0a8\uc740 \ud560\ubd80\uae08\uc740 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\uc758 \uac00\uc785 \uc815\ubcf4\uc5d0\uc11c \ub0a8\uc740 \ud560\ubd80 \uc6d0\uae08, \ub0a8\uc740 \uac1c\uc6d4 \uc218, \uc774\ubc88 \ub2ec \ud560\ubd80\uae08\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1421", "t": "\ud574\uc9c0\ud558\uba74 \ub0a8\uc740 \ub2e8\ub9d0 \ud560\ubd80\uae08\uc740 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ud68c\uc120\uc744 \ud574\uc9c0\ud574\ub3c4 \ub0a8\uc740 \ub2e8\ub9d0 \ud560\ubd80\uae08\uc740 \uc6d0\ub798 \uc77c\uc815\ub300\ub85c \ub9e4\uc6d4 \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud574\uc9c0\ud558\uba74\uc11c \ub2e8\ub9d0 \ud560\ubd80\uae08\uc744 \ud55c \ubc88\uc5d0 \uc815\ub9ac\ud558\ub824\uba74 \ub9e4\uc7a5\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \ub0a8\uc740 \ud560\ubd80\uae08\uc744 \uc77c\uc2dc \ub0a9\ubd80\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1547", "t": "\uc81c \ud734\ub300\ud3f0 \ud560\ubd80\uae08\uc774 \uc5bc\ub9c8\ub098 \ub0a8\uc558\ub098\uc694?", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc758 \ud560\ubd80 \uae30\uae30\uba85, \ud560\ubd80 \uac1c\uc6d4 \uc218\uc640 \ub0b8 \uac1c\uc6d4 \uc218, \uc6d4 \ud560\ubd80\uae08, \ub0a8\uc740 \ud560\ubd80 \uc6d0\uae08\uc744 \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "222", "t": "\uc57d\uc815 \uc911\uc5d0 \ubc88\ud638\uc774\ub3d9\uc744 \ud558\uba74 \ubb34\uc5c7\uc774 \uccad\uad6c\ub418\ub098\uc694?", "s": [{"i": 0, "t": "\uc57d\uc815 \uae30\uac04 \uc911 \ubc88\ud638\uc774\ub3d9\uc744 \ud558\uba74 \ub0a8\uc740 \uae30\uac04\uc5d0 \ud574\ub2f9\ud558\ub294 \ud560\uc778\ubc18\ud658\uae08\uc774 \uccad\uad6c\ub418\uba70 \uc608\uc0c1 \uae08\uc561\uc740 \uc571\uc5d0\uc11c \uc870\ud68c\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uc57d\uc815 \uc911 \ubc88\ud638\uc774\ub3d9\uc744 \ud558\ub354\ub77c\ub3c4 \ub2e8\ub9d0 \ud560\ubd80\uac00 \ub0a8\uc544 \uc788\ub2e4\uba74 \ud560\ubd80\uae08\uc740 \uacc4\uc18d \uccad\uad6c\ub429\ub2c8\ub2e4.", "y": 1}]}, {"id": "48", "t": "\ud574\uc9c0\ud558\uba74 \ub0a8\uc740 \ub2e8\ub9d0\uae30 \ud560\ubd80\uae08\uc740 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ud1b5\uc2e0 \uc11c\ube44\uc2a4\ub97c \ud574\uc9c0\ud574\ub3c4 \ub0a8\uc740 \ub2e8\ub9d0\uae30 \ud560\ubd80\uae08\uc740 \uacc4\uc18d \ub0a9\ubd80\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "772", "t": "\uc9c0\uae08 \ud560\ubd80\ub97c \ud55c \ubc88\uc5d0 \uac1a\uc73c\uba74 \uc5bc\ub9c8\ub97c \ub0b4\uc57c \ud574\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ub2e8\ub9d0 \ud560\ubd80 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \uc624\ub298 \ud55c \ubc88\uc5d0 \uac1a\uc744 \ub54c \ud544\uc694\ud55c \uc911\ub3c4 \uc644\ub0a9 \uae08\uc561\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\ub2e8\ub9d0 \ud560\ubd80\ub97c \uc911\ub3c4 \uc644\ub0a9\ud560 \ub54c\ub294 \ub0a8\uc740 \uc6d0\uae08\ub9cc \ub0a9\ubd80\ud558\uba74 \ub429\ub2c8\ub2e4.", "y": 0}]}, {"id": "939", "t": "\ud560\ubd80 \uc6d0\uae08 \ub0a8\uc740 \uac70 \uc5bc\ub9c8\uc608\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ub2e8\ub9d0 \ud560\ubd80 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \ub0a8\uc740 \uc6d0\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0198", "q": "\uc624\ub798 \uc4f4 \uace0\uac1d\uc778\ub370 \uc7a5\uae30 \uace0\uac1d \ud61c\ud0dd\uc774 \ub530\ub85c \uc788\ub294\uc9c0 \uad81\uae08\ud569\ub2c8\ub2e4", "g": "ANS", "f": [{"id": "1380", "t": "\uc624\ub798 \uc4f4 \uac00\uc871\uc5d0\uac8c \uc8fc\ub294 \uacb0\ud569 \ud61c\ud0dd\uc774 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uac00\uc871 \uc624\ub798\ud568\uaed8\ub294 \ub300\ud45c \ud68c\uc120\uc744 36\uac1c\uc6d4 \uc774\uc0c1 \uc5f0\uc18d \uc774\uc6a9\ud558\uace0 \ud734\ub300\ud3f0 2\ud68c\uc120 \uc774\uc0c1\uc744 \uacb0\ud569\ud558\uba74 \uc6d4 10,000\uc6d0\uc744 \ud560\uc778\ud569\ub2c8\ub2e4.", "y": 1}]}, {"id": "1399", "t": "\ud734\ub300\ud3f0\uc744 2\ub144 \ub118\uac8c \uc4f0\uba74 \uc790\ub3d9\uc73c\ub85c \uc694\uae08 \ud560\uc778\uc774 \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0\uc744 2\ub144 \ub118\uac8c \uc368\ub3c4 \uc694\uae08 \ud560\uc778\uc774 \uc790\ub3d9\uc73c\ub85c \uc801\uc6a9\ub418\uc9c0\ub294 \uc54a\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uc57d\uc815\uc774 \ub05d\ub09c \ud734\ub300\ud3f0\uc744 \uacc4\uc18d \uc4f4\ub2e4\uba74 \uc571\uc5d0\uc11c \uc120\ud0dd\uc57d\uc815\uc744 \uc2e0\uccad\ud574 \uc694\uae08 25% \ud560\uc778\uc744 \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "297", "t": "\uba64\ubc84\uc2ed\uc5d0 \ub300\ud574 \ub354 \uc54c\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uba64\ubc84\uc2ed \ub4f1\uae09, \ud61c\ud0dd, \uc81c\ud734\ucc98\ub294 \uc571\uc758 \uba64\ubc84\uc2ed \uba54\ub274\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}, {"i": 1, "t": "\uba64\ubc84\uc2ed\uc5d0 \uad00\ud574 \uad81\uae08\ud55c \uc810\uc740 \uace0\uac1d\uc13c\ud130\ub098 AI \ucc57\ubd07\uc73c\ub85c \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}]}]}, {"id": "Q0199", "q": "\uc678\uad6d\uc5d0\uc11c \ud55c\uad6d \ubc88\ud638\ub85c \uc778\uc99d \ubb38\uc790\ub97c \ubc1b\uc544\uc57c \ud558\ub294\ub370 \ubc29\ubc95\uc774 \uc788\ub098\uc694", "g": "ANS", "f": [{"id": "1310", "t": "\ud574\uc678\uc5d0\uc11c\ub3c4 \uc778\uc99d \ubb38\uc790\ub97c \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678 \ub85c\ubc0d \uc911\uc5d0\ub3c4 \uc740\ud589\u00b7\uc1fc\ud551\ubab0\uc758 \uc778\uc99d \ubb38\uc790\ub97c \ubc1b\uc744 \uc218 \uc788\uace0 \ubb38\uc790 \uc218\uc2e0\uc740 \ubb34\ub8cc\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub370\uc774\ud130 \ub85c\ubc0d\uc744 \ucc28\ub2e8\ud574\ub3c4 \ud574\uc678 \uc778\uc99d \ubb38\uc790\ub294 \ubc1b\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "1613", "t": "\ud574\uc678\uc5d0\uc11c \ud604\uc9c0 \uc720\uc2ec\uc744 \uc0ac\uc6a9\ud558\ub294 \ub3d9\uc548 \uad6d\ub0b4 \ubc88\ud638\ub85c \uc624\ub294 \ubb38\uc790\ub97c \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \ud604\uc9c0 \uc720\uc2ec\uc744 \uc4f0\ub294 \ub3d9\uc548 \uad6d\ub0b4 \ubc88\ud638\ub85c \ubb38\uc790\ub97c \ubc1b\uc73c\ub824\uba74 \uad6d\ub0b4 \ud68c\uc120\uc774 \ud734\ub300 uc120\uc758 \ucd5c\uadfc \ub370\uc774\ud130\u00b7\ud1b5\ud654 \uc0ac\uc6a9\ub7c9\uacfc \ud604\uc7ac \uc694\uae08\uc81c\ub97c \uc870\ud68c\ud574, \uc0ac\uc6a9\ub7c9\uc5d0 \ub9de\ub294 Ubot \uc694\uae08\uc81c\ub97c \ube44\uad50\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "67", "t": "\uc694\uae08\uc81c\ub97c \ubcc0\uacbd\ud558\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc694\uae08\uc81c\ub294 \uc571, \ud648\ud398\uc774\uc9c0, \uace0\uac1d\uc13c\ud130 \ub610\ub294 \ub9e4\uc7a5\uc5d0\uc11c \ubcc0\uacbd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "70", "t": "\ub370\uc774\ud130 \uc0ac\uc6a9\ub7c9\uc774 \uc801\uc740 \uc0ac\ub78c\uc5d0\uac8c \uc801\ud569\ud55c \uc694\uae08\uc81c\uac00 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ub370\uc774\ud130 \uc0ac\uc6a9\ub7c9\uc774 \uc801\ub2e4\uba74 \uc18c\ub7c9 \ub370\uc774\ud130 \uc911\uc2ec\uc758 \uc800\uac00 \uc694\uae08\uc81c\ub97c \uc120\ud0dd\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0214", "q": "\ud574\uc678\uc5d0\uc11c \ud55c\uad6d\uc73c\ub85c \ub3cc\uc544\uc624\uc790\ub9c8\uc790 \ud734\ub300\ud3f0\uc744 \uc815\uc0c1 \uc0ac\uc6a9\ud558\ub824\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694", "g": "ANS", "f": [{"id": "1318", "t": "\uadc0\uad6d\ud588\ub294\ub370 \ub370\uc774\ud130\uac00 \uc548 \ub3fc\uc694.", "s": [{"i": 0, "t": "\uadc0\uad6d \ud6c4 \ub370\uc774\ud130\uac00 \uc5f0\uacb0\ub418\uc9c0 \uc54a\uc73c\uba74 \ud734\ub300\ud3f0\uc744 \uc7ac\ubd80\ud305\ud558\uace0 \ub124\ud2b8\uc6cc\ud06c \uc120\ud0dd\uc744 \uc790\ub3d9\uc73c\ub85c \ubc14\uafd4 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ud574\uc678\uc5d0\uc11c \ud604\uc9c0 \ud1b5\uc2e0\uc0ac\ub97c \uc218\ub3d9 \uc120\ud0dd\ud588\uac70\ub098 \ud604\uc9c0 \uc720\uc2ec\uc744 \uc0ac\uc6a9\ud588\ub2e4\uba74 \uadc0\uad6d \ud6c4 APN \uc124\uc815\uc744 \ucd08\uae30\ud654\ud574\uc57c \ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0215", "q": "\uc4f0\ub358 \ud3f0\uc744 \ub3d9\uc0dd\uc5d0\uac8c \ubb3c\ub824\uc8fc\ub824\ub294\ub370 \uba85\uc758\uc640 \uc694\uae08\uc81c\ub294 \uc5b4\ub5bb\uac8c \ud558\uc8e0", "g": "ANS", "f": [{"id": "1094", "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \ud558\ub824\uba74 \ubb34\uc5c7\uc774 \ud544\uc694\ud55c\uac00\uc694?", "s": [{"i": 0, "t": "\uba85\uc758 \ubcc0\uacbd\uc744 \ud558\ub824\uba74 \uae30\uc874 \uba85\uc758\uc790\uc640 \uc0c8 \uba85\uc758\uc790\uac00 \uc2e0\ubd84\uc99d\uc744 \uac00\uc9c0\uace0 \ud568\uaed8 \ub9e4\uc7a5\uc5d0 \ubc29\ubb38\ud574\uc57c \ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uac00\uc871 \uac04 \uba85\uc758 \ubcc0\uacbd\uc5d0\ub294 \ubc1c\uae09 3\uac1c\uc6d4 \uc774\ub0b4\uc758 \uac00\uc871\uad00\uacc4\uc99d\uba85\uc11c\ub3c4 \uc900\ube44\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 2, "t": "\uba85\uc758 \ubcc0\uacbd\uc5d0 \ud55c \uc0ac\ub78c\ub9cc \ubc29\ubb38\ud55c\ub2e4\uba74 \uc624\uc9c0 \uc54a\ub294 \uc0ac\ub78c\uc758 \uc778\uac10\uc99d\uba85\uc11c\uc640 \uc704\uc784\uc7a5\uc774 \ucd94\uac00\ub85c \ud544\uc694\ud569\ub2c8\ub2e4.", "y": 0}]}, {"id": "1606", "t": "\uac00\uc871\uc5d0\uac8c \ud734\ub300\ud3f0 \ud68c\uc120 \uba85\uc758\ub97c \ubcc0\uacbd\ud558\ub824\uba74 \uc5b4\ub5a4 \uc11c\ub958\ub97c \uc900\ube44\ud574\uc57c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\uac00\uc871\uc5d0\uac8c \ud734\ub300\ud3f0 \ud68c\uc120 \uba85\uc758\ub97c \ubcc0\uacbd\ud558\ub824\uba74 \ud604\uc7ac \uba85\uc758\uc790\uc640 \ubc1b\uc744 \uc0ac\ub78c\uc758 \ubcf8\uc778 \ud655\uc778 \ubc0f \uad00\uacc4 \ud655\uc778\uc5d0 \ud544\uc694\ud55c \uc11c\ub958\ub97c \uc2e0\uccad \ucc44\ub110\uc5d0 \uba3c\uc800 \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}, {"i": 1, "t": "\uac00\uc871 \uba85\uc758 \ubcc0\uacbd\uc740 \ub300\ub9ac \uc2e0\uccad \uc5ec\ubd80\uc640 \uac00\uc785 \uc0c1\ud0dc\uc5d0 \ub530\ub77c \ucd94\uac00 \uc11c\ub958\uac00 \ub2ec\ub77c\uc9c8 \uc218 \uc788\uc73c\ubbc0\ub85c \ubc29\ubb38 \uc804\uc5d0 \ud544\uc694\ud55c \ubaa9\ub85d\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "221", "t": "\uba85\uc758\ub97c \ubc14\uafb8\uba74 \uc57d\uc815\uacfc \ud560\ubd80\ub294 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ud68c\uc120 \uba85\uc758\ub97c \ubcc0\uacbd\ud558\uba74 \uc57d\uc815\uacfc \ud560\ubd80 \uc870\uac74\uc740 \ud68c\uc120\uc5d0 \ub0a8\uc544 \uc0c8 \uba85\uc758\uc790\uac00 \uc2b9\uacc4\ud569\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\uba85\uc758 \ubcc0\uacbd\uc5d0 \ub530\ub978 \uc57d\uc815\uacfc \ud560\ubd80\uc758 \uc790\uc138\ud55c \uc870\uac74\uc740 \ub9e4\uc7a5\uc5d0\uc11c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 0}]}]}, {"id": "Q0216", "q": "\ud1b5\uc2e0\uc0ac \uc571 \ub85c\uadf8\uc778\uc774 \uc548 \ub418\ub294\ub370 \ubcf8\uc778 \uc778\uc99d \ubb38\uc790\ub3c4 \uc548 \uc635\ub2c8\ub2e4", "g": "ANS", "f": [{"id": "1012", "t": "\ud734\ub300\ud3f0 \ubcf8\uc778 \uc778\uc99d \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc73c\uba74 \ubb34\uc5c7\uc744 \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ud734\ub300\ud3f0 \ubcf8\uc778 \uc778\uc99d \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc73c\uba74 \ud734\ub300\ud3f0\uc758 \uc2e0\ud638\u00b7\ubb38\uc790 \uc218\uc2e0 \uc0c1\ud0dc\uc640 \uc2a4\ud338 \ucc28\ub2e8\ud568, \uc778\uc99d \uc694\uccad \ud69f\uc218 \uc81c\ud55c \uc5ec\ubd80\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uc77c\ubc18 \ubb38\uc790\ub3c4 \ubc1b\uc9c0 \ubabb\ud55c\ub2e4\uba74 \ud68c\uc120\uc774\ub098 \uae30\uae30 \ubb38\uc81c\ub97c \uc810\uac80\ubc1b\uc544 \uc8fc\uc138\uc694.", "y": 0}, {"i": 2, "t": "\ud2b9\uc815 \uc11c\ube44\uc2a4\uc758 \uc778\uc99d \ubb38\uc790\ub9cc \uc624\uc9c0 \uc54a\ub294\ub2e4\uba74 \ud574\ub2f9 \uc11c\ube44\uc2a4\uc758 \ubb38\uc790 \ubc1c\uc1a1 \uc0c1\ud0dc\ub97c \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1469", "t": "\ubcf8\uc778\uc778\uc99d \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc544\uc694.", "s": [{"i": 0, "t": "\ubcf8\uc778\uc778\uc99d \ubb38\uc790\uac00 \uc624\uc9c0 \uc54a\uc73c\uba74 \uc2a4\ud338 \ucc28\ub2e8 \uc571, \uba54\uc2dc\uc9c0 \uc218\uc2e0 \ucc28\ub2e8 \uc124\uc815, \ubb38\uc790\ud568 \uc800\uc7a5 \uacf5\uac04\uc744 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uc778\uc99d \uc694\uccad\uc744 \uc9e7\uc740 \uc2dc\uac04\uc5d0 \uc5ec\ub7ec \ubc88 \ubc18\ubcf5\ud558\uba74 \ubcf8\uc778\uc778\uc99d\uc774 \uc7a0\uc2dc \uc81c\ud55c\ub420 \uc218 \uc788\uc73c\ub2c8 \uba87 \ubd84 \ub4a4 \ub2e4\uc2dc \uc2dc\ub3c4\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1498", "t": "Ubot \uc571\uc774 \uc2e4\ud589\ub418\uc9c0 \uc54a\uc544\uc694.", "s": [{"i": 0, "t": "Ubot \uc571\uc774 \uc2e4\ud589\ub418\uc9c0 \uc54a\uc73c\uba74 \uc571\uc744 \ucd5c\uc2e0 \ubc84\uc804\uc73c\ub85c \uc5c5\ub370\uc774\ud2b8\ud558\uace0 \ud734\ub300\ud3f0\uc744 \ub2e4\uc2dc \ucf1c \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\uadf8\ub798\ub3c4 Ubot \uc571\uc774 \uc2e4\ud589\ub418\uc9c0 \uc54a\uc73c\uba74 \uc571 \uce90\uc2dc\ub97c \uc9c0\uc6b0\uac70\ub098 \uc571\uc744 \uc0ad\uc81c \ud6c4 \ub2e4\uc2dc \uc124\uce58\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 2, "t": "\uc571 \ubb38\uc81c\uac00 \uacc4\uc18d\ub418\uba74 \ud648\ud398\uc774\uc9c0\uc5d0\uc11c \uac19\uc740 \uc5c5\ubb34\ub97c \uc774\uc6a9\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "62", "t": "\ubb38\uc790 \uba54\uc2dc\uc9c0\ub97c \ubc1b\uc9c0 \ubabb\ud558\uace0 \uc788\uc5b4\uc694.", "s": [{"i": 0, "t": "\ubb38\uc790 \uba54\uc2dc\uc9c0\ub97c \ubc1b\uc9c0 \ubabb\ud55c\ub2e4\uba74 \uc218\uc2e0 \ucc28\ub2e8 \uc124\uc815\uacfc \uc800\uc7a5 \uacf5\uac04, \ub124\ud2b8\uc6cc\ud06c \uc0c1\ud0dc\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}]}]}, {"id": "Q0219", "q": "\uc5b4\uc81c \ub85c\ubc0d\uc744 \uc2e0\uccad\ud588\ub294\ub370 \ud574\uc678\uc5d0 \ub098\uc640 \ubcf4\ub2c8 \ub370\uc774\ud130\uac00 \uc548 \ud130\uc9d1\ub2c8\ub2e4", "g": "ANS", "f": [{"id": "1004", "t": "\ub85c\ubc0d \uc0c1\ud488\uc744 \uc2e0\uccad\ud588\ub294\ub370 \ud574\uc678 \ud604\uc9c0\uc5d0\uc11c \ubaa8\ubc14\uc77c \ub370\uc774\ud130\uac00 \uc548 \ub418\uba74 \uc5b4\ub5bb\uac8c \ud558\ub098\uc694?", "s": [{"i": 0, "t": "\ub85c\ubc0d \uc0c1\ud488\uc5d0 \uac00\uc785\ud588\ub294\ub370 \ud574\uc678\uc5d0\uc11c \ubaa8\ubc14\uc77c \ub370\uc774\ud130\uac00 \uc5f0\uacb0\ub418\uc9c0 \uc54a\uc73c\uba74 \ubc29\ubb38 \uad6d\uac00\uac00 \uc0c1\ud488 \uc9c0\uc6d0 \uc9c0\uc5ed\uc778\uc9c0, \uc0ac\uc6a9 \uc2dc\uc791 \uc2dc\uc810\uc774 \uc9c0\ub0ac\ub294\uc9c0, \ud734\ub300\ud3f0\uc758 \ub370\uc774\ud130 \ub85c\ubc0d \uc124\uc815\uacfc \ud604\uc9c0 \ub9dd \uc811\uc18d \uc0c1\ud0dc\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ud574\uc678\uc5d0\uc11c \ud734\ub300\ud3f0\uc744 \uc7ac\uc2dc\uc791\ud55c \ub4a4\uc5d0\ub3c4 \ubaa8\ubc14\uc77c \ub370\uc774\ud130\uac00 \uc5f0\uacb0\ub418\uc9c0 \uc54a\uc73c\uba74 \uacf5\uc2dd \ub85c\ubc0d \uc0c1\ub2f4 \ucc44\ub110\uc5d0 \uad6d\uac00\uc640 \uc99d\uc0c1\uc744 \uc54c\ub824 \uc810\uac80\uc744 \uc694\uccad\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "1313", "t": "\ud574\uc678\uc5d0\uc11c \ub85c\ubc0d\uc774 \ub418\uc9c0 \uc54a\uc544\uc694.", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0\uc11c \ub85c\ubc0d\uc774 \ub418\uc9c0 \uc54a\uc73c\uba74 \ud734\ub300\ud3f0\uc744 \uc7ac\ubd80\ud305\ud558\uace0 \ub370\uc774\ud130 \ub85c\ubc0d\uc774 \ucf1c\uc838 \uc788\ub294\uc9c0\uc640 \ub124\ud2b8\uc6cc\ud06c \uc120\ud0dd\uc774 \uc790\ub3d9\uc778\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ud574\uc678 \ub85c\ubc0d\uc774 \uacc4\uc18d\ub418\uc9c0 \uc54a\uc73c\uba74 \ub2e4\ub978 \ud604\uc9c0 \ud1b5\uc2e0\uc0ac\ub97c \uc218\ub3d9\uc73c\ub85c \uc120\ud0dd\ud574 \ubcf4\uc138\uc694.", "y": 1}, {"i": 2, "t": "\ud604\uc9c0 \ud1b5\uc2e0\uc0ac\ub97c \ubc14\uafd4\ub3c4 \ub85c\ubc0d \ubb38\uc81c\uac00 \ud574\uacb0\ub418\uc9c0 \uc54a\uc73c\uba74 \ub85c\ubc0d \uace0\uac1d\uc13c\ud130\uc5d0 \uc5f0\ub77d\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "202", "t": "\ud574\uc678\uc5d0 \ub3c4\ucc29\ud588\ub294\ub370 \ub370\uc774\ud130\uac00 \uc548 \ub3fc\uc694.", "s": [{"i": 0, "t": "\ud574\uc678\uc5d0 \ub3c4\ucc29\ud588\ub294\ub370 \ub370\uc774\ud130\uac00 \uc5f0\uacb0\ub418\uc9c0 \uc54a\uc73c\uba74 \ud734\ub300\ud3f0 \uc124\uc815\uc5d0\uc11c \ub370\uc774\ud130 \ub85c\ubc0d\uc774 \ucf1c\uc838 \uc788\ub294\uc9c0 \ud655\uc778\ud558\uace0 \uc571\uc5d0\uc11c \ub85c\ubc0d \ucc28\ub2e8 \uc5ec\ubd80\ub97c \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}, {"i": 1, "t": "\ud574\uc678 \ub370\uc774\ud130\uac00 \uc5f0\uacb0\ub418\uc9c0 \uc54a\ub294\ub2e4\uba74 \ub85c\ubc0d \ud328\uc2a4 \uac00\uc785 \uc5ec\ubd80\ub3c4 \ud568\uaed8 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "y": 1}]}, {"id": "979", "t": "\uc81c \ud3f0\uc5d0 \ub370\uc774\ud130 \ub85c\ubc0d\uc774 \ub9c9\ud600 \uc788\ub294\uc9c0 \ud655\uc778\ud574 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uc815\ubcf4\ub97c \uc870\ud68c\ud574 \ub370\uc774\ud130 \ub85c\ubc0d \ucc28\ub2e8 \uc124\uc815 \uc5ec\ubd80\ub97c \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0220", "q": "\uae30\ucd08\uc0dd\ud65c\uc218\uae09\uc790\uc778\ub370 \ud1b5\uc2e0 \uc694\uae08 \uac10\uba74\uc744 \ubc1b\uc744 \uc218 \uc788\ub098\uc694", "g": "ANS", "f": [{"id": "1017", "t": "\uc7a5\uc560\uc778\uc774\ub098 \uae30\ucd08\uc218\uae09\uc790\ub3c4 \uc694\uae08 \uac10\uba74\uc744 \ubc1b\uc744 \uc218 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\uc7a5\uc560\uc778\uc774\ub098 \uae30\ucd08\uc0dd\ud65c\uc218\uae09\uc790 \ub4f1 \uac10\uba74 \ub300\uc0c1\uc5d0 \ud574\ub2f9\ud558\uace0 \uc870\uac74\uc744 \ucda9\uc871\ud558\uba74 \ud1b5\uc2e0\uc694\uae08 \uac10\uba74\uc744 \uc2e0\uccad\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud1b5\uc2e0\uc694\uae08 \uac10\uba74 \ub300\uc0c1 \ud655\uc778\uc5d0\ub294 \uc99d\ube59 \uc11c\ub958\uac00 \ud544\uc694\ud560 \uc218 \uc788\uc73c\ub2c8 \uace0\uac1d\uc13c\ud130\ub098 \ub9e4\uc7a5\uc5d0 \ubb38\uc758\ud574 \uc8fc\uc138\uc694.", "y": 0}]}, {"id": "1492", "t": "\ubcf5\uc9c0 \ud560\uc778 \ub300\uc0c1\uc740 \ub204\uad6c\uc778\uac00\uc694?", "s": [{"i": 0, "t": "\ubcf5\uc9c0 \ud560\uc778 \ub300\uc0c1\uc740 \uc7a5\uc560\uc778, \uad6d\uac00\uc720\uacf5\uc790, \uae30\ucd08\uc0dd\ud65c\uc218\uae09\uc790, \ucc28\uc0c1\uc704\uacc4\uce35, \uae30\ucd08\uc5f0\uae08 \uc218\uae09\uc790\uc785\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ubcf5\uc9c0 \ud560\uc778 \uae08\uc561\uc740 \ub300\uc0c1\ubcc4\ub85c \ub2e4\ub985\ub2c8\ub2e4.", "y": 0}, {"i": 2, "t": "\ubcf5\uc9c0 \ud560\uc778\uc740 \ub9e4\uc7a5\uc774\ub098 \uace0\uac1d\uc13c\ud130\uc5d0\uc11c \uc2e0\uccad\ud558\uba74 \uc815\ubd80 \uc790\uaca9 \ud655\uc778 \ud6c4 \uc801\uc6a9\ub429\ub2c8\ub2e4.", "y": 1}]}]}, {"id": "Q0222", "q": "\ub9e4\ub2ec \uccad\uad6c\uc11c\uc5d0 \ubaa8\ub974\ub294 \ubd80\uac00\uc11c\ube44\uc2a4 \uc694\uae08\uc774 \uc788\uc5b4\uc11c \ud655\uc778\ud558\uace0 \uc2f6\uc5b4\uc694", "g": "ANS", "f": [{"id": "1073", "t": "\uac00\uc785\ud55c \uc801 \uc5c6\ub294 \uc720\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\uac00 \uc788\uc5b4\uc694.", "s": [{"i": 0, "t": "\uac00\uc785\ud55c \uc801 \uc5c6\ub294 \uc720\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\uac00 \uc788\ub2e4\uba74 Ubot \uc571\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uba54\ub274\uc5d0\uc11c \uac00\uc785 \uc77c\uc2dc\uc640 \uacbd\ub85c\ub97c \ud655\uc778\ud558\uace0 \ubc14\ub85c \ud574\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ub3d9\uc758 \uc5c6\uc774 \uac00\uc785\ub41c \uc720\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\ub85c \ud655\uc778\ub418\uba74 \uace0\uac1d\uc13c\ud130(114)\uc5d0\uc11c \uac00\uc785\uc77c\ubd80\ud130\uc758 \uc694\uae08\uc744 \ub3cc\ub824 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 0}]}, {"id": "1327", "t": "\uac00\uc785\ub41c \ubd80\uac00\uc11c\ube44\uc2a4\ub294 \uc5b4\ub514\uc5d0\uc11c \ud655\uc778\ud558\ub098\uc694?", "s": [{"i": 0, "t": "Ubot \uc571\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uba54\ub274\uc5d0\uc11c \uac00\uc785\ub41c \ubb34\ub8cc\u00b7\uc720\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\uc640 \uc6d4 \uc694\uae08, \uac00\uc785\uc77c\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "1544", "t": "\uc81c\uac00 \uac00\uc785\ud55c \ubd80\uac00\uc11c\ube44\uc2a4\ub97c \uc54c\ub824 \uc8fc\uc138\uc694.", "s": [{"i": 0, "t": "\ub85c\uadf8\uc778\ud558\uba74 \ud68c\uc6d0\ub2d8 \ud68c\uc120\uc5d0 \uac00\uc785\ub41c \ubd80\uac00\uc11c\ube44\uc2a4\uc640 \uac01 \uc11c\ube44\uc2a4\uc758 \uc6d4 \uc694\uae08, \uac00\uc785\uc77c\uc744 \uc870\ud68c\ud574 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}, {"id": "281", "t": "\uc5b4\ub5a4 \ud68c\uc120\uc5d0 \uc11c\ube44\uc2a4\uac00 \uac78\ub824 \uc788\ub294\uc9c0 \ubcf4\uace0 \uc2f6\uc5b4\uc694.", "s": [{"i": 0, "t": "\uc5b4\ub290 \ud68c\uc120\uc5d0 \ubd80\uac00\uc11c\ube44\uc2a4\uac00 \uac00\uc785\ub418\uc5b4 \uc788\ub294\uc9c0\ub294 \uc571\uc5d0\uc11c \ud68c\uc120\uc744 \uc120\ud0dd\ud574 \ud574\ub2f9 \ud68c\uc120\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \ubaa9\ub85d\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 1}]}, {"id": "683", "t": "\uc800 \ubaa8\ub974\uac8c \ub3c8 \ub098\uac00\ub294 \uc720\ub8cc \uc11c\ube44\uc2a4\uac00 \uc788\ub098\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0 \ud68c\uc120\uc5d0 \uac00\uc785\ub41c \ubd80\uac00\uc11c\ube44\uc2a4\ub97c \uc870\ud68c\ud574 \uc720\ub8cc \uc11c\ube44\uc2a4\uc640 \uae08\uc561\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}, {"i": 1, "t": "\ud544\uc694 \uc5c6\ub294 \uc720\ub8cc \ubd80\uac00\uc11c\ube44\uc2a4\ub294 \uc571\uc5d0\uc11c \ubc14\ub85c \ud574\uc9c0\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.", "y": 0}]}, {"id": "789", "t": "\uccad\uad6c\uc11c\uc5d0 \ubaa8\ub974\ub294 \uc11c\ube44\uc2a4 \uc774\ub984\uc774 \uc788\ub294\ub370 \uc81c\uac00 \uc5b8\uc81c \uac00\uc785\ud55c \uac74\uac00\uc694?", "s": [{"i": 0, "t": "\ud68c\uc6d0\uc758 \ubd80\uac00\uc11c\ube44\uc2a4 \uac00\uc785 \uc774\ub825\uc744 \uc870\ud68c\ud574 \uccad\uad6c\uc11c\uc5d0\uc11c \ubaa8\ub974\ub294 \uc11c\ube44\uc2a4\uc758 \uac00\uc785\uc77c\uacfc \uc6d4 \uc694\uae08\uc744 \uc548\ub0b4\ud574 \ub4dc\ub9bd\ub2c8\ub2e4.", "y": 1}]}]}, {"i
