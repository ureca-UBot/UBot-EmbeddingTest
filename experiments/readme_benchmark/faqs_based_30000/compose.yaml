name: ubot-faqs-based-dataset
services:
  dataset:
    image: ubot-retrieval-jina:run-v1
    command: [/work/scripts/run_pipeline.py]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,size=256m']
    environment:
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      PYTHONUNBUFFERED: '1'
    volumes:
      - .:/work:ro
      - ./data:/work/data:rw
      - ./outputs:/work/outputs:rw
      - hf-cache:/models/hf:ro
volumes:
  hf-cache:
    external: true
    name: ubot-retrieval-benchmark_hf-benchmark-cache
